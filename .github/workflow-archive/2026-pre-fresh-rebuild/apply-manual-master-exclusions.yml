name: Apply manual master exclusions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply and validate 34 human exclusions
        run: |
          set -euo pipefail
          python3 scripts/apply_manual_master_exclusions.py
          test "$(python3 - <<'PY'
          import csv
          with open('data/reference/salmon_evidence_map.csv', newline='', encoding='utf-8-sig') as f:
              print(sum(1 for _ in csv.DictReader(f)))
          PY
          )" -gt 0

      - name: Commit corrected master
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reference/salmon_evidence_map.csv data/reference/archive data/reference/manual_master_exclusions_2026-08-15.csv scripts/apply_manual_master_exclusions.py
          git commit -m "Apply 34 human adjudications to master"
          git push origin HEAD:main

      - name: Upload correction audit
        uses: actions/upload-artifact@v4
        with:
          name: master-manual-exclusion-audit
          path: |
            data/reference/archive/*pre_manual_exclusions.csv
            data/reference/archive/manual_exclusions_*.csv
            data/reference/manual_master_exclusions_2026-08-15.csv
