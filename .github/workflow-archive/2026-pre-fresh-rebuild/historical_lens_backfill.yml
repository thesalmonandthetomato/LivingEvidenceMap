name: One-off historical Lens JSON backfill

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Safety ceiling for records (normally leave at 50000)'
        required: true
        default: '50000'
        type: string

permissions:
  contents: read

jobs:
  historical-lens-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout historical backfill branch
        uses: actions/checkout@v4
        with:
          ref: updater-historical-lens-backfill

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Retrieve full historical Lens search as rich JSONL
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          python scripts/updater/lens_ingestion.py \
            --start-date '1900-01-01' \
            --end-date '2026-08-28' \
            --max-records '${{ inputs.max_records }}' \
            --output-dir outputs/updater/historical_lens_backfill

      - name: Validate backfill artefacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('outputs/updater/historical_lens_backfill')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['status']=='success'
          assert manifest['records_retrieved'] > 0
          assert manifest['records_unique'] > 0
          assert manifest['records_unique'] <= manifest['records_retrieved']

          n=0
          rich=0
          ids=set()
          for line_no,line in enumerate((root/'records.jsonl').open(encoding='utf-8'),1):
              if not line.strip():
                  continue
              row=json.loads(line)
              lid=row['identity']['lens_id']
              assert lid not in ids, f'duplicate lens_id at line {line_no}: {lid}'
              ids.add(lid)
              payload=row['lens']['raw_payload']
              assert isinstance(payload,dict) and payload.get('lens_id')==lid
              if len(payload.keys()) > 8:
                  rich += 1
              n += 1
          assert n==manifest['records_unique'], (n,manifest['records_unique'])
          assert rich > 0, 'No rich Lens payloads detected'
          raw=list((root/'raw').glob('response_*.json'))
          assert len(raw)==manifest['batches'], (len(raw),manifest['batches'])
          print(json.dumps({
              'records_jsonl':n,
              'lens_reported_total':manifest.get('lens_reported_total'),
              'batches':manifest['batches'],
              'records_with_more_than_8_payload_fields':rich,
              'raw_response_files':len(raw)
          },indent=2))
          PY

      - name: Write reconstruction README
        run: |
          cat > outputs/updater/historical_lens_backfill/README.txt <<'EOF'
          Historical Lens backfill for LivingEvidenceMap.

          This is a reconstruction source, not a replacement master dataset.
          records.jsonl contains the canonical wrappers with untouched Lens API payloads.
          raw/ contains the retained API response batches.
          manifest.json and checkpoint.json record retrieval provenance and restart state.

          The existing historical master remains authoritative for inclusion decisions and
          project annotations. Matching/backfilling into a rich JSON master is a separate,
          audited step and must not silently add or remove historical master records.
          EOF

      - name: Upload historical Lens reconstruction source
        uses: actions/upload-artifact@v4
        with:
          name: historical-lens-json-backfill-${{ github.run_id }}
          path: outputs/updater/historical_lens_backfill/
          if-no-files-found: error
          retention-days: 90
