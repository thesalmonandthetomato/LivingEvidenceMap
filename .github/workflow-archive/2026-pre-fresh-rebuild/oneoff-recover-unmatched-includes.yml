name: One-off recover unmatched INCLUDE Lens records

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Retrieve exact Lens records
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: python scripts/oneoff_recover_28_lens.py

      - name: Validate recovery outputs
        run: |
          python -c "import json; from pathlib import Path; p=Path('outputs/oneoff_final_master_28_recovery'); m=json.loads((p/'manifest.json').read_text()); assert m['exact_ids_requested']==28; assert m['canonical_modified'] is False; assert len([x for x in (p/'records.jsonl').read_text().splitlines() if x.strip()])==m['exact_ids_found']; print(f\"Recovered {m['exact_ids_found']}/28 exact Lens IDs; {m['exact_ids_missing']} missing\")"

      - name: Upload recovery artefact
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-final-master-28-lens-recovery-${{ github.run_id }}
          path: outputs/oneoff_final_master_28_recovery/
          if-no-files-found: error
          retention-days: 90
