name: One-off unmatched historical screening recovery audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FRESH_CANONICAL_BRANCH: canonical-fresh-2026-09-08-v1
  EXPECTED_CANONICAL_RECORDS: '20132'

jobs:
  unmatched-recovery-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout canonical rebuild branch with LFS
        uses: actions/checkout@v4
        with:
          ref: canonical-fresh-2026-09-08-v1
          fetch-depth: 0
          lfs: true
          path: canonical_store

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s data/master/current/living_evidence_map_master.csv
          test -s canonical_store/data/canonical/current/repair/records.jsonl
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('canonical_store/data/canonical/current/repair/records.jsonl')
          n=sum(1 for x in p.open(encoding='utf-8') if x.strip())
          assert n==int(os.environ['EXPECTED_CANONICAL_RECORDS']), n
          m=json.loads(Path('canonical_store/data/canonical/current/repair/manifest.json').read_text())
          assert m.get('pipeline_stage')=='publication_status_screened', m.get('pipeline_stage')
          print(f'PASS: {n} canonical records at publication_status_screened')
          PY

      - name: Run one-off unmatched recovery audit
        run: |
          python scripts/one_off_unmatched_historical_screening_recovery_audit.py \
            --master data/master/current/living_evidence_map_master.csv \
            --canonical canonical_store/data/canonical/current/repair/records.jsonl \
            --outdir outputs/one_off_unmatched_recovery

      - name: Validate audit outputs
        shell: python
        run: |
          import json
          from pathlib import Path
          s=json.loads(Path('outputs/one_off_unmatched_recovery/recovery_summary.json').read_text())
          assert s['status']=='audit_complete'
          assert s['master_rows']>0
          assert s['canonical_records']==20132
          assert s['initially_unmatched_nonambiguous']==s['recovered_matches']+s['new_ambiguous']+s['still_unmatched']
          print(json.dumps(s,indent=2))

      - name: Upload recovery audit
        uses: actions/upload-artifact@v4
        with:
          name: one-off-unmatched-historical-screening-recovery-${{ github.run_id }}
          path: outputs/one_off_unmatched_recovery/
          retention-days: 90
          if-no-files-found: error
