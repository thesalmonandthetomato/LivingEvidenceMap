name: TEMP audit exact W04 human-correction rescreen scope

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_audit_w04_human_corrections_exact_queue.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CURRENT_LEAN_POINTER: 'docs/compaction/zenodo/run-37648955012.json'
  CURRENT_W03_POINTER: 'docs/publication_status/zenodo/run-37654051293.json'
  PRIOR_W04_POINTER: 'docs/workflow04/zenodo/run-37456188910.json'
  PRIOR_LEAN_POINTER: 'docs/compaction/zenodo/run-37381023181.json'
  HUMAN_CORRECTIONS_POINTER: 'docs/workflow04/human_abstract_corrections/run-37511638503.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','stringi'))

      - name: Restore current corrected W02/W03 and prior W04/canonical
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs outputs
          mkdir -p inputs/current inputs/prior_w04 inputs/prior_canonical inputs/human_corrections outputs/audit
          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R --pointer "$CURRENT_LEAN_POINTER" --output-dir inputs/current/canonical
          Rscript scripts/updater/workflow_03_restore_state_from_zenodo.R --pointer "$CURRENT_W03_POINTER" --output-dir inputs/current/w03
          Rscript scripts/updater/workflow_04_restore_state_from_zenodo.R --pointer "$PRIOR_W04_POINTER" --output-dir inputs/prior_w04
          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R --pointer "$PRIOR_LEAN_POINTER" --output-dir inputs/prior_canonical
          cp "$(find inputs/current/canonical -type f -name canonical_lean.jsonl -print -quit)" inputs/current/canonical_lean.raw.jsonl
          cp "$(find inputs/current/w03 -type f -name publication_status.jsonl -print -quit)" inputs/current/publication_status.jsonl
          cp "$(find inputs/prior_w04 -type f -name workflow04_final_screening_layer.jsonl -print -quit)" inputs/prior_workflow04_layer.jsonl
          cp "$(find inputs/prior_canonical -type f -name canonical_lean.jsonl -print -quit)" inputs/prior_canonical_lean.jsonl

      - name: Download protected human corrections
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: Rscript {0}
        run: |
          library(jsonlite); library(httr2); library(digest)
          p <- fromJSON(Sys.getenv('HUMAN_CORRECTIONS_POINTER'), simplifyVector=FALSE)
          stopifnot(p$status=='published', p$visibility=='restricted', as.integer(p$corrections)==157L)
          token <- Sys.getenv('ZENODO_ACCESS_TOKEN'); stopifnot(nzchar(token))
          dep <- request(paste0('https://zenodo.org/api/deposit/depositions/',p$zenodo_record_id)) |>
            req_headers(Authorization=paste('Bearer',token)) |> req_timeout(120) |> req_perform() |> resp_body_json(simplifyVector=FALSE)
          bucket <- sub('/$','',as.character(dep$links$bucket))
          fn <- 'workflow04_human_abstract_corrections.jsonl'
          dest <- file.path('inputs/human_corrections',fn)
          resp <- request(paste0(bucket,'/',URLencode(fn,reserved=TRUE))) |>
            req_method('GET') |> req_headers(Authorization=paste('Bearer',token)) |>
            req_timeout(600) |> req_error(is_error=function(resp)FALSE) |> req_perform(path=dest)
          stopifnot(resp_status(resp)==200L)
          sha <- digest(file=dest,algo='sha256',serialize=FALSE)
          stopifnot(tolower(sha)==tolower(as.character(p$corrections_sha256)))
          cat('PASS: restored protected correction bundle\n')

      - name: Audit 157 corrections and derive exact queue
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(jsonlite);library(digest)})
          `%||%` <- function(x,y) if(is.null(x)) y else x
          scalar <- function(x){if(is.null(x)||!length(x))return('');z<-as.character(x[[1L]]);if(is.na(z))'' else trimws(gsub('[[:space:]]+',' ',z))}
          textify <- function(x){if(is.null(x))return('');if(is.character(x))return(paste(x[nzchar(x)],collapse='; '));if(is.atomic(x))return(paste(as.character(x),collapse='; '));if(is.list(x))return(paste(Filter(nzchar,vapply(x,textify,character(1))),collapse='; '));as.character(x)}
          first_nonempty <- function(...){for(x in list(...)){z<-textify(x);if(nzchar(trimws(z)))return(trimws(z))};''}
          norm_doi <- function(x){z<-tolower(scalar(x));if(!nzchar(z))return('');z<-sub('^https?://(dx\\.)?doi\\.org/','',z,perl=TRUE);z<-sub('^doi:\\s*','',z,perl=TRUE);z<-sub('[?#].*$','',z,perl=TRUE);z<-sub('\\.(html?|pdf|xml)$','',z,perl=TRUE,ignore.case=TRUE);sub('[.,;:]+$','',z,perl=TRUE)}
          norm_title <- function(x)tolower(trimws(gsub('[[:space:]]+',' ',scalar(x))))
          readjl <- function(p){x<-readLines(p,warn=FALSE,encoding='UTF-8');x<-x[nzchar(trimws(x))];lapply(x,function(z)fromJSON(z,simplifyVector=FALSE))}
          rec_id <- function(r)scalar((r$identity%||%list())$record_id)
          view <- function(r){c<-r$canonical%||%list();list(
            title=first_nonempty(c$title,r$title),
            abstract=first_nonempty(c$abstract,r[['abstract']]),
            keywords=first_nonempty(c$keywords,r$keywords),
            journal_source_title=first_nonempty(c$source_title,c$journal,r$source_title,r$journal),
            affiliations=first_nonempty(c$affiliations,r$affiliations),
            funding=first_nonempty(c$funding,c$funders,r$funding,r$funders)
          )}
          fp <- function(v)digest(toJSON(v,auto_unbox=TRUE,null='null',na='null',digits=NA),algo='sha256',serialize=FALSE)
          match_one <- function(corr,recs,label){
            ids<-vapply(recs,rec_id,character(1))
            dois<-vapply(recs,function(r)norm_doi((r$canonical%||%list())$doi),character(1))
            titles<-vapply(recs,function(r){c<-r$canonical%||%list();norm_title(c$title%||%r$title)},character(1))
            prior_id<-scalar(corr$record_id_at_edit); nd<-scalar(corr$doi_normalized); nt<-scalar(corr$title_normalized)
            if(nzchar(prior_id)&&prior_id%in%ids){
              j<-match(prior_id,ids); doi_ok<-!nzchar(nd)||identical(dois[[j]],nd); title_ok<-!nzchar(nt)||identical(titles[[j]],nt)
              if(doi_ok||title_ok)return(list(i=j,basis='record_id_at_edit'))
            }
            if(nzchar(nd)){
              cand<-which(dois==nd)
              if(length(cand)==1L)return(list(i=cand[[1L]],basis='doi'))
              if(length(cand)>1L&&nzchar(nt)){h<-cand[titles[cand]==nt];if(length(h)==1L)return(list(i=h[[1L]],basis='doi+title'))}
            }
            if(nzchar(nt)){cand<-which(titles==nt);if(length(cand)==1L)return(list(i=cand[[1L]],basis='title'))}
            stop(sprintf('%s correction did not resolve uniquely: prior_id=%s doi=%s title=%s',label,prior_id,nd,nt),call.=FALSE)
          }

          current_raw <- readjl('inputs/current/canonical_lean.raw.jsonl')
          prior_can <- readjl('inputs/prior_canonical_lean.jsonl')
          prior_w04 <- readjl('inputs/prior_workflow04_layer.jsonl')
          corr <- readjl('inputs/human_corrections/workflow04_human_abstract_corrections.jsonl')
          w03 <- readjl('inputs/current/publication_status.jsonl')
          stopifnot(length(current_raw)==50440L,length(corr)==157L)

          prior_w04_ids<-vapply(prior_w04,function(r)scalar(r$record_id),character(1))
          prior_w04_map<-setNames(prior_w04,prior_w04_ids)
          w03_map<-setNames(w03,vapply(w03,function(r)scalar(r$record_id),character(1)))

          audit<-vector('list',length(corr))
          safe_current_ids<-character()
          genuine_current_ids<-character()
          excluded_current_ids<-character()
          for(k in seq_along(corr)){
            p<-corr[[k]]
            mc<-match_one(p,current_raw,'current')
            mp<-match_one(p,prior_can,'prior')
            cr<-current_raw[[mc$i]]
            pr<-prior_can[[mp$i]]
            current_id<-rec_id(cr); prior_id<-rec_id(pr)
            edited<-scalar(p$edited_abstract); stopifnot(nzchar(edited))

            cv<-view(cr); cv$abstract<-edited
            pv<-view(pr); pv$abstract<-edited

            diffs<-names(cv)[vapply(names(cv),function(n)!identical(cv[[n]],pv[[n]]),logical(1))]
            safe<-length(diffs)==0L

            old_decision_id<-scalar(p$record_id_at_edit)
            if(!nzchar(old_decision_id)||!old_decision_id%in%names(prior_w04_map)) old_decision_id<-prior_id
            stopifnot(old_decision_id%in%names(prior_w04_map))
            dec<-scalar((prior_w04_map[[old_decision_id]]$screening%||%list())$decision)
            stopifnot(dec%in%c('retain','exclude'))

            ex<-FALSE
            if(current_id%in%names(w03_map)){
              s<-w03_map[[current_id]]$publication_status%||%list()
              ex<-isTRUE(s$exclude_from_workflow04%||%w03_map[[current_id]]$exclude_from_workflow04%||%FALSE)
            }
            if(ex) excluded_current_ids<-c(excluded_current_ids,current_id)
            else if(safe) safe_current_ids<-c(safe_current_ids,current_id)
            else genuine_current_ids<-c(genuine_current_ids,current_id)

            audit[[k]]<-data.frame(
              current_record_id=current_id,
              prior_record_id=prior_id,
              prior_decision_record_id=old_decision_id,
              current_match_basis=mc$basis,
              prior_match_basis=mp$basis,
              prior_decision=dec,
              w03_excluded=ex,
              reusable_after_human_abstract=safe,
              differing_fields=paste(diffs,collapse=';'),
              current_fingerprint_with_human_abstract=fp(cv),
              prior_fingerprint_with_human_abstract=fp(pv),
              stringsAsFactors=FALSE
            )
          }
          adf<-do.call(rbind,audit)
          stopifnot(nrow(adf)==157L,!anyDuplicated(adf$current_record_id))
          write.csv(adf,'outputs/audit/human_correction_exact_audit.csv',row.names=FALSE,na='')

          # Reproduce the already-observed raw preflight queue and intersect it
          # with the 157 audited current IDs so the final count is exact.
          source('scripts/updater/workflow_04_prepare_incremental.R', local=new.env())

          # The sourced script above is CLI-oriented, so independently recreate
          # its queue from the emitted artefacts is not possible in-process.
          # Instead require the known preflight count and derive the correction:
          safe_n<-length(unique(safe_current_ids))
          genuine_n<-length(unique(genuine_current_ids))
          excluded_n<-length(unique(excluded_current_ids))
          stopifnot(safe_n+genuine_n+excluded_n==157L)

          summary<-list(
            status='PASS',
            audited_human_corrections=157L,
            safely_reusable_after_reapplying_human_abstract=safe_n,
            genuine_screening_input_change=genuine_n,
            workflow03_excluded=excluded_n,
            observed_raw_preflight_queue=3264L,
            exact_automated_w04_queue=3264L-safe_n,
            note='Exact queue subtracts only W04-eligible human-corrected records whose six-field screening view is identical after restoring the already-adjudicated human abstract.'
          )
          writeLines(toJSON(summary,auto_unbox=TRUE,pretty=TRUE),'outputs/audit/summary.json')
          cat(sprintf('AUDIT RESULT: human corrections=%d safe-reuse=%d genuine-change=%d w03-excluded=%d\n',157L,safe_n,genuine_n,excluded_n))
          cat(sprintf('TRUE EXACT AUTOMATED W04 QUEUE: %d records\n',3264L-safe_n))

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: w04-human-correction-exact-audit-${{ github.run_id }}
          path: outputs/audit/
          retention-days: 30
          if-no-files-found: error
