name: TEMP W08b per-identifier restart and preflight tests
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_identifier_restart_test_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite","httr2"))'
      - name: Test per-Lens-ID, per-OpenAlex-ID, DOI history without provider calls
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("restart_test")
          d<-data.frame(seed_record_id=c("a","a","a","b","a"),
           provider=c("lens","lens","openalex","lens","lens"),
           identifier_type=c("lens","lens","openalex","lens","doi"),
           query_identifier=c("L1","L2","W3","L1","10.1/a"),
           stringsAsFactors=FALSE)
          write.csv(d,"restart_test/queries.csv",row.names=FALSE)
          writeLines(toJSON(list(record_id="a",lens_id="L1",provider="lens",status="complete",
            update_id="2026-11",reference_count=2L),auto_unbox=TRUE),
            "restart_test/lens_seed_status.jsonl")
          writeLines(toJSON(list(record_id="a",openalex_id="W3",provider="openalex",status="complete",
            update_id="2026-10",reference_count=3L),auto_unbox=TRUE),
            "restart_test/openalex_seed_status.jsonl")
          writeLines(toJSON(list(record_id="a",doi="10.1/a",provider="lens",status="complete",
            update_id="2026-11",lens_ids=list("L5","L6")),auto_unbox=TRUE),
            "restart_test/lens_doi_resolution.jsonl")
          status<-system2("Rscript",c("scripts/workflow08b/plan_identifier_checks.R",
            "restart_test/queries.csv","restart_test","2026-11","restart_test/plan"))
          stopifnot(status==0L)
          x<-read.csv("restart_test/plan/identifier_query_plan.csv",stringsAsFactors=FALSE)
          z<-fromJSON("restart_test/plan/summary.json")
          byid<-function(id)x[x$query_identifier==id,,drop=FALSE]
          stopifnot(nrow(x)==4L,z$seed_identifier_associations==5L,
            z$distinct_provider_queries==4L,z$already_checked_this_month==2L,
            !byid("L1")$check_required,
            byid("L2")$check_required,
            byid("W3")$check_required,byid("W3")$backward_retrieval_policy=="if_count_increases",
            !byid("10.1/a")$check_required,
            byid("L1")$associated_canonical_seeds==2L)
          cat("PASS: one completed ID does not block a second ID on same canonical seed; provider and DOI history respected\n")
