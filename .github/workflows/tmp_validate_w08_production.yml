name: Temporary - validate W08 production controller

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'user_input/w08_production_validation.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install parser dependency
        shell: Rscript {0}
        run: install.packages('yaml')

      - name: Validate controller and scripts
        shell: Rscript {0}
        run: |
          yaml::read_yaml('.github/workflows/workflow_08_production.yml')
          files <- c(
            'scripts/updater/workflow_08_build_review_queue_dynamic.R',
            'scripts/updater/workflow_08_reuse_decisions.R',
            'scripts/updater/workflow_08_migrate_legacy_geography_decisions.R',
            'scripts/updater/workflow_08_finalize_canonical_dynamic.R',
            'scripts/updater/workflow_08_partition_final_outputs_dynamic.R'
          )
          invisible(lapply(files,parse))
          txt <- paste(readLines('.github/workflows/workflow_08_production.yml',warn=FALSE),collapse='\n')
          stopifnot(!grepl('32292|32,292|19407|19,407|19117|19,117|13175|13,175',txt))
          stopifnot(grepl('Stop if new human review is required',txt,fixed=TRUE))
          cat('PASS: permanent W08 controller parses and remains population-dynamic\n')
