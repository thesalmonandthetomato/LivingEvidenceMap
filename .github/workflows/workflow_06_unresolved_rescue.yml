name: Workflow 06 - rescue unresolved geography

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '0 = all unresolved records; positive integer = development test'
        required: true
        default: '0'
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/workflow06/.run_unresolved_rescue'

permissions:
  contents: read
  actions: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      LIMIT_N: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("readr","dplyr","jsonlite","httr2","digest"))

      - name: Restore validated Workflow 06 state and recoveries
        uses: actions/download-artifact@v4
        with:
          name: workflow06-geography-production-36265092530
          path: inputs/w06
          run-id: 36265092530
          github-token: ${{ github.token }}

      - name: Restore first technical recovery
        uses: actions/download-artifact@v4
        with:
          name: workflow06-failure-recovery-36271055010
          path: inputs/w06rec1
          run-id: 36271055010
          github-token: ${{ github.token }}

      - name: Restore second technical recovery
        uses: actions/download-artifact@v4
        with:
          name: workflow06-failure-recovery-36271186232
          path: inputs/w06rec2
          run-id: 36271186232
          github-token: ${{ github.token }}

      - name: Run targeted unresolved rescue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/reporting/workflow06_rescue_unresolved.R             --input inputs/w06/geography_semantic_final.csv             --recovery1 inputs/w06rec1/workflow06_failure_recovery.csv             --recovery2 inputs/w06rec2/workflow06_failure_recovery.csv             --prompt config/workflow06_geography_semantic_prompt_v2.txt             --output-dir outputs/workflow06_unresolved_rescue             --limit "$LIMIT_N"

          test -s outputs/workflow06_unresolved_rescue/workflow06_unresolved_rescue.csv
          test -s outputs/workflow06_unresolved_rescue/workflow06_unresolved_residual_w08.csv
          test -s outputs/workflow06_unresolved_rescue/summary.json
          test -s outputs/workflow06_unresolved_rescue/WORKFLOW06_UNRESOLVED_RESCUE_PASS.ok

      - name: Upload rescue output
        uses: actions/upload-artifact@v4
        with:
          name: workflow06-unresolved-rescue-${{ github.run_id }}
          path: outputs/workflow06_unresolved_rescue/
          retention-days: 90
          if-no-files-found: error
