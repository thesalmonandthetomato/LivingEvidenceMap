name: W06 temporary validation
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w06-temporary-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest","readr","dplyr","tibble","stringr"))
      - name: Check configuration and dependencies
        shell: Rscript {0}
        run: |
          library(jsonlite)
          cfg <- fromJSON("user_input/workflow06_geography_prompt_config.json")
          stopifnot(file.exists(cfg$prompt_path))
          stopifnot(identical(digest::digest(file=cfg$prompt_path,algo="sha256",serialize=FALSE),cfg$expected_prompt_sha256))
          src <- readLines("scripts/reporting/workflow05_geography_semantic_production.R")
          stopifnot(any(grepl("workflow06_geography_prompt_config.json",src,fixed=TRUE)))
          for(f in c("scripts/updater/workflow_06_prepare_current_inputs.R","scripts/updater/workflow_06_prepare_incremental.R","scripts/updater/workflow_06_merge_incremental.R","scripts/reporting/workflow05_geography_semantic_production.R"))parse(file=f)
          cat("PASS: W06 prompt checksum and scripts\n")
      - name: Test incremental queues
        shell: Rscript {0}
        run: |
          library(readr)
          library(jsonlite)
          library(digest)
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w06")
          dir.create(t)
          current<-data.frame(record_sequence=1:3,record_id=c("same","changed","new"),title=c("Stable","Changed","New"),abstract=c("UK","Norway","Chile"),geography_input_sha256=c("sha-a","sha-b","sha-c"),deterministic_primary_countries=c("United Kingdom","Norway","Chile"),deterministic_primary_iso3c=c("GBR","NOR","CHL"),geography_review_required=c(FALSE,FALSE,FALSE),geography_review_reason=c("","",""))
          prior<-data.frame(record_id=c("same","changed"),geography_input_sha256=c("sha-a","old-sha"),geography_status=c("RESOLVED","RESOLVED"),primary_countries=c("United Kingdom","Sweden"),primary_iso3c=c("GBR","SWE"))
          write_csv(current,file.path(t,"current.csv"))
          write_csv(prior,file.path(t,"prior.csv"))
          cmd<-c("scripts/updater/workflow_06_prepare_incremental.R","--current",file.path(t,"current.csv"),"--prior-geography",file.path(t,"prior.csv"),"--output-dir",file.path(t,"prepared"))
          stopifnot(system2("Rscript",cmd)==0L)
          m<-fromJSON(file.path(t,"prepared/prepare_manifest.json"))
          cat(toJSON(m,auto_unbox=TRUE,pretty=TRUE),"\n")
