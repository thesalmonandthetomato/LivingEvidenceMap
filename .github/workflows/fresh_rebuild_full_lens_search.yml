name: Workflow 00 - Full Lens search

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
  FRESH_CANONICAL_BRANCH: canonical-fresh-2026-09-08-v1

jobs:
  full-lens-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout fresh canonical branch
        uses: actions/checkout@v4
        with:
          ref: canonical-fresh-2026-09-08-v1
          fetch-depth: 0
          lfs: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('jsonlite', 'httr2', 'digest'))

      - name: Load current R implementation and search config from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/updater/workflow_00_full_lens_search.R > /tmp/workflow_00_full_lens_search.R
          git show origin/main:config/lens_search.json > config/lens_search.json

      - name: Run complete Lens search and rebuild fresh canonical JSON
        shell: bash
        run: |
          set -euo pipefail
          Rscript /tmp/workflow_00_full_lens_search.R \
            --config config/lens_search.json \
            --output data/canonical/current/repair/records.jsonl \
            --manifest data/canonical/current/repair/manifest.json \
            --audit-dir fresh_rebuild

      - name: Persist fresh canonical search output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git add data/canonical/current/repair/records.jsonl data/canonical/current/repair/manifest.json config/lens_search.json
          git commit -m 'Rebuild canonical JSON from corrected Lens search in R'
          git lfs push origin "$FRESH_CANONICAL_BRANCH"
          git push origin HEAD:"$FRESH_CANONICAL_BRANCH"
          git log -1 --format='fresh_canonical_commit=%H'

      - name: Upload Workflow 00 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-00-full-lens-search-${{ github.run_id }}
          path: fresh_rebuild/
          retention-days: 90
          if-no-files-found: warn
