name: Temporary W00 RIS concept expansion verification
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_validate_manual_expansion_20261018.yml]
permissions:
  contents: read
jobs:
  validate-manual-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("httr2","jsonlite","digest"))'
      - name: Validate two new raw RIS Zenodo drafts without changing them
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for src in cab proquest; do
            case "$src" in
              cab) registry=user_input/workflow00_ris_cab_mariculture_2026-10-18.json ;;
              proquest) registry=user_input/workflow00_ris_proquest_mariculture_2026-10-18.json ;;
            esac
            Rscript scripts/updater/workflow_01_restore_manual_ris_from_zenodo.R --registry "$registry" --source "$src" --output "outputs/ris/$src/records.jsonl"
          done
          Rscript -e 'stopifnot(length(readLines("outputs/ris/cab/records.jsonl"))==41L,length(readLines("outputs/ris/proquest/records.jsonl"))==5L)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w00-manual-expansion-verification
          path: outputs/ris/
          retention-days: 7
