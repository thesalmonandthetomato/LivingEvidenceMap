name: Temporary W04 combined restore validation
on:
  push:
    paths:
      - '.github/workflows/w04-combined-restore-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Check adapter parses
        run: Rscript -e 'parse(file="scripts/updater/workflow_04_restore_shiny_combined.R")'
      - name: Check combined input adapter is isolated
        shell: bash
        run: |
          grep -q 'lem-w04-combined-restoration-v1' scripts/updater/workflow_04_restore_shiny_combined.R
          grep -q 'batch_membership_sha256' scripts/updater/workflow_04_restore_shiny_combined.R
          test -f scripts/updater/workflow_04_restore_shiny_subset.R
          test -f scripts/updater/workflow_04_publish_shiny_model_batch.R
