name: Temporary shared Zenodo configuration regression
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/temporary-zenodo-shared-config.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install jsonlite
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Validate W00 through W08 archivers
        shell: Rscript {0}
        run: |
          library(jsonlite)
          cfg <- fromJSON("user_input/zenodo_config.json",simplifyVector=FALSE)
          stopifnot(identical(cfg$creators[[1]]$name,"Haddaway, Neal"))
          stopifnot(identical(cfg$access_right,"restricted"))
          files <- c(
            "workflow_00_archive_to_zenodo.R",
            "workflow_01_archive_delta_to_zenodo.R",
            sprintf("workflow_%02d_archive_state_to_zenodo.R",2:7),
            "workflow_08_archive_to_zenodo.R")
          for(f in file.path("scripts/updater",files)){
            parse(file=f)
            x <- paste(readLines(f,warn=FALSE),collapse="\n")
            stopifnot(grepl('fromJSON("user_input/zenodo_config.json"',x,fixed=TRUE))
            stopifnot(grepl("creators=zenodo_creators",gsub(" ","",x,fixed=TRUE),fixed=TRUE))
            stopifnot(grepl("access_right=zenodo_access_right",gsub(" ","",x,fixed=TRUE),fixed=TRUE))
            stopifnot(!grepl('name="Haddaway, Neal"',gsub(" ","",x,fixed=TRUE),fixed=TRUE))
            cat("PASS:",f,"\n")
          }
          review <- fromJSON("user_input/workflow08_human_review_config.json",simplifyVector=FALSE)
          stopifnot(is.null(review$zenodo_creators))
          cat("PASS: single shared metadata configuration for nine workflow archivers\n")
