name: TEMP W08b candidate workflow and empty-provider contract
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_candidate_workflow_contract_20261031.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("yaml","jsonlite"))'
      - name: Validate candidate-stage fail-closed inputs and downstream handoff
        shell: Rscript {0}
        run: |
          library(yaml)
          p<-".github/workflows/workflow08b_monthly_candidates.yml"
          d<-yaml.load_file(p)
          stopifnot(is.list(d$jobs$bibliography),
            identical(d$permissions$contents,"read"),
            identical(d$permissions$actions,"write"))
          txt<-readLines(p,warn=FALSE)
          must<-c("workflow_dispatch:","execute_bibliography:",
            "discovery_checkpoint_zenodo_id:","provider_discovery_complete",
            "w08_canonical_sha256","filter_existing_w01.R",
            "prepare_new_candidates.R","max_novel_provider_ids:",
            "lens_species_not_farming_ids.R","harvest_openalex_eligible.R",
            "w08b_bibliography_to_w01.R","workflow08b_lightweight_dedup.yml")
          stopifnot(all(vapply(must,function(x)any(grepl(x,txt,fixed=TRUE)),logical(1))),
            !any(grepl("^  push:|^  schedule:",txt)))
          scripts<-c("prepare_new_candidates.R","filter_existing_w01.R",
            "w08b_bibliography_to_w01.R","lens_species_not_farming_ids.R",
            "harvest_openalex_eligible.R","deduplicate_citations.R")
          for(s in scripts)stopifnot(is.expression(parse(file=file.path("scripts/workflow08b",s))))
          bib<-readLines("scripts/workflow08b/w08b_bibliography_to_w01.R")
          stopifnot(any(grepl("file.create(pathlens)",bib,fixed=TRUE)),
                    any(grepl("file.create(pathoa)",bib,fixed=TRUE)))
          for(w in c("workflow08b_lightweight_dedup.yml",
                     "workflow08b_w01_handoff.yml","workflow08b_canonical_to_w02.yml")){
            z<-readLines(file.path(".github/workflows",w))
            stopifnot(any(grepl("test -f",z,fixed=TRUE)))
          }
          cat("PASS: candidate pipeline, NOT filters, W01 identity guard, zero-source and safe dispatch contract\n")
