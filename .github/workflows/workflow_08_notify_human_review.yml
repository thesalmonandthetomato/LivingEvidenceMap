name: Workflow 08 - notify human adjudication

on:
  workflow_dispatch:
    inputs:
      intake_run_id:
        description: Passed Workflow 08 intake run
        required: true
        default: '36316071774'
      expected_queue_sha256:
        description: Locked Workflow 08 review queue SHA-256
        required: true
        default: 'a8f3203c7cfc252dc53d08cd850cbbb5c3c48b8270cebe8a87eedb1af41e5c16'
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'docs/workflow08/.run_notify_review'

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      INTAKE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.intake_run_id || '36316071774' }}
      EXPECTED_QUEUE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_queue_sha256 || 'a8f3203c7cfc252dc53d08cd850cbbb5c3c48b8270cebe8a87eedb1af41e5c16' }}

    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("digest","jsonlite"))

      - name: Restore locked W08 intake
        uses: actions/download-artifact@v4
        with:
          name: workflow08-review-intake-${{ env.INTAKE_RUN_ID }}
          path: inputs/intake
          run-id: ${{ env.INTAKE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate locked intake identity
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)
          q <- "inputs/intake/workflow08_intake/workflow08_review_queue.jsonl"
          m <- fromJSON("inputs/intake/workflow08_intake/workflow08_review_queue_manifest.json")
          stopifnot(file.exists(q), identical(as.character(m$queue_sha256), Sys.getenv("EXPECTED_QUEUE_SHA")))
          stopifnot(identical(digest(file=q,algo="sha256",serialize=FALSE),Sys.getenv("EXPECTED_QUEUE_SHA")))
          stopifnot(m$unique_records_pending_human_review==797L,m$total_pending_issues==811L)
          cat("PASS: locked W08 intake verified\n")

      - name: Build ChatGPT human-review package
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_08_build_review_package.R             --queue inputs/intake/workflow08_intake/workflow08_review_queue.jsonl             --manifest inputs/intake/workflow08_intake/workflow08_review_queue_manifest.json             --output-dir outputs/workflow08_review_package             --intake-run-id "$INTAKE_RUN_ID"             --notification-run-id "$GITHUB_RUN_ID"             --repository "$GITHUB_REPOSITORY"             --branch workflow01-final-architecture

          test -s outputs/workflow08_review_package/CHATGPT_HANDOFF.md
          test -s outputs/workflow08_review_package/workflow08_review_queue.jsonl
          test -s outputs/workflow08_review_package/review_manifest.json

      - name: Upload human-review package
        id: upload_review
        uses: actions/upload-artifact@v4
        with:
          name: workflow08-human-review-package-${{ github.run_id }}
          path: outputs/workflow08_review_package/
          retention-days: 90
          if-no-files-found: error

      - name: Build notification email payload
        env:
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_08_build_email_payload.R             --manifest outputs/workflow08_review_package/review_manifest.json             --artifact-url '${{ steps.upload_review.outputs.artifact-url }}'             --workflow-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'             --output outputs/workflow08_review_package/email_payload.json

      - name: Email Workflow 08 review notification
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_send_review_email.R             --payload outputs/workflow08_review_package/email_payload.json
