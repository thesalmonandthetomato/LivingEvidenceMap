name: Workflow 04 - Relevance screening calibration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Workflow 04 mode'
        required: true
        default: validation_200
        type: choice
        options:
          - validation_200
          - production_queue
      canonical_branch:
        description: 'Canonical branch'
        required: true
        default: canonical-fresh-dedup-v2-2026-09-14
        type: string
      model:
        description: 'OpenAI model'
        required: true
        default: gpt-5.6-luna
        type: string

permissions:
  contents: write

jobs:
  workflow04:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FRESH_CANONICAL_BRANCH: ${{ inputs.canonical_branch }}
      OPENAI_RELEVANCE_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout main orchestration branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('httr2','jsonlite','stringi','digest'))

      - name: Validate R implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_04_relevance_screening.R')
          cat('PASS: Workflow 04 R implementation parses successfully\n')

      - name: Checkout reconciled canonical JSON with LFS
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FRESH_CANONICAL_BRANCH }}
          path: canonical_store
          lfs: true
          fetch-depth: 0

      - name: Validate canonical input
        shell: Rscript {0}
        run: |
          library(jsonlite)
          `%||%` <- function(x,y) if (is.null(x)) y else x
          rp <- 'canonical_store/data/canonical/current/repair/records.jsonl'
          mp <- 'canonical_store/data/canonical/current/repair/manifest.json'
          stopifnot(file.exists(rp),file.exists(mp))
          m <- fromJSON(mp,simplifyVector=FALSE)
          stopifnot(identical(m$pipeline_stage,'historical_screening_reconciled'))
          x <- readLines(rp,warn=FALSE,encoding='UTF-8')
          x <- x[nzchar(trimws(x))]
          stopifnot(length(x)==23809L)
          ids <- character(length(x))
          for(i in seq_along(x)) {
            r <- fromJSON(x[[i]],simplifyVector=FALSE)
            ids[[i]] <- as.character((r$identity %||% list())$lens_id %||% '')
          }
          stopifnot(all(nzchar(ids)),!anyDuplicated(ids))
          cat('PASS: 23809 historical-screening-reconciled records available to Workflow 04\n')

      - name: Build random 200-record historical validation sample
        if: ${{ inputs.mode == 'validation_200' }}
        shell: Rscript {0}
        env:
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          `%||%` <- function(x,y) if (is.null(x)) y else x
          read_jsonl <- function(path) {
            z <- readLines(path,warn=FALSE,encoding='UTF-8')
            z <- z[nzchar(trimws(z))]
            lapply(z,function(v)fromJSON(v,simplifyVector=FALSE))
          }
          write_jsonl <- function(rows,path) {
            dir.create(dirname(path),recursive=TRUE,showWarnings=FALSE)
            con <- file(path,'wt',encoding='UTF-8'); on.exit(close(con))
            for(r in rows) writeLines(toJSON(r,auto_unbox=TRUE,null='null',na='null',digits=NA),con)
          }
          records <- read_jsonl('canonical_store/data/canonical/current/repair/records.jsonl')
          eligible <- which(vapply(records,function(r) {
            s <- r$screening %||% list()
            d <- r$deduplication %||% list()
            n <- r$notices %||% NULL
            publication_ok <- is.null(n) || isTRUE(n$record_downstream_eligible %||% n$downstream_eligible %||% TRUE)
            as.character(d$status %||% '') %in% c('unique','canonical') &&
              as.character(s$decision %||% '') %in% c('include','exclude') &&
              publication_ok
          },logical(1)))
          if(length(eligible)<200L) stop('Fewer than 200 historically decided eligible records are available')
          run_id <- Sys.getenv('VALIDATION_RUN_ID')
          seed <- as.integer((as.numeric(run_id) %% 2147483646) + 1)
          set.seed(seed)
          chosen <- sample(eligible,200L,replace=FALSE)
          sample_rows <- records[chosen]
          labels <- vector('list',length(sample_rows))
          blinded <- vector('list',length(sample_rows))
          for(i in seq_along(sample_rows)) {
            r <- sample_rows[[i]]
            truth_raw <- as.character((r$screening %||% list())$decision %||% '')
            truth <- if(truth_raw=='include') 'retain' else if(truth_raw=='exclude') 'exclude' else stop('Unexpected historical decision')
            labels[[i]] <- list(
              lens_id=as.character(r$identity$lens_id),
              historical_decision=truth,
              historical_decision_raw=truth_raw
            )
            b <- r
            b$screening <- list(
              workflow='04_validation_blinded_sample',
              status='not_previously_screened',
              requires_screening=TRUE,
              publication_status_eligible=TRUE,
              downstream_eligible=FALSE
            )
            blinded[[i]] <- b
          }
          root <- 'outputs/workflow04_validation'
          dir.create(root,recursive=TRUE,showWarnings=FALSE)
          write_jsonl(blinded,file.path(root,'validation_queue_200.jsonl'))
          write_jsonl(labels,file.path(root,'validation_truth_200.jsonl'))
          writeLines(vapply(labels,function(x)x$lens_id,character(1)),file.path(root,'sample_lens_ids.txt'))
          manifest <- list(
            workflow='04_relevance_screening',
            purpose='prompt_calibration_against_historical_decisions',
            validation_run_id=run_id,
            sample_size=200L,
            sample_seed=seed,
            sampling_frame_records=length(eligible),
            sampling_method='simple_random_sample_without_replacement',
            truth_blinded_from_model=TRUE,
            canonical_branch=Sys.getenv('FRESH_CANONICAL_BRANCH'),
            canonical_commit=system('git -C canonical_store rev-parse HEAD',intern=TRUE),
            created_at=format(Sys.time(),tz='UTC',format='%Y-%m-%dT%H:%M:%SZ')
          )
          writeLines(toJSON(manifest,auto_unbox=TRUE,pretty=TRUE,null='null'),file.path(root,'sample_manifest.json'))
          cat(toJSON(manifest,auto_unbox=TRUE,pretty=TRUE,null='null'),'\n')

      - name: Copy production queue
        if: ${{ inputs.mode == 'production_queue' }}
        run: |
          mkdir -p outputs/workflow04_production
          cp canonical_store/data/canonical/current/repair/new_screening_queue.jsonl outputs/workflow04_production/production_queue.jsonl

      - name: Run R relevance screening
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "validation_200" ]; then
            ROOT=outputs/workflow04_validation
            QUEUE="$ROOT/validation_queue_200.jsonl"
          else
            ROOT=outputs/workflow04_production
            QUEUE="$ROOT/production_queue.jsonl"
          fi
          Rscript scripts/updater/workflow_04_relevance_screening.R \
            --input canonical_store/data/canonical/current/repair/records.jsonl \
            --queue "$QUEUE" \
            --output "$ROOT/screening_results.jsonl" \
            --checkpoint "$ROOT/checkpoint.json" \
            --summary "$ROOT/screening_summary.json" \
            --model "${{ inputs.model }}" \
            --checkpoint-every 25 \
            --mode openai

      - name: Calculate validation agreement and Cohen kappa
        if: ${{ inputs.mode == 'validation_200' }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          `%||%` <- function(x,y) if (is.null(x)) y else x
          read_jsonl <- function(path) {
            z <- readLines(path,warn=FALSE,encoding='UTF-8')
            z <- z[nzchar(trimws(z))]
            lapply(z,function(v)fromJSON(v,simplifyVector=FALSE))
          }
          root <- 'outputs/workflow04_validation'
          truth <- read_jsonl(file.path(root,'validation_truth_200.jsonl'))
          pred <- read_jsonl(file.path(root,'screening_results.jsonl'))
          stopifnot(length(truth)==200L,length(pred)==200L)
          tmap <- setNames(vapply(truth,function(x)as.character(x$historical_decision),character(1)),
                           vapply(truth,function(x)as.character(x$lens_id),character(1)))
          pmap <- setNames(vapply(pred,function(x)as.character(x$decision),character(1)),
                           vapply(pred,function(x)as.character(x$lens_id),character(1)))
          stopifnot(setequal(names(tmap),names(pmap)))
          ids <- names(tmap)
          levels <- c('retain','exclude','uncertain')
          tv <- factor(unname(tmap[ids]),levels=levels)
          pv <- factor(unname(pmap[ids]),levels=levels)
          tab <- table(historical=tv,model=pv)
          n <- length(ids)
          po <- sum(diag(tab))/n
          pe <- sum((rowSums(tab)/n)*(colSums(tab)/n))
          kappa <- if(pe==1) NA_real_ else (po-pe)/(1-pe)
          hist_retain <- sum(tv=='retain')
          hist_exclude <- sum(tv=='exclude')
          metrics <- list(
            n=n,
            observed_agreement=po,
            cohens_kappa=kappa,
            historical_retain=hist_retain,
            historical_exclude=hist_exclude,
            model_retain=sum(pv=='retain'),
            model_exclude=sum(pv=='exclude'),
            model_uncertain=sum(pv=='uncertain'),
            retain_retain=sum(tv=='retain' & pv=='retain'),
            retain_exclude_false_exclusion=sum(tv=='retain' & pv=='exclude'),
            retain_uncertain=sum(tv=='retain' & pv=='uncertain'),
            exclude_exclude=sum(tv=='exclude' & pv=='exclude'),
            exclude_retain_false_retention=sum(tv=='exclude' & pv=='retain'),
            exclude_uncertain=sum(tv=='exclude' & pv=='uncertain'),
            sensitivity_retain=if(hist_retain) sum(tv=='retain' & pv=='retain')/hist_retain else NA_real_,
            specificity_exclude=if(hist_exclude) sum(tv=='exclude' & pv=='exclude')/hist_exclude else NA_real_,
            false_exclusion_rate=if(hist_retain) sum(tv=='retain' & pv=='exclude')/hist_retain else NA_real_,
            false_retention_rate=if(hist_exclude) sum(tv=='exclude' & pv=='retain')/hist_exclude else NA_real_,
            uncertain_rate=sum(pv=='uncertain')/n,
            conflicts=sum(tv!=pv)
          )
          scr <- fromJSON(file.path(root,'screening_summary.json'),simplifyVector=FALSE)
          manifest <- fromJSON(file.path(root,'sample_manifest.json'),simplifyVector=FALSE)
          metrics$prompt_version <- scr$prompt_version
          metrics$prompt_sha256 <- scr$prompt_sha256
          metrics$model <- scr$model
          metrics$validation_run_id <- manifest$validation_run_id
          metrics$sample_seed <- manifest$sample_seed
          metrics$canonical_commit <- manifest$canonical_commit
          metrics$confusion_matrix <- unclass(tab)
          writeLines(toJSON(metrics,auto_unbox=TRUE,pretty=TRUE,null='null',na='null'),file.path(root,'validation_metrics.json'))

          records <- read_jsonl('canonical_store/data/canonical/current/repair/records.jsonl')
          byid <- setNames(records,vapply(records,function(r)as.character(r$identity$lens_id),character(1)))
          bypred <- setNames(pred,vapply(pred,function(r)as.character(r$lens_id),character(1)))
          con <- file(file.path(root,'conflicts.csv'),'wt',encoding='UTF-8')
          writeLines('lens_id,historical_decision,model_decision,title,abstract,model_reason',con)
          csvq <- function(x) paste0('"',gsub('"','""',as.character(x %||% ''),fixed=TRUE),'"')
          for(id in ids[tv!=pv]) {
            r <- byid[[id]]; p <- bypred[[id]]
            can <- r$canonical %||% list(); raw <- (r$lens %||% list())$raw_payload %||% list()
            vals <- c(id,tmap[[id]],pmap[[id]],can$title %||% raw$title %||% '',can$abstract %||% raw$abstract %||% '',p$reason %||% '')
            writeLines(paste(vapply(vals,csvq,character(1)),collapse=','),con)
          }
          close(con)

          con <- file(file.path(root,'sample_decisions.csv'),'wt',encoding='UTF-8')
          writeLines('lens_id,historical_decision,model_decision,agreement',con)
          for(id in ids) {
            vals <- c(id,tmap[[id]],pmap[[id]],if(tmap[[id]]==pmap[[id]]) '1' else '0')
            writeLines(paste(vals,collapse=','),con)
          }
          close(con)
          cat(toJSON(metrics,auto_unbox=TRUE,pretty=TRUE,null='null',na='null'),'\n')

      - name: Save exact prompt text
        if: ${{ inputs.mode == 'validation_200' }}
        shell: Rscript {0}
        run: |
          source_file <- readLines('scripts/updater/workflow_04_relevance_screening.R',warn=FALSE,encoding='UTF-8')
          start <- grep('^SYSTEM_PROMPT <- paste\\($',source_file)
          stop <- grep('^PROMPT_VERSION <- ',source_file)
          stopifnot(length(start)==1L,length(stop)==1L,stop>start)
          writeLines(source_file[start:(stop-1L)],'outputs/workflow04_validation/prompt_R_source.txt')

      - name: Persist validation run record
        if: ${{ inputs.mode == 'validation_200' }}
        run: |
          set -euo pipefail
          DEST="data/adjudication/workflow04_validation_runs/${{ github.run_id }}"
          mkdir -p "$DEST"
          cp outputs/workflow04_validation/sample_manifest.json "$DEST/"
          cp outputs/workflow04_validation/validation_metrics.json "$DEST/"
          cp outputs/workflow04_validation/sample_lens_ids.txt "$DEST/"
          cp outputs/workflow04_validation/sample_decisions.csv "$DEST/"
          cp outputs/workflow04_validation/conflicts.csv "$DEST/"
          cp outputs/workflow04_validation/prompt_R_source.txt "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Record Workflow 04 validation run ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Workflow 04 validation artefacts
        if: ${{ inputs.mode == 'validation_200' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-validation-200-${{ github.run_id }}
          path: outputs/workflow04_validation/
          retention-days: 90
          if-no-files-found: error

      - name: Upload Workflow 04 production artefacts
        if: ${{ inputs.mode == 'production_queue' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-production-${{ github.run_id }}
          path: outputs/workflow04_production/
          retention-days: 90
          if-no-files-found: error
