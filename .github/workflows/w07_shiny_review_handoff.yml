name: W07 Shiny reviewed subset handoff
run-name: W07 reviewed ${{ inputs.review_id }} run ${{ inputs.source_run_id }} sha ${{ inputs.archive_sha256 }}
on:
  workflow_dispatch:
    inputs:
      review_id:
        type: string
        required: true
      source_run_id:
        type: string
        required: true
      config_deposit_id:
        type: string
        required: true
      archive_filename:
        type: string
        required: true
      archive_sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify-reviewed-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install isolated handoff dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Verify archived human-reviewed trial without paid inference
        shell: Rscript {0}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          W07_REVIEW_ID: ${{ inputs.review_id }}
          W07_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          W07_CONFIG_DEPOSIT_ID: ${{ inputs.config_deposit_id }}
          W07_ARCHIVE_FILENAME: ${{ inputs.archive_filename }}
          W07_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: source("shiny_w07/scripts/w07_shiny_review_handoff.R")
      - uses: actions/upload-artifact@v4
        with:
          name: w07-reviewed-subset-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/w07-reviewed-handoff/
          retention-days: 90
          if-no-files-found: error
