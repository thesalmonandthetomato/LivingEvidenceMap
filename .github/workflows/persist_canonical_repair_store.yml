name: Persist canonical repair store

on:
  push:
    branches:
      - canonical-repair-store
    paths:
      - .github/workflows/persist_canonical_repair_store.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist-canonical-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          fetch-depth: 0
          lfs: true

      - name: Configure Git LFS
        run: |
          set -euo pipefail
          git lfs install
          git lfs track 'data/canonical/**/*.jsonl'
          git add .gitattributes

      - name: Download validated repair artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p repair_work/01 repair_work/02
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9711167560/zip" \
            -o repair_work/01.zip
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9718474490/zip" \
            -o repair_work/02.zip
          unzip -q repair_work/01.zip -d repair_work/01
          unzip -q repair_work/02.zip -d repair_work/02

      - name: Build archived repair states and current canonical corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import hashlib
          import json
          import shutil
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('data/canonical')
          a1 = root / 'archive/repair/01_abstract_enrichment'
          a2 = root / 'archive/repair/02_retry_ellipsis_repair'
          a3 = root / 'archive/repair/03_metadata_repairs'
          a4 = root / 'archive/repair/04_human_screening_adjudication'
          cur = root / 'current/repair'
          for d in (a1, a2, a3, a4, cur):
              d.mkdir(parents=True, exist_ok=True)

          src1 = Path('repair_work/01')
          src2 = Path('repair_work/02')

          def count_jsonl(path):
              n = 0
              with path.open('r', encoding='utf-8') as f:
                  for line in f:
                      if line.strip():
                          json.loads(line)
                          n += 1
              return n

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def write_manifest(directory, stage, source_artifact, source_run, records_path, notes):
              manifest = {
                  'schema': 'living_evidence_map_canonical_jsonl',
                  'schema_version': 1,
                  'stage': stage,
                  'created_at': datetime.now(timezone.utc).isoformat(),
                  'record_count': count_jsonl(records_path),
                  'records_sha256': sha256(records_path),
                  'source_artifact_id': source_artifact,
                  'source_workflow_run_id': source_run,
                  'notes': notes,
              }
              assert manifest['record_count'] == 21851
              (directory / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          # Stage 01: validated full-corpus abstract-enrichment state.
          shutil.copy2(src1 / 'records_for_deduplication.jsonl', a1 / 'records.jsonl')
          for name in ('abstract_enrichment_audit.jsonl', 'full_corpus_summary.json', 'report.json'):
              if (src1 / name).exists():
                  shutil.copy2(src1 / name, a1 / name)
          write_manifest(
              a1, '01_abstract_enrichment', 9711167560, None, a1 / 'records.jsonl',
              'Validated full-corpus Workflow 01B state before retry patch and ellipsis repair.'
          )

          # Stage 02: validated production state after retry patch + ellipsis repair.
          shutil.copy2(src2 / 'records_for_deduplication.jsonl', a2 / 'records.jsonl')
          for name in (
              'abstract_enrichment_audit.jsonl',
              'ellipsis_abstract_repair_audit.jsonl',
              'ellipsis_abstract_repair_summary.json',
              'full_corpus_summary.json',
              'report.json',
          ):
              if (src2 / name).exists():
                  shutil.copy2(src2 / name, a2 / name)
          write_manifest(
              a2, '02_retry_ellipsis_repair', 9718474490, 33264142800, a2 / 'records.jsonl',
              'Validated Workflow 01B production output after retry patch and exact-DOI ellipsis repair.'
          )

          # Stage 03: human-verified parent-article metadata repair.
          target_lens_id = '023-156-696-663-49X'
          corrected_title = 'Molecular and epigenetic responses to crowding stress in rainbow trout (Oncorhynchus mykiss) skeletal muscle'
          corrected_doi = '10.3389/fendo.2025.1571111'
          old_title_expected = 'Table 1.xlsx'
          old_doi_expected = '10.3389/fendo.2025.1571111.s001'
          source_records = a2 / 'records.jsonl'
          repaired_records = a3 / 'records.jsonl'
          found = 0
          with source_records.open('r', encoding='utf-8') as inp, repaired_records.open('w', encoding='utf-8') as out:
              for line in inp:
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if row.get('identity', {}).get('lens_id') == target_lens_id:
                      found += 1
                      assert row['canonical']['title'] == old_title_expected
                      assert row['canonical']['doi'] == old_doi_expected
                      raw_before = copy.deepcopy(row['lens']['raw_payload'])
                      row['canonical']['title'] = corrected_title
                      row['canonical']['doi'] = corrected_doi
                      assert row['lens']['raw_payload'] == raw_before
                  out.write(json.dumps(row, ensure_ascii=True, separators=(',', ':')) + '\n')
          assert found == 1, found

          metadata_audit = {
              'lens_id': target_lens_id,
              'repair_type': 'parent_article_metadata',
              'fields_changed': {
                  'canonical.title': {'from': old_title_expected, 'to': corrected_title},
                  'canonical.doi': {'from': old_doi_expected, 'to': corrected_doi},
              },
              'raw_payload_changed': False,
              'evidence': {
                  'pmcid': 'PMC12040688',
                  'pmid': '40309435',
                  'source_url': 'https://pmc.ncbi.nlm.nih.gov/articles/PMC12040688/'
              },
              'reason': 'Lens indexed a supplementary component while carrying the parent article abstract; canonical metadata was mapped to the independently verified parent article.',
          }
          (a3 / 'metadata_repair_audit.jsonl').write_text(json.dumps(metadata_audit, ensure_ascii=True) + '\n', encoding='utf-8')
          write_manifest(
              a3, '03_metadata_repairs', 9718474490, 33264142800, repaired_records,
              'Workflow 01B production output plus human-verified canonical title/DOI repair for Lens ID 023-156-696-663-49X.'
          )

          # Stage 04: human relevance-screening adjudications from Workflow 04 validation.
          decision_path = root / 'adjudication/workflow04_fresh_200_human_decisions.json'
          ledger = json.loads(decision_path.read_text(encoding='utf-8'))
          assert ledger['schema'] == 'living_evidence_map_human_screening_adjudication'
          assert ledger['adjudication_set'] == 'workflow04_fresh_200'
          assert ledger['record_count'] == 54
          decisions = ledger['decisions']
          assert len(decisions) == 54
          assert len({d['lens_id'] for d in decisions}) == 54
          counts = Counter(d['human_decision'] for d in decisions)
          assert counts == Counter({'RETAIN': 44, 'EXCLUDE': 10}), counts
          assert set(counts) <= {'RETAIN', 'EXCLUDE'}
          decision_map = {d['lens_id']: d for d in decisions}

          screening_records = a4 / 'records.jsonl'
          seen = set()
          changed = 0
          with repaired_records.open('r', encoding='utf-8') as inp, screening_records.open('w', encoding='utf-8') as out:
              for line in inp:
                  if not line.strip():
                      continue
                  before = json.loads(line)
                  row = copy.deepcopy(before)
                  lens_id = row.get('identity', {}).get('lens_id')
                  if lens_id in decision_map:
                      seen.add(lens_id)
                      d = decision_map[lens_id]
                      raw_before = copy.deepcopy(row.get('lens', {}).get('raw_payload'))
                      screening = row.setdefault('screening', {})
                      assert isinstance(screening, dict)
                      assert 'relevance' not in screening
                      screening['relevance'] = {
                          'decision': d['human_decision'],
                          'decision_source': 'human_adjudication',
                          'adjudication_set': ledger['adjudication_set'],
                          'adjudication_date': ledger['adjudication_date'],
                      }
                      assert row.get('lens', {}).get('raw_payload') == raw_before
                      test = copy.deepcopy(row)
                      test_screening = test.get('screening', {})
                      test_screening.pop('relevance', None)
                      if not test_screening:
                          test.pop('screening', None)
                      assert test == before
                      changed += 1
                  else:
                      assert row == before
                  out.write(json.dumps(row, ensure_ascii=True, separators=(',', ':')) + '\n')

          assert seen == set(decision_map), (len(seen), len(decision_map), sorted(set(decision_map) - seen))
          assert changed == 54
          assert count_jsonl(screening_records) == 21851

          with (a4 / 'screening_adjudication_audit.jsonl').open('w', encoding='utf-8') as f:
              for d in decisions:
                  audit = {
                      'index': d['index'],
                      'lens_id': d['lens_id'],
                      'human_decision': d['human_decision'],
                      'decision_source': 'human_adjudication',
                      'adjudication_set': ledger['adjudication_set'],
                      'adjudication_date': ledger['adjudication_date'],
                      'source_workflow_run_id': ledger['source_workflow_run_id'],
                      'source_artifact_id': ledger['source_artifact_id'],
                  }
                  f.write(json.dumps(audit, ensure_ascii=True, separators=(',', ':')) + '\n')

          write_manifest(
              a4, '04_human_screening_adjudication', ledger['source_artifact_id'], ledger['source_workflow_run_id'], screening_records,
              'Canonical repair corpus plus 54 human relevance-screening adjudications from Workflow 04 fresh-200 validation (44 RETAIN, 10 EXCLUDE).'
          )

          # Promote the latest archived state to current.
          shutil.copy2(screening_records, cur / 'records.jsonl')
          shutil.copy2(a3 / 'metadata_repair_audit.jsonl', cur / 'metadata_repair_audit.jsonl')
          shutil.copy2(a4 / 'screening_adjudication_audit.jsonl', cur / 'screening_adjudication_audit.jsonl')
          current_manifest = json.loads((a4 / 'manifest.json').read_text(encoding='utf-8'))
          current_manifest['stage'] = 'current_repair'
          current_manifest['archive_source'] = 'data/canonical/archive/repair/04_human_screening_adjudication'
          (cur / 'manifest.json').write_text(json.dumps(current_manifest, indent=2) + '\n', encoding='utf-8')

          # Final invariants.
          assert count_jsonl(cur / 'records.jsonl') == 21851
          assert sha256(cur / 'records.jsonl') == sha256(a4 / 'records.jsonl')
          assert count_jsonl(cur / 'screening_adjudication_audit.jsonl') == 54
          print(json.dumps(current_manifest, indent=2))
          print('screening decisions:', dict(counts))
          PY

      - name: Commit persistent canonical repair store
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes data/canonical
          git lfs status
          if git diff --cached --quiet; then
            echo 'Canonical repair store already up to date.'
            exit 0
          fi
          git commit -m 'Persist canonical repair corpus and archives'
          git push origin HEAD:canonical-repair-store

      - name: Verify committed LFS pointers and current manifest
        run: |
          set -euo pipefail
          git lfs ls-files
          test -f data/canonical/current/repair/manifest.json
          test -f data/canonical/current/repair/screening_adjudication_audit.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/canonical/current/repair/manifest.json').read_text())
          assert m['record_count'] == 21851
          assert m['archive_source'] == 'data/canonical/archive/repair/04_human_screening_adjudication'
          print(json.dumps(m, indent=2))
          PY
