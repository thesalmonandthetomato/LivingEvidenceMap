name: Temporary W02 curl readiness check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w02-curl-restore-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check W02 restore packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev
          Rscript -e 'install.packages(c("curl","httr2"));stopifnot(requireNamespace("curl",quietly=TRUE),requireNamespace("httr2",quietly=TRUE));cat("PASS W02 restore curl package ready\n")'
