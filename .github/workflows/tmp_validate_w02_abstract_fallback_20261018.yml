name: Temporary validate W02 abstract fallback
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_validate_w02_abstract_fallback_20261018.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: workflow01-final-architecture}
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: release, use-public-rspm: true}
      - run: Rscript -e 'install.packages(c("jsonlite","httr2","stringdist","digest"))'
      - name: Validate W02 and patch scripts parse
        shell: Rscript {0}
        run: |
          parse(file="scripts/updater/workflow_02_metadata_enrichment.R")
          parse(file="scripts/updater/workflow_02_build_patch.R")
          parse(file="scripts/updater/workflow_02_apply_patch.R")
          cat("PASS: updated W02 script and patch pipeline parse\n")
      - name: Static assertions for supplementary DOI and title guards
        shell: Rscript {0}
        run: |
          s<-paste(readLines("scripts/updater/workflow_02_metadata_enrichment.R"),collapse="\n")
          stopifnot(grepl("crossref_abstract_lookup <- function",s,fixed=TRUE))
          stopifnot(grepl("openalex_abstract_lookup <- function",s,fixed=TRUE))
          stopifnot(grepl('identical(result$returned_doi,d) && !is.na(sim) && sim>=0.90',s,fixed=TRUE))
          stopifnot(grepl('if(is_missing(r$canonical$abstract)){',s,fixed=TRUE))
          cat("PASS: verified supplementary fallback guards\n")
