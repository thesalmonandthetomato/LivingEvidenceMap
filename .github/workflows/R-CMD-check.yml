name: R tests

on:
  push:
    paths:
      - 'R/**'
      - '!R/build_living_evidence_flowdiagram.R'
      - 'scripts/**/*.R'
      - 'tests/testthat/**'
      - 'DESCRIPTION'
      - '.github/workflows/R-CMD-check.yml'
  pull_request:
    paths:
      - 'R/**'
      - '!R/build_living_evidence_flowdiagram.R'
      - 'scripts/**/*.R'
      - 'tests/testthat/**'
      - 'DESCRIPTION'
      - '.github/workflows/R-CMD-check.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::dplyr, any::stringr, any::tibble, any::purrr, any::stringi, any::stringdist, any::quanteda, any::glmnet, any::Matrix
          needs: check
      - name: Run testthat
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "progress")'
