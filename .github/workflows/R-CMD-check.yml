name: R tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::dplyr, any::stringr, any::tibble
          needs: check
      - name: Run testthat files individually
        shell: bash
        run: |
          set -o pipefail
          for file in tests/testthat/test-*.R; do
            echo "============================================================"
            echo "RUNNING: $file"
            echo "============================================================"
            Rscript -e 'testthat::test_file(commandArgs(trailingOnly = TRUE)[1], reporter = "progress")' -- "$file"
          done
