name: R tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::dplyr, any::stringr, any::tibble
          needs: check
      - name: Run testthat files and capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p testthat-logs
          status=0
          for file in tests/testthat/test-*.R; do
            name=$(basename "$file" .R)
            echo "============================================================"
            echo "RUNNING: $file"
            echo "============================================================"
            Rscript -e 'testthat::test_file(commandArgs(trailingOnly = TRUE)[1], reporter = "progress")' -- "$file" > "testthat-logs/${name}.log" 2>&1
            rc=$?
            cat "testthat-logs/${name}.log"
            if [ "$rc" -ne 0 ]; then
              status=1
              echo "FAILED: $file (exit $rc)"
            else
              echo "PASSED: $file"
            fi
          done
          echo "Overall test status: $status"
          exit "$status"
      - name: Upload testthat diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testthat-logs
          path: testthat-logs/
          if-no-files-found: error
