name: W01-Fast bounded October real record tails
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_october_real_record_tails.yml
      - scripts/updater/experimental_w01_fast/extract_october_real_record_tails.R
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install JSON support
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Read 2MiB tail of four real October record files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -f 3000
          Rscript scripts/updater/experimental_w01_fast/extract_october_real_record_tails.R
      - uses: actions/upload-artifact@v4
        with:
          name: w01-fast-october-record-tails
          path: selected_w01_october_record_tails/
          retention-days: 5
          if-no-files-found: error
