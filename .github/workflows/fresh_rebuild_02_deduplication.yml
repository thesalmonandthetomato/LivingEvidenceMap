name: Workflow 02 - Deduplication

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit first; apply only after audit review'
        required: true
        default: audit
        type: choice
        options: [audit, apply]
      canonical_branch:
        description: 'Canonical branch to audit/apply'
        required: true
        default: canonical-fresh-2026-09-08-v1
        type: string
      llm_model:
        description: 'OpenAI model for residual duplicate adjudication'
        required: true
        default: gpt-5.6-luna
        type: string

permissions:
  contents: write
  actions: read

env:
  FRESH_CANONICAL_BRANCH: ${{ inputs.canonical_branch }}

jobs:
  deduplication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main orchestration branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        run: install.packages(c('jsonlite', 'stringi', 'digest', 'httr2'))
        shell: Rscript {0}

      - name: Load Workflow 02 R implementation and reviewed decisions
        run: |
          set -euo pipefail
          git fetch origin main updater-workflow-02-deduplication
          mkdir -p /tmp/workflow02
          git show origin/main:scripts/updater/workflow_02_deduplication.R > /tmp/workflow02/workflow_02_deduplication.R
          git show origin/main:scripts/updater/workflow_02_resolution_guard.R > /tmp/workflow02/workflow_02_resolution_guard.R
          git show origin/main:scripts/updater/workflow_02_openai_adjudication.R > /tmp/workflow02/workflow_02_openai_adjudication.R
          Rscript -e "parse(file='/tmp/workflow02/workflow_02_deduplication.R'); parse(file='/tmp/workflow02/workflow_02_resolution_guard.R'); parse(file='/tmp/workflow02/workflow_02_openai_adjudication.R'); cat('PASS: Workflow 02 R scripts parse successfully\n')"
          git show origin/updater-workflow-02-deduplication:data/adjudication/workflow02_reviewed_duplicate_pairs_2026-09-07.jsonl > /tmp/workflow02/reviewed_duplicates.jsonl
          if git cat-file -e origin/main:data/adjudication/workflow02_reviewed_duplicate_pairs_2026-09-15.jsonl 2>/dev/null; then
            git show origin/main:data/adjudication/workflow02_reviewed_duplicate_pairs_2026-09-15.jsonl >> /tmp/workflow02/reviewed_duplicates.jsonl
          fi
          git show origin/updater-workflow-02-deduplication:data/adjudication/workflow02_reviewed_not_duplicate_hashes_2026-09-07.json > /tmp/workflow02/reviewed_not_duplicates.json

      - name: Checkout fresh canonical JSON with LFS
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.canonical_branch }}
          fetch-depth: 0
          lfs: true
          path: canonical_store

      - name: Validate Workflow 02 input in R
        shell: Rscript {0}
        run: |
          library(jsonlite)
          `%||%` <- function(x,y) if (is.null(x)) y else x
          p <- 'canonical_store/data/canonical/current/repair/records.jsonl'
          m <- fromJSON('canonical_store/data/canonical/current/repair/manifest.json', simplifyVector=FALSE)
          accepted_stages <- c(
            'abstract_enriched_deduplication_ready',
            'scopus_abstract_enrichment_complete'
          )
          stopifnot(m$pipeline_stage %in% accepted_stages)
          expected <- as.integer(m$unique_records_written %||% m$lens_reported_total)
          lines <- readLines(p, warn=FALSE, encoding='UTF-8'); lines <- lines[nzchar(trimws(lines))]
          stopifnot(length(lines) == expected)
          ids <- character(length(lines))
          for (i in seq_along(lines)) {
            r <- fromJSON(lines[[i]], simplifyVector=FALSE)
            ids[i] <- as.character(r$identity$lens_id %||% '')
            stopifnot(is.null(r$deduplication), is.null(r$screening), is.null(r$screening_history))
          }
          stopifnot(all(nzchar(ids)), !anyDuplicated(ids))
          cat(sprintf('PASS: %d abstract-enriched records; no inherited deduplication/screening state\n', length(lines)))
        env:
          R_PROFILE_USER: /dev/null

      - name: Generate Workflow 02 candidates in R
        run: |
          set -euo pipefail
          mkdir -p outputs/fresh_workflow02
          Rscript /tmp/workflow02/workflow_02_deduplication.R \
            --input canonical_store/data/canonical/current/repair/records.jsonl \
            --output-dir outputs/fresh_workflow02 \
            --reviewed-duplicates /tmp/workflow02/reviewed_duplicates.jsonl \
            --reviewed-not-duplicates /tmp/workflow02/reviewed_not_duplicates.json \
            --checkpoint-every 5000

      - name: Run deterministic Workflow 02 resolution
        run: |
          set -euo pipefail
          Rscript /tmp/workflow02/workflow_02_resolution_guard.R \
            --input canonical_store/data/canonical/current/repair/records.jsonl \
            --candidates outputs/fresh_workflow02/candidates_reviewed.jsonl \
            --output-dir outputs/fresh_workflow02 \
            --checkpoint-every 250
          cp outputs/fresh_workflow02/adjudication_queue.jsonl outputs/fresh_workflow02/adjudication_queue_pre_llm.jsonl
          cp outputs/fresh_workflow02/resolution_summary.json outputs/fresh_workflow02/resolution_summary_pre_llm.json

      - name: Adjudicate residual duplicate candidates with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DUPLICATE_MODEL: ${{ inputs.llm_model }}
        run: |
          set -euo pipefail
          Rscript /tmp/workflow02/workflow_02_openai_adjudication.R \
            --input canonical_store/data/canonical/current/repair/records.jsonl \
            --queue outputs/fresh_workflow02/adjudication_queue_pre_llm.jsonl \
            --output outputs/fresh_workflow02/llm_adjudication_results.jsonl \
            --model "${OPENAI_DUPLICATE_MODEL}" \
            --checkpoint-every 1

      - name: Re-resolve Workflow 02 with OpenAI adjudications
        run: |
          set -euo pipefail
          Rscript /tmp/workflow02/workflow_02_resolution_guard.R \
            --input canonical_store/data/canonical/current/repair/records.jsonl \
            --candidates outputs/fresh_workflow02/candidates_reviewed.jsonl \
            --llm-decisions outputs/fresh_workflow02/llm_adjudication_results.jsonl \
            --output-dir outputs/fresh_workflow02 \
            --checkpoint-every 250

      - name: Validate Workflow 02 output in R
        shell: Rscript {0}
        run: |
          library(jsonlite)
          `%||%` <- function(x,y) if (is.null(x)) y else x
          m <- fromJSON('canonical_store/data/canonical/current/repair/manifest.json', simplifyVector=FALSE)
          expected <- as.integer(m$unique_records_written %||% m$lens_reported_total)
          lines <- readLines('outputs/fresh_workflow02/annotated_records.jsonl', warn=FALSE, encoding='UTF-8'); lines <- lines[nzchar(trimws(lines))]
          stopifnot(length(lines) == expected)
          ids <- character(length(lines)); statuses <- character(length(lines))
          for (i in seq_along(lines)) {
            r <- fromJSON(lines[[i]], simplifyVector=FALSE)
            ids[i] <- r$identity$lens_id
            stopifnot(is.null(r$screening), is.null(r$screening_history))
            d <- r$deduplication; stopifnot(is.list(d), !is.null(d$status))
            statuses[i] <- d$status
            if (d$status == 'duplicate') stopifnot(!is.null(d$duplicate_of), identical(d$downstream_eligible,FALSE))
            if (d$status %in% c('canonical','unique')) stopifnot(identical(d$downstream_eligible,TRUE))
            if (d$status == 'adjudication_required') stopifnot(identical(d$downstream_eligible,FALSE))
          }
          stopifnot(!anyDuplicated(ids))

          # Cluster-state invariant: any record listed as a duplicate member must
          # itself be status=duplicate and point back to that representative.
          parsed <- lapply(lines, fromJSON, simplifyVector=FALSE)
          id_index <- setNames(seq_along(parsed), ids)
          for (i in seq_along(parsed)) {
            d <- parsed[[i]]$deduplication
            mem <- d$duplicate_members %||% list()
            mem <- as.character(unlist(mem, use.names=FALSE))
            if (length(mem)) {
              for (mid in mem) {
                stopifnot(mid %in% names(id_index))
                md <- parsed[[id_index[[mid]]]]$deduplication
                stopifnot(
                  identical(md$status, 'duplicate'),
                  identical(as.character(md$duplicate_of), ids[[i]])
                )
              }
            }
          }

          s <- fromJSON('outputs/fresh_workflow02/resolution_summary.json', simplifyVector=FALSE)
          stopifnot(s$input_records == expected, s$output_records == expected, s$records_removed == 0)
          stopifnot(is.numeric(s$unique), is.numeric(s$canonical), is.numeric(s$duplicates), is.numeric(s$adjudication_required))
          stopifnot(s$unique + s$canonical + s$duplicates + s$adjudication_required == expected)

          pre <- fromJSON('outputs/fresh_workflow02/resolution_summary_pre_llm.json', simplifyVector=FALSE)
          llm <- fromJSON('outputs/fresh_workflow02/llm_adjudication_results_summary.json', simplifyVector=FALSE)
          stopifnot(llm$queued_pairs == pre$queued_pairs)
          stopifnot(llm$adjudicated_pairs == pre$queued_pairs)
          stopifnot(s$llm_adjudications_loaded == llm$adjudicated_pairs)
          stopifnot(s$queued_pairs <= llm$uncertain)

          print(table(statuses))
          print(llm)
          print(s)

      - name: Block apply while human duplicate review remains
        if: ${{ inputs.mode == 'apply' }}
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON('outputs/fresh_workflow02/resolution_summary.json', simplifyVector=FALSE)
          if (as.integer(s$queued_pairs) > 0L) {
            stop(sprintf('Cannot apply Workflow 02: %d duplicate pairs still require human review', as.integer(s$queued_pairs)))
          }
          cat('PASS: no unresolved duplicate adjudications remain; apply may proceed\n')

      - name: Persist fresh deduplication annotations
        if: ${{ inputs.mode == 'apply' }}
        shell: Rscript {0}
        run: |
          library(jsonlite)
          file.copy('outputs/fresh_workflow02/annotated_records.jsonl','canonical_store/data/canonical/current/repair/records.jsonl',overwrite=TRUE)
          mp <- 'canonical_store/data/canonical/current/repair/manifest.json'
          m <- fromJSON(mp,simplifyVector=FALSE)
          s <- fromJSON('outputs/fresh_workflow02/resolution_summary.json',simplifyVector=FALSE)
          m$deduplication <- list(workflow='workflow_02_deduplication',implementation_language='R',completed_at=format(Sys.time(),tz='UTC',format='%Y-%m-%dT%H:%M:%SZ'),summary=s)
          m$pipeline_stage <- 'deduplicated'
          writeLines(toJSON(m,auto_unbox=TRUE,pretty=TRUE,null='null',na='null'),mp)

      - name: Commit Workflow 02 deduplication state
        if: ${{ inputs.mode == 'apply' }}
        working-directory: canonical_store
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git add data/canonical/current/repair/records.jsonl data/canonical/current/repair/manifest.json
          git diff --cached --quiet && { echo 'No deduplication changes detected'; exit 1; }
          git commit -m 'Persist Workflow 02 R deduplication state'
          git lfs push origin "$FRESH_CANONICAL_BRANCH"
          git push origin HEAD:"$FRESH_CANONICAL_BRANCH"
          git log -1 --format='deduplication_commit=%H'

      - name: Upload Workflow 02 artefacts and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow02-${{ inputs.mode }}-${{ github.run_id }}
          path: outputs/fresh_workflow02/
          retention-days: 90
          if-no-files-found: warn
