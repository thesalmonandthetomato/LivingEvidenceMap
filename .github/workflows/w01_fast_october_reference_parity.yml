name: W01-Fast October real reference verification
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_october_reference_parity.yml
      - scripts/updater/experimental_w01_fast/validate_october_real_cluster_reference.R
      - scripts/updater/experimental_w01_fast/test_october_identity_cluster_parity.R
      - scripts/updater/experimental_w01_fast/update_clusters_by_identity.R
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install minimal R dependencies
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest"))
      - name: Read frozen October W01 maps from small recovered artifact
        uses: actions/download-artifact@v4
        with:
          name: w01-fast-october-real-reference
          run-id: 39482948683
          github-token: ${{ github.token }}
          path: reference
      - name: Verify complete immutable-identity cluster reference
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/validate_october_real_cluster_reference.R reference
      - name: Replay reference-derived October edges using stable identities
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_october_identity_cluster_parity.R
      - name: Preserve small audited report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-october-cluster-reference-audit
          path: |
            real_parity_report/october_cluster_reference.json
            october_identity_parity/report.json
            october_identity_parity/mismatches.csv
          retention-days: 7
          if-no-files-found: error
