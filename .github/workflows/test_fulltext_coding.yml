name: Test full-text AI coding

on:
  workflow_dispatch:
    inputs:
      n_papers:
        description: "Number of prepared papers to code"
        required: false
        default: "5"
      start_index:
        description: "1-based position in sorted prepared corpus to start from"
        required: false
        default: "6"
      model:
        description: "OpenAI model for the test"
        required: false
        default: "gpt-5.6-luna"

permissions:
  contents: read
  actions: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_DEPOSITION_ID: "22085902"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FULLTEXT_CODING_MODEL: ${{ github.event.inputs.model || 'gpt-5.6-luna' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PREFLIGHT schema-validator consistency
        run: |
          set -euo pipefail
          python scripts/fulltext_coding/preflight_coding_schema.py \
            --schema scripts/fulltext_coding/coding_schema_v1.json \
            --validator scripts/fulltext_coding/validate_coding_output.py
      - name: Download existing Zenodo test corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token=os.environ['ZENODO_ACCESS_TOKEN']; dep=os.environ['ZENODO_DEPOSITION_ID']
          req=urllib.request.Request(f'https://zenodo.org/api/deposit/depositions/{dep}', headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r: data=json.load(r)
          remote=data['files'][0]; url=remote['links']['download']
          with urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization':f'Bearer {token}'}), timeout=180) as r:
              Path('test_corpus.zip').write_bytes(r.read())
          print(remote['filename'])
          PY
      - name: Prepare test papers
        run: |
          set -euo pipefail
          rm -rf test_corpus/raw test_corpus/prepared test_corpus/annotations
          mkdir -p test_corpus/raw test_corpus/prepared test_corpus/annotations
          unzip -q test_corpus.zip -d test_corpus/raw
          python - <<'PY'
          import os
          from pathlib import Path
          files=sorted(Path('test_corpus/raw').rglob('*.tei.xml'))
          start=int(os.environ.get('START_INDEX','6'))
          n=int(os.environ.get('N_PAPERS','5'))
          selected=files[start-1:start-1+n]
          if len(selected) < n:
              raise SystemExit(f'Requested {n} papers from position {start}, but only {len(selected)} are available')
          Path('test_corpus/grobid_test_files.txt').write_text('\n'.join(str(p) for p in selected)+'\n')
          print(f'Selected positions {start}-{start+n-1}:')
          for p in selected: print(p)
          PY
          while IFS= read -r file; do
            work_id="$(basename "$file" .tei.xml)"
            python scripts/fulltext_coding/prepare_fulltext_for_coding.py --input "$file" --output "test_corpus/prepared/${work_id}.json"
          done < test_corpus/grobid_test_files.txt
        env:
          START_INDEX: ${{ github.event.inputs.start_index || '6' }}
          N_PAPERS: ${{ github.event.inputs.n_papers || '5' }}
      - name: RESTORE durable coding checkpoint from this run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/coding_checkpoint
          python - <<'PY'
          import json, os, urllib.request, zipfile, io
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100',
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req, timeout=60) as r: data=json.load(r)
          candidates=[a for a in data.get('artifacts',[]) if a['name'].startswith('fulltext-coding-checkpoint-') and not a.get('expired')]
          if not candidates:
              print('No prior checkpoint artifact for this workflow run; starting with no restored annotations.')
              raise SystemExit(0)
          artifact=max(candidates, key=lambda a:a.get('created_at',''))
          print(f"Restoring checkpoint artifact {artifact['id']} ({artifact['name']})")
          req=urllib.request.Request(
              artifact['archive_download_url'],
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req, timeout=120) as r: blob=r.read()
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              z.extractall('/tmp/coding_checkpoint')
          restored=0
          for p in Path('/tmp/coding_checkpoint').rglob('*'):
              if p.is_file():
                  dest=Path('test_corpus/annotations')/p.name
                  if not dest.exists():
                      dest.write_bytes(p.read_bytes()); restored += 1
          print(f'Restored {restored} checkpoint files.')
          PY
      - name: Run AI coding
        run: |
          set -euo pipefail
          python scripts/fulltext_coding/code_fulltext_test.py \
            --input-dir test_corpus/prepared \
            --output-dir test_corpus/annotations \
            --ontology data/reference/topic_ontology_v3.csv \
            --schema scripts/fulltext_coding/coding_schema_v1.json \
            --prompt scripts/fulltext_coding/fulltext_coding_prompt_v1.txt \
            --model "$FULLTEXT_CODING_MODEL" \
            --max-papers "${{ github.event.inputs.n_papers || 5 }}"
      - name: Append current coding-rule addendum
        run: |
          set -euo pipefail
          test -s scripts/fulltext_coding/fulltext_coding_prompt_v1_addendum.txt
          printf '\n\n' >> /tmp/fulltext_coding_prompt_combined.txt
          cat scripts/fulltext_coding/fulltext_coding_prompt_v1.txt > /tmp/fulltext_coding_prompt_combined.txt
          printf '\n\n' >> /tmp/fulltext_coding_prompt_combined.txt
          cat scripts/fulltext_coding/fulltext_coding_prompt_v1_addendum.txt >> /tmp/fulltext_coding_prompt_combined.txt
      - name: CHECKPOINT generated annotations (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-coding-checkpoint-${{ github.run_id }}
          path: test_corpus/annotations/
          retention-days: 90
          if-no-files-found: warn
      - name: Validate annotations and flag human review
        if: always()
        run: |
          set -uo pipefail
          mkdir -p test_corpus/validation
          report="test_corpus/validation/human_review_required.txt"
          : > "$report"
          found=0
          issues=0
          for file in test_corpus/annotations/*.json; do
            case "$file" in
              *.raw_response.json|*.checkpoint.json|*test_manifest.json) continue ;;
            esac
            found=1
            if result=$(python scripts/fulltext_coding/validate_coding_output.py --input "$file" 2>&1); then
              printf '%s: VALID\n' "$(basename "$file")" >> "$report"
            else
              issues=$((issues + 1))
              {
                printf '%s: HUMAN REVIEW REQUIRED\n' "$(basename "$file")"
                printf '%s\n' "$result"
                printf '\n'
              } >> "$report"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No annotation JSON files found" >> "$report"
          fi
          echo "Validation completed: $issues annotation(s) require human review." >> "$report"
          cat "$report"
          exit 0
      - name: Write coding test manifest
        if: always()
        env:
          START_INDEX: ${{ github.event.inputs.start_index || '6' }}
          N_PAPERS: ${{ github.event.inputs.n_papers || '5' }}
        run: |
          set -euo pipefail
          mkdir -p test_corpus/annotations
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('test_corpus/annotations')
          files=sorted(p for p in root.glob('*.json') if not p.name.endswith('.raw_response.json') and not p.name.endswith('.checkpoint.json') and p.name != 'test_manifest.json') if root.exists() else []
          Path('test_corpus/annotations/test_manifest.json').write_text(json.dumps({
            'workflow':'test_fulltext_coding','model':os.environ['FULLTEXT_CODING_MODEL'],
            'ontology':'data/reference/topic_ontology_v3.csv','schema':'scripts/fulltext_coding/coding_schema_v1.json',
            'prompt':'scripts/fulltext_coding/fulltext_coding_prompt_v1.txt + fulltext_coding_prompt_v1_addendum.txt','zenodo_deposition':22085902,
            'start_index':int(os.environ.get('START_INDEX','6')),'n_papers':int(os.environ.get('N_PAPERS','5')),
            'annotation_files':[p.name for p in files]}, indent=2)+'\n')
          PY
      - name: CHECKPOINT final manifest (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-coding-final-${{ github.run_id }}
          path: test_corpus/annotations/
          retention-days: 90
          if-no-files-found: warn
      - name: CHECKPOINT human-review report (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-coding-validation-${{ github.run_id }}
          path: test_corpus/validation/
          retention-days: 90
          if-no-files-found: warn
