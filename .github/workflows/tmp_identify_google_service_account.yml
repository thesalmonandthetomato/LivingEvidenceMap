name: Temporary identify Google service account

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_identify_google_service_account.yml'

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - name: Print service-account client email only
        env:
          SA_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import json, os
          x=json.loads(os.environ["SA_JSON"])
          print("CLIENT_EMAIL="+x["client_email"])
