name: W07 temporary incremental regression
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w07-temporary-incremental-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c("readr","dplyr","jsonlite","digest"))
      - name: Validate W07 configuration and prepare first-run queue
        shell: Rscript {0}
        run: |
          library(readr)
          library(jsonlite)
          cfg<-fromJSON("user_input/workflow07_input_checksums.json")
          stopifnot(identical(digest::digest(file="user_input/workflow07_topic_ontology.csv",algo="sha256",serialize=FALSE),cfg$ontology_sha256))
          stopifnot(identical(digest::digest(file="user_input/workflow07_topic_system_prompt.txt",algo="sha256",serialize=FALSE),cfg$prompt_sha256))
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w07-incremental")
          dir.create(t)
          current<-data.frame(record_id=c("a","b"),title=c("Research on peatland biodiversity","Urban adaptation strategies"),abstract=c("Peatland restoration and birds","Heat resilience in cities"))
          write_csv(current,file.path(t,"current.csv"))
          args<-c("scripts/updater/workflow_07_prepare_incremental.R","--current",file.path(t,"current.csv"),"--output-dir",file.path(t,"prepared"))
          stopifnot(system2("Rscript",args)==0L)
          queue<-read_csv(file.path(t,"prepared/topic_screen_queue.csv"),show_col_types=FALSE)
          manifest<-fromJSON(file.path(t,"prepared/prepare_manifest.json"))
          stopifnot(setequal(queue$record_id,current$record_id),nrow(queue)==2L)
          print(manifest)
          cat("PASS: project checksums and W07 first-run topic queue\n")
