name: Workflow 02 - Deduplication v2 candidate benchmark

on:
  push:
    branches:
      - workflow02-multisource-reconciliation
    paths:
      - '.github/workflows/workflow_02_deduplication_v2_validation.yml'
      - 'scripts/updater/workflow_02_deduplication_v2_candidate_benchmark.R'
  workflow_dispatch:
    inputs:
      workflow01_run_id:
        description: 'Successful Workflow 01 all-source artefact run ID'
        required: true
        default: '35507378528'
        type: string
      score_n:
        description: 'Number of candidate pairs to score after full-corpus candidate generation'
        required: true
        default: '2000'
        type: string
      sample_key:
        description: 'Fixed deterministic scoring-sample key'
        required: true
        default: 'workflow02-v2-candidate-benchmark-v1'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Workflow 02 branch
        uses: actions/checkout@v4
        with:
          ref: workflow02-multisource-reconciliation
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','stringdist','digest','xml2','stringi','data.table'))

      - name: Parse benchmark implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_02_deduplication_v2_candidate_benchmark.R')
          cat('PASS: Workflow 02 v2 candidate benchmark parses successfully\n')

      - name: Download Workflow 01 all-source artefact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow01_run_id || '35507378528' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflow01_output
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "workflow01-abstract-enrichment-$RUN_ID" \
            --dir workflow01_output

          for f in lens_records_for_deduplication.jsonl \
                   scopus_records_for_deduplication.jsonl \
                   openalex_records_for_deduplication.jsonl \
                   agricola_records_for_deduplication.jsonl; do
            test -n "$(find workflow01_output -type f -name "$f" -print -quit)"
          done

      - name: Run full-corpus candidate benchmark
        env:
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow01_run_id || '35507378528' }}
          SCORE_N: ${{ github.event_name == 'workflow_dispatch' && inputs.score_n || '2000' }}
          SAMPLE_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_key || 'workflow02-v2-candidate-benchmark-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          LENS="$(find workflow01_output -type f -name lens_records_for_deduplication.jsonl -print -quit)"
          SCOPUS="$(find workflow01_output -type f -name scopus_records_for_deduplication.jsonl -print -quit)"
          OPENALEX="$(find workflow01_output -type f -name openalex_records_for_deduplication.jsonl -print -quit)"
          AGRICOLA="$(find workflow01_output -type f -name agricola_records_for_deduplication.jsonl -print -quit)"
          mkdir -p outputs/workflow02_v2_benchmark

          Rscript scripts/updater/workflow_02_deduplication_v2_candidate_benchmark.R \
            --lens "$LENS" \
            --scopus "$SCOPUS" \
            --openalex "$OPENALEX" \
            --agricola "$AGRICOLA" \
            --workflow01-run-id "$RUN_ID" \
            --score-n "$SCORE_N" \
            --sample-key "$SAMPLE_KEY" \
            --output-dir outputs/workflow02_v2_benchmark

      - name: Validate benchmark outputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON('outputs/workflow02_v2_benchmark/summary.json', simplifyVector = FALSE)
          stopifnot(identical(s$status, 'success'))
          stopifnot(identical(s$historic_human_adjudications_loaded, FALSE))
          stopifnot(identical(s$clustering_performed, FALSE))
          stopifnot(file.exists('outputs/workflow02_v2_benchmark/normalised_metadata.csv'))
          stopifnot(file.exists('outputs/workflow02_v2_benchmark/all_candidate_pairs.csv'))
          stopifnot(file.exists('outputs/workflow02_v2_benchmark/scoring_sample.csv'))
          stopifnot(file.exists('outputs/workflow02_v2_benchmark/scored_sample.csv'))
          stopifnot(file.exists('outputs/workflow02_v2_benchmark/checkpoint_progress.json'))
          cat('PASS: full-corpus candidate benchmark outputs verified\n')

      - name: Upload benchmark artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow02-deduplication-v2-candidate-benchmark-${{ github.run_id }}
          path: outputs/workflow02_v2_benchmark/
          retention-days: 90
          if-no-files-found: warn
