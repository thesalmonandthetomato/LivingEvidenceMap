name: Temporary W02 optional pause validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w02-optional-pause-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse new R integration
        shell: Rscript {0}
        run: |
          parse(file="scripts/updater/workflow_02_publish_optional_pause_to_shiny.R")
          parse(file="scripts/updater/workflow_02_publish_missing_abstract_queue.R")
          parse(file="scripts/updater/workflow_02_apply_optional_abstracts.R")
          cat("PASS: all W02 optional-pause R files parse\n")
      - name: Validate GitHub Actions definitions
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color=false -shellcheck= \
            .github/workflows/workflow_02_batched_production.yml \
            .github/workflows/workflow_02_batched.yml \
            .github/workflows/workflow_02_resume_after_human_review.yml \
            .github/workflows/workflow_02_optional_missing_abstracts.yml
