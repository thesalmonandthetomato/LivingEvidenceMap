name: W04 one-shot prompt improvement proposal
run-name: W04 prompt refinement ${{ inputs.review_id }} ${{ inputs.request_file }}
on:
  workflow_dispatch:
    inputs:
      review_id:
        description: Immutable review identifier
        required: true
        type: string
      draft_id:
        description: Restricted review prompt draft Zenodo deposit
        required: true
        type: string
      request_file:
        description: Archived prompt refinement request
        required: true
        type: string
      request_sha:
        description: SHA256 of archived request bytes
        required: true
        type: string
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install one-call runtime dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite","httr2","digest"),repos="https://cloud.r-project.org",quiet=TRUE)
      - name: Produce and archive proposed prompt
        shell: bash
        run: |
          Rscript scripts/updater/workflow_04_refine_prompt.R \
            --draft-id "${{ inputs.draft_id }}" \
            --request-file "${{ inputs.request_file }}" \
            --request-sha "${{ inputs.request_sha }}"
