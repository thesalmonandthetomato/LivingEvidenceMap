name: W04 one-shot prompt improvement proposal
run-name: W04 prompt refinement ${{ inputs.review_id }} ${{ inputs.request_file }}
on:
  workflow_dispatch:
    inputs:
      review_id:
        description: Immutable review identifier
        required: true
        type: string
      draft_id:
        description: Restricted review prompt draft Zenodo deposit
        required: true
        type: string
      request_file:
        description: Archived prompt refinement request
        required: true
        type: string
      request_sha:
        description: SHA256 of archived request bytes
        required: true
        type: string
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install native dependencies for HTTP and TLS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev pkg-config ca-certificates
          pkg-config --modversion libcurl
          pkg-config --modversion openssl
      - name: Install and verify one-call R dependencies
        shell: Rscript {0}
        run: |
          required <- c("jsonlite", "httr2", "digest")
          # Use setup-r's Posit Package Manager repository where available.
          install.packages(required, dependencies = c("Depends", "Imports", "LinkingTo"),
                           quiet = FALSE)
          failures <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
          if (length(failures)) stop("Required R packages failed to load: ",
                                     paste(failures, collapse = ", "), call. = FALSE)
          for (package in required) {
            suppressPackageStartupMessages(library(package, character.only = TRUE))
            message("Verified R package: ", package,
                    " ", as.character(packageVersion(package)))
          }
      - name: Produce and archive proposed prompt
        shell: bash
        run: |
          Rscript scripts/updater/workflow_04_refine_prompt.R \
            --draft-id "${{ inputs.draft_id }}" \
            --request-file "${{ inputs.request_file }}" \
            --request-sha "${{ inputs.request_sha }}"
