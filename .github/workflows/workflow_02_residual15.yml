name: Workflow 02 - Re-evaluate residual 15

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/enrichment/.run_workflow02_residual15'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reevaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','stringdist','data.table'))

      - name: Restore Workflow 01
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer docs/deduplication/zenodo/run-36128255337.json \
            --pointer-dir docs/deduplication/zenodo \
            --output-root workflow01_state

      - name: Restore published Workflow 02 baseline
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_restore_state_from_zenodo.R \
            --pointer docs/enrichment/zenodo/run-36137804187.json \
            --output-dir workflow02_state
          PATCH="$(find workflow02_state -name cumulative_patch.jsonl -type f -print -quit)"
          test -n "$PATCH"
          echo "PATCH=$PATCH" >> "$GITHUB_ENV"

      - name: Reconstruct published enriched state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          Rscript scripts/updater/workflow_02_apply_patch.R \
            --input workflow01_state/canonical/records.jsonl \
            --patch "$PATCH" \
            --output outputs/published_enriched.jsonl \
            --report outputs/published_replay.json \
            --mode exact

      - name: Select residual 15
        shell: Rscript {0}
        run: |
          library(jsonlite)
          ids <- c('work-019f7e24337b59b2','work-1c16bc1976435cbb','work-69e69e9bb25fbd71','work-6b3896979537a7cf','work-72b68c44287bd8fc','work-7e50c9d8a89e9519','work-89eb5730558585e8','work-a69c3cd5c1faa3ac','work-b9a6795ab76e8747','work-c3700db7f2ae342d','work-c81d688de1a0f68a','work-cb490621cc059cc1','work-ea5477348c82a3f7','work-f558bc0ced9d67d3','work-ff21bd4f90e05b93')
          inp <- file('outputs/published_enriched.jsonl','rt')
          out <- file('outputs/residual15.jsonl','wt')
          found <- character()
          repeat{
            ln <- readLines(inp,n=1L,warn=FALSE)
            if(!length(ln)) break
            if(!nzchar(trimws(ln))) next
            r <- fromJSON(ln,simplifyVector=FALSE)
            id <- r$identity$record_id
            if(id %in% ids){
              writeLines(ln,out,useBytes=TRUE)
              found <- c(found,id)
            }
          }
          close(inp);close(out)
          stopifnot(setequal(found,ids),length(found)==15L)
          writeLines(ids,'outputs/residual15_ids.txt')

      - name: Re-evaluate residual 15
        env:
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_metadata_enrichment.R \
            --input outputs/residual15.jsonl \
            --output outputs/residual15_reevaluated.jsonl \
            --audit outputs/residual15_audit.jsonl \
            --report outputs/residual15_report.json \
            --recheck-after-days 0 \
            --delay 0.2

      - name: Summarise
        shell: Rscript {0}
        run: |
          library(jsonlite)
          r <- fromJSON('outputs/residual15_report.json')
          stopifnot(r$counts$total_records==15L)
          stopifnot(r$counts$technical_error_records==0L)
          cat(sprintf(
            'RESULT: eligible=%d title_guard=%d bibliographic=%d quarantined=%d still_missing=%d abstract_fills=%d\n',
            r$counts$eligible_doi_missing_metadata,
            r$counts$title_guard_accepts,
            r$counts$bibliographic_concordance_accepts,
            r$counts$conflicts_quarantined,
            r$counts$still_missing_after,
            r$counts$europepmc_abstract_filled+r$counts$scopus_abstract_filled
          ))

      - name: Upload residual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow02-residual15-${{ github.run_id }}
          path: outputs/
          retention-days: 30
          if-no-files-found: warn
