name: W08b Lens species NOT farming small test
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths: [docs/workflow08b/.run_species_not_farming_test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest'))
      - name: Parse test source
        run: |
          Rscript -e 'invisible(parse(file="scripts/workflow08b/test_lens_species_not_farming.R"))'
      - name: Restore verified candidate IDs
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/restore_discovery.R 23628056 "$RUNNER_TEMP/w08b"
      - name: Compare all, species, and species AND NOT farming on 100 IDs
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/test_lens_species_not_farming.R "$RUNNER_TEMP/w08b/merged/provider_candidate_ids.csv" user_input/workflow00_search_strategy.json "$RUNNER_TEMP/species_not_farming_test.json"
          cat "$RUNNER_TEMP/species_not_farming_test.json"
