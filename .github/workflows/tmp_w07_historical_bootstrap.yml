name: TEMP W07 historical durable bootstrap

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_w07_historical_bootstrap.yml'

permissions:
  contents: write
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','readr','digest','httr2'))

      - name: Validate bootstrap implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_06_restore_state_from_zenodo.R')
          parse(file='scripts/updater/workflow_07_bootstrap_historical_state.R')
          parse(file='scripts/updater/workflow_07_archive_state_to_zenodo.R')
          parse(file='scripts/updater/workflow_07_update_zenodo_registry.R')
          cat('PASS: W07 bootstrap implementation parses\n')

      - name: Restore validated historical sources
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/w07_bootstrap
          mkdir -p inputs/w07_bootstrap/w06 inputs/w07_bootstrap/handoff inputs/w07_bootstrap/zero inputs/w07_bootstrap/qc

          gh run download 36265092530             -n workflow06-geography-production-36265092530             -D inputs/w07_bootstrap/w06

          gh run download 36264955447             -n workflow07-topic-handoff-36264955447             -D inputs/w07_bootstrap/handoff

          gh run download 36304758204             -n workflow07-zero-topic-targeted-rescreen-36304758204             -D inputs/w07_bootstrap/zero

          gh run download 36305907080             -n workflow07-finalisation-validation-36305907080             -D inputs/w07_bootstrap/qc

          for pat in geography_semantic_final.csv workflow07_topic_pathway_scores.csv workflow07_topic_record_summary.csv workflow07_zero_topic_targeted_rescreen.jsonl workflow07_qc_summary.json; do
            hit=$(find inputs/w07_bootstrap -type f -name "$pat" -print -quit)
            test -n "$hit"
            echo "$pat -> $hit"
          done

      - name: Assemble historical durable W07 state
        shell: bash
        run: |
          set -euo pipefail
          W06=$(find inputs/w07_bootstrap/w06 -type f -name geography_semantic_final.csv -print -quit)
          SCO=$(find inputs/w07_bootstrap/handoff -type f -path '*workflow07_topic_final/workflow07_topic_pathway_scores.csv' -print -quit)
          SUM=$(find inputs/w07_bootstrap/handoff -type f -path '*workflow07_topic_final/workflow07_topic_record_summary.csv' -print -quit)
          ZERO=$(find inputs/w07_bootstrap/zero -type f -name workflow07_zero_topic_targeted_rescreen.jsonl -print -quit)
          QC=$(find inputs/w07_bootstrap/qc -type f -name workflow07_qc_summary.json -printf '%h\n' -quit)
          for x in "$W06" "$SCO" "$SUM" "$ZERO" "$QC"; do test -n "$x"; done

          Rscript scripts/updater/workflow_07_bootstrap_historical_state.R             --w06 "$W06"             --scores "$SCO"             --record-summary "$SUM"             --zero-rescreen "$ZERO"             --qc-dir "$QC"             --ontology data/reference/topic_ontology_v3_6.csv             --prompt data/reference/topic_system_prompt_v3_6.txt             --output-dir outputs/workflow07_state

      - name: Publish durable historical W07 checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          W06_RECORD=$(Rscript -e 'x<-jsonlite::fromJSON("docs/workflow06/zenodo/run-36265092530.json",simplifyVector=FALSE);cat(x$zenodo_record_id)')
          W06_SHA=$(Rscript -e 'x<-jsonlite::fromJSON("docs/workflow06/zenodo/run-36265092530.json",simplifyVector=FALSE);cat(x$workflow06_geography_layer_sha256)')
          mkdir -p outputs/workflow07_zenodo
          Rscript scripts/updater/workflow_07_archive_state_to_zenodo.R             --state-dir outputs/workflow07_state             --source-run-id "$GITHUB_RUN_ID"             --source-commit "$GITHUB_SHA"             --publication-run-id "$GITHUB_RUN_ID"             --repository "$GITHUB_REPOSITORY"             --output-dir outputs/workflow07_zenodo             --upstream-w06-record-id "$W06_RECORD"             --upstream-w06-layer-sha256 "$W06_SHA"

      - name: Register durable W07 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin workflow01-final-architecture
          Rscript scripts/updater/workflow_07_update_zenodo_registry.R             --receipt outputs/workflow07_zenodo/zenodo_receipt.json             --registry docs/workflow07/zenodo_registry.csv             --pointer-dir docs/workflow07/zenodo
          git add docs/workflow07/zenodo_registry.csv docs/workflow07/zenodo/
          if ! git diff --cached --quiet; then
            git commit -m "Register bootstrapped historical Workflow 07 state"
            git push origin HEAD:workflow01-final-architecture
          fi

      - name: Upload bootstrap audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow07-historical-bootstrap-${{ github.run_id }}
          path: |
            outputs/workflow07_state/
            outputs/workflow07_zenodo/
          retention-days: 90
          if-no-files-found: warn
