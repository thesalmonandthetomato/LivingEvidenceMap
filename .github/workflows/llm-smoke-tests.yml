name: LLM smoke tests

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::dplyr, any::stringr, any::tibble, any::purrr, any::stringi, any::stringdist, any::quanteda, any::glmnet, any::Matrix
          needs: check
      - name: Run one-record LLM smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: Rscript scripts/run_llm_smoke_tests.R
