name: Temporary restart October W01 retry after runner shutdown
on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - .github/workflows/temp_restart_w01_october.yml
permissions:
  contents: write
  actions: write
jobs:
  restart-w01:
    uses: ./.github/workflows/workflow_01_production.yml
    with:
      workflow00_pointer_path: docs/search_record/zenodo/run-39298022062.json
      previous_workflow01_pointer_path: docs/deduplication/zenodo/run-39140209398.json
    secrets: inherit
