name: Temporary W04 Shiny validation
on:
  push:
    paths:
      - .github/workflows/w04_shiny_temp_validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse isolated W04 R entrypoints
        shell: Rscript {0}
        run: |
          files <- c(
            "scripts/updater/workflow_04_shiny_prompt_provenance.R",
            "scripts/updater/workflow_04_restore_reconciled_archive.R",
            "scripts/updater/workflow_04_prepare_reconciled_offline.R",
            "scripts/updater/workflow_04_merge_incremental.R",
            "scripts/updater/workflow_04_archive_state_to_zenodo.R",
            "scripts/updater/workflow_04_update_zenodo_registry.R",
            "scripts/updater/workflow_05_materialise_retained.R")
          for (f in files) {parse(file=f); cat("PASS R parse:",f,"\n")}
      - name: Validate workflow YAML and publication contract
        run: |
          python - <<'PY'
          import yaml, pathlib
          p=pathlib.Path('.github/workflows/w04_shiny_reconciled_publish.yml')
          x=yaml.safe_load(p.read_text())
          assert "publish-reconciled" in x["jobs"]
          assert "handoff-w05" in x["jobs"]
          assert x["jobs"]["handoff-w05"]["needs"] == "publish-reconciled"
          assert "workflow_05_production.yml" in x["jobs"]["handoff-w05"]["uses"]
          y=x["jobs"]["publish-reconciled"]
          steps=y["steps"]
          assert any("workflow_04_shiny_prompt_provenance.R" in str(z) for z in steps)
          assert not any("OPENAI_API_KEY" in str(z) for z in steps)
          print("PASS workflow structure and no LLM usage")
          PY
