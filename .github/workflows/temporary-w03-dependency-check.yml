name: Temporary W03 dependency check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w03-dependency-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify curl transport
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev
          Rscript -e 'install.packages(c("curl","httr2"));stopifnot(requireNamespace("curl",quietly=TRUE),requireNamespace("httr2",quietly=TRUE))'
          echo 'PASS W03 curl transport'
