name: TEMP render W09 flow diagram only

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_render_w09_flow_only.yml'
      - 'visualisations/07_flow_diagram.R'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('dplyr','ggplot2','readr','stringr','here','jsonlite'))

      - name: Render flow diagram only
        env:
          W09_INPUT_DIR: ${{ github.workspace }}/docs/reporting/workflow_09_inputs/current
        shell: bash
        run: |
          set -euo pipefail
          Rscript visualisations/07_flow_diagram.R
          test -s visualisations/figure_07_flow_diagram.png
          test -s visualisations/figure_07_flow_diagram.pdf
          test -s visualisations/figure_07_flow_diagram_counts.json
          test -s visualisations/figure_07_flow_diagram_counts.csv
          test -s visualisations/figure_07_flow_diagram_boxes.csv

      - name: Upload flow diagram
        uses: actions/upload-artifact@v4
        with:
          name: w09-flow-only-${{ github.run_id }}
          path: |
            visualisations/figure_07_flow_diagram.png
            visualisations/figure_07_flow_diagram.pdf
            visualisations/figure_07_flow_diagram_counts.json
            visualisations/figure_07_flow_diagram_counts.csv
            visualisations/figure_07_flow_diagram_boxes.csv
          retention-days: 30
          if-no-files-found: error
