name: Temporary - validate W01 generic source ingestion

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'user_input/w01_generic_source_validation.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite','digest','httr2','stringdist','stringi','xml2'))

      - name: Restore current W01 baseline
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer docs/deduplication/zenodo/run-36128255337.json \
            --pointer-dir docs/deduplication/zenodo \
            --output-root previous_state
          test -s previous_state/workflow01_full_five_source/manifestation_cluster_map.csv
          test -s previous_state/workflow01_full_five_source/summary.json
          for source in lens scopus openalex agricola wos; do
            test -s "previous_state/workflow01_seed/${source}_records_for_deduplication.jsonl"
          done

      - name: Restore published manual RIS sources
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current_sources/cab current_sources/proquest
          Rscript scripts/updater/workflow_01_restore_manual_ris_from_zenodo.R \
            --registry user_input/workflow00_ris_cab_abstracts_2026-09-30.json \
            --source cab \
            --output current_sources/cab/records.jsonl
          Rscript scripts/updater/workflow_01_restore_manual_ris_from_zenodo.R \
            --registry user_input/workflow00_ris_proquest_2026-09-30.json \
            --source proquest \
            --output current_sources/proquest/records.jsonl

      - name: Validate source manifestation identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/source_identity
          Rscript scripts/updater/workflow_01_source_identity_filter.R \
            --input cab=current_sources/cab/records.jsonl \
            --input proquest=current_sources/proquest/records.jsonl \
            --output-dir outputs/source_identity

      - name: Build seven-source prior-plus-new union
        shell: bash
        run: |
          set -euo pipefail
          PRIOR_N="$(Rscript -e "x<-jsonlite::fromJSON('previous_state/workflow01_full_five_source/summary.json');cat(x$source_manifestations)")"
          mkdir -p outputs/workflow01_union
          Rscript scripts/updater/workflow_01_deduplication_build_union.R \
            --old-dir previous_state/workflow01_seed \
            --input lens=previous_state/workflow01_seed/lens_records_for_deduplication.jsonl \
            --input scopus=previous_state/workflow01_seed/scopus_records_for_deduplication.jsonl \
            --input openalex=previous_state/workflow01_seed/openalex_records_for_deduplication.jsonl \
            --input agricola=previous_state/workflow01_seed/agricola_records_for_deduplication.jsonl \
            --input wos=previous_state/workflow01_seed/wos_records_for_deduplication.jsonl \
            --input cab=current_sources/cab/records.jsonl \
            --input proquest=current_sources/proquest/records.jsonl \
            --expected-prior-manifestations "$PRIOR_N" \
            --output-dir outputs/workflow01_union
          TOTAL="$(Rscript -e "x<-jsonlite::fromJSON('outputs/workflow01_union/union_manifest.json');cat(x$union_manifestations)")"
          test "$TOTAL" = "118527"

      - name: Validate seven-source metadata indexing only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow01_candidates
          Rscript scripts/updater/workflow_01_deduplication_incremental_candidates.R \
            --input lens=outputs/workflow01_union/lens_records_for_deduplication.jsonl \
            --input scopus=outputs/workflow01_union/scopus_records_for_deduplication.jsonl \
            --input openalex=outputs/workflow01_union/openalex_records_for_deduplication.jsonl \
            --input agricola=outputs/workflow01_union/agricola_records_for_deduplication.jsonl \
            --input wos=outputs/workflow01_union/wos_records_for_deduplication.jsonl \
            --input cab=outputs/workflow01_union/cab_records_for_deduplication.jsonl \
            --input proquest=outputs/workflow01_union/proquest_records_for_deduplication.jsonl \
            --old-manifestation-map previous_state/workflow01_full_five_source/manifestation_cluster_map.csv \
            --output-dir outputs/workflow01_candidates \
            --score-n 1 \
            --workflow01-run-id "$GITHUB_RUN_ID" \
            --validate-index-only true
          Rscript -e "x<-data.table::fread('outputs/workflow01_candidates/normalised_metadata.csv');stopifnot(nrow(x)==118527L,identical(as.integer(table(x$source)[['cab']]),26816L),identical(as.integer(table(x$source)[['proquest']]),1574L));cat('PASS: seven-source metadata index validated\n')"

      - name: Upload validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-generic-source-validation-${{ github.run_id }}
          path: |
            outputs/source_identity/
            outputs/workflow01_union/union_manifest.json
            outputs/workflow01_union/union_source_counts.csv
            outputs/workflow01_candidates/incremental_summary.json
            outputs/workflow01_candidates/normalised_metadata.csv
          retention-days: 7
          if-no-files-found: warn
