name: Validate W00 baseline offline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-w00-baseline-offline.yml'

permissions:
  contents: read

jobs:
  offline-r-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out W00 main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install offline validation dependencies
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Parse W00 scripts and check existing default route
        shell: Rscript {0}
        run: |
          paths <- list.files("scripts/updater", pattern="\\.R$", full.names=TRUE)
          paths <- paths[grepl("/workflow_00_",paths)]
          stopifnot(length(paths)>5L)
          for(path in paths) {
            tryCatch(parse(file=path,keep.source=FALSE),
              error=function(e) stop(sprintf("R parse failed: %s: %s",path,conditionMessage(e))))
            cat("PASS parse:",path,"\\n")
          }
          cfg <- jsonlite::fromJSON("user_input/workflow00_search_strategy.json",simplifyVector=FALSE)
          stopifnot(length(cfg$species_terms)>0L,length(cfg$farm_terms)>0L)
          cat(sprintf("PASS: parsed %d W00 R files and checked legacy strategy\\n",length(paths)))
      - name: Check out frozen legacy baseline (read-only)
        uses: actions/checkout@v4
        with:
          ref: a42291ee59f3ce59e870bd4625a161da9822bb76
          path: legacy_baseline
          persist-credentials: false
      - name: Compare GitHub execution steps with frozen legacy baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          original=Path('legacy_baseline/.github/workflows/workflow_00_search_orchestrator.yml').read_text()
          current=Path('.github/workflows/workflow_00_search_orchestrator.yml').read_text()
          def section(src,heading,next_heading):
              return src.split(heading,1)[1].split(next_heading,1)[0]
          boundaries=[
              ('      - name: Validate explicit first-run contract','      - name: Install R dependency'),
              ('      - name: Refuse overlapping pipeline update','      - name: Resolve and freeze source selection'),

              ('      - name: Validate search controls and write source queries','      - name: Record selected databases'),
              ('      - name: Archive search records and source-ID registries','      - name: Upload consolidated search archive'),
              ('      - name: Update repository Zenodo search registry','      - name: Update current-run live status through W00')
          ]
          for start,end in boundaries:
              assert start in original and end in original and start in current and end in current,start
              previous=section(original,start,end)
              actual=section(current,start,end)
              if 'Refuse overlapping pipeline update' in start:
                  actual=actual.replace("        if: $"+"{{ inputs.execution_pathway != 'shiny' }}\n","")
              if 'Validate explicit first-run contract' in start:
                  actual=actual.replace("        if: $"+"{{ inputs.execution_pathway != 'shiny' }}\n","")
              if 'Archive search records and source-ID registries' in start:
                  shiny_skip=("          if [ '$"+"{{ inputs.execution_pathway }}' = 'shiny' ]; then\\n"
                              "            echo 'Shiny pathway: temporary search archive staged for Zenodo; no GitHub state commit.'\\n"
                              "            exit 0\\n"
                              "          fi\\n\\n")
                  assert actual.count(shiny_skip)==1,'Shiny archive guard missing'
                  actual=actual.replace(shiny_skip,"")
              if 'Update repository Zenodo search registry' in start:
                  actual=actual.replace("        if: $"+"{{ inputs.execution_pathway != 'shiny' }}\n","")
              assert actual==previous,start
          start='      - name: Resolve and freeze source selection'
          assert section(original,start,'      - name: Validate search controls and write source queries') == section(current,start,'      - name: Validate explicit execution pathway')
          old_status=section(original,'      - name: Update current-run live status through W00','      - name: Trigger Workflow 01 after successful Workflow 00')
          new_status=section(current,'      - name: Update current-run live status through W00','      - name: Trigger Workflow 01 after successful Workflow 00')
          old_sheet="LEM_GOOGLE_SHEET_ID: $"+"{{ secrets.LEM_TEST_GOOGLE_SHEET_ID }}"
          new_sheet="LEM_GOOGLE_SHEET_ID: $"+"{{ inputs.execution_pathway == 'shiny' && inputs.review_sheet_id || secrets.LEM_TEST_GOOGLE_SHEET_ID }}"
          assert old_status.count(old_sheet)==1
          assert new_status.count(new_sheet)==1
          new_status=new_status.replace("        if: $"+"{{ inputs.execution_pathway != 'shiny' }}\n","")
          assert new_status.replace(new_sheet,old_sheet)==old_status,'unexpected current-run status change'
          assert current.count('default: github')==2
          assert current.count("if: $"+"{{ inputs.execution_pathway == 'shiny' }}")==5,'unexpected Shiny-only steps'
          print('PASS: GitHub W00 steps match legacy; only review Sheet routing differs in status step')
          PY
      - name: Validate non-destructive review tab initialiser
        shell: Rscript {0}
        run: |
          p <- "scripts/updater/workflow_00_initialise_review_tabs.R"
          parse(file=p)
          x <- paste(readLines(p,warn=FALSE),collapse="\\n")
          stopifnot(grepl('"--apply" %in% args',x,fixed=TRUE))
          stopifnot(grepl('if(!apply)',x,fixed=TRUE))
          stopifnot(grepl('setdiff(required,tabs)',x,fixed=TRUE))
          stopifnot(grepl('Existing review_metadata belongs to another review',x,fixed=TRUE))
          cat("PASS: tab initialiser parses and contains opt-in + isolation guards\\n")
      - name: Verify review-specific first-run decisions offline
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'key,value\nreview_id,almeria-map\nauthoritative_w08_baseline,FALSE\n' > "$tmp/new.csv"
          Rscript scripts/updater/workflow_00_validate_review_metadata.R --metadata-csv "$tmp/new.csv" --first-run true
          if Rscript scripts/updater/workflow_00_validate_review_metadata.R --metadata-csv "$tmp/new.csv" --first-run false; then
            echo 'ERROR: update of a new review was incorrectly permitted' >&2; exit 1
          fi
          printf 'key,value\nreview_id,almeria-map\nauthoritative_w08_baseline,TRUE\nlatest_w08_zenodo_record_id,12345678\n' > "$tmp/existing.csv"
          Rscript scripts/updater/workflow_00_validate_review_metadata.R --metadata-csv "$tmp/existing.csv" --first-run false
          if Rscript scripts/updater/workflow_00_validate_review_metadata.R --metadata-csv "$tmp/existing.csv" --first-run true; then
            echo 'ERROR: first run over authoritative baseline incorrectly permitted' >&2; exit 1
          fi
          printf 'key,value\nreview_id,almeria-map\n' > "$tmp/missing.csv"
          if Rscript scripts/updater/workflow_00_validate_review_metadata.R --metadata-csv "$tmp/missing.csv" --first-run true; then
            echo 'ERROR: incomplete metadata incorrectly permitted' >&2; exit 1
          fi
          echo 'PASS: first-run metadata contract cases'
      - name: Verify review-specific overlap guard offline
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/updater/workflow_00_guard_review_overlap.R")'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'key,value\nreview_id,almeria-map\nlatest_w00_status,success\nlatest_w00_run_id,100\n' > "$tmp/done.csv"
          Rscript scripts/updater/workflow_00_guard_review_overlap.R --metadata-csv "$tmp/done.csv"
          printf 'key,value\nreview_id,almeria-map\nlatest_w00_status,running\nlatest_w00_run_id,101\n' > "$tmp/running.csv"
          if Rscript scripts/updater/workflow_00_guard_review_overlap.R --metadata-csv "$tmp/running.csv"; then exit 1; fi
          Rscript scripts/updater/workflow_00_guard_review_overlap.R --metadata-csv "$tmp/running.csv" --resume-run-id 101
          if Rscript scripts/updater/workflow_00_guard_review_overlap.R --metadata-csv "$tmp/running.csv" --resume-run-id 999; then exit 1; fi
          echo 'PASS: review overlap guard blocks different active runs'
      - name: Validate Shiny receipt writer and guards
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/updater/workflow_00_record_review_receipt.R");cat("PASS: receipt writer parses\\n")'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/workflow_00_search_orchestrator.yml').read_text()
          assert 'scripts/updater/workflow_00_record_review_receipt.R' in s
          assert 'Shiny pathway: temporary search archive staged for Zenodo' in s
          assert "inputs.execution_pathway != 'shiny' && inputs.dispatch_w01 == true" in s
          print('PASS: Shiny receipt and GitHub pathway guards')
          PY
      - name: Validate explicit spreadsheet routing offline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/workflow_00_search_orchestrator.yml').read_text()
          assert wf.count('review_sheet_id:')==2
          assert 'inputs.execution_pathway == \'shiny\' && inputs.review_sheet_id || secrets.LEM_TEST_GOOGLE_SHEET_ID' in wf
          assert ("if: $"+"{{ inputs.execution_pathway != 'shiny' }}") in wf
          assert ("if: $"+"{{ inputs.execution_pathway == 'shiny' }}") in wf
          assert "Shiny pathway requires review_sheet_id" in wf
          print('PASS: Shiny sheet ID explicit; legacy GitHub sheet fallback retained')
          PY
      - name: Run existing W00 strategy validation offline
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_validate_search_strategy.R --config user_input/workflow00_search_strategy.json
          echo 'PASS: existing GitHub-input strategy validated; no searches performed'
