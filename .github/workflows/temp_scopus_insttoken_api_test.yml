name: Temporary Scopus insttoken API test

on:
  push:
    branches:
      - temp-scopus-insttoken-test-2026-09-24
    paths:
      - '.github/workflows/temp_scopus_insttoken_api_test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scopus-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp-scopus-insttoken-test-2026-09-24
          lfs: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite"))

      - name: Run 20-record Scopus API test
        shell: bash
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scopus_api_test
          Rscript scripts/tests/test_scopus_insttoken_api.R             "data/master/current/living_evidence_map_master.csv"             "scopus_api_test/scopus_api_test_20.csv" | tee scopus_api_test/summary.txt

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopus-insttoken-api-test-${{ github.run_id }}
          path: scopus_api_test/
          retention-days: 30
          if-no-files-found: warn
