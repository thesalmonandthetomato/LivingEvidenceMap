name: Build evidence-map dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_dashboard.py'
      - 'scripts/enforce_v3_dashboard_topics.py'
      - 'scripts/build_dashboard_html_v2.py'
      - 'scripts/augment_dashboard_citations.py'
      - 'scripts/patch_dashboard_citations.py'
      - 'scripts/patch_dashboard_topics_and_heat.py'
      - 'scripts/augment_dashboard_data.py'
      - 'scripts/normalise_dashboard_data.py'
      - 'scripts/validate_dashboard_data.py'
      - 'scripts/force_dashboard_rebuild.py'
      - 'scripts/repair_dashboard_builder.py'
      - 'scripts/audit_topic_hierarchy.py'
      - 'config/iso3_numeric_map.json'
      - 'data/reference/salmon_evidence_map.csv'
      - 'data/reference/topic_ontology_v3.csv'
  workflow_run:
    workflows: ["Build final master"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-dashboard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build dashboard data
        run: python scripts/build_dashboard.py
      - name: Enforce authoritative V3 topic paths
        run: python scripts/enforce_v3_dashboard_topics.py
      - name: Add bibliographic citation metadata
        run: python scripts/augment_dashboard_citations.py
      - name: Normalise species and finest-topic metrics
        run: python scripts/normalise_dashboard_data.py
      - name: Build hierarchical dashboard data
        run: python scripts/augment_dashboard_data.py
      - name: Validate dashboard data quality
        run: python scripts/validate_dashboard_data.py
      - name: Audit master topic hierarchy
        run: python scripts/audit_topic_hierarchy.py
      - name: Repair dashboard builder syntax before rendering
        run: python scripts/repair_dashboard_builder.py
      - name: Build production dashboard HTML
        run: python scripts/build_dashboard_html_v2.py
      - name: Render citation details and scholarly links
        run: python scripts/patch_dashboard_citations.py
      - name: Render compact hierarchical topics and heatmap zero colour
        run: python scripts/patch_dashboard_topics_and_heat.py
      - name: Enforce near-white zero heatmap colour
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace("?'#f0f2f1':color", "?'#f8f9f8':color")
          p.write_text(html,encoding='utf-8')
          print('Enforced near-white heatmap zero colour')
          PY
      - name: Stamp dashboard HTML and bust dashboard-data cache
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('docs/index.html')
          html = p.read_text(encoding='utf-8')
          build_id = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          html = html.replace("d3.json('dashboard.json')", f"d3.json('dashboard.json?v={build_id}')")
          marker = f'<!-- dashboard-build: {build_id} -->'
          html = marker + '\n' + html
          p.write_text(html, encoding='utf-8')
          print(f'Stamped dashboard HTML: {build_id}')
          PY
      - name: Validate generated dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Package dashboard for Pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Commit generated dashboard files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dashboard.json docs/index.html state/dashboard_missing_topics.txt state/topic_hierarchy_audit.csv state/topic_hierarchy_audit_summary.txt scripts/build_dashboard_html_v2.py scripts/patch_dashboard_topics_and_heat.py
          if git diff --cached --quiet; then
            echo 'Dashboard files unchanged.'
          else
            git commit -m 'Update interactive evidence-map dashboard'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                git push origin main && exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            echo 'Could not push dashboard update after retries.'
            exit 1
          fi
