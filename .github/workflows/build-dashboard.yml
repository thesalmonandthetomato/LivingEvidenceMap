name: Build evidence-map dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_dashboard.py'
      - 'scripts/build_dashboard_html_v2.py'
      - 'scripts/augment_dashboard_data.py'
      - 'scripts/normalise_dashboard_data.py'
      - 'scripts/validate_dashboard_data.py'
  workflow_run:
    workflows: ["Build final master"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-dashboard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build dashboard data
        run: python scripts/build_dashboard.py
      - name: Normalise species and finest-topic metrics
        run: python scripts/normalise_dashboard_data.py
      - name: Build hierarchical dashboard data
        run: python scripts/augment_dashboard_data.py
      - name: Validate dashboard data quality
        run: python scripts/validate_dashboard_data.py
      - name: Build production dashboard HTML
        run: python scripts/build_dashboard_html_v2.py
      - name: Commit generated dashboard files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dashboard.json docs/index.html state/dashboard_missing_topics.txt
          if git diff --cached --quiet; then
            echo 'Dashboard files unchanged.'
          else
            git commit -m 'Update interactive evidence-map dashboard'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                git push origin main && exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            echo 'Could not push dashboard update after retries.'
            exit 1
          fi
