name: Build evidence-map dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build final master"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-dashboard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build dashboard data
        run: python scripts/build_dashboard.py
      - name: Normalise species and finest-topic metrics
        run: python scripts/normalise_dashboard_data.py
      - name: Patch dashboard data for interactive views
        run: python scripts/augment_dashboard_data.py
      - name: Patch legacy dashboard interactions and layout
        run: python scripts/patch_dashboard.py
      - name: Set dashboard title and subtitle
        run: python scripts/patch_dashboard_text.py
      - name: Build final dashboard HTML
        run: python scripts/build_dashboard_html.py
      - name: Add database links, filters and sorting
        run: python scripts/patch_database_features.py
      - name: Commit generated dashboard files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dashboard.json docs/index.html
          if git diff --cached --quiet; then
            echo 'Dashboard files unchanged.'
          else
            git commit -m 'Update interactive evidence-map dashboard'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                git push origin main && exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            echo 'Could not push dashboard update after retries.'
            exit 1
          fi
