name: Build evidence-map dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/reference/salmon_evidence_map.csv'
      - 'state/**'
      - 'scripts/build_dashboard.py'
      - 'scripts/patch_dashboard.py'
      - 'docs/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Patch dashboard interactions and layout
        run: python scripts/patch_dashboard.py

      - name: Commit generated dashboard files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dashboard.json docs/index.html
          if git diff --cached --quiet; then
            echo 'Dashboard files unchanged.'
          else
            git commit -m 'Update evidence-map dashboard'
            git push origin main
          fi
