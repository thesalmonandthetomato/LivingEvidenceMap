name: Build evidence-map dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dashboard.yml'
      - 'scripts/build_dashboard.py'
      - 'scripts/enforce_v3_dashboard_topics.py'
      - 'scripts/build_dashboard_html_v2.py'
      - 'scripts/augment_dashboard_citations.py'
      - 'scripts/patch_dashboard_citations.py'
      - 'scripts/patch_dashboard_topics_and_heat.py'
      - 'scripts/patch_dashboard_feedback_data.py'
      - 'scripts/patch_dashboard_feedback_html.py'
      - 'scripts/patch_dashboard_heatmap_ux.py'
      - 'scripts/cluster_database_topic_dropdown.py'
      - 'scripts/augment_dashboard_data.py'
      - 'scripts/normalise_dashboard_data.py'
      - 'scripts/validate_dashboard_data.py'
      - 'scripts/audit_topic_hierarchy.py'
      - 'config/iso3_numeric_map.json'
      - 'data/master/current/living_evidence_map_master.csv'
      - 'data/reference/topic_ontology_v3.csv'
  workflow_run:
    workflows: ["Build final master"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-dashboard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # These are approved presentation artifacts. Database/data rebuilds may
      # update docs/dashboard.json, but must never overwrite the presentation.
      - name: Snapshot protected dashboard presentation
        run: |
          cp docs/index.html /tmp/approved-dashboard-index.html
          cp docs/topic-radial.js /tmp/approved-topic-radial.js
          sha256sum docs/index.html docs/topic-radial.js > /tmp/protected-dashboard.sha256

      - name: Build dashboard data
        run: python scripts/build_dashboard.py
      - name: Enforce authoritative V3 topic paths
        run: python scripts/enforce_v3_dashboard_topics.py
      - name: Add bibliographic citation metadata
        run: python scripts/augment_dashboard_citations.py
      - name: Normalise species and finest-topic metrics
        run: python scripts/normalise_dashboard_data.py
      - name: Build hierarchical dashboard data
        run: python scripts/augment_dashboard_data.py
      - name: Apply authoritative dashboard topic presentation data
        run: python scripts/patch_dashboard_feedback_data.py
      - name: Validate dashboard data quality
        run: python scripts/validate_dashboard_data.py
      - name: Audit master topic hierarchy
        run: python scripts/audit_topic_hierarchy.py

      # HTML-building/patching scripts are intentionally NOT used to define the
      # production display. They may generate or mutate docs/index.html as an
      # intermediate artefact, but the approved display is restored below.
      - name: Restore protected dashboard presentation
        run: |
          cp /tmp/approved-dashboard-index.html docs/index.html
          cp /tmp/approved-topic-radial.js docs/topic-radial.js

      - name: Verify protected dashboard presentation is unchanged
        run: |
          sha256sum -c /tmp/protected-dashboard.sha256
          cmp -s docs/index.html /tmp/approved-dashboard-index.html || {
            echo 'ERROR: docs/index.html changed during rebuild.'
            exit 1
          }
          cmp -s docs/topic-radial.js /tmp/approved-topic-radial.js || {
            echo 'ERROR: docs/topic-radial.js changed during rebuild.'
            exit 1
          }

      - name: Validate generated dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Package dashboard for Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-pages
          path: docs
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated dashboard data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dashboard.json state/dashboard_missing_topics.txt state/topic_hierarchy_audit.csv state/topic_hierarchy_audit_summary.txt
          if git diff --cached --quiet; then
            echo 'Dashboard data unchanged.'
          else
            git commit -m 'Update evidence-map dashboard data'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                git push origin main && exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            exit 1
          fi
