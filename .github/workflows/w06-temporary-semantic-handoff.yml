name: W06 temporary semantic and handoff test
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w06-temporary-semantic-handoff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("readr","dplyr","jsonlite","digest","tibble"))
      - name: Test semantic validation and sparse W06 output
        shell: Rscript {0}
        run: |
          library(readr)
          library(jsonlite)
          source("R/geography_grounding.R")
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w06-semantic")
          dir.create(t)
          gaz<-read_csv("config/global_country_gazetteer_v3.csv",show_col_types=FALSE)
          ok<-geography_auto_validation("RESOLVED",FALSE,"NOR","NOR",TRUE,"Sampling in Norway","Field samples from Norway",gaz)
          fail<-geography_auto_validation("RESOLVED",TRUE,"NOR","NOR",TRUE,"Sampling in Norway","Field samples",gaz)
          stopifnot(isTRUE(ok$valid),!isTRUE(fail$valid))
          current<-data.frame(record_sequence=1:2,record_id=c("a","b"),title=c("Sampling in Norway","No location"),abstract=c("Samples from Norway","Methods only"),geography_input_sha256=c("one","two"),deterministic_primary_countries=c("Norway",""),deterministic_primary_iso3c=c("NOR",""),geography_review_required=c(FALSE,FALSE),geography_review_reason=c("",""))
          fresh<-data.frame(record_id=c("a","b"),geography_status=c("RESOLVED","NONE"),luna_iso3c=c("NOR",""),luna_country_names=c("Norway",""),luna_evidence=c("Sampling in Norway",""),luna_mapping_reason=c("Explicit",""),evidence_all_grounded=c(TRUE,TRUE),geography_reason=c("Explicit country","No location"),llm_failed=c(FALSE,FALSE),llm_error=c("",""))
          write_csv(current,file.path(t,"current.csv"))
          write_csv(fresh,file.path(t,"fresh.csv"))
          write_csv(fresh[0,,drop=FALSE],file.path(t,"reuse.csv"))
          writeLines(toJSON(list(mode="first_run",reusable_records=0,screen_queue_records=2,new_record_ids=2,changed_title_abstract=0),auto_unbox=TRUE),file.path(t,"manifest.json"))
          args<-c("scripts/updater/workflow_06_merge_incremental.R","--current",file.path(t,"current.csv"),"--reused",file.path(t,"reuse.csv"),"--fresh",file.path(t,"fresh.csv"),"--prepare-manifest",file.path(t,"manifest.json"),"--output-dir",file.path(t,"out"))
          stopifnot(system2("Rscript",args)==0L)
          out<-read_csv(file.path(t,"out/workflow06_geography_layer.csv"),show_col_types=FALSE)
          sum<-fromJSON(file.path(t,"out/workflow06_validated_summary.json"))
          stopifnot(nrow(out)==2L,identical(out$record_id,c("a","b")),sum$records==2L,sum$resolved_n==1L,sum$none_n==1L)
          stopifnot(file.exists(file.path(t,"out/geography_semantic_final.jsonl")))
          cat("PASS: W06 semantic checks, record identity and durable W07-compatible geography layer\n")
      - name: Reject incomplete semantic coverage
        shell: Rscript {0}
        run: |
          library(readr)
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w06-semantic")
          f<-read_csv(file.path(t,"fresh.csv"),show_col_types=FALSE)
          write_csv(f[1,,drop=FALSE],file.path(t,"incomplete.csv"))
          args<-c("scripts/updater/workflow_06_merge_incremental.R","--current",file.path(t,"current.csv"),"--reused",file.path(t,"reuse.csv"),"--fresh",file.path(t,"incomplete.csv"),"--prepare-manifest",file.path(t,"manifest.json"),"--output-dir",file.path(t,"bad"))
          stopifnot(system2("Rscript",args)!=0L)
          cat("PASS: incomplete W06 geography handoff rejected\n")
