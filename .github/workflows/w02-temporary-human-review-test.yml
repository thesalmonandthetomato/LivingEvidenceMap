name: W02 temporary human review test
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w02-temporary-human-review-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest"))
      - name: Prepare synthetic Shiny queue and decisions
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)
          t <- file.path(Sys.getenv("RUNNER_TEMP"),"w02-human-review")
          dir.create(t,recursive=TRUE,showWarnings=FALSE)
          writejl <- function(xs,p) {
            if(!length(xs)) {file.create(p);return(invisible(NULL))}
            writeLines(vapply(xs,function(x)toJSON(x,auto_unbox=TRUE,null="null"),character(1)),p)
          }
          rec <- list(identity=list(record_id="work-a"),canonical=list(doi="10.1234/a",title=NULL,abstract=NULL))
          writejl(list(rec),file.path(t,"w01.jsonl"))
          q <- list(schema="living-evidence-map-workflow02-shiny-case-v1",review_case_id="case-a",record_id="work-a",doi="10.1234/a",provider="scopus",field="title",reason="title_mismatch",provider_response=list(title="Approved title"),conflict=list(reason="title_mismatch"))
          writejl(list(q),file.path(t,"queue.jsonl"))
          sha <- digest(file=file.path(t,"queue.jsonl"),algo="sha256",serialize=FALSE)
          decision <- list(review_case_id="case-a",queue_sha256=sha,record_id="work-a",provider="scopus",field="title",reason="title_mismatch",decision="accept_provider_field",reviewer="test-reviewer",resolved_at_utc="2026-10-09T00:00:00Z")
          writejl(list(decision),file.path(t,"accepted.jsonl"))
          decision$decision <- "reject_provider_field"
          writejl(list(decision),file.path(t,"rejected.jsonl"))
          decision$decision <- "uncertain"
          writejl(list(decision),file.path(t,"uncertain.jsonl"))
          decision$decision <- "accept_provider_field"
          decision$record_id <- "other-record"
          writejl(list(decision),file.path(t,"wrong_record.jsonl"))
          writejl(list(),file.path(t,"missing.jsonl"))
          writejl(list(),file.path(t,"current_patch.jsonl"))
          writeLines(sha,file.path(t,"queue_sha.txt"))
      - name: Accepted review adds approved metadata and resumes
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/w02-human-review"
          SHA="$(cat "$T/queue_sha.txt")"
          Rscript scripts/updater/workflow_02_apply_human_decisions.R --queue "$T/queue.jsonl" --decisions "$T/accepted.jsonl" --current-patch "$T/current_patch.jsonl" --output-patch "$T/accepted_patch.jsonl" --manifest "$T/accepted_manifest.json" --expected-queue-sha256 "$SHA"
          Rscript scripts/updater/workflow_02_apply_patch.R --input "$T/w01.jsonl" --patch "$T/accepted_patch.jsonl" --output "$T/resumed.jsonl" --report "$T/resumed_report.json" --mode exact
          Rscript -e 'library(jsonlite);t<-commandArgs(TRUE)[1];r<-fromJSON(readLines(file.path(t,"resumed.jsonl"))[[1]],simplifyVector=FALSE);p<-fromJSON(readLines(file.path(t,"accepted_patch.jsonl"))[[1]],simplifyVector=FALSE);m<-fromJSON(file.path(t,"accepted_manifest.json"));stopifnot(r$identity$record_id=="work-a",r$canonical$title=="Approved title",p$title$human_adjudicated,m$accepted_provider_fields==1L,m$status=="PASS")' "$T"
          echo "PASS: accepted decision applied and resumed output correct"
      - name: Rejected review does not add metadata
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/w02-human-review"
          SHA="$(cat "$T/queue_sha.txt")"
          Rscript scripts/updater/workflow_02_apply_human_decisions.R --queue "$T/queue.jsonl" --decisions "$T/rejected.jsonl" --current-patch "$T/current_patch.jsonl" --output-patch "$T/rejected_patch.jsonl" --manifest "$T/rejected_manifest.json" --expected-queue-sha256 "$SHA"
          Rscript scripts/updater/workflow_02_apply_patch.R --input "$T/w01.jsonl" --patch "$T/rejected_patch.jsonl" --output "$T/rejected_output.jsonl" --report "$T/rejected_report.json" --mode exact
          Rscript -e 'library(jsonlite);t<-commandArgs(TRUE)[1];r<-fromJSON(readLines(file.path(t,"rejected_output.jsonl"))[[1]],simplifyVector=FALSE);m<-fromJSON(file.path(t,"rejected_manifest.json"));stopifnot(is.null(r$canonical$title),m$rejected_conflicts==1L)' "$T"
          echo "PASS: rejected provider match not applied"
      - name: Unsafe and unfinished reviews are rejected
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/w02-human-review"
          SHA="$(cat "$T/queue_sha.txt")"
          for TYPE in uncertain missing wrong_record; do
            if Rscript scripts/updater/workflow_02_apply_human_decisions.R --queue "$T/queue.jsonl" --decisions "$T/$TYPE.jsonl" --current-patch "$T/current_patch.jsonl" --output-patch "$T/$TYPE.patch.jsonl" --manifest "$T/$TYPE.manifest.json" --expected-queue-sha256 "$SHA"; then
              echo "FAIL: unsafe review accepted: $TYPE"; exit 1
            fi
          done
          if Rscript scripts/updater/workflow_02_apply_human_decisions.R --queue "$T/queue.jsonl" --decisions "$T/accepted.jsonl" --current-patch "$T/current_patch.jsonl" --output-patch "$T/sha.patch.jsonl" --manifest "$T/sha.manifest.json" --expected-queue-sha256 "bad-hash"; then
            echo "FAIL: mismatched frozen queue accepted"; exit 1
          fi
          echo "PASS: incomplete, incorrect and mismatched decisions rejected"
