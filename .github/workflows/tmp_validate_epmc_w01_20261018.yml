name: Temporary EThOS W01 handover validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_validate_epmc_w01_20261018.yml]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workflow01-final-architecture}
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: release, use-public-rspm: true}
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Validate actual EThOS raw-to-W01 transformation with synthetic representative record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ethos-test/raw
          cat > /tmp/ethos-test/raw/response_000001.json <<'JSON'
          {"resultList":{"result":[{"id":"SYNTH001","source":"ETH","title":"Salmon mariculture study","abstractText":"Abstract","pubYear":"2026","authorString":"A Researcher"}]}}
          JSON
          Rscript scripts/updater/workflow_01x_europe_pmc_sidecar_adapter.R --input-dir /tmp/ethos-test --output-dir /tmp/ethos-out --source-code ETH --source-slug ethos --source-collection EThOS
          Rscript -e 'x<-jsonlite::fromJSON("/tmp/ethos-out/ethos_sidecar_records.jsonl",simplifyVector=FALSE);stopifnot(x$source$provider=="ethos",x$sidecar_identity$sidecar_record_id=="ethos:ETH:SYNTH001")'
          bash -n <(sed -n '/^          prepare_direct_source() {/,/^          }/p' .github/workflows/workflow_01_production.yml | sed 's/^          //')
