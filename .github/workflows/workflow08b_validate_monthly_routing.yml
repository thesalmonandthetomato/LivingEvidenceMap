name: W08b - Validate monthly routing and idempotency
on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/workflow08b_validate_monthly_routing.yml'
      - 'scripts/workflow08b/route_after_w08.R'
      - 'scripts/workflow08b/record_routing_event.R'
      - 'tests/test_workflow08b_monthly_routing.R'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - run: Rscript tests/test_workflow08b_monthly_routing.R
