name: Test Scopus vs Lens reconciliation audit

on:
  push:
    branches:
      - updater-workflow-00b-scopus-ingestion
    paths:
      - '.github/workflows/test_scopus_lens_reconciliation.yml'
      - 'scripts/updater/workflow_01t_scopus_lens_reconciliation_audit.R'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Scopus integration branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00b-scopus-ingestion
          path: integration

      - name: Checkout Lens canonical store read-only
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          path: canonical_store
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','stringdist'))

      - name: Download passed Scopus sidecar artefact
        uses: actions/download-artifact@v4
        with:
          name: scopus-sidecar-adapter-35495158288
          path: inputs/scopus_sidecar
          github-token: ${{ github.token }}
          repository: thesalmonandthetomato/LivingEvidenceMap
          run-id: 35495158288

      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f canonical_store/data/canonical/current/repair/records.jsonl
          test -f inputs/scopus_sidecar/scopus_sidecar_records.jsonl
          wc -l canonical_store/data/canonical/current/repair/records.jsonl
          wc -l inputs/scopus_sidecar/scopus_sidecar_records.jsonl
          git -C canonical_store status --short

      - name: Run read-only reconciliation audit
        shell: bash
        run: |
          set -euo pipefail
          Rscript integration/scripts/updater/workflow_01t_scopus_lens_reconciliation_audit.R \
            --lens canonical_store/data/canonical/current/repair/records.jsonl \
            --scopus inputs/scopus_sidecar/scopus_sidecar_records.jsonl \
            --output-dir outputs/updater/scopus_lens_reconciliation

      - name: Guard canonical checkout unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C canonical_store status --porcelain)"
          grep -q '"canonical_json_modified": false' outputs/updater/scopus_lens_reconciliation/reconciliation_audit.json
          grep -q '"canonical_branch_written": false' outputs/updater/scopus_lens_reconciliation/reconciliation_audit.json
          grep -q '"automatic_merges_performed": false' outputs/updater/scopus_lens_reconciliation/reconciliation_audit.json

      - name: Show reconciliation audit
        shell: bash
        run: cat outputs/updater/scopus_lens_reconciliation/reconciliation_audit.json

      - name: Upload reconciliation diagnostic artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopus-lens-reconciliation-${{ github.run_id }}
          path: outputs/updater/scopus_lens_reconciliation/
          if-no-files-found: error
          retention-days: 30
