name: TEMP finalize W02 serial run 36989928117 after Shiny review

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_finalize_w02_serial_36989928117.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: w02-serial-finalize-36989928117
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '36989928117'
  W01_POINTER: docs/deduplication/zenodo/run-36971418284.json
  PREV_W02_POINTER: docs/enrichment/zenodo/run-36725200424.json
  LEM_GOOGLE_SHEET_ID: '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs'
  W02_QUEUE_TAB: queue_w02_active
  W02_DECISIONS_TAB: decisions_w02

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','googlesheets4'))

      - name: Parse finalisation scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_01_restore_current_state.R')
          parse(file='scripts/updater/workflow_02_restore_state_from_zenodo.R')
          parse(file='scripts/updater/workflow_02_apply_patch.R')
          parse(file='scripts/updater/workflow_02_apply_human_decisions.R')
          parse(file='scripts/updater/workflow_02_merge_patches.R')
          parse(file='scripts/updater/workflow_02_inventory_state.R')
          parse(file='scripts/updater/workflow_02_archive_state_to_zenodo.R')
          parse(file='scripts/updater/workflow_02_update_zenodo_registry.R')
          cat('PASS: W02 serial finalisation scripts parse\n')

      - name: Download immutable source-run review and patch artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/review source/state
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "workflow02-human-review-$SOURCE_RUN_ID" --dir source/review
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "workflow02-production-state-$SOURCE_RUN_ID" --dir source/state
          test -s source/review/workflow02_human_review_manifest.json
          test -s source/state/workflow02/current_patch.jsonl
          test -s source/state/workflow02/current_patch_report.json
          test -s source/state/workflow02/retry_queue.jsonl
          echo "PASS: immutable source-run artefacts restored"

      - name: Restore authoritative W01 and previous W02 state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf workflow01_state previous_workflow02
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer "$W01_POINTER" \
            --pointer-dir docs/deduplication/zenodo \
            --output-root workflow01_state
          test -s workflow01_state/canonical/records.jsonl
          EXPECTED_W01_SHA="$(Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("W01_POINTER"));cat(x$canonical_jsonl_sha256)')"
          ACTUAL_W01_SHA="$(Rscript -e "cat(digest::digest(file='workflow01_state/canonical/records.jsonl',algo='sha256',serialize=FALSE))")"
          test "$ACTUAL_W01_SHA" = "$EXPECTED_W01_SHA"
          echo "$ACTUAL_W01_SHA" > w01_sha.txt

          Rscript scripts/updater/workflow_02_restore_state_from_zenodo.R \
            --pointer "$PREV_W02_POINTER" \
            --output-dir previous_workflow02
          PREV_PATCH="$(find previous_workflow02 -type f -name cumulative_patch.jsonl -print -quit)"
          test -n "$PREV_PATCH"
          cp "$PREV_PATCH" previous_cumulative_patch.jsonl

          mkdir -p outputs/workflow02
          Rscript scripts/updater/workflow_02_apply_patch.R \
            --input workflow01_state/canonical/records.jsonl \
            --patch previous_cumulative_patch.jsonl \
            --output outputs/workflow02/input_with_previous_state.jsonl \
            --report outputs/workflow02/previous_patch_application.json \
            --mode fill_missing
          echo "PASS: authoritative W01 plus previous W02 state reconstructed"

      - name: Export and validate completed Shiny decisions
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({
            library(googlesheets4)
            library(jsonlite)
            library(digest)
          })
          dir.create("outputs/w02_resume",recursive=TRUE,showWarnings=FALSE)
          cred <- file.path(Sys.getenv("RUNNER_TEMP"),"lem-google-service-account.json")
          writeLines(Sys.getenv("LEM_GOOGLE_SERVICE_ACCOUNT_JSON"),cred,useBytes=TRUE)
          gs4_auth(path=cred,cache=FALSE)

          ss <- Sys.getenv("LEM_GOOGLE_SHEET_ID")
          q <- read_sheet(ss,sheet=Sys.getenv("W02_QUEUE_TAB"),col_types="c")
          d <- read_sheet(ss,sheet=Sys.getenv("W02_DECISIONS_TAB"),col_types="c")
          reqq <- c("batch_id","queue_sha256","case_index","review_case_id","case_json")
          reqd <- c("review_case_id","record_id","provider","field","reason","decision","reviewer","resolved_at_utc","queue_sha256")
          if(!all(reqq %in% names(q))) stop("W02 queue missing required columns")
          if(!all(reqd %in% names(d))) stop("W02 decisions missing required columns")
          q <- q[order(as.integer(q$case_index)),reqq,drop=FALSE]
          expected_batch <- paste0("w02-run-",Sys.getenv("SOURCE_RUN_ID"))
          if(nrow(q)!=13L) stop(sprintf("Expected 13 W02 review cases, found %d",nrow(q)))
          if(length(unique(q$batch_id))!=1L || unique(q$batch_id)[[1L]]!=expected_batch) stop("Active W02 queue is not the expected source batch")
          queue_sha <- unique(q$queue_sha256)
          if(length(queue_sha)!=1L) stop("W02 queue has multiple SHAs")

          con <- file("outputs/w02_resume/queue.jsonl","wt",encoding="UTF-8")
          writeLines(q$case_json,con,useBytes=TRUE)
          close(con)
          actual_sha <- digest(file="outputs/w02_resume/queue.jsonl",algo="sha256",serialize=FALSE)
          if(actual_sha!=queue_sha) stop(sprintf("Queue SHA mismatch expected=%s actual=%s",queue_sha,actual_sha))

          d <- d[d$queue_sha256==queue_sha,,drop=FALSE]
          if(!nrow(d)) stop("No matching W02 decisions found")
          t <- as.POSIXct(d$resolved_at_utc,format="%Y-%m-%dT%H:%M:%SZ",tz="UTC")
          if(any(is.na(t))) stop("Invalid W02 decision timestamp")
          d <- d[order(t,seq_len(nrow(d)),decreasing=TRUE),,drop=FALSE]
          active <- d[!duplicated(d$review_case_id),,drop=FALSE]
          miss <- setdiff(q$review_case_id,active$review_case_id)
          if(length(miss)) stop(sprintf("%d W02 cases remain undecided",length(miss)))
          active <- active[match(q$review_case_id,active$review_case_id),,drop=FALSE]
          if(any(active$decision=="uncertain")) stop("Uncertain W02 decisions remain")

          con <- file("outputs/w02_resume/decisions.jsonl","wt",encoding="UTF-8")
          for(i in seq_len(nrow(active))){
            z <- as.list(active[i,,drop=FALSE])
            z$decision_id <- NULL
            z$supersedes_decision_id <- NULL
            writeLines(toJSON(z,auto_unbox=TRUE,null="null",na="null"),con,useBytes=TRUE)
          }
          close(con)
          writeLines(queue_sha,"outputs/w02_resume/queue_sha256.txt")
          cat(sprintf("PASS: exported %d completed W02 Shiny decisions\n",nrow(active)))

      - name: Apply human decisions and verify exact current replay
        shell: bash
        run: |
          set -euo pipefail
          QUEUE_SHA="$(cat outputs/w02_resume/queue_sha256.txt)"
          Rscript scripts/updater/workflow_02_apply_human_decisions.R \
            --queue outputs/w02_resume/queue.jsonl \
            --decisions outputs/w02_resume/decisions.jsonl \
            --current-patch source/state/workflow02/current_patch.jsonl \
            --output-patch outputs/workflow02/current_patch_human.jsonl \
            --manifest outputs/w02_resume/human_application_manifest.json \
            --expected-queue-sha256 "$QUEUE_SHA"

          Rscript scripts/updater/workflow_02_apply_patch.R \
            --input outputs/workflow02/input_with_previous_state.jsonl \
            --patch outputs/workflow02/current_patch_human.jsonl \
            --output outputs/workflow02/current_human_replayed.jsonl \
            --report outputs/w02_resume/current_human_replay.json \
            --mode exact
          echo "PASS: human-adjudicated current patch replayed exactly"

      - name: Build and verify cumulative W02 state
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_merge_patches.R \
            --previous previous_cumulative_patch.jsonl \
            --current outputs/workflow02/current_patch_human.jsonl \
            --output outputs/workflow02/cumulative_patch.jsonl

          Rscript scripts/updater/workflow_02_apply_patch.R \
            --input workflow01_state/canonical/records.jsonl \
            --patch outputs/workflow02/cumulative_patch.jsonl \
            --output outputs/workflow02/enriched.jsonl \
            --report outputs/workflow02/cumulative_patch_replay.json \
            --mode fill_missing

          A="$(Rscript -e "cat(digest::digest(file='outputs/workflow02/current_human_replayed.jsonl',algo='sha256',serialize=FALSE))")"
          B="$(Rscript -e "cat(digest::digest(file='outputs/workflow02/enriched.jsonl',algo='sha256',serialize=FALSE))")"
          test "$A" = "$B"
          echo "PASS: current and cumulative W02 reconstructions are identical"

      - name: Build durable final W02 state
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(jsonlite);library(digest)})
          dir.create("outputs/workflow02_state",recursive=TRUE,showWarnings=FALSE)
          system2("Rscript",c(
            "scripts/updater/workflow_02_inventory_state.R",
            "--input","outputs/workflow02/enriched.jsonl",
            "--report","outputs/workflow02/final_inventory.json",
            "--missing-both-queue","outputs/workflow02/missing_both_queue.jsonl"
          ))
          file.copy("outputs/workflow02/cumulative_patch.jsonl","outputs/workflow02_state/cumulative_patch.jsonl",overwrite=TRUE)
          file.copy("source/state/workflow02/retry_queue.jsonl","outputs/workflow02_state/retry_queue.jsonl",overwrite=TRUE)
          file.copy("source/state/workflow02/current_patch_report.json","outputs/workflow02_state/source_current_patch_report.json",overwrite=TRUE)
          file.copy("outputs/workflow02/final_inventory.json","outputs/workflow02_state/final_inventory.json",overwrite=TRUE)
          file.copy("outputs/workflow02/missing_both_queue.jsonl","outputs/workflow02_state/missing_both_queue.jsonl",overwrite=TRUE)
          file.copy("outputs/workflow02/cumulative_patch_replay.json","outputs/workflow02_state/cumulative_patch_replay.json",overwrite=TRUE)
          file.copy("outputs/w02_resume/human_application_manifest.json","outputs/workflow02_state/human_application_manifest.json",overwrite=TRUE)

          retry_n <- length(readLines("source/state/workflow02/retry_queue.jsonl",warn=FALSE))
          human <- fromJSON("outputs/w02_resume/human_application_manifest.json",simplifyVector=FALSE)
          report <- list(
            schema="living-evidence-map-workflow02-finalized-serial-v1",
            workflow="02_metadata_enrichment",
            source_github_run_id=Sys.getenv("SOURCE_RUN_ID"),
            finalizer_github_run_id=Sys.getenv("GITHUB_RUN_ID"),
            provider_order=c("europe_pmc","scopus"),
            status="PASS_WITH_RETAINED_SCOPUS_TECHNICAL_RETRY_QUEUE",
            counts=list(
              source_technical_retry_records=as.integer(retry_n),
              human_review_cases=as.integer(human$queue_cases),
              accepted_provider_fields=as.integer(human$accepted_provider_fields),
              rejected_conflicts=as.integer(human$rejected_conflicts)
            ),
            note="Scopus quota failures from the source run are retained as non-blocking audit/retry state; no additional Scopus requests were made during finalisation.",
            created_at_utc=format(Sys.time(),tz="UTC",format="%Y-%m-%dT%H:%M:%SZ")
          )
          writeLines(toJSON(report,auto_unbox=TRUE,pretty=TRUE,null="null"),"outputs/workflow02_state/enrichment_report.json",useBytes=TRUE)

          sha <- digest(file="outputs/workflow02/enriched.jsonl",algo="sha256",serialize=FALSE)
          state <- list(
            schema="living-evidence-map-workflow02-state-manifest-v1",
            workflow="02",
            execution="serial_source_human_finalized",
            source_github_run_id=Sys.getenv("SOURCE_RUN_ID"),
            finalizer_github_run_id=Sys.getenv("GITHUB_RUN_ID"),
            workflow01_pointer=Sys.getenv("W01_POINTER"),
            workflow01_canonical_sha256=readLines("w01_sha.txt")[[1L]],
            previous_workflow02_pointer=Sys.getenv("PREV_W02_POINTER"),
            final_enriched_sha256=sha,
            human_adjudication_manifest_sha256=digest(file="outputs/w02_resume/human_application_manifest.json",algo="sha256",serialize=FALSE),
            retained_scopus_retry_queue=TRUE,
            created_at_utc=format(Sys.time(),tz="UTC",format="%Y-%m-%dT%H:%M:%SZ")
          )
          writeLines(toJSON(state,auto_unbox=TRUE,pretty=TRUE,null="null"),"outputs/workflow02_state/state_manifest.json",useBytes=TRUE)
          cat(sprintf("PASS: durable W02 state built; final enriched SHA=%s\n",sha))

      - name: Publish final W02 state to restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow02_zenodo
          W01_SHA="$(cat w01_sha.txt)"
          Rscript scripts/updater/workflow_02_archive_state_to_zenodo.R \
            --state-dir outputs/workflow02_state \
            --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir outputs/workflow02_zenodo \
            --workflow01-canonical-sha256 "$W01_SHA" \
            --previous-pointer "$PREV_W02_POINTER"

      - name: Register published W02 state
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_update_zenodo_registry.R \
            --receipt outputs/workflow02_zenodo/zenodo_receipt.json \
            --registry docs/enrichment/zenodo_registry.csv \
            --pointer-dir docs/enrichment/zenodo
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/enrichment/zenodo_registry.csv docs/enrichment/zenodo/run-"$GITHUB_RUN_ID".json
          git commit -m "Register finalized Workflow 02 state run $GITHUB_RUN_ID"
          git pull --rebase origin workflow01-final-architecture
          git push origin HEAD:workflow01-final-architecture

      - name: Upload W02 to W03 handoff cache
        uses: actions/upload-artifact@v4
        with:
          name: workflow02-handoff-${{ github.run_id }}
          path: |
            outputs/workflow02/enriched.jsonl
            outputs/workflow02_state/state_manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload compact finalizer audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow02-serial-finalizer-${{ github.run_id }}
          path: |
            outputs/workflow02_state/
            outputs/w02_resume/
            outputs/workflow02_zenodo/zenodo_receipt.json
          retention-days: 90
          if-no-files-found: warn
