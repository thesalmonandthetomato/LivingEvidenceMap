name: Workflow 00 - Count-only search scoping

on:
  workflow_dispatch:
    inputs:
      search_string_path:
        description: 'Repository path to plain-text Boolean scoping search string'
        required: true
        default: 'user_input/scoping_search_string.txt'
        type: string

permissions:
  contents: read

concurrency:
  group: workflow00-search-scoping
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Workflow 00 implementation
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','rmarkdown','knitr'))

      - name: Parse scoping implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_00_validate_scoping_search.R')
          parse(file='scripts/updater/workflow_00_search_scope_counts.R')
          cat('PASS: Workflow 00 scoping scripts parse\n')

      - name: Validate Boolean scoping search string
        env:
          SEARCH_STRING: ${{ inputs.search_string_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SEARCH_STRING"
          mkdir -p outputs/workflow00_search_scope/plan
          Rscript scripts/updater/workflow_00_validate_scoping_search.R \
            --input "$SEARCH_STRING" \
            --output outputs/workflow00_search_scope/plan/search_plan.json

      - name: Run count-only API searches
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_search_scope_counts.R \
            --plan outputs/workflow00_search_scope/plan/search_plan.json \
            --lens-config config/lens_search.json \
            --output-csv outputs/workflow00_search_scope/search_scope_counts.csv \
            --output-json outputs/workflow00_search_scope/search_scope_counts.json

      - name: Render short R Markdown scoping report
        shell: Rscript {0}
        run: |
          rmarkdown::render(
            'docs/reporting/workflow_00/search_scoping_report.Rmd',
            output_file = 'search_scoping_report.html',
            output_dir = normalizePath('outputs/workflow00_search_scope', mustWork = TRUE),
            params = list(
              counts_csv = file.path(Sys.getenv('GITHUB_WORKSPACE'),'outputs/workflow00_search_scope/search_scope_counts.csv'),
              counts_json = file.path(Sys.getenv('GITHUB_WORKSPACE'),'outputs/workflow00_search_scope/search_scope_counts.json')
            ),
            quiet = TRUE
          )
          file.copy(
            'docs/reporting/workflow_00/search_scoping_report.Rmd',
            'outputs/workflow00_search_scope/search_scoping_report.Rmd',
            overwrite = TRUE
          )

      - name: Add counts to Actions summary
        shell: Rscript {0}
        run: |
          x <- read.csv('outputs/workflow00_search_scope/search_scope_counts.csv', stringsAsFactors=FALSE, na.strings='')
          fmt <- function(v) ifelse(is.na(v), '', format(as.integer(v), big.mark=',', scientific=FALSE))
          z <- c(
            '# Workflow 00 search scoping',
            '',
            '| Search source | Date | Hits | Status |',
            '|---|---|---:|---|',
            sprintf('| %s | %s | %s | %s |', x$source, x$search_date, fmt(x$hits), x$status),
            '',
            'Count-only run: no bibliographic result records or raw API responses were persisted.'
          )
          cat(paste(z, collapse='\n'), file=Sys.getenv('GITHUB_STEP_SUMMARY'))

      - name: Assert count-only output contract
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/workflow00_search_scope/plan/search_plan.json
          test -s outputs/workflow00_search_scope/search_scope_counts.csv
          test -s outputs/workflow00_search_scope/search_scope_counts.json
          test -s outputs/workflow00_search_scope/search_scoping_report.Rmd
          test -s outputs/workflow00_search_scope/search_scoping_report.html
          if find outputs/workflow00_search_scope -type f \( -name '*.ris' -o -name 'records.jsonl' -o -path '*/raw/*' \) -print -quit | grep -q .; then
            echo 'Count-only contract violated: search-result material was written.' >&2
            exit 1
          fi
          echo 'PASS: count-only scoping output contains reports/counts only'

      - name: Upload search scoping report
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-search-scoping-${{ github.run_id }}
          path: |
            outputs/workflow00_search_scope/plan/search_plan.json
            outputs/workflow00_search_scope/search_scope_counts.csv
            outputs/workflow00_search_scope/search_scope_counts.json
            outputs/workflow00_search_scope/search_scoping_report.Rmd
            outputs/workflow00_search_scope/search_scoping_report.html
          retention-days: 90
          if-no-files-found: error
