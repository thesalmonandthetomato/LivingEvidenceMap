name: TEMP OpenAlex sync-filter key test

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/_temp_wos_fortnightly_validation.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OpenAlex from_updated_date access
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/body.json -w '%{http_code}' -H "Authorization: Bearer $OPENALEX_API_KEY" "https://api.openalex.org/works?filter=from_updated_date:2026-09-21&per-page=1")"
          echo "HTTP_STATUS=$code"
          python3 - <<'PY'
import json
x=json.load(open('/tmp/body.json'))
print("META_COUNT=", (x.get("meta") or {}).get("count"))
print("ERROR=", x.get("error"))
print("MESSAGE=", x.get("message"))
PY
          if [ "$code" -ge 400 ]; then exit 1; fi
