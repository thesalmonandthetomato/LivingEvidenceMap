name: TEMP five-source fortnightly integration

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/_temp_wos_fortnightly_validation.yml

permissions:
  contents: write
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/workflow_00_search_orchestrator.yml
    with:
      run_type: fortnightly
      lens: true
      scopus: true
      openalex: true
      agricola: true
      wos: true
      additional_farm_term: ''
      resume_run_id: ''
    secrets: inherit

# five-source integration validation rerun after empty AGRICOLA fix
