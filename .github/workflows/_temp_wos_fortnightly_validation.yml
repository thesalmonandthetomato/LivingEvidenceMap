name: TEMP all-source expansion integration validation

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/_temp_wos_fortnightly_validation.yml

permissions:
  contents: write
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/workflow_00_search_orchestrator.yml
    with:
      run_type: expansion
      lens: true
      scopus: true
      openalex: true
      agricola: true
      wos: true
      additional_farm_term: 'maricultur*'
      resume_run_id: ''
    secrets: inherit
