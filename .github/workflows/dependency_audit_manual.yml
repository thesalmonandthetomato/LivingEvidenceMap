name: Dependency audit (manual, read-only)
on:
  workflow_dispatch:
  push:
    branches: [audit-runtime-dependencies]
    paths:
      - 'docs/dependency_audit/.run_inventory'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-runtime-dependencies
          persist-credentials: false
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Checkout Shiny app for read-only inspection
        uses: actions/checkout@v4
        with:
          repository: thesalmonandthetomato/LivingEvidenceMapAdjudication
          ref: main
          path: shiny_app
          persist-credentials: false
      - name: Validate diagnostic script
        run: |
          Rscript -e 'parse(file="scripts/updater/audit_runtime_dependencies.R"); cat("PASS: R parser\\n")'
      - name: Build read-only dependency census
        run: Rscript scripts/updater/audit_runtime_dependencies.R . outputs/dependency_audit
      - name: Audit Shiny dependencies
        run: Rscript scripts/updater/audit_shiny_dependencies.R shiny_app outputs/dependency_audit
      - name: Install syscall tracer for diagnostic smoke test
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq strace
          fi
      - name: Smoke-test file-access tracing
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/updater/trace_file_access.R")'
          Rscript scripts/updater/trace_file_access.R outputs/dependency_trace_smoke -- Rscript -e 'p<-normalizePath("scripts/updater/audit_runtime_dependencies.R"); invisible(readLines(p)); writeLines("trace", file.path(getwd(), "outputs/dependency_trace_smoke/fixture_written.txt"))'
          test -s outputs/dependency_trace_smoke/runtime_file_access.csv
          grep -q 'audit_runtime_dependencies.R' outputs/dependency_trace_smoke/runtime_file_access.csv
          grep -q 'fixture_written.txt' outputs/dependency_trace_smoke/runtime_file_access.csv
      - name: Validate report files
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/dependency_audit/dependency_edges.csv
          test -s outputs/dependency_audit/file_inventory.csv
          test -s outputs/dependency_audit/entry_points.csv
          test -s outputs/dependency_audit/shiny_edges.csv
          test -s outputs/dependency_audit/shiny_inventory.csv
          test -s outputs/dependency_audit/review_queue.csv
          test -s outputs/dependency_audit/README.txt
          grep -q 'No deletion decisions allowed' outputs/dependency_audit/README.txt
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: outputs/dependency_audit/
          retention-days: 30
          if-no-files-found: error
