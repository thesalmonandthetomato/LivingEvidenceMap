name: Dependency audit (manual, read-only)
on:
  workflow_dispatch:
  push:
    branches: [audit-runtime-dependencies]
    paths:
      - 'docs/dependency_audit/.run_inventory'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-runtime-dependencies
          persist-credentials: false
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate diagnostic script
        run: |
          Rscript -e 'parse(file="scripts/updater/audit_runtime_dependencies.R"); cat("PASS: R parser\\n")'
      - name: Build read-only dependency census
        run: Rscript scripts/updater/audit_runtime_dependencies.R . outputs/dependency_audit
      - name: Validate report files
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/dependency_audit/dependency_edges.csv
          test -s outputs/dependency_audit/file_inventory.csv
          test -s outputs/dependency_audit/README.txt
          grep -q 'Do not delete files' outputs/dependency_audit/README.txt
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: outputs/dependency_audit/
          retention-days: 30
          if-no-files-found: error
