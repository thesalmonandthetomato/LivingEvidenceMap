name: Dependency audit (manual, read-only)
on:
  workflow_dispatch:
  push:
    branches: [audit-runtime-dependencies]
    paths:
      - 'docs/dependency_audit/.run_inventory'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-runtime-dependencies
          persist-credentials: false
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Checkout Shiny app for read-only inspection
        uses: actions/checkout@v4
        with:
          repository: thesalmonandthetomato/LivingEvidenceMapAdjudication
          ref: main
          path: shiny_app
          persist-credentials: false
      - name: Validate diagnostic script
        run: |
          Rscript -e 'parse(file="scripts/updater/audit_runtime_dependencies.R"); cat("PASS: R parser\\n")'
      - name: Build read-only dependency census
        run: Rscript scripts/updater/audit_runtime_dependencies.R . outputs/dependency_audit
      - name: Audit Shiny dependencies
        run: Rscript scripts/updater/audit_shiny_dependencies.R shiny_app outputs/dependency_audit
      - name: Install syscall tracer for diagnostic smoke test
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq strace
          fi
      - name: Smoke-test file-access tracing
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/updater/trace_file_access.R")'
          Rscript scripts/updater/trace_file_access.R outputs/dependency_trace_smoke -- Rscript -e 'p<-normalizePath("scripts/updater/audit_runtime_dependencies.R"); invisible(readLines(p)); writeLines("trace", file.path(getwd(), "outputs/dependency_trace_smoke/fixture_written.txt"))'
          test -s outputs/dependency_trace_smoke/runtime_file_access.csv
          grep -q 'audit_runtime_dependencies.R' outputs/dependency_trace_smoke/runtime_file_access.csv
          grep -q 'fixture_written.txt' outputs/dependency_trace_smoke/runtime_file_access.csv
      - name: Smoke-test W00 opt-in R wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/updater/run_rscript_with_optional_trace.sh
          mkdir -p outputs/dependency_trace_wrapper_test
          printf '%s\n' 'invisible(readLines(normalizePath("scripts/updater/workflow_00_search_orchestrator.R")))' 'writeLines("ok",file.path(getwd(),"outputs/dependency_trace_wrapper_test/fixture.txt"))' > outputs/dependency_trace_wrapper_test/fixture.R
          DEPENDENCY_TRACE=false bash scripts/updater/run_rscript_with_optional_trace.sh outputs/dependency_trace_wrapper_test/fixture.R
          DEPENDENCY_TRACE=true DEPENDENCY_TRACE_DIR=outputs/dependency_trace_wrapper_test bash scripts/updater/run_rscript_with_optional_trace.sh outputs/dependency_trace_wrapper_test/fixture.R
          test -s outputs/dependency_trace_wrapper_test/fixture.R.trace/runtime_file_access.csv
          grep -q 'workflow_00_search_orchestrator.R' outputs/dependency_trace_wrapper_test/fixture.R.trace/runtime_file_access.csv
      - name: Check W00 workflow YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/workflow_00_search_orchestrator.yml"); puts "YAML valid"'
      - name: Trace actual W00 planning without API searches
        shell: bash
        env:
          DEPENDENCY_TRACE: 'true'
          DEPENDENCY_TRACE_DIR: outputs/w00_planning_trace
          W00_GROUP_CORE_MULTIDISCIPLINARY: 'true'
          W00_GROUP_HEALTH_MEDICINE: 'false'
          W00_GROUP_ENVIRONMENT_AGRICULTURE: 'false'
          W00_GROUP_SOCIAL_SCIENCES: 'false'
          W00_GROUP_EDUCATION: 'false'
          W00_GROUP_REGIONAL: 'false'
          W00_GROUP_MEDIA_COMMUNICATION: 'false'
          W00_GROUP_HUMANITIES: 'false'
          W00_GROUP_SPORT_TOURISM: 'false'
          W00_GROUP_GREY_PREPRINTS: 'false'
          W00_ADDITIONAL_SOURCES: ''
          W00_EXCLUDE_SOURCES: ''
        run: |
          set -euo pipefail
          mkdir -p outputs/dependency_audit/w00_plan
          bash scripts/updater/run_rscript_with_optional_trace.sh scripts/updater/workflow_00_resolve_source_selection.R \
            --run-type expansion \
            --saved data/workflow00/source_selection.json \
            --output outputs/dependency_audit/w00_plan/source_selection.json \
            --ebsco-config config/workflow00_ebsco_sources.json \
            --group-config config/workflow00_source_groups.json
          bash scripts/updater/run_rscript_with_optional_trace.sh scripts/updater/workflow_00_search_orchestrator.R \
            --run-type expansion \
            --additional-search-term 'OR maricultur*' \
            --config user_input/workflow00_search_strategy.json \
            --output-dir outputs/dependency_audit/w00_plan
          test -s outputs/w00_planning_trace/workflow_00_resolve_source_selection.R.trace/runtime_file_access.csv
          test -s outputs/w00_planning_trace/workflow_00_search_orchestrator.R.trace/runtime_file_access.csv
          cp outputs/w00_planning_trace/workflow_00_resolve_source_selection.R.trace/runtime_file_access.csv outputs/dependency_audit/w00_selection_file_access.csv
          cp outputs/w00_planning_trace/workflow_00_search_orchestrator.R.trace/runtime_file_access.csv outputs/dependency_audit/w00_search_planning_file_access.csv
      - name: Validate report files
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/dependency_audit/dependency_edges.csv
          test -s outputs/dependency_audit/file_inventory.csv
          test -s outputs/dependency_audit/entry_points.csv
          test -s outputs/dependency_audit/shiny_edges.csv
          test -s outputs/dependency_audit/shiny_inventory.csv
          test -s outputs/dependency_audit/review_queue.csv
          test -s outputs/dependency_audit/README.txt
          grep -q 'No deletion decisions allowed' outputs/dependency_audit/README.txt
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: outputs/dependency_audit/
          retention-days: 30
          if-no-files-found: error
