name: One-time index2 preview assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/index2_preview_assets_once.yml'
permissions:
  contents: read
jobs:
  preview-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','readr','digest','httr2'))
      - name: Resolve authoritative W08 pointer
        shell: Rscript {0}
        run: |
          library(jsonlite)
          reg <- read.csv('docs/workflow08/zenodo_registry.csv',stringsAsFactors=FALSE)
          auth <- reg[reg$status=='authoritative',,drop=FALSE]
          stopifnot(nrow(auth)==1L)
          p <- sprintf('docs/workflow08/zenodo/run-%s.json',auth$source_run_id[[1L]])
          x <- fromJSON(p,simplifyVector=FALSE)
          stopifnot(identical(x$status,'published'),identical(x$workflow,'08'),
                    identical(as.character(x$zenodo_record_id),as.character(auth$zenodo_record_id[[1L]])))
          cat(sprintf('W08_POINTER=%s\n',p),file=Sys.getenv('GITHUB_ENV'),append=TRUE)
      - name: Restore canonical evidence, build preview payload and index
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/index2 outputs/index2
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R \
            --pointer "$W08_POINTER" \
            --output inputs/index2/canonical.jsonl
          Rscript R/workflow_10_dashboard_from_canonical_jsonl.R \
            inputs/index2/canonical.jsonl \
            outputs/index2/internal.csv \
            outputs/index2/internal-data.js \
            "$W08_POINTER"
          Rscript R/workflow_10_make_public_dashboard.R \
            outputs/index2/internal-data.js \
            inputs/index2/canonical.jsonl \
            outputs/index2/index2-data.js
          Rscript R/workflow_10_build_search_trial.R \
            outputs/index2/index2-data.js \
            inputs/index2/canonical.jsonl \
            outputs/index2/trial-data.js \
            outputs/index2/dashboard-search-index.js
          test -s outputs/index2/index2-data.js
          test -s outputs/index2/dashboard-search-index.js
      - name: Check preview index against public record order
        shell: Rscript {0}
        run: |
          library(jsonlite)
          unjs <- function(p,prefix) {
            s <- paste(readLines(p,warn=FALSE),collapse='\n')
            stopifnot(startsWith(s,prefix),endsWith(s,';'))
            fromJSON(substr(s,nchar(prefix)+1L,nchar(s)-1L),simplifyVector=FALSE)
          }
          d <- unjs('outputs/index2/index2-data.js','window.LIVING_EVIDENCE_MAP_DASHBOARD_DATA=')
          ix <- unjs('outputs/index2/dashboard-search-index.js','window.LIVING_EVIDENCE_MAP_ABSTRACT_INDEX=')
          stopifnot(length(d$records)==length(ix$record_ids))
          ids <- vapply(d$records,function(x)as.character(x$record_id),character(1))
          stopifnot(identical(ids,unlist(ix$record_ids,use.names=FALSE)))
          stopifnot(all(vapply(d$records,function(x)is.null(x[['abstract',exact=TRUE]]),logical(1))))
          cat(sprintf('PASS: %d aligned records; no full abstracts in public table\n',length(ids)))
      - name: Publish preview assets only
        uses: actions/checkout@v4
        with:
          repository: thesalmonandthetomato/salmonevidencemap
          ref: main
          token: ${{ secrets.SALMON_EVIDENCE_MAP_PUBLISH_TOKEN }}
          path: preview-public
          fetch-depth: 0
      - name: Commit preview data, leave live dashboard untouched
        shell: bash
        run: |
          set -euo pipefail
          cp outputs/index2/index2-data.js preview-public/index2-data.js
          cp outputs/index2/dashboard-search-index.js preview-public/dashboard-search-index.js
          cd preview-public
          test -s index2.html
          grep -q './index2-data.js' index2.html
          grep -q './dashboard-search-index.js' index2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index2-data.js dashboard-search-index.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish isolated Boolean-search index2 preview assets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
