name: TEMP validate W01 repeated-abstract guard

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w01_repeated_abstract_guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','stringdist','digest','xml2','stringi','data.table','yaml'))
      - name: Parse implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_01_deduplication_incremental_candidates.R')
          parse(file='scripts/updater/workflow_01_apply_adjudications_and_recluster.R')
          yaml::yaml.load_file('.github/workflows/workflow_01_production.yml')
          cat('PASS: W01 repair scripts and workflow parse\n')
      - name: Build synthetic source
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create('/tmp/w01guard',recursive=TRUE,showWarnings=FALSE)
          rows <- list()
          add <- function(id,title,abstract,doi,year,author){
            list(
              source=list(provider='synthetic'),
              sidecar_identity=list(sidecar_record_id=id,source_record_id=id,doi=doi),
              mapped_fields=list(title=title,abstract=abstract,doi=doi,year=as.character(year),
                                 authors=list(list(full_name=author)),source='Synthetic Journal')
            )
          }
          rows[[1]] <- add('old-1','Historical distinct title','Historical distinct abstract','10.1/old',2020,'Old Author')
          for(i in 1:55) rows[[length(rows)+1L]] <- add(
            sprintf('bad-%03d',i),
            sprintf('Completely distinct publication title number %03d',i),
            'PATHOLOGICAL SHARED ABSTRACT COPIED ACROSS MANY UNRELATED RECORDS',
            if(i<=20)sprintf('10.2/%03d',i) else NULL,
            1950 + (i %% 55),
            sprintf('Author %03d',i)
          )
          rows[[length(rows)+1L]] <- add('ok-a','Legitimate repeated title','Legitimate repeated abstract','10.3/a',2024,'Same Author')
          rows[[length(rows)+1L]] <- add('ok-b','Legitimate repeated title','Legitimate repeated abstract','10.3/b',2024,'Same Author')
          con<-file('/tmp/w01guard/source.jsonl','wt')
          for(z in rows) writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con)
          close(con)
          write.csv(data.frame(idx=1L,source='synthetic',source_record_id='old-1'),
                    '/tmp/w01guard/old.csv',row.names=FALSE)
      - name: Run metadata-only candidate preparation
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_deduplication_incremental_candidates.R             --input synthetic=/tmp/w01guard/source.jsonl             --old-metadata /tmp/w01guard/old.csv             --output-dir /tmp/w01guard/out             --validate-index-only true
      - name: Validate quarantine
        shell: Rscript {0}
        run: |
          library(data.table);library(jsonlite)
          g<-fread('/tmp/w01guard/out/pathological_repeated_abstract_groups.csv')
          stopifnot(nrow(g)==1L,g$records[[1]]==55L,g$new_records[[1]]==55L,g$unique_titles[[1]]==55L)
          acts<-readLines('/tmp/w01guard/out/pathological_abstract_strip_actions.jsonl')
          stopifnot(length(acts)==55L)
          m<-fread('/tmp/w01guard/out/normalised_metadata.csv',na.strings=c('','NA'))
          stopifnot(all(is.na(m$abstract_hash[m$source_record_id %in% sprintf('bad-%03d',1:55)])))
          stopifnot(all(!is.na(m$abstract_hash[m$source_record_id %in% c('ok-a','ok-b')])))
          w<-readLines('.github/workflows/workflow_01_production.yml',warn=FALSE)
          stopifnot(any(grepl('default: 5000',w,fixed=TRUE)))
          stopifnot(any(grepl('LLM safety ceiling exceeded',w,fixed=TRUE)))
          stopifnot(any(grepl('outputs/adjudication/chunks/',w,fixed=TRUE)))
          cat('PASS: pathological repeated abstracts quarantined; ordinary repeated pair retained; LLM hard ceiling/checkpoint present\n')
