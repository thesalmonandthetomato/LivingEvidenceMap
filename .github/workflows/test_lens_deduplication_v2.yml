name: Test updater Workflow 02 - JSONL deduplication

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation test or full canonical audit/resolution'
        required: true
        default: validation_test
        type: choice
        options: [validation_test, canonical_audit]

permissions:
  contents: read
  actions: read

jobs:
  deduplication-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow 02 branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-02-deduplication

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build validation fixture
        if: ${{ inputs.mode == 'validation_test' }}
        run: |
          python - <<'PY'
          import json
          p={'identity':{'lens_id':'preprint','record_id':'preprint'},'canonical':{'record_id':'preprint','lens_id':'preprint','title':'Minimizing marine resource utilization in diets of farmed Atlantic salmon: effects on growth and tissue composition','authors':'Foroutani, M. B.','year':2017,'source':'','doi':'','abstract':'Due to limited fish meal and fish oil resources and high costs for aquaculture, seven diets containing different protein and lipid sources were formulated for farmed Atlantic salmon. Growth performance, tissue lipid class and fatty acid composition were examined. The diet with the lowest fish meal and fish oil produced the lowest weight gain. Fish meal could be reduced to 5 percent without affecting growth provided at least 5 percent fish oil remained.'}}
          j={'identity':{'lens_id':'journal','record_id':'journal'},'canonical':{'record_id':'journal','lens_id':'journal','title':'Minimizing marine ingredients in diets of farmed Atlantic salmon (Salmo salar): Effects on growth performance and muscle lipid and fatty acid composition','authors':'Foroutani, M. B. | Parrish, C. C. | Wells, J.','year':2018,'source':'Journal of Aquaculture Nutrition','doi':'10.1101/328716','abstract':'Due to limited fish meal and fish oil resources and high costs for the aquaculture industry, seven diets with different protein and lipid sources were formulated for farmed Atlantic salmon. Growth performance, muscle lipid class and fatty acid composition were examined. The diet containing the lowest fish meal and fish oil resulted in the lowest weight gain. Fish meal could be reduced to 5 percent without affecting growth provided a minimum 5 percent fish oil remained.'}}
          with open('fixture.jsonl','w') as f:
              for r in (p,j): f.write(json.dumps(r)+'\n')
          PY

      - name: Validate classification and lossless resolution annotations
        if: ${{ inputs.mode == 'validation_test' }}
        run: |
          mkdir -p outputs/workflow02
          python scripts/updater/audit_canonical_duplicates.py --input fixture.jsonl --output outputs/workflow02/candidates.jsonl --summary outputs/workflow02/classification_summary.json
          python scripts/updater/resolve_canonical_duplicates.py --canonical fixture.jsonl --candidates outputs/workflow02/candidates.jsonl --output outputs/workflow02/annotated_records.jsonl --queue outputs/workflow02/adjudication_queue.jsonl --audit outputs/workflow02/resolution_audit.json --summary outputs/workflow02/resolution_summary.json
          python - <<'PY'
          import json
          c=[json.loads(x) for x in open('outputs/workflow02/candidates.jsonl') if x.strip()]
          r=[json.loads(x) for x in open('outputs/workflow02/annotated_records.jsonl') if x.strip()]
          q=[json.loads(x) for x in open('outputs/workflow02/adjudication_queue.jsonl') if x.strip()]
          assert len(c)==1 and c[0]['status']=='probable_duplicate', c
          assert c[0]['manifestation_pattern']=='preprint_or_repository_to_later_manifestation', c
          assert len(r)==2 and not q, (r,q)
          by={x['canonical']['lens_id']:x for x in r}
          assert by['journal']['deduplication']['status']=='canonical'
          assert by['journal']['deduplication']['downstream_eligible'] is True
          assert by['journal']['deduplication']['duplicate_members']==['preprint']
          assert by['preprint']['deduplication']['status']=='duplicate'
          assert by['preprint']['deduplication']['downstream_eligible'] is False
          assert by['preprint']['deduplication']['duplicate_of']=='journal'
          assert 'merged_records' not in by['journal']['deduplication']
          assert 'merged_records' not in by['preprint']['deduplication']
          s=json.load(open('outputs/workflow02/resolution_summary.json'))
          assert s['input_records']==2 and s['output_records']==2
          assert s['records_removed']==0 and s['records_nested']==0
          print('Workflow 02 lossless single-JSON architecture validated')
          PY

      - name: Checkout canonical JSON with LFS
        if: ${{ inputs.mode == 'canonical_audit' }}
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          path: canonical_store

      - name: Run canonical classification and annotation proposal
        if: ${{ inputs.mode == 'canonical_audit' }}
        run: |
          mkdir -p outputs/workflow02
          SRC=canonical_store/data/canonical/current/repair/records.jsonl
          test -f "$SRC"
          python scripts/updater/audit_canonical_duplicates.py --input "$SRC" --output outputs/workflow02/candidates.jsonl --summary outputs/workflow02/classification_summary.json
          python scripts/updater/resolve_canonical_duplicates.py --canonical "$SRC" --candidates outputs/workflow02/candidates.jsonl --output outputs/workflow02/annotated_records.jsonl --queue outputs/workflow02/adjudication_queue.jsonl --audit outputs/workflow02/resolution_audit.json --summary outputs/workflow02/resolution_summary.json
          python - <<'PY'
          import json
          ids={'154-579-994-777-836','011-403-740-852-889'}
          c=[json.loads(x) for x in open('outputs/workflow02/candidates.jsonl') if x.strip()]
          assert any({r.get('lens_id'),r.get('matched_master_lens_id')}==ids for r in c)
          s=json.load(open('outputs/workflow02/resolution_summary.json'))
          assert s['canonical_source_modified'] is False
          assert s['output_is_annotated_single_jsonl'] is True
          assert s['output_records']==s['input_records']
          assert s['records_removed']==0 and s['records_nested']==0
          print(json.dumps(s,indent=2))
          PY

      - name: Upload Workflow 02 artefacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow02-${{ inputs.mode }}-${{ github.run_id }}
          path: outputs/workflow02/
          if-no-files-found: error
          retention-days: 30
