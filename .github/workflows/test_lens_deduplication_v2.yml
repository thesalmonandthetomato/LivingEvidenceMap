name: Test updater Workflow 02 - JSONL deduplication

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deduplication-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow 02 development branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-02-deduplication
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download successful Workflow 01 Lens artefact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33107953267
          name: updater-workflow-01-lens-ingestion-33107953267
          path: workflow01_artifact
      - name: Prepare real Lens test fixture
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('workflow01_artifact/records.jsonl').open(encoding='utf-8') if x.strip()][:50]
          assert len(rows)==50; rows.append(copy.deepcopy(rows[0])); doi_row=next(r for r in rows[:50] if any(i.get('type')=='doi' for i in r['lens']['raw_payload'].get('external_ids',[])))
          different=copy.deepcopy(doi_row); different['identity']['lens_id']=different['identity']['record_id']='fixture-different-doi'; different['lens']['raw_payload']['lens_id']='fixture-different-doi'
          for i in different['lens']['raw_payload'].get('external_ids',[]):
              if i.get('type')=='doi':i['value']='10.0000/different-test'
          rows.append(different); wrong=copy.deepcopy(doi_row); wrong['identity']['lens_id']=wrong['identity']['record_id']='fixture-wrong-doi'; wrong['lens']['raw_payload']['lens_id']='fixture-wrong-doi'; wrong['lens']['raw_payload']['title']='Deliberately unrelated publication used to test DOI safety'; wrong['lens']['raw_payload']['authors']=[{'first_name':'Different','last_name':'Author'}]; rows.append(wrong)
          with open('fixture.jsonl','w',encoding='utf-8') as f:
              for r in rows:f.write(json.dumps(r,ensure_ascii=False)+'\n')
          PY
      - name: Convert current master CSV to lossless JSONL view
        run: |
          mkdir -p outputs/updater/legacy_master_adapter
          python scripts/legacy_master_adapter.py --input 'data/master/current/living_evidence_map_master CORRECTED.csv' --output outputs/updater/legacy_master_adapter/master_legacy_view.jsonl > outputs/updater/legacy_master_adapter/adapter_summary.json
          python -c "import json; assert json.load(open('outputs/updater/legacy_master_adapter/adapter_summary.json'))['rows']==13389"
      - name: Run Workflow 02 with frequent checkpoints
        run: |
          mkdir -p outputs/updater/deduplication_test
          python scripts/updater/deduplicate_jsonl.py --input fixture.jsonl --master outputs/updater/legacy_master_adapter/master_legacy_view.jsonl --output outputs/updater/deduplication_test/records_after_dedup.jsonl --audit outputs/updater/deduplication_test/dedup_audit.jsonl --checkpoint outputs/updater/deduplication_test/checkpoint.json --chunk-size 10
      - name: Validate checkpoint and outputs
        run: |
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('outputs/updater/deduplication_test/records_after_dedup.jsonl',encoding='utf-8') if x.strip()]; cp=json.load(open('outputs/updater/deduplication_test/checkpoint.json'))
          assert len(rows)==53 and cp['completed_records']==53 and cp['next_record_index']==53 and cp['chunk_size']==10
          assert any(r['deduplication']['status']=='identity_match' for r in rows); wrong=next(r for r in rows if r['identity']['lens_id']=='fixture-wrong-doi'); assert wrong['deduplication']['status']!='duplicate'
          PY
      - name: Test Workflow 02 resume is idempotent at completed checkpoint
        run: |
          python scripts/updater/deduplicate_jsonl.py --input fixture.jsonl --master outputs/updater/legacy_master_adapter/master_legacy_view.jsonl --output outputs/updater/deduplication_test/records_after_dedup.jsonl --audit outputs/updater/deduplication_test/dedup_audit.jsonl --checkpoint outputs/updater/deduplication_test/checkpoint.json --chunk-size 10 --resume
          test "$(grep -c . outputs/updater/deduplication_test/records_after_dedup.jsonl)" -eq 53
      - name: Upload Workflow 02 artefacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-workflow-02-deduplication-${{ github.run_id }}
          path: outputs/updater/
          if-no-files-found: error
          retention-days: 90
