name: Test updater Workflow 02 - JSONL deduplication

on:
  workflow_dispatch:
    inputs:
      fixture_records:
        description: 'Retained for compatibility; real Lens fixture is fixed-size'
        required: true
        default: '20'

permissions:
  contents: read

jobs:
  deduplication-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow 02 development branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-02-deduplication

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare real Lens-derived fixture
        run: |
          cp tests/fixtures/workflow02_real_lens_sample.jsonl fixture.jsonl
          python - <<'PY'
          import copy, json
          rows = [json.loads(x) for x in open('fixture.jsonl', encoding='utf-8')]
          # Deliberate Lens identity repeat: identity match, not duplicate.
          rows.append(copy.deepcopy(rows[0]))
          # Same bibliography with a different DOI: duplicate candidate; DOI is not decisive.
          different_doi = copy.deepcopy(rows[2])
          different_doi['identity']['lens_id'] = 'fixture-different-doi'
          different_doi['identity']['record_id'] = 'fixture-different-doi'
          different_doi['lens']['raw_payload']['lens_id'] = 'fixture-different-doi'
          for identifier in different_doi['lens']['raw_payload'].get('external_ids', []):
              if identifier.get('type') == 'doi':
                  identifier['value'] = '10.0000/different-test'
          rows.append(different_doi)
          with open('fixture.jsonl', 'w', encoding='utf-8') as f:
              for row in rows:
                  f.write(json.dumps(row, ensure_ascii=False) + '\n')
          PY

      - name: Run Workflow 02 prototype
        run: |
          mkdir -p outputs/updater/deduplication_test
          python scripts/updater/deduplicate_jsonl.py \
            --input fixture.jsonl \
            --output outputs/updater/deduplication_test/records_after_dedup.jsonl \
            --audit outputs/updater/deduplication_test/dedup_audit.jsonl

      - name: Validate real Lens structure and DOI safeguards
        run: |
          python - <<'PY'
          import json
          rows = [json.loads(x) for x in open('outputs/updater/deduplication_test/records_after_dedup.jsonl', encoding='utf-8')]
          assert len(rows) == 7, len(rows)
          assert any(r['deduplication']['status'] == 'identity_match' for r in rows)
          assert any(r['deduplication']['status'] == 'duplicate_candidate' for r in rows)
          wrong_doi = next(r for r in rows if r['identity']['lens_id'] == 'fixture-wrong-doi')
          assert wrong_doi['deduplication']['status'] == 'unique'
          different_doi = next(r for r in rows if r['identity']['lens_id'] == 'fixture-different-doi')
          assert different_doi['deduplication']['status'] == 'duplicate_candidate'
          assert all(r['deduplication']['decision_source'] != 'doi' for r in rows)
          assert all(r['source']['provider'] == 'lens' for r in rows)
          print(f'Validated {len(rows)} real Lens-derived records and DOI safety rules')
          PY

      - name: Upload Workflow 02 artefacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-workflow-02-deduplication-${{ github.run_id }}
          path: outputs/updater/deduplication_test/
          if-no-files-found: error
          retention-days: 30
