name: Test updater Workflow 02 - JSONL deduplication

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deduplication-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow 02 development branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-02-deduplication

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download successful Workflow 01 Lens artefact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33107953267
          name: updater-workflow-01-lens-ingestion-33107953267
          path: workflow01_artifact

      - name: Prepare real Lens test fixture
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          src = Path('workflow01_artifact/records.jsonl')
          rows = [json.loads(x) for x in src.open(encoding='utf-8') if x.strip()][:50]
          assert len(rows) == 50
          rows.append(copy.deepcopy(rows[0]))
          doi_row = next(r for r in rows[:50] if any(i.get('type') == 'doi' for i in r['lens']['raw_payload'].get('external_ids', [])))
          different_doi = copy.deepcopy(doi_row)
          different_doi['identity']['lens_id'] = 'fixture-different-doi'
          different_doi['identity']['record_id'] = 'fixture-different-doi'
          different_doi['lens']['raw_payload']['lens_id'] = 'fixture-different-doi'
          for identifier in different_doi['lens']['raw_payload'].get('external_ids', []):
              if identifier.get('type') == 'doi': identifier['value'] = '10.0000/different-test'
          rows.append(different_doi)
          wrong_doi = copy.deepcopy(doi_row)
          wrong_doi['identity']['lens_id'] = 'fixture-wrong-doi'
          wrong_doi['identity']['record_id'] = 'fixture-wrong-doi'
          wrong_doi['lens']['raw_payload']['lens_id'] = 'fixture-wrong-doi'
          wrong_doi['lens']['raw_payload']['title'] = 'Deliberately unrelated publication used to test DOI safety'
          wrong_doi['lens']['raw_payload']['authors'] = [{'first_name': 'Different', 'last_name': 'Author'}]
          rows.append(wrong_doi)
          with open('fixture.jsonl', 'w', encoding='utf-8') as f:
              for row in rows: f.write(json.dumps(row, ensure_ascii=False) + '\n')
          print(f'Prepared {len(rows)} records from actual Workflow 01 Lens artefact')
          PY

      - name: Prepare historical master fixture
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows = []
          master = Path('data/master/current/living_evidence_map_master.csv')
          if not master.exists():
              raise SystemExit('Current master CSV not available on Workflow 02 branch')
          with master.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames or []
              required = {'record_id','title','authors','year','doi'}
              missing = required - set(fields)
              if missing:
                  raise SystemExit(f'Master fixture missing required fields: {sorted(missing)}')
              for i, r in enumerate(reader):
                  if i >= 100: break
                  raw = dict(r)
                  # Adapter shape expected by Workflow 02.
                  rows.append({
                      'identity': {'lens_id': raw.get('record_id') or f'legacy-{i+1:04d}', 'record_id': raw.get('record_id')},
                      'lens': {'raw_payload': {
                          'title': raw.get('title'),
                          'year_published': raw.get('year'),
                          'authors': ([{'last_name': raw.get('authors')}] if raw.get('authors') else []),
                          'external_ids': ([{'type': 'doi', 'value': raw.get('doi')}] if raw.get('doi') else []),
                          'source': {'title': raw.get('journal')} if raw.get('journal') else {}
                      }},
                      'legacy_master': raw
                  })
          with open('historical_fixture.jsonl','w',encoding='utf-8') as f:
              for r in rows: f.write(json.dumps(r, ensure_ascii=False) + '\n')
          print(f'Prepared {len(rows)} historical master records')
          PY

      - name: Run Workflow 02 prototype
        run: |
          mkdir -p outputs/updater/deduplication_test
          python scripts/updater/deduplicate_jsonl.py \
            --input fixture.jsonl \
            --master historical_fixture.jsonl \
            --output outputs/updater/deduplication_test/records_after_dedup.jsonl \
            --audit outputs/updater/deduplication_test/dedup_audit.jsonl

      - name: Validate every JSONL output line
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('outputs/updater/deduplication_test/records_after_dedup.jsonl')
          rows=[]
          for line_no,line in enumerate(path.open(encoding='utf-8'),1):
              if not line.strip(): continue
              try: rows.append(json.loads(line))
              except json.JSONDecodeError as exc: raise SystemExit(f'Invalid JSONL at line {line_no}: {exc}')
          assert len(rows)==53, len(rows)
          print(f'Parsed {len(rows)} JSONL records successfully')
          PY

      - name: Validate identity, bibliography and DOI safeguards
        run: |
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('outputs/updater/deduplication_test/records_after_dedup.jsonl',encoding='utf-8') if x.strip()]
          assert any(r['deduplication']['status']=='identity_match' for r in rows)
          assert any(r['deduplication']['status'] in {'duplicate_candidate','probable_duplicate','possible_duplicate','duplicate'} for r in rows)
          assert all(r['deduplication']['decision_source']!='doi' for r in rows)
          wrong_doi=next(r for r in rows if r['identity']['lens_id']=='fixture-wrong-doi')
          assert wrong_doi['deduplication']['status'] not in {'duplicate'}
          print(f'Validated {len(rows)} records and DOI safety rules')
          PY

      - name: Upload Workflow 02 artefacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-workflow-02-deduplication-${{ github.run_id }}
          path: outputs/updater/deduplication_test/
          if-no-files-found: error
          retention-days: 30
