name: TEMP Verify W01 Zenodo delta restore corrected
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_verify_w01_zenodo_delta_retry_20261124.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          Rscript -e 'install.packages(c("curl","httr2","jsonlite","digest"));stopifnot(all(vapply(c("curl","httr2","jsonlite","digest"),requireNamespace,logical(1),quietly=TRUE)))'
      - name: Download and verify real historical delta through repaired R code
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          Rscript - <<'RS' >/tmp/w01_delta_retry_test.log 2>&1
          suppressPackageStartupMessages({library(httr2);library(jsonlite);library(digest)})
          code <- parse("scripts/updater/workflow_01_restore_current_state.R")
          for (nm in c("auth","download_delta")) {
            hits <- Filter(function(x) is.call(x) && identical(x[[1L]],as.name("<-")) &&
                            identical(x[[2L]],as.name(nm)),as.list(code))
            stopifnot(length(hits)==1L)
            eval(hits[[1L]],envir=.GlobalEnv)
          }
          token <- Sys.getenv("ZENODO_ACCESS_TOKEN")
          stopifnot(nzchar(token))
          pointer <- jsonlite::fromJSON("docs/deduplication/zenodo/run-39140209398.json",simplifyVector=FALSE)
          dest <- tempfile("w01-delta-retry-")
          root <- download_delta(pointer,dest)
          stopifnot(file.exists(file.path(root,"delta_manifest.json")))
          stopifnot(all(file.exists(file.path(dest,"downloads",
            vapply(pointer$archive_files,function(z)z$filename,character(1))))))
          cat("PASS: real W01 historical delta and manifest retrieved and SHA256/MD5 validated\\n")
          RS
          code=$?
          cat /tmp/w01_delta_retry_test.log
          EXIT_CODE="$code" python3 - <<'PY'
          import os,json,base64,urllib.request
          d={'exit_code':int(os.environ['EXIT_CODE']),'log':open('/tmp/w01_delta_retry_test.log').read()[-12000:]}
          payload=json.dumps({'message':'TEMP record W01 Zenodo delta retry smoke test','content':base64.b64encode(json.dumps(d,indent=2).encode()).decode(),'branch':'workflow01-final-architecture'}).encode()
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/docs/.temp_w01_zenodo_delta_retry_test_20261124.json'
          req=urllib.request.Request(url,data=payload,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as res:print("RECEIPT",res.status)
          PY
          exit "$code"
