name: Test OpenAlex sidecar canonical compatibility

on:
  push:
    branches:
      - updater-workflow-00c-openalex-ingestion
    paths:
      - '.github/workflows/test_openalex_sidecar_adapter.yml'
      - 'scripts/updater/workflow_01u_openalex_sidecar_adapter.R'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sidecar-adapter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OpenAlex integration branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00c-openalex-ingestion

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Download successful OpenAlex OQL artefact
        uses: actions/download-artifact@v4
        with:
          name: updater-workflow-00c-openalex-ingestion-35496489271
          path: inputs/openalex_ingestion
          github-token: ${{ github.token }}
          repository: thesalmonandthetomato/LivingEvidenceMap
          run-id: 35496489271

      - name: Verify source artefact
        shell: bash
        run: |
          set -euo pipefail
          test -f inputs/openalex_ingestion/manifest.json
          test -d inputs/openalex_ingestion/raw
          find inputs/openalex_ingestion -maxdepth 2 -type f -print | sort

      - name: Build OpenAlex sidecar compatibility output
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01u_openalex_sidecar_adapter.R \
            --input-dir inputs/openalex_ingestion \
            --output-dir outputs/updater/openalex_sidecar_adapter

      - name: Guard against canonical writes
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/canonical/current/openalex_sidecar_records.jsonl
          test ! -e data/canonical/current/repair/openalex_sidecar_records.jsonl
          grep -q '"canonical_json_modified": false' outputs/updater/openalex_sidecar_adapter/compatibility_audit.json
          grep -q '"canonical_branch_written": false' outputs/updater/openalex_sidecar_adapter/compatibility_audit.json

      - name: Show compatibility audit
        shell: bash
        run: cat outputs/updater/openalex_sidecar_adapter/compatibility_audit.json

      - name: Upload sidecar diagnostic artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-sidecar-adapter-${{ github.run_id }}
          path: outputs/updater/openalex_sidecar_adapter/
          if-no-files-found: error
          retention-days: 30
