name: Temporary W04 combined-return preflight validation
on:
  push:
    paths:
      - '.github/workflows/w04-combined-return-preflight-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse combined W04 restoration and publication preflight
        run: |
          Rscript -e 'parse(file="scripts/updater/workflow_04_restore_shiny_combined.R");parse(file="scripts/updater/workflow_04_validate_combined_return.R")'
      - name: Confirm isolated pipeline files preserved
        run: |
          test -f scripts/updater/workflow_04_restore_shiny_subset.R
          test -f scripts/updater/workflow_04_publish_shiny_model_batch.R
          test -f .github/workflows/workflow_04_production.yml
          grep -q 'lem-w04-combined-restoration-v1' scripts/updater/workflow_04_validate_combined_return.R
