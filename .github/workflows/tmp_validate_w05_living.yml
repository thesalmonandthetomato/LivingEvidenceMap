name: Temporary - validate W05 living architecture

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'user_input/w05_living_validation.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('yaml','digest','dplyr','jsonlite','readr','tibble','testthat'))

      - name: Parse and regression-test W05
        shell: Rscript {0}
        run: |
          yaml::read_yaml('.github/workflows/workflow_05_production.yml')
          parse(file='scripts/updater/workflow_05_materialise_retained.R')
          parse(file='scripts/updater/workflow_05_species_coding.R')
          parse(file='scripts/updater/workflow_05_archive_state_to_zenodo.R')
          source('R/species_detect.R')
          testthat::test_file('tests/testthat/test-species.R',reporter='summary')
          cat('PASS: W05 permanent implementation parses and matcher regressions pass\n')

      - name: Build synthetic retained corpus
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create('tmp',showWarnings=FALSE)
          rows<-list(
            list(schema_version='living-evidence-map-canonical-v1',identity=list(record_id='A'),canonical=list(title='Atlantic salmon farming',abstract='Salmo salar in sea cages'),new_field=list(keep='yes')),
            list(schema_version='living-evidence-map-canonical-v1',identity=list(record_id='B'),canonical=list(title='Rainbow trout production',abstract='Oncorhynchus mykiss commercial aquaculture'),new_field=list(keep='yes')),
            list(schema_version='living-evidence-map-canonical-v1',identity=list(record_id='C'),canonical=list(title='Salmon aquaculture study',abstract='Commercial salmon production'),new_field=list(keep='yes')),
            list(schema_version='living-evidence-map-canonical-v1',identity=list(record_id='D'),canonical=list(title='Aquaculture economics',abstract='No species named here'),new_field=list(keep='yes'))
          )
          con<-file('tmp/canonical.jsonl','wt');for(z in rows)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con);close(con)
          writeLines(c('A','B','C','D'),'tmp/included.txt')

      - name: Test dynamic materialisation and coding
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_05_materialise_retained.R             --canonical tmp/canonical.jsonl             --included-ids tmp/included.txt             --output tmp/retained.jsonl

          Rscript scripts/updater/workflow_05_species_coding.R             --input tmp/retained.jsonl             --dictionary config/deterministic_concepts.csv             --output-dir tmp/w05

          Rscript -e '
            library(readr);library(jsonlite)
            x<-read_csv("tmp/w05/workflow05_species_coded.csv",show_col_types=FALSE)
            m<-fromJSON("tmp/w05/workflow05_manifest.json")
            stopifnot(nrow(x)==4L,as.integer(m$records)==4L,!anyDuplicated(x$record_id))
            stopifnot(grepl("SAL_SALAR",x$farmed_species_codes[x$record_id=="A"]))
            stopifnot(grepl("ONC_MYKISS",x$farmed_species_codes[x$record_id=="B"]))
            stopifnot(x$farmed_species_codes[x$record_id=="D"]=="NONE")
            raw<-readLines("tmp/retained.jsonl",warn=FALSE)
            rr<-lapply(raw,fromJSON,simplifyVector=FALSE)
            stopifnot(all(vapply(rr,function(z)z$new_field$keep=="yes",logical(1))))
            cat("PASS: W05 works on dynamic population and materialisation preserves additive canonical fields\n")
          '
