name: Temporary W04 combined routing validation
on:
  push:
    paths:
      - '.github/workflows/w04-combined-routing-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install YAML parser
        run: Rscript -e 'install.packages("yaml",repos="https://cloud.r-project.org")'
      - name: Parse production YAML and standalone R adapters
        run: |
          Rscript -e 'library(yaml); y<-yaml.load_file(".github/workflows/workflow_04_production.yml");stopifnot(is.list(y$jobs));parse(file="scripts/updater/workflow_04_restore_shiny_combined.R");parse(file="scripts/updater/workflow_04_validate_combined_return.R")'
      - name: Assert protected subset publisher and no combined dispatch launcher
        run: |
          test -f scripts/updater/workflow_04_restore_shiny_subset.R
          test -f scripts/updater/workflow_04_publish_shiny_model_batch.R
          grep -q 'shiny_combined' .github/workflows/workflow_04_production.yml
          grep -q "inputs.execution_pathway == 'shiny'" .github/workflows/workflow_04_production.yml
