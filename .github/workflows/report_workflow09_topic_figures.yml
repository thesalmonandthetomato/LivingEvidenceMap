name: Report - Workflow 09 topic figures only

on:
  workflow_dispatch:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/reporting/.run_workflow09_topic_figures'

permissions:
  contents: read

jobs:
  topic-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "jsonlite","dplyr","tidyr","readr","ggplot2",
            "scales","here","stringr","httr2","digest"
          ))

      - name: Restore authoritative Workflow 08 final canonical
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/reporting/restore_workflow08_reporting_state.R \
            --pointer docs/workflow08/zenodo/run-36329841121.json \
            --output-dir workflow08_reporting_state
          test -s workflow08_reporting_state/living_evidence_map_canonical_final.jsonl

      - name: Render topic figures only
        env:
          CANONICAL_JSONL: workflow08_reporting_state/living_evidence_map_canonical_final.jsonl
        shell: bash
        run: |
          set -euo pipefail
          Rscript visualisations/04_topic_hierarchy.R

      - name: Upload topic figure review bundle
        uses: actions/upload-artifact@v4
        with:
          name: workflow09-topic-figures-${{ github.run_id }}
          path: |
            visualisations/topic_hierarchy/*.png
            visualisations/topic_hierarchy/*.pdf
            visualisations/topic_hierarchy/*.csv
          retention-days: 30
          if-no-files-found: error
