name: W01-Fast direct-delta October equivalence (isolated)
# Recheck full October after schema fixture passed
# Validate preparation against current split-job W01 workflow
on:
  push:
    branches: [w01-fast-direct-delta]
    paths:
      - '.github/workflows/w01_fast_direct_october_equivalence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  october-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: w01-fast-direct-october-isolated
      cancel-in-progress: true
    env:
      W00_POINTER: docs/search_record/zenodo/run-39298022062.json
      PREV_W01_POINTER: docs/deduplication/zenodo/run-39140209398.json
      W00_SOURCES: lens,scopus,openalex,agricola,ethos,wos,ebsco_africa_wide,ebsco_amed,ebsco_psycinfo,ebsco_atla_religion,ebsco_biological_agricultural_index,ebsco_cinahl,ebsco_econlit,ebsco_family_society,ebsco_greenfile,ebsco_medline,ebsco_mla,ebsco_political_science,ebsco_waters_oceans
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      WORKFLOW01_BRANCH: workflow01-final-architecture
      WORKFLOW00_REPORTING_BRANCH: workflow01-final-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-direct-delta
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          path: workflow00_registry
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install existing R dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite','digest','httr2','readr','stringdist','stringi','xml2','googlesheets4','yaml'))
      - name: Recover frozen October inputs in isolated runner
        run: |
          set -euo pipefail
          Rscript scripts/updater/experimental_w01_fast/run_real_benchmark.R
      - name: Validate preserved state before experiment
        run: |
          set -euo pipefail
          test -s previous_state/workflow01_full_five_source/final_pair_decisions.csv
          test -s previous_state/workflow01_full_five_source/manifestation_cluster_map.csv
          test -s previous_state/canonical/records.jsonl
          test -s outputs/workflow01_union/source_inputs.json
          test -s outputs/workflow01_candidates/normalised_metadata.csv
          test -s docs/deduplication/zenodo/run-39140209398.json
      - name: Run direct-delta W01-Fast and verify unchanged production replay
        run: |
          set -euo pipefail
          Rscript scripts/updater/experimental_w01_fast/run_full_incremental_update.R \
            --metadata outputs/workflow01_candidates/normalised_metadata.csv \
            --prior-map previous_state/workflow01_full_five_source/manifestation_cluster_map.csv \
            --source-manifest outputs/workflow01_union/source_inputs.json \
            --prior-canonical previous_state/canonical/records.jsonl \
            --strip-actions previous_state/workflow01_full_five_source/abstract_strip_actions.jsonl \
            --repairs previous_state/provenance/cumulative_data_quality_repairs.jsonl \
            --previous-decisions previous_state/workflow01_full_five_source/final_pair_decisions.csv \
            --previous-root previous_state \
            --previous-pointer docs/deduplication/zenodo/run-39140209398.json \
            --current-seed-root outputs/workflow01_union \
            --delta-writer direct \
            --output-dir outputs/experimental_w01_fast/full_update
      - name: Diagnose cluster-map replay mismatch without changing checks
        if: failure()
        run: |
          Rscript scripts/updater/experimental_w01_fast/diagnose_replayed_cluster_map.R
      - name: Compare rebuilt works with frozen production scientific fields
        run: |
          set -euo pipefail
          Rscript scripts/updater/experimental_w01_fast/compare_october_all_changed_works.R
      - name: Retain only compact validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-direct-october-validation-${{ github.run_id }}
          path: |
            outputs/experimental_w01_fast/benchmark-stages.json
            outputs/experimental_w01_fast/full_update/cluster_map_replay_diagnostic.json
            outputs/experimental_w01_fast/full_update/run_report.json
            outputs/experimental_w01_fast/full_update/affected/manifest.json
            outputs/experimental_w01_fast/full_update/final/recombination_audit.json
            outputs/experimental_w01_fast/full_update/replayed/workflow01_delta_replay_audit.json
            outputs/experimental_w01_fast/full_canonical_comparison/audit/comparison.json
          if-no-files-found: warn
          retention-days: 7
