name: Workflow 00 full baseline refresh

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/workflow_00_full_baseline_refresh.yml

permissions:
  contents: write
  actions: read

jobs:
  full-baseline:
    uses: ./.github/workflows/workflow_00_search_orchestrator.yml
    with:
      run_type: full
      lens: true
      scopus: true
      openalex: true
      agricola: true
      wos: true
      additional_farm_term: ''
      resume_run_id: ''
    secrets: inherit
