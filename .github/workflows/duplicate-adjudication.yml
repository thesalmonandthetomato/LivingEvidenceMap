name: Lens update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::fs
            any::here
            any::httr2
            any::jsonlite
            any::readr
            any::stringdist
            any::stringi
            any::stringr
            any::tibble
            any::tidyr
            any::yaml
            any::quanteda
            any::glmnet
            any::Matrix
            any::purrr

      - name: Run Lens update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: Rscript scripts/run_lens_update.R

      - name: Upload Lens update outputs
        uses: actions/upload-artifact@v4
        with:
          name: lens-update-2026-08-13
          path: data/updates/2026-08-13_lens/
          if-no-files-found: error
