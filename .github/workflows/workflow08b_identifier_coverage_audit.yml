name: W08b isolated W08 identifier coverage audit
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'docs/workflow08b/.run_identifier_audit'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install isolated dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','data.table'))
      - name: Parse audit scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/workflow08b/crosswalk_identifiers.R')
          parse(file='scripts/workflow08b/select_api_trial.R')
          parse(file='scripts/workflow08b/lens_relationship_smoke.R')
          parse(file='scripts/updater/workflow_10_restore_canonical_from_zenodo.R')
      - name: Restore authoritative W08 canonical and verify checksum
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          mkdir -p "$RUNNER_TEMP/w08b"
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R \
            --pointer docs/workflow08/zenodo/run-40028381004.json \
            --output "$RUNNER_TEMP/w08b/canonical.jsonl"
      - name: Reconstruct authoritative W01 from published baseline and delta chain
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer docs/deduplication/zenodo/run-39990028078.json \
            --pointer-dir docs/deduplication/zenodo \
            --output-root "$RUNNER_TEMP/w08b/w01_state"
          test -s "$RUNNER_TEMP/w08b/w01_state/canonical/records.jsonl"
      - name: Build strict W08-to-W01 identifier crosswalk
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/crosswalk_identifiers.R \
            "$RUNNER_TEMP/w08b/canonical.jsonl" \
            "$RUNNER_TEMP/w08b/w01_state/canonical/records.jsonl" \
            "$RUNNER_TEMP/w08b/audit"
          Rscript -e 'x<-jsonlite::fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"w08b/audit/summary.json"));stopifnot(x$w08_records==22923L,x$w01_matches==22923L);cat(jsonlite::toJSON(x,auto_unbox=TRUE,pretty=TRUE),"\\n")'
      - name: Prepare private bounded Lens-first trial cohort
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/select_api_trial.R \
            "$RUNNER_TEMP/w08b/audit/seed_identifier_crosswalk.csv" \
            "$RUNNER_TEMP/w08b/trial"
          Rscript -e 'z<-jsonlite::fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"w08b/trial/trial_summary.json"));stopifnot(z$total<=12L,!z$provider_queries_authorised)'
      - name: Lens one-seed citation-field smoke request
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LENS_API_TOKEN"
          Rscript scripts/workflow08b/lens_relationship_smoke.R \
            "$RUNNER_TEMP/w08b/trial/private_trial_seeds.csv" \
            "$RUNNER_TEMP/w08b/trial/lens_smoke_summary.json"
          cat "$RUNNER_TEMP/w08b/trial/lens_smoke_summary.json"
      - name: Report aggregate coverage only
        shell: bash
        run: |
          echo '### W08b identifier coverage' >> "$GITHUB_STEP_SUMMARY"
          echo 'Authoritative October W08: 22,923 included records, checksum verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full record-level identifier CSV remains runner-local and is not uploaded or committed.' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/w08b/audit/summary.json" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
