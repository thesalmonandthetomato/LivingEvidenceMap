name: Temporary W02 abstract integration syntax check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w02-abstract-parse.yml'
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse isolated W02 additions
        shell: Rscript {0}
        run: |
          parse(file="scripts/updater/workflow_02_publish_missing_abstract_queue.R")
          parse(file="scripts/updater/workflow_02_apply_optional_abstracts.R")
          cat("PASS: both new W02 R scripts parse successfully\n")
