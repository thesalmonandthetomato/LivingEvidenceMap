name: W01 benchmark removal validation
on:
  push:
    branches: [main]
    paths: [docs/w01_benchmark_removal_test_trigger.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Parse and verify unchanged deterministic classifier
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'invisible(parse(file="scripts/updater/workflow_01_deduplication_identifier_rescore.R"));cat("PASS: R classifier parses\\n")'
          git show a6de132be86304f56661ea3f9e7c0e71db33808b:scripts/updater/workflow_01_deduplication_identifier_rescore.R > /tmp/w01_before.R
          python3 - <<'PY'
          import pathlib,re
          prior=pathlib.Path('/tmp/w01_before.R').read_text()
          current=pathlib.Path('scripts/updater/workflow_01_deduplication_identifier_rescore.R').read_text()
          expected=re.sub(r'labels_path <- arg\\([\\s\\S]*?(?=\\nnormalise_visible_title <-)','',prior,count=1)
          expected=re.sub(r'x\\[, pair_key := paste\\([\\s\\S]*?(?=\\nsummary <- list\\()','',expected,count=1)
          expected=expected.replace('  historical_benchmark_evaluation = if (benchmark_available) "performed" else "not_available",\\n','')
          assert current==expected,'Non-benchmark code changed'
          assert 'workflow02_v2_human_labels_2026-09-21.csv' not in current
          assert 'human_validation_results.csv' not in current
          assert 'fwrite(x, file.path(output_dir, "rescored_sample.csv"))' in current
          print('PASS: only obsolete benchmarking removed; deterministic rules and normal CSV writing byte-identical')
          PY
