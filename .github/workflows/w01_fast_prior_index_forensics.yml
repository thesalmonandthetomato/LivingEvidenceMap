name: W01-Fast prior decision index forensics
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-integration]
    paths:
      - .github/workflows/w01_fast_prior_index_forensics.yml
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Forensic audit is read-only and never restores W00.
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-integration
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","data.table","digest","httr2"))
      - name: Restore only original published prior W01 state; no W00, no new scoring
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer docs/deduplication/zenodo/run-39140209398.json \
            --pointer-dir docs/deduplication/zenodo \
            --output-root previous_state
      - name: Audit historic pair index mismatch
        shell: bash
        run: |
          Rscript scripts/updater/experimental_w01_fast/audit_prior_pair_indices.R \
            --previous-root previous_state \
            --output-dir forensic
      - name: Archive tiny forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-prior-index-forensics-${{ github.run_id }}
          path: forensic/report.json
          if-no-files-found: warn
          retention-days: 7
