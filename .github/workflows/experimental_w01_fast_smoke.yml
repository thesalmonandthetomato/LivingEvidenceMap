name: Experimental W01-Fast exact-index smoke test
on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - .github/workflows/experimental_w01_fast_smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install minimal R packages
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest"))
      - name: Test exact-block candidate lookup in isolated fixtures
        shell: Rscript {0}
        run: |
          library(data.table)
          library(jsonlite)
          p <- tempfile(fileext=".csv")
          root <- tempfile(pattern="fastw01-")
          x <- data.table(
            idx=1:4,source=c("lens","scopus","lens","scopus"),
            source_record_id=c("a","b","c","d"),
            title_norm=c("shared title","separate title","shared title","shared title"),
            doi_norm=c("10.1/a","10.1/b","10.1/a","10.1/a"),
            doi_family=c("10.1/a","10.1/b","10.1/a","10.1/a"),
            abstract_hash=c("a","b","a","a"),
            author_norm=c("someone","different","someone","someone"),
            year=c(2025L,2024L,2025L,2025L),
            journal_norm=c("journal","other","journal","journal"),
            volume_norm=c("1","2","1","1"),
            issue_norm=c("1","2","1","1"),
            pages_norm=c("5","6","5","5"))
          fwrite(x,p)
          cmd <- c("scripts/updater/experimental_w01_fast/build_exact_block_index.R",
                   "--metadata",p,"--prior-n","2","--output-dir",root)
          stopifnot(system2(file.path(R.home("bin"),"Rscript"),cmd)==0L)
          pairs <- fread(file.path(root,"exact_block_candidates.csv"))
          stopifnot(nrow(pairs)==3L,
                    identical(pairs$record_i,c(1L,1L,3L)),
                    identical(pairs$record_j,c(3L,4L,4L)),
                    !any(pairs$record_i<=2L & pairs$record_j<=2L))
          state <- fromJSON(file.path(root,"manifest.json"))
          stopifnot(!state$production_publication_allowed,
                    !state$includes_fuzzy_qgram_candidates,
                    state$new_manifestations==2L)
          cat("PASS: exact-block prototype candidate pairs and isolation flags\n")
