name: W01 temporary validation
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w01-temporary-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install test packages
        shell: Rscript {0}
        run: install.packages(c("jsonlite", "data.table", "digest", "stringdist"))
      - name: Validate source catalogue and project exceptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w01test/current_sources/alpha" "$RUNNER_TEMP/w01test/current_sources/beta"
          printf '%s\n' '{"source":{"provider":"alpha","source_record_id":"a1"}}' > "$RUNNER_TEMP/w01test/current_sources/alpha/records.jsonl"
          : > "$RUNNER_TEMP/w01test/current_sources/beta/records.jsonl"
          printf '%s\n' '{"search":{"sources":{"alpha":{"successfully_downloaded_results":1},"beta":{"successfully_downloaded_results":0}}}}' > "$RUNNER_TEMP/w01test/w00.json"
          Rscript scripts/updater/workflow_01_build_runtime_catalogue.R --w00-sources alpha,beta --w00-status "$RUNNER_TEMP/w01test/w00.json" --prepared-root "$RUNNER_TEMP/w01test/current_sources" --output "$RUNNER_TEMP/w01test/catalogue.json"
          Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1],simplifyVector=FALSE);stopifnot(identical(names(x$sources),c("alpha","beta")),identical(x$sources$alpha$expected_records,1L),identical(x$sources$beta$expected_records,0L))' "$RUNNER_TEMP/w01test/catalogue.json"
          Rscript scripts/updater/workflow_01_prepare_source_catalogue.R --catalogue "$RUNNER_TEMP/w01test/catalogue.json" --output-manifest "$RUNNER_TEMP/w01test/manifest.json"
      - name: Validate archive snapshot and restoration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w01test/inputs"
          cp user_input/workflow01_explicit_cluster_splits.json "$RUNNER_TEMP/w01test/inputs/"
          cp user_input/workflow01_identifier_never_auto_resolve.csv "$RUNNER_TEMP/w01test/inputs/"
          Rscript scripts/updater/workflow_01_project_config_snapshot.R --mode snapshot --input-dir "$RUNNER_TEMP/w01test/inputs" --archive-dir "$RUNNER_TEMP/w01test/archive"
          rm "$RUNNER_TEMP/w01test/inputs/"*
          Rscript scripts/updater/workflow_01_project_config_snapshot.R --mode restore --input-dir "$RUNNER_TEMP/w01test/inputs" --archive-dir "$RUNNER_TEMP/w01test/archive"
          cmp user_input/workflow01_explicit_cluster_splits.json "$RUNNER_TEMP/w01test/inputs/workflow01_explicit_cluster_splits.json"
          cmp user_input/workflow01_identifier_never_auto_resolve.csv "$RUNNER_TEMP/w01test/inputs/workflow01_identifier_never_auto_resolve.csv"
          printf '\n' >> "$RUNNER_TEMP/w01test/archive/project_configuration/workflow01_explicit_cluster_splits.json"
          if Rscript scripts/updater/workflow_01_project_config_snapshot.R --mode restore --input-dir "$RUNNER_TEMP/w01test/inputs" --archive-dir "$RUNNER_TEMP/w01test/archive"; then
            echo "FAIL: altered snapshot was accepted"; exit 1
          fi
          echo "PASS: altered snapshot rejected"
      - name: Verify source inputs remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
