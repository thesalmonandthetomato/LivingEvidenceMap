name: W08b OpenAlex eligible citation ID harvest
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths: [docs/workflow08b/.run_openalex_eligible_harvest]
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest'))
      - name: Parse preflight
        run: Rscript -e 'invisible(parse(file="scripts/workflow08b/harvest_openalex_eligible.R"))'
      - name: Restore verified citation checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/restore_discovery.R 23627320 "$RUNNER_TEMP/w08b"
          test -s "$RUNNER_TEMP/w08b/openalex_merged/provider_candidate_ids.csv"
          test -s "$RUNNER_TEMP/w08b/openalex_merged/citation_edges.csv"
      - name: Harvest eligible OpenAlex IDs and retain seed provenance
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/harvest_openalex_eligible.R "$RUNNER_TEMP/w08b/openalex_merged/provider_candidate_ids.csv" "$RUNNER_TEMP/w08b/openalex_merged/citation_edges.csv" user_input/workflow00_search_strategy.json "$RUNNER_TEMP/eligible"
          cat "$RUNNER_TEMP/eligible/summary.json"
      - name: Preserve isolated results and checkpoint ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w08b-openalex-eligible-${{ github.run_id }}
          path: ${{ runner.temp }}/eligible/
          if-no-files-found: warn
          retention-days: 30
