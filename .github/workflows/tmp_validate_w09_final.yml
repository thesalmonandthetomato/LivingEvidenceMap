name: TEMP W09 final structural validation

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w09_final.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Validate W09 production contracts
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e '
            files <- c(
              "scripts/reporting/restore_workflow08_reporting_state.R",
              "scripts/reporting/plot_citesource_database_contribution.R",
              "visualisations/07_flow_diagram.R"
            )
            invisible(lapply(files, parse))
            cat("PASS: W09 R scripts parse\n")
          '

          grep -q 'workflow08_final_included_record_ids.txt' .github/workflows/report_workflow09_figures.yml
          grep -q 'workflow08_final_included_record_ids.txt' .github/workflows/report_citesource_database_contribution.yml
          grep -q 'final_included_records' scripts/reporting/plot_citesource_database_contribution.R
          grep -q 'included_final' scripts/reporting/plot_citesource_database_contribution.R
          grep -q 'CAB Abstracts' scripts/reporting/plot_citesource_database_contribution.R
          grep -q 'ProQuest/PQD&T' scripts/reporting/plot_citesource_database_contribution.R
          grep -q 'CAB Abstracts' visualisations/07_flow_diagram.R
          grep -q 'ProQuest/PQD&T' visualisations/07_flow_diagram.R
          grep -q 'title_abstract_excluded_total' visualisations/07_flow_diagram.R
          grep -q 'Records excluded at title and abstract' visualisations/07_flow_diagram.R
          grep -q 'CITESOURCE_OUTPUT_DIR' .github/workflows/report_workflow09_figures.yml
          grep -q 'Current-run CiteSource outputs are required for Figure 2' docs/reporting/workflow_09/manuscript/long_form_results.Rmd
          grep -q 'citesource_report\\$final_included_records' docs/reporting/workflow_09/manuscript/long_form_results.Rmd

          ! grep -q '19117L' scripts/reporting/restore_workflow08_reporting_state.R
          ! grep -q '32292L' .github/workflows/report_citesource_database_contribution.yml
          ! grep -q '19407L' .github/workflows/report_citesource_database_contribution.yml
          ! grep -q 'Workflow 04 included' scripts/reporting/plot_citesource_database_contribution.R
          ! grep -q 'filtered > excl' docs/reporting/workflow_09/manuscript/long_form_methods.Rmd

          grep -q 'salmonid\*' docs/reporting/workflow_09/manuscript/long_form_methods.Rmd
          grep -q 'rainbow trout' docs/reporting/workflow_09/manuscript/long_form_methods.Rmd
          grep -q 'definitive final included corpus' docs/reporting/workflow_09/manuscript/long_form_results.Rmd

          echo 'PASS: W09 production files are living-update ready'
