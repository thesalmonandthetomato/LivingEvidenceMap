name: W04 revision instruction test (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse revision script and check mandatory instruction contracts
        shell: Rscript {0}
        run: |
          code <- parse("scripts/updater/workflow_04_refine_prompt.R")
          lines <- readLines("scripts/updater/workflow_04_refine_prompt.R",warn=FALSE)
          s <- paste(lines,collapse=" ")
          stopifnot(length(code)>0L)
          required <- c("user_note as the user's explicit revision requirements",
            "ENTIRE prompt", "MINIMUM NECESSARY changes", "human decisions",
            "Prefer replacing, merging or deleting",
            "Where the user_note conflicts", "proposed_prompt and explanation",
            "without a rerun", "No")
          required <- required[-length(required)]
          for (term in required) stopifnot(grepl(term,s,fixed=TRUE))
          stopifnot(grepl("messages=list(list(role=\"system\",content=instruction)",s,fixed=TRUE))
          stopifnot(grepl("user_note=input$user_note",s,fixed=TRUE))
          cat("PASS: revised instruction and API payload contracts, no paid requests.\n")
