name: Workflow 05 - random 200 two-pass Luna scalability test

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'docs/workflow05/.run_luna_random200_test'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("dplyr","readr","jsonlite","httr2","digest","tidyr"))

      - name: Restore corrected deterministic W05 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: workflow05-species-rule-delta-36234132889
          path: corrected_checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36234132889

      - name: Locate corrected deterministic inputs
        shell: bash
        run: |
          set -euo pipefail
          DET="$(find corrected_checkpoint -type f -path '*/workflow05_corrected/deterministic_annotation_summary.csv' -print -quit)"
          REC="$(find corrected_checkpoint -type f -path '*/workflow05_corrected/records_for_annotation.csv' -print -quit)"
          if [ -z "$REC" ]; then
            REC="$(find corrected_checkpoint -type f -name records_for_annotation.csv -print -quit)"
          fi
          test -n "$DET"; test -n "$REC"
          cp "$DET" corrected_deterministic_annotation_summary.csv
          cp "$REC" records_for_annotation.csv
          Rscript -e 'd<-readr::read_csv("corrected_deterministic_annotation_summary.csv",show_col_types=FALSE);r<-readr::read_csv("records_for_annotation.csv",show_col_types=FALSE);stopifnot(nrow(d)==19407L,nrow(r)==19407L,!anyDuplicated(d$record_id),!anyDuplicated(r$record_id));cat("PASS: corrected deterministic W05 checkpoint restored\n")'

      - name: Run two blind Luna passes on simple random 200
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          Rscript scripts/reporting/workflow05_luna_random200_test.R \
            --deterministic corrected_deterministic_annotation_summary.csv \
            --records records_for_annotation.csv \
            --prompt config/workflow05_luna_independent_audit_prompt.txt \
            --sample-strategy simple_random \
            --sample-size 200 \
            --sample-seed 20260926 \
            --output-dir outputs/workflow05_luna_random200_test

      - name: Validate outputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON("outputs/workflow05_luna_random200_test/summary.json")
          p <- read.csv("outputs/workflow05_luna_random200_test/pairwise_agreement.csv")
          c <- read.csv("outputs/workflow05_luna_random200_test/comparison_100_three_way.csv")
          stopifnot(
            s$n == 200L,
            identical(s$sample_strategy, "simple_random"),
            nrow(p) == 6L,
            nrow(c) == 200L,
            file.exists("outputs/workflow05_luna_random200_test/three_way_disagreements.csv"),
            file.exists("outputs/workflow05_luna_random200_test/stratified_three_way_agreement.csv"),
            file.exists("outputs/workflow05_luna_random200_test/sample_200.csv")
          )
          cat("PASS: random 200 scalability outputs validated\n")

      - name: Upload random 200 audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: workflow05-luna-random200-${{ github.run_id }}
          path: outputs/workflow05_luna_random200_test/
          retention-days: 90
          if-no-files-found: error
