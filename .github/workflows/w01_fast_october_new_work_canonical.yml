name: W01-Fast actual October new work canonicalisation
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_october_new_work_canonical.yml
      - scripts/updater/experimental_w01_fast/test_october_new_works_canonical.R
      - scripts/updater/experimental_w01_fast/compare_october_real_canonical_by_ranges.R
      - scripts/updater/experimental_w01_fast/recover_october_candidate_abstracts.R
      - scripts/updater/experimental_w01_fast/run_october_recovered_scoring.R
      - scripts/updater/experimental_w01_fast/compare_october_recovered_base_scores.R
      - scripts/updater/experimental_w01_fast/compare_october_recovered_rescoring.R
      - scripts/updater/experimental_w01_fast/audit_october_identifier_assist_consistency.R
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install canonical builder dependencies
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest","stringi","stringdist","xml2"))
      - uses: actions/download-artifact@v4
        with:
          name: w01-fast-october-real-reference
          run-id: 39482948683
          github-token: ${{ github.token }}
          path: reference
      - uses: actions/download-artifact@v4
        with:
          name: w01-fast-october-record-tails
          run-id: 39551148154
          github-token: ${{ github.token }}
          path: tails
      - name: Download frozen October candidate metadata and pair identities
        uses: actions/download-artifact@v4
        with:
          name: w01-fast-october-candidate-reference
          run-id: 39491644597
          github-token: ${{ github.token }}
          path: reference
      - name: Materialise all 16 new real October singleton works
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_october_new_works_canonical.R
      - name: Compare 16 real works to original W01 canonical archive via bounded ranges
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -f 2000
          Rscript scripts/updater/experimental_w01_fast/compare_october_real_canonical_by_ranges.R
      - name: Recover archived individual abstracts for October candidate pairs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Rscript scripts/updater/experimental_w01_fast/recover_october_candidate_abstracts.R
      - name: Download frozen October production decisions for comparison
        uses: actions/download-artifact@v4
        with:
          name: w01-fast-october-stable-identity-decisions
          run-id: 39496185477
          github-token: ${{ github.token }}
          path: decision_reference
      - name: Independently score October candidate pairs using original production rules
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/experimental_w01_fast/run_october_recovered_scoring.R
      - name: Compare independent base scores to production
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/compare_october_recovered_base_scores.R
      - name: Compare independently rerun production deterministic rescoring
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/compare_october_recovered_rescoring.R
      - name: Validate identifier-assisted scientific consistency independently
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/audit_october_identifier_assist_consistency.R
      - name: Retain compact real-data canonical audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-october-16-real-canonical-works
          path: |
            real_new_work_fixture/report.json
            real_new_work_fixture/new_works.csv
            real_new_work_fixture/canonical_manifest.json
            actual_october_canonical_comparison/audit/comparison.json
            october_abstract_recovery/report.json
            october_recovered_scoring/report.json
            october_recovered_scoring/base_comparison/
            october_recovered_scoring/rescore_comparison/
            october_identifier_assist_consistency/report.json
          retention-days: 7
          if-no-files-found: warn
