name: Temporary W04 read-only KPI audit
on:
  push:
    paths:
      - .github/workflows/w04_temp_kpi_live_audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install Sheets reader
        shell: Rscript {0}
        run: install.packages(c("googlesheets4","jsonlite"))
      - name: Audit manual W04 decisions and saved comparison history
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: ${{ secrets.LEM_TEST_GOOGLE_SHEET_ID }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(googlesheets4);library(jsonlite)})
          credential <- tempfile(fileext=".json")
          on.exit(unlink(credential),add=TRUE)
          writeLines(Sys.getenv("LEM_GOOGLE_SERVICE_ACCOUNT_JSON"),credential)
          sheet <- Sys.getenv("LEM_GOOGLE_SHEET_ID")
          gs4_auth(path=credential,cache=FALSE)
          tabs <- sheet_names(sheet)
          meta <- as.data.frame(read_sheet(sheet,sheet="review_metadata",col_types="c"))
          if(!identical(as.character(meta$value[match("review_id",meta$key)]),"almeria-map"))
            stop("Unexpected review")
          target <- c("decisions_w04_validation","w04_consistency_analyses","w04_model_batch_registry")
          if(!all(target%in%tabs))stop("W04 KPI source sheets missing")
          d <- as.data.frame(read_sheet(sheet,sheet=target[[1L]],col_types="c"))
          if(!all(c("record_id","review_case_id","decision","queue_sha256")%in%names(d)))
            stop("Human decision schema incomplete")
          d <- d[d$decision%in%c("retain","exclude"),,drop=FALSE]
          id <- unique(as.character(d$record_id))
          if(any(!nzchar(id)))stop("Human decisions contain blank canonical ID")
          cat(sprintf("MANUAL saved_substantive_events=%d unique_record_ids=%d unique_queues=%d\\n",
             nrow(d),length(id),length(unique(d$queue_sha256))))
          if(length(id)!=200L)stop("Saved human decisions do not contain 200 distinct canonical records")
          a <- as.data.frame(read_sheet(sheet,sheet=target[[2L]],col_types="c"))
          b <- as.data.frame(read_sheet(sheet,sheet=target[[3L]],col_types="c"))
          if(!all(c("batch_id","created_at_utc","rater_ids_json","review_mode",
                    "complete_n","patterns_json","analysis_id")%in%names(a)))
            stop("Comparison registry missing provenance columns")
          b <- b[b$review_id=="almeria-map",,drop=FALSE]
          a <- a[a$review_mode=="subset_model_validation",,drop=FALSE]
          runs <- sub("^w04-model-run-","",as.character(a$batch_id))
          a <- a[grepl("^w04-model-run-[0-9]+$",a$batch_id) &
            runs %in% b$run_id,,drop=FALSE]
          runs <- sub("^w04-model-run-","",as.character(a$batch_id))
          subsets <- b$subset_id[match(runs,b$run_id)]
          latest <- lapply(split(seq_len(nrow(a)),subsets),function(idx) {
            ix <- idx[order(a$created_at_utc[idx],a$analysis_id[idx],decreasing=TRUE)[[1L]]]
            a[ix,,drop=FALSE]
          })
          cat(sprintf("KAPPA saved_model_comparisons=%d distinct_subsets=%d latest_comparisons=%d\\n",
            nrow(a),length(unique(subsets)),length(latest)))
          for(z in latest) {
            stopifnot(nrow(z)==1L)
            cat(sprintf("LATEST model_run=%s compared_records=%s saved_kappa=%s\\n",
              sub("^w04-model-run-","",z$batch_id),
              as.character(z$complete_n),as.character(z$kappa)))
          }
          cat("PASS W04 live KPI data present and review-scoped\\n")
