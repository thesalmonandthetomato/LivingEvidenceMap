name: Workflow 07 - Validate incremental reuse

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'scripts/updater/workflow_07_prepare_incremental.R'
      - 'tests/test_workflow07_changed_input_reprocess.R'
      - '.github/workflows/workflow_07_validate_incremental_reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('readr','dplyr','jsonlite','digest'))

      - name: Parse W07 incremental preparation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_07_prepare_incremental.R')
          cat('PASS: W07 incremental preparation parses\n')

      - name: Validate changed-input reprocessing
        shell: Rscript {0}
        run: source('tests/test_workflow07_changed_input_reprocess.R')
