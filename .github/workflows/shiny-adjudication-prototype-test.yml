name: Shiny adjudication prototype test

on:
  workflow_dispatch:
  push:
    branches:
      - shiny-adjudication-interface
    paths:
      - 'shiny/adjudication/**'
      - '.github/workflows/shiny-adjudication-prototype-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shiny/adjudication

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install prototype dependencies
        shell: Rscript {0}
        run: install.packages(c("shiny","bslib","jsonlite","digest","googlesheets4"))

      - name: Parse application files
        shell: Rscript {0}
        run: |
          parse(file="app.R")
          parse(file="R/w01_contract.R")
          parse(file="R/storage_local.R")
          parse(file="R/storage_sheets.R")
          parse(file="R/storage_backend.R")
          parse(file="scripts/init_google_sheet.R")
          parse(file="scripts/export_w01_decisions.R")
          cat("PASS: prototype R files parse\n")

      - name: Test W01 decision contract
        shell: Rscript {0}
        run: source("tests/test_w01_contract.R")
