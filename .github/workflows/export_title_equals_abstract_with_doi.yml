name: Export title equals abstract with DOI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export_title_equals_abstract_with_doi.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical repair store with Git LFS
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true

      - name: Export affected records
        shell: python
        run: |
          import csv, json, re, unicodedata
          from pathlib import Path

          src = Path('data/canonical/current/repair/records.jsonl')
          out = Path('title_equals_abstract_with_doi.csv')

          def norm(x):
              x = '' if x is None else str(x)
              x = unicodedata.normalize('NFKC', x)
              x = re.sub(r'\s+', ' ', x).strip().casefold()
              return x

          rows = []
          with src.open('r', encoding='utf-8') as fh:
              for line_no, line in enumerate(fh, 1):
                  if not line.strip():
                      continue
                  rec = json.loads(line)
                  can = rec.get('canonical') or {}
                  title = can.get('title') or ''
                  abstract = can.get('abstract') or ''
                  if title and abstract and norm(title) == norm(abstract):
                      rows.append({
                          'line_no': line_no,
                          'lens_id': can.get('lens_id') or rec.get('lens_id') or (rec.get('identity') or {}).get('lens_id') or '',
                          'record_id': can.get('record_id') or '',
                          'doi': can.get('doi') or '',
                          'title': title,
                          'abstract': abstract,
                      })

          with out.open('w', encoding='utf-8', newline='') as fh:
              w = csv.DictWriter(fh, fieldnames=['line_no','lens_id','record_id','doi','title','abstract'])
              w.writeheader()
              w.writerows(rows)

          print(f'rows={len(rows)}')

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: title-equals-abstract-with-doi-${{ github.run_id }}
          path: title_equals_abstract_with_doi.csv
