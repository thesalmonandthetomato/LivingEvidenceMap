name: W07 temporary reuse checks
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w07-temporary-reuse-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c("readr","dplyr","jsonlite","digest"))
      - name: Verify reuse and version safeguards
        shell: Rscript {0}
        run: |
          library(readr)
          library(jsonlite)
          library(digest)
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w07-reuse")
          dir.create(t)
          fp<-function(title,abstract)digest(toJSON(list(title=title,abstract=abstract),auto_unbox=TRUE,null="null",na="null"),algo="sha256",serialize=FALSE)
          prior<-data.frame(record_id=c("keep","edit"),title=c("Original A","Original B"),abstract=c("Stable","Prior"),stringsAsFactors=FALSE)
          prior$topic_input_sha256<-mapply(fp,prior$title,prior$abstract,USE.NAMES=FALSE)
          now<-data.frame(record_id=c("keep","edit","new"),title=c("Original A","Original B","New work"),abstract=c("Stable","Revised","New abstract"))
          write_csv(prior,file.path(t,"prior.csv"))
          write_csv(now,file.path(t,"current.csv"))
          write_csv(data.frame(record_id=c("keep","edit"),path_id=c("V3_001","V3_001"),confidence_n=c(3,2)),file.path(t,"scores.csv"))
          manifest<-list(ontology_sha256=digest(file="user_input/workflow07_topic_ontology.csv",algo="sha256",serialize=FALSE),prompt_sha256=digest(file="user_input/workflow07_topic_system_prompt.txt",algo="sha256",serialize=FALSE))
          write_json(manifest,file.path(t,"prior_manifest.json"),auto_unbox=TRUE)
          run<-function(manifest_path,out)system2("Rscript",c("scripts/updater/workflow_07_prepare_incremental.R","--current",file.path(t,"current.csv"),"--prior-records",file.path(t,"prior.csv"),"--prior-scores",file.path(t,"scores.csv"),"--prior-manifest",manifest_path,"--output-dir",out),stdout=FALSE,stderr=FALSE)
          good<-file.path(t,"good")
          stopifnot(run(file.path(t,"prior_manifest.json"),good)==0L)
          queue<-read_csv(file.path(good,"topic_screen_queue.csv"),show_col_types=FALSE)
          reuse<-read_csv(file.path(good,"reused_topic_pathway_scores.csv"),show_col_types=FALSE)
          stopifnot(setequal(queue$record_id,c("edit","new")),identical(reuse$record_id,"keep"))
          bad<-manifest
          bad$ontology_sha256<-paste0("0",substring(bad$ontology_sha256,2))
          write_json(bad,file.path(t,"bad_manifest.json"),auto_unbox=TRUE)
          stopifnot(run(file.path(t,"bad_manifest.json"),file.path(t,"bad"))!=0L)
          bad<-manifest
          bad$prompt_sha256<-paste0("0",substring(bad$prompt_sha256,2))
          write_json(bad,file.path(t,"bad_prompt.json"),auto_unbox=TRUE)
          stopifnot(run(file.path(t,"bad_prompt.json"),file.path(t,"badprompt"))!=0L)
          cat("PASS: unchanged topics reused; revised/new records queued; ontology/prompt drift rejected\n")
