name: W01-Fast bounded October incremental decisions
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_october_incremental_decisions.yml
      - scripts/updater/experimental_w01_fast/extract_w01_incremental_decisions.R
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install small JSON dependency
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Extract only October new decisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -f 25000
          Rscript scripts/updater/experimental_w01_fast/extract_w01_incremental_decisions.R
      - name: Save source-reference audit
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-october-incremental-decisions
          path: selected_w01_incremental_decisions/
          retention-days: 7
          if-no-files-found: error
