name: Finalise weekly update 2026-09-09

on:
  push:
    paths:
      - '.github/finalise_weekly_2026_09_09_trigger.txt'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair authoritative fields
        run: python scripts/finalise_weekly_2026_09_09.py
      - name: Build dashboard data
        run: python scripts/build_dashboard.py
      - name: Enforce authoritative V3 topic paths
        run: python scripts/enforce_v3_dashboard_topics.py
      - name: Add bibliographic citation metadata
        run: python scripts/augment_dashboard_citations.py
      - name: Normalise species and finest-topic metrics
        run: python scripts/normalise_dashboard_data.py
      - name: Build hierarchical dashboard data
        run: python scripts/augment_dashboard_data.py
      - name: Apply authoritative dashboard topic presentation data
        run: python scripts/patch_dashboard_feedback_data.py
      - name: Add authoritative search and evidence update metrics
        run: python scripts/augment_dashboard_update_metrics.py
      - name: Validate dashboard data quality
        run: python scripts/validate_dashboard_data.py
      - name: Audit master topic hierarchy
        run: python scripts/audit_topic_hierarchy.py
      - name: Verify reviewed records
        run: python scripts/verify_weekly_2026_09_09_dashboard.py
      - name: Commit repaired master and rebuilt dashboard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/current/living_evidence_map_master.csv docs/dashboard.json state/dashboard_missing_topics.txt state/topic_hierarchy_audit.csv state/topic_hierarchy_audit_summary.txt
          git commit -m 'Finalise adjudicated weekly update 2026-09-09'
          git push origin HEAD:main
