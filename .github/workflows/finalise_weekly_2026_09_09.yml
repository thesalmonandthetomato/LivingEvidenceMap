name: Finalise weekly update 2026-09-09

on:
  push:
    paths:
      - '.github/finalise_weekly_2026_09_09_trigger.txt'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair authoritative fields for promoted weekly records
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/master/current/living_evidence_map_master.csv')
          ids=set('''007-888-105-974-856
017-694-233-138-585
017-868-173-388-589
020-679-699-324-462
022-354-473-357-939
045-591-539-593-939
051-006-201-009-456
054-410-766-228-166
058-538-757-643-833
077-921-841-436-774
079-027-149-533-689
083-099-236-148-874
087-762-072-593-755
095-351-403-133-82X
097-486-039-982-833
110-865-956-750-596
112-732-189-061-768
113-350-847-393-194
122-006-219-661-577
126-877-219-150-602
130-051-571-555-59X
134-721-759-387-001
137-565-925-689-855
140-104-320-905-275
141-814-290-758-587
153-619-376-496-372
158-869-118-584-197
161-597-734-223-741
162-966-605-124-592
166-777-675-844-66X
171-310-410-629-931
171-455-002-907-143
173-526-465-433-579
178-173-638-093-623
181-282-713-255-882
184-944-661-179-679
188-138-616-151-764'''.splitlines())
          with p.open(newline='',encoding='utf-8-sig') as f:
              r=csv.DictReader(f); fields=list(r.fieldnames or []); rows=list(r)
          def val(row,k): return str(row.get(k,'') or '').strip()
          def norm_species(s):
              vals=[]
              for x in [z.strip() for z in s.split(';') if z.strip()]:
                  if x=='Rainbow salmon': x='Rainbow trout'
                  if x=='Unspecified species': x='Unspecified farmed salmon'
                  vals.append(x)
              return '; '.join(vals)
          hit=0
          for row in rows:
              if val(row,'record_id') not in ids: continue
              hit+=1
              hs=val(row,'human_species_decision')
              ds=val(row,'deterministic_species')
              sp=norm_species(hs or ds)
              if sp:
                  row['final_species']=sp
                  row['species_source']='human adjudication' if hs else 'deterministic'
              hg=val(row,'human_geography_decision')
              dg=val(row,'deterministic_primary_iso3c')
              geo=hg or dg
              if geo:
                  row['final_primary_country_iso3c']=geo
                  row['geography_source']='human adjudication' if hg else 'deterministic'
              if val(row,'record_id')=='126-877-219-150-602':
                  row['deterministic_species_ids']='ONC_MYKISS'
              if hs: row['species_review_required']='FALSE'
              if hg: row['geography_review_required']='FALSE'
          if hit != 37: raise SystemExit(f'Expected 37 promoted weekly records, found {hit}')
          for rid in ('007-888-105-974-856','126-877-219-150-602','178-173-638-093-623'):
              row=next(x for x in rows if val(x,'record_id')==rid)
              if val(row,'final_species')!='Rainbow trout': raise SystemExit(f'{rid}: final_species not Rainbow trout')
          row=next(x for x in rows if val(x,'record_id')=='112-732-189-061-768')
          if val(row,'final_primary_country_iso3c')!='CAN; CHL; USA': raise SystemExit('Net Loss geography not CAN; CHL; USA')
          if val(next(x for x in rows if val(x,'record_id')=='126-877-219-150-602'),'deterministic_species_ids')!='ONC_MYKISS': raise SystemExit('Aquaponics species ID not repaired')
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader(); w.writerows(rows)
          print(f'Repaired {hit} weekly records; master rows={len(rows)}')
          PY

      - name: Build dashboard data
        run: python scripts/build_dashboard.py
      - name: Enforce authoritative V3 topic paths
        run: python scripts/enforce_v3_dashboard_topics.py
      - name: Add bibliographic citation metadata
        run: python scripts/augment_dashboard_citations.py
      - name: Normalise species and finest-topic metrics
        run: python scripts/normalise_dashboard_data.py
      - name: Build hierarchical dashboard data
        run: python scripts/augment_dashboard_data.py
      - name: Apply authoritative dashboard topic presentation data
        run: python scripts/patch_dashboard_feedback_data.py
      - name: Add authoritative search and evidence update metrics
        run: python scripts/augment_dashboard_update_metrics.py
      - name: Validate dashboard data quality
        run: python scripts/validate_dashboard_data.py
      - name: Audit master topic hierarchy
        run: python scripts/audit_topic_hierarchy.py

      - name: Verify reviewed records in generated dashboard
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('docs/dashboard.json'))
          assert d['metrics']['total_records']==13426, d['metrics']['total_records']
          rec={r['record_id']:r for r in d['records']}
          for rid in ('007-888-105-974-856','126-877-219-150-602','178-173-638-093-623'):
              assert 'Rainbow trout' in rec[rid]['species'], (rid,rec[rid]['species'])
              assert rec[rid]['topics'], rid
          r=rec['112-732-189-061-768']
          assert set(['CAN','CHL','USA']).issubset(set(r['iso3'])), r['iso3']
          assert r['topics'], r
          print('Verified four human-reviewed records in dashboard; total_records=13426')
          PY

      - name: Commit repaired master and rebuilt dashboard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/current/living_evidence_map_master.csv docs/dashboard.json state/dashboard_missing_topics.txt state/topic_hierarchy_audit.csv state/topic_hierarchy_audit_summary.txt
          git commit -m 'Finalise adjudicated weekly update 2026-09-09'
          git push origin HEAD:main
