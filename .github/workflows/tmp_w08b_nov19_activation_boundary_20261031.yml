name: TEMP W08b Nov 19 activation boundary test
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_nov19_activation_boundary_20261031.yml']
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Prove pre-Nov19 update cannot run W08b but Nov19 can
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("boundary")
          cfg<-fromJSON("docs/workflow08b/monthly_activation.json")
          stopifnot(cfg$mode=="staged",
            cfg$earliest_source_date=="2026-11-19")
          cfg$mode<-"active"
          cfg$automatically_route_w08<-TRUE
          cfg$automatically_run_provider_queries<-TRUE
          writeLines(toJSON(cfg,auto_unbox=TRUE),"boundary/activation.json")
          status<-fromJSON("docs/current_run/current_run_status.json")
          check<-function(day,expected){
            status$search$search_date<<-day
            writeLines(toJSON(status,auto_unbox=TRUE),"boundary/status.json")
            rc<-system2("Rscript",c("scripts/workflow08b/check_activation.R",
              "boundary/status.json","boundary/activation.json",
              "boundary/decision.json"))
            stopifnot(rc==0L)
            result<-fromJSON("boundary/decision.json")
            stopifnot(identical(result$route,expected))
          }
          check("2026-10-31","existing_w09")
          check("2026-11-01","existing_w09")
          check("2026-11-18","existing_w09")
          check("2026-11-19","w08b_monthly_dispatch")
          check("2026-11-20","w08b_monthly_dispatch")
          cat("PASS: only source updates from 19 November can enter W08b; October and early November W09 unchanged\n")
