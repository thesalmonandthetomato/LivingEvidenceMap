name: W01-Fast direct delta small fixture
on:
  push:
    branches: [w01-fast-direct-delta]
    paths:
      - '.github/workflows/w01_fast_direct_delta_fixture.yml'
      - 'scripts/updater/experimental_w01_fast/write_direct_delta.R'
      - 'scripts/updater/experimental_w01_fast/test_direct_delta_fixture.R'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install compact fixture requirements
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite','digest'))
      - name: Execute original replay and new direct-delta fixture
        run: Rscript scripts/updater/experimental_w01_fast/test_direct_delta_fixture.R
