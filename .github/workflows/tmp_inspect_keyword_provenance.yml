name: Temporary - inspect keyword provenance structures

on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_inspect_keyword_provenance.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest','data.table'))

      - name: Restore authoritative Workflow 01 state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R             --pointer docs/deduplication/zenodo/run-36128255337.json             --pointer-dir docs/deduplication/zenodo             --output-root baseline

      - name: Inspect Lens keyword payloads and Europe PMC keywordList
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({
            library(jsonlite)
            library(httr2)
          })
          `%||%` <- function(x,y) if(is.null(x)) y else x

          cat("=== LENS KEYWORD PAYLOAD SHAPES ===\n")
          p <- "baseline/workflow01_seed/lens_records_for_deduplication.jsonl"
          con <- file(p,"rt",encoding="UTF-8")
          shown <- 0L
          repeat {
            lines <- readLines(con,n=500L,warn=FALSE)
            if(!length(lines) || shown>=10L) break
            for(line in lines){
              r <- fromJSON(line,simplifyVector=FALSE)
              kw <- (r$canonical %||% list())$keywords
              if(!is.null(kw) && length(kw)){
                shown <- shown+1L
                cat(sprintf("\nLENS_SAMPLE=%d\n",shown))
                cat(toJSON(kw,auto_unbox=TRUE,pretty=TRUE,null="null"),"\n")
                if(shown>=10L) break
              }
            }
          }
          close(con)
          cat(sprintf("LENS_SAMPLES_SHOWN=%d\n",shown))

          cat("\n=== EUROPE PMC KEYWORDLIST SHAPES ===\n")
          dois <- c(
            "10.1016/j.toxrep.2022.06.009",
            "10.3390/foods13091309",
            "10.1007/s10695-026-01639-7",
            "10.3389/fmicb.2024.1392808",
            "10.3390/ani12010074"
          )
          for(d in dois){
            req <- request("https://www.ebi.ac.uk/europepmc/webservices/rest/search") |>
              req_url_query(query=sprintf('DOI:"%s"',d),format="json",resultType="core",pageSize=5) |>
              req_headers(Accept="application/json")
            resp <- req_perform(req)
            obj <- fromJSON(resp_body_string(resp),simplifyVector=FALSE)
            hits <- ((obj$resultList %||% list())$result) %||% list()
            h <- NULL
            for(z in hits){
              zd <- tolower(as.character(z$doi %||% ""))
              if(identical(zd,tolower(d))){ h <- z; break }
            }
            cat(sprintf("\nDOI=%s\n",d))
            if(is.null(h)){ cat("NO_EXACT_HIT\n"); next }
            cat(sprintf("SOURCE=%s\n",as.character(h$source %||% "")))
            cat(sprintf("PMID=%s\n",as.character(h$pmid %||% "")))
            cat("KEYWORDLIST_JSON=")
            cat(toJSON(h$keywordList %||% NULL,auto_unbox=TRUE,pretty=TRUE,null="null"),"\n")
            cat("MESHHEADINGLIST_JSON=")
            cat(toJSON(h$meshHeadingList %||% NULL,auto_unbox=TRUE,pretty=TRUE,null="null"),"\n")
          }
