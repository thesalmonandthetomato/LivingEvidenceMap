name: W04 approved revision instruction validation temporary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify approved instruction and unchanged API contract (no API call)
        shell: Rscript {0}
        run: |
          f <- "scripts/updater/workflow_04_refine_prompt.R"
          expressions <- parse(f)
          lines <- readLines(f,warn=FALSE)
          start <- grep("^instruction <- paste",lines)[1]
          end <- grep("^payload <- toJSON",lines)[1]
          stopifnot(is.finite(start),is.finite(end),end > start)
          block <- paste(lines[start:(end-1)],collapse="\n")
          required <- c("entire existing screening prompt",
                        "comparing the characteristics of records judged eligible",
                        "Look for recurring patterns",
                        "minimum necessary, targeted and useful modifications",
                        "Prefer modifying, consolidating or removing",
                        "contradictions",
                        "generalisable rules",
                        "Do not invent evidence",
                        "proposed_prompt",
                        "explanation")
          for (x in required) stopifnot(grepl(x,block,fixed=TRUE,ignore.case=TRUE))
          stopifnot(grepl("user_note=input$user_note",paste(lines,collapse=" "),fixed=TRUE))
          stopifnot(grepl('role="system",content=instruction',paste(lines,collapse=" "),fixed=TRUE))
          stopifnot(length(expressions)>0L)
          cat("PASS: full approved instruction present, source parses, unchanged payload mapping. No API calls.\n")
