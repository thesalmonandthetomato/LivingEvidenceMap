name: Workflow 01 - Validate Workflow 00 Zenodo restore

on:
  push:
    branches:
      - workflow01-zenodo-source-inputs
    paths:
      - '.github/workflows/tmp_validate_workflow01_zenodo_restore.yml'
      - 'scripts/updater/workflow_01_restore_workflow00_from_zenodo.R'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Workflow 01 branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-zenodo-source-inputs
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Workflow 00 Zenodo pointers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin workflow00-search-orchestrator
          mkdir -p /tmp/workflow00_pointer
          for run_id in 35730574878 35731899007 35735412308; do
            git show "origin/workflow00-search-orchestrator:docs/search_record/zenodo/run-${run_id}.json" \
              > "/tmp/workflow00_pointer/run-${run_id}.json"
            test -s "/tmp/workflow00_pointer/run-${run_id}.json"
          done

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install restore dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Restore all five sources from restricted Zenodo archives
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restored/zenodo_restore_audits

          Rscript scripts/updater/workflow_01_restore_workflow00_from_zenodo.R \
            --pointer /tmp/workflow00_pointer/run-35730574878.json \
            --output-root restored
          cp restored/workflow00_zenodo_restore_audit.json restored/zenodo_restore_audits/run-35730574878.json

          Rscript scripts/updater/workflow_01_restore_workflow00_from_zenodo.R \
            --pointer /tmp/workflow00_pointer/run-35731899007.json \
            --output-root restored
          cp restored/workflow00_zenodo_restore_audit.json restored/zenodo_restore_audits/run-35731899007.json

          Rscript scripts/updater/workflow_01_restore_workflow00_from_zenodo.R \
            --pointer /tmp/workflow00_pointer/run-35735412308.json \
            --output-root restored
          cp restored/workflow00_zenodo_restore_audit.json restored/zenodo_restore_audits/run-35735412308.json

      - name: Validate restored Workflow 00 five-source layout
        shell: bash
        run: |
          set -euo pipefail
          for source in lens openalex wos scopus agricola; do
            test -d "restored/$source"
            test -n "$(find "restored/$source" -type f -print -quit)"
          done
          test "$(find restored/zenodo_restore_audits -name 'run-*.json' -type f | wc -l)" -eq 3
          echo "PASS: Workflow 01 restored all five baseline source inputs entirely from Zenodo"

      - name: Preserve restore audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow01-zenodo-restore-audit-${{ github.run_id }}
          path: |
            restored/workflow00_zenodo_restore_audit.json
            restored/zenodo_restore_audits/
          retention-days: 7
          if-no-files-found: warn
