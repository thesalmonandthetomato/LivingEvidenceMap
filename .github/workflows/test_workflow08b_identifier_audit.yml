name: W08b isolated identifier audit fixture test
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - scripts/workflow08b/audit_identifiers.R
      - tests/test_workflow08b_identifiers.R
      - .github/workflows/test_workflow08b_identifier_audit.yml
permissions:
  contents: read
jobs:
  fixture-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install minimal dependency
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Run offline fixture
        run: Rscript tests/test_workflow08b_identifiers.R
