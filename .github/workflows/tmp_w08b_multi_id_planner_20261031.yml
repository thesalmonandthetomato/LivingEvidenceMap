name: TEMP W08b multi-ID planner integration validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_multi_id_planner_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Multiple valid IDs remain eligible while preserving all unique query identifiers
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("test_multi_plan")
          d<-data.frame(record_id=c("a","b"),
            lens_id=c("L1|L2",""),openalex_id=c("W12|W34",""),
            doi=c("10.1/a|10.1/b","10.1/c"),
            preferred_route=c("lens","lens_doi_lookup"),
            identifier_conflict=c(FALSE,FALSE),multiple_identifiers=c(TRUE,FALSE))
          write.csv(d,"test_multi_plan/cross.csv",row.names=FALSE)
          writeLines(toJSON(list(record_id="a",provider="lens",status="complete",lens_id="L1",update_id="2026-10"),auto_unbox=TRUE),
            "test_multi_plan/lens_seed_status.jsonl")
          writeLines("", "test_multi_plan/openalex_seed_status.jsonl")
          stopifnot(system2("Rscript",c("scripts/workflow08b/plan_monthly.R","test_multi_plan/cross.csv",
            "test_multi_plan","2026-11","test_multi_plan/plan"))==0L)
          p<-read.csv("test_multi_plan/plan/monthly_seed_plan.csv")
          stopifnot(nrow(p)==2L,all(p$provider_check_required))
          stopifnot(system2("Rscript",c("scripts/workflow08b/expand_seed_identifiers.R",
            "test_multi_plan/cross.csv","test_multi_plan/expanded"))==0L)
          x<-read.csv("test_multi_plan/expanded/seed_identifier_queries.csv")
          stopifnot(nrow(x)==7L,sum(x$seed_record_id=="a")==6L,
            length(unique(x$query_identifier))==7L)
          cat("PASS: multi-ID seeds are eligible; all seven unique source identifiers retained\n")
