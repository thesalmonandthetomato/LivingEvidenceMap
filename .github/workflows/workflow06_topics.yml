name: Workflow 06 topic V4 replication test

on:
  push:
    branches: [workflow06-gpt5mini-replication]
    paths:
      - 'R/run_topic_v4_classifier.R'
      - 'R/run_update_topic_classification.R'
      - 'scripts/updater/workflow_06_seed_historical_topics.py'
      - '.github/workflows/workflow06_topics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  WF05_ARTIFACT_ID: '10501181612'
  OUTPUT_DIR: outputs/workflow06

jobs:
  replication_test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow06-gpt5mini-replication

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::readr
            any::tibble

      - name: Download completed Workflow 05 artefact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/workflow05
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${WF05_ARTIFACT_ID}/zip" > /tmp/workflow05.zip
          unzip -q /tmp/workflow05.zip -d inputs/workflow05
          test -s inputs/workflow05/records.jsonl
          test -s inputs/workflow05/records_after_species_geography_adjudication.csv

      - name: Reuse historical V3 assignments and draw candidate validation pool
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/updater/workflow_06_seed_historical_topics.py \
            --input-jsonl inputs/workflow05/records.jsonl \
            --workflow05-csv inputs/workflow05/records_after_species_geography_adjudication.csv \
            --historical-master 'data/reference/living_evidence_map_master_topic_repaired.csv' \
            --ontology data/reference/topic_ontology_v3.csv \
            --output-dir "$OUTPUT_DIR" \
            --validation-sample-size 500 \
            --validation-seed 20260917

      - name: Build 50-record known-original replication set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,random
          out='outputs/workflow06'
          provenance={}
          with open(f'{out}/records.jsonl',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  rec=json.loads(line)
                  ident=rec.get('identity') or {}
                  rid=str(ident.get('record_id') or ident.get('lens_id') or '').strip()
                  t=rec.get('topics') or {}
                  provenance[rid]={
                      'sources':[str(x).strip().lower() for x in (t.get('historical_assignment_sources') or []) if str(x).strip()],
                      'review_required':t.get('review_required') is True,
                  }
          with open(f'{out}/topic_validation_llm_queue.csv',encoding='utf-8-sig',newline='') as f:
              candidates=list(csv.DictReader(f))
          with open(f'{out}/topic_validation_reference.csv',encoding='utf-8-sig',newline='') as f:
              refs=list(csv.DictReader(f))
          eligible=[]
          for r in candidates:
              p=provenance.get(r['record_id'],{})
              sources=set(p.get('sources') or [])
              if sources=={'original'} and not p.get('review_required',False):
                  eligible.append(r)
          if len(eligible)<50:
              raise SystemExit(f'Only {len(eligible)} eligible original non-review records found in candidate pool')
          rng=random.Random(20260917)
          chosen=rng.sample(eligible,50)
          ids={r['record_id'] for r in chosen}
          chosen_refs=[r for r in refs if r['record_id'] in ids]
          if {r['record_id'] for r in chosen_refs} != ids:
              raise SystemExit('Reference rows missing for selected replication records')
          qfields=['record_id','title','abstract','doi','queue_type']
          with open(f'{out}/topic_replication_llm_queue.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=qfields); w.writeheader()
              for r in chosen:
                  r=dict(r); r['queue_type']='v4_replication_original'; w.writerow({k:r.get(k,'') for k in qfields})
          rfields=list(chosen_refs[0].keys())
          with open(f'{out}/topic_replication_reference.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rfields); w.writeheader(); w.writerows(chosen_refs)
          with open(f'{out}/topic_replication_sample_summary.json','w',encoding='utf-8') as f:
              json.dump({'records':50,'historical_assignment_source':'original','historical_review_required':False,'seed':20260917},f,indent=2)
          print('Selected 50 known original V4 records for replication.')
          PY

      - name: Run validated V4 mechanism with GPT-5 mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOPIC_INPUT_PATH: outputs/workflow06/topic_replication_llm_queue.csv
          TOPIC_ONTOLOGY_PATH: data/reference/topic_ontology_v3.csv
          TOPIC_OUTPUT_DIR: outputs/workflow06/replication_gpt5mini
          TOPIC_MODEL: gpt-5-mini
          TOPIC_REASONING_EFFORT: medium
        run: Rscript R/run_topic_v4_classifier.R

      - name: Compare GPT-5 mini assignments with known historical V4 assignments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,statistics
          from collections import defaultdict
          out='outputs/workflow06'
          ref=defaultdict(set); pred=defaultdict(set); reasons=defaultdict(list)
          with open(f'{out}/topic_replication_reference.csv',encoding='utf-8-sig',newline='') as f:
              for r in csv.DictReader(f): ref[r['record_id']].add(r['path_id'])
          with open(f'{out}/topic_replication_llm_queue.csv',encoding='utf-8-sig',newline='') as f:
              queue=list(csv.DictReader(f))
          with open(f'{out}/replication_gpt5mini/topic_classification_records.csv',encoding='utf-8-sig',newline='') as f:
              recrows=list(csv.DictReader(f))
          with open(f'{out}/replication_gpt5mini/topic_assignments.csv',encoding='utf-8-sig',newline='') as f:
              longrows=list(csv.DictReader(f))
          status={r['record_id']:r for r in recrows}
          for r in longrows:
              pred[r['record_id']].add(r['path_id'])
              reasons[r['record_id']].append(f"{r['path_id']}: {r.get('reason','')}")
          ids=[r['record_id'] for r in queue]
          failed=[rid for rid in ids if rid not in status or status[rid].get('status')!='completed']
          if failed: raise SystemExit(f'Replication technical failures: {len(failed)}')
          details=[]; tp=fp=fn=exact=0; jaccards=[]; old_counts=[]; new_counts=[]
          qby={r['record_id']:r for r in queue}
          for rid in ids:
              a=ref[rid]; b=pred[rid]
              t=len(a&b); fpos=len(b-a); fneg=len(a-b)
              tp+=t; fp+=fpos; fn+=fneg; exact+=int(a==b)
              u=len(a|b); j=len(a&b)/u if u else 1.0
              jaccards.append(j); old_counts.append(len(a)); new_counts.append(len(b))
              details.append({
                  'record_id':rid,'title':qby[rid]['title'],
                  'reference_path_ids':'; '.join(sorted(a)),'gpt5mini_path_ids':'; '.join(sorted(b)),
                  'added_by_gpt5mini':'; '.join(sorted(b-a)),'missed_by_gpt5mini':'; '.join(sorted(a-b)),
                  'reference_count':len(a),'gpt5mini_count':len(b),'exact_set_match':a==b,
                  'jaccard':round(j,6),'gpt5mini_review_required':status[rid].get('review_required',''),
                  'gpt5mini_reasons':' || '.join(reasons[rid])
              })
          precision=tp/(tp+fp) if tp+fp else 1.0
          recall=tp/(tp+fn) if tp+fn else 1.0
          f1=2*precision*recall/(precision+recall) if precision+recall else 0.0
          summary={
              'records':len(ids),'model':'gpt-5-mini','reasoning_effort':'medium',
              'classifier':'legacy V4 full-corpus prompt and ontology presentation',
              'historical_reference':'original assignments from repaired master',
              'exact_set_matches':exact,'exact_set_agreement':exact/len(ids),
              'true_positive_paths':tp,'false_positive_paths':fp,'false_negative_paths':fn,
              'path_precision':precision,'path_recall':recall,'path_f1':f1,
              'mean_record_jaccard':sum(jaccards)/len(jaccards),
              'mean_historical_topics_per_record':statistics.mean(old_counts),
              'mean_gpt5mini_topics_per_record':statistics.mean(new_counts),
              'median_historical_topics_per_record':statistics.median(old_counts),
              'median_gpt5mini_topics_per_record':statistics.median(new_counts),
              'technical_failures':0
          }
          with open(f'{out}/topic_replication_comparison.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=details[0].keys()); w.writeheader(); w.writerows(details)
          with open(f'{out}/topic_replication_summary.json','w',encoding='utf-8') as f: json.dump(summary,f,indent=2)
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload replication test artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow06-v4-gpt5mini-replication-${{ github.run_id }}
          path: outputs/workflow06/
          if-no-files-found: error
          retention-days: 90