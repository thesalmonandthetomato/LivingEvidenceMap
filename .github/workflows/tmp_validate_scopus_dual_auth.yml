name: TEMP validate Scopus dual authentication

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_scopus_dual_auth.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))
      - name: Test W00 Scopus count authentication
        env:
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(httr2);library(jsonlite)})
          key <- trimws(Sys.getenv('SCOPUS_API_TOKEN',''))
          inst <- trimws(Sys.getenv('SCOPUS_INSTTOKEN',''))
          cat(sprintf('API key present=%s length=%d\n',nzchar(key),nchar(key)))
          cat(sprintf('Insttoken present=%s length=%d\n',nzchar(inst),nchar(inst)))
          stopifnot(nzchar(key),nzchar(inst))
          req <- request('https://api.elsevier.com/content/search/scopus') |>
            req_headers(
              Accept='application/json',
              `X-ELS-APIKey`=key,
              `X-ELS-Insttoken`=inst,
              `User-Agent`='LivingEvidenceMap W00 Scopus dual-auth validation'
            ) |>
            req_url_query(query='TITLE-ABS-KEY(salmon AND aquacultur*)',start=0L,count=1L,view='STANDARD') |>
            req_error(is_error=function(resp)FALSE)
          resp <- req_perform(req)
          body <- resp_body_string(resp)
          cat(sprintf('HTTP_STATUS=%d\n',resp_status(resp)))
          if(resp_status(resp)>=400) stop(substr(body,1,1000))
          x <- fromJSON(body,simplifyVector=FALSE)
          n <- as.integer(x[['search-results']][['opensearch:totalResults']][[1]])
          cat(sprintf('SCOPUS_TEST_COUNT=%d\n',n))
          cat('PASS: Scopus API key + institutional token accepted\n')
