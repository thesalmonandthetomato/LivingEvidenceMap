name: Full OpenAlex OQL harvest

on:
  push:
    branches:
      - updater-workflow-00c-openalex-ingestion
    paths:
      - '.github/workflows/openalex_full_search.yml'
  workflow_dispatch:
    inputs:
      query:
        description: 'OpenAlex OQL title/abstract query'
        required: true
        default: 'works where title/abstract has (("salmon" or "salmonid*" or "Salmo" or "Oncorhynchus" or "rainbow trout") and ("farm*" or "cage*" or "pens" or "penned" or "pen" or "aquacultur*" or "commercial*"))'
        type: string

permissions:
  contents: read

jobs:
  full-openalex-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout OpenAlex integration branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00c-openalex-ingestion
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))

      - name: Resolve search query
        id: cfg
        shell: bash
        env:
          INPUT_QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail
          query="${INPUT_QUERY:-works where title/abstract has ((\"salmon\" or \"salmonid*\" or \"Salmo\" or \"Oncorhynchus\" or \"rainbow trout\") and (\"farm*\" or \"cage*\" or \"pens\" or \"penned\" or \"pen\" or \"aquacultur*\" or \"commercial*\"))}"
          {
            echo "query<<EOF"
            echo "$query"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run full lossless OpenAlex harvest
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
          OPENALEX_QUERY: ${{ steps.cfg.outputs.query }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00c_openalex_ingestion.R \
            --query "$OPENALEX_QUERY" \
            --max-records all \
            --page-size 100 \
            --output-dir outputs/updater/openalex_full_search

      - name: Verify full-harvest safeguards
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f outputs/updater/openalex_full_search/manifest.json
          test -f outputs/updater/openalex_full_search/checkpoint.json
          test -f outputs/updater/openalex_full_search/validation.json
          grep -q '"status": "success"' outputs/updater/openalex_full_search/manifest.json
          grep -q '"duplicate_openalex_ids_n": 0' outputs/updater/openalex_full_search/validation.json
          grep -q '"count_matches_first_page_total": true' outputs/updater/openalex_full_search/validation.json
          grep -q '"canonical_json_modified": false' outputs/updater/openalex_full_search/validation.json

      - name: Show manifest and validation
        if: always()
        shell: bash
        run: |
          if [ -f outputs/updater/openalex_full_search/manifest.json ]; then
            cat outputs/updater/openalex_full_search/manifest.json
          fi
          if [ -f outputs/updater/openalex_full_search/validation.json ]; then
            cat outputs/updater/openalex_full_search/validation.json
          fi
          if [ -f outputs/updater/openalex_full_search/checkpoint.json ]; then
            echo "--- checkpoint ---"
            cat outputs/updater/openalex_full_search/checkpoint.json
          fi

      - name: Guard canonical tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -e data/canonical/current/openalex ] || [ -e data/canonical/current/openalex_full_search ]; then
            echo "Unexpected OpenAlex output under canonical tree"
            exit 1
          fi

      - name: Upload full OpenAlex harvest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-full-search-${{ github.run_id }}
          path: outputs/updater/openalex_full_search/
          if-no-files-found: error
          retention-days: 30
