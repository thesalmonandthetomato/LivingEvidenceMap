name: TEMP OpenAlex sync-filter access test

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - '.github/workflows/_temp_openalex_sync_access_test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test from_updated_date access
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$OPENALEX_API_KEY" ] || { echo "OPENALEX_API_KEY missing"; exit 2; }
          code="$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENALEX_API_KEY" \
            'https://api.openalex.org/works?filter=from_updated_date:2026-09-21&per-page=1')"
          echo "HTTP_STATUS=$code"
          python3 - <<'PY'
import json
with open('/tmp/body.json') as f:
    x=json.load(f)
print("HAS_RESULTS=", isinstance(x.get("results"), list))
print("META_COUNT=", (x.get("meta") or {}).get("count"))
print("ERROR=", x.get("error"))
print("MESSAGE=", x.get("message"))
PY
          [ "$code" -lt 400 ]
