name: W08b offline citation-edge regression
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - scripts/workflow08b/merge_edges.R
      - tests/test_workflow08b_edges.R
      - .github/workflows/test_workflow08b_edges.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install jsonlite
        shell: Rscript {0}
        run: install.packages('jsonlite')
      - name: Test offline citation-edge logic
        run: Rscript tests/test_workflow08b_edges.R
