name: TEMP W08b November readiness audit
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_november_readiness_20261031.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("jsonlite","httr2","digest","data.table"))'
      - name: Resolve authoritative pointers
        shell: Rscript {0}
        run: |
          library(jsonlite)
          r<-read.csv("docs/workflow08/zenodo_registry.csv",stringsAsFactors=FALSE)
          s<-r[r$status=="authoritative",,drop=FALSE]
          stopifnot(nrow(s)==1L)
          st<-fromJSON("docs/current_run/current_run_status.json",simplifyVector=FALSE)
          w08<-sprintf("docs/workflow08/zenodo/run-%s.json",s$source_run_id[[1]])
          w01<-sprintf("docs/deduplication/zenodo/run-%s.json",st$workflow_runs$W01)
          stopifnot(file.exists(w08),file.exists(w01))
          writeLines(w08,"w08_pointer.txt")
          writeLines(w01,"w01_pointer.txt")
          cat("Authoritative current pointers:",w08,w01,"\n")
      - name: Restore validated W08 and W01
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w08b"
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R --pointer "$(cat w08_pointer.txt)" --output "$RUNNER_TEMP/w08b/w08.jsonl"
          Rscript scripts/updater/workflow_01_restore_current_state.R --pointer "$(cat w01_pointer.txt)" --pointer-dir docs/deduplication/zenodo --output-root "$RUNNER_TEMP/w08b/w01"
          test -s "$RUNNER_TEMP/w08b/w01/canonical/records.jsonl"
      - name: Strict W08-to-W01 current-seed crosswalk
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/crosswalk_identifiers.R "$RUNNER_TEMP/w08b/w08.jsonl" "$RUNNER_TEMP/w08b/w01/canonical/records.jsonl" "$RUNNER_TEMP/w08b/crosswalk"
          cat "$RUNNER_TEMP/w08b/crosswalk/summary.json"
      - name: Restore October citation discovery checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/workflow08b/restore_discovery.R 23627417 "$RUNNER_TEMP/w08b/previous"
      - name: Simulate November seed plan; no citation APIs
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/plan_monthly.R "$RUNNER_TEMP/w08b/crosswalk/seed_identifier_crosswalk.csv" "$RUNNER_TEMP/w08b/previous/lens_seed_status.jsonl" 2026-11 "$RUNNER_TEMP/w08b/november"
          Rscript -e '
            library(jsonlite)
            s<-fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"w08b/crosswalk/summary.json"))
            p<-fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"w08b/november/summary.json"))
            stopifnot(s$w08_records==p$seeds,!p$automatic_downloads_authorised)
            writeLines(toJSON(list(crosswalk=s,planner=p),auto_unbox=TRUE,pretty=TRUE),"november_readiness_aggregate.json")
            cat(readLines("november_readiness_aggregate.json"),sep="\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: november-w08b-readiness-aggregate
          path: november_readiness_aggregate.json
          retention-days: 14
          if-no-files-found: error
