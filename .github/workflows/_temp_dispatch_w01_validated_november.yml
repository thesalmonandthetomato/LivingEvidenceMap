name: TEMP dispatch validated November W01 resume
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_dispatch_w01_validated_november.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch validated W01 resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 45429266223 --json conclusion --jq .conclusion)" = success
          test "$(gh run list --workflow workflow_01_resume_after_human_review.yml --branch workflow01-final-architecture --limit 30 --json status --jq '[.[]|select(.status != "completed")]|length')" = 0
          test ! -f docs/deduplication/checkpoints/resolutions/run-45349525216.json
          gh workflow run workflow_01_resume_after_human_review.yml --ref workflow01-final-architecture -f handoff_path=docs/deduplication/handoffs/w01/run-45349525216.json
          echo "PASS: validated November W01 resume dispatched"
