name: Build final master

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download completed topic artifact
        uses: actions/download-artifact@v4
        with:
          name: topics-2026-08-13-lens-update
          path: topic_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31796411644

      - name: Verify topic artifact
        run: |
          set -euo pipefail
          test -f topic_artifact/topic_assignments.csv
          echo "Topic artifact found: topic_artifact/topic_assignments.csv"

      - name: Build and validate candidate master
        run: |
          set +e
          python3 scripts/merge_master_update.py
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          paths = [
              Path('data/reference/salmon_evidence_map.csv'),
              Path('data/updates/2026-08-13_lens/records_after_species_geography_adjudication.csv'),
          ]

          def rows(path):
              with path.open(newline='', encoding='utf-8-sig') as f:
                  return list(csv.DictReader(f))

          def value(row, names):
              for name in names:
                  if row.get(name, '').strip():
                      return row[name].strip()
              return ''

          def key(row):
              lens = value(row, ['lens_id', 'Lens ID', 'LensID'])
              doi = value(row, ['doi', 'DOI', 'doi_id'])
              title = value(row, ['title', 'Title', 'document_title', 'Document Title']).lower()
              if lens: return ('lens', lens.lower())
              if doi: return ('doi', doi.lower())
              if title: return ('title', title)
              return None

          master = rows(paths[0]); update = rows(paths[1])
          for label, data in [('MASTER', master), ('UPDATE', update), ('COMBINED', master + update)]:
              seen = defaultdict(list)
              for i, row in enumerate(data, 2):
                  k = key(row)
                  if k is not None:
                      seen[k].append((i, value(row, ['lens_id', 'Lens ID', 'LensID']), value(row, ['title', 'Title', 'document_title', 'Document Title'])))
              dup = [(k, v) for k, v in seen.items() if len(v) > 1]
              print(f'{label}: rows={len(data)} duplicate_identity_keys={len(dup)}')
              for k, vals in dup[:20]:
                  print(f'  {k}: {vals}')
          PY
          fi
          exit "$status"

      - name: Archive current master and promote candidate
        run: |
          set -euo pipefail
          mkdir -p data/reference/archive
          cp data/reference/salmon_evidence_map.csv data/reference/archive/salmon_evidence_map_2026-08-14_premerge.csv
          cp data/reference/salmon_evidence_map_2026-08-14.csv data/reference/salmon_evidence_map.csv

      - name: Commit final master
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reference/salmon_evidence_map.csv data/reference/salmon_evidence_map_2026-08-14_manifest.csv data/reference/archive/salmon_evidence_map_2026-08-14_premerge.csv
          git commit -m "Promote validated master 2026-08-14"
          git push

      - name: Upload final master audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-master-2026-08-14
          path: |
            data/reference/salmon_evidence_map.csv
            data/reference/salmon_evidence_map_2026-08-14_manifest.csv
            data/reference/archive/salmon_evidence_map_2026-08-14_premerge.csv
