name: Build final master

on:
  workflow_dispatch:
    inputs:
      topic_run_id:
        description: 'GitHub Actions run ID containing the completed topic_assignments.csv artifact'
        required: true
        type: string
      topic_artifact_name:
        description: 'Exact artifact name containing topic_assignments.csv'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download completed topic artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.topic_artifact_name }}
          path: topic_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.topic_run_id }}

      - name: Verify topic artifact
        run: |
          set -euo pipefail
          test -f topic_artifact/topic_assignments.csv

      - name: Apply 153 recovered topics to authoritative master
        run: python3 scripts/apply_topic_recovery_to_master.py

      - name: Archive current master and promote topic-repaired master
        run: |
          set -euo pipefail
          mkdir -p data/reference/archive
          cp data/reference/salmon_evidence_map.csv data/reference/archive/salmon_evidence_map_2026-08-15_pre_topic_repair.csv
          cp data/reference/salmon_evidence_map_topic_repaired.csv data/reference/salmon_evidence_map.csv

      - name: Commit final master
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reference/salmon_evidence_map.csv data/reference/archive/salmon_evidence_map_2026-08-15_pre_topic_repair.csv
          git commit -m "Apply recovered topics to authoritative master"
          git push

      - name: Upload final master audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-master-topic-repair-2026-08-15-${{ github.run_id }}
          path: |
            data/reference/salmon_evidence_map.csv
            data/reference/salmon_evidence_map_topic_repaired.csv
            data/reference/archive/salmon_evidence_map_2026-08-15_pre_topic_repair.csv
          if-no-files-found: warn
