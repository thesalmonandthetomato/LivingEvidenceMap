name: Test full-text preparation

on:
  workflow_dispatch:
    inputs:
      n_papers:
        description: "Number of existing GROBID papers to prepare"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_DEPOSITION_ID: "22085902"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download existing test corpus from Zenodo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token = os.environ["ZENODO_ACCESS_TOKEN"]
          dep = os.environ["ZENODO_DEPOSITION_ID"]
          req = urllib.request.Request(
              f"https://zenodo.org/api/deposit/depositions/{dep}",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)
          files = data.get("files", [])
          if not files:
              raise SystemExit("Zenodo deposition contains no files")
          remote = files[0]
          url = remote["links"]["download"]
          with urllib.request.urlopen(
              urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"}),
              timeout=180,
          ) as response:
              Path("test_corpus.zip").write_bytes(response.read())
          print(f"Downloaded {remote['filename']} ({remote['filesize']} bytes)")
          PY

      - name: Extract GROBID XML files
        run: |
          mkdir -p test_corpus/raw
          unzip -q test_corpus.zip -d test_corpus/raw
          find test_corpus/raw -type f -name '*.tei.xml' | sort | head -n "${{ github.event.inputs.n_papers || 5 }}" > test_corpus/grobid_test_files.txt
          test -s test_corpus/grobid_test_files.txt
          echo "Selected files:"
          cat test_corpus/grobid_test_files.txt

      - name: Prepare selected papers
        run: |
          mkdir -p test_corpus/prepared
          while IFS= read -r file; do
            work_id="$(basename "$file" .tei.xml)"
            python scripts/fulltext_coding/prepare_fulltext_for_coding.py \
              --input "$file" \
              --output "test_corpus/prepared/${work_id}.json"
          done < test_corpus/grobid_test_files.txt

      - name: Validate prepared JSON structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("test_corpus/prepared").glob("*.json"))
          if not files:
              raise SystemExit("No prepared JSON files found")

          for path in files:
              record = json.loads(path.read_text(encoding="utf-8"))
              required = {"source_file", "title", "sections", "preferred_evidence"}
              missing = sorted(required - set(record))
              if missing:
                  raise SystemExit(f"{path}: missing prepared fields {missing}")
              if not isinstance(record["sections"], list):
                  raise SystemExit(f"{path}: sections must be a list")
              preferred = record["preferred_evidence"]
              if not isinstance(preferred, dict):
                  raise SystemExit(f"{path}: preferred_evidence must be an object")
              for key in ("methods", "results", "introduction_tail"):
                  if key not in preferred or not isinstance(preferred[key], list):
                      raise SystemExit(f"{path}: preferred_evidence.{key} must be a list")
              print(f"VALID PREPARED: {path.name}")

          print(f"Validated {len(files)} prepared records")
          PY

      - name: Write test manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("test_corpus/prepared").glob("*.json"))
          manifest = {
              "workflow": "test_fulltext_preparation",
              "purpose": "validate preparation layer before any LLM calls",
              "ontology": "data/reference/topic_ontology_v3.csv",
              "ontology_sha": "bd8bd87c6b9205465de3d081f595a10d82118e66",
              "schema": "scripts/fulltext_coding/coding_schema_v1.json",
              "prompt": "scripts/fulltext_coding/fulltext_coding_prompt_v1.txt",
              "zenodo_deposition": 22085902,
              "prepared_files": [p.name for p in files],
          }
          Path("test_corpus/prepared/test_manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload prepared test corpus (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-preparation-test-${{ github.run_id }}
          path: test_corpus/prepared/
          retention-days: 90
          if-no-files-found: error
