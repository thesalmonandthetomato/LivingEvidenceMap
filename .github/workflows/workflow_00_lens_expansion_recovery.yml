name: Workflow 00 Lens expansion recovery

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/workflow_00_lens_expansion_recovery.yml

permissions:
  contents: write
  actions: read

jobs:
  lens-expansion:
    uses: ./.github/workflows/workflow_00_search_orchestrator.yml
    with:
      run_type: expansion
      lens: true
      scopus: false
      openalex: false
      agricola: false
      wos: false
      additional_farm_term: 'maricultur*'
      resume_run_id: ''
    secrets: inherit
