name: Temporary - WoS Starter entitlement test

on:
  push:
    branches:
      - tmp-wos-starter-entitlement-test
    paths:
      - '.github/workflows/tmp_wos_starter_entitlement_test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-entitlements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-wos-starter-entitlement-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite"))

      - name: Test WoS Starter database entitlements
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({
            library(httr2)
            library(jsonlite)
          })

          key <- Sys.getenv("WOS_STARTER_API")
          stopifnot(nzchar(key))

          dbs <- c(
            WOS="Web of Science Core Collection",
            BIOABS="Biological Abstracts",
            BCI="BIOSIS Citation Index",
            BIOSIS="BIOSIS Previews",
            CCC="Current Contents Connect",
            DIIDW="Derwent Innovations Index",
            DRCI="Data Citation Index",
            MEDLINE="MEDLINE",
            ZOOREC="Zoological Record",
            PPRN="Preprint Citation Index",
            RC="Research Commons",
            WOK="All databases"
          )

          endpoint <- "https://api.clarivate.com/apis/wos-starter/v1/documents"

          res <- lapply(names(dbs), function(db) {
            req <- request(endpoint) |>
              req_headers(
                Accept="application/json",
                `X-ApiKey`=key,
                `User-Agent`="LivingEvidenceMap temporary entitlement audit"
              ) |>
              req_url_query(
                db=db,
                q='TS="salmon"',
                limit=1,
                page=1,
                detail="short"
              ) |>
              req_error(is_error=function(resp) FALSE)

            resp <- req_perform(req)
            status <- resp_status(resp)
            body <- tryCatch(resp_body_string(resp), error=function(e) "")
            parsed <- tryCatch(fromJSON(body, simplifyVector=FALSE), error=function(e) NULL)

            total <- NA_integer_
            err <- NA_character_
            uid <- NA_character_
            citation_dbs <- NA_character_

            if (!is.null(parsed$metadata$total)) total <- as.integer(parsed$metadata$total)
            if (!is.null(parsed$error$details)) err <- as.character(parsed$error$details)
            if (!is.null(parsed$error$title) && is.na(err)) err <- as.character(parsed$error$title)
            if (!is.null(parsed$error_description) && is.na(err)) err <- as.character(parsed$error_description)

            if (!is.null(parsed$hits) && length(parsed$hits)) {
              h <- parsed$hits[[1]]
              if (!is.null(h$uid)) uid <- as.character(h$uid)
              if (!is.null(h$citations) && length(h$citations)) {
                x <- vapply(h$citations, function(z) {
                  if (is.null(z$db)) "" else as.character(z$db)
                }, character(1))
                x <- unique(x[nzchar(x)])
                if (length(x)) citation_dbs <- paste(x, collapse=";")
              }
            }

            data.frame(
              db_code=db,
              database_name=unname(dbs[[db]]),
              http_status=status,
              total_salmon_hits=total,
              first_uid=uid,
              first_hit_citation_db_fields=citation_dbs,
              error=err,
              stringsAsFactors=FALSE
            )
          })

          out <- do.call(rbind, res)
          print(out, row.names=FALSE)

          dir.create("outputs/wos_entitlement_test", recursive=TRUE, showWarnings=FALSE)
          write.csv(out, "outputs/wos_entitlement_test/wos_starter_entitlements.csv", row.names=FALSE, na="")

          wok <- out[out$db_code=="WOK",]
          wos <- out[out$db_code=="WOS",]
          cat("\nSUMMARY\n")
          cat(sprintf("WOS status=%s total=%s\n", wos$http_status, wos$total_salmon_hits))
          cat(sprintf("WOK status=%s total=%s\n", wok$http_status, wok$total_salmon_hits))
          enabled <- out$db_code[out$http_status == 200]
          cat("HTTP 200 databases:", paste(enabled, collapse=", "), "\n")

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: wos-starter-entitlement-test-${{ github.run_id }}
          path: outputs/wos_entitlement_test/
          retention-days: 7
          if-no-files-found: error
