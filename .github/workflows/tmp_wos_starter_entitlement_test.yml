name: Temporary - WoS Starter PQDT test

on:
  push:
    branches:
      - tmp-wos-starter-entitlement-test
    paths:
      - '.github/workflows/tmp_wos_starter_entitlement_test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pqdt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-wos-starter-entitlement-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite"))

      - name: Test PQDT candidate database codes in WoS Starter
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({
            library(httr2)
            library(jsonlite)
          })

          key <- Sys.getenv("WOS_STARTER_API")
          stopifnot(nzchar(key))

          endpoint <- "https://api.clarivate.com/apis/wos-starter/v1/documents"
          candidates <- c("PQDT", "PQDTI", "PQDT-CI", "DISS", "WOS")

          res <- lapply(candidates, function(db) {
            req <- request(endpoint) |>
              req_headers(
                Accept="application/json",
                `X-ApiKey`=key,
                `User-Agent`="LivingEvidenceMap temporary PQDT test"
              ) |>
              req_url_query(
                db=db,
                q='TS="agriculture"',
                limit=1,
                page=1,
                detail="short"
              ) |>
              req_error(is_error=function(resp) FALSE)

            resp <- req_perform(req)
            status <- resp_status(resp)
            body <- tryCatch(resp_body_string(resp), error=function(e) "")
            parsed <- tryCatch(fromJSON(body, simplifyVector=FALSE), error=function(e) NULL)

            total <- NA_integer_
            uid <- NA_character_
            err <- NA_character_

            if (!is.null(parsed$metadata$total)) total <- as.integer(parsed$metadata$total)
            if (!is.null(parsed$hits) && length(parsed$hits) && !is.null(parsed$hits[[1]]$uid)) {
              uid <- as.character(parsed$hits[[1]]$uid)
            }
            if (!is.null(parsed$error$details)) err <- as.character(parsed$error$details)
            if (!is.null(parsed$error$title) && is.na(err)) err <- as.character(parsed$error$title)
            if (!is.null(parsed$error_description) && is.na(err)) err <- as.character(parsed$error_description)

            data.frame(
              db_code=db,
              http_status=status,
              total_agriculture_hits=total,
              first_uid=uid,
              error=err,
              stringsAsFactors=FALSE
            )
          })

          out <- do.call(rbind, res)
          print(out, row.names=FALSE)

          dir.create("outputs/wos_pqdt_test", recursive=TRUE, showWarnings=FALSE)
          write.csv(out, "outputs/wos_pqdt_test/wos_starter_pqdt_test.csv", row.names=FALSE, na="")

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: wos-starter-pqdt-test-${{ github.run_id }}
          path: outputs/wos_pqdt_test/
          retention-days: 7
          if-no-files-found: error
