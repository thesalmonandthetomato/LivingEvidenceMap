name: W08 temporary optional exclusion test
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w08-temporary-policy-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        shell: Rscript {0}
        run: install.packages(c("readr","dplyr","jsonlite","digest","stringr"))
      - name: Check policy configuration and scripts
        shell: Rscript {0}
        run: |
          library(jsonlite)
          cfg<-fromJSON("user_input/workflow08_human_review_config.json")
          stopifnot(isTRUE(cfg$exclude_on_deterministic_none),identical(cfg$deterministic_none_code,"NONE"),identical(cfg$geography_corrections_path,""))
          f<-readLines("scripts/updater/workflow_08_finalize_canonical_dynamic.R")
          stopifnot(!any(grepl("geography_code_corrections_2026-10-04",f,fixed=TRUE)))
          parse(file="scripts/updater/workflow_08_finalize_canonical_dynamic.R")
          parse(file="scripts/updater/workflow_08_build_review_queue_dynamic.R")
          cat("PASS: explicit W08 policy and no dated corrections default\n")
      - name: Check W08 queue with deterministic NONE enabled and disabled
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(readr)
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w08-policy")
          dir.create(t)
          records<-data.frame(record_id=c("none","coded"),title=c("A","B"),abstract=c("No code","Has code"))
          w05<-data.frame(record_id=records$record_id,farmed_species_codes=c("NONE","SP1"),farmed_species=c("","Species 1"))
          w06<-data.frame(record_id=records$record_id,geography_status="NONE",luna_iso3c="",luna_country_names="",luna_evidence="",geography_reason="",llm_failed=FALSE,llm_error="",deterministic_primary_countries="",deterministic_primary_iso3c="")
          review<-data.frame(record_id="none",workflow08_reason="zero_topic_eligibility_uncertain",zero_topic_rescreen_decision="uncertain")
          scores<-data.frame(record_id=character(),path_id=character())
          late<-data.frame(record_id=character())
          for(z in list(records=records,w05=w05,w06=w06,review=review,scores=scores,late=late)){}
          write_csv(records,file.path(t,"records.csv"));write_csv(w05,file.path(t,"w05.csv"));write_csv(w06,file.path(t,"w06.csv"));write_csv(review,file.path(t,"review.csv"));write_csv(scores,file.path(t,"scores.csv"));write_csv(late,file.path(t,"late.csv"))
          cfg<-fromJSON("user_input/workflow08_human_review_config.json")
          run<-function(enabled,tag) {
            cfg$exclude_on_deterministic_none<-enabled
            conf<-file.path(t,paste0(tag,".json"));write_json(cfg,conf,auto_unbox=TRUE)
            args<-c("scripts/updater/workflow_08_build_review_queue_dynamic.R","--w05",file.path(t,"w05.csv"),"--w06",file.path(t,"w06.csv"),"--w07-records",file.path(t,"records.csv"),"--w07-review",file.path(t,"review.csv"),"--w07-scores",file.path(t,"scores.csv"),"--w07-late-exclusions",file.path(t,"late.csv"),"--review-config",conf,"--output-dir",file.path(t,tag))
            stopifnot(system2("Rscript",args)==0L)
            readLines(file.path(t,tag,"workflow08_review_queue_current.jsonl"))
          }
          enabled<-run(TRUE,"enabled")
          disabled<-run(FALSE,"disabled")
          stopifnot(!any(grepl('"record_id":"none"',enabled,fixed=TRUE)),any(grepl('"record_id":"none"',disabled,fixed=TRUE)))
          cat("PASS: NONE exclusion suppresses review only when configured\n")
