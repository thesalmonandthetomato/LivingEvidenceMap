name: TEMP W08b live pending Lens recovery validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_live_lens_pending.yml']
permissions:
  contents: read
concurrency:
  group: w08b-live-lens-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite","httr2","digest"))'
      - name: Restore only latest November draft
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          W08B_ALLOW_DRAFT_RESTORE: '1'
          W08B_EXPECTED_ARCHIVE_SHA: 9e6fdd0ff5a43789bfb28e6ff02427315c0162cbb05ee3ce38a869273fc8c54f
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/restore_discovery.R 24628405 "$RUNNER_TEMP/state"
          jq -e '.update_month=="2026-11" and .queries_remaining==189 and .provider_discovery_complete==false' "$RUNNER_TEMP/state/monthly_discovery_status.json"
      - name: Run corrected Lens retrieval against actual outstanding identifiers
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          W08B_DEFER_EDGE_MERGE: '1'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/state"
          Rscript scripts/workflow08b/run_lens_bulk_manifest.R "$ROOT/expanded_lens_identifier_queries.csv" "$ROOT" 100 2026-11
          Rscript -e '
            library(jsonlite)
            root<-file.path(Sys.getenv("RUNNER_TEMP"),"state")
            q<-read.csv(file.path(root,"expanded_lens_identifier_queries.csv"),stringsAsFactors=FALSE)
            h<-new.env(hash=TRUE,parent=emptyenv())
            for(line in readLines(file.path(root,"lens_seed_status.jsonl"))){
              x<-fromJSON(line,simplifyVector=FALSE);h[[x$lens_id]]<-x
            }
            ids<-unique(q$query_identifier)
            remaining<-sum(vapply(ids,function(id){x<-h[[id]];is.null(x)||!identical(x$update_id,"2026-11")||!isTRUE(x$status%in%c("complete","not_found"))},logical(1)))
            s<-fromJSON(file.path(root,"discovery_summary.json"))
            cat("Live Lens result: completed=",s$completed_this_execution,"; unavailable=",s$not_found_this_execution,"; remaining=",remaining,"\n",sep="")
            stopifnot(remaining==0L,s$completed_this_execution+s$not_found_this_execution==189L,!s$halted_early)'
