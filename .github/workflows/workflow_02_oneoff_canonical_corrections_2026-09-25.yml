name: Workflow 02 - One-off canonical corrections 2026-09-25

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/enrichment/.run_workflow02_oneoff_canonical_corrections_2026-09-25'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','data.table'))

      - name: Restore authoritative Workflow 01 state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer docs/deduplication/zenodo/run-36128255337.json \
            --pointer-dir docs/deduplication/zenodo \
            --output-root workflow01_state
          test -s workflow01_state/canonical/records.jsonl

      - name: Restore authoritative published Workflow 02 enrichment state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_restore_state_from_zenodo.R \
            --pointer docs/enrichment/zenodo/run-36137804187.json \
            --output-dir workflow02_state
          PATCH="$(find workflow02_state -name cumulative_patch.jsonl -type f -print -quit)"
          test -n "$PATCH"
          echo "PATCH=$PATCH" >> "$GITHUB_ENV"

      - name: Reconstruct authoritative Workflow 02 canonical JSONL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          Rscript scripts/updater/workflow_02_apply_patch.R \
            --input workflow01_state/canonical/records.jsonl \
            --patch "$PATCH" \
            --output outputs/canonical_before_oneoff.jsonl \
            --report outputs/w02_replay_report.json \
            --mode exact
          Rscript -e 'library(jsonlite);r<-fromJSON("outputs/w02_replay_report.json");stopifnot(r$status=="PASS",r$input_records==32292L,r$patch_records==3434L,r$matched_patch_records==3434L,length(r$conflicts)==0L,r$output_sha256=="c88d36631512b5b30853fb3ae271db2e456b2a8b5b94925ccf0840e8f8d9156b");cat("PASS: authoritative Workflow 02 enrichment state reconstructed exactly\\n")'

      - name: Build sparse one-off correction state
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)

          ledger_path <- 'data/adjudication/workflow02/oneoff_canonical_corrections_2026-09-25.jsonl'
          state_dir <- 'outputs/correction_state'
          dir.create(state_dir,recursive=TRUE,showWarnings=FALSE)

          readjl <- function(p){
            x <- readLines(p,warn=FALSE,encoding='UTF-8')
            x <- x[nzchar(trimws(x))]
            lapply(x,fromJSON,simplifyVector=FALSE)
          }
          writejl <- function(xs,p){
            con <- file(p,'wt',encoding='UTF-8'); on.exit(close(con),add=TRUE)
            if(length(xs)) for(z in xs) writeLines(toJSON(z,auto_unbox=TRUE,null='null',na='null'),con,useBytes=TRUE)
          }

          ledger <- readjl(ledger_path)
          ids <- vapply(ledger,function(z)as.character(z$record_id),character(1))
          stopifnot(length(ledger)==7L,!anyDuplicated(ids))
          accepted <- Filter(function(z)!identical(as.character(z$action),'do_not_repair'),ledger)
          rejected <- Filter(function(z)identical(as.character(z$action),'do_not_repair'),ledger)
          stopifnot(length(accepted)==6L,length(rejected)==1L)

          # Capture exact current title for the one explicit title replacement.
          in_lines <- readLines('outputs/canonical_before_oneoff.jsonl',warn=FALSE,encoding='UTF-8')
          rows <- lapply(in_lines[nzchar(trimws(in_lines))],fromJSON,simplifyVector=FALSE)
          rmap <- setNames(rows,vapply(rows,function(r)as.character(r$identity$record_id),character(1)))
          patches <- lapply(accepted,function(z){
            r <- rmap[[as.character(z$record_id)]]
            stopifnot(!is.null(r))
            p <- list(record_id=z$record_id,doi=z$doi)
            if(identical(as.character(z$action),'set_title_and_abstract')){
              p$expected_title <- r$canonical$title
              p$title <- z$title
              p$abstract <- z$abstract
            } else if(identical(as.character(z$action),'fill_abstract')){
              p$abstract <- z$abstract
            } else stop(sprintf('Unsupported accepted action %s',z$action))
            p
          })
          writejl(patches,file.path(state_dir,'canonical_corrections.jsonl'))
          file.copy(ledger_path,file.path(state_dir,'decision_audit.jsonl'),overwrite=TRUE)

          summary <- list(
            schema='living-evidence-map-workflow02-canonical-correction-build-v1',
            status='PASS',
            source_workflow02_run_id='36137804187',
            input_canonical_sha256=digest(file='outputs/canonical_before_oneoff.jsonl',algo='sha256',serialize=FALSE),
            decisions=length(ledger),
            accepted_repairs=length(accepted),
            do_not_repair=length(rejected),
            patch_records=length(patches),
            deliberately_unrepaired_record_id=as.character(rejected[[1]]$record_id)
          )
          writeLines(toJSON(summary,auto_unbox=TRUE,pretty=TRUE,null='null'),file.path(state_dir,'build_report.json'),useBytes=TRUE)
          cat('PASS: built sparse six-record correction patch from seven decisions\n')

      - name: Apply sparse correction patch
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_apply_canonical_correction_patch.R \
            --input outputs/canonical_before_oneoff.jsonl \
            --patch outputs/correction_state/canonical_corrections.jsonl \
            --output outputs/canonical_corrected.jsonl \
            --report outputs/correction_state/correction_report.json

      - name: Validate corrected canonical state
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)

          app <- fromJSON('outputs/correction_state/correction_report.json')
          build <- fromJSON('outputs/correction_state/build_report.json')
          stopifnot(app$status=='PASS',app$records==32292L,app$patch_records==6L,length(app$changed_record_ids)==6L)

          # Ensure the explicit do-not-repair record still has no abstract.
          target <- 'work-7e50c9d8a89e9519'
          lines <- readLines('outputs/canonical_corrected.jsonl',warn=FALSE,encoding='UTF-8')
          hit <- NULL
          for(ln in lines[nzchar(trimws(lines))]){
            r <- fromJSON(ln,simplifyVector=FALSE)
            if(identical(as.character(r$identity$record_id),target)){hit<-r;break}
          }
          stopifnot(!is.null(hit))
          a <- hit$canonical$abstract
          stopifnot(is.null(a) || !nzchar(trimws(as.character(a))))

          # Final state lineage report used by Zenodo archive and Workflow 03 handoff.
          final <- list(
            schema='living-evidence-map-workflow02-canonical-correction-final-v1',
            status='PASS',
            source_workflow02_run_id='36137804187',
            input_canonical_sha256=app$input_sha256,
            output_canonical_sha256=app$output_sha256,
            patch_sha256=app$patch_sha256,
            records=app$records,
            patch_records=app$patch_records,
            changed_record_ids=app$changed_record_ids,
            deliberately_unrepaired_record_id=target,
            deliberately_unrepaired_abstract_missing=TRUE
          )
          writeLines(toJSON(final,auto_unbox=TRUE,pretty=TRUE,null='null'),'outputs/correction_state/final_report.json',useBytes=TRUE)
          cat(sprintf('PASS: six corrections validated; output SHA256=%s\n',app$output_sha256))

      - name: Publish sparse Workflow 02 correction state to restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          W01_SHA="$(Rscript -e "cat(digest::digest(file='workflow01_state/canonical/records.jsonl',algo='sha256',serialize=FALSE))")"
          INPUT_SHA="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/correction_state/final_report.json");cat(x$input_canonical_sha256)')"
          OUTPUT_SHA="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/correction_state/final_report.json");cat(x$output_canonical_sha256)')"
          mkdir -p outputs/correction_zenodo
          Rscript scripts/updater/workflow_02_archive_correction_state_to_zenodo.R \
            --state-dir outputs/correction_state \
            --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir outputs/correction_zenodo \
            --workflow01-canonical-sha256 "$W01_SHA" \
            --previous-pointer docs/enrichment/zenodo/run-36137804187.json \
            --input-canonical-sha256 "$INPUT_SHA" \
            --output-canonical-sha256 "$OUTPUT_SHA"

      - name: Register Workflow 02 correction state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin workflow01-final-architecture
          Rscript scripts/updater/workflow_02_update_zenodo_registry.R \
            --receipt outputs/correction_zenodo/zenodo_receipt.json \
            --registry docs/enrichment/zenodo_registry.csv \
            --pointer-dir docs/enrichment/zenodo
          git add docs/enrichment/zenodo_registry.csv "docs/enrichment/zenodo/run-$GITHUB_RUN_ID.json"
          if ! git diff --cached --quiet; then
            git commit -m "Register Workflow 02 canonical correction state $GITHUB_RUN_ID"
            git push origin HEAD:workflow01-final-architecture
          fi

      - name: Upload compact correction audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow02-oneoff-canonical-corrections-${{ github.run_id }}
          path: |
            outputs/w02_replay_report.json
            outputs/correction_state/
            outputs/correction_zenodo/
            data/adjudication/workflow02/oneoff_canonical_corrections_2026-09-25.jsonl
          retention-days: 30
          if-no-files-found: warn
