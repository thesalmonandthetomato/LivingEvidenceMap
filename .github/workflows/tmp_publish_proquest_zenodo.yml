name: Temporary - publish ProQuest restricted Zenodo record

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'user_input/manual_ris_proquest_publish.trigger'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))

      - name: Guard and publish existing restricted ProQuest draft
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: Rscript scripts/updater/tmp_publish_proquest_zenodo.R
