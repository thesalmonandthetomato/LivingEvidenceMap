name: Temporary - one-off refreshed report deploy
# deploy template refresh: fix phrase position scalar handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_oneoff_report_pages_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '36457402997'
  SOURCE_ARTIFACT: 'workflow10-dashboard-36457402997'
  TRIAL_RUN_ID: '36683748299'
  TRIAL_ARTIFACT: 'workflow10-search-trial-36683748299'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 1

      - name: Checkout validated Workflow 10 template
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          path: workflow10
          fetch-depth: 1

      - name: Download validated Workflow 10 data
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: preview_artifact

      - name: Assemble deterministic Workflow 10 preview
        shell: bash
        run: |
          set -euo pipefail
          HTML='workflow10/docs/dashboard-redesign-temp.html'
          DATA=$(find preview_artifact -type f -name dashboard-data.js -print -quit)
          test -s "$HTML"
          test -s "$DATA"
          cp "$HTML" production/docs/workflow10-preview.html
          sed -i 's#<script src="./dashboard-data.js"></script>#<script src="./workflow10-preview-data.js"></script>#' production/docs/workflow10-preview.html
          cp "$DATA" production/docs/workflow10-preview-data.js

          grep -q "Databases" production/docs/workflow10-preview.html
          grep -q "22/09/26" production/docs/workflow10-preview.html
          grep -q "topic_stars" production/docs/workflow10-preview.html
          grep -q "databases_searched" production/docs/workflow10-preview-data.js
          grep -q "search_results" production/docs/workflow10-preview-data.js
          grep -q "unique_records_screened" production/docs/workflow10-preview-data.js
          test $(wc -c < production/docs/workflow10-preview-data.js) -gt 1000000
          echo "PASS: complete Workflow 10 preview assembled"

      - name: Download validated isolated search trial
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TRIAL_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TRIAL_RUN_ID }}
          path: trial_artifact

      - name: Add isolated search trial without modifying preview
        shell: bash
        run: |
          set -euo pipefail
          TRIAL_HTML='workflow10/docs/dashboard-search-trial.html'
          TRIAL_DATA=$(find trial_artifact -type f -name workflow10-search-trial-data.js -print -quit)
          TRIAL_INDEX=$(find trial_artifact -type f -name workflow10-search-trial-index.js -print -quit)
          test -s "$TRIAL_HTML"
          test -s "$TRIAL_DATA"
          test -s "$TRIAL_INDEX"

          cp "$TRIAL_HTML" production/docs/workflow10-search-trial.html
          cp "$TRIAL_DATA" production/docs/workflow10-search-trial-data.js
          cp "$TRIAL_INDEX" production/docs/workflow10-search-trial-index.js

          grep -q "Search and download" production/docs/workflow10-search-trial.html
          grep -q "Search across titles and abstracts" production/docs/workflow10-search-trial.html
          grep -q "abstract_snippet" production/docs/workflow10-search-trial-data.js
          if grep -q '"abstract":' production/docs/workflow10-search-trial-data.js; then
            echo "ERROR: full abstract field present in trial dashboard data" >&2
            exit 1
          fi
          grep -q "LIVING_EVIDENCE_MAP_ABSTRACT_INDEX" production/docs/workflow10-search-trial-index.js
          grep -q "downloadProgressBar" production/docs/workflow10-search-trial.html
          grep -q "Reconstructing abstracts" production/docs/workflow10-search-trial.html
          grep -q "Writing RIS records" production/docs/workflow10-search-trial.html
          grep -q "Boolean syntax: AND, OR, NOT" production/docs/workflow10-search-trial.html
          grep -q "parseBoolean" production/docs/workflow10-search-trial.html
          grep -q "idsForPhrase" production/docs/workflow10-search-trial.html
          grep -q "wildcardRegex" production/docs/workflow10-search-trial.html
          grep -q "variantsForPattern" production/docs/workflow10-search-trial.html
          grep -q "normalisePattern" production/docs/workflow10-search-trial.html
          grep -q "positionArray" production/docs/workflow10-search-trial.html
          grep -q "Searching titles and abstracts" production/docs/workflow10-search-trial.html
          grep -Fq "if(titleTokens.some(function(t){return tokenMatchesPattern(t,term);}))ids.add" production/docs/workflow10-search-trial.html
          grep -Fq "wildcards (* = zero or more characters; ? = one character)" production/docs/workflow10-search-trial.html

          # Reassert the existing preview is still present after adding the trial.
          test -s production/docs/workflow10-preview.html
          test -s production/docs/workflow10-preview-data.js
          echo "PASS: isolated search trial added; existing Workflow 10 preview preserved"

      - name: Add Workflow 09 methodology and results pages
        shell: bash
        run: |
          set -euo pipefail
          METHODS='workflow10/docs/reporting/workflow_09/manuscript/methods.html'
          RESULTS='workflow10/docs/reporting/workflow_09/manuscript/results.html'
          FIGURES='workflow10/docs/reporting/workflow_09/figures'
          test -s "$METHODS"
          test -s "$RESULTS"
          test -d "$FIGURES"
          cp "$METHODS" production/docs/methodology.html
          cp "$RESULTS" production/docs/results.html
          mkdir -p production/docs/report-figures
          cp "$FIGURES"/*.png production/docs/report-figures/

          sed -i \
            -e 's#../../visualisations/figure_07_flow_diagram.png#./report-figures/figure_01_flow_diagram.png#g' \
            -e 's#../citesource_contribution/database_contribution_upset.png#./report-figures/figure_02_database_contribution.png#g' \
            -e 's#../../visualisations/figure_01_records_by_publication_year.png#./report-figures/figure_03_publication_year_species.png#g' \
            -e 's#../../visualisations/figure_05_records_by_publication_year_high_level_topic.png#./report-figures/figure_04_publication_year_topics.png#g' \
            -e 's#../../visualisations/figure_03_choropleth_records_by_country.png#./report-figures/figure_05_country_choropleth.png#g' \
            -e 's#../../visualisations/figure_02_records_by_country.png#./report-figures/figure_06_country_species.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04a_top_level_topics.png#./report-figures/figure_07_top_level_topics.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04a_hierarchy_production.png#./report-figures/figure_08_production.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04b_hierarchy_environment.png#./report-figures/figure_09_environment.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04c_hierarchy_methods.png#./report-figures/figure_10_methods.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04d_hierarchy_industry_and_governance.png#./report-figures/figure_11_industry_and_governance.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04e_hierarchy_product.png#./report-figures/figure_12_product.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04f_hierarchy_people_and_society.png#./report-figures/figure_13_people_and_society.png#g' \
            -e 's#../../visualisations/topic_hierarchy/figure_04g_hierarchy_inputs_and_resources.png#./report-figures/figure_14_inputs_and_resources.png#g' \
            -e 's#../../visualisations/figure_08_umbrella_review.png#./report-figures/figure_15_umbrella_review.png#g' \
            production/docs/results.html

          grep -q "The status of academic research on salmon farming: a living evidence map" production/docs/methodology.html
          grep -q "The status of academic research on salmon farming: a living evidence map" production/docs/results.html
          grep -q 'href="./methodology.html"' production/docs/workflow10-preview.html
          grep -q 'href="./methodology.html"' production/docs/workflow10-search-trial.html
          grep -q 'href="./results.html"' production/docs/workflow10-preview.html
          grep -q 'href="./results.html"' production/docs/workflow10-search-trial.html
          test "$(find production/docs/report-figures -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 15
          test "$(grep -o 'src="./report-figures/[^"]*"' production/docs/results.html | wc -l)" -eq 15
          if grep -q '../../visualisations/' production/docs/results.html; then
            echo "ERROR: unresolved visualisations path remains in deployed results HTML" >&2
            exit 1
          fi
          if grep -q '../citesource_contribution/' production/docs/results.html; then
            echo "ERROR: unresolved CiteSource figure path remains in deployed results HTML" >&2
            exit 1
          fi
          echo "PASS: Workflow 09 methodology/results pages and all 15 result figures added"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
