name: W01-Fast isolated development guardrails
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_development_guardrails.yml
      - scripts/updater/experimental_w01_fast/**
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install minimal R audit dependencies
        shell: Rscript {0}
        run: install.packages(c("yaml","jsonlite","data.table","digest"))
      - name: Validate frozen reference and development boundaries
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/validate_development_guardrails.R
      - name: Inventory unchanged production W01 interfaces
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/audit_production_interfaces.R
      - name: Test candidate and cluster comparator regression controls
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_regression_comparators.R
      - name: Test incremental cluster identity protections
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_incremental_cluster_identity.R
      - name: Validate persistent exact index against reference builder
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_persistent_exact_index.R
      - name: Verify fuzzy-title rarity depends on full corpus
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_fuzzy_rarity_safety.R
      - name: Compare incremental q-gram frequencies with full rebuild
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_persistent_qgram_frequency.R
      - name: Validate persisted fuzzy candidate parity
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_persistent_qgram_candidates.R
      - name: Validate append-only pair decision ledger
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_append_pair_decisions.R
      - name: Test identity-keyed clustering and row permutations
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_identity_clusters.R
      - name: Test identity-based affected work identification
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_affected_works.R
      - name: Test identity-scoped canonicalisation staging
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_prepare_affected_canonical_map.R
      - name: Test identity-filtered canonical source streams
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_filter_canonical_source_inputs.R
      - name: Test identity-filtered canonical repair and strip directives
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/test_filter_canonical_directives.R
      - name: Preserve interface inventory
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-interface-inventory
          path: scripts/updater/experimental_w01_fast/audits/production_interface_inventory.json
          retention-days: 7
          if-no-files-found: error
