name: W04 audit 154 rescreened records
on:
  push:
    branches: [w01-fast-direct-delta]
    paths: ['.github/workflows/w04_rescreen_audit_20261023.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-direct-delta
          persist-credentials: false
      - name: Download frozen current and previous W04 prepared inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/w04-current /tmp/w04-prior
          gh run download 40019139120 --repo "$GITHUB_REPOSITORY" --name workflow04-prepared-40019139120 --dir /tmp/w04-current
          gh run download 39150923062 --repo "$GITHUB_REPOSITORY" --name workflow04-prepared-39150923062 --dir /tmp/w04-prior
          find /tmp/w04-current /tmp/w04-prior -name canonical_lean.jsonl -print
      - name: Compare all six W04 fingerprint fields for exactly 154 existing records
        run: |
          python3 - <<'PY'
          import json,csv,collections,pathlib
          a=pathlib.Path('/tmp/w04-current');b=pathlib.Path('/tmp/w04-prior')
          def locate(root,end):
              items=[p for p in root.rglob('*') if p.is_file() and str(p).endswith(end)]
              if len(items)!=1: raise RuntimeError(f'Expected one {end} in {root}, got {items}')
              return items[0]
          refresh=locate(a,'scientific_input_refresh_records.csv')
          with refresh.open() as f: ids={r['record_id']:r for r in csv.DictReader(f)}
          if len(ids)!=154: raise RuntimeError(f'Expected 154 changed records, got {len(ids)}')
          def load(root):
              result={}
              with locate(root,'canonical_lean.jsonl').open() as f:
                  for ln in f:
                      if not ln.strip():continue
                      v=json.loads(ln)
                      rid=v['identity']['record_id']
                      if rid in ids: result[rid]=v
              if len(result)!=154: raise RuntimeError(f'Only found {len(result)} records in {root}')
              return result
          curr=load(a);prev=load(b)
          def textify(x):
              if x is None:return ''
              if isinstance(x,str):return x
              if isinstance(x,list):return '; '.join(filter(None,[textify(y) for y in x]))
              if isinstance(x,dict):return '; '.join(filter(None,[textify(y) for y in x.values()]))
              return str(x)
          def first(*xs):
              return next((textify(x).strip() for x in xs if textify(x).strip()),'')
          def view(r):
              c=r.get('canonical') or {}
              return {'title':first(c.get('title'),r.get('title')),
                      'abstract':first(c.get('abstract'),r.get('abstract')),
                      'keywords':first(c.get('keywords'),r.get('keywords')),
                      'journal_source_title':first(c.get('source_title'),c.get('journal'),r.get('source_title'),r.get('journal')),
                      'affiliations':first(c.get('affiliations'),r.get('affiliations')),
                      'funding':first(c.get('funding'),c.get('funders'),r.get('funding'),r.get('funders'))}
          fields=collections.Counter();combos=collections.Counter();title_abstract=0;only_aux=0;abstract_gained=0;abstract_lost=0;examples=[]
          for rid in sorted(ids):
              p=view(prev[rid]);c=view(curr[rid]);changed=tuple(k for k in p if p[k]!=c[k])
              if not changed:raise RuntimeError(f'No field differs for fingerprint change {rid}')
              fields.update(changed);combos[changed]+=1
              if 'title' in changed or 'abstract' in changed:title_abstract+=1
              else:only_aux+=1
              if not p['abstract'] and c['abstract']:abstract_gained+=1
              if p['abstract'] and not c['abstract']:abstract_lost+=1
              examples.append({'record_id':rid,'fields':','.join(changed),'old_title_len':len(p['title']),'new_title_len':len(c['title']),'old_abstract_len':len(p['abstract']),'new_abstract_len':len(c['abstract'])})
          report={'changed_existing_records':len(ids),'changed_field_counts':dict(fields),'changes_only_outside_title_abstract':only_aux,'title_or_abstract_changed':title_abstract,'abstract_gained':abstract_gained,'abstract_lost':abstract_lost,'field_combinations':{'+'.join(k):v for k,v in combos.items()}}
          print(json.dumps(report,indent=2))
          pathlib.Path('/tmp/w04_audit_summary.json').write_text(json.dumps(report,indent=2))
          with pathlib.Path('/tmp/w04_audit_records.csv').open('w') as f:
              w=csv.DictWriter(f,fieldnames=list(examples[0]));w.writeheader();w.writerows(examples)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w04-154-rescreen-field-audit
          path: |
            /tmp/w04_audit_summary.json
            /tmp/w04_audit_records.csv
          if-no-files-found: error
