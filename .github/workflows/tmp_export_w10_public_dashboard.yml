name: TEMP export current W10 public dashboard

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_export_w10_public_dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
      - name: Download exact passed W10 dashboard artefact
        uses: actions/download-artifact@v4
        with:
          name: workflow10-dashboard-37783651009
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37783651009
          path: /tmp/w10
      - name: Stage exact public dashboard data for transfer
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/w10/index.html
          test -s /tmp/w10/dashboard-data.js
          mkdir -p public_export
          cp /tmp/w10/dashboard-data.js public_export/dashboard-data.js
          sha256sum /tmp/w10/dashboard-data.js public_export/dashboard-data.js
      - name: Commit transfer staging file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_export/dashboard-data.js
          if git diff --cached --quiet; then
            echo "Public export already current."
            exit 0
          fi
          git commit -m "Stage exact W10 dashboard data for public transfer [skip ci]"
          git pull --rebase origin workflow01-final-architecture
          git push origin HEAD:workflow01-final-architecture
