name: TEMP W08b monthly state guard regression
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_state_guard_test_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Fail closed on missing state; succeed with both provider ledgers
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("monthly_state_test")
          z<-data.frame(record_id=c("a","b"),lens_id=c("L1",""),
            openalex_id=c("","W1"),doi=c("",""),
            preferred_route=c("lens","openalex"),identifier_conflict=c(FALSE,FALSE))
          write.csv(z,"monthly_state_test/seeds.csv",row.names=FALSE)
          base<-c("scripts/workflow08b/plan_monthly.R","monthly_state_test/seeds.csv",
            "monthly_state_test","2026-11","monthly_state_test/out")
          err<-suppressWarnings(system2("Rscript",base,stdout=FALSE,stderr=FALSE))
          stopifnot(err!=0L)
          writeLines(toJSON(list(record_id="a",provider="lens",status="complete",update_id="2026-10"),auto_unbox=TRUE),
            "monthly_state_test/lens_seed_status.jsonl")
          err<-suppressWarnings(system2("Rscript",base,stdout=FALSE,stderr=FALSE))
          stopifnot(err!=0L)
          writeLines(toJSON(list(record_id="b",provider="openalex",status="complete",update_id="2026-10"),auto_unbox=TRUE),
            "monthly_state_test/openalex_seed_status.jsonl")
          stopifnot(system2("Rscript",base)==0L)
          s<-fromJSON("monthly_state_test/out/summary.json")
          stopifnot(s$seeds==2L,s$new_seeds==0L,s$forward_refresh_required==2L)
          cat("PASS: missing/partial previous state rejected; both providers refresh in new month\n")
