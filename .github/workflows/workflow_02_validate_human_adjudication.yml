name: Workflow 02 - Validate human adjudication adapter

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'scripts/updater/workflow_02_apply_human_decisions.R'
      - 'scripts/updater/workflow_02_build_human_review.R'
      - 'scripts/updater/workflow_02_publish_human_review_queue_to_shiny.R'
      - '.github/workflows/workflow_02_validate_human_adjudication.yml'
      - '.github/workflows/workflow_02_batched.yml'
      - '.github/workflows/shiny-adjudication-publish-w02-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest"))

      - name: Parse W02 adjudication adapter
        shell: Rscript {0}
        run: |
          parse(file="scripts/updater/workflow_02_build_human_review.R")
          parse(file="scripts/updater/workflow_02_apply_human_decisions.R")
          parse(file="scripts/updater/workflow_02_publish_human_review_queue_to_shiny.R")
          cat("PASS: W02 human adjudication and direct Shiny publisher scripts parse\n")

      - name: Validate Scopus FULL keyword conflict packaging
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("tmp/w02kw",recursive=TRUE,showWarnings=FALSE)

          rec <- list(
            identity=list(record_id="rec-keywords"),
            canonical=list(title="Canonical title",abstract="Existing abstract",doi="10.1/keywords")
          )
          writeLines(toJSON(rec,auto_unbox=TRUE,null="null"),"tmp/w02kw/input.jsonl")

          audit <- list(
            record_id="rec-keywords",
            doi="10.1/keywords",
            europe_pmc=list(),
            scopus=list(title="META title",author_keywords=list()),
            scopus_keywords=list(
              title="FULL title",
              author_keywords=c("salmon","aquaculture"),
              returned_doi="10.1/keywords",
              route="direct_doi_full"
            ),
            quarantined=list(list(
              provider="scopus",field="author_keywords",
              reason="keyword_identity_guard_failed",
              title_similarity=0.80,returned_doi="10.1/keywords"
            ))
          )
          writeLines(toJSON(audit,auto_unbox=TRUE,null="null"),"tmp/w02kw/audit.jsonl")

          status <- system2("Rscript",c(
            "scripts/updater/workflow_02_build_human_review.R",
            "--input","tmp/w02kw/input.jsonl",
            "--audit","tmp/w02kw/audit.jsonl",
            "--output-dir","tmp/w02kw/review",
            "--status","tmp/w02kw/status.json"
          ))
          stopifnot(status==0L)
          z <- fromJSON(readLines("tmp/w02kw/review/workflow02_human_review.jsonl"),simplifyVector=FALSE)
          stopifnot(
            identical(z$conflict$field,"author_keywords"),
            identical(z$conflict$reason,"keyword_identity_guard_failed"),
            identical(as.character(z$provider_response$route),"direct_doi_full"),
            identical(unlist(z$provider_response$author_keywords,use.names=FALSE),c("salmon","aquaculture"))
          )
          cat("PASS: W02 keyword conflict carries the FULL Scopus provider response into adjudication\n")

      - name: Validate accepted and rejected decisions
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)
          dir.create("tmp/w02test", recursive=TRUE, showWarnings=FALSE)

          q <- list(
            list(
              schema="living-evidence-map-workflow02-shiny-case-v1",
              review_case_id="case-1",
              record_id="rec-1",
              doi="10.1/example",
              provider="scopus",
              field="abstract",
              reason="title_mismatch",
              canonical=list(record_id="rec-1",doi="10.1/example",title="Canonical title",abstract=NULL),
              conflict=list(provider="scopus",field="abstract",reason="title_mismatch",title_similarity=0.85),
              provider_response=list(title="Provider title",abstract="Human approved abstract",returned_doi="10.1/example")
            ),
            list(
              schema="living-evidence-map-workflow02-shiny-case-v1",
              review_case_id="case-2",
              record_id="rec-2",
              doi="10.2/example",
              provider="scopus",
              field="",
              reason="returned_doi_mismatch",
              returned_doi="10.999/wrong",
              canonical=list(record_id="rec-2",doi="10.2/example",title="Another title",abstract=NULL),
              conflict=list(provider="scopus",reason="returned_doi_mismatch",returned_doi="10.999/wrong"),
              provider_response=list(title="Wrong record",abstract="Wrong abstract",returned_doi="10.999/wrong")
            )
          )
          con <- file("tmp/w02test/queue.jsonl","wt")
          for(z in q) writeLines(toJSON(z,auto_unbox=TRUE,null="null"),con)
          close(con)
          sha <- digest(file="tmp/w02test/queue.jsonl",algo="sha256",serialize=FALSE)

          d <- list(
            list(review_case_id="case-1",record_id="rec-1",provider="scopus",field="abstract",reason="title_mismatch",decision="accept_provider_field",reviewer="test",resolved_at_utc="2026-10-01T12:00:00Z",queue_sha256=sha),
            list(review_case_id="case-2",record_id="rec-2",provider="scopus",field="",reason="returned_doi_mismatch",decision="reject_provider_match",reviewer="test",resolved_at_utc="2026-10-01T12:01:00Z",queue_sha256=sha)
          )
          con <- file("tmp/w02test/decisions.jsonl","wt")
          for(z in d) writeLines(toJSON(z,auto_unbox=TRUE,null="null"),con)
          close(con)

          p <- list(
            list(
              record_id="rec-1",
              input_doi="10.1/example",
              title=list(value="Existing automatic title",provider="europe_pmc"),
              abstract=NULL,
              author_keywords=NULL,
              metadata_enrichment=list(workflow="workflow_02_metadata_enrichment",filled_fields="title"),
              audit=list(applied=list(list(provider="europe_pmc",field="title")))
            )
          )
          con <- file("tmp/w02test/current_patch.jsonl","wt")
          for(z in p) writeLines(toJSON(z,auto_unbox=TRUE,null="null"),con)
          close(con)

          cmd <- c(
            "scripts/updater/workflow_02_apply_human_decisions.R",
            "--queue","tmp/w02test/queue.jsonl",
            "--decisions","tmp/w02test/decisions.jsonl",
            "--current-patch","tmp/w02test/current_patch.jsonl",
            "--output-patch","tmp/w02test/output_patch.jsonl",
            "--manifest","tmp/w02test/manifest.json",
            "--expected-queue-sha256",sha
          )
          status <- system2("Rscript",cmd)
          stopifnot(status==0L)

          out <- lapply(readLines("tmp/w02test/output_patch.jsonl"),fromJSON,simplifyVector=FALSE)
          stopifnot(length(out)==1L)
          stopifnot(identical(out[[1]]$record_id,"rec-1"))
          stopifnot(identical(out[[1]]$title$value,"Existing automatic title"))
          stopifnot(identical(out[[1]]$abstract$value,"Human approved abstract"))
          stopifnot(isTRUE(out[[1]]$abstract$human_adjudicated))
          stopifnot(length(out[[1]]$metadata_enrichment$human_adjudication)==1L)

          m <- fromJSON("tmp/w02test/manifest.json",simplifyVector=FALSE)
          stopifnot(m$status=="PASS",m$accepted_provider_fields==1L,m$rejected_conflicts==1L)
          cat("PASS: W02 accept/reject decisions preserve automatic patch and overlay accepted field\n")

      - name: Require uncertain decisions to remain blocking
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)
          sha <- digest(file="tmp/w02test/queue.jsonl",algo="sha256",serialize=FALSE)
          d <- list(
            list(review_case_id="case-1",record_id="rec-1",provider="scopus",field="abstract",reason="title_mismatch",decision="uncertain",reviewer="test",resolved_at_utc="2026-10-01T12:00:00Z",queue_sha256=sha),
            list(review_case_id="case-2",record_id="rec-2",provider="scopus",field="",reason="returned_doi_mismatch",decision="reject_provider_match",reviewer="test",resolved_at_utc="2026-10-01T12:01:00Z",queue_sha256=sha)
          )
          con <- file("tmp/w02test/uncertain.jsonl","wt")
          for(z in d) writeLines(toJSON(z,auto_unbox=TRUE,null="null"),con)
          close(con)
          out <- suppressWarnings(system2("Rscript",c(
            "scripts/updater/workflow_02_apply_human_decisions.R",
            "--queue","tmp/w02test/queue.jsonl",
            "--decisions","tmp/w02test/uncertain.jsonl",
            "--current-patch","tmp/w02test/current_patch.jsonl",
            "--output-patch","tmp/w02test/should_not_exist.jsonl",
            "--manifest","tmp/w02test/should_not_exist.json",
            "--expected-queue-sha256",sha
          ), stdout=TRUE, stderr=TRUE))
          status <- attr(out,"status")
          if (is.null(status)) status <- 0L
          stopifnot(status!=0L)
          stopifnot(any(grepl("uncertain decision remains",out,fixed=TRUE)))
          cat("PASS: uncertain W02 decision correctly blocks completion\n")
