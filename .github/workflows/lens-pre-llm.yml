name: Lens pre-LLM processing

on:
  push:
    paths:
      - 'scripts/run_lens_pre_llm.R'
      - 'scripts/validate_lens_update.R'
      - 'scripts/setup_pipeline.R'
      - 'R/**'
      - 'data/updates/2026-08-13_lens/lens-export.ris'
      - 'data/reference/salmon_evidence_map.csv'
      - '.github/workflows/lens-pre-llm.yml'
  workflow_dispatch:

jobs:
  pre-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::fs
            any::here
            any::purrr
            any::readr
            any::stringdist
            any::stringi
            any::stringr
            any::tibble
            any::tidyr
      - name: Run Lens import and deduplication
        run: Rscript scripts/run_lens_pre_llm.R
      - name: Upload pre-LLM audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: lens-pre-llm-audit
          path: |
            data/updates/2026-08-13_lens/deduplication_audit.csv
            data/updates/2026-08-13_lens/records_after_deduplication.csv
            data/updates/2026-08-13_lens/pre_llm_summary.csv
            data/updates/2026-08-13_lens/input_validation.csv
          if-no-files-found: error
