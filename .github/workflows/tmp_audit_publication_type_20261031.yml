name: Temporary read-only canonical publication type coverage audit
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_audit_publication_type_20261031.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install only archive read dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest'))
      - name: Restore authoritative canonical, validate checksum and count
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R \
            --pointer docs/workflow08/zenodo/run-40656599532.json \
            --output "$RUNNER_TEMP/canonical.jsonl"
      - name: Read-only publication type coverage
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          `%||%` <- function(x,y) if(is.null(x)||!length(x)) y else x
          con <- file(file.path(Sys.getenv("RUNNER_TEMP"),"canonical.jsonl"),"rt")
          on.exit(close(con),add=TRUE)
          total <- 0L; present <- 0L; multiple <- 0L
          freq <- integer(); missing_examples <- character()
          path_counter <- integer()
          repeat {
            lines <- readLines(con,n=250L,warn=FALSE)
            if(!length(lines))break
            for(line in lines) {
              if(!nzchar(trimws(line)))next
              total <- total+1L
              record <- fromJSON(line,simplifyVector=FALSE)
              val <- (record$canonical %||% list())$publication_type
              if(is.null(val)) val <- record$publication_type
              terms <- as.character(unlist(val,use.names=FALSE))
              terms <- unique(trimws(terms[!is.na(terms)]))
              terms <- terms[nzchar(terms)]
              if(length(terms)) {
                present <- present+1L
                if(length(terms)>1L)multiple<-multiple+1L
                for(term in terms) {
                  if(!term %in% names(freq)) freq[term] <- 0L
                  freq[term] <- freq[term]+1L
                }
              } else if(length(missing_examples)<5L) {
                missing_examples <- c(missing_examples,as.character(record$record_id %||% "missing-record-id"))
              }
            }
          }
          if(total!=27726L) stop("Unexpected canonical count: ",total)
          cat(sprintf("COVERAGE total=%d present=%d missing=%d pct=%.3f multiple_values=%d distinct_labels=%d\n",
            total,present,total-present,100*present/total,multiple,length(freq)))
          cat("TYPE FREQUENCIES (records per distinct source-supplied label):\n")
          if(length(freq))for(i in order(freq,decreasing=TRUE))
            cat(sprintf("%d | %s\n",freq[[i]],names(freq)[i]))
          cat("MISSING RECORD IDS: ",paste(missing_examples,collapse=", "), "\n")
          cat("PASS: coverage computed from SHA-verified W08 canonical JSONL\n")
