name: W01-Fast publication contract runtime smoke
on:
  push:
    branches: [w01-fast-direct-delta]
    paths: ['.github/workflows/w01_fast_publication_runtime_smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rocker/r-ver:4.4.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-direct-delta
          persist-credentials: false
      - name: Runtime success and fail-closed contract checks
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e "install.packages(c('jsonlite','digest','data.table'),repos='https://cloud.r-project.org')"
          Rscript - <<'RS'
          library(jsonlite);library(digest)
          script <- "scripts/updater/experimental_w01_fast/audit_publication_contract.R"
          parse(file=script)
          t<-tempfile("w01-contract-");dir.create(t)
          write<-function(path,value){f<-file.path(t,path);dir.create(dirname(f),recursive=TRUE,showWarnings=FALSE);writeLines(value,f,useBytes=TRUE)}
          j<-function(path,value)write(path,toJSON(value,auto_unbox=TRUE,null="null"))
          sha<-function(path)digest(file=file.path(t,path),algo="sha256",serialize=FALSE)
          write("previous_state/workflow01_full_five_source/manifestation_cluster_map.csv","source,source_record_id,cluster_id\nlens,a,work-1")
          j("previous_state/workflow01_full_five_source/summary.json",list(source_manifestations=1))
          write("previous_state/canonical/records.jsonl",'{"identity":{"record_id":"work-1"}}')
          j("outputs/workflow01_union/source_inputs.json",list(sources=list(lens="example.jsonl")))
          write("outputs/final/manifestation_cluster_map.csv","source,source_record_id,cluster_id\nlens,a,work-1")
          write("outputs/final/final_pair_decisions.csv","left,right")
          write("outputs/final/abstract_strip_actions.jsonl","")
          write("outputs/final/cumulative_data_quality_repairs.jsonl","")
          write("outputs/human_gate/normalised/data_quality_repairs.normalised.jsonl","")
          write("outputs/canonical/data_quality_repair_application.jsonl","")
          write("outputs/canonical/records.jsonl",'{"identity":{"record_id":"work-1"}}')
          h<-sha("outputs/canonical/records.jsonl")
          j("outputs/final/summary.json",list(source_manifestations=1,clusters=1))
          j("outputs/canonical/canonical_manifest.json",list(source_manifestations=1,records=1,canonical_jsonl_sha256=h))
          j("outputs/delta/delta_manifest.json",list(target=list(source_manifestations=1,canonical_records=1)))
          j("outputs/replayed/workflow01_delta_replay_audit.json",list(status="PASS",source_manifestations=1,canonical_records=1,canonical_jsonl_sha256=h))
          targets<-c("outputs/final/summary.json","outputs/final/manifestation_cluster_map.csv","outputs/canonical/records.jsonl")
          write("outputs/workflow01_stage_canonicalise_checksums.txt",paste0(vapply(targets,sha,character(1)),"  ",targets,collapse="\n"))
          call<-function(root=t) suppressWarnings(system2("Rscript",c(script,"--root",shQuote(root)),stdout=FALSE,stderr=FALSE))
          stopifnot(call()==0L)
          write("outputs/final/summary.json",'{"source_manifestations":2,"clusters":1}')
          stopifnot(call()!=0L)
          j("outputs/final/summary.json",list(source_manifestations=1,clusters=1))
          stopifnot(call()==0L)
          j("outputs/replayed/workflow01_delta_replay_audit.json",list(status="FAIL",source_manifestations=1,canonical_records=1,canonical_jsonl_sha256=h))
          stopifnot(call()!=0L)
          j("outputs/replayed/workflow01_delta_replay_audit.json",list(status="PASS",source_manifestations=1,canonical_records=1,canonical_jsonl_sha256=h))
          unlink(file.path(t,"outputs/human_gate/normalised/data_quality_repairs.normalised.jsonl"))
          stopifnot(call()!=0L)
          cat("PASS: complete contract, tampered checksum, replay failure and missing repair ledger\n")
          RS
