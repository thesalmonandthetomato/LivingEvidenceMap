name: TEMP W00 three-source API check
on:
  push:
    branches: [production-minimal]
    paths: [.github/workflows/w00-disposable-three-source-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","httr2","digest"))
      - name: One request per source, no stored results
        shell: Rscript {0}
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        run: |
          library(jsonlite)
          library(httr2)
          tmp<-tempfile("w00-ephemeral-")
          dir.create(tmp)
          on.exit(unlink(tmp,recursive=TRUE),add=TRUE)
          selection<-file.path(tmp,"selection.json")
          writeLines(toJSON(list(selected_sources=c("lens","scopus","wos")),auto_unbox=TRUE),selection)
          status<-system2("Rscript",c("scripts/updater/workflow_00_translate_generic.R",
            "--run-type","full","--config","user_input/workflow00_search_strategy.salmon_equivalence_candidate.json",
            "--source-selection",selection,"--output-dir",file.path(tmp,"plan")),stdout=FALSE,stderr=FALSE)
          if(status!=0L)stop("W00 translation failed")
          q<-fromJSON(file.path(tmp,"plan","source_queries.json"),simplifyVector=FALSE)
          check<-function(source,fn){
            tryCatch({fn();cat(sprintf("PASS %s first-page API test\n",source));TRUE},
              error=function(e){cat(sprintf("FAIL %s: %s\n",source,conditionMessage(e)));FALSE})
          }
          no_secret<-function(n) !nzchar(Sys.getenv(n,unset=""))
          skipped<-character()
          passed<-logical()
          if(no_secret("LENS_API_TOKEN")) {
            cat("SKIP lens: no API token\n");skipped<-c(skipped,"lens")
          } else passed<-c(passed,check("lens",function(){
            path<-file.path(tmp,"lens.json")
            status<-system2("Rscript",c("scripts/updater/workflow_00_build_lens_config.R","--query",shQuote(q$lens),"--output",path),stdout=FALSE,stderr=FALSE)
            if(status!=0L)stop("Lens config conversion failed")
            config<-fromJSON(path,simplifyVector=FALSE)
            resp<-request("https://api.lens.org/scholarly/search") |>
              req_headers(Authorization=paste("Bearer",Sys.getenv("LENS_API_TOKEN")),Accept="application/json") |>
              req_body_json(list(query=config$api_query$query,size=1L),auto_unbox=TRUE) |>
              req_timeout(25) |> req_perform()
            if(resp_status(resp)>=400L)stop(paste("HTTP",resp_status(resp)))
            body<-resp_body_json(resp,simplifyVector=FALSE)
            if(is.null(body$data))stop("No Lens data field")
          }))
          if(no_secret("SCOPUS_API_TOKEN")||no_secret("SCOPUS_INSTTOKEN")) {
            cat("SKIP scopus: token disabled or missing\n");skipped<-c(skipped,"scopus")
          } else passed<-c(passed,check("scopus",function(){
            resp<-request("https://api.elsevier.com/content/search/scopus") |>
              req_headers(Accept="application/json",
                `X-ELS-APIKey`=Sys.getenv("SCOPUS_API_TOKEN"),
                `X-ELS-Insttoken`=Sys.getenv("SCOPUS_INSTTOKEN")) |>
              req_url_query(query=q$scopus,start=0L,count=1L,view="STANDARD") |>
              req_timeout(25) |> req_perform()
            body<-resp_body_json(resp,simplifyVector=FALSE)
            if(is.null(body[["search-results"]]))stop("Missing Scopus search-results")
          }))
          if(no_secret("WOS_STARTER_API")) {
            cat("SKIP wos: no API token\n");skipped<-c(skipped,"wos")
          } else passed<-c(passed,check("wos",function(){
            resp<-request("https://api.clarivate.com/apis/wos-starter/v1/documents") |>
              req_headers(`X-ApiKey`=Sys.getenv("WOS_STARTER_API"),Accept="application/json") |>
              req_url_query(q=q$wos,db="WOS",limit=1L,page=1L) |>
              req_timeout(25) |> req_perform()
            body<-resp_body_json(resp,simplifyVector=FALSE)
            if(is.null(body$metadata$total))stop("Missing WoS metadata.total")
          }))
          cat(sprintf("Final: %d passed, %d skipped, %d failed\n",sum(passed),length(skipped),sum(!passed)))
          if(any(!passed))quit(status=1L)
