name: W01-Fast read-only archive range probe
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_artifact_range_probe.yml
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect remote ZIP range support without downloading archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/thesalmonandthetomato/LivingEvidenceMap/actions/artifacts/12259032049/zip"
          mkdir -p probe
          # A range probe is intentionally capped to 1 MiB. No full archive transfer.
          curl --silent --show-error --location --fail \
            --retry 1 --max-time 100 --max-filesize 1048576 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Range: bytes=-65536" \
            --dump-header probe/headers.txt \
            --output probe/tail.bin "$endpoint"
          filesize=$(wc -c < probe/tail.bin)
          echo "Returned byte count: $filesize"
          if (( filesize > 1048576 )); then
            echo "Unsafe remote response size"; exit 1
          fi
          Rscript -e 'h <- readLines("probe/headers.txt", warn=FALSE); status <- grep("^HTTP/", h, value=TRUE); print(tail(status, 2L)); if (!length(status) || !grepl(" 206 ", tail(status, 1L))) stop("Byte ranges not confirmed; full archive download prohibited")'
      - name: Upload small range probe only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-archive-range-probe
          path: probe/headers.txt
          retention-days: 2
          if-no-files-found: warn
