name: W01-Fast read-only archive range probe
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_artifact_range_probe.yml
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Inspect remote ZIP range support without downloading archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/thesalmonandthetomato/LivingEvidenceMap/actions/artifacts/12259032049/zip"
          mkdir -p probe
          # Fetch only GitHub's redirect headers; never follow to the 27 GB body.
          curl --silent --show-error --head --fail --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --dump-header probe/redirect.txt --output /dev/null "$endpoint"
          Rscript -e 'h<-readLines("probe/redirect.txt",warn=FALSE); x<-grep("^location: ",h,value=TRUE,ignore.case=TRUE); if(length(x)!=1L)stop("Expected one download redirect"); u<-trimws(sub("^[^:]+: ","",x)); if(!startsWith(u,"https://productionresult") || !grepl(".blob.core.windows.net/",u,fixed=TRUE))stop("Unexpected storage redirect"); writeLines(u,"probe/signed_url.txt")'
          signed_url="$(cat probe/signed_url.txt)"
          curl --silent --show-error --fail --max-time 60 \
            --range -65536 --max-filesize 1048576 \
            --dump-header probe/headers.txt \
            --output probe/tail.bin "$signed_url"
          rm -f probe/signed_url.txt probe/redirect.txt
          filesize=$(wc -c < probe/tail.bin)
          echo "Remote ZIP tail bytes fetched: $filesize"
          Rscript -e 'h <- readLines("probe/headers.txt", warn=FALSE); status <- grep("^HTTP/",h,value=TRUE); print(tail(status,2L)); if(!length(status) || !grepl(" 206 ",tail(status,1L))) stop("Direct blob range request did not return 206")'
      - name: Upload small range probe only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-archive-range-probe
          path: probe/headers.txt
          retention-days: 2
          if-no-files-found: warn
