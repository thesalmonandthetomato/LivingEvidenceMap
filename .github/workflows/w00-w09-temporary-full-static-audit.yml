name: Temporary full pipeline and Shiny static dependency audit
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w00-w09-temporary-full-static-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minimal pipeline
        uses: actions/checkout@v4
      - name: Checkout read-only Shiny main
        uses: actions/checkout@v4
        with:
          repository: thesalmonandthetomato/LivingEvidenceMapAdjudication
          ref: main
          path: external/shiny
          persist-credentials: false
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages('jsonlite')
      - name: Execute cross-repository static dependency scan
        run: |
          set -euo pipefail
          Rscript scripts/audit_mvp_dependencies.R --shiny-root external/shiny --output /tmp/mvp-full-static-audit.json
          Rscript -e 'x<-jsonlite::fromJSON("/tmp/mvp-full-static-audit.json",simplifyVector=FALSE);stopifnot(x$status!="FAIL");cat("AUDIT:",x$status,"; workflows:",x$counts$workflow_definitions,"; scripts:",x$counts$script_files,"; Shiny R files:",x$shiny$r_files,"\n")'
      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-repository-static-audit
          path: /tmp/mvp-full-static-audit.json
          if-no-files-found: warn
          retention-days: 7
