name: Inspect current master schema

on:
  push:
    paths:
      - '.github/workflows/temp_inspect_master_schema.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Print master header
        shell: bash
        run: |
          set -euo pipefail
          FILE='data/master/current/living_evidence_map_master.csv'
          test -s "$FILE"
          head -n 2 "$FILE"
