name: W08b continue bounded citation discovery
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/workflow08b_continue_discovery.yml']
  workflow_dispatch:
    inputs:
      update_month:
        required: true
        type: string
      source_w08_run_id:
        required: true
        type: string
      checkpoint_id:
        required: true
        type: string
      checkpoint_sha256:
        required: true
        type: string
      parent_run_id:
        required: true
        type: string
      compartment:
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: w08b-one-generation-${{ inputs.source_w08_run_id }}
  cancel-in-progress: false
jobs:
  registration:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Continuation workflow registered; no discovery authorised by push'
  begin:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      update_month: ${{ steps.verify.outputs.update_month }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - name: Verify committed continuation receipt and exact generation
        id: verify
        env:
          MONTH: ${{ inputs.update_month }}
          SOURCE: ${{ inputs.source_w08_run_id }}
          CHECKPOINT: ${{ inputs.checkpoint_id }}
          SHA: ${{ inputs.checkpoint_sha256 }}
          PARENT: ${{ inputs.parent_run_id }}
          COMPARTMENT: ${{ inputs.compartment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ && "$SOURCE" =~ ^[0-9]+$ && "$CHECKPOINT" =~ ^[0-9]+$ && "$SHA" =~ ^[a-f0-9]{64}$ && "$PARENT" =~ ^[0-9]+$ && "$COMPARTMENT" =~ ^[0-9]+$ ]]
          test "$COMPARTMENT" -ge 1 && test "$COMPARTMENT" -le 12
          U="$(jq -er .update_id docs/current_run/current_run_status.json)"
          [[ "$U" =~ ^[A-Za-z0-9._-]+$ ]]
          jq -e --arg r "$SOURCE" --arg m "$MONTH" '.stage=="citation_chasing_started" and .original_w08_run_id==$r and .update_month==$m and .second_generation_forbidden==true' "docs/workflow08b/routing/$U.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT" --jq '.head_branch' | grep -Fx workflow01-final-architecture
          mkdir -p "$RUNNER_TEMP/parent-receipt"
          gh run download "$PARENT" --repo "$GITHUB_REPOSITORY" --name "w08b-monthly-discovery-summary-$PARENT" --dir "$RUNNER_TEMP/parent-receipt"
          RECEIPT="$(find "$RUNNER_TEMP/parent-receipt" -name w08b-receipt.json -type f)"
          STATUS="$(find "$RUNNER_TEMP/parent-receipt" -name monthly_discovery_status.json -type f)"
          test -f "$RECEIPT" && test -f "$STATUS"
          jq -e --arg c "$CHECKPOINT" --arg h "$SHA" --arg p "$PARENT" '.status=="published" and .zenodo_record_id==$c and .sha256==$h and .run_id==$p' "$RECEIPT"
          jq -e --arg m "$MONTH" --arg h "$(jq -r .original_w08_sha256 "docs/workflow08b/routing/$U.json")" '.update_month==$m and .w08_canonical_sha256==$h and .provider_discovery_complete==false and .queries_remaining>0' "$STATUS"
          # Claim a checkpoint once, under the generation-wide concurrency lock.
          # A rerun of the same GitHub run may reuse its claim; another run cannot.
          CLAIM="docs/workflow08b/continuation/$U/checkpoint-$CHECKPOINT.json"
          if [ -f "$CLAIM" ]; then
            jq -e --arg r "$GITHUB_RUN_ID" --arg p "$PARENT" --arg h "$SHA" '.run_id==$r and .parent_run_id==$p and .sha256==$h' "$CLAIM"
          else
            mkdir -p "$(dirname "$CLAIM")"
            jq -n --arg r "$GITHUB_RUN_ID" --arg p "$PARENT" --arg h "$SHA" --arg c "$CHECKPOINT" --arg a "$COMPARTMENT" '{run_id:$r,parent_run_id:$p,sha256:$h,checkpoint_id:$c,compartment:$a}' > "$CLAIM"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$CLAIM"
            git commit -m "W08b: claim continuation checkpoint $CHECKPOINT"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi
          echo "update_month=$MONTH" >> "$GITHUB_OUTPUT"
  discover:
    needs: begin
    uses: ./.github/workflows/workflow08b_monthly_discovery.yml
    with:
      update_month: ${{ needs.begin.outputs.update_month }}
      execute_provider_queries: true
      resume_checkpoint_zenodo_id: ${{ inputs.checkpoint_id }}
      resume_checkpoint_sha256: ${{ inputs.checkpoint_sha256 }}
      resume_attempt: ${{ fromJSON(inputs.compartment) }}
    secrets: inherit

  register_checkpoint:
    needs: [begin, discover]
    if: ${{ needs.discover.outputs.discovery_complete == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Record verified cumulative discovery checkpoint for next month
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/register_monthly_checkpoint.R \
            docs/workflow08b/monthly_checkpoint_registry.json \
            "${{ needs.begin.outputs.update_month }}" \
            "${{ needs.discover.outputs.checkpoint_zenodo_id }}" \
            "${{ needs.discover.outputs.archive_sha256 }}" \
            "${{ needs.discover.outputs.cumulative_candidates }}" \
            "${{ needs.discover.outputs.cumulative_edges }}" \
            "${{ needs.discover.outputs.original_w08_run }}" \
            "${{ needs.discover.outputs.original_w08_sha }}" \
            "$RUNNER_TEMP/next_registry.json"
          mv "$RUNNER_TEMP/next_registry.json" docs/workflow08b/monthly_checkpoint_registry.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/workflow08b/monthly_checkpoint_registry.json
          if ! git diff --cached --quiet; then
            git commit -m "W08b: register complete citation-discovery checkpoint for ${{ needs.begin.outputs.update_month }}"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi

  candidates:
    needs: [begin, discover, register_checkpoint]
    if: ${{ needs.discover.outputs.discovery_complete == 'true' }}
    uses: ./.github/workflows/workflow08b_monthly_candidates.yml
    with:
      update_month: ${{ needs.begin.outputs.update_month }}
      discovery_checkpoint_zenodo_id: ${{ needs.discover.outputs.checkpoint_zenodo_id }}
      execute_bibliography: true
      max_novel_provider_ids: 50000
    secrets: inherit

  no_new_records:
    needs: [begin, discover, candidates]
    if: ${{ needs.candidates.outputs.no_new_bibliographies == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Complete the original W08 generation exactly once and publish W09
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MONTH: ${{ needs.begin.outputs.update_month }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/resolve_monthly_release.R \
            docs/current_run/current_run_status.json \
            docs/workflow08/zenodo_registry.csv docs/deduplication/zenodo \
            "$UPDATE_MONTH" "$RUNNER_TEMP/release.json"
          UPDATE_ID="$(jq -r '.update_id' "$RUNNER_TEMP/release.json")"
          [[ "$UPDATE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          STATE="docs/workflow08b/routing/$UPDATE_ID.json"
          test -s "$STATE"
          STAGE="$(jq -r .stage "$STATE")"
          if [ "$STAGE" != completed ]; then
            if [ "$STAGE" != completed_without_supplemental ]; then
              Rscript scripts/workflow08b/record_routing_event.R no_supplemental \
                "$RUNNER_TEMP/release.json" "$STATE"
            fi
            Rscript scripts/workflow08b/record_routing_event.R completed \
              "$RUNNER_TEMP/release.json" "$STATE"
          fi
          jq -e --arg r "$(jq -r .w08_run_id "$RUNNER_TEMP/release.json")" \
            --arg h "$(jq -r .w08_canonical_sha256 "$RUNNER_TEMP/release.json")" \
            '.original_w08_run_id==$r and .final_w08_run_id==$r and .final_w08_sha256==$h' "$STATE"
          Rscript scripts/workflow08b/finish_monthly_checkpoint.R \
            docs/workflow08b/monthly_checkpoint_registry.json \
            "$UPDATE_MONTH" \
            "$(jq -r '.w08_run_id' "$RUNNER_TEMP/release.json")" \
            "$(jq -r '.w08_canonical_sha256' "$RUNNER_TEMP/release.json")" \
            "$RUNNER_TEMP/next_registry.json"
          mv "$RUNNER_TEMP/next_registry.json" docs/workflow08b/monthly_checkpoint_registry.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATE" docs/workflow08b/monthly_checkpoint_registry.json
          if ! git diff --cached --quiet; then
            git commit -m "W08b: no new bibliography, final W08 and monthly checkpoint accepted"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi
          bash scripts/workflow08b/ensure_w09_handoff.sh "$RUNNER_TEMP/release.json" "$STATE"


  deduplicate:
    needs: [candidates]
    if: ${{ needs.candidates.outputs.bibliography_ready == 'true' }}
    uses: ./.github/workflows/workflow08b_lightweight_dedup.yml
    with:
      bibliography_run: ${{ github.run_id }}
      previous_w01_pointer: ${{ needs.candidates.outputs.original_w01_pointer }}
    secrets: inherit

  publish_review:
    needs: [deduplicate, candidates]
    if: ${{ needs.deduplicate.outputs.dedup_completed == 'true' }}
    uses: ./.github/workflows/workflow08b_publish_shiny.yml
    with:
      dedup_run: ${{ github.run_id }}
      bibliography_run: ${{ github.run_id }}
      previous_w01_pointer: ${{ needs.candidates.outputs.original_w01_pointer }}
    secrets: inherit

  canonical_without_human_review:
    needs: [publish_review]
    if: ${{ needs.publish_review.outputs.no_human_review_required == 'true' }}
    uses: ./.github/workflows/workflow08b_canonical_to_w02.yml
    secrets: inherit
