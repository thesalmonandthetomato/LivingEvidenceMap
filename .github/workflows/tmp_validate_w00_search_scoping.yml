name: TEMP validate W00 search scoping

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w00_search_scoping.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','rmarkdown','knitr','httr2','yaml'))

      - name: Validate workflow and render contract
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/updater/workflow_00_search_orchestrator.R");parse(file="scripts/updater/workflow_00_search_scope_counts.R");yaml::read_yaml(".github/workflows/workflow_00_search_scoping.yml");cat("PASS: scoping workflow/scripts parse\n")'
          rm -rf /tmp/w00scope && mkdir -p /tmp/w00scope
          printf '%s\n' 'source,access_mode,search_date,hits,status' 'Lens,API count,2026-09-30,100,counted' 'Scopus,API count,2026-09-30,200,counted' 'OpenAlex,API count,2026-09-30,300,counted' 'AGRICOLA,API count,2026-09-30,400,counted' 'Web of Science Core Collection,API count,2026-09-30,500,counted' 'CAB Abstracts,Manual search source,2026-09-30,,not counted: no W00 API implementation' 'ProQuest Dissertations & Theses Global,Manual search source,2026-09-30,,not counted: no W00 API implementation' > /tmp/w00scope/counts.csv
          printf '%s\n' '{"search_version":"v1","search_date":"2026-09-30","immutable_species_terms":["salmon","salmonid*","Salmo","Oncorhynchus","\"rainbow trout\""],"base_farm_terms":["farm*","cage*","pens","penned","pen","aquacultur*","commercial*"]}' > /tmp/w00scope/counts.json
          Rscript -e 'rmarkdown::render("docs/reporting/workflow_00/search_scoping_report.Rmd",output_file="/tmp/w00scope/report.html",params=list(counts_csv="/tmp/w00scope/counts.csv",counts_json="/tmp/w00scope/counts.json"),quiet=TRUE)'
          test -s /tmp/w00scope/report.html
          grep -q 'Count-only search scoping' docs/reporting/workflow_00/search_scoping_report.Rmd
          grep -q 'workflow_dispatch' .github/workflows/workflow_00_search_scoping.yml
          echo 'PASS: W00 search scoping architecture validated'
