name: TEMP W01 identity regression and subject audit
on:
  push:
    branches: [production-minimal]
    paths: [.github/workflows/w01-temp-identity-audit.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - shell: Rscript {0}
        run: install.packages(c("jsonlite","digest","data.table"))
      - name: Run immutable identity regression tests
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          Rscript - "$tmp" <<'RS'
          suppressPackageStartupMessages({library(jsonlite);library(digest);library(data.table)})
          d<-commandArgs(TRUE)[[1]]
          x<-data.frame(idx=1:3,source=c("lens","openalex","ethos"),source_record_id=c("lens-001","W001","ETH001"))
          fwrite(x,file.path(d,"metadata.csv"))
          payload<-paste(paste(x$idx,x$source,x$source_record_id,sep="\t"),collapse="\n")
          write_json(list(dedup_index_identity=list(rows=nrow(x),sha256=digest(payload,algo="sha256",serialize=FALSE))),file.path(d,"checkpoint.json"),auto_unbox=TRUE)
          RS
          validate() {
            Rscript scripts/updater/workflow_01_validate_index_identity.R --metadata "$tmp/metadata.csv" --checkpoint-manifest "$tmp/checkpoint.json" >"$tmp/output.log" 2>&1
          }
          validate
          echo 'PASS unchanged checkpoint'
          cp "$tmp/metadata.csv" "$tmp/original.csv"
          Rscript - "$tmp" <<'RS'
          d<-commandArgs(TRUE)[[1]];x<-data.table::fread(file.path(d,"metadata.csv"));x<-x[c(2,1,3)];x$idx<-seq_len(nrow(x));data.table::fwrite(x,file.path(d,"metadata.csv"))
          RS
          if validate; then echo 'FAIL accepted reordered metadata';exit 1;fi
          grep -q 'identity mismatch' "$tmp/output.log"
          echo 'PASS rejects reordered manifestation indexes'
          cp "$tmp/original.csv" "$tmp/metadata.csv"
          sed -i 's/ETH001/ETH999/' "$tmp/metadata.csv"
          if validate; then echo 'FAIL accepted changed source ID';exit 1;fi
          echo 'PASS rejects changed immutable source ID'
          cp "$tmp/original.csv" "$tmp/metadata.csv"
          printf '{"schema":"test"}\n' > "$tmp/checkpoint.json"
          if validate; then echo 'FAIL accepted unsigned checkpoint';exit 1;fi
          grep -q 'lacks dedup_index_identity' "$tmp/output.log"
          echo 'PASS rejects missing identity checksum'
          cp "$tmp/original.csv" "$tmp/metadata.csv"
          Rscript - "$tmp" <<'RS'
          d<-commandArgs(TRUE)[[1]];x<-data.table::fread(file.path(d,"metadata.csv"));x$source_record_id[2]<-x$source_record_id[1];x$source[2]<-x$source[1];data.table::fwrite(x,file.path(d,"metadata.csv"))
          RS
          if validate; then echo 'FAIL accepted duplicate immutable source key';exit 1;fi
          grep -q 'duplicate immutable source identity' "$tmp/output.log"
          echo 'PASS rejects duplicate immutable source key'
      - name: Audit project specificity and stored data
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Tracked data files ==='
          git ls-files data/
          echo '=== W01 salmon/topic-specific occurrences ==='
          grep -nEi 'salmon|rainbow.?trout|aquacultur|oncorhynchus|salmo[^a-z]' scripts/updater/workflow_01*.R config/workflow01* R/deduplication.R .github/workflows-inert/workflow_01*.yml || true
          echo '=== W01 project-specific registry and Zenodo pointers ==='
          grep -nEi 'workflow00_ris_cab|workflow00_ris_proquest|explicit.cluster.splits|never.auto.resolve|zenodo_record_id' config/workflow01* .github/workflows-inert/workflow_01*.yml | head -50 || true
          echo 'PASS read-only project-specificity audit'
