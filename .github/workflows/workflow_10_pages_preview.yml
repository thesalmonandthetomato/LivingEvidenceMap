name: Workflow 10 - deploy isolated Pages preview
# refresh full database columns: 2026-09-28

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/workflow_10_pages_preview.yml'
      - 'docs/dashboard-redesign-temp.html'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '37461142844'
  SOURCE_ARTIFACT: 'workflow10-dashboard-37461142844'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 1

      - name: Checkout Workflow 10 branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          path: workflow10
          fetch-depth: 1

      - name: Download passed Workflow 10 dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: preview_artifact

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install preview R dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Add isolated index2 preview files
        shell: Rscript {0}
        run: |
          locate_one <- function(name) {
            x <- list.files('preview_artifact', pattern=paste0('^',name,'$'), recursive=TRUE, full.names=TRUE)
            if(length(x)!=1L) stop(sprintf('Expected exactly one %s in artifact; found %d',name,length(x)),call.=FALSE)
            x[[1L]]
          }

          html_path <- locate_one('index.html')
          data_path <- locate_one('dashboard-data.js')

          html <- paste(readLines(html_path,warn=FALSE,encoding='UTF-8'),collapse='\n')
          marker <- '<script src="./dashboard-data.js"></script>'
          if(!grepl(marker,html,fixed=TRUE)) stop('Expected dashboard-data.js marker not found',call.=FALSE)
          html <- sub(marker,'<script src="./index2-data.js"></script>',html,fixed=TRUE)

          out_html <- 'production/docs/index2.html'
          out_data <- 'production/docs/index2-data.js'
          writeLines(html,out_html,useBytes=TRUE)
          file.copy(data_path,out_data,overwrite=TRUE)

          # Keep the report links used by index2 self-contained in the deployed Pages bundle.
          report_map <- c(
            'workflow10/docs/reporting/workflow_09/manuscript/methods.html'='production/docs/methodology.html',
            'workflow10/docs/reporting/workflow_09/manuscript/results.html'='production/docs/results.html'
          )
          for(src in names(report_map)) {
            if(!file.exists(src)) stop(sprintf('Required W09 report missing: %s',src),call.=FALSE)
            file.copy(src,report_map[[src]],overwrite=TRUE)
          }

          suppressPackageStartupMessages(library(jsonlite))
          data_js <- paste(readLines(out_data,warn=FALSE,encoding='UTF-8'),collapse='\n')
          prefix <- 'window.LIVING_EVIDENCE_MAP_DASHBOARD_DATA='
          if(!startsWith(data_js,prefix) || !endsWith(data_js,';')) stop('Unexpected dashboard-data.js wrapper',call.=FALSE)
          payload <- fromJSON(substr(data_js,nchar(prefix)+1L,nchar(data_js)-1L),simplifyVector=FALSE)

          expected_n <- suppressWarnings(as.integer(payload$metrics$total_records))
          if(is.na(expected_n) || expected_n<1L) stop('Preview payload has invalid total_records',call.=FALSE)
          if(length(payload$records)!=expected_n) stop(sprintf('Preview record count mismatch: payload=%d records=%d',expected_n,length(payload$records)),call.=FALSE)

          deployed_html <- paste(readLines(out_html,warn=FALSE,encoding='UTF-8'),collapse='\n')
          stopifnot(
            grepl('./index2-data.js',deployed_html,fixed=TRUE),
            !grepl('<script src="./dashboard-data.js"></script>',deployed_html,fixed=TRUE),
            grepl('./methodology.html',deployed_html,fixed=TRUE),
            grepl('./results.html',deployed_html,fixed=TRUE),
            file.exists(out_data),
            file.info(out_data)$size > 1000000
          )
          cat(sprintf('PASS: index2 Pages preview prepared from W10 run %s with %d records\n',
                      Sys.getenv('SOURCE_RUN_ID'),expected_n))

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site with preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/docs

      - name: Deploy complete Pages site
        id: deployment
        uses: actions/deploy-pages@v4
