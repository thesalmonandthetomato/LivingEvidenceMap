name: Workflow 10 - deploy isolated Pages preview
# refresh full database columns: 2026-09-28

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/workflow_10_pages_preview.yml'
      - 'docs/dashboard-redesign-temp.html'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '36452144492'
  SOURCE_ARTIFACT: 'workflow10-local-w08-36452144492'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 1

      - name: Checkout Workflow 10 branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          path: workflow10
          fetch-depth: 1

      - name: Download passed Workflow 10 dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: preview_artifact

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install preview R dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Add isolated preview files
        shell: Rscript {0}
        run: |
          locate_one <- function(name) {
            x <- list.files('preview_artifact', pattern=paste0('^',name,'$'), recursive=TRUE, full.names=TRUE)
            if(length(x)!=1L) stop(sprintf('Expected exactly one %s in artifact; found %d',name,length(x)),call.=FALSE)
            x[[1L]]
          }

          html_path <- 'workflow10/docs/dashboard-redesign-temp.html'
          if(!file.exists(html_path)) stop('Current Workflow 10 dashboard HTML missing',call.=FALSE)
          data_path <- locate_one('dashboard-data.js')

          html <- paste(readLines(html_path,warn=FALSE,encoding='UTF-8'),collapse='\n')
          if(!grepl('topic_stars',html,fixed=TRUE)) stop('Current Workflow 10 HTML does not contain star rendering',call.=FALSE)
          if(grepl('Evidence flow',html,fixed=TRUE) || grepl('evidence_flowdiagram.svg',html,fixed=TRUE)) {
            stop('Flow diagram reference unexpectedly present in preview HTML',call.=FALSE)
          }
          marker <- '<script src="./dashboard-data.js"></script>'
          if(!grepl(marker,html,fixed=TRUE)) stop('Expected dashboard-data.js marker not found',call.=FALSE)
          html <- sub(marker,'<script src="./workflow10-preview-data.js"></script>',html,fixed=TRUE)

          out_html <- 'production/docs/workflow10-preview.html'
          out_data <- 'production/docs/workflow10-preview-data.js'
          writeLines(html,out_html,useBytes=TRUE)

          suppressPackageStartupMessages(library(jsonlite))
          data_js <- paste(readLines(data_path,warn=FALSE,encoding='UTF-8'),collapse='\n')
          prefix <- 'window.LIVING_EVIDENCE_MAP_DASHBOARD_DATA='
          if(!startsWith(data_js,prefix) || !endsWith(data_js,';')) stop('Unexpected dashboard-data.js wrapper',call.=FALSE)
          payload <- fromJSON(substr(data_js,nchar(prefix)+1L,nchar(data_js)-1L),simplifyVector=FALSE)

          as_array <- function(x) {
            if(is.null(x)) return(list())
            if(is.list(x) && is.null(names(x))) return(x)
            as.list(x)
          }
          payload$records <- lapply(payload$records,function(r) {
            r$species <- as_array(r$species)
            r$countries <- as_array(r$countries)
            r$iso3 <- as_array(r$iso3)
            r$topics <- as_array(r$topics)
            r$topic_paths <- as_array(r$topic_paths)
            r$topic_paths <- lapply(r$topic_paths,as_array)
            r
          })

          flow_path <- 'workflow10/docs/reporting/workflow_09/flow_counts.json'
          flow <- fromJSON(flow_path,simplifyVector=FALSE)
          screened_n <- as.integer(flow$counts$title_abstract_screened)
          if(is.na(screened_n)||screened_n!=32283L) stop(sprintf('Unexpected screened count: %s',as.character(screened_n)),call.=FALSE)
          payload$metrics$candidate_search_results_screened <- screened_n

          is_array <- function(x) is.list(x) && is.null(names(x))
          stopifnot(length(payload$records)==19117L)
          stopifnot(all(vapply(payload$records,function(r)is_array(r$species),logical(1))))
          stopifnot(all(vapply(payload$records,function(r)is_array(r$countries),logical(1))))
          stopifnot(all(vapply(payload$records,function(r)is_array(r$iso3),logical(1))))
          stopifnot(all(vapply(payload$records,function(r)is_array(r$topics),logical(1))))
          stopifnot(all(vapply(payload$records,function(r)is_array(r$topic_paths)&&all(vapply(r$topic_paths,is_array,logical(1))),logical(1))))
          star_values <- unlist(lapply(payload$records,function(r)unlist(r$topic_stars,use.names=FALSE)),use.names=FALSE)
          stopifnot(length(star_values)>0L)
          stopifnot(all(nzchar(star_values)))
          stopifnot(all(star_values %in% c('★','★★','★★★')))

          data_js <- paste0(prefix,toJSON(payload,auto_unbox=TRUE,null='null',na='null',pretty=FALSE),';')
          writeLines(data_js,out_data,useBytes=TRUE)

          if(!file.exists('production/docs/index.html')) stop('Production index.html missing',call.=FALSE)
          if(file.info(out_data)$size < 1000000) stop('Preview data file unexpectedly small',call.=FALSE)
          cat(sprintf('PASS: isolated Pages preview prepared: %s + %s\n',out_html,out_data))

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site with preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/docs

      - name: Deploy complete Pages site
        id: deployment
        uses: actions/deploy-pages@v4
