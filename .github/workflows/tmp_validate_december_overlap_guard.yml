name: TEMP validate December overlap guard and scheduler
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_validate_december_overlap_guard.yml']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Exercise exact production overlap guard in isolated fixtures
        shell: Rscript {0}
        run: |
          library(jsonlite)
          y <- readLines(".github/workflows/workflow_00_search_orchestrator.yml")
          i <- which(grepl("^      - name: Refuse overlapping pipeline update$",y))
          stopifnot(length(i)==1L)
          j <- i+which(grepl("^        run: \\|$",y[(i+1L):length(y)]))[1L]
          k <- j+which(grepl("^      - name:",y[(j+1L):length(y)]))[1L]
          root <- tempfile(); dir.create(root)
          script <- file.path(root,"guard.R")
          writeLines(sub("^          ","",y[(j+1L):(k-1L)]),script)
          real_status <- fromJSON("docs/current_run/current_run_status.json",simplifyVector=FALSE)
          setwd(root)
          dir.create("docs/current_run",recursive=TRUE)
          p <- "docs/current_run/current_run_status.json"
          run <- function(label,x=NULL,resume="",supersede="false",expected=0L){
            unlink(p)
            if(!is.null(x))write_json(x,p,auto_unbox=TRUE,null="null")
            result <- suppressWarnings(system2("Rscript",script,stdout=TRUE,stderr=TRUE,env=c(paste0("RESUME_RUN_ID=",shQuote(resume)),paste0("SUPERSEDE_INCOMPLETE=",supersede))))
            rc <- attr(result,"status");if(is.null(rc))rc<-0L
            stopifnot(identical(as.integer(rc),expected))
            cat("PASS:",label,"\n")
          }
          state <- function(n,a)list(update_id="fixture",progress=list(completed_through=n,active_position=a))
          run("first launch")
          run("finished update",state(11,NULL))
          run("incomplete update",state(9,10),expected=1L)
          run("W10 active",state(10,11),expected=1L)
          run("explicit resume",state(9,10),resume="123")
          run("explicit supersede",state(9,10),supersede="true")
          run("contradictory completion",state(11,11),expected=1L)
          run("unknown completion",state(NA,NULL),expected=1L)
          run("actual November state",real_status,expected=if(isTRUE(as.integer(real_status$progress$completed_through)>=11L)&&is.null(real_status$progress$active_position))0L else 1L)
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Run existing default-branch scheduler regression offline
        run: python3 scripts/validation/test_monthly_scheduler.py
