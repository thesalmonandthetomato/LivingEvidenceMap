name: Temporary W04 reusable workflow lint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w04-actionlint.yml']
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate original W04 workflows
        run: |
          set -euo pipefail
          actionlint -shellcheck= -pyflakes= .github/workflows/workflow_04_production.yml .github/workflows/w04_shiny_subset_launcher.yml
