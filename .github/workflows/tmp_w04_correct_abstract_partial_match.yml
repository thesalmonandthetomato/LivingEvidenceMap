name: TEMP corrective W04 abstract rescreen

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_w04_correct_abstract_partial_match.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: w04-corrective-abstract-rescreen
  cancel-in-progress: false

env:
  SOURCE_W04_RUN: '37419309076'
  LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependency
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))

      - name: Download immutable source W04 state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/prepared source/final
          gh run download "$SOURCE_W04_RUN" --repo "$GITHUB_REPOSITORY" --name "workflow04-prepared-$SOURCE_W04_RUN" --dir source/prepared
          gh run download "$SOURCE_W04_RUN" --repo "$GITHUB_REPOSITORY" --name "workflow04-production-$SOURCE_W04_RUN" --dir source/final
          test -s source/prepared/inputs/current/canonical_lean.jsonl
          test -s source/prepared/inputs/current/publication_status.jsonl
          test -s source/prepared/outputs/workflow04_prepare/prompt_provenance.json
          test -s source/final/workflow04_final/workflow04_final_screening_layer.jsonl
          test -s docs/audits/w04_abstract_partial_match_affected_ids.txt

      - name: Build exact 3,589-record corrective screening input
        shell: Rscript {0}
        run: |
          library(jsonlite)
          readjl <- function(p) {
            x <- readLines(p,warn=FALSE,encoding="UTF-8"); x <- x[nzchar(trimws(x))]
            lapply(x,fromJSON,simplifyVector=FALSE)
          }
          writejl <- function(xs,p) {
            dir.create(dirname(p),recursive=TRUE,showWarnings=FALSE)
            con <- file(p,"wt",encoding="UTF-8"); on.exit(close(con))
            for (x in xs) writeLines(toJSON(x,auto_unbox=TRUE,null="null",na="null",digits=NA),con,useBytes=TRUE)
          }
          ids <- trimws(readLines("docs/audits/w04_abstract_partial_match_affected_ids.txt",warn=FALSE))
          ids <- sort(unique(ids[nzchar(ids)]))
          stopifnot(length(ids)==3589L)
          can <- readjl("source/prepared/inputs/current/canonical_lean.jsonl")
          w03 <- readjl("source/prepared/inputs/current/publication_status.jsonl")
          cid <- vapply(can,function(r)as.character(r$identity$record_id),character(1))
          wid <- vapply(w03,function(r)as.character(r$record_id),character(1))
          stopifnot(!anyDuplicated(cid),!anyDuplicated(wid),setequal(cid,wid),all(ids%in%cid))
          csel <- can[match(ids,cid)]
          wsel <- w03[match(ids,wid)]
          # Hard guard: these must truly lack canonical and exact top-level abstracts.
          bad <- vapply(csel,function(r) {
            c <- r[["canonical"]]
            ca <- if(is.list(c) && "abstract"%in%names(c)) c[["abstract",exact=TRUE]] else NULL
            ra <- if("abstract"%in%names(r)) r[["abstract",exact=TRUE]] else NULL
            nz <- function(x) !is.null(x)&&length(x)&&nzchar(trimws(as.character(x[[1L]])))
            nz(ca)||nz(ra)
          },logical(1))
          stopifnot(!any(bad))
          writejl(csel,"targeted/canonical_affected.jsonl")
          writejl(wsel,"targeted/w03_affected.jsonl")
          cat("PASS: built exact 3589-record corrective W04 input\n")

      - name: Stage resume-compatible prepared state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared_artifact/inputs/current prepared_artifact/outputs/workflow04_prepare
          cp source/prepared/inputs/current/canonical_lean.jsonl prepared_artifact/inputs/current/canonical_lean.jsonl
          cp source/prepared/inputs/current/publication_status.jsonl prepared_artifact/inputs/current/publication_status.jsonl
          cp source/prepared/outputs/workflow04_prepare/prompt_provenance.json prepared_artifact/outputs/workflow04_prepare/prompt_provenance.json

      - uses: actions/upload-artifact@v4
        with:
          name: w04-correction-targeted-${{ github.run_id }}
          path: targeted/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: w04-correction-source-${{ github.run_id }}
          path: |
            source/final/workflow04_final/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: workflow04-prepared-${{ github.run_id }}
          path: |
            prepared_artifact/inputs/current/canonical_lean.jsonl
            prepared_artifact/inputs/current/publication_status.jsonl
            prepared_artifact/outputs/workflow04_prepare/prompt_provenance.json
          retention-days: 90
          if-no-files-found: error

  screen:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest','stringi'))

      - uses: actions/download-artifact@v4
        with:
          name: w04-correction-targeted-${{ github.run_id }}
          path: targeted

      - name: Corrective Luna consensus shard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEVANCE_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "outputs/shard-${{ matrix.shard }}"
          Rscript scripts/updater/workflow_04_luna_consensus.R             --canonical targeted/canonical_affected.jsonl             --workflow03-status targeted/w03_affected.jsonl             --screening-config user_input/workflow04_screening_config.json             --output-dir "outputs/shard-${{ matrix.shard }}"             --model gpt-5.6-luna             --shard-index ${{ matrix.shard }}             --shard-count 8             --checkpoint-every 25

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w04-correction-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: outputs/shard-${{ matrix.shard }}/
          retention-days: 90
          if-no-files-found: warn

  merge:
    needs: [prepare,screen]
    if: ${{ always() && needs.prepare.result == 'success' && needs.screen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - uses: actions/download-artifact@v4
        with:
          pattern: w04-correction-shard-*-${{ github.run_id }}
          path: shards
          merge-multiple: false

      - name: Merge corrected consensus
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_04_merge_consensus.R             --input-root shards             --output-dir corrected_consensus             --expected-shards 8
          N=$(wc -l < corrected_consensus/workflow04_consensus_layer.jsonl)
          test "$N" -eq 3589

      - uses: actions/upload-artifact@v4
        with:
          name: w04-correction-consensus-${{ github.run_id }}
          path: corrected_consensus/
          retention-days: 90
          if-no-files-found: error

  finalise:
    needs: [prepare,merge]
    if: ${{ always() && needs.prepare.result == 'success' && needs.merge.result == 'success' }}
    outputs:
      status: ${{ steps.status.outputs.status }}
      unresolved: ${{ steps.status.outputs.unresolved }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','googlesheets4','readr'))

      - uses: actions/download-artifact@v4
        with:
          name: workflow04-prepared-${{ github.run_id }}
          path: prepared

      - uses: actions/download-artifact@v4
        with:
          name: w04-correction-source-${{ github.run_id }}
          path: source_final

      - uses: actions/download-artifact@v4
        with:
          name: w04-correction-consensus-${{ github.run_id }}
          path: corrected_consensus

      - name: Prepare Google credential
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          echo "LEM_GOOGLE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/lem-google-service-account.json" >> "$GITHUB_ENV"

      - name: Capture completed decisions from current W04 queue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/current_decisions
          Rscript scripts/updater/tmp_w04_export_partial_completed_decisions.R             --sheet-id "$LEM_GOOGLE_SHEET_ID"             --credential "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"             --output outputs/current_decisions/completed.jsonl             --manifest outputs/current_decisions/manifest.json
          cat outputs/current_decisions/manifest.json

      - name: Merge corrected records into complete W04 layer
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/tmp_w04_merge_partial_abstract_correction.R             --canonical prepared/inputs/current/canonical_lean.jsonl             --w03 prepared/inputs/current/publication_status.jsonl             --full-layer source_final/workflow04_final/workflow04_final_screening_layer.jsonl             --corrected-layer corrected_consensus/workflow04_consensus_layer.jsonl             --affected-ids docs/audits/w04_abstract_partial_match_affected_ids.txt             --completed-decisions outputs/current_decisions/completed.jsonl             --source-summary source_final/workflow04_final/summary.json             --output-dir outputs/workflow04_final
          cp prepared/outputs/workflow04_prepare/prompt_provenance.json outputs/workflow04_final/prompt_provenance.json
          cat outputs/workflow04_final/partial_abstract_correction_report.json

      - name: Inspect corrected status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow04_final/summary.json");cat(x$status)')
          UNRESOLVED=$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow04_final/summary.json");cat(as.integer(x$unresolved))')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "unresolved=$UNRESOLVED" >> "$GITHUB_OUTPUT"
          echo "Corrected W04 status=$STATUS unresolved=$UNRESOLVED"

      - name: Build corrected Shiny resolution queue
        if: ${{ steps.status.outputs.status == 'HUMAN_REVIEW_REQUIRED' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow04_resolution
          Rscript scripts/updater/workflow_04_build_resolution_queue.R             --canonical prepared/inputs/current/canonical_lean.jsonl             --human-review outputs/workflow04_final/workflow04_human_review_queue.jsonl             --output-dir outputs/workflow04_resolution             --source-run-id "$GITHUB_RUN_ID"

      - name: Publish corrected queue to Shiny
        if: ${{ steps.status.outputs.status == 'HUMAN_REVIEW_REQUIRED' }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_04_publish_resolution_queue_to_shiny.R             --queue outputs/workflow04_resolution/workflow04_resolution_queue.jsonl             --manifest outputs/workflow04_resolution/workflow04_resolution_queue_manifest.json             --highlight-terms user_input/workflow04_screening_highlight_terms.csv             --sheet-id "$LEM_GOOGLE_SHEET_ID"             --credential "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"             --queue-tab queue_w04_resolution_active             --receipt outputs/workflow04_resolution/shiny_publish_receipt.json
          BATCH_ID=$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow04_resolution/shiny_publish_receipt.json");cat(x$batch_id)')
          QUEUE_SHA=$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow04_resolution/shiny_publish_receipt.json");cat(x$queue_sha256)')
          Rscript scripts/updater/workflow_shiny_batch_status.R             --stage "04" --batch-id "$BATCH_ID" --queue-sha256 "$QUEUE_SHA"             --status published --sheet-id "$LEM_GOOGLE_SHEET_ID"             --credential "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"             --workflow-run-id "$GITHUB_RUN_ID" --source-run-id "$GITHUB_RUN_ID"             --message "Corrective W04 abstract partial-match rescreen; prior completed human decisions preserved where still required."

      - name: Persist correction audit summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          cp outputs/workflow04_final/partial_abstract_correction_report.json docs/audits/w04_abstract_partial_match_correction.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/w04_abstract_partial_match_correction.json
          if ! git diff --cached --quiet; then
            git commit -m "Record W04 abstract correction results [skip ci]"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: workflow04-production-${{ github.run_id }}
          path: |
            outputs/workflow04_final/
            outputs/workflow04_resolution/
            outputs/current_decisions/
          retention-days: 90
          if-no-files-found: error

  cleanup:
    needs: finalise
    if: ${{ needs.finalise.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 2
      - name: Remove temporary corrective implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin workflow01-final-architecture
          git rm -f .github/workflows/tmp_w04_correct_abstract_partial_match.yml             scripts/updater/tmp_w04_export_partial_completed_decisions.R             scripts/updater/tmp_w04_merge_partial_abstract_correction.R
          git commit -m "Remove temporary W04 abstract correction workflow [skip ci]"
          git push origin HEAD:workflow01-final-architecture
