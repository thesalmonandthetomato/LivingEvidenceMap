name: TEMP W08b workflow_dispatch API test on nondefault branch
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_dispatch_probe_runner_20261031.yml']
permissions:
  contents: read
  actions: write
jobs:
  attempt:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt branch-only dispatch and print outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "Default branch is main; testing newly authored branch-only workflow_dispatch"
          gh workflow run tmp_w08b_dispatch_probe_20261031.yml \
            --repo "$GITHUB_REPOSITORY" --ref workflow01-final-architecture
          RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "PASS: branch-only workflow_dispatch accepted"
          else
            echo "BLOCKED: branch-only workflow_dispatch returned $RC"
          fi
          echo "DISPATCH_RESULT=$RC" >> "$GITHUB_STEP_SUMMARY"
          exit 0
