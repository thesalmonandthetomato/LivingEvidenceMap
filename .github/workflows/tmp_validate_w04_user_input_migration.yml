name: TEMP validate W04 user-input migration

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w04_user_input_migration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install validation dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','yaml'))

      - name: Validate exact W04 prompt equivalence and wiring
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          library(jsonlite)
          library(digest)
          cfg <- fromJSON('user_input/workflow04_screening_config.json', simplifyVector=FALSE)
          stopifnot(
            identical(cfg$schema, 'living-evidence-map-workflow04-screening-config-v1'),
            identical(cfg$prompt_path, 'user_input/workflow04_screening_prompt.txt'),
            identical(cfg$prompt_version, 'workflow04-v3-salmon-lice-clarification'),
            identical(cfg$response_schema_name, 'salmon_aquaculture_relevance_screen'),
            identical(cfg$expected_prompt_sha256, 'ab71cad800996f2aea4cf1313c3ab749017f01094946830671f2f579a4710f69'),
            file.exists(cfg$prompt_path)
          )
          prompt <- paste(readLines(cfg$prompt_path, warn=FALSE, encoding='UTF-8'), collapse='\n')
          actual <- digest(prompt, algo='sha256', serialize=FALSE)
          stopifnot(identical(actual, cfg$expected_prompt_sha256))
          cat('PASS: external W04 prompt is byte-content equivalent to historical prompt\n')
          RS

          Rscript -e "parse(file='scripts/updater/workflow_04_luna_consensus.R');cat('PASS: W04 screening script parses\n')"
          Rscript -e "yaml::read_yaml('.github/workflows/workflow_04_production.yml');yaml::read_yaml('.github/workflows/workflow_04_publish_baseline.yml');cat('PASS: W04 YAML parses\n')"

          grep -Fq -- '--screening-config user_input/workflow04_screening_config.json' .github/workflows/workflow_04_production.yml
          grep -Fq 'workflow04_screening_config.json' .github/workflows/workflow_04_publish_baseline.yml
          grep -Fq 'screening_config_path <- arg("--screening-config","user_input/workflow04_screening_config.json")' scripts/updater/workflow_04_luna_consensus.R
          grep -Fq 'name=RESPONSE_SCHEMA_NAME,strict=TRUE,schema=schema' scripts/updater/workflow_04_luna_consensus.R
          if grep -Fq 'You are screening bibliographic records for inclusion in a living evidence map of commercial aquaculture of Atlantic salmon' scripts/updater/workflow_04_luna_consensus.R; then
            echo 'Historical topic-specific prompt remains embedded in W04 R code' >&2
            exit 1
          fi
          echo 'PASS: W04 user-input migration preserves prompt identity and production wiring'
