name: Temporary W00 prelaunch expansion and EThOS validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_validate_w00_prelaunch_20261018.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install validation packages
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','yaml'))
      - name: Generate and validate mixed W00 search plan
        env:
          W00_NEW_FULL_SOURCES: ethos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mixed_w00
          Rscript scripts/updater/workflow_00_resolve_source_selection.R --run-type expansion --saved data/workflow00/source_selection.json --output /tmp/mixed_w00/source_selection.json --search-registry docs/search_record/zenodo_registry.csv
          Rscript scripts/updater/workflow_00_search_orchestrator.R --run-type expansion --additional-search-term 'maricultur*' --config user_input/workflow00_search_strategy.json --output-dir /tmp/mixed_w00
          Rscript -e 'library(jsonlite); s<-fromJSON("/tmp/mixed_w00/source_selection.json");p<-fromJSON("/tmp/mixed_w00/search_plan.json",simplifyVector=FALSE); stopifnot(length(s$selected_sources)==19L, "ethos" %in% s$new_full_sources, "ethos" %in% names(p$source_queries));q<-p$source_queries$ethos; stopifnot(grepl("SRC:ETH",q,fixed=TRUE),grepl("aquacultur",q,fixed=TRUE),!grepl("maricultur",q,fixed=TRUE)); cat("PASS 18 expansion queries plus EThOS full:",q,"\n")'
          Rscript -e 'library(yaml); for(p in c(".github/workflows/workflow_00_search_orchestrator.yml",".github/workflows/_workflow_00_orchestrated_source_child.yml",".github/workflows/workflow_01_production.yml")){x<-read_yaml(p);stopifnot(length(x$jobs)>0)};cat("PASS workflow YAML parsing\n")'
      - name: Check live Europe PMC EThOS source query
        shell: Rscript {0}
        run: |
          library(httr2);library(jsonlite)
          p<-fromJSON("/tmp/mixed_w00/search_plan.json",simplifyVector=FALSE)
          q<-p$source_queries$ethos
          r<-request("https://www.ebi.ac.uk/europepmc/webservices/rest/search") |> req_url_query(query=q,format="json",pageSize=1) |> req_timeout(60) |> req_perform() |> resp_body_json(simplifyVector=FALSE)
          n<-as.integer(r$hitCount)
          stopifnot(length(n)==1L,!is.na(n),n>=0L)
          cat("PASS EThOS Europe PMC returned valid hitCount=",n,"\n")
