name: Test Workflow 04 revised prompt - first 200

on:
  push:
    branches: [updater-workflow-04-relevance-screening]
    paths: [.github/workflows/test_workflow04_revised_first_200.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revised-first-200:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Workflow 04 branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-04-relevance-screening
      - name: Check out current canonical store
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          path: canonical_store
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAI client
        run: python -m pip install --upgrade openai
      - name: Rebuild exact first validation 200 from current canonical
        run: |
          set -euo pipefail
          mkdir -p testdata/workflow04_revised_first_200
          python - <<'PY'
          import json
          from pathlib import Path
          ids=[x.strip() for x in Path('testdata/workflow04/verification_200_lens_ids.txt').read_text().splitlines() if x.strip()]
          assert len(ids)==200 and len(set(ids))==200
          wanted=set(ids); found={}
          src=Path('canonical_store/data/canonical/current/repair/records.jsonl')
          total=0
          for line in src.open(encoding='utf-8'):
              if not line.strip(): continue
              total+=1; r=json.loads(line)
              lid=str((r.get('identity') or {}).get('lens_id') or '')
              if lid in wanted: found[lid]=r
          assert total==22148, total
          missing=[x for x in ids if x not in found]
          assert not missing, missing
          out=Path('testdata/workflow04_revised_first_200/input_200.jsonl')
          with out.open('w',encoding='utf-8') as f:
              for lid in ids: f.write(json.dumps(found[lid],ensure_ascii=True,separators=(',',':'))+'\n')
          with_abs=sum(bool((found[x].get('canonical') or {}).get('abstract')) for x in ids)
          Path('testdata/workflow04_revised_first_200/input_manifest.json').write_text(json.dumps({'records':200,'canonical_records':total,'records_with_abstract':with_abs,'records_without_abstract':200-with_abs,'sample':'exact original verification_200_lens_ids set','canonical_commit':'15e404901b4c1044b7981f61912cb339d0cb047b','prompt':'base Workflow 04 plus human-approved 2026-09-01 validation amendments'},indent=2)+'\n')
          PY
      - name: Screen first 200 with revised prompt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/updater/relevance_screen_jsonl_revised_validation.py \
            --input testdata/workflow04_revised_first_200/input_200.jsonl \
            --output testdata/workflow04_revised_first_200/screened_200.jsonl \
            --audit testdata/workflow04_revised_first_200/screening_audit_200.jsonl \
            --checkpoint testdata/workflow04_revised_first_200/checkpoint.json \
            --chunk-size 25 --mode openai --model gpt-5-mini
      - name: Compare revised model with current canonical decisions
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path
          root=Path('testdata/workflow04_revised_first_200')
          rows=[json.loads(x) for x in (root/'screened_200.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows)==200
          matrix=Counter(); conflicts=[]; errors=[]
          for i,r in enumerate(rows,1):
              lid=str((r.get('identity') or {}).get('lens_id') or '')
              c=(r.get('canonical') or {}); rel=((r.get('screening') or {}).get('relevance') or {})
              canonical=str(rel.get('decision') or '').upper()
              s=r.get('screening') or {}; model=str(s.get('decision') or '').upper()
              if s.get('technical_error'): errors.append([lid,s.get('technical_error')])
              matrix[(canonical,model)]+=1
              if canonical!=model:
                  conflicts.append({'order':i,'lens_id':lid,'title':c.get('title') or '', 'canonical_decision':canonical,'model_decision':model,'model_reason':s.get('reason') or '', 'journal_source_title':c.get('source_title') or c.get('journal') or '', 'keywords':c.get('keywords') or '', 'abstract':c.get('abstract') or ''})
          fields=['order','lens_id','title','canonical_decision','model_decision','model_reason','journal_source_title','keywords','abstract']
          with (root/'conflicts.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(conflicts)
          summary={'records':200,'agreements':200-len(conflicts),'conflicts':len(conflicts),'technical_errors':len(errors),'matrix':{f'{a}__{b}':n for (a,b),n in sorted(matrix.items())}}
          (root/'comparison_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          assert not errors, errors
          PY
      - name: Upload revised first-200 artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-revised-first-200-${{ github.run_id }}
          path: testdata/workflow04_revised_first_200/
          retention-days: 90
