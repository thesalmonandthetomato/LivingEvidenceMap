name: Temporary - audit canonical keyword fields

on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_audit_canonical_keywords.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install minimal dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest'))

      - name: Restore authoritative W08 canonical
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp_keyword_audit
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R \
            --pointer docs/workflow08/zenodo/run-36442875006.json \
            --output tmp_keyword_audit/canonical.jsonl

      - name: Audit keyword-like fields
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          f <- 'tmp_keyword_audit/canonical.jsonl'
          con <- file(f,'rt',encoding='UTF-8'); on.exit(close(con))
          n <- 0L
          canonical_keys <- character()
          keyword_paths <- list()
          examples <- list()
          add_path <- function(path,val,rid){
            keyword_paths[[path]] <<- (keyword_paths[[path]] %||% 0L) + 1L
            if(is.null(examples[[path]])) examples[[path]] <<- list(record_id=rid,value=val)
          }
          `%||%` <- function(x,y) if(is.null(x)||length(x)==0L)y else x
          walk <- function(x,path='',rid=''){
            if(!is.list(x)||is.data.frame(x)) return(invisible(NULL))
            nms <- names(x)
            if(is.null(nms)) return(invisible(NULL))
            for(nm in nms){
              p <- if(nzchar(path)) paste0(path,'.',nm) else nm
              if(grepl('keyword|subject|mesh|concept|term',nm,ignore.case=TRUE)) add_path(p,x[[nm]],rid)
              if(is.list(x[[nm]])) walk(x[[nm]],p,rid)
            }
          }
          repeat{
            lines <- readLines(con,n=500L,warn=FALSE)
            if(!length(lines)) break
            for(line in lines){
              if(!nzchar(trimws(line))) next
              rec <- fromJSON(line,simplifyVector=FALSE)
              n <- n+1L
              rid <- as.character((rec$identity %||% list())$record_id %||% '')
              can <- rec$canonical %||% list()
              canonical_keys <- union(canonical_keys,names(can))
              walk(can,'canonical',rid)
              walk(rec,'',rid)
            }
          }
          cat('RECORDS=',n,'\n',sep='')
          cat('CANONICAL_KEYS=',paste(sort(canonical_keys),collapse=' | '),'\n',sep='')
          if(!length(keyword_paths)){
            cat('KEYWORD_LIKE_FIELDS=NONE\n')
          } else {
            cat('KEYWORD_LIKE_FIELDS:\n')
            for(p in sort(names(keyword_paths))){
              cat(sprintf('  %s: %d records\n',p,keyword_paths[[p]]))
              cat('    example: ',toJSON(examples[[p]],auto_unbox=TRUE,null='null'),'\n',sep='')
            }
          }
