name: Temporary - inspect Icelandic salmon news publication metadata

on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_audit_canonical_keywords.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install minimal dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest'))

      - name: Restore authoritative W08 canonical
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp_keyword_audit
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R \
            --pointer docs/workflow08/zenodo/run-40656599532.json \
            --output tmp_keyword_audit/canonical.jsonl

      - name: Inspect exact canonical publication type and originating manifestations
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          `%||%` <- function(x,y) if(is.null(x))y else x
          con<-file("tmp_keyword_audit/canonical.jsonl","rt",encoding="UTF-8")
          on.exit(close(con))
          matches<-0L
          repeat {
            lines<-readLines(con,n=300L,warn=FALSE)
            if(!length(lines))break
            for(line in lines) {
              if(!grepl("Icelandic land-based salmon",line,ignore.case=TRUE,fixed=TRUE))next
              r<-fromJSON(line,simplifyVector=FALSE)
              ttl<-as.character(r$canonical$title %||% "")
              if(!grepl("boost for Icelandic land-based salmon producer",ttl,ignore.case=TRUE,fixed=TRUE))next
              matches<-matches+1L
              cat("MATCH ",matches,"\n",sep="")
              cat("ID: ",r$identity$record_id,"\n",sep="")
              cat("TITLE: ",ttl,"\n",sep="")
              cat("YEAR: ",r$canonical$year,"\n",sep="")
              cat("JOURNAL: ",r$canonical$journal,"\n",sep="")
              cat("DOI: ",r$canonical$doi,"\n",sep="")
              cat("CANONICAL PUBLICATION_TYPE: ",toJSON(r$canonical$publication_type,auto_unbox=FALSE,null="null"),"\n",sep="")
              cat("PUBLICATION_TYPE PROVENANCE: ",toJSON(r$canonical$field_provenance$publication_type,auto_unbox=FALSE,null="null"),"\n",sep="")
              cat("MANIFESTATIONS: ",toJSON(r$manifestations,auto_unbox=TRUE,null="null",pretty=TRUE),"\n",sep="")
              cat("SOURCE_KEYS: ",paste(names(r),collapse=", "),"\n",sep="")
            }
          }
          cat("TOTAL EXACT TITLE MATCHES: ",matches,"\n",sep="")
          stopifnot(matches>=1L)
