name: Workflow 05 - Luna independent audit test

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'docs/workflow05/.run_luna_audit_test'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("dplyr","readr","jsonlite","httr2","digest"))
      - name: Restore deterministic W05 outputs
        uses: actions/download-artifact@v4
        with:
          name: workflow05-deterministic-reuse-audit-36230627164
          path: recovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36230627164
      - name: Locate inputs
        shell: bash
        run: |
          set -euo pipefail
          DET="$(find recovery -type f -name deterministic_annotation_summary.csv -print -quit)"
          REC="$(find recovery -type f -name records_for_annotation.csv -print -quit)"
          test -n "$DET"; test -n "$REC"
          cp "$DET" deterministic_annotation_summary.csv
          cp "$REC" records_for_annotation.csv
      - name: Run 100-record blind Luna comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          Rscript scripts/reporting/workflow05_luna_test.R \
            --deterministic deterministic_annotation_summary.csv \
            --records records_for_annotation.csv \
            --prompt config/workflow05_luna_independent_audit_prompt.txt \
            --output-dir outputs/workflow05_luna_test
      - name: Upload test outputs
        uses: actions/upload-artifact@v4
        with:
          name: workflow05-luna-audit-test-${{ github.run_id }}
          path: outputs/workflow05_luna_test/
          retention-days: 90
          if-no-files-found: error
