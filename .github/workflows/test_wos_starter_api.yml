name: Test WoS Starter API

on:
  push:
    branches:
      - updater-workflow-00e-wos-starter-ingestion
    paths:
      - '.github/workflows/test_wos_starter_api.yml'
      - 'scripts/updater/workflow_00e_wos_starter_diagnostic.R'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout WoS ingestion branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00e-wos-starter-ingestion
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))

      - name: Parse diagnostic script
        shell: Rscript {0}
        run: parse(file='scripts/updater/workflow_00e_wos_starter_diagnostic.R')

      - name: Run one-page WoS Starter diagnostic
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00e_wos_starter_diagnostic.R

      - name: Show diagnostic
        if: always()
        shell: bash
        run: |
          if [ -f outputs/updater/wos_starter_diagnostic/diagnostic.json ]; then
            cat outputs/updater/wos_starter_diagnostic/diagnostic.json
          fi

      - name: Upload diagnostic artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-starter-diagnostic-${{ github.run_id }}
          path: outputs/updater/wos_starter_diagnostic/
          retention-days: 90
          if-no-files-found: warn
