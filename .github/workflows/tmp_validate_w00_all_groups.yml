name: TEMP validate all W00 source groups

on:
  push:
    branches:
      - test-ebsco-eit-api
    paths:
      - '.github/workflows/tmp_validate_w00_all_groups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-ebsco-eit-api
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Resolve all ten groups
        env:
          W00_GROUP_CORE_MULTIDISCIPLINARY: 'true'
          W00_GROUP_HEALTH_MEDICINE: 'true'
          W00_GROUP_ENVIRONMENT_AGRICULTURE: 'true'
          W00_GROUP_SOCIAL_SCIENCES: 'true'
          W00_GROUP_EDUCATION: 'true'
          W00_GROUP_REGIONAL: 'true'
          W00_GROUP_MEDIA_COMMUNICATION: 'true'
          W00_GROUP_HUMANITIES: 'true'
          W00_GROUP_SPORT_TOURISM: 'true'
          W00_GROUP_GREY_PREPRINTS: 'true'
          W00_ADDITIONAL_SOURCES: ''
          W00_EXCLUDE_SOURCES: ''
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_resolve_source_selection.R \
            --run-type full \
            --saved data/workflow00/source_selection.json \
            --output outputs/all_groups/source_selection.json \
            --ebsco-config config/workflow00_ebsco_sources.json \
            --group-config config/workflow00_source_groups.json

      - name: Assert complete de-duplicated source coverage
        shell: Rscript {0}
        run: |
          library(jsonlite)
          x <- fromJSON('outputs/all_groups/source_selection.json',simplifyVector=FALSE)
          selected <- unlist(x$selected_sources,use.names=FALSE)

          expected_ebsco <- c(
            'ebsco_africa_wide',
            'ebsco_amed',
            'ebsco_psycinfo',
            'ebsco_atla_religion',
            'ebsco_biological_agricultural_index',
            'ebsco_cinahl',
            'ebsco_communication_mass_media',
            'ebsco_econlit',
            'ebsco_eric',
            'ebsco_family_society',
            'ebsco_greenfile',
            'ebsco_hospitality_tourism',
            'ebsco_medline',
            'ebsco_mla',
            'ebsco_political_science',
            'ebsco_sportdiscus',
            'ebsco_waters_oceans'
          )
          expected_non_ebsco <- c(
            'lens','scopus','wos','openalex','pubmed',
            'agricola','cba','ethos','epmc_preprints'
          )

          actual_ebsco <- selected[grepl('^ebsco_',selected)]
          actual_non_ebsco <- selected[!grepl('^ebsco_',selected)]

          stopifnot(length(actual_ebsco)==17L)
          stopifnot(setequal(actual_ebsco,expected_ebsco))
          stopifnot(length(actual_non_ebsco)==9L)
          stopifnot(setequal(actual_non_ebsco,expected_non_ebsco))
          stopifnot(length(selected)==26L)
          stopifnot(length(unique(selected))==26L)
          stopifnot(sum(selected=='ebsco_psycinfo')==1L)
          stopifnot(sum(selected=='cba')==1L)

          cat('PASS: all ten groups resolve to 26 unique sources = 17 EBSCO + 9 non-EBSCO; overlaps are de-duplicated\n')

      - uses: actions/upload-artifact@v4
        with:
          name: w00-all-groups-resolution-${{ github.run_id }}
          path: outputs/all_groups/
          retention-days: 7
          if-no-files-found: error
