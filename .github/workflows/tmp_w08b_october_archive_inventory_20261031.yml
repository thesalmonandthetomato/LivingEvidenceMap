name: TEMP W08b October archive inventory
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_october_archive_inventory_20261031.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite","httr2","digest"))'
      - name: Restore October restricted W08b checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/restore_discovery.R 23627417 "$RUNNER_TEMP/october-w08b"
      - name: Inspect coverage and candidate registers without exposing IDs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          root<-file.path(Sys.getenv("RUNNER_TEMP"),"october-w08b")
          present<-list.files(root,recursive=TRUE)
          count_lines<-function(path)if(!file.exists(path))NA_integer_ else length(readLines(path,warn=FALSE))
          ls<-file.path(root,"lens_seed_status.jsonl")
          os<-file.path(root,"openalex_seed_status.jsonl")
          edge<-file.path(root,"merged","citation_edges.csv")
          ids<-file.path(root,"merged","provider_candidate_ids.csv")
          lens_count<-count_lines(ls)
          oa_count<-count_lines(os)
          edge_count<-if(file.exists(edge))nrow(read.csv(edge,stringsAsFactors=FALSE)) else NA_integer_
          id_count<-if(file.exists(ids))nrow(read.csv(ids,stringsAsFactors=FALSE)) else NA_integer_
          out<-list(schema="w08b-october-checkpoint-inventory-v1",
            checkpoint_zenodo_record="23627417",
            has_lens_status=file.exists(ls),has_openalex_status=file.exists(os),
            has_edge_register=file.exists(edge),has_candidate_register=file.exists(ids),
            lens_status_journal_entries=lens_count,
            openalex_status_journal_entries=oa_count,
            distinct_direction_edges=edge_count,
            provider_candidate_ids=id_count,
            archived_relative_paths=present,
            november_preflight_only=TRUE)
          writeLines(toJSON(out,auto_unbox=TRUE,pretty=TRUE,na="null"),"october_w08b_inventory.json")
          cat(toJSON(out,auto_unbox=TRUE,pretty=TRUE,na="null"),"\n")
      - uses: actions/upload-artifact@v4
        with:
          name: w08b-october-checkpoint-inventory
          path: october_w08b_inventory.json
          retention-days: 14
          if-no-files-found: error
