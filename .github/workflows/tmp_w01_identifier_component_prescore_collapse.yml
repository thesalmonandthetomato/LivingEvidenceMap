name: TEMP W01 component pre-score collapse test

on:
  push:
    branches:
      - w01-identifier-assist-test
    paths:
      - '.github/workflows/tmp_w01_identifier_component_prescore_collapse.yml'
      - 'scripts/updater/workflow_01_identifier_component_prescore_collapse_test.R'

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-identifier-assist-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite'))

      - name: Download frozen W01 and safe identifier inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w01_prescore/{prod,safe,out}

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11171230024/zip" > /tmp/w01_prescore/prod.zip
          unzip -q /tmp/w01_prescore/prod.zip             workflow01_candidates/normalised_metadata.csv             workflow01_incremental_rescore/rescored_sample.csv             -d /tmp/w01_prescore/prod

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11226773698/zip" > /tmp/w01_prescore/safe.zip
          unzip -q /tmp/w01_prescore/safe.zip             safe_identifier_preresolve_appended_pairs.csv             -d /tmp/w01_prescore/safe

      - name: Run component pre-score collapse validation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v             Rscript scripts/updater/workflow_01_identifier_component_prescore_collapse_test.R               --metadata /tmp/w01_prescore/prod/workflow01_candidates/normalised_metadata.csv               --safe-pairs /tmp/w01_prescore/safe/safe_identifier_preresolve_appended_pairs.csv               --scored-pairs /tmp/w01_prescore/prod/workflow01_incremental_rescore/rescored_sample.csv               --prior-n 90137               --output-dir /tmp/w01_prescore/out             2> /tmp/w01_prescore/out/process_time.txt
          cat /tmp/w01_prescore/out/component_prescore_collapse_summary.json
          cat /tmp/w01_prescore/out/process_time.txt

      - name: Assert collapse invariants
        shell: Rscript {0}
        run: |
          library(jsonlite)
          a <- fromJSON('/tmp/w01_prescore/out/component_prescore_collapse_summary.json')
          stopifnot(a$status == 'success')
          stopifnot(a$input$unique_manifestation_candidate_pairs == 503245L)
          stopifnot(a$collapse$candidate_pairs_selected_for_expensive_scoring == 272169L)
          stopifnot(a$collapse$scoring_decisions_avoided == 231076L)
          stopifnot(a$validation$component_level_classification_mismatches == 0L)
          stopifnot(a$selector$uses_expensive_abstract_lcs == FALSE)
          stopifnot(a$selector$uses_existing_classification == FALSE)
          stopifnot(a$safety$automatic_merges_performed == 0L)
          stopifnot(a$safety$production_w01_modified == FALSE)
          cat('PASS: cheap pre-score component collapse preserved all frozen W01 outcomes\n')

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: w01-component-prescore-collapse-${{ github.run_id }}
          path: /tmp/w01_prescore/out/
          retention-days: 30
          if-no-files-found: error
