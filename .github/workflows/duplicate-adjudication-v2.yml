name: Duplicate adjudication v2

on:
  workflow_dispatch:

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::fs
            any::here
            any::httr2
            any::jsonlite
            any::readr
            any::stringdist
            any::stringi
            any::stringr
            any::tibble
            any::tidyr
            any::yaml
            any::quanteda
            any::glmnet
            any::Matrix
      - name: Rebuild deterministic duplicate audit
        run: Rscript scripts/run_lens_pre_llm.R
      - name: Select residual candidates only
        run: |
          Rscript -e 'library(readr); library(dplyr); x <- read_csv("data/updates/2026-08-13_lens/deduplication_audit.csv", show_col_types = FALSE); x <- filter(x, duplicate_status %in% c("probable_duplicate", "possible_duplicate", "doi_conflict_review")); stopifnot(nrow(x) == 7); write_csv(x, "data/updates/2026-08-13_lens/duplicate_candidates.csv")'
      - name: Run API duplicate adjudication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          Rscript -e 'source("R/read_corpus.R"); source("scripts/duplicate_adjudication.R"); run_duplicate_adjudication("data/updates/2026-08-13_lens/duplicate_candidates.csv", "data/updates/2026-08-13_lens/lens-export.ris", "data/reference/salmon_evidence_map.csv", "data/updates/2026-08-13_lens/duplicate_adjudication.csv")'
      - name: Validate adjudication output
        run: |
          Rscript -e 'library(readr); x <- read_csv("data/updates/2026-08-13_lens/duplicate_adjudication.csv", show_col_types = FALSE); stopifnot(nrow(x) == 7); stopifnot(all(x$decision %in% c("duplicate", "not_duplicate", "uncertain"))); message("Adjudicated 7 residual duplicate candidates")'
      - name: Upload adjudication output
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-adjudication-v2
          path: data/updates/2026-08-13_lens/duplicate_adjudication.csv
          if-no-files-found: error
