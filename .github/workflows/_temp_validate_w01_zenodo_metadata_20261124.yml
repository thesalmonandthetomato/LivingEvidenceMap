name: TEMP Validate W01 Zenodo metadata API retries
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_validate_w01_zenodo_metadata_20261124.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies and confirm both restore-script metadata paths
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          Rscript -e 'install.packages(c("curl","httr2","jsonlite","digest"));stopifnot(all(vapply(c("curl","httr2","jsonlite","digest"),requireNamespace,logical(1),quietly=TRUE)))'
      - name: Probe real published W01 Zenodo depositions and verify metadata retry contracts
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          Rscript - <<'RS' >/tmp/w01_metadata_retry_validation.log 2>&1
          suppressPackageStartupMessages({library(httr2);library(jsonlite);library(digest)})
          for(path in c("scripts/updater/workflow_01_restore_current_state.R",
                        "scripts/updater/workflow_01_restore_state_from_zenodo.R")){
            expr<-parse(path)
            syms<-vapply(Filter(function(x)is.call(x)&&identical(x[[1L]],as.name("<-")) &&
              identical(x[[2L]],as.name("zenodo_get_deposition")),as.list(expr)),
              function(x)deparse(x[[2L]]),character(1))
            stopifnot(length(syms)==1L)
            stopifnot(grepl("dep <- zenodo_get_deposition",paste(readLines(path,warn=FALSE),collapse="\\n"),fixed=TRUE))
            cat(sprintf("PASS_METADATA_RETRY_WIRED %s\\n",path))
          }
          token<-Sys.getenv("ZENODO_ACCESS_TOKEN")
          stopifnot(nzchar(token))
          auth<-function(req)req |> req_headers(Authorization=paste("Bearer",token))
          expr<-parse("scripts/updater/workflow_01_restore_current_state.R")
          hit<-Filter(function(x)is.call(x)&&identical(x[[1L]],as.name("<-"))&&
                 identical(x[[2L]],as.name("zenodo_get_deposition")),as.list(expr))
          stopifnot(length(hit)==1L)
          eval(hit[[1L]],envir=.GlobalEnv)
          for(dep_id in c("23211736","23455348")){
            d<-zenodo_get_deposition(paste0("https://zenodo.org/api/deposit/depositions/",dep_id),dep_id)
            stopifnot(isTRUE(d$submitted),nzchar(as.character(d$links$bucket)))
            cat(sprintf("PASS_LIVE_ZENODO_METADATA deposition=%s\\n",dep_id))
          }
          cat("ALL_W01_ZENODO_METADATA_RETRY_TESTS_PASS\\n")
          RS
          status=$?
          cat /tmp/w01_metadata_retry_validation.log
          EXIT_CODE="$status" python3 - <<'PY'
          import os,json,base64,urllib.request
          x={'exit_code':int(os.environ['EXIT_CODE']),'log':open('/tmp/w01_metadata_retry_validation.log').read()[-14000:]}
          data=json.dumps({'message':'TEMP W01 Zenodo deposition API retry validation','content':base64.b64encode(json.dumps(x,indent=2).encode()).decode(),'branch':'workflow01-final-architecture'}).encode()
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/docs/.temp_w01_zenodo_metadata_retry_20261124.json'
          req=urllib.request.Request(url,data=data,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:print("RECEIPT",r.status)
          PY
          exit "$status"
