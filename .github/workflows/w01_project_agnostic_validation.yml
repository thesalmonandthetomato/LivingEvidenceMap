name: W01 topic-agnostic code validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/updater/workflow_01_*.R'
      - 'scripts/updater/workflow_01*.R'
      - '.github/workflows/workflow_01_production.yml'
      - '.github/workflows/workflow_01_resume_after_human_review.yml'
      - '.github/workflows/w01_project_agnostic_validation.yml'
      - 'user_input/workflow01_*'
      - 'config/workflow01_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse W01 R scripts without executing them
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          files <- list.files("scripts/updater", pattern="^workflow_01.*\\.R$", full.names=TRUE)
          stopifnot(length(files) > 20L)
          invisible(lapply(files, parse))
          cat("PASS:",length(files),"W01 scripts parse\\n")
          RS
      - name: Temporary Almeria W01 receipt and RIS preflight
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          REVIEW_SHEET_ID: 1wii1QjB4jM9OzOqboIgZn4z8CAN7W4EAyIKIyGcGjeU
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'install.packages(c("googlesheets4","jsonlite","digest","httr2"),repos="https://cloud.r-project.org")'
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/w01-credentials.json"
          chmod 600 "$RUNNER_TEMP/w01-credentials.json"
          REVIEW_ID="$(Rscript -e 'googlesheets4::gs4_auth(path=commandArgs(TRUE)[1],cache=FALSE);x<-googlesheets4::read_sheet(commandArgs(TRUE)[2],sheet="review_metadata",col_types="cc");stopifnot(identical(names(x),c("key","value")));id<-as.character(x$value[match("review_id",x$key)]);stopifnot(length(id)==1L,!is.na(id),grepl("^[A-Za-z0-9][A-Za-z0-9._-]{3,127}$",id));cat(id)' "$RUNNER_TEMP/w01-credentials.json" "$REVIEW_SHEET_ID")"
          Rscript scripts/updater/workflow_01_resolve_review_w00_receipt.R \
            --sheet-id "$REVIEW_SHEET_ID" --review-id "$REVIEW_ID" \
            --credential "$RUNNER_TEMP/w01-credentials.json" \
            --output "$RUNNER_TEMP/w00-receipt.json" \
            --input-manifest "$RUNNER_TEMP/w01-inputs.json"
          Rscript scripts/updater/workflow_01_restore_review_manual_ris.R \
            --input-manifest "$RUNNER_TEMP/w01-inputs.json" \
            --output-root "$RUNNER_TEMP/w01-manual"
          echo "PASS: Actual Almeria W00 receipt and manual RIS restored and checked"
      - name: Confirm legacy project corrections cannot enter active W01
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'explicit.cluster.splits|explicit_split_cfg|explicit_split_ids|identifier_never_auto_resolve' \
              scripts/updater/workflow_01_apply_adjudications_and_recluster.R \
              .github/workflows/workflow_01_production.yml \
              .github/workflows/workflow_01_resume_after_human_review.yml
          ! test -e user_input/workflow01_explicit_cluster_splits.json
          ! test -e config/workflow01_explicit_cluster_splits.json
          ! test -e user_input/workflow01_identifier_never_auto_resolve.csv
          ! test -e config/workflow01_identifier_never_auto_resolve.csv
          ! test -e user_input/workflow01_manual_sources.json
          grep -q 'previous work IDs would split across multiple current clusters' scripts/updater/workflow_01_apply_adjudications_and_recluster.R
          grep -q 'if(length(prior_ids)==1L)' scripts/updater/workflow_01_apply_adjudications_and_recluster.R
          echo "PASS: no historical W01 project correction input; stable-ID safeguards retained"
