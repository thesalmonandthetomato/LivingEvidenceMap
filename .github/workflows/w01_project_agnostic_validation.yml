name: W01 topic-agnostic code validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/updater/workflow_01_*.R'
      - 'scripts/updater/workflow_01*.R'
      - '.github/workflows/workflow_01_production.yml'
      - '.github/workflows/workflow_01_resume_after_human_review.yml'
      - '.github/workflows/w01_project_agnostic_validation.yml'
      - 'user_input/workflow01_*'
      - 'config/workflow01_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse W01 R scripts without executing them
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          files <- list.files("scripts/updater", pattern="^workflow_01.*\\.R$", full.names=TRUE)
          stopifnot(length(files) > 20L)
          invisible(lapply(files, parse))
          cat("PASS:",length(files),"W01 scripts parse\\n")
          RS
      - name: Temporary synthetic RIS conversion check
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          install.packages(c("jsonlite","digest"),repos="https://cloud.r-project.org")
          d<-tempfile("w01-ris-");dir.create(d)
          writeLines(c("TY  - JOUR","AU  - Smith, Alex","AU  - Jones, Pat",
            "PY  - 2022","TI  - Example title","JO  - Sample Journal",
            "VL  - 5","IS  - 2","SP  - 11","EP  - 19",
            "DO  - https://doi.org/10.1234/TEST","AB  - Example abstract",
            "ER  -"),file.path(d,"example.ris"))
          target<-file.path(d,"records.jsonl")
          status<-system2(file.path(R.home("bin"),"Rscript"),
            c("scripts/updater/workflow_01_generic_ris_to_sidecar.R",
              "--input-dir",shQuote(d),"--source","manual_test",
              "--submission-id","manual-test123","--output",shQuote(target)))
          stopifnot(identical(as.integer(status),0L),file.exists(target))
          z<-jsonlite::fromJSON(readLines(target,warn=FALSE)[[1L]],simplifyVector=FALSE)
          stopifnot(identical(z$mapped_fields$title,"Example title"),
            identical(z$mapped_fields$publication_type,"JOUR"),
            identical(z$mapped_fields$year,"2022"),
            identical(z$mapped_fields$doi,"10.1234/test"),
            length(z$mapped_fields$authors)==2L,
            identical(z$mapped_fields$pages,"11-19"),
            identical(z$mapped_fields$abstract,"Example abstract"))
          cat("PASS: synthetic RIS bibliographic conversion\n")
          RS
      - name: Confirm legacy project corrections cannot enter active W01
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'explicit.cluster.splits|explicit_split_cfg|explicit_split_ids|identifier_never_auto_resolve' \
              scripts/updater/workflow_01_apply_adjudications_and_recluster.R \
              .github/workflows/workflow_01_production.yml \
              .github/workflows/workflow_01_resume_after_human_review.yml
          ! test -e user_input/workflow01_explicit_cluster_splits.json
          ! test -e config/workflow01_explicit_cluster_splits.json
          ! test -e user_input/workflow01_identifier_never_auto_resolve.csv
          ! test -e config/workflow01_identifier_never_auto_resolve.csv
          ! test -e user_input/workflow01_manual_sources.json
          grep -q 'previous work IDs would split across multiple current clusters' scripts/updater/workflow_01_apply_adjudications_and_recluster.R
          grep -q 'if(length(prior_ids)==1L)' scripts/updater/workflow_01_apply_adjudications_and_recluster.R
          echo "PASS: no historical W01 project correction input; stable-ID safeguards retained"
