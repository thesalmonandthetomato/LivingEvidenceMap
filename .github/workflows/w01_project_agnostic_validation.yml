name: W01 topic-agnostic code validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/updater/workflow_01_*.R'
      - 'scripts/updater/workflow_01*.R'
      - '.github/workflows/workflow_01_production.yml'
      - '.github/workflows/workflow_01_resume_after_human_review.yml'
      - '.github/workflows/w01_project_agnostic_validation.yml'
      - 'user_input/workflow01_*'
      - 'config/workflow01_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse W01 R scripts without executing them
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          files <- list.files("scripts/updater", pattern="^workflow_01.*\\.R$", full.names=TRUE)
          stopifnot(length(files) > 20L)
          invisible(lapply(files, parse))
          cat("PASS:",length(files),"W01 scripts parse\\n")
          RS
      - name: Confirm legacy project corrections cannot enter active W01
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'explicit.cluster.splits|explicit_split_cfg|explicit_split_ids|identifier_never_auto_resolve' \
              scripts/updater/workflow_01_apply_adjudications_and_recluster.R \
              .github/workflows/workflow_01_production.yml \
              .github/workflows/workflow_01_resume_after_human_review.yml
          ! test -e user_input/workflow01_explicit_cluster_splits.json
          ! test -e config/workflow01_explicit_cluster_splits.json
          ! test -e user_input/workflow01_identifier_never_auto_resolve.csv
          ! test -e config/workflow01_identifier_never_auto_resolve.csv
          ! test -e user_input/workflow01_manual_sources.json
          grep -q 'previous work IDs would split across multiple current clusters' scripts/updater/workflow_01_apply_adjudications_and_recluster.R
          grep -q 'if(length(prior_ids)==1L)' scripts/updater/workflow_01_apply_adjudications_and_recluster.R
          echo "PASS: no historical W01 project correction input; stable-ID safeguards retained"
