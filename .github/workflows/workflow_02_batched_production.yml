name: Workflow 02 - Batched production candidate

on:
  workflow_dispatch:
    inputs:
      workflow01_pointer_path:
        description: 'Authoritative Workflow 01 pointer for this update'
        required: true
        type: string
      previous_workflow02_pointer_path:
        description: 'Latest published Workflow 02 state'
        required: true
        type: string
      resume_run_id:
        description: 'Optional interrupted incremental run ID to resume'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  production:
    uses: ./.github/workflows/workflow_02_batched.yml
    with:
      workflow01_pointer_path: ${{ inputs.workflow01_pointer_path }}
      previous_workflow02_pointer_path: ${{ inputs.previous_workflow02_pointer_path }}
      mode: 'incremental'
      resume_run_id: ${{ inputs.resume_run_id }}
      batch_size: '250'
      max_records: '0'
      recheck_after_days: '90'
      publish: true
      use_scopus: false
    secrets: inherit
