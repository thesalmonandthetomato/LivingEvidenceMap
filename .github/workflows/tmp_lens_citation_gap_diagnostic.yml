name: Temporary Lens citation-gap diagnostic

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Batches per direction (0 = all)"
        required: true
        default: "1"
        type: string
  push:
    branches:
      - tmp-lens-citation-gap-test
    paths:
      - ".github/workflows/tmp_lens_citation_gap_diagnostic.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-lens-citation-gap-test
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2", "jsonlite"))

      - name: Download authoritative W08 included-corpus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w08
          gh api             -H "Accept: application/vnd.github+json"             /repos/${GITHUB_REPOSITORY}/actions/artifacts/11315532812/zip             > /tmp/w08.zip
          unzip -q /tmp/w08.zip -d /tmp/w08
          test -s /tmp/w08/workflow08/living_evidence_map_canonical_final.jsonl

      - name: Run Lens citation-gap diagnostic
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_batches || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/temporary/lens_citation_gap_diagnostic.R             --canonical /tmp/w08/workflow08/living_evidence_map_canonical_final.jsonl             --output-dir outputs/lens_citation_gap             --batch-size 500             --max-batches "$MAX_BATCHES"

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f outputs/lens_citation_gap/summary.json ]; then
            echo '### Lens citation-gap diagnostic' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/lens_citation_gap/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-citation-gap-diagnostic-${{ github.run_id }}
          path: outputs/lens_citation_gap/
          retention-days: 14
          if-no-files-found: warn
