name: TEMP W01 real checkpoint validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_w01_real_validation.yml']
permissions:
  contents: read
  actions: read
env:
  WORKFLOW01_BRANCH: workflow01-final-architecture
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Workflow 01 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW01_BRANCH }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system curl and verify required R packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          Rscript - <<'RS'
          packages <- c('curl','data.table','jsonlite','digest','httr2','readr','stringdist','stringi','xml2','googlesheets4')
          install.packages(packages)
          missing <- packages[!vapply(packages,requireNamespace,logical(1),quietly=TRUE)]
          if(length(missing)) stop(sprintf("W01 resume missing R packages: %s",paste(missing,collapse=", ")),call.=FALSE)
          cat(sprintf("PASS: W01 resume R dependencies available; curl=%s\\n",
                      as.character(utils::packageVersion('curl'))))
          RS

      - name: Resolve resume inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_HANDOFF: docs/deduplication/handoffs/w01/run-45349525216.json
          INPUT_POINTER: ''
          INPUT_DECISIONS: ''
          INPUT_REPAIRS: ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/resume_inputs

          if [ "${{ github.event_name }}" = "push" ] || [ -n "$INPUT_HANDOFF" ]; then
            if [ -n "$INPUT_HANDOFF" ]; then
              test -s "$INPUT_HANDOFF"
              INPUT_HANDOFF="$INPUT_HANDOFF" Rscript - <<'RS'
              suppressPackageStartupMessages(library(jsonlite))
              p <- Sys.getenv("INPUT_HANDOFF")
              x <- fromJSON(p,simplifyVector=FALSE)
              stopifnot(
                identical(as.character(x$schema),"living-evidence-map-workflow01-shiny-handoff-v1"),
                identical(as.character(x$status),"ready")
              )
              out <- c(
                list(
                  schema="living-evidence-map-workflow01-ready-handoff-selection-v1",
                  found=TRUE,
                  handoff_path=p
                ),
                x
              )
              writeLines(
                toJSON(out,auto_unbox=TRUE,pretty=TRUE,null="null"),
                "outputs/resume_inputs/handoff_selection.json",
                useBytes=TRUE
              )
          RS
            else
              Rscript scripts/updater/workflow_01_select_ready_handoff.R \
                --output outputs/resume_inputs/handoff_selection.json
            fi

            FOUND="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1]);cat(tolower(as.character(isTRUE(x$found))))' outputs/resume_inputs/handoff_selection.json)"
            if [ "$FOUND" != "true" ]; then
              echo "No unresolved ready W01 handoff found" >&2
              exit 1
            fi

            POINTER="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1]);cat(x$checkpoint_pointer_path)' outputs/resume_inputs/handoff_selection.json)"
            EXPORT_RUN_ID="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1]);cat(x$export_run_id)' outputs/resume_inputs/handoff_selection.json)"
            DECISIONS_ARTIFACT="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1]);cat(x$decisions_artifact)' outputs/resume_inputs/handoff_selection.json)"

            gh run download "$EXPORT_RUN_ID" \
              --repo thesalmonandthetomato/LivingEvidenceMap \
              --name "$DECISIONS_ARTIFACT" \
              --dir outputs/resume_inputs

            test -s outputs/resume_inputs/human_decisions.jsonl
            test -f outputs/resume_inputs/data_quality_repairs.jsonl
            test -s outputs/resume_inputs/human_decisions.manifest.json

            Rscript - <<'RS'
            suppressPackageStartupMessages({
              library(jsonlite)
              library(digest)
            })
            h <- fromJSON("outputs/resume_inputs/handoff_selection.json",simplifyVector=FALSE)
            d <- fromJSON("outputs/resume_inputs/human_decisions.manifest.json",simplifyVector=FALSE)
            stopifnot(
              isTRUE(h$found),
              identical(as.character(d$schema),"living-evidence-map-workflow01-shiny-decision-export-manifest-v2"),
              identical(as.character(d$checkpoint_pointer_path),as.character(h$checkpoint_pointer_path)),
              identical(as.character(d$checkpoint_run_id),as.character(h$checkpoint_run_id)),
              identical(tolower(as.character(d$queue_sha256)),tolower(as.character(h$queue_sha256))),
              identical(as.integer(d$queue_cases),as.integer(h$queue_cases)),
              identical(as.character(d$export_run_id),as.character(h$export_run_id)),
              identical(tolower(as.character(d$export_sha256)),tolower(as.character(h$decisions_export_sha256))),
              isTRUE(d$complete),
              as.integer(d$unresolved_cases)==0L,
              as.integer(d$uncertain_cases)==0L
            )
            actual <- digest(file="outputs/resume_inputs/human_decisions.jsonl",algo="sha256",serialize=FALSE)
            if(!identical(tolower(actual),tolower(as.character(h$decisions_export_sha256)))) {
              stop("Downloaded W01 decisions SHA-256 does not match handoff manifest",call.=FALSE)
            }
            repairs_actual <- digest(file="outputs/resume_inputs/data_quality_repairs.jsonl",algo="sha256",serialize=FALSE)
            if (is.null(d$repairs_sha256) || !identical(tolower(repairs_actual),tolower(as.character(d$repairs_sha256)))) {
              stop("Downloaded W01 repairs SHA-256 does not match export manifest",call.=FALSE)
            }
            cat("PASS: W01 handoff and downloaded decision/repair artefacts agree\n")
          RS

            echo "POINTER=$POINTER" >> "$GITHUB_ENV"
            echo "DECISIONS=outputs/resume_inputs/human_decisions.jsonl" >> "$GITHUB_ENV"
            echo "REPAIRS=outputs/resume_inputs/data_quality_repairs.jsonl" >> "$GITHUB_ENV"
          else
            echo "POINTER=$INPUT_POINTER" >> "$GITHUB_ENV"
            echo "DECISIONS=$INPUT_DECISIONS" >> "$GITHUB_ENV"
            echo "REPAIRS=$INPUT_REPAIRS" >> "$GITHUB_ENV"
          fi

      - name: Validate resume inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$POINTER"
          test -s "$DECISIONS"
          if [ -n "$REPAIRS" ]; then test -f "$REPAIRS"; fi
          POINTER="$POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("POINTER"));stopifnot(x$status=="published",x$state=="pre_adjudication",x$visibility=="restricted")'

      - name: Restore compact pre-adjudication checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_pending_checkpoint.R \
            --pointer "$POINTER" \
            --output-root checkpoint_restore > outputs_checkpoint_dir.txt
          CHECKPOINT_DIR="$(tail -n 1 outputs_checkpoint_dir.txt)"
          test -s "$CHECKPOINT_DIR/checkpoint_manifest.json"
          test -s "$CHECKPOINT_DIR/previous_workflow01_pointer.json"
          test -s "$CHECKPOINT_DIR/incremental_rescored_pairs.csv"
          test -s "$CHECKPOINT_DIR/all_adjudications.jsonl"
          test -s "$CHECKPOINT_DIR/human_review_package/review_manifest.json"
          echo "CHECKPOINT_DIR=$CHECKPOINT_DIR" >> "$GITHUB_ENV"

      - name: Restore previous authoritative Workflow 01 state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer "$CHECKPOINT_DIR/previous_workflow01_pointer.json" \
            --pointer-dir docs/deduplication/zenodo \
            --output-root previous_state
          test -s previous_state/workflow01_full_five_source/final_pair_decisions.csv
          test -s previous_state/workflow01_full_five_source/manifestation_cluster_map.csv
          test -s previous_state/canonical/records.jsonl
          test -f previous_state/provenance/cumulative_data_quality_repairs.jsonl

      - name: Reconstruct current source union from compact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_apply_checkpoint_sources.R \
            --previous-seed previous_state/workflow01_seed \
            --checkpoint-dir "$CHECKPOINT_DIR" \
            --output-dir outputs/workflow01_union

      - name: Rebuild deterministic metadata indexing only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow01_candidates
          Rscript scripts/updater/workflow_01_deduplication_incremental_candidates.R \
            --input-manifest outputs/workflow01_union/source_inputs.json \
            --old-manifestation-map previous_state/workflow01_full_five_source/manifestation_cluster_map.csv \
            --output-dir outputs/workflow01_candidates \
            --score-n 1 \
            --workflow01-run-id "$GITHUB_RUN_ID" \
            --validate-index-only true

      - name: Verify reconstructed W01 dedup index identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/index_identity
          Rscript scripts/updater/workflow_01_validate_index_identity.R \
            --metadata outputs/workflow01_candidates/normalised_metadata.csv \
            --checkpoint-manifest "$CHECKPOINT_DIR/checkpoint_manifest.json" \
            --output outputs/index_identity/validation.json

      - name: Reconstruct exact pre-adjudication pair state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow01_pre_adjudication
          Rscript scripts/updater/workflow_01_deduplication_merge_clusters.R \
            --old-decisions previous_state/workflow01_full_five_source/final_pair_decisions.csv \
            --new-decisions "$CHECKPOINT_DIR/incremental_rescored_pairs.csv" \
            --metadata outputs/workflow01_candidates/normalised_metadata.csv \
            --output-dir outputs/workflow01_pre_adjudication
          Rscript -e 'library(jsonlite);a<-fromJSON("outputs/workflow01_pre_adjudication/summary.json");b<-fromJSON(file.path(Sys.getenv("CHECKPOINT_DIR"),"pre_adjudication_summary.json"));stopifnot(a$source_manifestations==b$source_manifestations,a$incremental_pair_decisions==b$incremental_pair_decisions,a$manual_review_pairs==b$manual_review_pairs);cat("PASS: reconstructed pre-adjudication summary matches checkpoint\n")'

      - name: Normalise submitted human decisions and repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/human_gate
          if [ -n "$REPAIRS" ]; then
            cp "$REPAIRS" outputs/human_gate/repairs.input.jsonl
          else
            : > outputs/human_gate/repairs.input.jsonl
          fi
          Rscript scripts/updater/workflow_01_migrate_human_review_state.R \
            --queue "$CHECKPOINT_DIR/human_review_package/human_review_cases.jsonl" \
            --decisions "$DECISIONS" \
            --repairs outputs/human_gate/repairs.input.jsonl \
            --output-dir outputs/human_gate/normalised

      - name: Enforce locked human-review integrity gate
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(Rscript -e 'x<-jsonlite::fromJSON(file.path(Sys.getenv("CHECKPOINT_DIR"),"human_review_package","review_manifest.json"));cat(x$queue_sha256)')"
          Rscript scripts/updater/workflow_01_validate_human_review_state.R \
            --queue "$CHECKPOINT_DIR/human_review_package/human_review_cases.jsonl" \
            --decisions outputs/human_gate/normalised/human_decisions.normalised.jsonl \
            --repairs outputs/human_gate/normalised/data_quality_repairs.normalised.jsonl \
            --output outputs/human_gate/human_review_integrity.json \
            --expected-queue-sha256 "$SHA" \
            --require-complete true

      - name: Apply final adjudications with stable work IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/final
          # The reconstructed pair CSV is ~17 GiB. Free its disk footprint
          # before streaming the full-fidelity final CSV; readr supports gzip.
          PAIR_INPUT="outputs/workflow01_pre_adjudication/combined_pair_decisions.csv"
          test -s "$PAIR_INPUT"
          df -h .
          if [ "$(stat -c%s "$PAIR_INPUT")" -ge 1073741824 ]; then
            if ! command -v pigz >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends pigz
            fi
            pigz -1 -p 4 "$PAIR_INPUT"
            PAIR_INPUT="$PAIR_INPUT.gz"
            test -s "$PAIR_INPUT"
          fi
          Rscript scripts/updater/workflow_01_apply_adjudications_and_recluster.R \
            --combined-decisions "$PAIR_INPUT" \
            --manifestation-map outputs/workflow01_pre_adjudication/manifestation_cluster_map.csv \
            --llm-adjudications "$CHECKPOINT_DIR/all_adjudications.jsonl" \
            --human-decisions outputs/human_gate/normalised/human_decisions.normalised.jsonl \
            --human-integrity-manifest outputs/human_gate/human_review_integrity.json \
            --data-quality-repairs outputs/human_gate/normalised/data_quality_repairs.normalised.jsonl \
            --previous-cluster-map previous_state/workflow01_full_five_source/manifestation_cluster_map.csv \
            --seed-authoritative-clusters true \
            --explicit-cluster-splits config/workflow01_explicit_cluster_splits.json \
            --output-dir outputs/final
          test -s outputs/final/summary.json
          test -s outputs/final/final_pair_decisions.csv
          if [[ "$PAIR_INPUT" == *.gz ]]; then rm -f "$PAIR_INPUT"; fi
          df -h .

      - name: Preserve metrics and cumulative repair provenance
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e "library(jsonlite);pre<-fromJSON('outputs/workflow01_pre_adjudication/summary.json',simplifyVector=FALSE);fin<-fromJSON('outputs/final/summary.json',simplifyVector=FALSE);for(nm in c('preserved_pair_decisions','incremental_candidate_rows','incremental_pair_decisions','exact_duplicate_candidate_rows_removed','manual_review_pairs'))if(is.null(fin[[nm]])&&!is.null(pre[[nm]]))fin[[nm]]<-pre[[nm]];writeLines(toJSON(fin,auto_unbox=TRUE,pretty=TRUE,null='null'),'outputs/final/summary.json')"
          mv outputs/final/abstract_strip_actions.jsonl outputs/final/abstract_strip_actions.new.jsonl
          Rscript scripts/updater/workflow_01_merge_cumulative_repairs.R \
            --previous-repairs previous_state/provenance/cumulative_data_quality_repairs.jsonl \
            --new-repairs outputs/human_gate/normalised/data_quality_repairs.normalised.jsonl \
            --previous-strips previous_state/workflow01_full_five_source/abstract_strip_actions.jsonl \
            --new-strips outputs/final/abstract_strip_actions.new.jsonl \
            --output-repairs outputs/final/cumulative_data_quality_repairs.jsonl \
            --output-strips outputs/final/abstract_strip_actions.jsonl

      - name: Build source-agnostic canonical JSONL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/canonical
          Rscript scripts/updater/workflow_01_build_canonical_jsonl.R \
            --cluster-map outputs/final/manifestation_cluster_map.csv \
            --strip-actions outputs/final/abstract_strip_actions.jsonl \
            --data-quality-repairs outputs/final/cumulative_data_quality_repairs.jsonl \
            --repair-audit outputs/canonical/data_quality_repair_application.jsonl \
            --input-manifest outputs/workflow01_union/source_inputs.json \
            --run-id "$GITHUB_RUN_ID" \
            --output outputs/canonical/records.jsonl \
            --manifest outputs/canonical/canonical_manifest.json

      - name: Build and replay final delta
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_build_delta.R \
            --previous-root previous_state \
            --current-seed-root outputs/workflow01_union \
            --current-final-root outputs/final \
            --current-canonical outputs/canonical/records.jsonl \
            --current-canonical-manifest outputs/canonical/canonical_manifest.json \
            --previous-pointer "$CHECKPOINT_DIR/previous_workflow01_pointer.json" \
            --repair-audit outputs/canonical/data_quality_repair_application.jsonl \
            --repair-ledger outputs/human_gate/normalised/data_quality_repairs.normalised.jsonl \
            --output-dir outputs/delta \
            --run-id "$GITHUB_RUN_ID"
          test -s outputs/delta/delta_manifest.json
          # No remaining step needs the 17 GiB full final pair CSV: the
          # cryptographically verified delta and source state reconstruct it.
          rm -f outputs/final/final_pair_decisions.csv
          df -h .
          Rscript scripts/updater/workflow_01_replay_delta.R \
            --previous-root previous_state \
            --delta-dir outputs/delta \
            --output-root outputs/replayed


      - name: Verify final membership and replay
        shell: Rscript {0}
        run: |
          library(data.table)
          library(jsonlite)
          old <- fread("previous_state/workflow01_full_five_source/manifestation_cluster_map.csv")
          m <- fread("outputs/final/manifestation_cluster_map.csv")
          stopifnot(nrow(old)==169221L,nrow(m)==182703L)
          old[,key:=paste(source,source_record_id,sep="::")]
          m[,key:=paste(source,source_record_id,sep="::")]
          stopifnot(!anyDuplicated(m$key),all(old$key %in% m$key))
          old[,new_id:=m$cluster_id[match(key,m$key)]]
          stopifnot(old[,uniqueN(new_id),by=cluster_id][V1>1L,.N]==0L)
          s <- fromJSON("outputs/final/summary.json")
          stopifnot(s$status=="final",isTRUE(s$authoritative_membership_seeded),s$unresolved_pair_decisions==0L)
          stopifnot(file.exists("outputs/replayed/workflow01_delta_replay_audit.json"))
          cat("PASS: real November checkpoint, historical memberships, canonical output and delta replay verified\n")
