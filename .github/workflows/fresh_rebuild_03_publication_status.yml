name: Workflow 03 - Publication status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh_rebuild_03_publication_status.yml'
      - 'scripts/updater/workflow_03_publication_status.R'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit first; apply only after audit review'
        required: true
        default: audit
        type: choice
        options: [audit, apply]

permissions:
  contents: write
  actions: read

env:
  FRESH_CANONICAL_BRANCH: canonical-fresh-2026-09-08-v1

jobs:
  publication-status:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main orchestration branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('jsonlite', 'curl'))

      - name: Load Workflow 03 R implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workflow03
          cp scripts/updater/workflow_03_publication_status.R /tmp/workflow03/workflow_03_publication_status.R
          Rscript -e "parse(file='/tmp/workflow03/workflow_03_publication_status.R'); cat('PASS: Workflow 03 R script parses successfully\n')"

      - name: Checkout fresh canonical JSON with LFS
        uses: actions/checkout@v4
        with:
          ref: canonical-fresh-2026-09-08-v1
          fetch-depth: 0
          lfs: true
          path: canonical_store

      - name: Validate Workflow 03 input and derive cardinality
        shell: Rscript {0}
        run: |
          library(jsonlite)
          `%||%` <- function(x,y) if (is.null(x)) y else x
          p <- 'canonical_store/data/canonical/current/repair/records.jsonl'
          mp <- 'canonical_store/data/canonical/current/repair/manifest.json'
          if (!file.exists(p)) stop(sprintf('ERROR: canonical records file not found: %s', p), call.=FALSE)
          if (!file.exists(mp)) stop(sprintf('ERROR: canonical manifest not found: %s', mp), call.=FALSE)
          m <- fromJSON(mp, simplifyVector=FALSE)
          if (!identical(m$pipeline_stage, 'deduplicated')) stop(sprintf('ERROR: expected pipeline_stage=deduplicated, found %s', m$pipeline_stage %||% '<missing>'), call.=FALSE)
          lines <- readLines(p, warn=FALSE, encoding='UTF-8'); lines <- lines[nzchar(trimws(lines))]
          if (!length(lines)) stop('ERROR: canonical records file contains zero records', call.=FALSE)
          manifest_count <- m$unique_records_written %||% m$lens_reported_total
          if (!is.null(manifest_count) && as.integer(manifest_count) != length(lines)) stop(sprintf('ERROR: manifest/input cardinality mismatch: manifest=%s input=%d', manifest_count, length(lines)), call.=FALSE)
          ids <- character(length(lines))
          for (i in seq_along(lines)) {
            r <- tryCatch(fromJSON(lines[[i]], simplifyVector=FALSE), error=function(e) stop(sprintf('ERROR: invalid JSON at line %d: %s', i, conditionMessage(e)), call.=FALSE))
            ids[i] <- as.character((r$identity %||% list())$lens_id %||% '')
            if (!nzchar(ids[i])) stop(sprintf('ERROR: missing Lens ID at line %d', i), call.=FALSE)
            if (is.null(r$deduplication)) stop(sprintf('ERROR: Workflow 02 annotation missing at line %d / Lens ID %s', i, ids[i]), call.=FALSE)
            if (!is.null(r$screening) || !is.null(r$screening_history)) stop(sprintf('ERROR: relevance screening state already present at Lens ID %s', ids[i]), call.=FALSE)
          }
          if (anyDuplicated(ids)) stop(sprintf('ERROR: duplicate Lens ID detected: %s', ids[duplicated(ids)][1]), call.=FALSE)
          dir.create('outputs/fresh_workflow03/checkpoints', recursive=TRUE, showWarnings=FALSE)
          input_summary <- list(
            phase='input_validated', implementation_language='R', input_records=length(lines),
            manifest_record_count=manifest_count, pipeline_stage=m$pipeline_stage,
            canonical_commit=system('git -C canonical_store rev-parse HEAD', intern=TRUE),
            checked_at=format(Sys.time(), tz='UTC', format='%Y-%m-%dT%H:%M:%SZ')
          )
          writeLines(toJSON(input_summary, auto_unbox=TRUE, pretty=TRUE, null='null'), 'outputs/fresh_workflow03/checkpoints/input_validation.json')
          cat(sprintf('PASS: %d deduplicated canonical records ready for Workflow 03; cardinality derived from canonical input/manifest\n', length(lines)))

      - name: Run Workflow 03 publication-status screening in R
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/fresh_workflow03/checkpoints
          MODE='${{ inputs.mode }}'
          if [ -z "$MODE" ]; then MODE='audit'; fi
          echo "Workflow 03 mode: $MODE"
          Rscript /tmp/workflow03/workflow_03_publication_status.R \
            --input canonical_store/data/canonical/current/repair/records.jsonl \
            --output outputs/fresh_workflow03/annotated_records.jsonl \
            --audit outputs/fresh_workflow03/publication_status_audit.jsonl \
            --summary outputs/fresh_workflow03/publication_status_summary.json \
            --checkpoint-dir outputs/fresh_workflow03/checkpoints \
            --mode "$MODE" \
            --batch-size 25 \
            --max-tries 5

      - name: Validate Workflow 03 audit
        shell: Rscript {0}
        run: |
          library(jsonlite)
          input <- readLines('canonical_store/data/canonical/current/repair/records.jsonl', warn=FALSE, encoding='UTF-8'); input <- input[nzchar(trimws(input))]
          audit <- readLines('outputs/fresh_workflow03/publication_status_audit.jsonl', warn=FALSE, encoding='UTF-8'); audit <- audit[nzchar(trimws(audit))]
          if (length(audit) != length(input)) stop(sprintf('ERROR: audit cardinality mismatch: audit=%d input=%d', length(audit), length(input)), call.=FALSE)
          s <- fromJSON('outputs/fresh_workflow03/publication_status_summary.json', simplifyVector=FALSE)
          if (as.integer(s$input_records) != length(input)) stop('ERROR: summary input_records does not match canonical input', call.=FALSE)
          if (as.integer(s$openalex_failed_records) != 0L) stop(sprintf('ERROR: %d OpenAlex failed record(s) remain; Workflow 03 blocked', as.integer(s$openalex_failed_records)), call.=FALSE)
          if (as.integer(s$records_removed) != 0L) stop('ERROR: Workflow 03 must not physically remove records', call.=FALSE)
          expected_notices <- sum(as.integer(c(s$retraction_notices, s$withdrawal_notices, s$correction_notices, s$corrigendum_notices, s$erratum_notices, s$openalex_retracted_originals)))
          if (as.integer(s$notices_total) != expected_notices) stop(sprintf('ERROR: notice-type totals do not sum to notices_total: types=%d notices_total=%d', expected_notices, as.integer(s$notices_total)), call.=FALSE)
          if (as.integer(s$downstream_excluded_by_notice) != as.integer(s$retraction_notices) + as.integer(s$withdrawal_notices) + as.integer(s$openalex_retracted_originals)) stop('ERROR: downstream notice exclusions are inconsistent with retraction/withdrawal rules', call.=FALSE)
          if (as.integer(s$retained_notice_records) != as.integer(s$correction_notices) + as.integer(s$corrigendum_notices) + as.integer(s$erratum_notices)) stop('ERROR: retained notice count is inconsistent with correction/corrigendum/erratum rules', call.=FALSE)
          cat(toJSON(s, auto_unbox=TRUE, pretty=TRUE, null='null'), '\n')
          cat('PASS: Workflow 03 notice classification, cardinality and provider-failure invariants validated\n')

      - name: Validate apply output
        if: ${{ inputs.mode == 'apply' }}
        shell: Rscript {0}
        run: |
          library(jsonlite)
          `%||%` <- function(x,y) if (is.null(x)) y else x
          input <- readLines('canonical_store/data/canonical/current/repair/records.jsonl', warn=FALSE, encoding='UTF-8'); input <- input[nzchar(trimws(input))]
          rows <- readLines('outputs/fresh_workflow03/annotated_records.jsonl', warn=FALSE, encoding='UTF-8'); rows <- rows[nzchar(trimws(rows))]
          if (length(rows) != length(input)) stop(sprintf('ERROR: apply output cardinality mismatch: output=%d input=%d', length(rows), length(input)), call.=FALSE)
          ids <- character(length(rows)); notice_count <- 0L; blocking_count <- 0L; retained_notice_count <- 0L
          allowed <- c('retraction','withdrawal','correction','corrigendum','erratum','retracted_original')
          for (i in seq_along(rows)) {
            r <- fromJSON(rows[[i]], simplifyVector=FALSE)
            ids[i] <- as.character((r$identity %||% list())$lens_id %||% '')
            if (!nzchar(ids[i])) stop(sprintf('ERROR: missing Lens ID in apply output line %d', i), call.=FALSE)
            if (!is.null(r$screening) || !is.null(r$screening_history)) stop(sprintf('ERROR: screening state introduced unexpectedly at Lens ID %s', ids[i]), call.=FALSE)
            if (!is.null(r$publication_status)) stop(sprintf('ERROR: obsolete publication_status field present at Lens ID %s; notices must be the single publication-notice location', ids[i]), call.=FALSE)
            dedup_ok <- identical((r$deduplication %||% list())$downstream_eligible, TRUE)
            if (!is.null(r$notices)) {
              notice_count <- notice_count + 1L
              n <- r$notices
              if (!n$type %in% allowed) stop(sprintf('ERROR: invalid notices.type=%s at Lens ID %s', n$type %||% '<missing>', ids[i]), call.=FALSE)
              if (!identical(n$downstream_eligible, TRUE) && !identical(n$downstream_eligible, FALSE)) stop(sprintf('ERROR: invalid notices.downstream_eligible at Lens ID %s', ids[i]), call.=FALSE)
              if (!dedup_ok) stop(sprintf('ERROR: notice annotation attached to dedup-ineligible record %s', ids[i]), call.=FALSE)
              blocking_type <- n$type %in% c('retraction','withdrawal','retracted_original')
              if (blocking_type && !identical(n$downstream_eligible, FALSE)) stop(sprintf('ERROR: blocking notice remained downstream eligible at Lens ID %s', ids[i]), call.=FALSE)
              if (!blocking_type && !identical(n$downstream_eligible, TRUE)) stop(sprintf('ERROR: correction/corrigendum/erratum was blocked at Lens ID %s', ids[i]), call.=FALSE)
              if (blocking_type) blocking_count <- blocking_count + 1L else retained_notice_count <- retained_notice_count + 1L
            }
          }
          if (anyDuplicated(ids)) stop(sprintf('ERROR: duplicate Lens ID in apply output: %s', ids[duplicated(ids)][1]), call.=FALSE)
          s <- fromJSON('outputs/fresh_workflow03/publication_status_summary.json', simplifyVector=FALSE)
          if (notice_count != as.integer(s$notices_total)) stop(sprintf('ERROR: apply notices count=%d but summary notices_total=%d', notice_count, as.integer(s$notices_total)), call.=FALSE)
          if (blocking_count != as.integer(s$downstream_excluded_by_notice)) stop('ERROR: apply blocking-notice count does not match summary', call.=FALSE)
          if (retained_notice_count != as.integer(s$retained_notice_records)) stop('ERROR: apply retained-notice count does not match summary', call.=FALSE)
          cat(sprintf('PASS: %d records preserve cardinality; notices=%d, blocking=%d, retained=%d\n', length(rows), notice_count, blocking_count, retained_notice_count))

      - name: Persist Workflow 03 notice annotations transactionally
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(git -C canonical_store rev-parse HEAD)
          git -C canonical_store fetch origin "$FRESH_CANONICAL_BRANCH"
          REMOTE_SHA=$(git -C canonical_store rev-parse "origin/$FRESH_CANONICAL_BRANCH")
          if [ "$BASE_SHA" != "$REMOTE_SHA" ]; then
            echo "ERROR: canonical branch advanced during Workflow 03 (checked out $BASE_SHA; remote now $REMOTE_SHA). Refusing stale promotion."
            exit 1
          fi

          cp outputs/fresh_workflow03/annotated_records.jsonl canonical_store/data/canonical/current/repair/records.jsonl
          Rscript - <<'RS'
          library(jsonlite)
          mp <- 'canonical_store/data/canonical/current/repair/manifest.json'
          m <- fromJSON(mp, simplifyVector=FALSE)
          s <- fromJSON('outputs/fresh_workflow03/publication_status_summary.json', simplifyVector=FALSE)
          m$publication_status <- NULL
          m$notices <- list(
            workflow='workflow_03_publication_status',
            implementation_language='R',
            completed_at=s$checked_at,
            provider='openalex',
            summary=s
          )
          m$pipeline_stage <- 'publication_status_screened'
          writeLines(toJSON(m, auto_unbox=TRUE, pretty=TRUE, null='null', na='null'), mp)
          RS

          cd canonical_store
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git add data/canonical/current/repair/records.jsonl data/canonical/current/repair/manifest.json
          git diff --cached --quiet && { echo 'ERROR: no Workflow 03 notice changes detected; refusing empty apply'; exit 1; }
          git commit -m 'Persist Workflow 03 R notice state'
          git lfs push origin "$FRESH_CANONICAL_BRANCH"
          git push origin HEAD:"$FRESH_CANONICAL_BRANCH"
          git log -1 --format='workflow03_notice_commit=%H'

      - name: Upload Workflow 03 artefacts and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow03-${{ inputs.mode || 'audit' }}-${{ github.run_id }}
          path: outputs/fresh_workflow03/
          retention-days: 90
          if-no-files-found: warn
