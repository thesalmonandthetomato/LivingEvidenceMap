name: TEMP W08b dynamic release selector tests
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_release_selector_test_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Test real October release identity and fail-closed November mismatch
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/resolve_monthly_release.R docs/current_run/current_run_status.json docs/workflow08/zenodo_registry.csv docs/deduplication/zenodo 2026-10 "$RUNNER_TEMP/selected.json"
          Rscript -e 'x<-jsonlite::fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"selected.json"));stopifnot(x$w08_included_seeds==27726L,x$w01_canonical_records==79554L,identical(x$mode,"preflight_only"),!x$provider_calls_authorised)'
          if Rscript scripts/workflow08b/resolve_monthly_release.R docs/current_run/current_run_status.json docs/workflow08/zenodo_registry.csv docs/deduplication/zenodo 2026-11 "$RUNNER_TEMP/rejected.json"; then
            echo "ERROR: stale October release wrongly accepted for November"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/rejected.json"
          echo "PASS: October accepted, stale October snapshot rejected for November"
