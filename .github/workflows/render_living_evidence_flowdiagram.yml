name: Render Living Evidence Map flow diagram

on:
  push:
    branches:
      - restore-flowdiagram-add-agricola
    paths:
      - "outputs/workflow07/evidence_flowdiagram.svg"
      - ".github/workflows/render_living_evidence_flowdiagram.yml"
  workflow_dispatch:

jobs:
  package-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate SVG exists
        run: |
          test -s outputs/workflow07/evidence_flowdiagram.svg
          grep -q "AGRICOLA" outputs/workflow07/evidence_flowdiagram.svg
          grep -q "Web of Science Core Collection" outputs/workflow07/evidence_flowdiagram.svg

      - name: Upload SVG artifact
        uses: actions/upload-artifact@v4
        with:
          name: living-evidence-flowdiagram-svg
          path: outputs/workflow07/evidence_flowdiagram.svg
          if-no-files-found: error
