name: Temporary W04 prompt refinement script validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-refinement-r-validate.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse one-request refinement script
        shell: Rscript {0}
        run: |
          parse(file="scripts/updater/workflow_04_refine_prompt.R")
          x <- paste(readLines("scripts/updater/workflow_04_refine_prompt.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('max_tries=1',x,fixed=TRUE))
          stopifnot(grepl('w04-refinement-started-',x,fixed=TRUE))
          stopifnot(grepl('refusing a repeated paid call',x,fixed=TRUE))
          stopifnot(grepl('w04-refinement-response-',x,fixed=TRUE))
          cat("PASS W04 single-call workflow code parsing\n")
