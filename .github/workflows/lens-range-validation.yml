name: Lens range validation
on:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
      OVERLAP_DAYS: '30'
    steps:
      - uses: actions/checkout@v4
      - name: Test 30-day Lens incremental window
        run: python3 scripts/lens_weekly_harvest_v2.py
