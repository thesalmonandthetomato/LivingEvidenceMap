name: TEMP validate large EBSCO harvest recovery

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_validate_large_ebsco_recovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','xml2','jsonlite','digest'))

      - name: Parse patched harvester
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_00g_ebsco_ingestion.R')
          cat('PASS: patched EBSCO harvester parses\n')

      - name: Harvest MEDLINE completely
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00g_ebsco_ingestion.R \
            --source ebsco_medline \
            --query '((TI (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") OR AB (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout")) AND (TI (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*) OR AB (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*)))' \
            --config config/workflow00_ebsco_sources.json \
            --page-size 100 \
            --max-records all \
            --output-dir outputs/medline

      - name: Harvest Waters & Oceans completely
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00g_ebsco_ingestion.R \
            --source ebsco_waters_oceans \
            --query '((TI (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") OR AB (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") OR KW (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout")) AND (TI (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*) OR AB (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*) OR KW (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*)))' \
            --config config/workflow00_ebsco_sources.json \
            --page-size 100 \
            --max-records all \
            --output-dir outputs/waters

      - name: Assert complete unique harvests
        shell: Rscript {0}
        run: |
          library(jsonlite)
          check <- function(path, expect_undated=FALSE) {
            x <- fromJSON(path,simplifyVector=FALSE)
            stopifnot(x$status=='success')
            stopifnot(as.integer(x$records_retrieved)==as.integer(x$reported_total))
            stopifnot(x$retrieval_strategy == 'publication_year_partitions')
            stopifnot(length(x$year_partitions)>0L)
            types <- vapply(x$year_partitions,function(z) if(is.null(z$partition_type)) 'dated' else as.character(z$partition_type),character(1))
            if (expect_undated) stopifnot('undated' %in% types)
            cat(sprintf('%s reported=%d retrieved=%d strategy=%s partitions=%d undated=%s\n',x$source,x$reported_total,x$records_retrieved,x$retrieval_strategy,length(x$year_partitions),expect_undated))
          }
          check('outputs/medline/manifest.json',FALSE)
          check('outputs/waters/manifest.json',TRUE)
          cat('PASS: large EBSCO harvests are complete\n')
