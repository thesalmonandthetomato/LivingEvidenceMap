name: W04 completed-publication handover recovery
on:
  push:
    branches: [main]
    paths:
      - 'docs/screening/w04_completed_handover_requests/*.json'
permissions:
  contents: read
  actions: write
jobs:
  acknowledge-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies for batch status
        shell: Rscript {0}
        run: install.packages(c('googlesheets4','digest','jsonlite'))
      - name: Validate published W04 pointer and original queue
        env:
          SOURCE_ID: '38141909882'
          PUB_ID: '38144148329'
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/workflow04/zenodo/run-38141909882.json
          Rscript -e '
            x<-jsonlite::fromJSON("docs/workflow04/zenodo/run-38141909882.json",simplifyVector=FALSE)
            stopifnot(
              identical(as.character(x$source_github_run_id),"38141909882"),
              identical(as.character(x$publication_github_run_id),"38144148329"),
              as.integer(x$records)==4211L,
              as.integer(x$unresolved)==0L,
              grepl("^[a-f0-9]{64}$",x$workflow04_final_screening_layer_sha256)
            )
            cat("PASS: recovered W04 resolved publication pointer validated\n")
          '
      - name: Register W04 human review complete and consumed
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: ${{ secrets.LEM_TEST_GOOGLE_SHEET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service.json"
          chmod 600 "$RUNNER_TEMP/service.json"
          args=(--stage 04 --batch-id w04-resolution-38141909882-ebc4a3246d25
            --queue-sha256 ebc4a3246d25987f779607d120f86b1fd2dfdfb02a7f2a83ddef54f136e5212b
            --sheet-id "$LEM_GOOGLE_SHEET_ID" --credential "$RUNNER_TEMP/service.json"
            --workflow-run-id 38144148329 --source-run-id 38141909882)
          Rscript scripts/updater/workflow_shiny_batch_status.R "${args[@]}" \
            --status review_complete \
            --message "W04 human decisions applied; published W04 state validated."
          Rscript scripts/updater/workflow_shiny_batch_status.R "${args[@]}" \
            --status consumed \
            --output-sha256 b98f27f23c670327d516e5de695239f9b6480f847289643dd0eafbb4d27dcbef \
            --message "W04 complete, archived, and ready for W05."
      - name: Dispatch W05 from existing W04 Zenodo publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run workflow_05_production.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f first_run=true \
            -f workflow04_pointer_path=docs/workflow04/zenodo/run-38141909882.json \
            -f lean_pointer_path=docs/compaction/zenodo/run-38137694653.json \
            -f publish=true
          echo "PASS: W05 dispatched using existing W04 publication; no W04 screening repeated"
