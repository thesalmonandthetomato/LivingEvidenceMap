name: TEMP validate Workflow 02 human-review gate

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w02_human_review.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))

      - name: Validate zero-conflict and blocking-conflict paths
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/updater/workflow_02_build_human_review.R");cat("PASS: script parses\n")'
          rm -rf /tmp/w02gate && mkdir -p /tmp/w02gate

          printf '%s\n' '{"identity":{"record_id":"work-1"},"canonical":{"doi":"10.1/a","title":"Canonical title","abstract":null}}' > /tmp/w02gate/input.jsonl
          printf '%s\n' '{"record_id":"work-1","doi":"10.1/a","quarantined":[]}' > /tmp/w02gate/audit-zero.jsonl
          Rscript scripts/updater/workflow_02_build_human_review.R \
            --input /tmp/w02gate/input.jsonl \
            --audit /tmp/w02gate/audit-zero.jsonl \
            --output-dir /tmp/w02gate/zero \
            --status /tmp/w02gate/zero-status.json
          Rscript -e 'x<-jsonlite::fromJSON("/tmp/w02gate/zero-status.json");stopifnot(identical(x$requires_human_review,FALSE),x$blocking_cases==0)'

          printf '%s\n' '{"record_id":"work-1","doi":"10.1/a","europe_pmc":{"title":"Different title"},"scopus":null,"quarantined":[{"provider":"europe_pmc","field":"abstract","reason":"title_guard_failed","title_similarity":0.42}]}' > /tmp/w02gate/audit-one.jsonl
          Rscript scripts/updater/workflow_02_build_human_review.R \
            --input /tmp/w02gate/input.jsonl \
            --audit /tmp/w02gate/audit-one.jsonl \
            --output-dir /tmp/w02gate/one \
            --status /tmp/w02gate/one-status.json
          Rscript -e 'x<-jsonlite::fromJSON("/tmp/w02gate/one-status.json");stopifnot(identical(x$requires_human_review,TRUE),x$blocking_cases==1,x$blocking_conflicts==1);m<-jsonlite::fromJSON("/tmp/w02gate/one/workflow02_human_review_manifest.json");stopifnot(m$blocking_records==1,m$blocking_conflicts==1)'
          test -s /tmp/w02gate/one/workflow02_human_review.csv
          test -s /tmp/w02gate/one/workflow02_human_review.jsonl

          grep -q 'Build Workflow 02 human-review package' .github/workflows/workflow_02_production.yml
          grep -q 'Upload Workflow 02 human-review package' .github/workflows/workflow_02_production.yml
          grep -q 'Stop for Workflow 02 human adjudication' .github/workflows/workflow_02_production.yml
          echo 'PASS: Workflow 02 human-review gate validated'
