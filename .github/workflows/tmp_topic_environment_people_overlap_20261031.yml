name: TEMP W08 topic intersection audit
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_topic_environment_people_overlap_20261031.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("jsonlite","httr2","digest"))'
      - name: Restore authoritative W08 canonical
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript -e 'r<-read.csv("docs/workflow08/zenodo_registry.csv", stringsAsFactors=FALSE);s<-r[r$status=="authoritative",];stopifnot(nrow(s)==1);writeLines(paste0("docs/workflow08/zenodo/run-",s$source_run_id,".json"),"audit_pointer.txt")'
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R --pointer "$(cat audit_pointer.txt)" --output "$RUNNER_TEMP/canonical.jsonl"
      - name: Count unique records in both top-level categories
        shell: Rscript {0}
        run: |
          library(jsonlite)
          path<-file.path(Sys.getenv("RUNNER_TEMP"),"canonical.jsonl")
          pointer<-fromJSON(readLines("audit_pointer.txt")[[1]],simplifyVector=FALSE)
          f<-file(path,"rt");on.exit(close(f),add=TRUE)
          n<-0L;env<-0L;people<-0L;both<-0L
          ids<-new.env(hash=TRUE,parent=emptyenv())
          repeat{
            lines<-readLines(f,n=500L,warn=FALSE)
            if(!length(lines))break
            for(line in lines){
              if(!nzchar(trimws(line)))next
              x<-fromJSON(line,simplifyVector=FALSE)
              id<-as.character(x$identity$record_id)
              if(!nzchar(id)||exists(id,envir=ids,inherits=FALSE))stop("Duplicate or missing record ID")
              assign(id,TRUE,envir=ids)
              a<-x$topics$assignments
              paths<-if(is.null(a)||!length(a))character() else vapply(a,function(z){
                p<-z$hierarchy_path
                if(is.null(p)||!length(p))"" else trimws(as.character(p[[1]]))
              },character(1))
              top<-unique(trimws(sub("[[:space:]]*>.*$","",paths)))
              has_environment<-"Environment"%in%top
              has_people<-"People and society"%in%top
              n<-n+1L
              env<-env+as.integer(has_environment)
              people<-people+as.integer(has_people)
              both<-both+as.integer(has_environment&&has_people)
            }
          }
          stopifnot(n==as.integer(pointer$canonical_records))
          result<-list(canonical_records=n,environment_records=env,
            people_and_society_records=people,both_categories=both,
            union_records=env+people-both,
            agrees_with_published_top_level_counts=(env==3929L && people==911L),
            canonical_sha256=pointer$final_canonical_jsonl_sha256)
          writeLines(toJSON(result,auto_unbox=TRUE,pretty=TRUE),"topic_overlap_count.json")
          cat("TOPIC_INTERSECTION_RESULT\n")
          cat(readLines("topic_overlap_count.json"),sep="\n")
      - uses: actions/upload-artifact@v4
        with:
          name: topic-environment-people-intersection
          path: topic_overlap_count.json
          retention-days: 7
          if-no-files-found: error
