name: W01 temporary integration regression
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w01-temporary-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest"))
      - name: Create synthetic deduplication and review fixtures
        shell: Rscript {0}
        run: |
          library(data.table)
          library(jsonlite)
          t <- file.path(Sys.getenv("RUNNER_TEMP"),"w01-integration")
          dir.create(t,recursive=TRUE)
          writeLines(t,"testpath.txt")
          meta <- data.table(idx=1:3,source=c("alpha","beta","gamma"),source_record_id=c("a1","b1","c1"))
          fwrite(meta,file.path(t,"meta.csv"))
          pairs <- data.table(pair_key=c("1::2","2::3"),record_i=c(1L,2L),record_j=c(2L,3L),
            rescored_classification=c("review","not_duplicate"),rescored_rule=c("manual_pending","safe_rule"),
            review_route=c("manual_review","resolved"))
          fwrite(pairs,file.path(t,"pairs.csv"))
          writeLines(toJSON(list(resume_allowed=TRUE,active_decisions=1L),auto_unbox=TRUE),file.path(t,"integrity.json"))
          llm <- list(review_case_id="case-1",pair_key="1::2",promotion="human_review",
                      model_decision="duplicate",model_confidence=0.6,model_rationale="ambiguous")
          writeLines(toJSON(llm,auto_unbox=TRUE,null="null"),file.path(t,"llm.jsonl"))
          human <- list(review_case_id="case-1",decision="duplicate",rationale="same work")
          writeLines(toJSON(human,auto_unbox=TRUE),file.path(t,"human.jsonl"))
          writeLines("",file.path(t,"empty.jsonl"))
          fwrite(data.table(source="alpha",source_record_id="a1",cluster_id="old-a"),
                 file.path(t,"previous.csv"))
      - name: Run real finalisation and simulated human review
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat testpath.txt)"
          Rscript scripts/updater/workflow_01_apply_adjudications_and_recluster.R \
            --combined-decisions "$T/pairs.csv" --manifestation-map "$T/meta.csv" \
            --llm-adjudications "$T/llm.jsonl" --human-decisions "$T/human.jsonl" \
            --human-integrity-manifest "$T/integrity.json" \
            --previous-cluster-map "$T/previous.csv" --output-dir "$T/final"
          Rscript -e 'library(data.table);x<-fread(commandArgs(TRUE)[1]);p<-fread(commandArgs(TRUE)[2]);stopifnot(nrow(x)==3L,x$cluster_id[1]==x$cluster_id[2],x$cluster_id[1]!=x$cluster_id[3],x$cluster_id[1]=="old-a",p$rescored_rule[p$pair_key=="1::2"]=="workflow01_human_adjudication")' "$T/final/manifestation_cluster_map.csv" "$T/final/final_pair_decisions.csv"
          echo "PASS: human decision applied, distinct work separate, historic ID preserved"
      - name: Missing human decisions must block resumption
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat testpath.txt)"
          if Rscript scripts/updater/workflow_01_apply_adjudications_and_recluster.R \
            --combined-decisions "$T/pairs.csv" --manifestation-map "$T/meta.csv" \
            --llm-adjudications "$T/llm.jsonl" --human-decisions "$T/empty.jsonl" \
            --human-integrity-manifest "$T/integrity.json" --output-dir "$T/unsafe"; then
            echo "FAIL: missing human adjudication was accepted"; exit 1
          fi
          echo "PASS: missing human decision rejected"
      - name: Changed historical source must block delta generation
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat testpath.txt)"
          mkdir -p "$T/old/workflow01_seed" "$T/currentseed" "$T/delta"
          printf '{"id":"old"}\n' > "$T/old/workflow01_seed/alpha_records_for_deduplication.jsonl"
          printf '{"id":"CHANGED"}\n' > "$T/currentseed/alpha_records_for_deduplication.jsonl"
          printf '{"status":"published","state":"final"}' > "$T/prevpointer.json"
          printf '{}' > "$T/canonicalmanifest.json"
          : > "$T/canonical.jsonl"
          if Rscript scripts/updater/workflow_01_build_delta.R \
            --previous-root "$T/old" --current-seed-root "$T/currentseed" \
            --current-final-root "$T/final" --current-canonical "$T/canonical.jsonl" \
            --current-canonical-manifest "$T/canonicalmanifest.json" \
            --previous-pointer "$T/prevpointer.json" --output-dir "$T/delta" --run-id test; then
            echo "FAIL: altered historical source accepted"; exit 1
          fi
          echo "PASS: altered historical input rejected"
