name: Deploy temporary dashboard preview

on:
  push:
    branches: [main]
    paths:
      - "docs/dashboard-redesign-temp.html"
      - "config/dashboard_redesign_manifest.json"
      - "scripts/validate_dashboard_redesign.py"
      - "scripts/promote_dashboard_redesign.py"
      - "data/master/current/living_evidence_map_master CORRECTED.csv"
      - ".github/workflows/temp-dashboard-preview-deploy.yml"
      - "scripts/build_dashboard.py"
      - "scripts/enforce_v3_dashboard_topics.py"
      - "scripts/augment_dashboard_citations.py"
      - "scripts/normalise_dashboard_data.py"
      - "scripts/augment_dashboard_data.py"
      - "scripts/patch_dashboard_feedback_data.py"
      - "scripts/augment_dashboard_update_metrics.py"
      - "scripts/patch_dashboard_update_status.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preserve production dashboard files
        run: |
          cp docs/dashboard.json /tmp/production-dashboard.json

      - name: Use corrected master for preview data only
        run: |
          test -f "data/master/current/living_evidence_map_master CORRECTED.csv"
          cp "data/master/current/living_evidence_map_master CORRECTED.csv" data/master/current/living_evidence_map_master.csv

      - name: Build preview data through current dashboard pipeline
        run: |
          python scripts/build_dashboard.py
          python scripts/enforce_v3_dashboard_topics.py
          python scripts/augment_dashboard_citations.py
          python scripts/normalise_dashboard_data.py
          python scripts/augment_dashboard_data.py
          python scripts/patch_dashboard_feedback_data.py
          python scripts/augment_dashboard_update_metrics.py
          python scripts/validate_dashboard_data.py

      - name: Save corrected preview data and restore production data
        run: |
          cp docs/dashboard.json docs/dashboard-redesign-temp.json
          cp /tmp/production-dashboard.json docs/dashboard.json

      - name: Reproduce current production status text
        run: python scripts/patch_dashboard_update_status.py

      - name: Validate temporary dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('docs/dashboard-redesign-temp.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          Path('/tmp/temp-dashboard.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/temp-dashboard.js

      - name: Validate dashboard redesign contract
        run: python scripts/validate_dashboard_redesign.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
