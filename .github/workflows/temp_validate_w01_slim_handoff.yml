name: Validate W01 slim stage handoffs
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/temp_validate_w01_slim_handoff.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install YAML reader
        shell: Rscript {0}
        run: install.packages("yaml")
      - name: Validate transfer manifests and stage requirements
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/validate_slim_handoffs.R
