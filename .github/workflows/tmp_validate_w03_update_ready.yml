name: Temporary - validate W03 living-update readiness

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'user_input/w03_update_readiness_validation.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install validation dependency
        shell: Rscript {0}
        run: install.packages('yaml')

      - name: Validate Workflow 03 production architecture
        shell: Rscript {0}
        run: |
          yaml::read_yaml('.github/workflows/workflow_03_production.yml')
          parse(file='scripts/updater/workflow_03_restore_lean_checkpoint.R')
          parse(file='scripts/updater/workflow_03_publication_status.R')
          parse(file='scripts/updater/workflow_03_archive_state_to_zenodo.R')

          files <- c(
            '.github/workflows/workflow_03_production.yml',
            'scripts/updater/workflow_03_restore_lean_checkpoint.R',
            'scripts/updater/workflow_03_archive_state_to_zenodo.R',
            'scripts/updater/workflow_03_publication_status.R'
          )
          txt <- paste(vapply(files,function(p)paste(readLines(p,warn=FALSE),collapse='\n'),character(1)),collapse='\n')
          stopifnot(!grepl('32292|32,292',txt,perl=TRUE))

          y <- paste(readLines('.github/workflows/workflow_03_production.yml',warn=FALSE),collapse='\n')
          stopifnot(
            grepl('EXPECTED_RECORDS',y,fixed=TRUE),
            grepl('--expected-records',y,fixed=TRUE)
          )

          r <- paste(readLines('scripts/updater/workflow_03_restore_lean_checkpoint.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('expected_records',r,fixed=TRUE))

          a <- paste(readLines('scripts/updater/workflow_03_archive_state_to_zenodo.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('--expected-records',a,fixed=TRUE))

          cat('PASS: W03 living-update readiness validation\n')
