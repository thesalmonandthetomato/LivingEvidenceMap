name: Temporary W00 all-API count
on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/_tmp_w00_all_api_count.yml'

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      search_version: ${{ steps.matrix.outputs.search_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')
      - name: Build all-source search plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/tmp_all_api
          Rscript scripts/updater/workflow_00_search_orchestrator.R \
            --run-type full \
            --config user_input/workflow00_search_strategy.json \
            --output-dir outputs/tmp_all_api
      - name: Export all API sources
        id: matrix
        shell: Rscript {0}
        run: |
          library(jsonlite)
          p <- fromJSON('outputs/tmp_all_api/search_plan.json',simplifyVector=FALSE)
          q <- p$source_queries
          sources <- names(q)
          m <- lapply(sources,function(s) list(source=s,query=q[[s]]))
          cat('matrix<<EOF\n',file=Sys.getenv('GITHUB_OUTPUT'),append=TRUE)
          cat(toJSON(m,auto_unbox=TRUE,null='null'),file=Sys.getenv('GITHUB_OUTPUT'),append=TRUE)
          cat('\nEOF\n',file=Sys.getenv('GITHUB_OUTPUT'),append=TRUE)
          cat(sprintf('search_version=%s\n',p$search_version),file=Sys.getenv('GITHUB_OUTPUT'),append=TRUE)
          cat(sprintf('Planning %d API sources: %s\n',length(sources),paste(sources,collapse=', ')))

  search:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
    with:
      source: ${{ matrix.source }}
      run_type: full
      query: ${{ matrix.query }}
      parent_run_id: ${{ github.run_id }}
      search_version: ${{ needs.plan.outputs.search_version }}
      fortnightly_from_date: ''
      fortnightly_to_date: ''
      additional_search_term: ''
    secrets: inherit
