name: Lens diagnostic harvest

on:
  workflow_dispatch:
    inputs:
      lens_from:
        description: 'Lens diagnostic window start (ISO 8601 UTC)'
        required: true
        type: string
      lens_to:
        description: 'Lens diagnostic window end (ISO 8601 UTC)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run non-mutating Lens diagnostic
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: python3 scripts/lens_diagnostic_harvest.py '${{ inputs.lens_from }}' '${{ inputs.lens_to }}'

      - name: Upload diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: lens-diagnostic-${{ inputs.lens_from }}-${{ inputs.lens_to }}
          path: outputs/lens_diagnostic/
          retention-days: 30
