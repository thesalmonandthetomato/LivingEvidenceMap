name: Test updater Workflow 03 - adjudication

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send one real review notification email'
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updater-workflow-03-adjudication

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Prepare candidate fixture
        run: |
          mkdir -p testdata/workflow03
          cat > testdata/workflow03/candidates.jsonl <<'EOF'
          {"candidate_id":"c1","incoming_record_id":"lens-001","matched_master_record_id":"master-001","duplicate_basis":"doi_conflict_review","title_similarity":0.91,"incoming_title":"A trial of tomato screening","matched_master_title":"A trial of tomato screening","incoming_year":2020,"matched_master_year":2020,"incoming_first_author":"Smith","matched_master_first_author":"Smith","incoming_doi":"10.1000/example-wrong","matched_master_doi":"10.1000/example-correct"}
          {"candidate_id":"c2","incoming_record_id":"lens-002","matched_master_record_id":"master-002","duplicate_basis":"possible_duplicate","title_similarity":0.88,"incoming_title":"Evidence synthesis of tomato production","matched_master_title":"Evidence synthesis of tomato production methods","incoming_year":2021,"matched_master_year":2021,"incoming_first_author":"Jones","matched_master_first_author":"Jones","incoming_doi":"10.1000/example2","matched_master_doi":"10.1000/example2"}
          EOF

      - name: Run Workflow 03 real OpenAI adjudication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/updater/adjudicate_jsonl.py --input testdata/workflow03/candidates.jsonl --output testdata/workflow03/decisions_api.jsonl --audit testdata/workflow03/audit_api.jsonl --mode openai --model gpt-5-mini

      - name: Run promotion gate
        run: |
          python3 scripts/updater/promote_adjudication.py --input testdata/workflow03/decisions_api.jsonl --output testdata/workflow03/promoted_api.jsonl --threshold 0.80

      - name: Test promotion gate failure states
        run: |
          cat > testdata/workflow03/promotion_edge_cases.jsonl <<'EOF'
          {"candidate_id":"u1","decision":"uncertain","confidence":0.99,"rationale":"Conflicting evidence"}
          {"candidate_id":"u2","decision":"duplicate","confidence":0.79,"rationale":"Below threshold"}
          {"candidate_id":"u3","decision":"not_duplicate","confidence":0.90,"rationale":"Technical test","adjudication_error":"TimeoutError: simulated"}
          {"candidate_id":"u4","decision":"bogus","confidence":0.99,"rationale":"Invalid decision"}
          EOF
          python3 scripts/updater/promote_adjudication.py --input testdata/workflow03/promotion_edge_cases.jsonl --output testdata/workflow03/promotion_edge_results.jsonl --threshold 0.80

      - name: Prepare realistic human review cases
        run: |
          cat > testdata/workflow03/review_input.jsonl <<'EOF'
          {"candidate_id":"review-001","incoming_record_id":"lens-review-001","matched_master_record_id":"master-review-001","duplicate_basis":"doi_conflict_review","title_similarity":0.97,"incoming_title":"Effects of dietary composition on growth performance of Atlantic salmon","matched_master_title":"Effects of dietary composition on growth performance in Atlantic salmon","incoming_year":2022,"matched_master_year":2022,"incoming_first_author":"Andersen","matched_master_first_author":"Andersen","incoming_doi":"10.1000/salmon.2022.a","matched_master_doi":"10.1000/salmon.2022.b","decision":"uncertain","confidence":0.94,"rationale":"Title, author and year strongly agree, but the DOI conflict prevents a confident automated decision.","promotion":"human_review","promotion_reason":"model_uncertain","promotion_threshold":0.80}
          {"candidate_id":"review-002","incoming_record_id":"lens-review-002","matched_master_record_id":"master-review-002","duplicate_basis":"possible_duplicate","title_similarity":0.89,"incoming_title":"Sea lice infestation and treatment outcomes in farmed Atlantic salmon","matched_master_title":"Sea lice infestation and treatment in Atlantic salmon aquaculture","incoming_year":2021,"matched_master_year":2020,"incoming_first_author":"MacLeod","matched_master_first_author":"MacLeod","incoming_doi":"10.1000/lice.2021.17","matched_master_doi":"10.1000/lice.2020.44","decision":"not_duplicate","confidence":0.73,"rationale":"The titles and first author are similar, but publication year and DOI differ, leaving insufficient confidence for automatic promotion.","promotion":"human_review","promotion_reason":"below_confidence_threshold","promotion_threshold":0.80}
          EOF
          python3 scripts/updater/build_human_review_queue.py --input testdata/workflow03/review_input.jsonl --output testdata/workflow03/human_review_queue.jsonl

      - name: Build review package and notification state
        run: |
          python3 scripts/updater/build_review_package.py --input testdata/workflow03/human_review_queue.jsonl --outdir testdata/workflow03/review_package
          python3 scripts/updater/build_notification_state.py --input testdata/workflow03/human_review_queue.jsonl --output testdata/workflow03/review_package/notification_state.json
          python3 scripts/updater/build_notification_state.py --input testdata/workflow03/human_review_queue.jsonl --output testdata/workflow03/review_package/notification_state_repeat.json

      - name: Resolve one human review case
        run: |
          head -n 1 testdata/workflow03/human_review_queue.jsonl > testdata/workflow03/one_review_case.jsonl
          python3 scripts/updater/resolve_human_review.py --input testdata/workflow03/one_review_case.jsonl --output testdata/workflow03/resolved_case.jsonl --decision not_duplicate --rationale 'Human review confirms the records are distinct publications.' --reviewer 'nealhaddaway'

      - name: Validate lifecycle and bibliographic review package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          queue=[json.loads(x) for x in Path('testdata/workflow03/human_review_queue.jsonl').read_text().splitlines() if x.strip()]
          resolved=[json.loads(x) for x in Path('testdata/workflow03/resolved_case.jsonl').read_text().splitlines() if x.strip()]
          package=Path('testdata/workflow03/review_package')
          manifest=json.loads((package/'review_manifest.json').read_text())
          state=json.loads((package/'notification_state.json').read_text())
          repeat=json.loads((package/'notification_state_repeat.json').read_text())
          assert len(queue)==2
          assert manifest['pending_count']==2 and len(manifest['cases'])==2
          assert state['pending_count']==2 and state['should_notify'] is True
          assert state['notification_fingerprint']==repeat['notification_fingerprint']
          assert len(state['notification_fingerprint'])==64
          required=['incoming_record_id','matched_master_record_id','incoming_title','matched_master_title','incoming_year','matched_master_year','incoming_first_author','matched_master_first_author','incoming_doi','matched_master_doi','duplicate_basis','title_similarity','model_decision','model_confidence','model_rationale','promotion_reason']
          for case in queue:
              for field in required:
                  assert case.get(field) is not None and case.get(field) != '', f'Blank review field {field} in {case["review_case_id"]}'
          assert (package/'email_body.txt').exists() and (package/'index.html').exists()
          for c in manifest['cases']:
              prompt=(package/c['prompt_file']).read_text()
              assert 'Incoming title: None' not in prompt
              assert 'Matched title: None' not in prompt
              assert 'Incoming DOI: None' not in prompt
              assert 'Matched DOI: None' not in prompt
          html=(package/'index.html').read_text()
          assert 'Effects of dietary composition on growth performance of Atlantic salmon' in html
          assert 'Sea lice infestation and treatment outcomes in farmed Atlantic salmon' in html
          assert resolved[0]['status']=='resolved'
          print('Workflow 03 lifecycle and complete bibliographic review package passed')
          PY

      - name: Upload review artefact
        id: upload_review
        uses: actions/upload-artifact@v4
        with:
          name: workflow03-human-review-interface-test
          path: testdata/workflow03/

      - name: Build and validate notification payload with direct artefact link
        env:
          REVIEW_ARTIFACT_URL: ${{ steps.upload_review.outputs.artifact-url }}
        run: |
          python3 scripts/updater/build_notification_payload.py --manifest testdata/workflow03/review_package/review_manifest.json --output testdata/workflow03/review_package/notification_payload.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          package=Path('testdata/workflow03/review_package')
          state=json.loads((package/'notification_state.json').read_text())
          payload=json.loads((package/'notification_payload.json').read_text())
          assert payload['recipient']=='nealhaddaway@gmail.com'
          assert payload['pending_count']==2
          assert payload['queue_fingerprint']==state['notification_fingerprint']
          assert payload['review_case_ids']==sorted(state['pending_review_case_ids'])
          assert payload['github_run_url'].endswith(os.environ['GITHUB_RUN_ID'])
          assert payload['chatgpt_url']=='https://chatgpt.com/'
          assert payload['review_artifact_url']==os.environ['REVIEW_ARTIFACT_URL']
          assert '/artifacts/' in payload['review_artifact_url']
          assert 'Download review package:' in payload['body_text']
          assert payload['review_artifact_url'] in payload['body_text']
          assert payload['send_policy']['deduplicate_on_queue_fingerprint'] is True
          print('Workflow 03 direct artefact notification payload passed')
          PY

      - name: Send one real SMTP notification
        if: ${{ inputs.send_email }}
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python3 scripts/updater/send_review_email.py --payload testdata/workflow03/review_package/notification_payload.json
