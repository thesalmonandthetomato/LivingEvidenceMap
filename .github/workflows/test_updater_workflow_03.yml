name: Test updater Workflow 03 - adjudication

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updater-workflow-03-adjudication

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Prepare candidate fixture
        run: |
          mkdir -p testdata/workflow03
          cat > testdata/workflow03/candidates.jsonl <<'EOF'
          {"candidate_id":"c1","incoming_record_id":"lens-001","matched_master_record_id":"master-001","duplicate_basis":"doi_conflict_review","title_similarity":0.91,"incoming_title":"A trial of tomato screening","matched_master_title":"A trial of tomato screening","incoming_year":2020,"matched_master_year":2020,"incoming_first_author":"Smith","matched_master_first_author":"Smith","incoming_doi":"10.1000/example-wrong","matched_master_doi":"10.1000/example-correct"}
          {"candidate_id":"c2","incoming_record_id":"lens-002","matched_master_record_id":"master-002","duplicate_basis":"possible_duplicate","title_similarity":0.88,"incoming_title":"Evidence synthesis of tomato production","matched_master_title":"Evidence synthesis of tomato production methods","incoming_year":2021,"matched_master_year":2021,"incoming_first_author":"Jones","matched_master_first_author":"Jones","incoming_doi":"10.1000/example2","matched_master_doi":"10.1000/example2"}
          EOF

      - name: Run Workflow 03 mock adjudication
        run: |
          python3 scripts/updater/adjudicate_jsonl.py \
            --input testdata/workflow03/candidates.jsonl \
            --output testdata/workflow03/decisions_mock.jsonl \
            --audit testdata/workflow03/audit_mock.jsonl \
            --mode mock

      - name: Run Workflow 03 real OpenAI adjudication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/updater/adjudicate_jsonl.py \
            --input testdata/workflow03/candidates.jsonl \
            --output testdata/workflow03/decisions_api.jsonl \
            --audit testdata/workflow03/audit_api.jsonl \
            --mode openai \
            --model gpt-5-mini

      - name: Run promotion gate on real API results
        run: |
          python3 scripts/updater/promote_adjudication.py \
            --input testdata/workflow03/decisions_api.jsonl \
            --output testdata/workflow03/promoted_api.jsonl \
            --threshold 0.80

      - name: Test promotion gate failure states
        run: |
          cat > testdata/workflow03/promotion_edge_cases.jsonl <<'EOF'
          {"candidate_id":"u1","decision":"uncertain","confidence":0.99,"rationale":"Conflicting evidence"}
          {"candidate_id":"u2","decision":"duplicate","confidence":0.79,"rationale":"Below threshold"}
          {"candidate_id":"u3","decision":"not_duplicate","confidence":0.90,"rationale":"Technical test","adjudication_error":"TimeoutError: simulated"}
          {"candidate_id":"u4","decision":"bogus","confidence":0.99,"rationale":"Invalid decision"}
          EOF
          python3 scripts/updater/promote_adjudication.py \
            --input testdata/workflow03/promotion_edge_cases.jsonl \
            --output testdata/workflow03/promotion_edge_results.jsonl \
            --threshold 0.80

      - name: Validate adjudication and all promotion safety states
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          decisions = [json.loads(x) for x in Path('testdata/workflow03/decisions_api.jsonl').read_text().splitlines() if x.strip()]
          promotions = [json.loads(x) for x in Path('testdata/workflow03/promoted_api.jsonl').read_text().splitlines() if x.strip()]
          edge = [json.loads(x) for x in Path('testdata/workflow03/promotion_edge_results.jsonl').read_text().splitlines() if x.strip()]
          assert len(decisions) == len(promotions) == 2
          assert all(d['decision'] in {'duplicate','not_duplicate','uncertain'} for d in decisions)
          assert all(0 <= d['confidence'] <= 1 for d in decisions)
          assert all(d['rationale'] for d in decisions)
          assert all(not d.get('adjudication_error') for d in decisions)
          assert [r['promotion'] for r in edge] == ['human_review','human_review','human_review','human_review']
          reasons = [r['promotion_reason'] for r in edge]
          assert reasons == ['model_uncertain','below_confidence_threshold','technical_failure','invalid_decision']
          print('Workflow 03 adjudication and promotion safety validation passed')
          PY

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow03-adjudication-promotion-test
          path: testdata/workflow03/
