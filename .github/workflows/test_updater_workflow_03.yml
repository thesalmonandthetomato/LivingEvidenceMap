name: Test updater Workflow 03 - adjudication

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updater-workflow-03-adjudication

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Prepare candidate fixture
        run: |
          mkdir -p testdata/workflow03
          cat > testdata/workflow03/candidates.jsonl <<'EOF'
          {"candidate_id":"c1","incoming_record_id":"lens-001","matched_master_record_id":"master-001","duplicate_basis":"doi_conflict_review","title_similarity":0.91,"incoming_title":"A trial of tomato screening","matched_master_title":"A trial of tomato screening","incoming_year":2020,"matched_master_year":2020,"incoming_first_author":"Smith","matched_master_first_author":"Smith","incoming_doi":"10.1000/example-wrong","matched_master_doi":"10.1000/example-correct"}
          {"candidate_id":"c2","incoming_record_id":"lens-002","matched_master_record_id":"master-002","duplicate_basis":"possible_duplicate","title_similarity":0.88,"incoming_title":"Evidence synthesis of tomato production","matched_master_title":"Evidence synthesis of tomato production methods","incoming_year":2021,"matched_master_year":2021,"incoming_first_author":"Jones","matched_master_first_author":"Jones","incoming_doi":"10.1000/example2","matched_master_doi":"10.1000/example2"}
          EOF

      - name: Run Workflow 03 real OpenAI adjudication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/updater/adjudicate_jsonl.py --input testdata/workflow03/candidates.jsonl --output testdata/workflow03/decisions_api.jsonl --audit testdata/workflow03/audit_api.jsonl --mode openai --model gpt-5-mini

      - name: Run promotion gate
        run: |
          python3 scripts/updater/promote_adjudication.py --input testdata/workflow03/decisions_api.jsonl --output testdata/workflow03/promoted_api.jsonl --threshold 0.80

      - name: Test promotion gate failure states
        run: |
          cat > testdata/workflow03/promotion_edge_cases.jsonl <<'EOF'
          {"candidate_id":"u1","decision":"uncertain","confidence":0.99,"rationale":"Conflicting evidence"}
          {"candidate_id":"u2","decision":"duplicate","confidence":0.79,"rationale":"Below threshold"}
          {"candidate_id":"u3","decision":"not_duplicate","confidence":0.90,"rationale":"Technical test","adjudication_error":"TimeoutError: simulated"}
          {"candidate_id":"u4","decision":"bogus","confidence":0.99,"rationale":"Invalid decision"}
          EOF
          python3 scripts/updater/promote_adjudication.py --input testdata/workflow03/promotion_edge_cases.jsonl --output testdata/workflow03/promotion_edge_results.jsonl --threshold 0.80

      - name: Build human review queue
        run: |
          cat testdata/workflow03/promotion_edge_results.jsonl > testdata/workflow03/review_input.jsonl
          python3 scripts/updater/build_human_review_queue.py --input testdata/workflow03/review_input.jsonl --output testdata/workflow03/human_review_queue.jsonl

      - name: Build review notification package
        run: |
          python3 scripts/updater/build_review_package.py --input testdata/workflow03/human_review_queue.jsonl --outdir testdata/workflow03/review_package
          python3 scripts/updater/build_notification_state.py --input testdata/workflow03/human_review_queue.jsonl --output testdata/workflow03/review_package/notification_state.json
          python3 scripts/updater/build_notification_state.py --input testdata/workflow03/human_review_queue.jsonl --output testdata/workflow03/review_package/notification_state_repeat.json

      - name: Resolve one human review case
        run: |
          head -n 1 testdata/workflow03/human_review_queue.jsonl > testdata/workflow03/one_review_case.jsonl
          python3 scripts/updater/resolve_human_review.py --input testdata/workflow03/one_review_case.jsonl --output testdata/workflow03/resolved_case.jsonl --decision not_duplicate --rationale 'Human review confirms the records are distinct publications.' --reviewer 'nealhaddaway'

      - name: Validate lifecycle, review package and notification state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          queue=[json.loads(x) for x in Path('testdata/workflow03/human_review_queue.jsonl').read_text().splitlines() if x.strip()]
          resolved=[json.loads(x) for x in Path('testdata/workflow03/resolved_case.jsonl').read_text().splitlines() if x.strip()]
          package=Path('testdata/workflow03/review_package')
          manifest=json.loads((package/'review_manifest.json').read_text())
          state=json.loads((package/'notification_state.json').read_text())
          repeat=json.loads((package/'notification_state_repeat.json').read_text())
          assert len(queue)==4
          assert manifest['pending_count']==4 and len(manifest['cases'])==4
          assert state['pending_count']==4 and state['should_notify'] is True
          assert state['notification_fingerprint']==repeat['notification_fingerprint']
          assert state['pending_review_case_ids']==repeat['pending_review_case_ids']
          assert len(state['notification_fingerprint'])==64
          assert (package/'email_body.txt').exists() and (package/'index.html').exists()
          assert all((package/c['prompt_file']).exists() for c in manifest['cases'])
          html=(package/'index.html').read_text()
          assert html.count('Copy case prompt')==4 and html.count('Open ChatGPT')==4
          assert resolved[0]['status']=='resolved'
          print('Workflow 03 review package, lifecycle and notification state passed')
          PY

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow03-human-review-interface-test
          path: testdata/workflow03/
