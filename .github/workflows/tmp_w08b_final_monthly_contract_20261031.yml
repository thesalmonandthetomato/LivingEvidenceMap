name: TEMP W08b final monthly multi-ID integration tests
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_final_monthly_contract_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: R dependencies
        run: Rscript -e 'install.packages(c("jsonlite","httr2"))'
      - name: All three live retrieval scripts parse
        shell: Rscript {0}
        run: |
          for(x in c("run_lens_bulk_manifest.R","run_openalex_manifest.R",
            "resolve_lens_doi_manifest.R","merge_monthly_edges.R",
            "expand_seed_identifiers.R","monthly_candidate_delta.R"))
            stopifnot(is.expression(parse(file=file.path("scripts/workflow08b",x))))
          cat("PASS: all six R scripts parse\n")
      - name: Verify multi-ID expansion, provenance, historical union and novelty delta
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("test_w08b")
          d<-data.frame(record_id=c("work1","work2"),lens_id=c("L1|L2","L1"),
            openalex_id=c("W1|W2","W3"),doi=c("10.1/a|10.1/b","10.1/c"))
          write.csv(d,"test_w08b/cross.csv",row.names=FALSE)
          run<-function(script,args){
            result<-system2("Rscript",c(file.path("scripts/workflow08b",script),args))
            stopifnot(result==0L)
          }
          run("expand_seed_identifiers.R",c("test_w08b/cross.csv","test_w08b/expanded"))
          q<-read.csv("test_w08b/expanded/seed_identifier_queries.csv",stringsAsFactors=FALSE)
          u<-read.csv("test_w08b/expanded/unique_identifier_queries.csv",stringsAsFactors=FALSE)
          stopifnot(nrow(q)==9L,nrow(u)==8L,
            sum(q$query_identifier=="L1")==2L,
            sum(q$seed_record_id=="work1")==6L)
          records<-list(
            list(seed_record_id="work1",provider="lens",queried_seed_identifier="L1",
              backward_ids=c("C1","C2"),forward_ids=c("C3")),
            list(seed_record_id="work1",provider="lens",queried_seed_identifier="L2",
              backward_ids=c("C2","C4"),forward_ids=c("C3","C5")),
            list(seed_record_id="work2",provider="lens",queried_seed_identifier="L1",
              backward_ids=c("C1","C2"),forward_ids=c("C3")))
          writeLines(vapply(records,function(x)toJSON(x,auto_unbox=TRUE),character(1)),
            "test_w08b/edges.jsonl")
          run("merge_edges.R",c("test_w08b/edges.jsonl","test_w08b/current"))
          e<-read.csv("test_w08b/current/citation_edges.csv")
          p<-read.csv("test_w08b/current/citation_edge_query_provenance.csv")
          stopifnot(nrow(e)==8L,nrow(p)==10L,
            nrow(e[e$seed_record_id=="work1" & e$related_provider_id=="C2",])==1L,
            nrow(p[p$seed_record_id=="work1" & p$related_provider_id=="C2",])==2L)
          old<-data.frame(seed_record_id=c("work1","work1"),
            provider=c("lens","openalex"),related_provider_id=c("C0","W9"),
            direction=c("backward","both"))
          write.csv(old,"test_w08b/prior.csv",row.names=FALSE)
          run("merge_monthly_edges.R",c("test_w08b/prior.csv",
            "test_w08b/current/citation_edges.csv","test_w08b/union"))
          s<-fromJSON("test_w08b/union/summary.json")
          stopifnot(s$no_historical_edges_dropped,
            s$prior_direction_edges==3L,
            s$new_direction_edges==8L,s$cumulative_direction_edges==11L)
          previous_candidates<-data.frame(provider=c("lens","openalex"),
            related_provider_id=c("C0","W9"))
          write.csv(previous_candidates,"test_w08b/previous_candidates.csv",row.names=FALSE)
          run("monthly_candidate_delta.R",c(
            "test_w08b/union/citation_edges.csv",
            "test_w08b/previous_candidates.csv","test_w08b/delta"))
          z<-fromJSON("test_w08b/delta/summary.json")
          stopifnot(z$historical_provider_candidates==2L,
            z$new_provider_candidates==5L,z$cumulative_provider_candidates==7L)
          cat("PASS: all identifiers retained, citation duplicates unioned, history lossless, delta correct\n")
