name: W08b export completed human deduplication decisions
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [docs/workflow08b/.run_export_decisions]
  workflow_dispatch:
    inputs:
      batch_id:
        description: Exact W08b review batch identity
        required: true
        type: string
      queue_sha256:
        description: Exact immutable review queue SHA-256
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: w08b-decision-export-${{ inputs.queue_sha256 }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("googlesheets4","jsonlite","digest","httr2"))'
      - name: Resolve export identity
        env:
          INPUT_BATCH_ID: ${{ inputs.batch_id }}
          INPUT_QUEUE_SHA: ${{ inputs.queue_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            Rscript -e 'library(jsonlite);z<-fromJSON("docs/workflow08b/.run_export_decisions");stopifnot(grepl("^[A-Za-z0-9._-]{5,160}$",z$batch_id),grepl("^[0-9a-f]{64}$",z$queue_sha256));cat(paste0("W08B_BATCH_ID=",z$batch_id,"\nW08B_QUEUE_SHA=",z$queue_sha256,"\n"),file=Sys.getenv("GITHUB_ENV"),append=TRUE)'
          else
            echo "W08B_BATCH_ID=$INPUT_BATCH_ID" >> "$GITHUB_ENV"
            echo "W08B_QUEUE_SHA=$INPUT_QUEUE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Validate and archive human decisions privately
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/workflow08b/export_review_decisions.R
      - name: Preserve receipt, not restricted decision contents
        uses: actions/upload-artifact@v4
        with:
          name: w08b-decision-export-receipt-${{ github.run_id }}
          path: w08b_export_receipt.json
          if-no-files-found: error

      - name: Automatically continue completed W08b review through W01 canonicalisation to W02
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin workflow01-final-architecture
          Rscript -e '
            library(jsonlite)
            receipt<-fromJSON("w08b_export_receipt.json")
            source<-fromJSON("docs/workflow08b/review_provenance.json")
            stopifnot(receipt$queue_sha256==source$queue_sha256,
              receipt$batch_id==source$batch_id,
              receipt$decisions==receipt$cases,
              receipt$cases>0L,
              grepl("^[0-9]+$",as.character(receipt$restricted_zenodo_record_id)))
            marker<-list(batch_id=receipt$batch_id,
              queue_sha256=receipt$queue_sha256,
              review_zenodo_id=as.character(receipt$restricted_zenodo_record_id),
              dedup_run=as.character(source$dedup_run),
              bib_run=as.character(source$bib_run),
              previous_w01_pointer=as.character(source$previous_w01_pointer),
              previous_w02_pointer=as.character(source$previous_w02_pointer),
              source_export_run=Sys.getenv("GITHUB_RUN_ID"))
            writeLines(toJSON(marker,pretty=TRUE,auto_unbox=TRUE),
              "docs/workflow08b/.run_canonical_handoff")
          '
          git add docs/workflow08b/.run_canonical_handoff
          git commit -m "W08b: continue human deduplication export to W01 delta and W02"
          git push origin HEAD:workflow01-final-architecture
          echo "PASS: requested W08b W01-compatible canonical handoff"
