name: Test EBSCO EHOST API
on:
  push:
    branches:
      - test-ebsco-eit-api
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe EBSCO profile
        env:
          EBSCO_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        run: |
          test -n "$EBSCO_UID"
          test -n "$EBSCO_PWD"
          curl -sS --get "https://eit.ebscohost.com/Services/SearchService.asmx/Info"             --data-urlencode "prof=$EBSCO_UID"             --data-urlencode "pwd=$EBSCO_PWD"             --data-urlencode "authType=profile"             -o /tmp/ebsco.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          p="/tmp/ebsco.xml"
          root=ET.parse(p).getroot()
          print("ROOT", root.tag)
          for el in root.iter():
              attrs=el.attrib
              if attrs:
                  print(el.tag, {k:v for k,v in attrs.items() if "pwd" not in k.lower() and "pass" not in k.lower()})
          PY
