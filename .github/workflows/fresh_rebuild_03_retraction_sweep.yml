name: Fresh rebuild 03 - retraction sweep

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit only; no records are removed automatically'
        required: true
        default: audit
        type: choice
        options:
          - audit

permissions:
  contents: write
  actions: read

jobs:
  retraction-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical rebuild branch
        uses: actions/checkout@v4
        with:
          ref: canonical-fresh-2026-09-08-v1
          fetch-depth: 0
          lfs: true

      - name: Verify canonical inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s data/canonical/current/repair/records.jsonl
          test -s data/canonical/current/repair/manifest.json

      - name: Run deterministic retraction/publication-notice audit
        run: python3 scripts/canonical_retraction_sweep.py

      - name: Validate audit outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f data/canonical/current/repair/retraction_audit.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/canonical/current/repair/manifest.json').read_text())
          x=m.get('retraction_sweep',{})
          assert x.get('status') == 'audit_complete', x
          assert isinstance(x.get('records_checked'), int) and x['records_checked'] > 0, x
          print(json.dumps(x,indent=2))
          PY

      - name: Upload retraction audit
        uses: actions/upload-artifact@v4
        with:
          name: fresh-rebuild-03-retraction-audit-${{ github.run_id }}
          path: |
            data/canonical/current/repair/retraction_audit.jsonl
            data/canonical/current/repair/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit audit state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/canonical/current/repair/retraction_audit.jsonl data/canonical/current/repair/manifest.json
          if git diff --cached --quiet; then
            echo 'No audit-state changes to commit.'
            exit 0
          fi
          git commit -m 'Audit canonical records for retractions and publication notices'
          git push origin HEAD:canonical-fresh-2026-09-08-v1
