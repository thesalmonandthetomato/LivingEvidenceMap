name: TEMP validate W08 ontology path

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w08_ontology_path.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate W08 ontology wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s user_input/workflow07_topic_ontology.csv
          grep -q -- '--ontology user_input/workflow07_topic_ontology.csv' .github/workflows/workflow_08_production.yml
          ! grep -q 'data/reference/topic_ontology_v3_6.csv' .github/workflows/workflow_08_production.yml
          echo 'PASS: W08 production uses current W07 ontology user input'
      - name: Parse current W08 scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_08_build_review_queue_dynamic.R')
          parse(file='scripts/updater/workflow_08_build_review_package.R')
          parse(file='scripts/updater/workflow_08_finalize_canonical_dynamic.R')
          parse(file='scripts/updater/workflow_08_partition_final_outputs_dynamic.R')
          cat('PASS: current W08 implementation parses\n')
