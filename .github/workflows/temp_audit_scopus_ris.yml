name: Audit Scopus RIS

on:
  push:
    paths:
      - '.github/workflows/temp_audit_scopus_ris.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Audit Scopus RIS structure
        shell: bash
        run: |
          set -euo pipefail
          FILE='data/external/export_bcf8e118-e7ba-47c0-9b69-63f0a98dd2b0_2026-09-14T100754.023402853.ris'
          test -s "$FILE"
          echo "bytes=$(wc -c < "$FILE")"
          echo "lines=$(wc -l < "$FILE")"
          echo "TY_records=$(grep -c '^TY  -' "$FILE" || true)"
          echo "ER_records=$(grep -c '^ER  -' "$FILE" || true)"
          echo "AB_fields=$(grep -c '^AB  -' "$FILE" || true)"
          echo "DO_fields=$(grep -c '^DO  -' "$FILE" || true)"
          echo "TI_fields=$(grep -c '^TI  -' "$FILE" || true)"
          echo "T2_fields=$(grep -c '^T2  -' "$FILE" || true)"
          echo "PY_fields=$(grep -c '^PY  -' "$FILE" || true)"
          head -n 20 "$FILE"
