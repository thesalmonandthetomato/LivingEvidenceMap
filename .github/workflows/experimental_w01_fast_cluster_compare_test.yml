name: Experimental W01-Fast cluster-map comparator validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/experimental_w01_fast_cluster_compare_test.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest"))
      - name: Verify exact and intentionally divergent cluster maps
        shell: Rscript {0}
        run: |
          library(data.table)
          d<-tempfile("w01-map-test-");dir.create(d)
          p<-file.path(d,"production.csv");f<-file.path(d,"fast.csv");report<-file.path(d,"report.json")
          a<-data.table(idx=1:4,source=c("a","b","c","d"),
            source_record_id=letters[1:4],
            cluster_id=c("work-1","work-1","work-2","work-3"),
            cluster_size=c(2L,2L,1L,1L))
          fwrite(a,p);fwrite(a,f)
          script<-"scripts/updater/experimental_w01_fast/compare_cluster_maps.R"
          cmd<-c(script,"--production-map",p,"--fast-map",f,"--report",report)
          stopifnot(system2("Rscript",cmd)==0L)
          b<-copy(a);b[3:4,cluster_id:="work-4"];b[3:4,cluster_size:=2L]
          fwrite(b,f)
          stopifnot(system2("Rscript",cmd)==2L)
          x<-jsonlite::fromJSON(report)
          stopifnot(!x$exact_parity,x$differing_manifestations==2L,
                    nrow(fread(paste0(report,".differences.csv")))==2L)
          cat("PASS: exact parity accepted and legitimate differences detected\n")
