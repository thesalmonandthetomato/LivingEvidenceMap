name: W03 temporary publication status test
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w03-temporary-publication-status-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","httr2","digest"))
      - name: Prepare synthetic post-W02 records
        shell: Rscript {0}
        run: |
          library(jsonlite)
          t <- file.path(Sys.getenv("RUNNER_TEMP"),"w03-test")
          dir.create(t,recursive=TRUE,showWarnings=FALSE)
          titles <- c("Retraction: Sample study","Withdrawal: Another study","Correction: Sample study","Expression of concern: Sample study","Ordinary study")
          ids <- c("retracted","withdrawn","corrected","concern","normal")
          records <- Map(function(id,title) list(identity=list(record_id=id),canonical=list(title=title,doi=NULL),manifestation_refs=list()),ids,titles)
          writeLines(vapply(records,function(z)toJSON(z,auto_unbox=TRUE,null="null"),character(1)),file.path(t,"input.jsonl"))
      - name: Run publication status classifier
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/w03-test"
          Rscript scripts/updater/workflow_03_publication_status.R --input "$T/input.jsonl" --output "$T/status.jsonl" --audit "$T/audit.jsonl" --report "$T/report.json" --batch-size 5
          Rscript -e 'library(jsonlite);t<-commandArgs(TRUE)[1];z<-lapply(readLines(file.path(t,"status.jsonl")),fromJSON,simplifyVector=FALSE);codes<-setNames(vapply(z,function(x)x$publication_status$code,character(1)),vapply(z,function(x)x$record_id,character(1)));stopifnot(identical(unname(codes[c("retracted","withdrawn","corrected","concern","normal")]),c("retracted","withdrawn","corrected","expression_of_concern","normal")));excluded<-setNames(vapply(z,function(x)x$publication_status$exclude_from_workflow04,logical(1)),names(codes));stopifnot(identical(unname(excluded[c("retracted","withdrawn","corrected","concern","normal")]),c(TRUE,TRUE,FALSE,FALSE,FALSE)));r<-fromJSON(file.path(t,"report.json"));stopifnot(r$status=="PASS",r$records_scanned==5L,r$exclude_from_workflow04==2L);cat("PASS: title-based publication status and W04 exclusions verified\n")' "$T"
      - name: Reject duplicate record identities
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/w03-test"
          head -n 1 "$T/input.jsonl" > "$T/duplicate.jsonl"
          head -n 1 "$T/input.jsonl" >> "$T/duplicate.jsonl"
          if Rscript scripts/updater/workflow_03_publication_status.R --input "$T/duplicate.jsonl" --output "$T/duplicate-status.jsonl" --audit "$T/duplicate-audit.jsonl" --report "$T/duplicate-report.json"; then
            echo "FAIL: duplicate IDs accepted"; exit 1
          fi
          echo "PASS: duplicate record IDs rejected"
