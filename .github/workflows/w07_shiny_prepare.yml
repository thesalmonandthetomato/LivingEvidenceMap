name: W07 Shiny prepare from published W05
on:
  workflow_dispatch:
    inputs:
      review_id:
        required: true
        type: string
      w05_deposit_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare-w07-shiny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))
      - name: Restore verified W05 corpus directly into W07
        shell: Rscript {0}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          W07_REVIEW_ID: ${{ inputs.review_id }}
          W07_W05_DEPOSIT_ID: ${{ inputs.w05_deposit_id }}
        run: source("shiny_w07/scripts/w07_shiny_restore_w05.R")
      - name: Archive experimental handover only
        uses: actions/upload-artifact@v4
        with:
          name: w07-shiny-input-${{ github.run_id }}
          path: ${{ runner.temp }}/w07-shiny-input/
          retention-days: 14
          if-no-files-found: error
