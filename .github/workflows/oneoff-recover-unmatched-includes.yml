name: One-off recover unmatched INCLUDE Lens records

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Retrieve exact Lens records
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import requests

          ids = '''
012-639-887-533-230
019-302-028-265-996
021-120-599-540-909
024-467-394-778-974
035-193-855-089-850
054-477-191-126-973
061-696-741-811-996
061-951-760-687-471
062-797-037-307-031
067-931-641-944-199
068-184-595-919-637
080-594-864-290-977
093-075-864-485-763
101-309-448-637-809
113-151-351-905-385
122-304-338-391-405
124-264-127-561-979
131-236-784-918-312
134-977-553-604-428
142-692-828-048-880
144-473-705-890-157
157-383-416-203-018
161-812-654-416-50X
174-207-366-005-817
175-637-124-847-313
176-822-536-033-86X
180-207-561-404-407
188-666-287-311-227
'''.split()

          assert len(ids) == 28, f'Expected 28 Lens IDs, found {len(ids)}'
          assert len(set(ids)) == 28, 'Duplicate Lens IDs in input list'

          token = os.environ.get('LENS_API_TOKEN')
          if not token:
              raise RuntimeError('LENS_API_TOKEN is required')

          out = Path('outputs/oneoff_final_master_28_recovery')
          out.mkdir(parents=True, exist_ok=True)
          headers = {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }
          url = 'https://api.lens.org/scholarly/search'

          def post(payload):
              last = None
              for attempt in range(5):
                  r = requests.post(url, headers=headers, json=payload, timeout=120)
                  if r.status_code == 200:
                      return r.json()
                  if r.status_code == 204:
                      return {'data': []}
                  last = f'HTTP {r.status_code}: {r.text[:1000]}'
                  if r.status_code == 429 or 500 <= r.status_code < 600:
                      wait = r.headers.get('x-rate-limit-retry-after-seconds') or r.headers.get('Retry-After') or str(2 ** attempt)
                      try:
                          wait = min(60.0, float(wait))
                      except Exception:
                          wait = min(60.0, float(2 ** attempt))
                      time.sleep(wait)
                      continue
                  raise RuntimeError(last)
              raise RuntimeError(f'Lens request failed after retries: {last}')

          response = post({'query': {'terms': {'lens_id': ids}}, 'size': 100})
          (out / 'raw_exact_id_response.json').write_text(json.dumps(response, ensure_ascii=False, indent=2), encoding='utf-8')

          returned = response.get('data', []) or []
          by_id = {}
          unexpected = []
          requested = set(ids)
          for rec in returned:
              lid = rec.get('lens_id')
              if not lid:
                  continue
              if lid not in requested:
                  unexpected.append(lid)
                  continue
              if lid in by_id:
                  raise RuntimeError(f'Duplicate Lens result for {lid}')
              by_id[lid] = rec

          found_ids = [lid for lid in ids if lid in by_id]
          missing_ids = [lid for lid in ids if lid not in by_id]

          with (out / 'records.jsonl').open('w', encoding='utf-8') as fh:
              for lid in found_ids:
                  rec = by_id[lid]
                  wrapper = {
                      'identity': {'lens_id': lid, 'record_id': lid, 'record_id_type': 'lens_id'},
                      'source': {'provider': 'lens', 'source_format': 'lens_api_json'},
                      'lens': {'raw_payload': rec},
                      'provenance': {'recovery': 'final_master_missing_exact_lens_id'},
                  }
                  fh.write(json.dumps(wrapper, ensure_ascii=False, separators=(',', ':')) + '\n')

          (out / 'requested_ids.txt').write_text('\n'.join(ids) + '\n', encoding='utf-8')
          (out / 'found_ids.txt').write_text('\n'.join(found_ids) + ('\n' if found_ids else ''), encoding='utf-8')
          (out / 'missing_ids.txt').write_text('\n'.join(missing_ids) + ('\n' if missing_ids else ''), encoding='utf-8')

          manifest = {
              'exact_ids_requested': len(ids),
              'exact_ids_found': len(found_ids),
              'exact_ids_missing': len(missing_ids),
              'unexpected_ids_returned': unexpected,
              'canonical_modified': False,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Validate recovery outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/oneoff_final_master_28_recovery')
          m = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert m['exact_ids_requested'] == 28
          assert m['canonical_modified'] is False
          lines = [x for x in (root / 'records.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(lines) == m['exact_ids_found']
          print(f"Recovered {m['exact_ids_found']}/28 exact Lens IDs; {m['exact_ids_missing']} missing")
          PY

      - name: Upload recovery artefact
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-final-master-28-lens-recovery-${{ github.run_id }}
          path: outputs/oneoff_final_master_28_recovery/
          if-no-files-found: error
          retention-days: 90
