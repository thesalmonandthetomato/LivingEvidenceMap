name: TEMP clear Shiny test state

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/shiny_adjudication/.run_clear_test_state'

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
      LEM_GOOGLE_SHEET_ID: '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install dependency
        shell: Rscript {0}
        run: install.packages('googlesheets4')

      - name: Prepare Google credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          echo "LEM_GOOGLE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/lem-google-service-account.json" >> "$GITHUB_ENV"

      - name: Clear Shiny test queues and decisions
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(googlesheets4))

          ss <- Sys.getenv('LEM_GOOGLE_SHEET_ID')
          gs4_auth(path=Sys.getenv('LEM_GOOGLE_SERVICE_ACCOUNT_JSON'),cache=FALSE)

          targets <- c(
            'queue_w01_active',
            'queue_w01_legacy_730',
            'decisions',
            'queue_w02_active',
            'decisions_w02',
            'w02_resume_requests',
            'queue_w04_validation_active',
            'decisions_w04_validation'
          )

          before <- sheet_names(ss)
          cat('Sheets before cleanup:', paste(before,collapse=', '), '\n')

          present <- intersect(targets,before)
          non_targets <- setdiff(before,present)

          if(!length(non_targets)) {
            if(!'clean_state' %in% before) sheet_add(ss,sheet='clean_state')
          }

          for(tab in present) {
            cat('Deleting test tab:',tab,'\n')
            sheet_delete(ss,sheet=tab)
          }

          after <- sheet_names(ss)
          remaining_targets <- intersect(targets,after)
          if(length(remaining_targets)) {
            stop('Cleanup failed; Shiny test tabs remain: ',paste(remaining_targets,collapse=', '))
          }

          cat('PASS: Shiny test queues/decisions cleared. Sheets after cleanup:',paste(after,collapse=', '),'\n')
