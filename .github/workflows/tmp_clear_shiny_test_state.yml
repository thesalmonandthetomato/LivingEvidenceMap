name: TEMP clear Shiny test state

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/shiny_adjudication/.run_clear_test_state'

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
      LEM_GOOGLE_SHEET_ID: '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install dependency
        shell: Rscript {0}
        run: install.packages('googlesheets4')

      - name: Prepare Google credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          echo "LEM_GOOGLE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/lem-google-service-account.json" >> "$GITHUB_ENV"

      - name: Initialise and verify Shiny decisions tab
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(googlesheets4))

          ss <- Sys.getenv('LEM_GOOGLE_SHEET_ID')
          tab <- 'decisions'
          required <- c(
            'decision_id',
            'review_case_id',
            'decision',
            'rationale',
            'reviewer',
            'resolved_at_utc',
            'queue_sha256',
            'supersedes_decision_id'
          )

          gs4_auth(path=Sys.getenv('LEM_GOOGLE_SERVICE_ACCOUNT_JSON'),cache=FALSE)

          tabs <- sheet_names(ss)
          if(!tab %in% tabs) {
            sheet_add(ss,sheet=tab)
          }

          x <- tryCatch(
            read_sheet(ss,sheet=tab,col_types='c'),
            error=function(e) data.frame()
          )

          if(nrow(x)==0L && ncol(x)==0L) {
            header <- as.data.frame(
              setNames(replicate(length(required),character(),simplify=FALSE),required),
              stringsAsFactors=FALSE
            )
            sheet_write(header,ss=ss,sheet=tab)
          }

          verify_tabs <- sheet_names(ss)
          if(!tab %in% verify_tabs) stop('Decisions tab was not created')

          verify <- read_sheet(ss,sheet=tab,col_types='c')
          if(!identical(names(verify),required)) {
            stop('Decisions tab schema mismatch: ',paste(names(verify),collapse=','))
          }

          cat('PASS: Shiny decisions tab initialised and verified\n')
          cat('Existing decision rows:',nrow(verify),'\n')
