name: W08b OpenAlex fallback citation discovery
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths: [docs/workflow08b/.run_openalex_fallback]
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest'))
      - name: Restore verified DOI-resolved Lens checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/restore_discovery.R 23626701 "$RUNNER_TEMP/w08b"
          test -s "$RUNNER_TEMP/w08b/identity_crosswalk_resolved.csv"
          Rscript -e 'x<-read.csv(file.path(Sys.getenv("RUNNER_TEMP"),"w08b/identity_crosswalk_resolved.csv"),stringsAsFactors=FALSE);stopifnot(nrow(x)==22923L,!anyDuplicated(x$record_id))'
      - name: OpenAlex fallback, checkpointed first five seeds
        id: fallback
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/run_openalex_fallback.R "$RUNNER_TEMP/w08b/identity_crosswalk_resolved.csv" "$RUNNER_TEMP/w08b" 5
      - name: Archive every outcome to restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/archive_discovery.R "$RUNNER_TEMP/w08b" "$GITHUB_RUN_ID" "$RUNNER_TEMP/w08b-receipt.json"
          cat "$RUNNER_TEMP/w08b/openalex_summary.json"
          cat "$RUNNER_TEMP/w08b-receipt.json"
      - name: Fail after archival if fallback failed
        if: steps.fallback.outcome == 'failure'
        run: exit 1
