name: W08b publish human dedup cases to Shiny
on:
  workflow_dispatch:
    inputs:
      dedup_run:
        description: 'Successful W08b deterministic deduplication run'
        required: true
        default: '40198092478'
        type: string
      bibliography_run:
        description: 'Full W08b bibliography download run'
        required: true
        default: '40182796865'
        type: string
      previous_w01_pointer:
        description: 'Authoritative historical W01 final/delta pointer'
        required: true
        default: 'docs/deduplication/zenodo/run-39990028078.json'
        type: string
  push:
    branches: [workflow01-final-architecture]
    paths: [docs/workflow08b/.run_publish_shiny]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R libraries
        shell: Rscript {0}
        run: install.packages(c('jsonlite','data.table','googlesheets4','digest','httr2'))
      - name: Restore new citation bibliography and verified dedup outputs
        env:
          GH_TOKEN: ${{ github.token }}
          BIB_RUN: ${{ inputs.bibliography_run || '40182796865' }}
          DEDUP_RUN: ${{ inputs.dedup_run || '40198092478' }}
        run: |
          set -euo pipefail
          [[ "$BIB_RUN" =~ ^[0-9]+$ && "$DEDUP_RUN" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/w08b" "$RUNNER_TEMP/dedup"
          gh run download "$BIB_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "w08b-complete-bibliographies-$BIB_RUN" --dir "$RUNNER_TEMP/w08b"
          gh run download "$DEDUP_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "w08b-lightweight-dedup-$DEDUP_RUN" --dir "$RUNNER_TEMP/dedup"
          test -s "$RUNNER_TEMP/dedup/identity_crosswalk.csv"
          test -f "$RUNNER_TEMP/w08b/lens/records.jsonl"
          test -f "$RUNNER_TEMP/w08b/openalex/openalex_sidecar_records.jsonl"
          Rscript -e 'x<-jsonlite::fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"dedup/summary.json"));stopifnot(x$ambiguous_clusters>=0L,x$provider_manifestations>0L,identical(x$candidate_handoff_authorised,FALSE))'
      - name: Restore authoritative historical W01 records read-only
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          PREV_POINTER: ${{ inputs.previous_w01_pointer || 'docs/deduplication/zenodo/run-39990028078.json' }}
        run: |
          set -euo pipefail
          test -s "$PREV_POINTER"
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer "$PREV_POINTER" \
            --pointer-dir docs/deduplication/zenodo \
            --output-root "$RUNNER_TEMP/w01"
          test -s "$RUNNER_TEMP/w01/canonical/records.jsonl"
      - name: Publish exactly the ambiguous historical matches to Shiny
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/publish_w08b_review_queue.R \
            "$RUNNER_TEMP/dedup/identity_crosswalk.csv" \
            "$RUNNER_TEMP/w08b/lens/records.jsonl" \
            "$RUNNER_TEMP/w08b/openalex/openalex_sidecar_records.jsonl" \
            "$RUNNER_TEMP/w01/canonical/records.jsonl" \
            "$RUNNER_TEMP/w08b_shiny"
          cat "$RUNNER_TEMP/w08b_shiny/review_queue_manifest.json"
      - name: Archive valid zero-human-review decisions without fabricating adjudication
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          STATUS="$(jq -r '.status' "$RUNNER_TEMP/w08b_shiny/review_queue_manifest.json")"
          if [ "$STATUS" = "no_review_required" ]; then
            Rscript scripts/workflow08b/archive_empty_review.R \
              "$RUNNER_TEMP/w08b_shiny/review_queue_manifest.json" \
              "$RUNNER_TEMP/w08b_shiny/empty_review_receipt.json"
            test -s "$RUNNER_TEMP/w08b_shiny/empty_review_receipt.json"
          else
            test "$STATUS" = "published_to_shiny"
          fi
      - name: Save immutable W08b review-source provenance for automatic handoff
        env:
          DEDUP_RUN: ${{ inputs.dedup_run || '40198092478' }}
          BIB_RUN: ${{ inputs.bibliography_run || '40182796865' }}
          PREV_W01: ${{ inputs.previous_w01_pointer || 'docs/deduplication/zenodo/run-39990028078.json' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin workflow01-final-architecture
          Rscript -e '
            library(jsonlite)
            z<-fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"w08b_shiny/review_queue_manifest.json"))
            stopifnot(z$status%in%c("published_to_shiny","no_review_required"))
            status<-fromJSON("docs/current_run/current_run_status.json")
            w02run<-as.character(status$workflow_runs$W02)
            stopifnot(length(w02run)==1L,grepl("^[0-9]+$",w02run))
            prev_w02<-file.path("docs/enrichment/zenodo",paste0("run-",w02run,".json"))
            stopifnot(file.exists(prev_w02),fromJSON(prev_w02)$status=="published")
            prev_w01<-Sys.getenv("PREV_W01")
            w01run<-as.character(status$workflow_runs$W01)
            stopifnot(grepl("^[0-9]+$",w01run),
              identical(prev_w01,file.path("docs/deduplication/zenodo",
                paste0("run-",w01run,".json"))))
            out<-list(schema="w08b-review-provenance-v1",queue_sha256=z$queue_sha256,
              batch_id=z$batch_id,dedup_run=Sys.getenv("DEDUP_RUN"),
              bib_run=Sys.getenv("BIB_RUN"),
              previous_w01_pointer=Sys.getenv("PREV_W01"),
              previous_w02_pointer=prev_w02)
            writeLines(toJSON(out,pretty=TRUE,auto_unbox=TRUE),"docs/workflow08b/review_provenance.json")
            if(identical(z$status,"no_review_required")){
              receipt<-fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),
                "w08b_shiny/empty_review_receipt.json"))
              stopifnot(receipt$cases==0L,receipt$decisions==0L,
                identical(as.character(receipt$queue_sha256),as.character(z$queue_sha256)),
                grepl("^[0-9]+$",as.character(receipt$restricted_zenodo_record_id)))
              marker<-list(batch_id=z$batch_id,queue_sha256=z$queue_sha256,
                review_zenodo_id=as.character(receipt$restricted_zenodo_record_id),
                dedup_run=Sys.getenv("DEDUP_RUN"),bib_run=Sys.getenv("BIB_RUN"),
                previous_w01_pointer=Sys.getenv("PREV_W01"),
                previous_w02_pointer=prev_w02,
                no_human_review_required=TRUE,
                source_export_run=Sys.getenv("GITHUB_RUN_ID"))
              writeLines(toJSON(marker,auto_unbox=TRUE,pretty=TRUE),
                "docs/workflow08b/.run_canonical_handoff")
            }
          '
          git add docs/workflow08b/review_provenance.json
          if test -s "$RUNNER_TEMP/w08b_shiny/empty_review_receipt.json"; then
            git add docs/workflow08b/.run_canonical_handoff
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Register W08b review queue source lineage"
            git push origin HEAD:workflow01-final-architecture
          fi
          if test -s "$RUNNER_TEMP/w08b_shiny/empty_review_receipt.json"; then
            gh workflow run workflow08b_canonical_to_w02.yml \
              --repo "$GITHUB_REPOSITORY" --ref workflow01-final-architecture
            echo "PASS: dispatched verified zero-ambiguity W01 canonical handoff"
          fi
      - name: Preserve queue provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w08b-shiny-review-queue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/w08b_shiny/w08b_review_queue.csv
            ${{ runner.temp }}/w08b_shiny/review_queue_manifest.json
          retention-days: 30
          if-no-files-found: warn
