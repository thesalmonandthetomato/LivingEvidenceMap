name: W01 first-run synthetic validation (no APIs)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install existing W01 dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","stringdist","digest","xml2","stringi","data.table"))
      - name: Exercise original first-run union, indexing and checkpoint contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w01_smoke/input /tmp/w01_smoke/empty
          Rscript - <<'RS'
          library(jsonlite)
          root <- "/tmp/w01_smoke/input"
          records <- list(
            list(source=list(provider="ebsco_amed"),sidecar_identity=list(sidecar_record_id="TEST-1"),mapped_fields=list(title="Synthetic salmon feed A",year="2025",authors="Smith A",doi="10.0000/test-a",abstract="Synthetic abstract A")),
            list(source=list(provider="ebsco_amed"),sidecar_identity=list(sidecar_record_id="TEST-2"),mapped_fields=list(title="Synthetic salmon feed B",year="2024",authors="Jones B",doi="10.0000/test-b",abstract="Synthetic abstract B"))
          )
          writeLines(vapply(records,function(x)toJSON(x,auto_unbox=TRUE,null="null"),character(1)),file.path(root,"records.jsonl"))
          write_json(list(schema="living-evidence-map-workflow01-source-inputs-v1",sources=list(ebsco_amed=file.path(root,"records.jsonl"))),file.path(root,"manifest.json"),auto_unbox=TRUE)
          RS
          Rscript scripts/updater/workflow_01_initial_deduplication.R --input-manifest /tmp/w01_smoke/input/manifest.json --output-dir /tmp/w01_smoke/prep
          Rscript - <<'RS'
          library(jsonlite)
          library(data.table)
          r <- "/tmp/w01_smoke/prep"
          stopifnot(file.exists(file.path(r,"union","source_inputs.json")))
          m <- fromJSON(file.path(r,"union","union_manifest.json"))
          stopifnot(as.integer(m$union_manifestations)==2L,as.integer(m$preserved_prior_manifestations)==0L)
          meta <- fread(file.path(r,"candidates","normalised_metadata.csv"))
          stopifnot(nrow(meta)==2L,all(c("idx","source","source_record_id") %in% names(meta)))
          stopifnot(identical(as.character(meta$source_record_id),c("TEST-1","TEST-2")))
          cat("PASS: synthetic initial W01 union, empty historical state, and stable metadata identities\n")
          RS
      - name: Upload synthetic test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-synthetic-validation-${{ github.run_id }}
          path: /tmp/w01_smoke/prep/
          if-no-files-found: warn
          retention-days: 3
