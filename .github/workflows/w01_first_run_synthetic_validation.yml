name: W01 first-run synthetic validation (no APIs)
on:
  push:
    branches: [main]
    paths: [docs/w01_synthetic_validation_trigger.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install existing W01 dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","stringdist","digest","xml2","stringi","data.table"))
      - name: Exercise original first-run union, indexing and checkpoint contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w01_smoke/input /tmp/w01_smoke/empty
          Rscript - <<'RS'
          library(jsonlite)
          root <- "/tmp/w01_smoke/input"
          records <- list(
            list(source=list(provider="ebsco_amed"),sidecar_identity=list(sidecar_record_id="TEST-1"),mapped_fields=list(title="Synthetic salmon feed A",year="2025",authors="Smith A",doi="10.0000/test-a",abstract="Synthetic abstract A")),
            list(source=list(provider="ebsco_amed"),sidecar_identity=list(sidecar_record_id="TEST-2"),mapped_fields=list(title="Synthetic salmon feed B",year="2024",authors="Jones B",doi="10.0000/test-b",abstract="Synthetic abstract B"))
          )
          writeLines(vapply(records,function(x)toJSON(x,auto_unbox=TRUE,null="null"),character(1)),file.path(root,"records.jsonl"))
          write_json(list(schema="living-evidence-map-workflow01-source-inputs-v1",sources=list(ebsco_amed=file.path(root,"records.jsonl"))),file.path(root,"manifest.json"),auto_unbox=TRUE)
          RS
          Rscript scripts/updater/workflow_01_initial_deduplication.R --input-manifest /tmp/w01_smoke/input/manifest.json --output-dir /tmp/w01_smoke/prep
          Rscript - <<'RS'
          library(jsonlite)
          library(data.table)
          r <- "/tmp/w01_smoke/prep"
          stopifnot(file.exists(file.path(r,"union","source_inputs.json")))
          m <- fromJSON(file.path(r,"union","union_manifest.json"))
          stopifnot(as.integer(m$union_manifestations)==2L,as.integer(m$preserved_prior_manifestations)==0L)
          meta <- fread(file.path(r,"candidates","normalised_metadata.csv"))
          stopifnot(nrow(meta)==2L,all(c("idx","source","source_record_id") %in% names(meta)))
          stopifnot(identical(as.character(meta$source_record_id),c("TEST-1","TEST-2")))
          cat("PASS: synthetic initial W01 union, empty historical state, and stable metadata identities\n")
          RS
      - name: Exercise original cluster merger and canonical builder without APIs
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          library(data.table)
          x <- data.table(
            record_i=1L,record_j=2L,
            source_id_i="ebsco_amed",source_record_id_i="TEST-1",
            source_id_j="ebsco_amed",source_record_id_j="TEST-2",
            rescored_classification="not_duplicate",rescored_rule="synthetic_validation",
            review_route="automatic",source_row_index=1L
          )
          fwrite(x,"/tmp/w01_smoke/new_decisions.csv")
          file.create("/tmp/w01_smoke/empty_prior_decisions.csv")
          RS
          Rscript scripts/updater/workflow_01_deduplication_merge_clusters.R \
            --first-run true \
            --old-decisions /tmp/w01_smoke/empty_prior_decisions.csv \
            --new-decisions /tmp/w01_smoke/new_decisions.csv \
            --metadata /tmp/w01_smoke/prep/candidates/normalised_metadata.csv \
            --output-dir /tmp/w01_smoke/merged
          Rscript - <<'RS'
          library(jsonlite)
          library(data.table)
          p <- "/tmp/w01_smoke/merged"
          s <- fromJSON(file.path(p,"summary.json"))
          m <- fread(file.path(p,"manifestation_cluster_map.csv"))
          stopifnot(s$source_manifestations==2L,s$preserved_pair_decisions==0L,s$clusters==2L)
          stopifnot(identical(as.character(m$source_record_id),c("TEST-1","TEST-2")))
          cat("PASS: original W01 cluster merger with zero historical decisions\n")
          RS
          : > /tmp/w01_smoke/empty_strip_actions.jsonl
          : > /tmp/w01_smoke/empty_repairs.jsonl
          Rscript scripts/updater/workflow_01_build_canonical_jsonl.R \
            --cluster-map /tmp/w01_smoke/merged/manifestation_cluster_map.csv \
            --strip-actions /tmp/w01_smoke/empty_strip_actions.jsonl \
            --data-quality-repairs /tmp/w01_smoke/empty_repairs.jsonl \
            --input-manifest /tmp/w01_smoke/prep/union/source_inputs.json \
            --run-id synthetic-validation \
            --output /tmp/w01_smoke/canonical.jsonl \
            --manifest /tmp/w01_smoke/canonical_manifest.json
          Rscript - <<'RS'
          library(jsonlite)
          x <- fromJSON("/tmp/w01_smoke/canonical_manifest.json")
          stopifnot(as.integer(x$records)==2L)
          cat("PASS: original W01 canonical builder produces two canonical records\n")
          RS
      - name: Check first-run checkpoint, source replay and local archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/w01_smoke
          mkdir -p "$ROOT/empty_prior/workflow01_seed" "$ROOT/review_package" "$ROOT/rescore" "$ROOT/archived/workflow01_seed" "$ROOT/archived/workflow01_full_five_source" "$ROOT/archived/workflow01_incremental_rescore" "$ROOT/archived/canonical" "$ROOT/archived/provenance"
          cp "$ROOT/prep/candidates/normalised_metadata.csv" "$ROOT/metadata.csv"
          cp "$ROOT/new_decisions.csv" "$ROOT/rescore/rescored_sample.csv"
          cp "$ROOT/merged/summary.json" "$ROOT/rescore/summary.json"
          cp "$ROOT/new_decisions.csv" "$ROOT/rescored_pairs.csv"
          : > "$ROOT/all_adjudications.jsonl"
          Rscript - <<'RS'
          library(jsonlite)
          root <- "/tmp/w01_smoke"
          write_json(list(pending_count=1,queue_sha256="synthetic-test-queue"),file.path(root,"review_package","review_manifest.json"),auto_unbox=TRUE)
          write_json(list(status="published",github_run_id="synthetic-w00",zenodo_record_id="synthetic-only"),file.path(root,"w00_pointer.json"),auto_unbox=TRUE)
          RS
          Rscript scripts/updater/workflow_01_build_pending_checkpoint.R \
            --first-run true \
            --previous-root "$ROOT/empty_prior" \
            --current-seed-root "$ROOT/prep/union" \
            --incremental-rescore "$ROOT/rescored_pairs.csv" \
            --rescore-dir "$ROOT/rescore" \
            --adjudications "$ROOT/all_adjudications.jsonl" \
            --review-package "$ROOT/review_package" \
            --pre-summary "$ROOT/merged/summary.json" \
            --metadata "$ROOT/metadata.csv" \
            --workflow00-pointer "$ROOT/w00_pointer.json" \
            --output-dir "$ROOT/checkpoint" \
            --run-id synthetic-validation
          Rscript scripts/updater/workflow_01_apply_checkpoint_sources.R \
            --previous-seed "$ROOT/empty_prior/workflow01_seed" \
            --checkpoint-dir "$ROOT/checkpoint" \
            --output-dir "$ROOT/replayed_union"
          Rscript scripts/updater/workflow_01_deduplication_incremental_candidates.R \
            --first-run true \
            --input-manifest "$ROOT/replayed_union/source_inputs.json" \
            --output-dir "$ROOT/replayed_candidates" \
            --score-n 1 \
            --validate-index-only true
          Rscript scripts/updater/workflow_01_validate_index_identity.R \
            --metadata "$ROOT/replayed_candidates/normalised_metadata.csv" \
            --checkpoint-manifest "$ROOT/checkpoint/checkpoint_manifest.json" \
            --output "$ROOT/index_identity.json"
          cp "$ROOT/prep/union/"*_records_for_deduplication.jsonl "$ROOT/archived/workflow01_seed/"
          cp "$ROOT/prep/union/source_inputs.json" "$ROOT/archived/workflow01_seed/"
          cp "$ROOT/rescore/rescored_sample.csv" "$ROOT/rescore/summary.json" "$ROOT/archived/workflow01_incremental_rescore/"
          cp "$ROOT/merged/summary.json" "$ROOT/merged/manifestation_cluster_map.csv" "$ROOT/archived/workflow01_full_five_source/"
          cp "$ROOT/canonical.jsonl" "$ROOT/archived/canonical/records.jsonl"
          cp "$ROOT/canonical_manifest.json" "$ROOT/archived/canonical/"
          tar -czf "$ROOT/local-baseline.tar.gz" -C "$ROOT/archived" .
          tar -tzf "$ROOT/local-baseline.tar.gz" >/dev/null
          Rscript - <<'RS'
          library(jsonlite)
          root <- "/tmp/w01_smoke"
          m <- fromJSON(file.path(root,"checkpoint","checkpoint_manifest.json"))
          stopifnot(isTRUE(m$first_run),is.null(m$previous_workflow01))
          for (x in c("rescored_sample.csv","summary.json")) {
            stopifnot(identical(readBin(file.path(root,"rescore",x),"raw",n=1e7),readBin(file.path(root,"checkpoint","initial_rescore",x),"raw",n=1e7)))
          }
          x<-fromJSON(file.path(root,"index_identity.json"))
          stopifnot(file.exists(file.path(root,"local-baseline.tar.gz")))
          cat("PASS: checkpoint and source reconstruction preserve first-run identities and original rescoring files; local archive is valid\n")
          RS
      - name: Upload synthetic test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-synthetic-validation-${{ github.run_id }}
          path: /tmp/w01_smoke/prep/
          if-no-files-found: warn
          retention-days: 3
