name: OpenAlex full-text download

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "Batch to download (1-40; max 100 OpenAlex content files)"
        required: true
        type: number
        default: 1

# Manual only. Never scheduled, never triggered by push/PR.
concurrency:
  group: openalex-fulltext-zenodo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate batch number
        shell: bash
        run: |
          set -euo pipefail
          BATCH="${{ inputs.batch_number }}"
          if ! [[ "$BATCH" =~ ^[0-9]+$ ]]; then
            echo "Batch number must be an integer."
            exit 1
          fi
          if (( BATCH < 1 || BATCH > 40 )); then
            echo "Batch number must be between 1 and 40."
            exit 1
          fi

      - name: Restore batch checkpoint
        uses: actions/cache/restore@v4
        with:
          path: openalex_fulltext/batch_${{ inputs.batch_number }}
          key: openalex-fulltext-v5-batch-${{ inputs.batch_number }}-${{ hashFiles('data/openalex_grobid_candidates.csv', 'data/openalex_pdf_candidates.csv') }}

      - name: Download OpenAlex full text
        id: download
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          python scripts/download_openalex_fulltext.py \
            --batch "${{ inputs.batch_number }}" \
            --output openalex_fulltext

      # Runs regardless of whether the download/Zenodo step failed. The stable
      # key deliberately allows a future rerun of the same batch to restore the
      # already-downloaded files and avoid purchasing them again from OpenAlex.
      - name: Save batch checkpoint
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openalex_fulltext/batch_${{ inputs.batch_number }}
          key: openalex-fulltext-v5-batch-${{ inputs.batch_number }}-${{ hashFiles('data/openalex_grobid_candidates.csv', 'data/openalex_pdf_candidates.csv') }}

      - name: Upload batch checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-fulltext-batch-${{ inputs.batch_number }}-run-${{ github.run_id }}
          path: openalex_fulltext/batch_${{ inputs.batch_number }}
          if-no-files-found: warn
          retention-days: 90

      - name: Show manifest and Zenodo receipt
        if: always()
        run: |
          BATCH_DIR="openalex_fulltext/batch_${{ inputs.batch_number }}"
          if [ -f "$BATCH_DIR/download_manifest.csv" ]; then
            echo "--- download_manifest.csv ---"
            cat "$BATCH_DIR/download_manifest.csv"
          fi
          if [ -f "$BATCH_DIR/zenodo_receipt.json" ]; then
            echo "--- zenodo_receipt.json ---"
            cat "$BATCH_DIR/zenodo_receipt.json"
          fi

      - name: Fail if download or Zenodo staging failed
        if: steps.download.outcome == 'failure'
        run: exit 1
