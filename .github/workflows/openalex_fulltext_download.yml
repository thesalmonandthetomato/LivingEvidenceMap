name: OpenAlex full-text download

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "Batch to download (1-40; max 100 OpenAlex content files)"
        required: true
        type: number
        default: 1

# Manual only. Never scheduled, never triggered by push/PR.
concurrency:
  group: openalex-fulltext-zenodo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate batch number
        shell: bash
        run: |
          set -euo pipefail
          BATCH="${{ inputs.batch_number }}"
          if ! [[ "$BATCH" =~ ^[0-9]+$ ]]; then
            echo "Batch number must be an integer."
            exit 1
          fi
          if (( BATCH < 1 || BATCH > 40 )); then
            echo "Batch number must be between 1 and 40."
            exit 1
          fi

      # The cache is a convenience/resume layer. The 90-day artifact below is
      # the explicit checkpoint guarantee and is uploaded BEFORE Zenodo is tried.
      - name: Restore batch checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: openalex_fulltext/batch_${{ inputs.batch_number }}
          key: openalex-fulltext-v6-batch-${{ inputs.batch_number }}-${{ hashFiles('data/openalex_grobid_candidates.csv', 'data/openalex_pdf_candidates.csv') }}

      - name: Download OpenAlex full text only
        id: download
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python scripts/download_openalex_fulltext.py \
            --batch "${{ inputs.batch_number }}" \
            --output openalex_fulltext \
            --mode download

      # HARD CHECKPOINT: this happens before any ZIP creation or Zenodo call.
      # The original downloaded files remain untouched in the batch directory.
      - name: Upload raw batch checkpoint (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-fulltext-batch-${{ inputs.batch_number }}-run-${{ github.run_id }}
          path: openalex_fulltext/batch_${{ inputs.batch_number }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Save batch checkpoint cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openalex_fulltext/batch_${{ inputs.batch_number }}
          key: openalex-fulltext-v6-batch-${{ inputs.batch_number }}-${{ hashFiles('data/openalex_grobid_candidates.csv', 'data/openalex_pdf_candidates.csv') }}

      # IMPORTANT: a partial batch is still deposited. Successfully retrieved
      # files are valuable work product; failed records remain in the manifest
      # for a later recovery workflow. This stage never downloads from OpenAlex.
      - name: Stage available files in private Zenodo
        id: zenodo
        if: always()
        continue-on-error: true
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          python scripts/zenodo_partial_batch.py \
            --batch "${{ inputs.batch_number }}" \
            --output openalex_fulltext

      # Upload the post-Zenodo state as a second 90-day checkpoint so the
      # receipt is preserved too. The first artifact remains the raw checkpoint.
      - name: Upload final batch state (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-fulltext-batch-${{ inputs.batch_number }}-final-${{ github.run_id }}
          path: openalex_fulltext/batch_${{ inputs.batch_number }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Show manifest and Zenodo receipt
        if: always()
        run: |
          BATCH_DIR="openalex_fulltext/batch_${{ inputs.batch_number }}"
          echo "--- download_manifest.csv ---"
          cat "$BATCH_DIR/download_manifest.csv"
          if [ -f "$BATCH_DIR/zenodo_receipt.json" ]; then
            echo "--- zenodo_receipt.json ---"
            cat "$BATCH_DIR/zenodo_receipt.json"
          else
            echo "No Zenodo receipt was created."
          fi

      # A download failure is not a batch failure: it is recorded for recovery.
      # A Zenodo failure IS a workflow failure because it means the checkpoint
      # could not be durably staged in the requested private storage.
      - name: Fail only if Zenodo staging failed
        if: steps.zenodo.outcome == 'failure'
        run: exit 1
