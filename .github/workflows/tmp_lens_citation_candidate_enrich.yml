name: Temporary enrich Lens citation candidates

on:
  workflow_dispatch:
    inputs:
      prioritisation_run_id:
        description: "Run ID containing lens-citation-prioritisation artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-lens-citation-gap-test
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2", "jsonlite"))

      - name: Parse enrichment script
        shell: Rscript {0}
        run: |
          parse(file="scripts/temporary/lens_citation_candidate_enrich.R")
          cat("PASS: candidate enrichment script parses\n")

      - name: Download prioritisation bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prioritisation_run_id }}
          pattern: lens-citation-prioritisation-*
          path: inputs/prioritisation
          merge-multiple: true

      - name: Extract candidate IDs
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          x <- read.csv("inputs/prioritisation/candidate_ranking.csv", stringsAsFactors=FALSE)
          writeLines(as.character(x$candidate_lens_id), "inputs/candidate_ids.txt")
          RS

      - name: Enrich candidate metadata from Lens
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/temporary/lens_citation_candidate_enrich.R             --candidate-ids inputs/candidate_ids.txt             --output-dir outputs/enrichment             --chunk-size 500

      - name: Verify no OpenAI screening occurred
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"openai_api_called": false' outputs/enrichment/summary.json
          echo "PASS: Lens metadata enrichment only; OpenAI/W04 not invoked"

      - name: Upload enriched candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: lens-citation-candidate-enrichment-${{ inputs.prioritisation_run_id }}
          path: outputs/enrichment/
          retention-days: 30
          if-no-files-found: error
