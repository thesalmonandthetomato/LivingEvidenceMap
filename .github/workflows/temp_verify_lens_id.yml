name: Verify Lens ID in canonical

on:
  push:
    paths:
      - '.github/workflows/temp_verify_lens_id.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch with LFS
        uses: actions/checkout@v4
        with:
          ref: canonical-fresh-2026-09-08-v1
          lfs: true
          fetch-depth: 1

      - name: Verify target Lens ID
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          target = '075-265-152-590-041'
          path = 'data/canonical/current/repair/records.jsonl'
          found = None
          with open(path, encoding='utf-8') as fh:
              for n, line in enumerate(fh, 1):
                  if not line.strip():
                      continue
                  rec = json.loads(line)
                  if ((rec.get('identity') or {}).get('lens_id')) == target:
                      found = (n, rec)
                      break
          if found is None:
              print(f'NOT_FOUND_IDENTITY: {target}')
              raise SystemExit(1)
          n, rec = found
          canonical = rec.get('canonical') or {}
          raw = ((rec.get('lens') or {}).get('raw_payload') or {})
          print(f'FOUND_IDENTITY: {target}')
          print(f'line={n}')
          print('title=' + str(canonical.get('title') or raw.get('title') or ''))
          print('abstract_present=' + str(bool(canonical.get('abstract') or raw.get('abstract'))))
          print('keywords=' + str(canonical.get('keywords') or raw.get('keywords') or ''))
          PY
