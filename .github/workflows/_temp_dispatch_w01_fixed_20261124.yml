name: TEMP Dispatch fixed W01 November production
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_dispatch_w01_fixed_20261124.yml']
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start fixed W01 with validated branch inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%s)"
          gh workflow run workflow_01_production.yml \
            --repo "$GITHUB_REPOSITORY" --ref workflow01-final-architecture \
            -f workflow00_pointer_path='docs/search_record/zenodo/run-45130154568.json' \
            -f previous_workflow01_pointer_path='docs/deduplication/zenodo/run-40218882441.json' \
            -f model='gpt-5.6-luna' -f auto_threshold='0.95' -f max_llm_cases='5000'
          run=''
          for i in {1..24}; do
            sleep 4
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow workflow_01_production.yml --limit 12 --json databaseId,createdAt,event,headBranch)"
            run="$(STARTED="$started" RUNS="$runs" python3 - <<'PY'
          import json,os,datetime
          started=int(os.environ['STARTED'])
          for x in json.loads(os.environ['RUNS']):
              ts=int(datetime.datetime.fromisoformat(x['createdAt'].replace('Z','+00:00')).timestamp())
              if x['event']=='workflow_dispatch' and x.get('headBranch')=='workflow01-final-architecture' and ts>=started-10:
                  print(x['databaseId']);break
          PY
            )"
            test -z "$run" || break
          done
          test -n "$run"
          echo "NEW_W01_RUN_ID=$run"
          W01_RUN="$run" python3 - <<'PY'
          import os,json,base64,urllib.request
          d={'w01_run_id':int(os.environ['W01_RUN']),'w00_run_id':45130154568,'historical_w01_run_id':40218882441,'source_branch':'workflow01-final-architecture','validation_run_id':45349108217}
          body=json.dumps({'message':'TEMP record fixed W01 production dispatch','content':base64.b64encode(json.dumps(d,indent=2).encode()).decode(),'branch':'workflow01-final-architecture'}).encode()
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/docs/.temp_w01_fixed_dispatch_20261124.json"
          req=urllib.request.Request(url,data=body,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:print("RECEIPT",r.status)
          PY
