name: Workflow 01 - Incremental five-source deduplication extension
# provenance-ordering repair validated on run 35826197664

on:
  workflow_dispatch:
    inputs:
      workflow00_run_ids:
        description: 'Comma-separated Workflow 00 run IDs archived on Zenodo; one ID for normal future runs'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  OLD_BENCHMARK_RUN_ID: '35585544686'
  OLD_UPSTREAM_RUN_ID: '35507378528'
  OLD_RESCORE_RUN_ID: '35711465359'
  LENS_FULL_RUN_ID: '35730574878'
  OPENALEX_FULL_RUN_ID: '35730574878'
  SCOPUS_FULL_RUN_ID: '35731899007'
  AGRICOLA_FULL_RUN_ID: '35735412308'
  WOS_FULL_RUN_ID: '35730574878'

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout deduplication branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-zenodo-source-inputs
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','digest','stringdist','stringi','jsonlite','xml2','httr2'))

      - name: Parse incremental R implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_01_deduplication_build_union.R')
          parse(file='scripts/updater/workflow_01_deduplication_incremental_candidates.R')
          parse(file='scripts/updater/workflow_01_deduplication_incremental_score.R')
          parse(file='scripts/updater/workflow_01_deduplication_merge_clusters.R')
          parse(file='scripts/updater/workflow_02_deduplication_v2_identifier_rescore.R')

      - name: Download preserved 72,941-manifestation corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old_upstream old_benchmark old_decisions
          gh run download "$OLD_UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY"             --name "workflow01-abstract-enrichment-$OLD_UPSTREAM_RUN_ID" --dir old_upstream
          gh run download "$OLD_BENCHMARK_RUN_ID" --repo "$GITHUB_REPOSITORY"             --name "workflow02-deduplication-v2-candidate-benchmark-$OLD_BENCHMARK_RUN_ID" --dir old_benchmark
          gh run download "$OLD_RESCORE_RUN_ID" --repo "$GITHUB_REPOSITORY"             --name "workflow02-deduplication-v2-final-full-rescore-$OLD_RESCORE_RUN_ID" --dir old_decisions
          test -n "$(find old_benchmark -name normalised_metadata.csv -type f -print -quit)"
          test -n "$(find old_benchmark -name scored_sample.csv -type f -print -quit)"
          test -n "$(find old_decisions -name rescored_sample.csv -type f -print -quit)"

      - name: Restore Workflow 00 source harvests from durable Zenodo archives
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          WORKFLOW00_RUN_IDS: ${{ inputs.workflow00_run_ids }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin workflow00-search-orchestrator
          mkdir -p /tmp/workflow00_pointer current current/zenodo_restore_audits

          IFS=',' read -r -a run_ids <<< "$WORKFLOW00_RUN_IDS"
          for raw_id in "${run_ids[@]}"; do
            run_id="$(echo "$raw_id" | xargs)"
            [ -n "$run_id" ] || continue
            pointer="/tmp/workflow00_pointer/run-${run_id}.json"
            git show "origin/workflow00-search-orchestrator:docs/search_record/zenodo/run-${run_id}.json" > "$pointer"
            test -s "$pointer"

            Rscript scripts/updater/workflow_01_restore_workflow00_from_zenodo.R \
              --pointer "$pointer" \
              --output-root current

            cp current/workflow00_zenodo_restore_audit.json \
              "current/zenodo_restore_audits/run-${run_id}.json"
          done

          for source in lens scopus openalex agricola wos; do
            test -d "current/$source"
            test -n "$(find "current/$source" -type f -print -quit)"
          done
          echo "PASS: restored all five Workflow 00 source harvests from durable Zenodo archives"

      - name: Adapt current non-Lens source harvests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adapted/scopus adapted/openalex adapted/agricola adapted/wos
          Rscript scripts/updater/workflow_01s_scopus_sidecar_adapter.R             --input-dir current/scopus/source_child --output-dir adapted/scopus
          Rscript scripts/updater/workflow_01u_openalex_sidecar_adapter.R             --input-dir current/openalex/source_child --output-dir adapted/openalex
          Rscript scripts/updater/workflow_01v_agricola_sidecar_adapter.R             --input-dir current/agricola/source_child --output-dir adapted/agricola
          Rscript scripts/updater/workflow_01w_wos_starter_sidecar_adapter.R             --input-dir current/wos/source_child --output-dir adapted/wos

      - name: Build provenance-safe old-plus-new union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow01_union
          LENS="$(find current/lens -name records.jsonl -type f -print -quit)"
          Rscript scripts/updater/workflow_01_deduplication_build_union.R             --old-dir old_upstream             --current-lens "$LENS"             --current-scopus adapted/scopus/scopus_sidecar_records.jsonl             --current-openalex adapted/openalex/openalex_sidecar_records.jsonl             --current-agricola adapted/agricola/agricola_sidecar_records.jsonl             --current-wos adapted/wos/wos_starter_sidecar_records.jsonl             --output-dir outputs/workflow01_union

      - name: Generate only candidate pairs involving new manifestations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow01_candidates
          OLD_META="$(find old_benchmark -name normalised_metadata.csv -type f -print -quit)"
          Rscript scripts/updater/workflow_01_deduplication_incremental_candidates.R             --lens outputs/workflow01_union/lens_records_for_deduplication.jsonl             --scopus outputs/workflow01_union/scopus_records_for_deduplication.jsonl             --openalex outputs/workflow01_union/openalex_records_for_deduplication.jsonl             --agricola outputs/workflow01_union/agricola_records_for_deduplication.jsonl             --wos outputs/workflow01_union/wos_records_for_deduplication.jsonl             --old-metadata "$OLD_META"             --output-dir outputs/workflow01_candidates             --score-n 1

      - name: Require exact preservation of old metadata indexing
        shell: Rscript {0}
        run: |
          library(data.table)
          old_path <- list.files('old_benchmark',pattern='normalised_metadata\\.csv$',recursive=TRUE,full.names=TRUE)[1]
          old <- fread(old_path,na.strings=c('','NA'))
          cur <- fread('outputs/workflow01_candidates/normalised_metadata.csv',na.strings=c('','NA'))
          stopifnot(nrow(old)==72941L)
          stopifnot(nrow(cur)>=nrow(old))
          stopifnot(identical(old$source,cur$source[seq_len(nrow(old))]))
          stopifnot(identical(old$source_record_id,cur$source_record_id[seq_len(nrow(old))]))
          cat('PASS: first 72,941 metadata rows retain exact prior source-ID indexing\n')

      - name: Score every incremental candidate pair
        shell: bash
        run: |
          set -euo pipefail
          cp "$(find old_benchmark -name scored_sample.csv -type f -print -quit)"              outputs/workflow01_candidates/scored_sample.csv
          mkdir -p outputs/workflow01_incremental_score
          Rscript scripts/updater/workflow_01_deduplication_incremental_score.R             --input-dir outputs/workflow01_candidates             --upstream-dir outputs/workflow01_union             --output-dir outputs/workflow01_incremental_score             --target-n 10000000             --sample-key workflow01-five-source-incremental

      - name: Apply frozen calibrated classifier to incremental pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow01_incremental_rescore
          Rscript scripts/updater/workflow_02_deduplication_v2_identifier_rescore.R             --input-dir outputs/workflow01_incremental_score             --output-dir outputs/workflow01_incremental_rescore             --source-run-id "$OLD_BENCHMARK_RUN_ID"

      - name: Merge preserved and incremental decisions and reconstruct clusters
        shell: bash
        run: |
          set -euo pipefail
          OLD="$(find old_decisions -name rescored_sample.csv -type f -print -quit)"
          Rscript scripts/updater/workflow_01_deduplication_merge_clusters.R             --old-decisions "$OLD"             --new-decisions outputs/workflow01_incremental_rescore/rescored_sample.csv             --metadata outputs/workflow01_candidates/normalised_metadata.csv             --output-dir outputs/workflow01_full_five_source

      - name: Final integrity checks
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(data.table)
          u <- fromJSON('outputs/workflow01_union/union_manifest.json')
          c <- fromJSON('outputs/workflow01_candidates/incremental_summary.json')
          f <- fromJSON('outputs/workflow01_full_five_source/summary.json')
          old <- fread(list.files('old_decisions',pattern='rescored_sample\\.csv$',recursive=TRUE,full.names=TRUE)[1])
          new <- fread('outputs/workflow01_incremental_rescore/rescored_sample.csv')
          stopifnot(u$preserved_prior_manifestations == 72941)
          stopifnot(c$prior_manifestations == 72941)
          stopifnot(nrow(old) == 519917L)
          stopifnot(f$preserved_pair_decisions == 519917L)
          stopifnot(f$incremental_pair_decisions == nrow(new))
          stopifnot(f$source_manifestations == u$union_manifestations)
          stopifnot(file.exists('outputs/workflow01_full_five_source/clusters.jsonl'))
          stopifnot(file.exists('outputs/workflow01_full_five_source/manual_review_pairs.csv'))
          cat(sprintf('PASS: five-source extension complete: %d manifestations, %d new pair decisions, %d manual-review pairs\n',
                      f$source_manifestations,f$incremental_pair_decisions,f$manual_review_pairs))

      - name: Upload recoverable five-source deduplication extension
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow01-five-source-deduplication-extension-${{ github.run_id }}
          path: |
            outputs/workflow01_union/
            outputs/workflow01_candidates/incremental_summary.json
            outputs/workflow01_candidates/incremental_manifestation_inventory.csv
            outputs/workflow01_candidates/normalised_metadata.csv
            outputs/workflow01_candidates/all_candidate_pairs.csv
            outputs/workflow01_incremental_score/
            outputs/workflow01_incremental_rescore/
            outputs/workflow01_full_five_source/
            current/zenodo_restore_audits/
            current/workflow00_zenodo_restore_audit.json
          retention-days: 7
          if-no-files-found: warn
