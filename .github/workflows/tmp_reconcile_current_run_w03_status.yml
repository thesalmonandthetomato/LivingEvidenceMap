name: TEMP reconcile current-run status through W03

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_reconcile_current_run_w03_status.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','readr','httr2','googlesheets4'))

      - name: Reconcile through W03 and sync to Shiny
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs'
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_current_run_status_observer.R --force-stage W03
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          Rscript scripts/updater/workflow_current_run_status_to_shiny.R \
            --status docs/current_run/current_run_status.json \
            --sheet-id "$LEM_GOOGLE_SHEET_ID" \
            --credential "$RUNNER_TEMP/lem-google-service-account.json"

      - name: Commit reconciled status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current_run/current_run_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update current-run status through W03 [skip ci]"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi
