name: W11 ten-paper methods-only extraction
on:
  push:
    branches: [W11-full-text-retrieval]
    paths: ['.github/workflows/w11-methods-only-extraction.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: w11-methods-only-pilot
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: W11-full-text-retrieval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: W11-openalex-availability-39603902230
          run-id: 39603902230
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          name: W11-W07-fulltext-topic-pilot-39635086521
          run-id: 39635086521
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - name: Retrieve the same ten verified XMLs
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          python scripts/W11/topic_alignment_preflight.py --ledger input/canonical_w11_fulltext_availability_ledger.csv --output outputs/W11/methods_pilot --n 10
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path("baseline/sample_manifest.json").read_text())
          now=json.loads(Path("outputs/W11/methods_pilot/sample_manifest.json").read_text())
          identity=lambda arr:[(m["canonical_record_id"],m["xml_sha256"]) for m in arr]
          assert identity(first)==identity(now),"Pilot XML identity or checksum drift"
          print("Verified original ten XML identities and content checksums.")
          PY
      - name: Inspect actual structure of all ten XMLs
        run: |
          python - <<'PY'
          import collections,json,xml.etree.ElementTree as ET
          from pathlib import Path
          def local(tag):return tag.rsplit('}',1)[-1]
          manifest=json.loads(Path('outputs/W11/methods_pilot/sample_manifest.json').read_text())
          report=[]
          for m in manifest:
              root=ET.parse(m['xml_file']).getroot()
              counts=collections.Counter(local(x.tag) for x in root.iter())
              headings=[]
              for el in root.iter():
                  if local(el.tag).lower() in ('head','title','section-title','h1','h2','h3'):
                      txt=' '.join(' '.join(el.itertext()).split())
                      if txt:headings.append({'tag':local(el.tag),'text':txt[:160]})
              bodies=[el for el in root.iter() if local(el.tag).lower()=='body']
              record={'record_id':m['canonical_record_id'],'doi':m['doi'],'root':local(root.tag),'body_count':len(bodies),'tags':counts.most_common(22),'headings':headings[:100],'body_beginning':' '.join(' '.join(bodies[0].itertext()).split())[:400] if bodies else ''}
              report.append(record)
              print(json.dumps(record,ensure_ascii=False),flush=True)
          dest=Path('outputs/W11/methods_pilot/xml_structure_report.json')
          dest.write_text(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Preserve method text, model responses and usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W11-methods-only-${{ github.run_id }}
          path: |
            outputs/W11/methods_pilot/preflight/
            outputs/W11/methods_pilot/extractions/
            outputs/W11/methods_pilot/sample_manifest.json
            outputs/W11/methods_pilot/xml_structure_report.json
          retention-days: 90
          if-no-files-found: warn
