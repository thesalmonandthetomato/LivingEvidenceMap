name: Workflow 00 AGRICOLA recovery

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/workflow_00_agricola_recovery.yml

permissions:
  contents: write
  actions: read

jobs:
  recover-agricola:
    uses: ./.github/workflows/workflow_00_search_orchestrator.yml
    with:
      run_type: full
      lens: false
      scopus: false
      openalex: false
      agricola: true
      wos: false
      additional_farm_term: ''
      resume_run_id: ''
    secrets: inherit
