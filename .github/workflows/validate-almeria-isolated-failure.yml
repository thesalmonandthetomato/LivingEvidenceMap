name: Almeria isolated W00 failure and stale-run test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-almeria-isolated-failure.yml'
permissions:
  contents: read
jobs:
  isolated-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install test dependencies
        shell: Rscript {0}
        run: install.packages(c('googlesheets4','jsonlite'))
      - name: Test failure and stale-run handling in isolated tabs
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-test-creds.json"
          chmod 600 "$RUNNER_TEMP/lem-test-creds.json"
          Rscript scripts/updater/workflow_00_test_isolated_failure.R \
            --sheet-id 1wii1QjB4jM9OzOqboIgZn4z8CAN7W4EAyIKIyGcGjeU \
            --credential "$RUNNER_TEMP/lem-test-creds.json" --review-id almeria-map \
            --run-id "$GITHUB_RUN_ID"
          rm -f "$RUNNER_TEMP/lem-test-creds.json"
