name: Workflow 01 - Validate production orchestration

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/workflow_01_production.yml'
      - '.github/workflows/workflow_01_resume_after_human_review.yml'
      - '.github/workflows/workflow_01_validate_orchestration.yml'
      - 'config/workflow01_source_catalogue.json'
      - 'scripts/updater/workflow_01_build_delta.R'
      - 'scripts/updater/workflow_01_replay_delta.R'
      - 'scripts/updater/workflow_01_restore_current_state.R'
      - 'scripts/updater/workflow_01_merge_cumulative_repairs.R'
      - 'scripts/updater/workflow_01_build_pending_checkpoint.R'
      - 'scripts/updater/workflow_01_archive_pending_checkpoint_to_zenodo.R'
      - 'scripts/updater/workflow_01_restore_pending_checkpoint.R'
      - 'scripts/updater/workflow_01_apply_checkpoint_sources.R'
      - 'scripts/updater/workflow_01_archive_delta_to_zenodo.R'
      - 'scripts/updater/workflow_01_build_canonical_jsonl.R'
      - 'scripts/updater/workflow_01_prepare_source_catalogue.R'
      - 'scripts/updater/workflow_01_restore_manual_ris_from_zenodo.R'
      - 'scripts/updater/workflow_01_source_identity_filter.R'
      - 'scripts/updater/workflow_01_deduplication_build_union.R'
      - 'scripts/updater/workflow_01_deduplication_incremental_candidates.R'
      - 'scripts/updater/workflow_01_deduplication_incremental_score.R'
      - 'scripts/updater/workflow_01_apply_adjudications_and_recluster.R'

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Workflow 01 branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install validation dependencies
        shell: Rscript {0}
        run: install.packages(c('yaml','jsonlite'))

      - name: Parse production YAML
        shell: Rscript {0}
        run: |
          library(yaml)
          files <- c(
            '.github/workflows/workflow_01_production.yml',
            '.github/workflows/workflow_01_resume_after_human_review.yml'
          )
          for (f in files) {
            x <- yaml.load_file(f)
            stopifnot(is.list(x), !is.null(x$name), !is.null(x$jobs))
            cat(sprintf('PASS YAML: %s\n', f))
          }

      - name: Validate Workflow 01 source catalogue
        shell: Rscript {0}
        run: |
          library(jsonlite)
          x <- fromJSON('config/workflow01_source_catalogue.json', simplifyVector=FALSE)
          stopifnot(
            identical(x$schema, 'living-evidence-map-workflow01-source-catalogue-v1'),
            is.list(x$sources),
            length(x$sources) >= 5L,
            all(vapply(x$sources, function(z) !is.null(z$kind) && !is.null(z$prepared_path), logical(1)))
          )
          cat(sprintf('PASS source catalogue: %d sources\n', length(x$sources)))

      - name: Parse Workflow 01 generic R implementation
        shell: Rscript {0}
        run: |
          files <- c(
            'scripts/updater/workflow_01_build_delta.R',
            'scripts/updater/workflow_01_replay_delta.R',
            'scripts/updater/workflow_01_restore_current_state.R',
            'scripts/updater/workflow_01_merge_cumulative_repairs.R',
            'scripts/updater/workflow_01_build_pending_checkpoint.R',
            'scripts/updater/workflow_01_archive_pending_checkpoint_to_zenodo.R',
            'scripts/updater/workflow_01_restore_pending_checkpoint.R',
            'scripts/updater/workflow_01_apply_checkpoint_sources.R',
            'scripts/updater/workflow_01_archive_delta_to_zenodo.R',
            'scripts/updater/workflow_01_build_canonical_jsonl.R',
            'scripts/updater/workflow_01_prepare_source_catalogue.R',
            'scripts/updater/workflow_01_restore_manual_ris_from_zenodo.R',
            'scripts/updater/workflow_01_source_identity_filter.R',
            'scripts/updater/workflow_01_deduplication_build_union.R',
            'scripts/updater/workflow_01_deduplication_incremental_candidates.R',
            'scripts/updater/workflow_01_deduplication_incremental_score.R',
            'scripts/updater/workflow_01_apply_adjudications_and_recluster.R'
          )
          for (f in files) {
            parse(file=f)
            cat(sprintf('PASS R parse: %s\n', f))
          }
