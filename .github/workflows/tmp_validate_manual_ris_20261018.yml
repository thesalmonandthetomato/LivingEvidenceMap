name: Temporary validate October RIS expansions
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_validate_manual_ris_20261018.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))
      - name: Read published Zenodo records and validate raw RIS (read-only)
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: Rscript {0}
        run: |
          library(httr2);library(jsonlite)
          token <- Sys.getenv("ZENODO_ACCESS_TOKEN")
          stopifnot(nzchar(token))
          for (source in c("cab","proquest")) {
            reg <- if(source=="cab") "user_input/workflow00_ris_cab_mariculture_2026-10-18.json" else "user_input/workflow00_ris_proquest_mariculture_2026-10-18.json"
            x <- fromJSON(reg,simplifyVector=FALSE)
            id <- x$staging$deposition_id
            req <- function(url) request(url) |> req_headers(Authorization=paste("Bearer",token)) |> req_timeout(120)
            z <- req("https://zenodo.org/api/records/" |> paste0(id)) |> req_perform() |> resp_body_json(simplifyVector=FALSE)
            cat("Published record",source,id,"doi",z$doi,"\n")
            stopifnot(identical(as.character(z$doi),as.character(x$staging$reserved_doi)))
            entries <- z$files
            if(is.null(entries)) {
              listing <- req(paste0("https://zenodo.org/api/records/",id,"/files")) |> req_perform() |> resp_body_json(simplifyVector=FALSE)
              entries <- listing$entries
            }
            keys <- vapply(entries,function(v) as.character(v$key),character(1))
            keep <- grepl("\\.ris$",keys,ignore.case=TRUE)
            stopifnot(any(keep))
            directory <- file.path("outputs/ris_validation",source,"raw")
            dir.create(directory,recursive=TRUE,showWarnings=FALSE)
            for (j in which(keep)) {
              f <- entries[[j]]
              url <- if(!is.null(f$links$content)) f$links$content else paste0("https://zenodo.org/api/records/",id,"/files/",URLencode(f$key,reserved=TRUE),"/content")
              bytes <- req(url) |> req_timeout(1800) |> req_perform() |> resp_body_raw()
              writeBin(bytes,file.path(directory,basename(f$key)))
            }
            x$input$files <- lapply(keys[keep],function(k) list(filename=basename(k)))
            x$input$expected_chunk_count <- sum(keep)
            live_registry <- file.path("outputs/ris_validation",source,"source_registry.json")
            write_json(x,live_registry,auto_unbox=TRUE,pretty=TRUE,null="null")
            cmd <- c("scripts/updater/workflow_00_ris_ingestion.R",unlist(lapply(file.path(directory,basename(keys[keep])),function(f)c("--ris",shQuote(f)))), "--registry",shQuote(live_registry),"--output-dir",shQuote(file.path("outputs/ris_validation",source,"parsed")))
            rc <- system2(file.path(R.home("bin"),"Rscript"),cmd)
            stopifnot(rc==0L)
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: october-ris-validation
          path: outputs/ris_validation/
          retention-days: 7
          if-no-files-found: warn
