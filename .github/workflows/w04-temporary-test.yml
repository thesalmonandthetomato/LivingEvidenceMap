name: W04 temporary handoff test
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w04-temporary-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))
      - name: Test W03 exclusions and incremental screening
        shell: Rscript {0}
        run: |
          library(jsonlite)
          t <- file.path(Sys.getenv('RUNNER_TEMP'),'w04')
          dir.create(t)
          put <- function(x,p) writeLines(vapply(x,function(y)toJSON(y,auto_unbox=TRUE,null='null'),character(1)),file.path(t,p))
          mk <- function(id,title) list(identity=list(record_id=id),canonical=list(title=title,abstract='Example abstract'))
          old <- list(mk('stable','Stable study'),mk('changed','Old title'))
          current <- c(old,list(mk('new','New study'),mk('retracted','Retraction notice')))
          current[[2]]$canonical$title <- 'Revised title'
          put(old,'prior_canonical.jsonl')
          put(current,'canonical.jsonl')
          put(lapply(current,function(r)list(record_id=r$identity$record_id,publication_status=list(exclude_from_workflow04=r$identity$record_id=='retracted'))),'w03.jsonl')
          put(lapply(old,function(r)list(record_id=r$identity$record_id,screening=list(decision='retain'))),'prior_w04.jsonl')
          cmd <- c('scripts/updater/workflow_04_prepare_incremental.R','--canonical',file.path(t,'canonical.jsonl'),'--workflow03-status',file.path(t,'w03.jsonl'),'--prior-workflow04',file.path(t,'prior_w04.jsonl'),'--prior-canonical',file.path(t,'prior_canonical.jsonl'),'--output-dir',file.path(t,'out'))
          stopifnot(system2('Rscript',cmd)==0L)
          m <- fromJSON(file.path(t,'out/prepare_manifest.json'))
          stopifnot(m$workflow03_excluded==1L,m$reusable_records==1L,m$screen_queue_records==2L,m$new_record_ids==1L,m$existing_records_refreshed==1L)
          stopifnot(identical(sort(readLines(file.path(t,'out/screen_queue_record_ids.txt'))),c('changed','new')))
          stopifnot(identical(readLines(file.path(t,'out/reused_record_ids.txt')),'stable'))
          put(lapply(current[-4],function(r)list(record_id=r$identity$record_id,publication_status=list(exclude_from_workflow04=FALSE))),'incomplete.jsonl')
          cmd[match('--workflow03-status',cmd)+1L] <- file.path(t,'incomplete.jsonl')
          cmd[match('--output-dir',cmd)+1L] <- file.path(t,'bad')
          stopifnot(system2('Rscript',cmd)==1L)
          cat('PASS: W03 exclusion, W04 reuse, rescreening and identity guards\n')
