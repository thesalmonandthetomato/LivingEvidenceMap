name: TEMP validate W00 EBSCO scoping integration

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_validate_w00_ebsco_scoping.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','xml2'))

      - name: Parse W00 EBSCO implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_00_validate_scoping_search.R')
          parse(file='scripts/updater/workflow_00_search_scope_counts.R')
          parse(file='scripts/updater/workflow_00_search_orchestrator.R')
          parse(file='scripts/updater/workflow_00_resolve_source_selection.R')
          parse(file='scripts/updater/workflow_00g_ebsco_ingestion.R')
          parse(file='scripts/updater/workflow_00_ebsco_native_id_reconcile.R')
          cat('PASS: W00 EBSCO/scoping implementation parses\n')

      - name: Generate complete scoping query plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/w00_ebsco_validation
          Rscript scripts/updater/workflow_00_validate_scoping_search.R \
            --input user_input/scoping_search_string.txt \
            --ebsco-config config/workflow00_ebsco_sources.json \
            --output outputs/w00_ebsco_validation/search_plan.json

      - name: Assert 17 EBSCO plus 9 non-EBSCO source queries
        shell: Rscript {0}
        run: |
          library(jsonlite)
          p <- fromJSON('outputs/w00_ebsco_validation/search_plan.json', simplifyVector=FALSE)
          e <- fromJSON('config/workflow00_ebsco_sources.json', simplifyVector=FALSE)
          qn <- names(p$source_queries)
          ebsco <- names(e$sources)
          non <- c('lens','scopus','openalex','agricola','pubmed','ethos','cba','epmc_preprints','wos')
          stopifnot(length(ebsco)==17L)
          stopifnot(all(ebsco %in% qn))
          stopifnot(all(non %in% qn))
          stopifnot(length(qn)==26L)
          stopifnot(length(unique(qn))==26L)
          for (src in ebsco) {
            fields <- unlist(e$sources[[src]]$search_fields,use.names=FALSE)
            query <- as.character(p$source_queries[[src]])
            stopifnot(nzchar(query), all(vapply(fields,function(tag) grepl(paste0(tag,' ('),query,fixed=TRUE),logical(1))))
          }
          cat('PASS: scoping plan contains 17 field-aware EBSCO queries + 9 non-EBSCO queries\n')

      - name: Validate all W00 source groups resolve without duplication
        env:
          W00_GROUP_CORE_MULTIDISCIPLINARY: 'true'
          W00_GROUP_HEALTH_MEDICINE: 'true'
          W00_GROUP_ENVIRONMENT_AGRICULTURE: 'true'
          W00_GROUP_SOCIAL_SCIENCES: 'true'
          W00_GROUP_EDUCATION: 'true'
          W00_GROUP_REGIONAL: 'true'
          W00_GROUP_MEDIA_COMMUNICATION: 'true'
          W00_GROUP_HUMANITIES: 'true'
          W00_GROUP_SPORT_TOURISM: 'true'
          W00_GROUP_GREY_PREPRINTS: 'true'
          W00_ADDITIONAL_SOURCES: ''
          W00_EXCLUDE_SOURCES: ''
          GITHUB_RUN_ID: 'validation'
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_resolve_source_selection.R \
            --run-type full \
            --output outputs/w00_ebsco_validation/source_selection.json \
            --ebsco-config config/workflow00_ebsco_sources.json \
            --group-config config/workflow00_source_groups.json
          Rscript -e "x<-jsonlite::fromJSON('outputs/w00_ebsco_validation/source_selection.json');stopifnot(x\$selected_source_count==26L,length(unique(x\$selected_sources))==26L,sum(grepl('^ebsco_',x\$selected_sources))==17L);cat('PASS: all W00 groups resolve to 26 unique sources\n')"

      - name: Live count-only EBSCO scoping smoke test
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(httr2);library(jsonlite);library(xml2)})
          uid <- Sys.getenv('EBSCO_EHOST_UID')
          pwd <- Sys.getenv('EBSCO_EHOST_PWD')
          stopifnot(nzchar(uid),nzchar(pwd))
          plan <- fromJSON('outputs/w00_ebsco_validation/search_plan.json',simplifyVector=FALSE)
          cfg <- fromJSON('config/workflow00_ebsco_sources.json',simplifyVector=FALSE)
          reps <- c('ebsco_medline','ebsco_cinahl','ebsco_psycinfo','ebsco_econlit','ebsco_africa_wide','ebsco_waters_oceans')
          out <- lapply(reps,function(src) {
            db <- as.character(cfg$sources[[src]]$db_code)
            query <- as.character(plan$source_queries[[src]])
            req <- request('https://eit.ebscohost.com/Services/SearchService.asmx/Search') |>
              req_url_query(prof=uid,pwd=pwd,authType='profile',db=db,query=query,format='detailed',startrec='1',numrec='1') |>
              req_timeout(120) |>
              req_error(is_error=function(resp) FALSE)
            resp <- req_perform(req)
            stopifnot(resp_status(resp)==200L)
            doc <- read_xml(resp_body_raw(resp))
            vals <- suppressWarnings(as.integer(trimws(xml_text(xml_find_all(doc,"//*[local-name()='Hits']")))))
            vals <- vals[!is.na(vals)]
            stopifnot(length(vals)>=1L,vals[[1L]]>=0L)
            data.frame(source=src,database_code=db,hits=vals[[1L]],stringsAsFactors=FALSE)
          })
          out <- do.call(rbind,out)
          write.csv(out,'outputs/w00_ebsco_validation/ebsco_live_counts.csv',row.names=FALSE)
          print(out)
          cat('PASS: representative EBSCO databases returned live count-only scoping responses\n')

      - name: Assert production child routes EBSCO through shared harvester
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ebsco_\*)' .github/workflows/_workflow_00_orchestrated_source_child.yml
          grep -q 'workflow_00g_ebsco_ingestion.R' .github/workflows/_workflow_00_orchestrated_source_child.yml
          grep -q 'workflow_00_ebsco_native_id_reconcile.R' .github/workflows/_workflow_00_orchestrated_source_child.yml
          echo 'PASS: production W00 child routes EBSCO harvest and native-ID reconciliation'

      - uses: actions/upload-artifact@v4
        with:
          name: w00-ebsco-scoping-validation-${{ github.run_id }}
          path: outputs/w00_ebsco_validation/
          retention-days: 7
          if-no-files-found: error
