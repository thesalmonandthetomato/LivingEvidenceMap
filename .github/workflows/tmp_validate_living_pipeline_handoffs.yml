name: TEMP validate living pipeline handoffs
# rerun after W10 fixed-count cleanup

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_living_pipeline_handoffs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install validator dependencies
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Validate current upstream pointers fail closed
        shell: Rscript {0}
        run: |
          read <- function(p) paste(readLines(p,warn=FALSE),collapse="\n")
          w2 <- read('.github/workflows/workflow_02_production.yml')
          stopifnot(!grepl("inputs.workflow01_pointer_path \\|\\|",w2))
          stopifnot(!grepl("run-36128255337",w2))

          w3 <- read('.github/workflows/workflow_03_production.yml')
          stopifnot(!grepl("run-36166883249",sub("prior.*","",w3),fixed=FALSE))
          stopifnot(!grepl("inputs.lean_pointer_path \\|\\|",w3))

          for(p in c('.github/workflows/workflow_04_production.yml',
                     '.github/workflows/workflow_05_production.yml',
                     '.github/workflows/workflow_06_production.yml',
                     '.github/workflows/workflow_07_production.yml')){
            x <- readLines(p,warn=FALSE)
            current <- grep("description:.*[Cc]urrent|description:.*Authoritative current|description:.*post-W02",x,value=FALSE)
            for(i in current){
              block <- x[i:min(length(x),i+4L)]
              stopifnot(any(grepl("required: true",block,fixed=TRUE)))
              stopifnot(!any(grepl("default: 'docs/",block,fixed=TRUE)))
            }
          }
          cat('PASS: current upstream pointers fail closed\n')

      - name: Validate W07 fallback and W08 user inputs
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          x <- readLines('scripts/updater/workflow_07_prepare_incremental.R',warn=FALSE)
          stopifnot(any(grepl('arg("--ontology","user_input/workflow07_topic_ontology.csv")',x,fixed=TRUE)))
          stopifnot(!any(grepl('data/reference/topic_ontology_v3_6.csv',x,fixed=TRUE)))

          cfg <- fromJSON('user_input/workflow05_coding_config.json',simplifyVector=FALSE)
          expected <- c(
            "Atlantic salmon"="SAL_SALAR","Rainbow trout"="ONC_MYKISS",
            "Chinook salmon"="ONC_TSHAWYTSCHA","Coho salmon"="ONC_KISUTCH",
            "Sockeye salmon"="ONC_NERKA","Chum salmon"="ONC_KETA",
            "Pink salmon"="ONC_GORBUSCHA","Masu salmon"="ONC_MASOU",
            "Unspecified species"="UNSPEC_SALMON")
          actual <- unlist(cfg$code_map,use.names=TRUE)
          stopifnot(identical(actual,expected))

          review <- fromJSON('user_input/workflow08_human_review_config.json',simplifyVector=FALSE)
          stopifnot(identical(review$species_config_path,'user_input/workflow05_coding_config.json'))
          stopifnot(nzchar(review$reviewer_full_name),nzchar(review$reviewer_short_name),nzchar(review$ontology_label))

          parse(file='scripts/updater/workflow_08_finalize_canonical_dynamic.R')
          parse(file='scripts/updater/workflow_08_build_review_package.R')
          parse(file='scripts/updater/workflow_08_archive_to_zenodo.R')
          cat('PASS: W07/W08 configuration migration validates\n')

      - name: Validate W08 registry update contract
        shell: Rscript {0}
        run: |
          reg <- read.csv('docs/workflow08/zenodo_registry.csv',stringsAsFactors=FALSE)
          req <- c('source_run_id','zenodo_record_id','doi','canonical_sha256',
                   'exclusions_sha256','status','supersedes_zenodo_record_id','published_at_utc')
          stopifnot(all(req %in% names(reg)))
          stopifnot(sum(reg$status=='authoritative')==1L)
          x <- paste(readLines('.github/workflows/workflow_08_production.yml',warn=FALSE),collapse='\n')
          stopifnot(grepl('reg$status[reg$status=="authoritative"] <- "superseded"',x,fixed=TRUE))
          stopifnot(grepl('status="authoritative"',x,fixed=TRUE))
          stopifnot(grepl('--supersedes-record-id',x,fixed=TRUE))
          cat('PASS: W08 future publication registry contract validates\n')

      - name: Validate W09-W10 dynamic handoff
        shell: Rscript {0}
        run: |
          files <- c('.github/workflows/workflow_10_dashboard.yml',
                     'R/workflow_10_dashboard_from_canonical_jsonl.R',
                     'scripts/updater/workflow_10_restore_canonical_from_zenodo.R')
          txt <- paste(unlist(lapply(files,readLines,warn=FALSE)),collapse='\n')
          forbidden <- c('23020526','19117L','32292L','32283L','90137L',
                         '2026-09-22','data/reference/topic_ontology_v3_6.csv')
          for(z in forbidden) stopifnot(!grepl(z,txt,fixed=TRUE))
          stopifnot(grepl('pointer$canonical_records',txt,fixed=TRUE))
          stopifnot(grepl('flow$counts$combined_search_results',txt,fixed=TRUE))
          stopifnot(grepl('flow$counts$deduplicated_records',txt,fixed=TRUE))
          stopifnot(grepl('flow$counts$title_abstract_screened',txt,fixed=TRUE))
          w9 <- paste(readLines('.github/workflows/report_workflow09_figures.yml',warn=FALSE),collapse='\n')
          flow <- paste(readLines('visualisations/07_flow_diagram.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('search_update_date:',w9,fixed=TRUE))
          stopifnot(grepl('SEARCH_UPDATE_DATE',flow,fixed=TRUE))
          stopifnot(grepl('search_update_date = if (nzchar(search_update_date)) search_update_date else NULL',flow,fixed=TRUE))
          parse(file='visualisations/07_flow_diagram.R')
          parse(file='R/workflow_10_dashboard_from_canonical_jsonl.R')
          parse(file='scripts/updater/workflow_10_restore_canonical_from_zenodo.R')
          cat('PASS: W09-W10 handoff is dynamically bound to current state\n')
