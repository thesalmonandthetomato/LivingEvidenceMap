name: W08 temporary canonical finalisation regression
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w08-temporary-finalisation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install test packages
        shell: Rscript {0}
        run: install.packages(c("jsonlite","readr","digest"))
      - name: Check canonical finalisation and partition
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(readr)
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w08-final")
          dir.create(t)
          ids<-c("keep","manual","screened")
          records<-lapply(ids,function(id)list(identity=list(record_id=id),bibliography=list(title=paste("Title",id)),provenance=list(origin="synthetic"),custom_unmodified=list(source_id=paste0("src-",id))))
          writejl<-function(rows,file)writeLines(vapply(rows,function(z)toJSON(z,auto_unbox=TRUE,null="null",na="null",digits=NA),character(1)),file)
          writejl(records,file.path(t,"canonical.jsonl"))
          w03<-lapply(ids,function(id)list(record_id=id,publication_status=list(code="ARTICLE",exclude_from_workflow04=FALSE)))
          writejl(w03,file.path(t,"w03.jsonl"))
          w04<-lapply(ids,function(id)list(record_id=id,screening=list(decision=if(id=="screened")"exclude" else "retain")))
          writejl(w04,file.path(t,"w04.jsonl"))
          w05<-data.frame(record_id=c("keep","manual"),farmed_species_codes="ATL",farmed_species="Atlantic salmon")
          w06<-data.frame(record_id=c("keep","manual"),geography_status="RESOLVED",luna_iso3c=c("NOR","INN"),luna_country_names=c("Norway","India"),luna_evidence="Source",geography_reason="",llm_failed=FALSE)
          qc<-data.frame(record_id=c("keep","manual"),workflow08_reason="")
          matches<-data.frame(record_id=character(),matched_term=character())
          scores<-data.frame(record_id=character(),path_id=character(),retained_for_analysis=logical())
          late<-data.frame(record_id=character())
          onto<-data.frame(path_id="TOP1",hierarchy_path="Topic",level_1="Topic",level_2="Example")
          for(n in c("w05","w06","qc","matches","scores","late","onto"))write_csv(get(n),file.path(t,paste0(n,".csv")))
          decision<-list(review_key="manual::geography_evidence_unvalidated",record_id="manual",issue_type="geography_evidence_unvalidated",decision="override_country_set",final_value=list(geography_status="RESOLVED",iso3c=c("IND"),country_names=c("India")),rationale="Validated country")
          writejl(list(decision),file.path(t,"decisions.jsonl"))
          args<-c("scripts/updater/workflow_08_finalize_canonical_dynamic.R","--canonical",file.path(t,"canonical.jsonl"),"--w03",file.path(t,"w03.jsonl"),"--w04",file.path(t,"w04.jsonl"),"--w05",file.path(t,"w05.csv"),"--w05-matches",file.path(t,"matches.csv"),"--w06",file.path(t,"w06.csv"),"--w07-scores",file.path(t,"scores.csv"),"--w07-qc",file.path(t,"qc.csv"),"--w07-late-exclusions",file.path(t,"late.csv"),"--decisions",file.path(t,"decisions.jsonl"),"--ontology",file.path(t,"onto.csv"),"--output",file.path(t,"assembled.jsonl"),"--ledger",file.path(t,"ledger.jsonl"),"--manifest",file.path(t,"manifest.json"))
          stopifnot(system2("Rscript",args)==0L)
          out<-lapply(readLines(file.path(t,"assembled.jsonl")),fromJSON,simplifyVector=FALSE)
          stopifnot(length(out)==3L)
          for(i in seq_along(out))stopifnot(identical(out[[i]]$bibliography,records[[i]]$bibliography),identical(out[[i]]$custom_unmodified,records[[i]]$custom_unmodified),identical(out[[i]]$provenance$origin,"synthetic"))
          stopifnot(identical(out[[1]]$geography$iso3c,"NOR"),identical(out[[2]]$geography$iso3c,"IND"))
          stopifnot(isTRUE(out[[1]]$screening$final_included),isTRUE(out[[2]]$screening$final_included),isFALSE(out[[3]]$screening$final_included))
          manifest<-fromJSON(file.path(t,"manifest.json"))
          stopifnot(manifest$final_included_records==2L,manifest$final_excluded_records==1L)
          args2<-c("scripts/updater/workflow_08_partition_final_outputs_dynamic.R","--assembled",file.path(t,"assembled.jsonl"),"--old-manifest",file.path(t,"manifest.json"),"--canonical-output",file.path(t,"included.jsonl"),"--exclusions-output",file.path(t,"excluded.csv"),"--manifest-output",file.path(t,"final-manifest.json"))
          stopifnot(system2("Rscript",args2)==0L)
          stopifnot(length(readLines(file.path(t,"included.jsonl")))==2L)
          ex<-read_csv(file.path(t,"excluded.csv"),show_col_types=FALSE)
          stopifnot(nrow(ex)==1L,identical(ex$record_id,"screened"))
          cat("PASS: finalisation and partition, protected fields preserved\n")
