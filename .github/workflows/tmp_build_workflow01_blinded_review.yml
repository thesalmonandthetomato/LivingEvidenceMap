name: Workflow 01 - Build blinded human review package

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_build_workflow01_blinded_review.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35968951674'
  SOURCE_ARTIFACT: 'workflow01-llm-adjudication-complete-35968951674'
  SAMPLE_SEED: 'workflow01-validation-v1-2026-09-24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))

      - name: Download completed LLM adjudication state
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Build blinded human review and validation sets
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_build_blinded_human_validation.R \
            --input source/all_adjudications.jsonl \
            --output-dir outputs/blinded_review \
            --seed "$SAMPLE_SEED" \
            --n-per-class 20

      - name: Validate outputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          h <- readLines('outputs/blinded_review/human_review_132_blinded.jsonl',warn=FALSE)
          v <- readLines('outputs/blinded_review/validation_sample_40_blinded.jsonl',warn=FALSE)
          stopifnot(length(h)==132L,length(v)==40L)
          hx <- lapply(h,fromJSON,simplifyVector=FALSE)
          vx <- lapply(v,fromJSON,simplifyVector=FALSE)
          forbidden <- c('model_decision','model_confidence','model_rationale','promotion','promotion_reason')
          stopifnot(all(vapply(c(hx,vx),function(z)!any(forbidden %in% names(z)),logical(1))))
          stopifnot(!anyDuplicated(vapply(vx,function(z)z$review_case_id,character(1))))
          cat('PASS: blinded package contains 132 unresolved + 40 validation cases\n')

      - name: Upload blinded review package
        uses: actions/upload-artifact@v4
        with:
          name: workflow01-blinded-human-review-${{ github.run_id }}
          path: outputs/blinded_review/
          retention-days: 7
          if-no-files-found: error
