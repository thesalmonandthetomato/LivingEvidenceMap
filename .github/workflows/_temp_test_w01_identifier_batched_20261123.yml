name: TEMP W01 identifier batch equivalence validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_test_w01_identifier_batched_20261123.yml']
permissions:
  contents: write
jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install test dependencies
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite"))
      - name: Generate deterministic fixture and compare original against optimized output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p /tmp/w01_id
            git show 005d01ada7a4e7be326e77716784a7da7cc73ac9:scripts/updater/workflow_01_identifier_assist_build.R > /tmp/w01_id/original.R
            Rscript - <<'RS'
          library(jsonlite)
          dir.create("/tmp/w01_id/fixture",recursive=TRUE)
          sources<-c("lens","scopus","openalex","wos","cab")
          records<-list()
          metadata<-list()
          ii<-0L
          # 150 reproducible records; cross-source shared DOIs plus source-only IDs.
          for(src in sources) {
            out<-character(30)
            for(j in seq_len(30)) {
              ii<-ii+1L
              key<-paste0(src,"-",j)
              doi<-if(j<=12L) paste0("10.1234/shared",j) else paste0("10.1234/",src,j)
              ident<-if(src=="lens") list(source=list(provider="lens"),
                identity=list(lens_id=key),bibliography=list(title=paste("Study",j)),
                lens=if(j%%2L==0L) list(raw_payload=list(external_ids=list(list(type="doi",value=doi)))) else NULL) else
                list(source=list(provider=src),
                     sidecar_identity=list(sidecar_record_id=key,doi=doi),
                     mapped_fields=list(doi=doi))
              out[[j]]<-toJSON(ident,auto_unbox=TRUE,null="null")
              metadata[[ii]]<-data.frame(idx=ii,source=src,source_record_id=key,
                title_norm=paste0("study ",j),doi_norm=doi,year=2024L,
                stringsAsFactors=FALSE)
            }
            p<-file.path("/tmp/w01_id/fixture",paste0(src,".jsonl"))
            writeLines(out,p)
            records[[src]]<-p
          }
          write.csv(do.call(rbind,metadata),"/tmp/w01_id/fixture/metadata.csv",row.names=FALSE,na="")
          write_json(list(schema="living-evidence-map-workflow01-source-inputs-v1",sources=records),
                     "/tmp/w01_id/fixture/manifest.json",auto_unbox=TRUE,pretty=TRUE)
          write.csv(data.frame(identifier_type="doi",identifier_value="10.1234/never"),"/tmp/w01_id/fixture/guards.csv",row.names=FALSE)
          RS
            Rscript /tmp/w01_id/original.R \
              --input-manifest /tmp/w01_id/fixture/manifest.json \
              --metadata /tmp/w01_id/fixture/metadata.csv \
              --guard-file /tmp/w01_id/fixture/guards.csv \
              --prior-manifestations 75 \
              --output-dir /tmp/w01_id/old
            Rscript scripts/updater/workflow_01_identifier_assist_build.R \
              --input-manifest /tmp/w01_id/fixture/manifest.json \
              --metadata /tmp/w01_id/fixture/metadata.csv \
              --guard-file /tmp/w01_id/fixture/guards.csv \
              --prior-manifestations 75 \
              --output-dir /tmp/w01_id/new
            Rscript - <<'RS'
          library(jsonlite)
          old<-"/tmp/w01_id/old"; new<-"/tmp/w01_id/new"
          files<-c("identifier_registry.csv","identifier_coverage.csv","shared_identifier_groups.csv",
                   "identifier_candidate_pairs.csv","safe_identifier_edges.csv")
          for(nm in files) {
            a<-read.csv(file.path(old,nm),check.names=FALSE,stringsAsFactors=FALSE)
            b<-read.csv(file.path(new,nm),check.names=FALSE,stringsAsFactors=FALSE)
            stopifnot(identical(names(a),names(b)),nrow(a)==nrow(b))
            sort_rows<-function(d){
              if(!nrow(d))return(character())
              sort(apply(d,1L,function(r)paste(ifelse(is.na(r),"<NA>",r),collapse="\\t")))
            }
            stopifnot(identical(sort_rows(a),sort_rows(b)))
            cat(sprintf("PASS_EQUIVALENCE %s rows=%d\n",nm,nrow(a)))
          }
          a<-fromJSON(file.path(old,"identifier_assist_summary.json"))
          b<-fromJSON(file.path(new,"identifier_assist_summary.json"))
          stopifnot(identical(a,b))
          cat("PASS_AUDIT_JSON_IDENTICAL\n")
          RS
            # Larger input checks bounded registry memory behaviour without invoking
            # old quadratic per-identifier allocation on production-sized data.
            Rscript - <<'RS'
          library(jsonlite)
          src<-"/tmp/w01_id/fixture/scopus_stress.jsonl"
          con<-file(src,"wt")
          for(i in seq_len(22000L)) {
            r<-list(source=list(provider="scopus"),
              sidecar_identity=list(sidecar_record_id=paste0("stress:",i),doi=paste0("10.9999/stress",i)),
              mapped_fields=list(doi=paste0("10.9999/stress",i)))
            writeLines(toJSON(r,auto_unbox=TRUE),con)
          }
          close(con)
          meta<-data.frame(idx=seq_len(22000L),source="scopus",source_record_id=paste0("stress:",seq_len(22000L)),
            title_norm=paste0("unique title ",seq_len(22000L)),doi_norm=paste0("10.9999/stress",seq_len(22000L)),
            year=2024L)
          write.csv(meta,"/tmp/w01_id/fixture/metadata_stress.csv",row.names=FALSE)
          write_json(list(schema="living-evidence-map-workflow01-source-inputs-v1",sources=list(scopus=src)),
                     "/tmp/w01_id/fixture/manifest_stress.json",auto_unbox=TRUE)
          RS
            /usr/bin/time -v Rscript scripts/updater/workflow_01_identifier_assist_build.R \
              --input-manifest /tmp/w01_id/fixture/manifest_stress.json \
              --metadata /tmp/w01_id/fixture/metadata_stress.csv \
              --guard-file /tmp/w01_id/fixture/guards.csv \
              --prior-manifestations 10000 \
              --output-dir /tmp/w01_id/stress
            echo 'ALL_IDENTIFIER_BATCH_TESTS_PASS'
          ) > /tmp/w01_id_validation.log 2>&1
          code=$?
          cat /tmp/w01_id_validation.log
          EXIT_CODE="$code" python3 - <<'PY'
          import os,json,base64,urllib.request
          result={"exit_code":int(os.environ["EXIT_CODE"]),"log":open("/tmp/w01_id_validation.log").read()[-19000:]}
          body=json.dumps({"message":"TEMP W01 identifier batching equivalence results","content":base64.b64encode(json.dumps(result,indent=2).encode()).decode(),"branch":"workflow01-final-architecture"}).encode()
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/docs/.temp_w01_identifier_batch_results_20261123.json"
          r=urllib.request.Request(url,data=body,method="PUT",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(r,timeout=30) as z:print("RECEIPT_UPLOADED",z.status)
          PY
          exit "$code"
