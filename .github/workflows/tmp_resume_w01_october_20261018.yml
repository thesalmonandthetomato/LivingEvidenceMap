name: Temporary resume W01 after October RIS ingestion
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_resume_w01_october_20261018.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch accepted W00 batch to W01
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run workflow_01_production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref workflow01-final-architecture \
            -f workflow00_pointer_path=docs/search_record/zenodo/run-39127932051.json \
            -f previous_workflow01_pointer_path=docs/deduplication/zenodo/run-37608813159.json \
            -f model=gpt-5.6-luna \
            -f auto_threshold=0.95 \
            -f max_llm_cases=5000
          echo "W01 dispatch accepted"
