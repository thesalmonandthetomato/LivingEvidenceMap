name: TEMP W01 risky identifier group audit

on:
  push:
    branches:
      - w01-identifier-assist-test
    paths:
      - '.github/workflows/tmp_w01_identifier_risky_group_audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-identifier-assist-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependency
        shell: Rscript {0}
        run: install.packages('data.table')

      - name: Download benchmark and validation artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w01_risk/benchmark /tmp/w01_risk/validation /tmp/w01_risk/out
          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11220721964/zip"             > /tmp/w01_risk/benchmark.zip
          unzip -q /tmp/w01_risk/benchmark.zip -d /tmp/w01_risk/benchmark
          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11221144798/zip"             > /tmp/w01_risk/validation.zip
          unzip -q /tmp/w01_risk/validation.zip -d /tmp/w01_risk/validation

      - name: Audit risky identifier groups
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_identifier_risky_group_audit.R             --validation /tmp/w01_risk/validation/single_family_external_validation.csv             --pairs /tmp/w01_risk/benchmark/different_cluster_identifier_pairs.csv             --registry /tmp/w01_risk/benchmark/identifier_registry.csv             --output-dir /tmp/w01_risk/out
          cat /tmp/w01_risk/out/risky_group_summary.csv

      - name: Assert read-only scope
        shell: Rscript {0}
        run: |
          library(data.table)
          x <- fread('/tmp/w01_risk/out/risky_pairs_with_group_stats.csv')
          g <- fread('/tmp/w01_risk/out/risky_identifier_groups.csv')
          stopifnot(nrow(x)==363L)
          stopifnot(nrow(g)>0L)
          cat('PASS: risky identifier groups audited; no production changes\n')

      - name: Upload group audit
        uses: actions/upload-artifact@v4
        with:
          name: w01-risky-identifier-group-audit-${{ github.run_id }}
          path: /tmp/w01_risk/out/
          retention-days: 30
          if-no-files-found: error
