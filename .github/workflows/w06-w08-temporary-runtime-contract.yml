name: Temporary W06-W08 runtime contract validation
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w06-w08-temporary-runtime-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install local-test dependencies
        shell: Rscript {0}
        run: install.packages(c('readr','dplyr','jsonlite','digest'))
      - name: Run synthetic contract tests without external calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/temporary-contract
          Rscript - <<'RS'
          library(readr)
          library(jsonlite)
          root<-'outputs/temporary-contract'
          x<-data.frame(record_sequence=1:2,record_id=c('synthetic-a','synthetic-b'),title=c('Test record A','Test record B'),abstract=c('Abstract A','Abstract B'),geography_input_sha256=c(paste(rep('a',64),collapse=''),paste(rep('b',64),collapse='')),deterministic_primary_countries=c('',''),deterministic_primary_iso3c=c('',''),geography_review_required=c(FALSE,TRUE),geography_review_reason=c('','uncertain'),stringsAsFactors=FALSE)
          write_csv(x,file.path(root,'w06-input.csv'))
          RS
          Rscript scripts/updater/workflow_06_prepare_incremental.R --current outputs/temporary-contract/w06-input.csv --output-dir outputs/temporary-contract/w06
          Rscript scripts/updater/workflow_07_prepare_incremental.R --current outputs/temporary-contract/w06-input.csv --ontology user_input/workflow07_topic_ontology.csv --prompt user_input/workflow07_topic_system_prompt.txt --output-dir outputs/temporary-contract/w07
          Rscript - <<'RS'
          library(jsonlite)
          library(readr)
          root<-'outputs/temporary-contract'
          for(stage in c('w06','w07')){
            p<-file.path(root,stage,'prepare_manifest.json')
            m<-fromJSON(p)
            stopifnot(identical(m$status,'PASS'),m$current_records==2L,m$screen_queue_records==2L,m$new_record_ids==2L,m$reusable_records==0L)
          }
          stopifnot(nrow(read_csv(file.path(root,'w06','screen_queue_records.csv'),show_col_types=FALSE))==2L)
          stopifnot(file.exists(file.path(root,'w07','prepare_manifest.json')))
          a<-list(identity=list(record_id='synthetic-a'),canonical=list(title='Test record A'),screening=list(final_included=TRUE))
          b<-list(identity=list(record_id='synthetic-b'),canonical=list(title='Test record B'),screening=list(final_included=FALSE,exclusion_stage='W04',exclusion_reason='out of scope'))
          writeLines(c(toJSON(a,auto_unbox=TRUE),toJSON(b,auto_unbox=TRUE)),file.path(root,'assembled.jsonl'))
          write_json(list(schema='synthetic-prepartition',status='PASS',canonical_records=2L,final_included_records=1L,final_excluded_records=1L,final_canonical_jsonl_sha256='synthetic'),file.path(root,'old_manifest.json'),auto_unbox=TRUE)
          RS
          Rscript scripts/updater/workflow_08_partition_final_outputs_dynamic.R --assembled outputs/temporary-contract/assembled.jsonl --old-manifest outputs/temporary-contract/old_manifest.json --canonical-output outputs/temporary-contract/canonical.jsonl --exclusions-output outputs/temporary-contract/exclusions.csv --manifest-output outputs/temporary-contract/final_manifest.json
          Rscript - <<'RS'
          library(jsonlite)
          library(readr)
          p<-'outputs/temporary-contract'
          m<-fromJSON(file.path(p,'final_manifest.json'))
          stopifnot(m$canonical_records==1L,m$excluded_records==1L,m$source_canonical_population==2L,identical(m$canonical_contains_excluded_records,FALSE))
          stopifnot(length(readLines(file.path(p,'canonical.jsonl')))==1L)
          stopifnot(nrow(read_csv(file.path(p,'exclusions.csv'),show_col_types=FALSE))==1L)
          stopifnot(nzchar(m$final_canonical_jsonl_sha256),nzchar(m$excluded_records_csv_sha256))
          cat('PASS: W06 and W07 first-run manifests and W08 final partition agree with synthetic records\n')
          RS
