name: Temporary W00 expansion validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_validate_w00_expansion_20261018.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate source registry and expansion selection
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'install.packages("jsonlite")'
          Rscript scripts/updater/workflow_00_resolve_source_selection.R --run-type expansion --saved data/workflow00/source_selection.json --search-registry docs/search_record/zenodo_registry.csv --output /tmp/selection.json
          Rscript -e 'x<-jsonlite::fromJSON("/tmp/selection.json");stopifnot(length(x$selected_sources)==18L,! "ethos" %in% x$selected_sources)'
          Rscript -e 'for(p in c("user_input/workflow00_ris_cab_mariculture_2026-10-18.json","user_input/workflow00_ris_proquest_mariculture_2026-10-18.json")){x<-jsonlite::fromJSON(p);stopifnot(x$acquisition$method=="ris_upload",grepl("maricultur",x$search$search_string),nzchar(x$staging$reserved_doi))}'
          echo 'PASS W00 expansion selection and manual RIS registrations'
