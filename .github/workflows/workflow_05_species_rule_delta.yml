name: Workflow 05 - deterministic species rule delta

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'docs/workflow05/.run_species_rule_delta'

permissions:
  contents: read
  actions: read

jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("dplyr","fs","here","jsonlite","readr","tibble","stringr","stringdist","quanteda","glmnet"))
      - name: Restore previous deterministic W05 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: workflow05-deterministic-reuse-audit-36230627164
          path: old_checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36230627164
      - name: Locate stable W05 input and old deterministic summary
        shell: bash
        run: |
          set -euo pipefail
          REC="$(find old_checkpoint -type f -name records_for_annotation.csv -print -quit)"
          OLD="$(find old_checkpoint -type f -name deterministic_annotation_summary.csv -print -quit)"
          test -n "$REC"; test -n "$OLD"
          cp "$REC" records_for_annotation.csv
          cp "$OLD" old_deterministic_annotation_summary.csv
          Rscript -e 'x<-readr::read_csv("records_for_annotation.csv",show_col_types=FALSE);stopifnot(nrow(x)==19407L,!anyDuplicated(x$record_id));cat("PASS: restored 19,407-record W05 input\n")'
      - name: Convert stable W05 input to temporary canonical JSONL
        shell: Rscript {0}
        run: |
          library(readr); library(jsonlite)
          x <- read_csv("records_for_annotation.csv", show_col_types = FALSE)
          con <- file("retained_for_rerun.jsonl","wt",encoding="UTF-8")
          for(i in seq_len(nrow(x))){
            rec <- list(identity=list(record_id=x$record_id[[i]]), canonical=list(title=x$title[[i]], abstract=x$abstract[[i]]))
            writeLines(toJSON(rec,auto_unbox=TRUE,null="null"),con)
          }
          close(con)
      - name: Rerun corrected deterministic species and geography annotation
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_05_species_geography.R \
            --input retained_for_rerun.jsonl \
            --output-dir outputs/workflow05_corrected \
            --expected-records 19407
      - name: Compare corrected species assignments with previous checkpoint
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/reporting/workflow05_species_rule_delta.R \
            --old old_deterministic_annotation_summary.csv \
            --new outputs/workflow05_corrected/deterministic_annotation_summary.csv \
            --output-dir outputs/workflow05_species_delta
          cat outputs/workflow05_species_delta/species_delta_summary.json
      - name: Upload corrected checkpoint and delta audit
        uses: actions/upload-artifact@v4
        with:
          name: workflow05-species-rule-delta-${{ github.run_id }}
          path: |
            outputs/workflow05_corrected/
            outputs/workflow05_species_delta/
          retention-days: 90
          if-no-files-found: error
