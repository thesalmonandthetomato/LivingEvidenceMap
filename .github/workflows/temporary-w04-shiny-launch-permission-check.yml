name: Temporary W04 Shiny caller permissions validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-shiny-launch-permission-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact Shiny caller contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          caller=Path('.github/workflows/w04_shiny_subset_launcher.yml').read_text()
          reused=Path('.github/workflows/workflow_04_production.yml').read_text()
          assert 'permissions:\n  contents: write\n  actions: write' in caller
          assert "execution_pathway: shiny" in caller
          assert 'publish: false' in caller
          assert 'secrets: inherit' in caller
          assert 'uses: ./.github/workflows/workflow_04_production.yml' in caller
          assert "inputs.execution_pathway == 'github'" in reused
          assert "inputs.publish == true" in reused
          print('PASS: Shiny-only caller has permissions for nested W05 declaration, publish disabled, GitHub path gated')
          PY
      - name: Actionlint reusable workflow graph
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/w04_shiny_subset_launcher.yml .github/workflows/workflow_04_production.yml .github/workflows/workflow_05_production.yml
