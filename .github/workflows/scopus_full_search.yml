name: Full Scopus STANDARD harvest

on:
  push:
    branches:
      - updater-workflow-00b-scopus-ingestion
    paths:
      - '.github/workflows/scopus_full_search.yml'
  workflow_dispatch:
    inputs:
      query:
        description: 'Scopus Advanced Search query'
        required: true
        default: 'TITLE-ABS-KEY((salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") AND (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*))'
        type: string

permissions:
  contents: read

jobs:
  full-scopus-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Scopus ingestion branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00b-scopus-ingestion
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))

      - name: Resolve search query
        id: cfg
        shell: bash
        env:
          INPUT_QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail
          query="${INPUT_QUERY:-TITLE-ABS-KEY((salmon OR salmonid* OR Salmo OR Oncorhynchus OR \"rainbow trout\") AND (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*))}"
          {
            echo "query<<EOF"
            echo "$query"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run full lossless Scopus STANDARD harvest
        env:
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_QUERY: ${{ steps.cfg.outputs.query }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00b_scopus_ingestion.R \
            --query "$SCOPUS_QUERY" \
            --max-records all \
            --page-size 25 \
            --view STANDARD \
            --output-dir outputs/updater/scopus_full_search

      - name: Verify full-harvest safeguards
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f outputs/updater/scopus_full_search/manifest.json
          test -f outputs/updater/scopus_full_search/checkpoint.json
          test -f outputs/updater/scopus_full_search/validation.json
          grep -q '"status": "success"' outputs/updater/scopus_full_search/manifest.json
          grep -q '"duplicate_scopus_eids_n": 0' outputs/updater/scopus_full_search/validation.json
          grep -q '"duplicate_scopus_ids_n": 0' outputs/updater/scopus_full_search/validation.json
          grep -q '"count_matches_first_page_total": true' outputs/updater/scopus_full_search/validation.json
          grep -q '"canonical_json_modified": false' outputs/updater/scopus_full_search/validation.json

      - name: Show manifest validation and checkpoint
        if: always()
        shell: bash
        run: |
          if [ -f outputs/updater/scopus_full_search/manifest.json ]; then
            cat outputs/updater/scopus_full_search/manifest.json
          fi
          if [ -f outputs/updater/scopus_full_search/validation.json ]; then
            cat outputs/updater/scopus_full_search/validation.json
          fi
          if [ -f outputs/updater/scopus_full_search/checkpoint.json ]; then
            echo "--- checkpoint ---"
            cat outputs/updater/scopus_full_search/checkpoint.json
          fi

      - name: Guard canonical tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -e data/canonical/current/scopus ] || [ -e data/canonical/current/scopus_full_search ]; then
            echo "Unexpected Scopus output under canonical tree"
            exit 1
          fi

      - name: Upload full Scopus harvest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopus-full-search-${{ github.run_id }}
          path: outputs/updater/scopus_full_search/
          if-no-files-found: error
          retention-days: 30

