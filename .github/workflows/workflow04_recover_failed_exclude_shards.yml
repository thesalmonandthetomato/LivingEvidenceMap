name: Workflow 04 recover failed exclude shards

on:
  push:
    branches:
      - updater-workflow-04-relevance-screening
    paths:
      - .github/workflows/workflow04_recover_failed_exclude_shards.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        shard: [3,4,7]
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workflow 04 branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-04-relevance-screening

      - name: Check out post-search-correction canonical store
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          path: canonical_store
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI client
        run: python -m pip install --upgrade openai

      - name: Select historical EXCLUDE records for shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          shard=int(os.environ['SHARD']); nshards=8
          src=Path('canonical_store/data/canonical/current/repair/records.jsonl')
          root=Path(f'testdata/workflow04_all_excludes_v2/shard_{shard}')
          root.mkdir(parents=True, exist_ok=True)
          selected=[]; total=0; excludes=0
          for line in src.open(encoding='utf-8'):
              if not line.strip(): continue
              total += 1
              r=json.loads(line)
              rel=((r.get('screening') or {}).get('relevance') or {})
              if str(rel.get('decision') or '').upper() != 'EXCLUDE': continue
              excludes += 1
              if (excludes-1) % nshards == shard: selected.append(r)
          with (root/'input.jsonl').open('w',encoding='utf-8') as f:
              for r in selected: f.write(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n')
          manifest={'canonical_records':total,'historical_excludes':excludes,'shard':shard,'shards':nshards,'records_in_shard':len(selected),'canonical_commit':subprocess.check_output(['git','-C','canonical_store','rev-parse','HEAD'],text=True).strip(),'model':'gpt-5-mini','prompt':'relevance_screen_jsonl_v2.py human-validated production rules','recovery_of_run':33626091575}
          (root/'input_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Screen failed shard again
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHARD: ${{ matrix.shard }}
        run: |
          root="testdata/workflow04_all_excludes_v2/shard_${SHARD}"
          python scripts/updater/relevance_screen_jsonl_v2.py \
            --input "$root/input.jsonl" \
            --output "$root/screened.jsonl" \
            --audit "$root/audit.jsonl" \
            --checkpoint "$root/checkpoint.json" \
            --chunk-size 25 --mode openai --model gpt-5-mini

      - name: Extract disagreements from screened output
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os, importlib.util
          from pathlib import Path
          shard=int(os.environ['SHARD'])
          root=Path(f'testdata/workflow04_all_excludes_v2/shard_{shard}')
          screened=[json.loads(x) for x in (root/'screened.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          spec=importlib.util.spec_from_file_location('v2','scripts/updater/relevance_screen_jsonl_v2.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          conflicts=[]; errors=[]; counts={}
          for r in screened:
              lid=str((r.get('identity') or {}).get('lens_id') or '')
              s=r.get('screening') or {}; d=str(s.get('decision') or '').upper()
              counts[d]=counts.get(d,0)+1
              if s.get('technical_error'): errors.append({'lens_id':lid,'error':s.get('technical_error')})
              if d!='EXCLUDE':
                  conflicts.append({'lens_id':lid,'historical_decision':'EXCLUDE','model_decision':d,'model_reason':s.get('reason') or '','input_record':r,'reconstructed_request':mod.request(r,'gpt-5-mini')})
          with (root/'conflicts.jsonl').open('w',encoding='utf-8') as f:
              for x in conflicts: f.write(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n')
          summary={'shard':shard,'screened':len(screened),'model_counts':counts,'conflicts':len(conflicts),'technical_errors':len(errors)}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          (root/'technical_errors.json').write_text(json.dumps(errors,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          if errors: raise RuntimeError(f'Technical screening errors: {len(errors)}')
          PY

      - name: Upload recovered shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-all-excludes-v2-recovered-shard-${{ matrix.shard }}
          path: testdata/workflow04_all_excludes_v2/shard_${{ matrix.shard }}/
          retention-days: 90
