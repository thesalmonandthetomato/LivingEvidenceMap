name: TEMP W00 remaining bounded smoke
on:
  push:
    branches: [production-minimal]
    paths: [.github/workflows/w00-disposable-remaining-smoke.yml]
permissions:
  contents: read
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","httr2","digest","xml2"))
      - name: Bounded test without output retention
        shell: bash
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ZENODO_ACCESS_TOKEN || true
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' '{"selected_sources":["agricola","ethos","cba","epmc_preprints","ebsco_africa_wide","ebsco_amed","ebsco_psycinfo","ebsco_atla_religion","ebsco_biological_agricultural_index","ebsco_cinahl","ebsco_communication_mass_media","ebsco_econlit","ebsco_eric","ebsco_family_society","ebsco_greenfile","ebsco_hospitality_tourism","ebsco_mla","ebsco_political_science","ebsco_sportdiscus","ebsco_waters_oceans"]}' > "$tmp/selection.json"
          Rscript scripts/updater/workflow_00_translate_generic.R --run-type full --config user_input/workflow00_search_strategy.salmon_equivalence_candidate.json --source-selection "$tmp/selection.json" --output-dir "$tmp/plan" || exit 1
          failed=0
          for src in agricola ethos cba epmc_preprints ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            query="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[[1]],simplifyVector=FALSE);cat(x[[commandArgs(TRUE)[[2]]]])' "$tmp/plan/source_queries.json" "$src")"
            mkdir -p "$tmp/$src"
            case "$src" in
              agricola)
                Rscript scripts/updater/workflow_00d_agricola_ingestion.R --query "$query" --max-records 2 --page-size 2 --output-dir "$tmp/$src" >/dev/null 2>"$tmp/$src/log" ;;
              ethos|cba|epmc_preprints)
                case "$src" in ethos) code=ETH ;; cba) code=CBA ;; epmc_preprints) code=PPR ;; esac
                Rscript scripts/updater/workflow_00f_europe_pmc_source_ingestion.R --query "$query" --source-code "$code" --source-slug "$src" --source-collection "$src" --max-records 2 --page-size 2 --output-dir "$tmp/$src" >/dev/null 2>"$tmp/$src/log" ;;
              ebsco_*)
                Rscript scripts/updater/workflow_00g_ebsco_ingestion.R --source "$src" --query "$query" --max-records 2 --page-size 2 --output-dir "$tmp/$src" >/dev/null 2>"$tmp/$src/log" ;;
            esac
            status=$?
            if [ "$status" -eq 0 ] && [ -s "$tmp/$src/manifest.json" ]; then
              echo "PASS $src"
            else
              echo "FAIL $src (exit=$status)"
              tail -n 5 "$tmp/$src/log" || true
              failed=$((failed+1))
            fi
          done
          echo "W00 smoke failures: $failed"
          test "$failed" -eq 0
