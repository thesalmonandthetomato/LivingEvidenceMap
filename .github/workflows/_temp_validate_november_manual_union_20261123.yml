name: TEMP validate November manual RIS and W01 historical union (corrected)
on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - .github/workflows/_temp_validate_november_manual_union_20261123.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install required R packages
        shell: Rscript {0}
        run: install.packages(c("jsonlite","httr2","digest","readr","stringi"))
      - name: Run isolated draft validation and provenance union tests
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/w01_test
          (
            set -euo pipefail
            Rscript - <<'RS'
          library(jsonlite)
          c <- fromJSON("user_input/monthly_manual_ris.json",simplifyVector=FALSE)
          stopifnot(c$update_month=="2026-11",
                    identical(c$sources$cab$zenodo_doi,"10.5281/zenodo.24461555"),
                    identical(c$sources$proquest$zenodo_doi,"10.5281/zenodo.24461375"))
          for(source in c("cab","proquest")){
            base <- if(source=="cab") "user_input/workflow00_ris_cab_abstracts_2026-09-30.json" else "user_input/workflow00_ris_proquest_2026-09-30.json"
            x <- fromJSON(base,simplifyVector=FALSE)
            x$search$search_date <- "2026-11-23"
            x$search$search_string <- '(salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") AND (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial* OR maricultur*)'
            x$search$reported_results <- NULL
            x$staging$reserved_doi <- c$sources[[source]]$zenodo_doi
            x$staging$deposition_id <- NULL
            x$input$files <- list()
            x$input$expected_chunk_count <- NULL
            dir.create(file.path("/tmp/w01_test",source),recursive=TRUE)
            write_json(x,file.path("/tmp/w01_test",source,"registry.json"),auto_unbox=TRUE,pretty=TRUE,null="null")
          }
          RS
            for source in cab proquest; do
              Rscript scripts/updater/workflow_00_complete_ris_zenodo_draft.R \
                --registry "/tmp/w01_test/$source/registry.json" \
                --output-dir "/tmp/w01_test/$source/validated" \
                --validate-only true
              SOURCE="$source" Rscript - <<'RS'
          library(jsonlite)
          s<-Sys.getenv("SOURCE")
          p<-file.path("/tmp/w01_test",s,"validated")
          receipt<-fromJSON(file.path(p,"validation_only_receipt.json"))
          manifest<-fromJSON(file.path(p,"ingestion","manifest.json"))
          stopifnot(identical(receipt$status,"validated_only_no_zenodo_write"),
                    receipt$unique_records_for_handover==manifest$records$unique_records_for_handover,
                    receipt$unique_records_for_handover>0)
          cat(sprintf("DRAFT_VALIDATED %s doi=%s records=%s exact_duplicates_removed=%s no_zenodo_write=true\n",
             s,receipt$reserved_doi,receipt$unique_records_for_handover,receipt$exact_duplicate_rows_removed))
          RS
            done
            # Unit test an old-only source, old+new sources, and equality guard.
            Rscript - <<'RS'
          library(jsonlite)
          root<-"/tmp/w01_test/union"
          old<-file.path(root,"previous")
          dir.create(old,recursive=TRUE)
          mk<-function(source,id){toJSON(list(source=list(provider=source),sidecar_identity=list(sidecar_record_id=id)),auto_unbox=TRUE)}
          for(source in c("cab","proquest","historical_citation")){
            writeLines(mk(source,paste0(source,":old")),file.path(old,paste0(source,"_records_for_deduplication.jsonl")))
          }
          cur<-file.path(root,"cab_new.jsonl")
          writeLines(c(mk("cab","cab:old"),mk("cab","cab:new")),cur)
          manifest<-list(schema="living-evidence-map-workflow01-source-inputs-v1",sources=list(cab=cur))
          write_json(manifest,file.path(root,"manifest.json"),auto_unbox=TRUE,pretty=TRUE)
          RS
            Rscript scripts/updater/workflow_01_deduplication_build_union.R \
              --old-dir /tmp/w01_test/union/previous \
              --input-manifest /tmp/w01_test/union/manifest.json \
              --expected-prior-manifestations 3 \
              --output-dir /tmp/w01_test/union/output
            Rscript - <<'RS'
          library(jsonlite)
          p<-"/tmp/w01_test/union/output"
          summary<-read.csv(file.path(p,"union_source_counts.csv"))
          stopifnot(sum(summary$preserved_old)==3,sum(summary$appended_new)==1,
                    all(c("cab","proquest","historical_citation") %in% summary$source),
                    summary$preserved_old[summary$source=="historical_citation"]==1,
                    summary$union_total[summary$source=="historical_citation"]==1)
          oldonly<-file.path(p,"historical_citation_records_for_deduplication.jsonl")
          stopifnot(length(readLines(oldonly))==1)
          cat("UNION_TEST_PASS: historical-only sources preserved; exact-ID overlap suppressed; total 3 old + 1 new\n")
          RS
            if Rscript scripts/updater/workflow_01_deduplication_build_union.R \
              --old-dir /tmp/w01_test/union/previous \
              --input-manifest /tmp/w01_test/union/manifest.json \
              --expected-prior-manifestations 4 \
              --output-dir /tmp/w01_test/union/bad 2>/tmp/w01_test/expected_error.log; then
              echo "FAIL: expected mismatch safeguard did not fire"
              exit 7
            fi
            grep -q "Preserved corpus should contain 4 manifestations, found 3" /tmp/w01_test/expected_error.log
            echo "UNION_MISMATCH_GUARD_PASS"
            echo "ALL_TESTS_PASS"
          ) > /tmp/w01_test/results.log 2>&1
          test_code=$?
          cat /tmp/w01_test/results.log
          TEST_CODE="$test_code" python3 - <<'PY'
          import os,json,base64,urllib.request
          result={"exit_code":int(os.environ["TEST_CODE"]),"log":open("/tmp/w01_test/results.log").read()[-20000:]}
          data=base64.b64encode(json.dumps(result,indent=2).encode()).decode()
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/docs/.temp_manual_union_validation_20261123.json"
          body=json.dumps({"message":"TEMP November manual RIS and W01 union test receipt","content":data,"branch":"workflow01-final-architecture"}).encode()
          req=urllib.request.Request(url,data=body,method="PUT",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response:print("TEMP_TEST_RECEIPT_COMMITTED",response.status)
          PY
          exit "$test_code"
