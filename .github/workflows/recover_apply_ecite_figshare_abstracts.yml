name: Recover and apply eCite Figshare abstracts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-04-relevance-screening
          path: workflow
      - name: Check out canonical store
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          fetch-depth: 1
          path: canonical
      - name: Recover and identity-validate eCite Figshare abstracts
        run: |
          mkdir -p out/ecite
          python workflow/scripts/updater/recover_ecite_figshare_abstracts.py \
            --records canonical/data/canonical/current/repair/records.jsonl \
            --outdir out/ecite
      - name: Apply validated patch with field provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cp=Path('canonical/data/canonical/current/repair/records.jsonl')
          pp=Path('out/ecite/validated_patch.jsonl')
          patches={}
          patch_lines=0
          with pp.open(encoding='utf-8') as src:
              for line in src:
                  if not line.strip(): continue
                  patch_lines += 1
                  p=json.loads(line)
                  rid=p['record_id']
                  assert rid not in patches, f'duplicate patch record ID: {rid}'
                  assert p.get('provenance',{}).get('identity_valid') is True
                  patches[rid]=p
          assert len(patches)==patch_lines, 'duplicate patch record IDs'

          out_path=cp.with_suffix('.jsonl.tmp')
          applied=0; total=0; seen=set()
          with cp.open(encoding='utf-8') as src, out_path.open('w',encoding='utf-8') as dst:
              for line in src:
                  if not line.strip(): continue
                  r=json.loads(line); total += 1
                  rid=str(((r.get('identity') or {}).get('lens_id') or r.get('record_id') or r.get('lens_id') or (r.get('canonical') or {}).get('lens_id') or ''))
                  p=patches.get(rid)
                  if p:
                      assert rid not in seen, f'duplicate canonical match: {rid}'
                      seen.add(rid)
                      c=r.setdefault('canonical',{})
                      cur=' '.join(str(c.get('abstract') or '').split())
                      expected=' '.join(str(p.get('old_abstract') or '').split())
                      assert cur==expected, f'abstract changed since recovery for {rid}'
                      c['abstract']=p['abstract']
                      prov=r.setdefault('provenance',{})
                      enrich=prov.setdefault('canonical_field_enrichment',[])
                      enrich.append(p['provenance'])
                      applied += 1
                  dst.write(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n')
          missing=sorted(set(patches)-seen)
          assert not missing, f'patch record IDs not found in canonical: {missing}'
          assert total==22148, f'canonical record count changed: {total}'
          assert applied==len(patches), f'applied {applied} != patch {len(patches)}'
          out_path.replace(cp)
          Path('out/ecite/apply_report.json').write_text(json.dumps({'patch_count':len(patches),'applied':applied,'canonical_record_count':total,'provenance_path':'provenance.canonical_field_enrichment'},indent=2),encoding='utf-8')
          print(json.dumps({'patch_count':len(patches),'applied':applied,'canonical_record_count':total},indent=2))
          PY
      - name: Commit canonical changes
        working-directory: canonical
        run: |
          if git diff --quiet -- data/canonical/current/repair/records.jsonl; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/canonical/current/repair/records.jsonl
          git commit -m 'Recover eCite Figshare abstracts with provenance'
          git push origin canonical-repair-store
      - name: Upload recovery audit
        uses: actions/upload-artifact@v4
        with:
          name: ecite-figshare-recovery-${{ github.run_id }}
          path: out/ecite/
          if-no-files-found: error
          retention-days: 30
