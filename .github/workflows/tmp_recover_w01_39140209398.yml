name: Temporary recover published W01 run 39140209398
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_recover_w01_39140209398.yml]
permissions:
  contents: write
  actions: write
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: '39140209398'
      WORKFLOW01_BRANCH: workflow01-final-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite","digest","readr","httr2","googlesheets4"))'
      - name: Restore successful W01 outputs without publishing again
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" --name "workflow01-resume-$ORIGINAL_RUN" --dir recovered
          find recovered -maxdepth 4 -type f | head -80
          test -s recovered/outputs/zenodo/zenodo_receipt.json
          test -s recovered/outputs/final/summary.json
          test -s recovered/outputs/canonical/canonical_manifest.json
      - name: Register existing Zenodo delta and resolution with rebase-safe push
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_update_zenodo_registry.R --receipt recovered/outputs/zenodo/zenodo_receipt.json --registry docs/deduplication/zenodo_registry.csv --pointer-dir docs/deduplication/zenodo
          mkdir -p docs/deduplication/runs docs/deduplication/checkpoints/resolutions
          Rscript scripts/updater/workflow_01_write_run_report.R --summary recovered/outputs/final/summary.json --canonical-manifest recovered/outputs/canonical/canonical_manifest.json --zenodo-receipt recovered/outputs/zenodo/zenodo_receipt.json --run-id "$ORIGINAL_RUN" --repository "$GITHUB_REPOSITORY" --out-md "docs/deduplication/runs/run-$ORIGINAL_RUN.md" --out-json "docs/deduplication/runs/run-$ORIGINAL_RUN.json"
          printf '{"checkpoint_run_id":"39137065592","resolved_by_run_id":"%s","status":"resolved"}\n' "$ORIGINAL_RUN" > docs/deduplication/checkpoints/resolutions/run-39137065592.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deduplication/zenodo_registry.csv docs/deduplication/zenodo/ docs/deduplication/runs/ docs/deduplication/checkpoints/resolutions/
          if ! git diff --cached --quiet; then
            git commit -m "Recover registered W01 delta from original run $ORIGINAL_RUN"
            git pull --rebase origin "$WORKFLOW01_BRANCH"
            git push origin HEAD:"$WORKFLOW01_BRANCH"
          fi
          test -s "docs/deduplication/zenodo/run-$ORIGINAL_RUN.json"
      - name: Update live W01 status and dispatch W02
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_current_run_status_observer.R --force-stage W01 --pointer "docs/deduplication/zenodo/run-$ORIGINAL_RUN.json"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google.json"
          chmod 600 "$RUNNER_TEMP/google.json"
          Rscript scripts/updater/workflow_current_run_status_to_shiny.R --status docs/current_run/current_run_status.json --sheet-id "$LEM_GOOGLE_SHEET_ID" --credential "$RUNNER_TEMP/google.json"
          git add docs/current_run/current_run_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update W01 status after recovery [skip ci]"
            git pull --rebase origin "$WORKFLOW01_BRANCH"
            git push origin HEAD:"$WORKFLOW01_BRANCH"
          fi
          PREV_W02="$(Rscript -e 'x<-jsonlite::fromJSON("docs/current_run/current_run_status.json",simplifyVector=FALSE);cat(x$baseline$workflow02_pointer)')"
          test -s "$PREV_W02"
          gh workflow run workflow_02_batched_production.yml --repo "$GITHUB_REPOSITORY" --ref "$WORKFLOW01_BRANCH" -f workflow01_pointer_path="docs/deduplication/zenodo/run-$ORIGINAL_RUN.json" -f previous_workflow02_pointer_path="$PREV_W02"
