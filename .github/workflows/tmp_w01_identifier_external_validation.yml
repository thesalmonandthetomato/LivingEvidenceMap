name: TEMP W01 identifier external validation

on:
  push:
    branches:
      - w01-identifier-assist-test
    paths:
      - '.github/workflows/tmp_w01_identifier_external_validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-identifier-assist-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite','httr2','stringi'))

      - name: Download benchmark and triage artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w01_ext/benchmark /tmp/w01_ext/triage /tmp/w01_ext/out

          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11220721964/zip"             > /tmp/w01_ext/benchmark.zip
          unzip -q /tmp/w01_ext/benchmark.zip -d /tmp/w01_ext/benchmark

          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11220516034/zip"             > /tmp/w01_ext/triage.zip
          unzip -q /tmp/w01_ext/triage.zip -d /tmp/w01_ext/triage

      - name: Validate 54 non-clear pairs against external canonical metadata
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_identifier_external_validation.R             --triage /tmp/w01_ext/triage/high_evidence_disagreement_triage.csv             --registry /tmp/w01_ext/benchmark/identifier_registry.csv             --output-dir /tmp/w01_ext/out
          cat /tmp/w01_ext/out/external_validation_summary.csv

      - name: Assert read-only scope
        shell: Rscript {0}
        run: |
          library(data.table)
          x <- fread('/tmp/w01_ext/out/nonclear_external_validation.csv')
          stopifnot(nrow(x)==54L)
          stopifnot(all(x$external_validation_class %in% c(
            'externally_confirmed_identifier_conflict',
            'externally_corroborated_same_work',
            'external_metadata_support_no_direct_crosswalk',
            'still_ambiguous'
          )))
          cat('PASS: 54 non-clear pairs externally validated; no production changes\n')

      - name: Upload external validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: w01-identifier-external-validation-${{ github.run_id }}
          path: /tmp/w01_ext/out/
          retention-days: 30
          if-no-files-found: error
