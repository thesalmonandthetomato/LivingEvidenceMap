name: TEMP W08b monthly discovery workflow contract validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_monthly_discovery_contract_20261031.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("yaml","jsonlite","httr2"))'
      - name: Parse workflows and validate bounded safety gates
        shell: Rscript {0}
        run: |
          library(yaml)
          workflow<-" .github/workflows/workflow08b_monthly_discovery.yml"
          workflow<-trimws(workflow)
          z<-yaml.load_file(workflow)
          stopifnot(is.list(z),is.list(z$jobs$discovery),
            identical(z$permissions$contents,"read"),
            length(z$jobs$discovery$steps)>=12L)
          # YAML-1.1 parsers can interpret 'on' as TRUE, so inspect text too.
          src<-readLines(workflow,warn=FALSE)
          stopifnot(any(grepl("^  workflow_dispatch:",src)),
            !any(grepl("^  schedule:|^  push:",src)),
            any(grepl("resume_checkpoint_zenodo_id:",src,fixed=TRUE)),
            any(grepl("execute_provider_queries:",src,fixed=TRUE)),
            any(grepl("steps.doi.outcome == 'success'",src,fixed=TRUE)),
            any(grepl("monthly_candidate_delta.R",src,fixed=TRUE)),
            any(grepl("filter_existing_w01.R",src,fixed=TRUE)),
            any(grepl("archive_discovery.R",src,fixed=TRUE)))
          for(f in c("plan_identifier_checks.R","run_lens_bulk_manifest.R",
            "run_openalex_manifest.R","resolve_lens_doi_manifest.R",
            "merge_monthly_edges.R","merge_edges.R","monthly_candidate_delta.R",
            "filter_existing_w01.R")){
            p<-file.path("scripts/workflow08b",f)
            stopifnot(is.expression(parse(file=p)))
          }
          cat("PASS: monthly discovery workflow and all eight entry points parse; read-only default, bounded provider calls, resume, archive and handoff guard checked\n")
      - name: Ensure old production workflow dispatch logic was not changed
        shell: Rscript {0}
        run: |
          src<-readLines(".github/workflows/workflow_08_production.yml",warn=FALSE)
          stopifnot(any(grepl("gh workflow run report_workflow09_figures.yml",src,fixed=TRUE)))
          cat("PASS: existing W08-to-W09 routing untouched; new W08b discovery cannot self-dispatch\n")
