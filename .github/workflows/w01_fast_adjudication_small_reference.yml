name: W01-Fast October small adjudication reference
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_adjudication_small_reference.yml
      - scripts/updater/experimental_w01_fast/extract_w01_adjudicate_small.R
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install JSON support
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Read only the small adjudication reference members
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -f 25000
          Rscript scripts/updater/experimental_w01_fast/extract_w01_adjudicate_small.R
      - name: Retain small immutable reference
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-october-small-adjudication-reference
          path: selected_w01_adjudicate_small/
          retention-days: 7
          if-no-files-found: error
