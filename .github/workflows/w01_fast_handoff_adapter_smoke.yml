name: W01-Fast handoff adapter isolated smoke
on:
  push:
    branches: [w01-fast-direct-delta]
    paths: ['.github/workflows/w01_fast_handoff_adapter_smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rocker/r-ver:4.4.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-direct-delta
          persist-credentials: false
      - name: Parse and exercise W01 handoff adapter on self-contained fixture
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e "install.packages(c('jsonlite','digest','data.table'),repos='https://cloud.r-project.org')"
          Rscript - <<'RS'
          library(jsonlite);library(digest);library(data.table)
          parse(file="scripts/updater/experimental_w01_fast/stage_production_handoff.R")
          t<-tempfile();dir.create(t)
          root<-file.path(t,"fast")
          wr<-function(path,value){z<-file.path(root,path);dir.create(dirname(z),recursive=TRUE,showWarnings=FALSE);writeLines(value,z,useBytes=TRUE)}
          json<-function(path,x)wr(path,toJSON(x,auto_unbox=TRUE,null="null"))
          dt<-data.table(idx=1L,source="lens",source_record_id="a",cluster_id="work-1",cluster_size=1L)
          dir.create(file.path(root,"production_final"),recursive=TRUE)
          fwrite(dt,file.path(root,"production_final","manifestation_cluster_map.csv"))
          fwrite(data.table(pair_key=character()),file.path(root,"production_final","final_pair_decisions.csv"))
          fwrite(data.table(retired_cluster_id=character(),surviving_cluster_id=character(),reason=character()),file.path(root,"production_final","cluster_id_aliases.csv"))
          wr("production_final/abstract_strip_actions.jsonl","")
          wr("production_final/cumulative_data_quality_repairs.jsonl","")
          wr("production_canonical/data_quality_repair_application.jsonl","")
          canon<-toJSON(list(schema_version="living-evidence-map-canonical-v1",identity=list(record_id="work-1"),canonical=list(title="Example"),manifestations=list(list(source="lens",source_record_id="a")),deduplication=list(cluster_id="work-1",member_count=1L)),auto_unbox=TRUE)
          wr("replayed/canonical/records.jsonl",canon)
          wr("production_canonical/records.jsonl",canon)
          sha<-function(p)digest(file=file.path(root,p),algo="sha256",serialize=FALSE)
          json("run_report.json",list(status="PASS_SHADOW_NO_PUBLICATION"))
          json("production_final/summary.json",list(source_manifestations=1L,clusters=1L))
          json("production_canonical/canonical_manifest.json",list(records=1L,source_manifestations=1L,canonical_jsonl_sha256=sha("replayed/canonical/records.jsonl")))
          json("replayed/workflow01_delta_replay_audit.json",list(status="PASS",source_manifestations=1L,canonical_records=1L,canonical_jsonl_sha256=sha("replayed/canonical/records.jsonl")))
          json("delta/delta_manifest.json",list(target=list(source_manifestations=1L,canonical_records=1L)))
          out<-file.path(t,"handoff")
          cmd<-c("scripts/updater/experimental_w01_fast/stage_production_handoff.R","--fast-root",root,"--output-root",out)
          stopifnot(system2("Rscript",cmd)==0L)
          z<-fromJSON(file.path(out,"handoff_manifest.json"))
          stopifnot(z$status=="PASS_SHADOW_NO_PUBLICATION",isFALSE(z$publication_allowed),isFALSE(z$workflow02_dispatch_allowed),z$canonical_records==1L)
          stopifnot(system2("Rscript",cmd,stdout=FALSE,stderr=FALSE)!=0L) # no overwrite
          cat("PASS: valid adapter and fail-closed overwrite guard\n")
          RS
