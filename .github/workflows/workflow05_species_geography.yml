name: Workflow 05 - species and geography annotation

on:
  workflow_dispatch:
    inputs:
      canonical_branch:
        description: 'Canonical branch containing Workflow 04 output'
        required: false
        default: 'canonical-fresh-dedup-v2-2026-09-14'
        type: string
      output_dir:
        description: 'Output directory for Workflow 05 artefacts'
        required: false
        default: 'outputs/workflow05'
        type: string
      master_path:
        description: 'Production master CSV used only to reuse existing annotations'
        required: false
        default: 'data/master/current/living_evidence_map_master.csv'
        type: string
      llm_mode:
        description: 'off = zero API calls; new-only = adjudicate only unresolved non-reused dimensions'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'new-only'
      max_llm_records:
        description: 'Safety cap on records sent to the LLM; 0 means no cap'
        required: false
        default: '0'
        type: string
      model:
        description: 'OpenAI annotation model used only when llm_mode=new-only'
        required: false
        default: 'gpt-5-mini'
        type: string

permissions:
  contents: read

env:
  CANONICAL_JSONL: canonical_store/data/canonical/current/repair/records.jsonl

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pipeline code and production master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical store from Workflow 04
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.canonical_branch }}
          path: canonical_store
          lfs: true
          fetch-depth: 0

      - name: Validate canonical Workflow 04 input
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CANONICAL_JSONL" || { echo "Canonical JSONL missing: $CANONICAL_JSONL" >&2; exit 1; }
          test -s '${{ inputs.master_path }}' || { echo 'Master CSV missing: ${{ inputs.master_path }}' >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('canonical_store/data/canonical/current/repair/manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          stage=m.get('pipeline_stage','')
          if not stage.startswith('relevance_screening'):
              raise SystemExit(f'Canonical branch has not completed Workflow 04 processing: pipeline_stage={stage!r}')
          c=m.get('workflow04_relevance_screening_completion',{})
          print('Workflow 04 canonical input accepted')
          print('pipeline_stage:', stage)
          print('include:', c.get('include'))
          print('exclude:', c.get('exclude'))
          print('unresolved:', c.get('unresolved'))
          print('NOTE: screening uncertainty is allowed and will be carried through Workflow 05 and topic classification.')
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::fs
            any::here
            any::httr2
            any::jsonlite
            any::purrr
            any::readr
            any::stringi
            any::stringr
            any::tibble
            any::tidyr
            any::yaml

      - name: Run Workflow 05 from canonical JSONL
        env:
          OPENAI_API_KEY: ${{ inputs.llm_mode == 'new-only' && secrets.OPENAI_API_KEY || '' }}
        run: |
          Rscript scripts/updater/workflow_05_species_geography.R \
            --input "$CANONICAL_JSONL" \
            --master '${{ inputs.master_path }}' \
            --output-dir '${{ inputs.output_dir }}' \
            --llm-mode '${{ inputs.llm_mode }}' \
            --max-llm-records '${{ inputs.max_llm_records }}' \
            --model '${{ inputs.model }}'

      - name: Validate Workflow 05 outputs
        shell: bash
        run: |
          set -euo pipefail
          summary='${{ inputs.output_dir }}/workflow05_summary.json'
          output='${{ inputs.output_dir }}/records.jsonl'
          review='${{ inputs.output_dir }}/workflow05_review_queue.csv'
          test -s "$summary"
          test -s "$output"
          python3 - "$summary" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          print('Workflow 05 summary')
          for k in [
              'total_canonical_records','screening_include','screening_uncertain','screening_exclude',
              'records_forwarded_to_annotation','species_reused_from_master','geography_reused_from_master',
              'annotation_adjudication_queue_records','llm_calls_attempted',
              'screening_uncertain_carried_forward','annotation_unresolved','combined_review_candidates'
          ]:
              print(f'{k}: {x.get(k)}')
          if x.get('llm_mode') == 'off' and x.get('llm_calls_attempted') != 0:
              raise SystemExit('FAIL: llm_mode=off but LLM calls were reported')
          if not x.get('substantive_uncertainty_deferred_to_post_topic_gate'):
              raise SystemExit('FAIL: Workflow 05 must defer substantive uncertainty to the post-topic gate')
          print('PASS: Workflow 05 completed without resolving or emailing on substantive uncertainty.')
          PY
          echo "Workflow 05 review candidates retained for later combined gate: $review"

      - name: Upload Workflow 05 artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow05-species-geography-${{ github.run_id }}
          path: ${{ inputs.output_dir }}/
          if-no-files-found: error
          retention-days: 90
