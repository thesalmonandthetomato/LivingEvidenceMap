name: Workflow 05 - species and geography annotation

on:
  workflow_dispatch:
    inputs:
      canonical_branch:
        description: 'Canonical branch containing Workflow 04 output'
        required: false
        default: 'canonical-fresh-dedup-v2-2026-09-14'
        type: string
      model:
        description: 'Model used only for residual deterministic uncertainty'
        required: false
        default: 'gpt-5-mini'
        type: string
  workflow_call:
    inputs:
      canonical_branch:
        required: true
        type: string
      model:
        required: false
        default: 'gpt-5-mini'
        type: string
    secrets:
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

env:
  CANONICAL_JSONL: canonical_store/data/canonical/current/repair/records.jsonl
  DETERMINISTIC_DIR: outputs/workflow05/deterministic
  FINAL_DIR: outputs/workflow05/final

jobs:
  deterministic-species-geography:
    name: deterministic species + geography
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical store from Workflow 04
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.canonical_branch }}
          path: canonical_store
          lfs: true
          fetch-depth: 0

      - name: Validate Workflow 04 canonical input
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CANONICAL_JSONL"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('canonical_store/data/canonical/current/repair/manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          stage=m.get('pipeline_stage','')
          if not stage.startswith('relevance_screening'):
              raise SystemExit(f'Workflow 04 has not completed: pipeline_stage={stage!r}')
          c=m.get('workflow04_relevance_screening_completion',{})
          print('Workflow 04 input accepted')
          print('pipeline_stage:', stage)
          print('include:', c.get('include'))
          print('exclude:', c.get('exclude'))
          print('unresolved:', c.get('unresolved'))
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install deterministic annotation dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::fs
            any::here
            any::jsonlite
            any::purrr
            any::readr
            any::stringi
            any::stringr
            any::tibble
            any::tidyr
            any::yaml

      - name: Deterministic species and geography identification
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_05_species_geography.R \
            --input "$CANONICAL_JSONL" \
            --output-dir "$DETERMINISTIC_DIR"

      - name: Validate deterministic stage
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DETERMINISTIC_DIR/workflow05_deterministic_summary.json"
          test -f "$DETERMINISTIC_DIR/annotation_adjudication_queue.csv"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/workflow05/deterministic/workflow05_deterministic_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['llm_calls'] == 0, x
          print(json.dumps(x, indent=2))
          print('PASS: deterministic stage made zero LLM calls.')
          PY

      - name: Upload deterministic checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: workflow05-deterministic-${{ github.run_id }}
          path: outputs/workflow05/deterministic/
          if-no-files-found: error
          retention-days: 90

  llm-adjudication:
    name: LLM adjudication of uncertain annotations only
    needs: deterministic-species-geography
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical store from Workflow 04
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.canonical_branch }}
          path: canonical_store
          lfs: true
          fetch-depth: 0

      - name: Download deterministic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: workflow05-deterministic-${{ github.run_id }}
          path: outputs/workflow05/deterministic/

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install adjudication dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::fs
            any::here
            any::httr2
            any::jsonlite
            any::purrr
            any::readr
            any::tibble
            any::tidyr
            any::yaml

      - name: Report residual LLM queue before any API call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('outputs/workflow05/deterministic/annotation_adjudication_queue.csv')
          with p.open(newline='', encoding='utf-8') as f:
              n=max(0, sum(1 for _ in f)-1)
          print(f'LLM adjudication queue: {n} records')
          print('Only these deterministic uncertainty records can be sent to the model.')
          PY

      - name: Adjudicate residual uncertainty only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_05_species_geography_adjudication.R \
            --input "$CANONICAL_JSONL" \
            --deterministic-dir "$DETERMINISTIC_DIR" \
            --output-dir "$FINAL_DIR" \
            --model '${{ inputs.model }}'

      - name: Validate Workflow 05 completion
        shell: bash
        run: |
          set -euo pipefail
          test -s "$FINAL_DIR/records.jsonl"
          test -s "$FINAL_DIR/workflow05_summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/workflow05/final/workflow05_summary.json').read_text(encoding='utf-8'))
          print(json.dumps(x, indent=2))
          if x['llm_calls_attempted'] != x['deterministic_review_queue_records']:
              raise SystemExit('FAIL: LLM call count differs from deterministic uncertainty queue size')
          if x['llm_technical_failures'] != 0:
              raise SystemExit('FAIL: technical LLM failures occurred')
          if x.get('email_notification_sent') is not False:
              raise SystemExit('FAIL: Workflow 05 must not send human-review notifications')
          print('PASS: LLM was limited to residual deterministic uncertainty; substantive uncertainty is retained for the later combined review gate.')
          PY

      - name: Upload Workflow 05 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow05-species-geography-${{ github.run_id }}
          path: |
            outputs/workflow05/deterministic/
            outputs/workflow05/final/
          if-no-files-found: error
          retention-days: 90
