name: Temporary conservative unused-file classification
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/temporary-unused-classification.yml']
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install static scanner dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')
      - name: Fresh static dependency check after eleven-file deletion
        run: |
          set -euo pipefail
          Rscript scripts/audit_mvp_dependencies.R --output /tmp/cleaned-dependency-audit.json
          Rscript -e 'x<-jsonlite::fromJSON("/tmp/cleaned-dependency-audit.json");stopifnot(length(x$errors)==0,x$counts$workflow_definitions==28)'
          test ! -e R/relevance_screening.R
          test ! -e visualisations/06_rapidly_emerging_topics.R
      - name: Classify tracked files by exact path and basename references
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, re
          files=[pathlib.Path(x) for x in subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0') if x]
          text={}
          for p in files:
              try: text[str(p)]=p.read_text(encoding='utf-8')
              except (UnicodeError, OSError): continue
          candidates=[]
          for p in files:
              s=str(p)
              if s.startswith(('.github/workflows-inert/','scripts/tests/','docs/validation/','.github/workflows/')): continue
              stem=p.name
              if len(stem)<12: continue
              uses=[]
              for other,txt in text.items():
                  if other==s: continue
                  if s in txt or stem in txt: uses.append(other)
              if not uses:
                  candidates.append(s)
          print('UNREFERENCED_CANDIDATES_BEGIN')
          print(json.dumps(candidates,indent=2))
          print('UNREFERENCED_CANDIDATES_END')
          print('Tracked:',len(files),'Conservatively unreferenced:',len(candidates))
          PY

      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-cleanup-dependency-check
          path: /tmp/cleaned-dependency-audit.json
          if-no-files-found: warn
