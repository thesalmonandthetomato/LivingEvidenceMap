name: TEMP preflight W02 after W01 integrity repair

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_preflight_w02_integrity_repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CORRUPT_W01_POINTER: 'docs/deduplication/zenodo/run-37373748707.json'
  CORRECTED_W01_POINTER: 'docs/deduplication/zenodo/run-37608813159.json'
  PREVIOUS_W02_POINTER: 'docs/enrichment/zenodo/run-37381023181.json'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','data.table'))

      - name: Restore old and corrected W01 states
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf old_w01 corrected_w01 previous_w02 outputs
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer "$CORRUPT_W01_POINTER" \
            --pointer-dir docs/deduplication/zenodo \
            --output-root old_w01
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer "$CORRECTED_W01_POINTER" \
            --pointer-dir docs/deduplication/zenodo \
            --output-root corrected_w01
          test -s old_w01/workflow01_full_five_source/manifestation_cluster_map.csv
          test -s corrected_w01/workflow01_full_five_source/manifestation_cluster_map.csv
          test -s corrected_w01/canonical/records.jsonl

      - name: Restore previous W02 sparse state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_restore_state_from_zenodo.R \
            --pointer "$PREVIOUS_W02_POINTER" \
            --output-dir previous_w02
          P="$(find previous_w02 -name cumulative_patch.jsonl -type f -print -quit)"
          test -n "$P"
          cp "$P" previous_cumulative_patch.jsonl

      - name: Derive exact current repair cohort
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(data.table);library(jsonlite)})
          dir.create('outputs/preflight',recursive=TRUE,showWarnings=FALSE)
          old <- fread('old_w01/workflow01_full_five_source/manifestation_cluster_map.csv')
          new <- fread('corrected_w01/workflow01_full_five_source/manifestation_cluster_map.csv')
          old[,key:=paste(source,source_record_id,sep='::')]
          new[,key:=paste(source,source_record_id,sep='::')]
          stopifnot(!anyDuplicated(old$key),!anyDuplicated(new$key),setequal(old$key,new$key))
          setkey(old,key);setkey(new,key)
          keys <- sort(old$key)
          a <- old[J(keys)]; b <- new[J(keys)]
          changed <- as.character(a$cluster_id) != as.character(b$cluster_id)
          affected_old <- sort(unique(as.character(a$cluster_id[changed])))
          corrected_ids <- sort(unique(as.character(new$cluster_id)))
          old_ids <- sort(unique(as.character(old$cluster_id)))
          retired <- sort(setdiff(old_ids,corrected_ids))
          added <- sort(setdiff(corrected_ids,old_ids))
          surviving_affected <- sort(intersect(affected_old,corrected_ids))
          cohort <- sort(unique(c(surviving_affected,added)))
          stopifnot(length(affected_old)==9875L)
          stopifnot(length(retired)==503L)
          stopifnot(length(added)==513L)
          stopifnot(length(cohort)==9885L)
          writeLines(affected_old,'outputs/preflight/affected_old_work_ids.txt')
          writeLines(retired,'outputs/preflight/retired_work_ids.txt')
          writeLines(added,'outputs/preflight/new_corrected_work_ids.txt')
          writeLines(cohort,'outputs/preflight/current_repair_cohort_ids.txt')
          summary <- list(
            affected_old_work_ids=length(affected_old),
            retired_old_work_ids=length(retired),
            new_corrected_work_ids=length(added),
            surviving_affected_work_ids=length(surviving_affected),
            current_repair_cohort_records=length(cohort)
          )
          writeLines(toJSON(summary,auto_unbox=TRUE,pretty=TRUE),
                     'outputs/preflight/cohort_summary.json')
          cat(sprintf('PASS: current W02 repair cohort = %d records\n',length(cohort)))

      - name: Apply prior W02 state to corrected W01 with DOI guard
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_02_apply_patch.R \
            --input corrected_w01/canonical/records.jsonl \
            --patch previous_cumulative_patch.jsonl \
            --output outputs/preflight/corrected_with_prior_w02.jsonl \
            --report outputs/preflight/previous_patch_application.json \
            --mode fill_missing

      - name: Restrict rematerialised state to structural repair cohort
        shell: Rscript {0}
        run: |
          library(jsonlite)
          ids <- readLines('outputs/preflight/current_repair_cohort_ids.txt',warn=FALSE)
          ids <- ids[nzchar(trimws(ids))]
          want <- setNames(rep(TRUE,length(ids)),ids)
          input <- file('outputs/preflight/corrected_with_prior_w02.jsonl','rt',encoding='UTF-8')
          output <- file('outputs/preflight/repair_cohort_with_prior_w02.jsonl','wt',encoding='UTF-8')
          n <- 0L
          repeat {
            lines <- readLines(input,n=250L,warn=FALSE)
            if(!length(lines)) break
            for(line in lines){
              if(!nzchar(trimws(line))) next
              z <- fromJSON(line,simplifyVector=FALSE)
              rid <- as.character(z$identity$record_id)
              if(!is.null(want[[rid]])){
                writeLines(line,output,useBytes=TRUE)
                n <- n+1L
              }
            }
          }
          close(input);close(output)
          stopifnot(n==9885L)
          cat('PASS: rematerialised structural repair cohort contains 9885 current records\n')

      - name: Plan only genuinely due enrichment within repair cohort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/plan
          Rscript scripts/updater/workflow_02_plan_batches.R \
            --input outputs/preflight/repair_cohort_with_prior_w02.jsonl \
            --output-dir outputs/plan \
            --batch-size 250 \
            --max-records 0 \
            --recheck-after-days 90 \
            --mode incremental \
            --enrich-author-keywords false

      - name: Summarise repair preflight
        shell: Rscript {0}
        run: |
          library(jsonlite)
          p <- fromJSON('outputs/preflight/previous_patch_application.json',simplifyVector=FALSE)
          plan <- fromJSON('outputs/plan/plan.json',simplifyVector=FALSE)
          c <- fromJSON('outputs/preflight/cohort_summary.json',simplifyVector=FALSE)
          due <- character()
          fs <- list.files('outputs/plan',pattern='^batch-[0-9]+\\.txt$',full.names=TRUE)
          if(length(fs)) due <- unique(unlist(lapply(fs,readLines,warn=FALSE),use.names=FALSE))
          cohort <- readLines('outputs/preflight/current_repair_cohort_ids.txt',warn=FALSE)
          stopifnot(all(due %in% cohort))
          out <- list(
            schema='living-evidence-map-w02-integrity-repair-preflight-v1',
            status='PASS',
            current_repair_cohort_records=as.integer(c$current_repair_cohort_records),
            previous_w02_patch_records=as.integer(p$patch_records),
            matched_previous_patch_records=as.integer(p$matched_patch_records),
            previous_patch_ids_absent_from_corrected_w01=length(p$missing_patch_record_ids),
            stale_previous_patches_skipped=as.integer(p$stale_patch_records),
            repair_cohort_enrichment_eligible=as.integer(plan$eligible_records),
            repair_cohort_due_api_records=as.integer(plan$due_records),
            repair_cohort_batch_count=as.integer(plan$batch_count),
            author_keyword_enrichment=FALSE,
            scopus_required=FALSE
          )
          writeLines(toJSON(out,auto_unbox=TRUE,pretty=TRUE,null='null'),
                     'outputs/preflight/preflight_summary.json')
          print(out)

      - name: Upload preflight audit
        uses: actions/upload-artifact@v4
        with:
          name: w02-integrity-repair-preflight-${{ github.run_id }}
          path: |
            outputs/preflight/cohort_summary.json
            outputs/preflight/previous_patch_application.json
            outputs/preflight/preflight_summary.json
            outputs/preflight/current_repair_cohort_ids.txt
            outputs/plan/plan.json
            outputs/plan/batch-*.txt
          retention-days: 30
          if-no-files-found: error
