name: W01-Fast frozen production-contract acceptance
# Read-only rerun after verification of optional historical source labels.
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-integration]
    paths:
      - '.github/workflows/w01_fast_integration_acceptance.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: w01-fast-final-integration-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      W00_POINTER: docs/search_record/zenodo/run-39298022062.json
      PREV_W01_POINTER: docs/deduplication/zenodo/run-39140209398.json
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      WORKFLOW01_BRANCH: workflow01-final-architecture
      WORKFLOW00_REPORTING_BRANCH: workflow01-final-architecture
      W00_SOURCES: lens,scopus,openalex,agricola,ethos,wos,ebsco_africa_wide,ebsco_amed,ebsco_psycinfo,ebsco_atla_religion,ebsco_biological_agricultural_index,ebsco_cinahl,ebsco_econlit,ebsco_family_society,ebsco_greenfile,ebsco_medline,ebsco_mla,ebsco_political_science,ebsco_waters_oceans
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-integration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          path: workflow00_registry
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install original W01 dependencies
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest","httr2","readr","stringdist","stringi","xml2","googlesheets4","yaml"))
      - name: Restore October W00 and prior W01 with metadata-only normalisation
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/experimental_w01_fast/prepare_frozen_w00_fast.R
      - name: Run fast W01 and verify original production delta replay
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/experimental_w01_fast/run_full_incremental_update.R \
            --metadata outputs/workflow01_candidates/normalised_metadata.csv \
            --prior-map previous_state/workflow01_full_five_source/manifestation_cluster_map.csv \
            --previous-decisions previous_state/workflow01_full_five_source/final_pair_decisions.csv \
            --source-manifest outputs/workflow01_union/source_inputs.json \
            --current-seed-root outputs/workflow01_union \
            --prior-canonical previous_state/canonical/records.jsonl \
            --previous-root previous_state \
            --previous-pointer docs/deduplication/zenodo/run-39140209398.json \
            --strip-actions previous_state/workflow01_full_five_source/abstract_strip_actions.jsonl \
            --repairs previous_state/provenance/cumulative_data_quality_repairs.jsonl \
            --output-dir outputs/experimental_w01_fast/final_acceptance
      - name: Verify frozen October authoritative output counts
        shell: Rscript {0}
        run: |
          library(jsonlite)
          base <- 'outputs/experimental_w01_fast/final_acceptance'
          m <- fromJSON(file.path(base,'production_canonical','canonical_manifest.json'))
          s <- fromJSON(file.path(base,'production_final','summary.json'))
          stopifnot(m$source_manifestations==136057L,m$records==50567L,
                    s$source_manifestations==136057L,s$clusters==50567L,
                    s$status=='final',file.exists(file.path(base,'delta','manifest.json')))
          cat('PASS: production-format W01 state and verified replay match frozen October counts\\n')
      - name: Upload bounded read-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-integration-acceptance-${{ github.run_id }}
          path: |
            outputs/experimental_w01_fast/benchmark-stages.json
            outputs/experimental_w01_fast/final_acceptance/run_report.json
            outputs/experimental_w01_fast/final_acceptance/cumulative_decisions.csv.audit.json
            outputs/experimental_w01_fast/final_acceptance/production_final/summary.json
            outputs/experimental_w01_fast/final_acceptance/production_canonical/canonical_manifest.json
            outputs/experimental_w01_fast/final_acceptance/delta/manifest.json
          retention-days: 7
          if-no-files-found: warn
