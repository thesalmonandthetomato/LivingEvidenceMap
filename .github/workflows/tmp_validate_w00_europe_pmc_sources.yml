name: TEMP validate W00 Europe PMC sources

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w00_europe_pmc_sources.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install validator dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','yaml'))

      - name: Parse workflow and R implementation
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(yaml))
          yaml.load_file('.github/workflows/workflow_00_search_orchestrator.yml')
          yaml.load_file('.github/workflows/_workflow_00_orchestrated_source_child.yml')
          parse(file='scripts/updater/workflow_00_search_orchestrator.R')
          parse(file='scripts/updater/workflow_00f_europe_pmc_source_ingestion.R')
          parse(file='scripts/updater/workflow_01x_europe_pmc_sidecar_adapter.R')
          parse(file='scripts/updater/workflow_00_native_id_reconcile.R')
          parse(file='scripts/updater/workflow_00_expansion_native_id_reconcile.R')
          cat('PASS: W00 Europe PMC workflows and R scripts parse\n')

      - name: Validate query planning
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_search_orchestrator.R             --run-type full             --config user_input/workflow00_search_strategy.json             --output-dir /tmp/w00-full
          Rscript scripts/updater/workflow_00_search_orchestrator.R             --run-type fortnightly             --config user_input/workflow00_search_strategy.json             --output-dir /tmp/w00-fortnightly
          Rscript - <<'RS'
          library(jsonlite)
          f <- fromJSON('/tmp/w00-full/source_queries.json')
          z <- fromJSON('/tmp/w00-fortnightly/source_queries.json')
          expected <- c(pubmed='MED',ethos='ETH',cba='CBA',epmc_preprints='PPR')
          for(n in names(expected)){
            stopifnot(grepl(paste0('SRC:',expected[[n]]),f[[n]],fixed=TRUE))
            stopifnot(grepl('TITLE_ABS:',f[[n]],fixed=TRUE))
            stopifnot(!grepl('CREATION_DATE:',f[[n]],fixed=TRUE))
            stopifnot(grepl(paste0('SRC:',expected[[n]]),z[[n]],fixed=TRUE))
            stopifnot(grepl('CREATION_DATE:',z[[n]],fixed=TRUE))
          }
          cat('PASS: four Europe PMC source queries and fortnightly creation-date filters validated\n')
          RS

      - name: Validate synthetic source handoffs
        shell: bash
        run: |
          set -euo pipefail
          for spec in "pubmed MED PubMed_MEDLINE" "ethos ETH EThOS_theses" "cba CBA Chinese_Biological_Abstracts" "epmc_preprints PPR Europe_PMC_preprints"; do
            set -- $spec
            slug="$1"; code="$2"; collection="${3//_/ }"
            root="/tmp/$slug"
            mkdir -p "$root/raw" "$root/sidecar" "$root/reconcile"
            SLUG="$slug" CODE="$code" Rscript - <<'RS'
            library(jsonlite)
            slug <- Sys.getenv('SLUG'); code <- Sys.getenv('CODE')
            rec <- list(
              id=paste0(code,'12345'), source=code,
              title=paste('Fixture',slug,'record'),
              abstractText='salmon aquaculture fixture abstract',
              pubYear='2026', doi=paste0('10.1234/',slug,'.fixture'),
              authorList=list(author=list(list(fullName='Example Author'))),
              keywordList=list(keyword=list('salmon','aquaculture')),
              pubTypeList=list(pubType=list('research article')),
              firstPublicationDate='2026-09-30'
            )
            x <- list(hitCount=1,nextCursorMark='AoI=',resultList=list(result=list(rec)))
            writeLines(toJSON(x,auto_unbox=TRUE,null='null'),file.path('/tmp',slug,'raw','response_000001.json'))
            RS
            Rscript scripts/updater/workflow_01x_europe_pmc_sidecar_adapter.R               --input-dir "$root" --output-dir "$root/sidecar"               --source-code "$code" --source-slug "$slug" --source-collection "$collection"
            : > "$root/known.txt"
            Rscript scripts/updater/workflow_00_native_id_reconcile.R               --source "$slug" --run-type full --current-root "$root"               --registry "$root/known.txt" --output-dir "$root/reconcile"
            test -s "$root/reconcile/updated_native_ids.txt"
            grep -qx "$code:$code"12345 "$root/reconcile/updated_native_ids.txt" && exit 90 || true
            grep -qx "$code:${code}12345" "$root/reconcile/updated_native_ids.txt"
            test -s "$root/sidecar/${slug}_sidecar_records.jsonl"
          done
          echo 'PASS: MED/ETH/CBA/PPR synthetic sidecar and native-ID handoffs validated'

      - name: Validate orchestrator source coverage
        shell: Rscript {0}
        run: |
          x <- paste(readLines('.github/workflows/workflow_00_search_orchestrator.yml',warn=FALSE),collapse='\n')
          child <- paste(readLines('.github/workflows/_workflow_00_orchestrated_source_child.yml',warn=FALSE),collapse='\n')
          for(s in c('pubmed','ethos','cba','epmc_preprints')){
            stopifnot(grepl(paste0('      ',s,':'),x,fixed=TRUE))
            stopifnot(grepl(paste0('source: ',s),x,fixed=TRUE))
            stopifnot(grepl(s,child,fixed=TRUE))
          }
          stopifnot(grepl("default: false",x,fixed=TRUE))
          cat('PASS: all four sources are independently wired and default off\n')
