name: W08 temporary configuration regression
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w08-temporary-archive-config.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Validate W08 generic archive metadata and canonical contract
        shell: Rscript {0}
        run: |
          library(jsonlite)
          archive <- "scripts/updater/workflow_08_archive_to_zenodo.R"
          finalize <- "scripts/updater/workflow_08_finalize_canonical_dynamic.R"
          parse(file=archive)
          parse(file=finalize)
          cfg <- fromJSON("user_input/workflow08_human_review_config.json",simplifyVector=FALSE)
          stopifnot(length(cfg$zenodo_creators)>=1L)
          stopifnot(identical(cfg$zenodo_creators[[1]]$name,"Haddaway, Neal"))
          src <- paste(readLines(archive),collapse="\n")
          stopifnot(grepl("creators=creators,",src,fixed=TRUE))
          stopifnot(!grepl('creators=list(list(name="Haddaway, Neal"))',src,fixed=TRUE))
          core <- paste(readLines(finalize),collapse="\n")
          stopifnot(grepl('canonical_schema_version="living-evidence-map-canonical-v1"',core,fixed=TRUE))
          stopifnot(grepl('rec$publication_status<-ps;rec$screening<-screening;',core,fixed=TRUE))
          cat("PASS: archive metadata configured; canonical schema and field assembly preserved\n")
