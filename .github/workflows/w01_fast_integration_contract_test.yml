name: W01-Fast staged integration contract
on:
  push:
    branches: [w01-fast-integration]
    paths:
      - 'scripts/updater/experimental_w01_fast/stage_production_canonical_contract.R'
      - 'scripts/updater/experimental_w01_fast/test_production_canonical_contract.R'
      - 'scripts/updater/experimental_w01_fast/stage_production_pair_ledger.R'
      - 'scripts/updater/experimental_w01_fast/test_production_pair_ledger.R'
      - '.github/workflows/w01_fast_integration_contract_test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install small R requirements
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest"))
      - name: Verify canonical output contract and refusal of inconsistent state
        shell: bash
        run: |
          Rscript scripts/updater/experimental_w01_fast/test_production_canonical_contract.R
          Rscript scripts/updater/experimental_w01_fast/test_production_pair_ledger.R
