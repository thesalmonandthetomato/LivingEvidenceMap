name: TEMP W01 historical graph audit
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_w01_graph_audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("data.table","jsonlite","digest","httr2","readr","curl"))'
      - name: Restore authoritative historical state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          Rscript scripts/updater/workflow_01_restore_current_state.R --pointer docs/deduplication/zenodo/run-40218882441.json --pointer-dir docs/deduplication/zenodo --output-root previous_state
      - name: Compare historical graph and cluster map
        shell: Rscript {0}
        run: |
          library(data.table)
          m <- fread("previous_state/workflow01_full_five_source/manifestation_cluster_map.csv")
          setorder(m,idx)
          stopifnot(identical(m$idx,seq_len(nrow(m))))
          p <- fread("previous_state/workflow01_full_five_source/final_pair_decisions.csv",select=c("record_i","record_j","rescored_classification"))
          d <- p[rescored_classification=="duplicate"]
          stopifnot(all(d$record_i %in% m$idx),all(d$record_j %in% m$idx))
          parent <- seq_len(nrow(m))
          root <- function(i){while(parent[i]!=i){parent[i]<<-parent[parent[i]];i<-parent[i]};i}
          for(k in seq_len(nrow(d))){i<-root(d$record_i[k]);j<-root(d$record_j[k]);if(i!=j)parent[j]<-i}
          m[,component:=vapply(idx,root,integer(1))]
          cat("Historical manifestations:",nrow(m),"\n")
          cat("Historical works:",uniqueN(m$cluster_id),"\n")
          cat("Historical duplicate edges:",nrow(d),"\n")
          cat("Historical works disconnected in pair ledger:",m[,uniqueN(component),by=cluster_id][V1>1L,.N],"\n")
          cat("Graph components spanning historical works:",m[,uniqueN(cluster_id),by=component][V1>1L,.N],"\n")
          cat("Duplicate edges spanning historical works:",sum(m$cluster_id[d$record_i]!=m$cluster_id[d$record_j]),"\n")
