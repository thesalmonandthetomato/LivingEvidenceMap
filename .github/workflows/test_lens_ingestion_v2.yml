name: Test updater Workflow 01 - Lens ingestion

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Lens created date, inclusive (YYYY-MM-DD)'
        required: true
        default: '2026-02-01'
      end_date:
        description: 'Lens created date, inclusive (YYYY-MM-DD)'
        required: true
        default: '2026-08-07'
      max_records:
        description: 'Maximum records to retrieve for this test'
        required: true
        default: '1000'
      checkpoint_test:
        description: 'Run intentional failure then resume test'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lens-ingestion-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow 01 development branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-01-lens-ingestion

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Intentional failure checkpoint test
        if: ${{ inputs.checkpoint_test }}
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          set +e
          python scripts/updater/lens_ingestion.py \
            --start-date '${{ inputs.start_date }}' \
            --end-date '${{ inputs.end_date }}' \
            --max-records '${{ inputs.max_records }}' \
            --fail-after-batch 2
          status=$?
          set -e
          test "$status" -ne 0
          test -s outputs/updater/lens_ingestion_test/checkpoint.json
          test -s outputs/updater/lens_ingestion_test/raw/response_000002.json
          echo "Checkpointed intentional failure confirmed."

      - name: Resume from checkpoint
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          python scripts/updater/lens_ingestion.py \
            --start-date '${{ inputs.start_date }}' \
            --end-date '${{ inputs.end_date }}' \
            --max-records '${{ inputs.max_records }}' \
            --resume

      - name: Validate final JSONL integrity and reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/updater/lens_ingestion_test')
          manifest = json.loads((root / 'manifest.json').read_text())
          rows = [json.loads(line) for line in (root / 'records.jsonl').read_text().splitlines() if line.strip()]
          ids = [r['identity']['lens_id'] for r in rows]
          assert len(rows) == manifest['records_unique'], (len(rows), manifest['records_unique'])
          assert len(ids) == len(set(ids)), 'Duplicate lens_id in canonical JSONL'
          assert manifest['status'] == 'success'
          assert manifest['batches'] >= 3, manifest['batches']
          print(f"Validated {len(rows)} JSONL records across {manifest['batches']} batches.")
          PY

      - name: Upload Workflow 01 artefacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-workflow-01-lens-ingestion-${{ github.run_id }}
          path: outputs/updater/lens_ingestion_test/
          if-no-files-found: error
          retention-days: 30
