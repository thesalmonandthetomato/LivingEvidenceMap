name: ONE-OFF W04 citation chasing overlay finalisation 40298490744

on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/oneoff_w04_citation_chasing_overlay_finalize_40298490744.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: workflow04-human-resume
  cancel-in-progress: false

env:
  WORKFLOW04_BRANCH: workflow01-final-architecture
  SOURCE_RUN_ID: '40298490744'
  BATCH_ID: 'w04-resolution-40298490744-49fb9e3d586f'
  QUEUE_SHA256: '49fb9e3d586f9d17e9a3f5a55b6eca472bb9032084f54fb3f7b8e709a78c8cbf'
  LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'

jobs:
  resume:
    outputs:
      source_run_id: ${{ steps.handoff.outputs.source_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Expose W05 handoff source run
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','googlesheets4','readr'))

      - name: Parse W04 resume implementation
        shell: Rscript {0}
        run: |
          files <- c(
            'scripts/updater/workflow_04_export_shiny_resolution_decisions.R',
            'scripts/updater/workflow_04_apply_human_resolution.R',
            'scripts/updater/workflow_04_archive_state_to_zenodo.R',
            'scripts/updater/workflow_04_update_zenodo_registry.R',
            'scripts/updater/workflow_shiny_batch_status.R',
            'scripts/updater/workflow_current_run_status_observer.R',
            'scripts/updater/workflow_current_run_status_to_shiny.R'
          )
          invisible(lapply(files,parse))
          cat('PASS: W04 Shiny resolution resume implementation parses\n')

      - name: Download immutable stopped W04 state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/final source/prepared
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "workflow04-production-$SOURCE_RUN_ID" \
            --dir source/final
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "workflow04-prepared-$SOURCE_RUN_ID" \
            --dir source/prepared
          test -s source/final/workflow04_final/workflow04_final_screening_layer.jsonl
          test -s source/final/workflow04_final/workflow04_human_review_queue.jsonl
          test -s source/final/workflow04_final/summary.json
          test -s source/prepared/outputs/workflow04_prepare/prompt_provenance.json
          test -s source/prepared/inputs/current/canonical_lean.jsonl
          test -s source/prepared/inputs/current/publication_status.jsonl

      - name: Prepare Google credential
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          echo "LEM_GOOGLE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/lem-google-service-account.json" >> "$GITHUB_ENV"

      - name: Create immutable one-off exclusion overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/w04_resume
          Rscript scripts/oneoff/w04_citation_chasing_40298490744_overlay.R \
            source/final/workflow04_final/workflow04_human_review_queue.jsonl \
            outputs/w04_resume/overlay
          Rscript --vanilla - <<'RSCRIPT'
          library(jsonlite)
          p <- "outputs/w04_resume/overlay/oneoff_final_decision_overlay.jsonl"
          x <- lapply(readLines(p),function(y)fromJSON(y,simplifyVector=FALSE))
          stopifnot(length(x)==2944L)
          out <- vapply(x,function(z)toJSON(list(
            record_id=z$record_id,decision="exclude",rationale=z$rationale,
            reviewer=z$origin,adjudicated_at_utc="2026-10-27T00:00:00Z"
          ),auto_unbox=TRUE),character(1))
          writeLines(out,"outputs/w04_resume/human_resolution_decisions.jsonl")
          RSCRIPT

      - name: Apply human resolutions without rerunning screening
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow04_final
          Rscript scripts/updater/workflow_04_apply_human_resolution.R \
            --source-layer source/final/workflow04_final/workflow04_final_screening_layer.jsonl \
            --canonical source/prepared/inputs/current/canonical_lean.jsonl \
            --decisions outputs/w04_resume/human_resolution_decisions.jsonl \
            --source-summary source/final/workflow04_final/summary.json \
            --output-dir outputs/workflow04_final
          STATUS="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow04_final/summary.json");cat(x$status)')"
          test "$STATUS" = "PASS"
          cp source/prepared/outputs/workflow04_prepare/prompt_provenance.json outputs/workflow04_final/prompt_provenance.json

      - name: Publish resolved W04 state to restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CAN_SHA="$(Rscript -e 'cat(digest::digest(file="source/prepared/inputs/current/canonical_lean.jsonl",algo="sha256",serialize=FALSE))')"
          W03_SHA="$(Rscript -e 'cat(digest::digest(file="source/prepared/inputs/current/publication_status.jsonl",algo="sha256",serialize=FALSE))')"
          PROMPT_SHA="$(Rscript -e 'x<-jsonlite::fromJSON("source/prepared/outputs/workflow04_prepare/prompt_provenance.json",simplifyVector=FALSE);stopifnot(grepl("^[0-9a-f]{64}$",x$prompt_sha256));cat(x$prompt_sha256)')"
          mkdir -p outputs/workflow04_zenodo
          Rscript scripts/updater/workflow_04_archive_state_to_zenodo.R \
            --state-dir outputs/workflow04_final \
            --source-run-id "$SOURCE_RUN_ID" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir outputs/workflow04_zenodo \
            --upstream-lean-sha256 "$CAN_SHA" \
            --upstream-workflow03-sha256 "$W03_SHA" \
            --prompt-sha256 "$PROMPT_SHA"

      - name: Register resolved W04 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$WORKFLOW04_BRANCH"
          Rscript scripts/updater/workflow_04_update_zenodo_registry.R \
            --receipt outputs/workflow04_zenodo/zenodo_receipt.json \
            --registry docs/workflow04/zenodo_registry.csv \
            --pointer-dir docs/workflow04/zenodo
          git add docs/workflow04/zenodo_registry.csv docs/workflow04/zenodo/
          if ! git diff --cached --quiet; then
            git commit -m "Register resumed Workflow 04 state $SOURCE_RUN_ID"
            git push origin HEAD:"$WORKFLOW04_BRANCH"
          fi

      - name: Update live Shiny progress after resolved W04
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$WORKFLOW04_BRANCH"
          Rscript scripts/updater/workflow_current_run_status_observer.R \
            --force-stage W04 \
            --pointer "docs/workflow04/zenodo/run-$SOURCE_RUN_ID.json"
          Rscript scripts/updater/workflow_current_run_status_to_shiny.R \
            --status docs/current_run/current_run_status.json \
            --sheet-id "$LEM_GOOGLE_SHEET_ID" \
            --credential "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          Rscript scripts/reporting/write_workflow09_stage_summary.R --stage W04 --run-id "$SOURCE_RUN_ID"
          Rscript scripts/reporting/refresh_workflow09_input_manifest.R
          git add docs/current_run/current_run_status.json docs/reporting/workflow_09_inputs/current
          if ! git diff --cached --quiet; then
            git commit -m "Update current-run status through W04 [skip ci]"
            git pull --rebase origin "$WORKFLOW04_BRANCH"
            git push origin HEAD:"$WORKFLOW04_BRANCH"
          fi

      - name: Acknowledge consumed W04 resolution batch
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_SHA="$(Rscript -e 'cat(digest::digest(file="outputs/workflow04_final/workflow04_final_screening_layer.jsonl",algo="sha256",serialize=FALSE))')"
          Rscript scripts/updater/workflow_shiny_batch_status.R \
            --stage "04" \
            --batch-id "$BATCH_ID" \
            --queue-sha256 "$QUEUE_SHA256" \
            --status consumed \
            --sheet-id "$LEM_GOOGLE_SHEET_ID" \
            --credential "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --source-run-id "$SOURCE_RUN_ID" \
            --output-sha256 "$OUTPUT_SHA" \
            --message "Workflow 04 Shiny resolution decisions applied; final W04 state archived and registered."

      - name: Upload resumed W04 handoff
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-shiny-resume-${{ github.run_id }}
          path: |
            outputs/w04_resume/
            outputs/workflow04_final/
            outputs/workflow04_zenodo/
          retention-days: 90
          if-no-files-found: error

  handoff-w05:
    permissions:
      contents: write
      actions: write
    needs: resume
    if: ${{ needs.resume.result == 'success' }}
    uses: ./.github/workflows/workflow_05_production.yml
    with:
      workflow04_pointer_path: ${{ format('docs/workflow04/zenodo/run-{0}.json', needs.resume.outputs.source_run_id) }}
      publish: true
    secrets: inherit

