name: W08 temporary Shiny handoff contract
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w08-temporary-shiny-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install test dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest"))
      - name: Verify queue and decision handoff contracts without Google access
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)
          base <- "scripts/updater/"
          paths <- file.path(base,c("workflow_08_publish_shiny_queue.R","workflow_08_capture_active_shiny_decisions.R","workflow_08_export_shiny_decisions.R"))
          for(p in paths) parse(file=p)
          pub <- paste(readLines(paths[[1]]),collapse="\n")
          cap <- paste(readLines(paths[[2]]),collapse="\n")
          exp <- paste(readLines(paths[[3]]),collapse="\n")
          stopifnot(grepl('tab <- arg("--tab","queue_w08_active")',pub,fixed=TRUE))
          for(field in c("batch_id","queue_sha256","case_json","species_options_json","topic_options_json","record_id"))
            stopifnot(grepl(paste0(field,"="),pub,fixed=TRUE))
          stopifnot(grepl("digest(reconstructed,algo=\"sha256\"",pub,fixed=TRUE))
          for(field in c("queue_w08_active","decisions_w08","issue_decisions_json","issue_state_sha256"))
            stopifnot(grepl(field,cap,fixed=TRUE))
          for(field in c("queue_w08_active","decisions_w08","review_key","record_case_sha256","issue_state_sha256","validate_issue_decision"))
            stopifnot(grepl(field,exp,fixed=TRUE))
          rec<-list(record_id="example",title="Synthetic",abstract="Synthetic abstract",issues=list(list(issue_type="geography_evidence_unvalidated",source_workflow="06",automated_value=list(geography_reason="invalid_iso3",luna_iso3c="INN"),allowed_human_outcomes=c("override_country_set","assign_none","exclude_record"))))
          issue<-rec$issues[[1]]
          state<-list(review_key="example::geography_evidence_unvalidated",record_id=rec$record_id,issue_type=issue$issue_type,source_workflow=issue$source_workflow,title=rec$title,abstract=rec$abstract,automated_value=issue$automated_value,allowed_human_outcomes=issue$allowed_human_outcomes)
          issue$issue_state_sha256<-digest(toJSON(state,auto_unbox=TRUE,null="null",na="null",digits=NA,pretty=FALSE),algo="sha256",serialize=FALSE)
          rec$issues[[1]]<-issue
          line<-toJSON(rec,auto_unbox=TRUE,null="null",na="null",digits=NA)
          copy<-fromJSON(line,simplifyVector=FALSE)
          stopifnot(identical(copy$record_id,"example"),identical(copy$issues[[1]]$automated_value$luna_iso3c,"INN"))
          stopifnot(!("accept_model" %in% copy$issues[[1]]$allowed_human_outcomes))
          cat("PASS: publisher/capture/export contract and invalid-ISO issue roundtrip\n")
