name: Report - Workflow 09 publication package

on:
  workflow_dispatch:
    inputs:
      search_update_date:
        description: 'Actual latest database search date (YYYY-MM-DD); leave blank only when unknown'
        required: false
        default: ''
        type: string
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/reporting/.run_workflow09_figures'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libcairo2-dev libglpk-dev \
            pandoc libreoffice-writer

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "jsonlite","dplyr","tidyr","readr","ggplot2","scales","here",
            "stringr","sf","classInt","rnaturalearth","rnaturalearthdata",
            "httr2","digest","rmarkdown","knitr"
          ))

      - name: Resolve and validate release provenance
        env:
          SEARCH_UPDATE_DATE_OVERRIDE: ${{ inputs.search_update_date || '' }}
        shell: Rscript {0}
        run: |
          library(jsonlite)

          status_path <- "docs/current_run/current_run_status.json"
          if (!file.exists(status_path)) stop("Current-run status is missing", call. = FALSE)
          status <- fromJSON(status_path, simplifyVector = FALSE)

          one <- function(x, label) {
            if (is.null(x) || !length(x) || !nzchar(as.character(x[[1L]]))) {
              stop(label, " is missing from current-run provenance", call. = FALSE)
            }
            as.character(x[[1L]])
          }

          w01_run <- one(status$workflow_runs$W01, "Workflow 01 run ID")
          w02_run <- one(status$workflow_runs$W02, "Workflow 02 run ID")
          w01_pointer <- sprintf("docs/deduplication/zenodo/run-%s.json", w01_run)
          w02_pointer <- sprintf("docs/enrichment/zenodo/run-%s.json", w02_run)

          if (!file.exists(w01_pointer)) stop("Current release W01 pointer not found: ", w01_pointer, call. = FALSE)
          if (!file.exists(w02_pointer)) stop("Current release W02 pointer not found: ", w02_pointer, call. = FALSE)

          reg <- read.csv("docs/workflow08/zenodo_registry.csv", stringsAsFactors = FALSE, check.names = FALSE)
          hit <- reg[as.character(reg$status) == "authoritative", , drop = FALSE]
          if (nrow(hit) != 1L) stop("Expected exactly one authoritative Workflow 08 registry row", call. = FALSE)
          w08_run <- as.character(hit$source_run_id[[1L]])
          w08_pointer <- sprintf("docs/workflow08/zenodo/run-%s.json", w08_run)
          if (!file.exists(w08_pointer)) stop("Authoritative W08 pointer not found: ", w08_pointer, call. = FALSE)

          w01 <- fromJSON(w01_pointer, simplifyVector = FALSE)
          w02 <- fromJSON(w02_pointer, simplifyVector = FALSE)
          w08 <- fromJSON(w08_pointer, simplifyVector = FALSE)

          stopifnot(
            identical(as.character(w01$status), "published"),
            identical(as.character(w01$workflow), "01"),
            identical(as.character(w02$status), "published"),
            identical(as.character(w02$workflow), "02"),
            identical(as.character(w08$status), "published"),
            identical(as.character(w08$workflow), "08")
          )

          if (!identical(
            tolower(as.character(w02$upstream_workflow01_canonical_sha256)),
            tolower(as.character(w01$canonical_jsonl_sha256))
          )) {
            stop("Workflow 02 pointer does not belong to the selected Workflow 01 canonical state", call. = FALSE)
          }

          w01_n <- as.integer(w01$canonical_records)
          w08_source_n <- as.integer(w08$source_canonical_population)
          w08_final_n <- as.integer(w08$canonical_records)
          w08_excluded_n <- as.integer(w08$excluded_records)
          if (is.na(w01_n) || is.na(w08_source_n) || is.na(w08_final_n) || is.na(w08_excluded_n)) {
            stop("Release provenance contains invalid record counts", call. = FALSE)
          }
          if (w08_source_n != w01_n || (w08_final_n + w08_excluded_n) != w01_n) {
            stop("Workflow 01 and Workflow 08 populations do not reconcile for this release", call. = FALSE)
          }

          search_date <- trimws(Sys.getenv("SEARCH_UPDATE_DATE_OVERRIDE", unset = ""))
          if (!nzchar(search_date)) {
            source_dates <- one(status$search$search_date, "Search update date")
            regs <- list.files("user_input", pattern = "^workflow00_ris_.*\\.json$", full.names = TRUE)
            if (length(regs)) {
              manual_dates <- vapply(regs, function(p) {
                z <- tryCatch(fromJSON(p, simplifyVector = FALSE), error = function(e) NULL)
                if (is.null(z)) return("")
                if (is.null(z$search) || is.null(z$search$search_date)) "" else as.character(z$search$search_date)
              }, character(1))
              source_dates <- c(source_dates, manual_dates)
            }
            source_dates <- source_dates[grepl("^\\d{4}-\\d{2}-\\d{2}$", source_dates)]
            if (!length(source_dates)) stop("No valid source search dates found", call. = FALSE)
            search_date <- max(source_dates)
          }
          if (!grepl("^\\d{4}-\\d{2}-\\d{2}$", search_date)) {
            stop("Search update date must be YYYY-MM-DD", call. = FALSE)
          }

          env <- Sys.getenv("GITHUB_ENV")
          cat(sprintf("W01_POINTER=%s\n", w01_pointer), file = env, append = TRUE)
          cat(sprintf("W02_POINTER=%s\n", w02_pointer), file = env, append = TRUE)
          cat(sprintf("W08_POINTER=%s\n", w08_pointer), file = env, append = TRUE)
          cat(sprintf("SEARCH_UPDATE_DATE=%s\n", search_date), file = env, append = TRUE)

          cat(sprintf(
            paste0(
              "PASS: W09 release provenance: W01=%s (%d records; %s), ",
              "W02=%s (upstream W01 SHA matched), ",
              "W08=%s (%d included + %d excluded), search_date=%s\n"
            ),
            w01_run, w01_n, as.character(w01$canonical_jsonl_sha256),
            w02_run, w08_run, w08_final_n, w08_excluded_n, search_date
          ))

      - name: Restore latest authoritative Workflow 08 final state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin workflow01-final-architecture
          test -n "$W08_POINTER"
          Rscript scripts/reporting/restore_workflow08_reporting_state.R \
            --pointer "$W08_POINTER" \
            --output-dir workflow08_reporting_state
          test -s workflow08_reporting_state/living_evidence_map_canonical_final.jsonl
          test -s workflow08_reporting_state/workflow08_excluded_records.csv

      - name: Validate compact Workflow 00-08 reporting inputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)

          root <- "docs/reporting/workflow_09_inputs/current"
          manifest_path <- file.path(root, "manifest.json")
          if (!file.exists(manifest_path)) stop("Compact Workflow 09 input manifest is missing", call. = FALSE)
          manifest <- fromJSON(manifest_path, simplifyVector = FALSE)
          stopifnot(identical(manifest$schema, "living-evidence-map-workflow09-input-manifest-v1"))

          stage_files <- sprintf("w%02d_summary.json", 0:8)
          missing <- stage_files[!file.exists(file.path(root, stage_files))]
          if (length(missing)) stop("Missing stage summary file(s): ", paste(missing, collapse = ", "), call. = FALSE)

          summaries <- lapply(sprintf("W%02d", 0:8), function(stage) {
            x <- fromJSON(file.path(root, paste0(tolower(stage), "_summary.json")), simplifyVector = FALSE)
            stopifnot(identical(as.character(x$stage), stage), identical(as.character(x$status), "complete"))
            x
          })
          names(summaries) <- sprintf("W%02d", 0:8)

          w01 <- fromJSON(Sys.getenv("W01_POINTER"), simplifyVector = FALSE)
          w02 <- fromJSON(Sys.getenv("W02_POINTER"), simplifyVector = FALSE)
          w08 <- fromJSON(Sys.getenv("W08_POINTER"), simplifyVector = FALSE)
          status <- fromJSON("docs/current_run/current_run_status.json", simplifyVector = FALSE)

          expected_runs <- c(
            W01 = as.character(status$workflow_runs$W01),
            W02 = as.character(status$workflow_runs$W02),
            W03 = as.character(status$workflow_runs$W03),
            W04 = as.character(status$workflow_runs$W04),
            W05 = as.character(status$workflow_runs$W05),
            W06 = as.character(status$workflow_runs$W06),
            W07 = as.character(status$workflow_runs$W07),
            W08 = as.character(status$workflow_runs$W08)
          )
          observed_runs <- vapply(summaries[names(expected_runs)], function(x) as.character(x$source_run_id), character(1))
          if (!identical(unname(observed_runs), unname(expected_runs))) {
            stop("Compact Workflow 09 stage summaries do not match the current-run workflow IDs", call. = FALSE)
          }

          membership_path <- file.path(root, "w01_source_membership.csv")
          if (!file.exists(membership_path)) stop("Compact W01 source membership is missing", call. = FALSE)

          w01_src <- fromJSON(file.path(root, "w01_source_manifest.json"), simplifyVector = FALSE)
          w08_src <- fromJSON(file.path(root, "w08_source_manifest.json"), simplifyVector = FALSE)
          membership_sha <- digest(file = membership_path, algo = "sha256", serialize = FALSE)
          stopifnot(
            identical(as.character(w01_src$source_run_id), as.character(status$workflow_runs$W01)),
            identical(as.character(w08_src$source_run_id), as.character(status$workflow_runs$W08)),
            identical(tolower(as.character(w01_src$canonical_sha256)), tolower(as.character(w01$canonical_jsonl_sha256))),
            identical(tolower(as.character(w08_src$canonical_sha256)), tolower(as.character(w08$final_canonical_jsonl_sha256))),
            identical(tolower(as.character(w01_src$w01_source_membership_sha256)), tolower(membership_sha)),
            identical(tolower(as.character(w08_src$w01_source_membership_sha256)), tolower(membership_sha)),
            as.integer(w01_src$canonical_records) == as.integer(w01$canonical_records),
            as.integer(w08_src$canonical_records) == as.integer(w08$canonical_records)
          )

          cat(sprintf(
            "PASS: compact W09 inputs match current release: W01=%s W02=%s W03=%s W04=%s W05=%s W06=%s W07=%s W08=%s\n",
            expected_runs[["W01"]], expected_runs[["W02"]], expected_runs[["W03"]], expected_runs[["W04"]],
            expected_runs[["W05"]], expected_runs[["W06"]], expected_runs[["W07"]], expected_runs[["W08"]]
          ))

      - name: Export full canonical library to RIS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow09_data
          Rscript scripts/reporting/export_canonical_ris.R \
            --input workflow08_reporting_state/living_evidence_map_canonical_final.jsonl \
            --output outputs/workflow09_data/living_evidence_map_canonical_final.ris \
            --manifest outputs/workflow09_data/living_evidence_map_canonical_final.ris.manifest.json

      - name: Render manuscript figures from authoritative pipeline data
        env:
          CANONICAL_JSONL: ${{ github.workspace }}/workflow08_reporting_state/living_evidence_map_canonical_final.jsonl
          W09_INPUT_DIR: ${{ github.workspace }}/docs/reporting/workflow_09_inputs/current
        shell: bash
        run: |
          set -euo pipefail
          Rscript visualisations/01_records_by_publication_year.R
          Rscript visualisations/02_records_by_country.R
          Rscript visualisations/03_choropleth_records_by_country.R
          Rscript visualisations/04_topic_hierarchy.R
          Rscript visualisations/05_records_by_publication_year_high_level_topic.R
          Rscript visualisations/07_flow_diagram.R
          Rscript visualisations/08_umbrella_review_figure.R

      - name: Render database contribution figure
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/reporting/plot_citesource_database_contribution.R \
            --input-dir docs/reporting/workflow_09_inputs/current \
            --output-dir outputs/citesource_contribution

      - name: Render Methods and Results manuscripts
        env:
          CANONICAL_JSONL: ${{ github.workspace }}/workflow08_reporting_state/living_evidence_map_canonical_final.jsonl
          FLOW_COUNTS_JSON: ${{ github.workspace }}/visualisations/figure_07_flow_diagram_counts.json
          CITESOURCE_OUTPUT_DIR: ${{ github.workspace }}/outputs/citesource_contribution
        shell: Rscript {0}
        run: |
          dir.create("outputs/workflow09_manuscript", recursive = TRUE, showWarnings = FALSE)

          render_all <- function(input, stem) {
            out <- normalizePath("outputs/workflow09_manuscript", mustWork = TRUE)
            env <- new.env(parent = globalenv())

            rmarkdown::render(
              input = input,
              output_format = "word_document",
              output_file = paste0(stem, ".docx"),
              output_dir = out,
              envir = env,
              clean = TRUE
            )
            rmarkdown::render(
              input = input,
              output_format = "html_document",
              output_file = paste0(stem, ".html"),
              output_dir = out,
              envir = new.env(parent = globalenv()),
              clean = TRUE
            )
            rmarkdown::render(
              input = input,
              output_format = "md_document",
              output_file = paste0(stem, ".md"),
              output_dir = out,
              envir = new.env(parent = globalenv()),
              clean = TRUE
            )
          }

          render_all("docs/reporting/workflow_09/manuscript/long_form_methods.Rmd", "methods")
          render_all("docs/reporting/workflow_09/manuscript/long_form_results.Rmd", "results")

          stopifnot(all(file.exists(file.path(
            "outputs/workflow09_manuscript",
            c("methods.docx","methods.html","methods.md","results.docx","results.html","results.md")
          ))))

      - name: Convert Word manuscripts to PDF
        shell: bash
        run: |
          set -euo pipefail
          libreoffice --headless --convert-to pdf --outdir outputs/workflow09_manuscript outputs/workflow09_manuscript/methods.docx
          libreoffice --headless --convert-to pdf --outdir outputs/workflow09_manuscript outputs/workflow09_manuscript/results.docx
          test -s outputs/workflow09_manuscript/methods.pdf
          test -s outputs/workflow09_manuscript/results.pdf

      - name: Stage permanent Workflow 09 publication package
        shell: bash
        run: |
          set -euo pipefail
          PUB=docs/reporting/workflow_09
          mkdir -p "$PUB/figures" "$PUB/figure_code" "$PUB/data" "$PUB/manuscript" "$PUB/data/workflow_inputs"

          # Remove superseded generated figure/code files from previous W09 runs
          # before staging the new publication package. Static manuscript source
          # files are deliberately retained.
          rm -f "$PUB/figures"/figure_*.png "$PUB/figures"/figure_*.pdf
          rm -f "$PUB/figure_code"/*.R

          # Final manuscript figure numbering.
          cp visualisations/figure_07_flow_diagram.png "$PUB/figures/figure_01_flow_diagram.png"
          cp visualisations/figure_07_flow_diagram.pdf "$PUB/figures/figure_01_flow_diagram.pdf"
          cp outputs/citesource_contribution/database_unique_contribution.png "$PUB/figures/figure_02_database_unique_contribution.png"
          cp outputs/citesource_contribution/database_unique_contribution.pdf "$PUB/figures/figure_02_database_unique_contribution.pdf"
          cp outputs/citesource_contribution/database_overlap_upset.png "$PUB/figures/figure_03_database_overlap.png"
          cp outputs/citesource_contribution/database_overlap_upset.pdf "$PUB/figures/figure_03_database_overlap.pdf"
          cp visualisations/figure_01_records_by_publication_year.png "$PUB/figures/figure_04_publication_year_species.png"
          cp visualisations/figure_01_records_by_publication_year.pdf "$PUB/figures/figure_04_publication_year_species.pdf"
          cp visualisations/figure_05_records_by_publication_year_high_level_topic.png "$PUB/figures/figure_05_publication_year_topics.png"
          cp visualisations/figure_05_records_by_publication_year_high_level_topic.pdf "$PUB/figures/figure_05_publication_year_topics.pdf"
          cp visualisations/figure_03_choropleth_records_by_country.png "$PUB/figures/figure_06_country_choropleth.png"
          cp visualisations/figure_03_choropleth_records_by_country.pdf "$PUB/figures/figure_06_country_choropleth.pdf"
          cp visualisations/figure_02_records_by_country.png "$PUB/figures/figure_07_country_species.png"
          cp visualisations/figure_02_records_by_country.pdf "$PUB/figures/figure_07_country_species.pdf"
          cp visualisations/topic_hierarchy/figure_04a_top_level_topics.png "$PUB/figures/figure_08_top_level_topics.png"
          cp visualisations/topic_hierarchy/figure_04a_top_level_topics.pdf "$PUB/figures/figure_08_top_level_topics.pdf"
          cp visualisations/topic_hierarchy/figure_04a_hierarchy_production.png "$PUB/figures/figure_09_production.png"
          cp visualisations/topic_hierarchy/figure_04a_hierarchy_production.pdf "$PUB/figures/figure_09_production.pdf"
          cp visualisations/topic_hierarchy/figure_04b_hierarchy_environment.png "$PUB/figures/figure_10_environment.png"
          cp visualisations/topic_hierarchy/figure_04b_hierarchy_environment.pdf "$PUB/figures/figure_10_environment.pdf"
          cp visualisations/topic_hierarchy/figure_04c_hierarchy_methods.png "$PUB/figures/figure_11_methods.png"
          cp visualisations/topic_hierarchy/figure_04c_hierarchy_methods.pdf "$PUB/figures/figure_11_methods.pdf"
          cp visualisations/topic_hierarchy/figure_04d_hierarchy_industry_and_governance.png "$PUB/figures/figure_12_industry_and_governance.png"
          cp visualisations/topic_hierarchy/figure_04d_hierarchy_industry_and_governance.pdf "$PUB/figures/figure_12_industry_and_governance.pdf"
          cp visualisations/topic_hierarchy/figure_04e_hierarchy_product.png "$PUB/figures/figure_13_product.png"
          cp visualisations/topic_hierarchy/figure_04e_hierarchy_product.pdf "$PUB/figures/figure_13_product.pdf"
          cp visualisations/topic_hierarchy/figure_04f_hierarchy_people_and_society.png "$PUB/figures/figure_14_people_and_society.png"
          cp visualisations/topic_hierarchy/figure_04f_hierarchy_people_and_society.pdf "$PUB/figures/figure_14_people_and_society.pdf"
          cp visualisations/topic_hierarchy/figure_04g_hierarchy_inputs_and_resources.png "$PUB/figures/figure_15_inputs_and_resources.png"
          cp visualisations/topic_hierarchy/figure_04g_hierarchy_inputs_and_resources.pdf "$PUB/figures/figure_15_inputs_and_resources.pdf"
          cp visualisations/figure_08_umbrella_review.png "$PUB/figures/figure_16_umbrella_review.png"
          cp visualisations/figure_08_umbrella_review.pdf "$PUB/figures/figure_16_umbrella_review.pdf"

          # Data products needed to audit figures and reuse the corpus.
          cp visualisations/figure_07_flow_diagram_counts.json "$PUB/flow_counts.json"
          cp outputs/workflow09_data/living_evidence_map_canonical_final.ris "$PUB/data/living_evidence_map_canonical_final.ris"
          cp outputs/workflow09_data/living_evidence_map_canonical_final.ris.manifest.json "$PUB/data/living_evidence_map_canonical_final.ris.manifest.json"
          rm -f "$PUB/data/workflow_inputs"/*
          cp docs/reporting/workflow_09_inputs/current/* "$PUB/data/workflow_inputs/"

          # Snapshot the exact plotting code used for this publication package.
          cp visualisations/canonical_figure_data.R "$PUB/figure_code/canonical_figure_data.R"
          cp visualisations/07_flow_diagram.R "$PUB/figure_code/figure_01_flow_diagram.R"
          cp scripts/reporting/plot_citesource_database_contribution.R "$PUB/figure_code/figures_02_03_database_sources.R"
          cp visualisations/01_records_by_publication_year.R "$PUB/figure_code/figure_04_publication_year_species.R"
          cp visualisations/05_records_by_publication_year_high_level_topic.R "$PUB/figure_code/figure_05_publication_year_topics.R"
          cp visualisations/03_choropleth_records_by_country.R "$PUB/figure_code/figure_06_country_choropleth.R"
          cp visualisations/02_records_by_country.R "$PUB/figure_code/figure_07_country_species.R"
          cp visualisations/04_topic_hierarchy.R "$PUB/figure_code/figures_08_to_15_topic_hierarchy.R"
          cp visualisations/08_umbrella_review_figure.R "$PUB/figure_code/figure_16_umbrella_review.R"

          cp outputs/workflow09_manuscript/methods.{md,html,docx,pdf} "$PUB/manuscript/"
          cp outputs/workflow09_manuscript/results.{md,html,docx,pdf} "$PUB/manuscript/"
          cp scripts/reporting/export_canonical_ris.R "$PUB/data/export_canonical_ris.R"

      - name: Validate Workflow 09 publication package
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)

          canonical <- "workflow08_reporting_state/living_evidence_map_canonical_final.jsonl"
          w08_pointer <- fromJSON(Sys.getenv("W08_POINTER"))
          expected_sha <- tolower(as.character(w08_pointer$final_canonical_jsonl_sha256))
          expected_n <- as.integer(w08_pointer$canonical_records)
          stopifnot(
            identical(w08_pointer$status, "published"),
            !is.na(expected_n),
            expected_n >= 0L,
            grepl("^lossless-upstream-handoff-v", as.character(w08_pointer$annotation_preservation)),
            identical(
              tolower(digest(canonical, algo = "sha256", file = TRUE, serialize = FALSE)),
              expected_sha
            )
          )

          con <- file(canonical, "rt", encoding = "UTF-8")
          canonical_n <- 0L
          repeat {
            z <- readLines(con, n = 5000L, warn = FALSE)
            if (!length(z)) break
            canonical_n <- canonical_n + sum(nzchar(trimws(z)))
          }
          close(con)
          stopifnot(canonical_n == expected_n)

          ris_manifest <- fromJSON("docs/reporting/workflow_09/data/living_evidence_map_canonical_final.ris.manifest.json")
          stopifnot(as.integer(ris_manifest$records) == expected_n)
          stopifnot(identical(tolower(ris_manifest$source_jsonl_sha256), expected_sha))

          flow <- fromJSON("docs/reporting/workflow_09/flow_counts.json", simplifyVector = FALSE)
          stopifnot(as.integer(flow$counts$final_included) == expected_n)

          stems <- c(
            "flow_diagram","database_unique_contribution","database_overlap",
            "publication_year_species","publication_year_topics","country_choropleth",
            "country_species","top_level_topics","production","environment","methods",
            "industry_and_governance","product","people_and_society",
            "inputs_and_resources","umbrella_review"
          )
          required_figures <- unlist(lapply(c("png","pdf"), function(ext) {
            sprintf("docs/reporting/workflow_09/figures/figure_%02d_%s.%s", 1:16, stems, ext)
          }), use.names = FALSE)
          actual_figures <- sort(list.files(
            "docs/reporting/workflow_09/figures",
            pattern = "^figure_[0-9]{2}_.+\\.(png|pdf)$",
            full.names = TRUE
          ))
          stopifnot(identical(sort(required_figures), actual_figures))

          required_code <- c(
            "docs/reporting/workflow_09/figure_code/canonical_figure_data.R",
            "docs/reporting/workflow_09/figure_code/figure_01_flow_diagram.R",
            "docs/reporting/workflow_09/figure_code/figures_02_03_database_sources.R",
            "docs/reporting/workflow_09/figure_code/figure_04_publication_year_species.R",
            "docs/reporting/workflow_09/figure_code/figure_05_publication_year_topics.R",
            "docs/reporting/workflow_09/figure_code/figure_06_country_choropleth.R",
            "docs/reporting/workflow_09/figure_code/figure_07_country_species.R",
            "docs/reporting/workflow_09/figure_code/figures_08_to_15_topic_hierarchy.R",
            "docs/reporting/workflow_09/figure_code/figure_16_umbrella_review.R"
          )
          actual_code <- sort(list.files(
            "docs/reporting/workflow_09/figure_code",
            pattern = "\\.R$",
            full.names = TRUE
          ))
          stopifnot(identical(sort(required_code), actual_code))

          required <- c(
            required_figures,
            required_code,
            "docs/reporting/workflow_09/manuscript/long_form_methods.Rmd",
            "docs/reporting/workflow_09/manuscript/long_form_results.Rmd",
            "docs/reporting/workflow_09/manuscript/references.bib",
            "docs/reporting/workflow_09/manuscript/methods.md",
            "docs/reporting/workflow_09/manuscript/methods.html",
            "docs/reporting/workflow_09/manuscript/methods.docx",
            "docs/reporting/workflow_09/manuscript/methods.pdf",
            "docs/reporting/workflow_09/manuscript/results.md",
            "docs/reporting/workflow_09/manuscript/results.html",
            "docs/reporting/workflow_09/manuscript/results.docx",
            "docs/reporting/workflow_09/manuscript/results.pdf",
            "docs/reporting/workflow_09/data/living_evidence_map_canonical_final.ris",
            "docs/reporting/workflow_09/data/workflow_inputs/manifest.json",
            sprintf("docs/reporting/workflow_09/data/workflow_inputs/w%02d_summary.json", 0:8),
            "docs/reporting/workflow_09/data/workflow_inputs/w01_source_summary.csv",
            "docs/reporting/workflow_09/data/workflow_inputs/w01_source_intersections.csv",
            "docs/reporting/workflow_09/data/workflow_inputs/w01_source_manifest.json",
            "docs/reporting/workflow_09/data/workflow_inputs/w08_source_summary.csv",
            "docs/reporting/workflow_09/data/workflow_inputs/w08_source_intersections.csv",
            "docs/reporting/workflow_09/data/workflow_inputs/w08_source_manifest.json"
          )
          stopifnot(all(file.exists(required)))
          cat("PASS: Workflow 09 publication package validated\n")

      - name: Commit publication package to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reporting/workflow_09
          if git diff --cached --quiet; then
            echo "No Workflow 09 publication changes to commit."
          else
            git commit -m "Publish Workflow 09 reporting package [skip ci]"
            # Discard generated working files outside docs/reporting/workflow_09
            # before rebasing the publication commit onto the live branch.
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi

      - name: Upload Workflow 09 publication package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow09-publication-package-${{ github.run_id }}
          path: docs/reporting/workflow_09/
          retention-days: 90
          if-no-files-found: error
