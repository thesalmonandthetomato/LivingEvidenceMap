name: Temporary - repair ProQuest Zenodo draft

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'user_input/manual_ris_proquest_repair.trigger'

permissions:
  contents: read
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Download preserved pre-incident validation artifact
        uses: actions/download-artifact@v4
        with:
          name: workflow00-manual-ris-zenodo-36710696634
          path: recovery_source
          repository: thesalmonandthetomato/LivingEvidenceMap
          run-id: 36710696634
          github-token: ${{ github.token }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install repair dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Repair only the affected Zenodo draft state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          src='recovery_source/downloaded_ris/ProQuestDocuments-2026-09-30 (3).ris'
          test -f "$src"
          Rscript scripts/updater/tmp_repair_proquest_zenodo_draft.R \
            --draft-id 23058211 \
            --restore-file "$src" \
            --expected-bytes 1903525 \
            --expected-sha256 db9a067a7d6256f7eec9867661bbffa1ce9dcac71450f8c7adbe127dc784c034 \
            --output-dir outputs/updater/proquest_zenodo_repair

      - name: Upload repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proquest-zenodo-repair-${{ github.run_id }}
          path: outputs/updater/proquest_zenodo_repair/
          retention-days: 7
          if-no-files-found: warn
