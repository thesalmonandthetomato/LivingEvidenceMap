name: Workflow 01 - Abstract enrichment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fresh_rebuild_01b_abstract_enrichment.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FRESH_CANONICAL_BRANCH: canonical-fresh-2026-09-08-v1
  EXPECTED_RECORDS: '20132'

jobs:
  abstract-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout fresh canonical branch
        uses: actions/checkout@v4
        with:
          ref: canonical-fresh-2026-09-08-v1
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load tested Workflow 01B script from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/living-evidence-map
          git show origin/main:scripts/updater/abstract_enrichment.py > /tmp/living-evidence-map/abstract_enrichment.py
          python -m py_compile /tmp/living-evidence-map/abstract_enrichment.py

      - name: Audit fresh Lens metadata before enrichment
        shell: python
        run: |
          import hashlib, json, os
          from collections import Counter
          from pathlib import Path

          p=Path('data/canonical/current/repair/records.jsonl')
          expected=int(os.environ['EXPECTED_RECORDS'])
          rows=[]
          with p.open(encoding='utf-8') as f:
              for line in f:
                  if line.strip(): rows.append(json.loads(line))
          assert len(rows)==expected, (len(rows), expected)
          ids=[r['identity']['lens_id'] for r in rows]
          assert len(ids)==len(set(ids))
          for r in rows:
              assert 'deduplication' not in r
              assert 'screening' not in r
              assert 'screening_history' not in r

          def present(v):
              if v is None: return False
              if isinstance(v,str): return bool(v.strip())
              if isinstance(v,(list,dict)): return bool(v)
              return True

          counts=Counter()
          raw_keys=Counter()
          for r in rows:
              c=r.get('canonical') or {}
              raw=(r.get('lens') or {}).get('raw_payload') or {}
              for k in raw: raw_keys[k]+=1
              for k in ('title','abstract','authors','year','source','doi','keywords','publication_type'):
                  if present(c.get(k)): counts[k]+=1

          raw_digest=hashlib.sha256()
          for r in rows:
              raw=(r.get('lens') or {}).get('raw_payload') or {}
              raw_digest.update(json.dumps(raw,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode('utf-8'))
              raw_digest.update(b'\n')

          audit={
              'total_records':len(rows),
              'canonical_field_present_counts':dict(counts),
              'raw_payload_key_counts':dict(raw_keys),
              'raw_payload_stream_sha256':raw_digest.hexdigest()
          }
          Path('fresh_rebuild_01b').mkdir(exist_ok=True)
          Path('fresh_rebuild_01b/pre_enrichment_metadata_audit.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          Path('fresh_rebuild_01b/raw_payload_before.sha256').write_text(raw_digest.hexdigest()+'\n',encoding='utf-8')
          print(json.dumps(audit,indent=2,ensure_ascii=False))

      - name: Enrich and clean abstracts
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/living-evidence-map/abstract_enrichment.py \
            --input data/canonical/current/repair/records.jsonl \
            --output fresh_rebuild_01b/enriched_records.jsonl \
            --audit fresh_rebuild_01b/abstract_enrichment_audit.jsonl \
            --report fresh_rebuild_01b/abstract_enrichment_report.json \
            --expected-records "$EXPECTED_RECORDS" \
            --delay 0.08
          mv fresh_rebuild_01b/enriched_records.jsonl data/canonical/current/repair/records.jsonl

      - name: Validate enrichment invariants
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          expected=int(os.environ['EXPECTED_RECORDS'])
          p=Path('data/canonical/current/repair/records.jsonl')
          rows=[]
          with p.open(encoding='utf-8') as f:
              for line in f:
                  if line.strip(): rows.append(json.loads(line))
          assert len(rows)==expected
          ids=[r['identity']['lens_id'] for r in rows]
          assert len(ids)==len(set(ids))
          assert all('abstract_enrichment' in r for r in rows)
          assert all('deduplication' not in r for r in rows)
          assert all('screening' not in r for r in rows)
          assert all('screening_history' not in r for r in rows)

          raw_digest=hashlib.sha256()
          for r in rows:
              raw=(r.get('lens') or {}).get('raw_payload') or {}
              raw_digest.update(json.dumps(raw,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode('utf-8'))
              raw_digest.update(b'\n')
          before=Path('fresh_rebuild_01b/raw_payload_before.sha256').read_text().strip()
          assert raw_digest.hexdigest()==before, 'Lens raw payload changed during enrichment'

          report=json.loads(Path('fresh_rebuild_01b/abstract_enrichment_report.json').read_text())
          assert report['total_records']==expected
          assert report['output']=='deduplication_ready'
          print(json.dumps(report,indent=2))
          print('PASS: cardinality, Lens IDs, raw Lens payload, and fresh screening/dedup state preserved.')

      - name: Update fresh canonical manifest
        shell: python
        run: |
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          mpath=Path('data/canonical/current/repair/manifest.json')
          manifest=json.loads(mpath.read_text(encoding='utf-8'))
          report=json.loads(Path('fresh_rebuild_01b/abstract_enrichment_report.json').read_text(encoding='utf-8'))
          manifest['abstract_enrichment']={
              'workflow':'fresh_rebuild_01b_abstract_enrichment',
              'completed_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'provider':'europe_pmc',
              'report':report
          }
          manifest['pipeline_stage']='abstract_enriched_deduplication_ready'
          mpath.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Persist enriched fresh canonical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git add data/canonical/current/repair/records.jsonl data/canonical/current/repair/manifest.json
          git commit -m 'Enrich and clean abstracts in fresh canonical JSON'
          git lfs push origin "$FRESH_CANONICAL_BRANCH"
          git push origin HEAD:"$FRESH_CANONICAL_BRANCH"
          git log -1 --format='enriched_canonical_commit=%H'

      - name: Upload Workflow 01B audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-rebuild-01b-abstract-enrichment-${{ github.run_id }}
          path: fresh_rebuild_01b/
          retention-days: 90
          if-no-files-found: error
