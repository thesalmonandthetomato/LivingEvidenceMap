name: Workflow 01 - Abstract enrichment

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FRESH_CANONICAL_BRANCH: canonical-fresh-2026-09-08-v1

jobs:
  abstract-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout fresh canonical branch
        uses: actions/checkout@v4
        with:
          ref: canonical-fresh-2026-09-08-v1
          fetch-depth: 0
          lfs: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('jsonlite', 'httr2'))

      - name: Load current R implementation from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/updater/workflow_01_abstract_enrichment.R > /tmp/workflow_01_abstract_enrichment.R

      - name: Enrich and clean abstracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh_rebuild_01
          Rscript /tmp/workflow_01_abstract_enrichment.R \
            --input data/canonical/current/repair/records.jsonl \
            --output fresh_rebuild_01/enriched_records.jsonl \
            --audit fresh_rebuild_01/abstract_enrichment_audit.jsonl \
            --report fresh_rebuild_01/abstract_enrichment_report.json \
            --manifest data/canonical/current/repair/manifest.json \
            --delay 0.08
          mv fresh_rebuild_01/enriched_records.jsonl data/canonical/current/repair/records.jsonl

      - name: Persist enriched canonical JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git add data/canonical/current/repair/records.jsonl data/canonical/current/repair/manifest.json
          git commit -m 'Enrich canonical abstracts in R'
          git lfs push origin "$FRESH_CANONICAL_BRANCH"
          git push origin HEAD:"$FRESH_CANONICAL_BRANCH"
          git log -1 --format='enriched_canonical_commit=%H'

      - name: Upload Workflow 01 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-01-abstract-enrichment-${{ github.run_id }}
          path: fresh_rebuild_01/
          retention-days: 90
          if-no-files-found: error
