name: TEMP W00 archive handoff test
on:
  push:
    branches: [production-minimal]
    paths: [.github/workflows/w00-temp-handoff-validation.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install offline dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest"))
      - name: Verify archive and reconciliation without permanent outputs
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '{"selected_sources":["lens","openalex","ebsco_medline"]}\n' > "$tmp/selection.json"
          Rscript scripts/updater/workflow_00_search_orchestrator.R --run-type full --output-dir "$tmp/plan"
          Rscript scripts/updater/workflow_00_archive_queries.R --plan "$tmp/plan/search_plan.json" --strategy user_input/workflow00_search_strategy.json --archive-root "$tmp/archive" --run-id disposable
          Rscript scripts/updater/workflow_00_read_archived_queries.R --archive "$tmp/archive/run-disposable" --source-selection "$tmp/selection.json" --output "$tmp/restored.json"
          Rscript - "$tmp" <<'RS'
          root<-commandArgs(TRUE)[[1L]]
          plan<-jsonlite::fromJSON(file.path(root,"plan","source_queries.json"),simplifyVector=FALSE)
          restored<-jsonlite::fromJSON(file.path(root,"restored.json"),simplifyVector=FALSE)
          manifest<-jsonlite::fromJSON(file.path(root,"archive","run-disposable","manifest.json"),simplifyVector=FALSE)
          for(src in names(restored)){
            stopifnot(identical(plan[[src]],restored[[src]]))
            stopifnot(identical(manifest$queries[[src]]$query_string_sha256,
              digest::digest(restored[[src]],algo="sha256",serialize=FALSE)))
            cat(sprintf("PASS archived query and text hash: %s\n",src))
          }
          RS
          q="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[[1]],simplifyVector=FALSE);cat(x$lens)' "$tmp/restored.json")"
          h="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[[1]],simplifyVector=FALSE);cat(x$queries$lens$query_string_sha256)' "$tmp/archive/run-disposable/manifest.json")"
          Rscript scripts/updater/write_workflow00_search_record.R --source lens --run-type full --query "$q" --expected-query-sha256 "$h" --reported-results 1 --downloaded-results 1 --parent-run-id disposable --output-root "$tmp/report"
          echo "PASS matching query report"
          if Rscript scripts/updater/write_workflow00_search_record.R --source lens --run-type full --query "incorrect query" --expected-query-sha256 "$h" --reported-results 1 --downloaded-results 1 --parent-run-id disposable --output-root "$tmp/invalid" 2>/dev/null; then
            echo "FAIL checksum mismatch unexpectedly accepted";exit 1
          fi
          echo "PASS altered query rejected"
          mkdir -p "$tmp/ebsco-src"
          printf '%s\n' '{"source":{"provider":"ebsco_medline"},"sidecar_identity":{"sidecar_record_id":"cmedm:KNOWN"}}' '{"source":{"provider":"ebsco_medline"},"sidecar_identity":{"sidecar_record_id":"cmedm:NEW"}}' > "$tmp/ebsco-src/records.jsonl"
          printf 'cmedm:KNOWN\n' > "$tmp/ids.txt"
          Rscript scripts/updater/workflow_00_ebsco_native_id_reconcile.R --source ebsco_medline --current-root "$tmp/ebsco-src" --registry "$tmp/ids.txt" --output-dir "$tmp/delta"
          Rscript - "$tmp/delta/reconciliation_manifest.json" <<'RS'
          x<-jsonlite::fromJSON(commandArgs(TRUE)[[1L]])
          stopifnot(x$already_known_native_ids==1L,x$new_native_ids==1L,x$records_passed_downstream==1L)
          cat("PASS EBSCO native ID reconciliation (one known, one new)\n")
          RS
