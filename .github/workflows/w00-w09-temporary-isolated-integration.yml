name: Temporary isolated integration safety gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install local test dependencies before network isolation
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','readr','dplyr'))
      - name: Prove read-only checkout and no service credentials
        shell: bash
        run: |
          set -euo pipefail
          for k in OPENAI_API_KEY ZENODO_ACCESS_TOKEN LEM_GOOGLE_SERVICE_ACCOUNT_JSON LEM_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN SCOPUS_API_TOKEN WOS_STARTER_API LENS_API_TOKEN; do
            test -z "${!k:-}" || { echo "::error::Credential unexpectedly available: $k"; exit 1; }
          done
          test -z "$(git config --local --get-regexp '^http\\..*extraheader$' || true)"
          test -z "$(git remote get-url origin | grep -E '^https://[^/]+@' || true)"
          test "$(git status --porcelain | wc -l)" -eq 0
          echo "PASS: no application credentials, checkout credentials or local changes"
      - name: Establish and verify filesystem/network confinement
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/lem-isolated
          sudo chmod 777 /tmp/lem-isolated
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
          sudo ip6tables -I OUTPUT 2 -j REJECT
          if curl --connect-timeout 3 --max-time 5 -fsS https://api.github.com >/dev/null 2>&1; then
            echo "::error::Outbound network remains accessible"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, socket
          root=pathlib.Path('/tmp/lem-isolated')
          try:
              socket.create_connection(('api.github.com',443),timeout=2)
          except OSError:
              pass
          else:
              raise RuntimeError('External socket reachable')
          report={'result':'PASS','outbound_network':'blocked','checkout':'read_only','credentials':'absent','production_scripts_modified':False,'processing_executed':False}
          (root/'safety_report.json').write_text(json.dumps(report,indent=2))
          print('PASS: network blocked, safety gate ready')
          PY
      - name: Execute synthetic W01 W02 W06 W07 W08 producer checks under network blockade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lem-isolated/w01-handoffs /tmp/lem-isolated/w01-resolutions /tmp/lem-isolated/w02
          Rscript - <<'RS'
          library(jsonlite)
          library(readr)
          root<-'/tmp/lem-isolated'
          write_json(list(schema='living-evidence-map-workflow01-shiny-handoff-v1',status='ready',checkpoint_run_id='12345'),file.path(root,'w01-handoffs/run-12345.json'),auto_unbox=TRUE)
          a<-list(identity=list(record_id='synthetic-a'),canonical=list(title='Example A',abstract='Abstract A'),manifestations=list(list(source='lens',source_record_id='x01'),list(source='scopus',source_record_id='y01')))
          b<-list(identity=list(record_id='synthetic-b'),canonical=list(title='Example B',abstract='Abstract B'),manifestations=list(list(source='lens',source_record_id='x02')))
          writeLines(c(toJSON(a,auto_unbox=TRUE),toJSON(b,auto_unbox=TRUE)),file.path(root,'w02/heavy.jsonl'))
          fp<-paste(rep('a',64),collapse='')
          geo<-data.frame(record_sequence=1:2,record_id=c('synthetic-a','synthetic-b'),title=c('Example A','Example B'),abstract=c('Abstract A','Abstract B'),geography_input_sha256=c(fp,paste(rep('b',64),collapse='')),deterministic_primary_countries=c('',''),deterministic_primary_iso3c=c('',''),geography_review_required=c(FALSE,TRUE),geography_review_reason=c('','uncertain'))
          write_csv(geo,file.path(root,'geography.csv'))
          RS
          Rscript scripts/updater/workflow_01_select_ready_handoff.R --handoff-dir /tmp/lem-isolated/w01-handoffs --resolution-dir /tmp/lem-isolated/w01-resolutions --output /tmp/lem-isolated/w01-selection.json
          Rscript -e 'stopifnot(isTRUE(jsonlite::fromJSON("/tmp/lem-isolated/w01-selection.json")$found))'
          Rscript -e 'jsonlite::write_json(list(status="resolved"),"/tmp/lem-isolated/w01-resolutions/run-12345.json",auto_unbox=TRUE)'
          Rscript scripts/updater/workflow_01_select_ready_handoff.R --handoff-dir /tmp/lem-isolated/w01-handoffs --resolution-dir /tmp/lem-isolated/w01-resolutions --output /tmp/lem-isolated/w01-resolved.json
          Rscript -e 'stopifnot(identical(jsonlite::fromJSON("/tmp/lem-isolated/w01-resolved.json")$found,FALSE))'
          Rscript scripts/updater/workflow_02_compact_post_w02_canonical.R --input /tmp/lem-isolated/w02/heavy.jsonl --output /tmp/lem-isolated/w02/lean.jsonl --report /tmp/lem-isolated/w02/report.json
          Rscript scripts/updater/workflow_06_prepare_incremental.R --current /tmp/lem-isolated/geography.csv --output-dir /tmp/lem-isolated/w06
          Rscript scripts/updater/workflow_07_prepare_incremental.R --current /tmp/lem-isolated/geography.csv --ontology user_input/workflow07_topic_ontology.csv --prompt user_input/workflow07_topic_system_prompt.txt --output-dir /tmp/lem-isolated/w07
          Rscript - <<'RS'
          library(jsonlite)
          root<-'/tmp/lem-isolated'
          for(n in c('w06','w07')){
            m<-fromJSON(file.path(root,n,'prepare_manifest.json'))
            stopifnot(m$status=='PASS',m$current_records==2,m$screen_queue_records==2)
          }
          rep<-fromJSON(file.path(root,'w02/report.json'))
          stopifnot(rep$status=='PASS',rep$canonical_records==2,rep$manifestation_refs_exact)
          a<-list(identity=list(record_id='synthetic-a'),canonical=list(title='Example A'),screening=list(final_included=TRUE))
          b<-list(identity=list(record_id='synthetic-b'),canonical=list(title='Example B'),screening=list(final_included=FALSE,exclusion_stage='W04',exclusion_reason='irrelevant'))
          writeLines(c(toJSON(a,auto_unbox=TRUE),toJSON(b,auto_unbox=TRUE)),file.path(root,'assembled.jsonl'))
          write_json(list(status='PASS',canonical_records=2,final_included_records=1,final_excluded_records=1,final_canonical_jsonl_sha256='fixture'),file.path(root,'prepartition.json'),auto_unbox=TRUE)
          RS
          Rscript scripts/updater/workflow_08_partition_final_outputs_dynamic.R --assembled /tmp/lem-isolated/assembled.jsonl --old-manifest /tmp/lem-isolated/prepartition.json --canonical-output /tmp/lem-isolated/final.jsonl --exclusions-output /tmp/lem-isolated/exclusions.csv --manifest-output /tmp/lem-isolated/final_manifest.json
          Rscript - <<'RS'
          library(jsonlite)
          root<-'/tmp/lem-isolated'
          m<-fromJSON(file.path(root,'final_manifest.json'))
          stopifnot(m$canonical_records==1,m$excluded_records==1,m$source_canonical_population==2,identical(m$canonical_contains_excluded_records,FALSE))
          x<-fromJSON(file.path(root,'safety_report.json'))
          x$processing_executed<-TRUE
          x$synthetic_components<-c('W01 ready/resolved handoff','W02 canonical compaction','W06 geography queue','W07 topic queue','W08 final partition')
          write_json(x,file.path(root,'safety_report.json'),pretty=TRUE,auto_unbox=TRUE)
          cat('PASS: five isolated synthetic component checks\n')
          RS
          test -z "$(git status --porcelain)"
      - name: Restore runner networking for audit artefact upload
        if: always()
        shell: bash
        run: |
          sudo iptables -D OUTPUT -j REJECT || true
          sudo iptables -D OUTPUT -o lo -j ACCEPT || true
          sudo ip6tables -D OUTPUT -j REJECT || true
          sudo ip6tables -D OUTPUT -o lo -j ACCEPT || true
      - name: Upload safety-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-safety-gate
          path: /tmp/lem-isolated/safety_report.json
          if-no-files-found: warn
          retention-days: 7
