name: TEMP validate W01 identifier assist test

on:
  push:
    branches:
      - w01-identifier-assist-test
    paths:
      - 'scripts/updater/workflow_01_identifier_assist_test.R'
      - '.github/workflows/tmp_validate_w01_identifier_assist_test.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-identifier-assist-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','data.table','stringi'))

      - name: Parse prototype
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_01_identifier_assist_test.R')
          cat('PASS: prototype parses\n')

      - name: Build synthetic multi-source fixture
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create('/tmp/w01_id_test',recursive=TRUE,showWarnings=FALSE)
          write_jsonl <- function(x,path) {
            con <- file(path,'wt')
            on.exit(close(con),add=TRUE)
            for(z in x) writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con)
          }

          pubmed <- list(
            list(
              sidecar_identity=list(sidecar_record_id='pubmed:MED:12345',europe_pmc_source='MED',europe_pmc_id='12345',doi='10.1000/good'),
              source=list(provider='pubmed'),
              mapped_fields=list(title='A salmon study',year='2024',doi='10.1000/good')
            ),
            list(
              sidecar_identity=list(sidecar_record_id='pubmed:MED:99999',europe_pmc_source='MED',europe_pmc_id='99999',doi='10.1000/bad'),
              source=list(provider='pubmed'),
              mapped_fields=list(title='First unrelated paper',year='2010',doi='10.1000/bad')
            )
          )
          wos <- list(
            list(
              sidecar_identity=list(sidecar_record_id='wos:WOS:1',doi='10.1000/good'),
              source=list(provider='wos_starter'),
              mapped_fields=list(title='A salmon study',year='2024',doi='10.1000/good',pmid='12345')
            )
          )
          scopus <- list(
            list(
              sidecar_identity=list(sidecar_record_id='scopus:1',doi='10.1000/bad'),
              source=list(provider='scopus'),
              mapped_fields=list(title='Completely different paper',year='2020',doi='10.1000/bad')
            )
          )

          write_jsonl(pubmed,'/tmp/w01_id_test/pubmed.jsonl')
          write_jsonl(wos,'/tmp/w01_id_test/wos.jsonl')
          write_jsonl(scopus,'/tmp/w01_id_test/scopus.jsonl')

          m <- list(
            schema='living-evidence-map-workflow01-source-inputs-v1',
            sources=list(
              pubmed=list(path='/tmp/w01_id_test/pubmed.jsonl'),
              wos=list(path='/tmp/w01_id_test/wos.jsonl'),
              scopus=list(path='/tmp/w01_id_test/scopus.jsonl')
            )
          )
          writeLines(toJSON(m,auto_unbox=TRUE,pretty=TRUE),
                     '/tmp/w01_id_test/input_manifest.json')

      - name: Run isolated identifier-assist prototype
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_identifier_assist_test.R \
            --input-manifest /tmp/w01_id_test/input_manifest.json \
            --output-dir /tmp/w01_id_test/out

      - name: Assert conservative behaviour
        shell: Rscript {0}
        run: |
          library(data.table)
          library(jsonlite)
          s <- fromJSON('/tmp/w01_id_test/out/summary.json')
          p <- fread('/tmp/w01_id_test/out/identifier_candidate_pairs.csv')
          ids <- fread('/tmp/w01_id_test/out/cross_source_identifiers.csv')

          stopifnot(s$automatic_merges_performed == 0L)
          stopifnot(s$existing_w01_files_modified == FALSE)
          stopifnot(nrow(p) == 2L)

          good <- p[grepl('10.1000/good',shared_identifier_values,fixed=TRUE)]
          bad <- p[grepl('10.1000/bad',shared_identifier_values,fixed=TRUE)]
          stopifnot(nrow(good)==1L,nrow(bad)==1L)
          stopifnot(grepl('doi',good$shared_identifier_types,fixed=TRUE))
          stopifnot(grepl('pmid',good$shared_identifier_types,fixed=TRUE))
          stopifnot(good$title_exact, good$year_compatible, !good$metadata_conflict)
          stopifnot(!bad$title_exact, !bad$year_compatible, bad$metadata_conflict)
          stopifnot(any(ids$identifier_type=='pmid' & ids$identifier_value=='12345'))

          cat('PASS: shared identifiers create candidates only; contradictory shared DOI is flagged, never merged\n')
