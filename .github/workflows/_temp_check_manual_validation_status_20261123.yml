name: TEMP inspect November draft validation status
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_check_manual_validation_status_20261123.yml']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read status of temporary validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,base64
          h={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          uri=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(uri,headers=h),timeout=30) as r:d=json.load(r)
          found=[{"id":v["id"],"name":v["name"],"status":v["status"],"conclusion":v.get("conclusion"),"url":v["html_url"]} for v in d.get("workflow_runs",[]) if "TEMP validate November manual RIS" in v.get("name","")]
          data=base64.b64encode(json.dumps(found,indent=2).encode()).decode()
          print("TEMP_VALIDATION_RUNS",json.dumps(found))
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/docs/.temp_validation_run_state_20261123.json"
          payload=json.dumps({"message":"TEMP inspect validation run state","content":data,"branch":"workflow01-final-architecture"}).encode()
          req=urllib.request.Request(url,data=payload,method="PUT",headers={**h,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r:print("STATUS_RECEIPT",r.status)
          PY
