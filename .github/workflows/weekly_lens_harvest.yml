name: Weekly Lens harvest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
      OVERLAP_DAYS: '7'
    steps:
      - uses: actions/checkout@v4

      - name: Harvest Lens incremental records
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lens_weekly_harvest.py

      - name: Upload harvest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lens-weekly-harvest-${{ github.run_id }}
          path: |
            outputs/lens_harvest/*.json
            outputs/lens_harvest/*.csv
          if-no-files-found: error
          retention-days: 90
