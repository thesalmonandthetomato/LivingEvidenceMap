name: Weekly Lens update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
      OVERLAP_DAYS: '7'
    steps:
      - uses: actions/checkout@v4

      - name: Harvest Lens incremental records
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lens_weekly_harvest.py

      - name: Validate harvest outputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find outputs/lens_harvest -maxdepth 1 -name '*.csv' -print -quit)"
          test -n "$(find outputs/lens_harvest -maxdepth 1 -name '*.json' -print -quit)"

      - name: Upload harvest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lens-weekly-harvest-${{ github.run_id }}
          path: |
            outputs/lens_harvest/*.json
            outputs/lens_harvest/*.csv
          if-no-files-found: error
          retention-days: 90

      - name: Persist harvest checkpoint
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- state/lens_weekly_harvest.json; then
            echo "No checkpoint change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/lens_weekly_harvest.json
          git commit -m "Update Lens weekly harvest checkpoint"
          git push
