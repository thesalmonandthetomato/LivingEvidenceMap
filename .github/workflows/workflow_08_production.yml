name: Workflow 08 - living finalisation

on:
  workflow_dispatch:
    inputs:
      lean_pointer_path:
        description: Current post-W02 lean canonical pointer
        required: true
        type: string
      workflow03_pointer_path:
        description: Current W03 pointer
        required: true
        type: string
      workflow04_pointer_path:
        description: Current W04 pointer
        required: true
        type: string
      workflow05_pointer_path:
        description: Current W05 pointer
        required: true
        type: string
      workflow06_pointer_path:
        description: Current W06 pointer
        required: true
        type: string
      workflow07_pointer_path:
        description: Current W07 pointer
        required: true
        type: string
      prior_workflow08_pointer_path:
        description: Prior W08 pointer, or none for first run
        required: true
        default: docs/workflow08/zenodo/run-36442875006.json
        type: string
      new_decisions_path:
        description: Optional repo JSONL resolving all new/changed W08 issues
        required: false
        default: ''
        type: string
      publish:
        description: Publish resolved W08 state to restricted Zenodo
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  workflow08:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','readr','dplyr','digest','httr2','googlesheets4'))

      - name: Parse implementation
        shell: Rscript {0}
        run: |
          files <- c(
            'scripts/updater/workflow_03_restore_lean_checkpoint.R',
            'scripts/updater/workflow_03_restore_state_from_zenodo.R',
            'scripts/updater/workflow_04_restore_state_from_zenodo.R',
            'scripts/updater/workflow_05_restore_state_from_zenodo.R',
            'scripts/updater/workflow_06_restore_state_from_zenodo.R',
            'scripts/updater/workflow_07_restore_state_from_zenodo.R',
            'scripts/updater/workflow_08_restore_adjudication_ledger.R',
            'scripts/updater/workflow_08_build_review_queue_dynamic.R',
            'scripts/updater/workflow_08_migrate_legacy_geography_decisions.R',
            'scripts/updater/workflow_08_reuse_decisions.R',
            'scripts/updater/workflow_08_publish_shiny_queue.R',
            'scripts/updater/workflow_08_finalize_canonical_dynamic.R',
            'scripts/updater/workflow_08_partition_final_outputs_dynamic.R',
            'scripts/updater/workflow_08_archive_to_zenodo.R'
          )
          invisible(lapply(files, parse))
          cat('PASS: W08 production implementation parses\n')

      - name: Restore current W03-W07 states
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          LEAN: ${{ inputs.lean_pointer_path }}
          W03: ${{ inputs.workflow03_pointer_path }}
          W04: ${{ inputs.workflow04_pointer_path }}
          W05: ${{ inputs.workflow05_pointer_path }}
          W06: ${{ inputs.workflow06_pointer_path }}
          W07: ${{ inputs.workflow07_pointer_path }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/current
          mkdir -p inputs/current
          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R --pointer "$LEAN" --output-dir inputs/current/lean
          Rscript scripts/updater/workflow_03_restore_state_from_zenodo.R --pointer "$W03" --output-dir inputs/current/w03
          Rscript scripts/updater/workflow_04_restore_state_from_zenodo.R --pointer "$W04" --output-dir inputs/current/w04
          Rscript scripts/updater/workflow_05_restore_state_from_zenodo.R --pointer "$W05" --output-dir inputs/current/w05
          Rscript scripts/updater/workflow_06_restore_state_from_zenodo.R --pointer "$W06" --output-dir inputs/current/w06
          Rscript scripts/updater/workflow_07_restore_state_from_zenodo.R --pointer "$W07" --output-dir inputs/current/w07

      - name: Resolve current handoff files
        shell: bash
        run: |
          set -euo pipefail
          cp "$(find inputs/current/lean -type f -name canonical_lean.jsonl -print -quit)" inputs/current/canonical_lean.jsonl
          cp "$(find inputs/current/w03 -type f -name publication_status.jsonl -print -quit)" inputs/current/publication_status.jsonl
          cp "$(find inputs/current/w04 -type f -name workflow04_final_screening_layer.jsonl -print -quit)" inputs/current/workflow04_final_screening_layer.jsonl
          cp "$(find inputs/current/w05 -type f -name workflow05_species_layer.csv -print -quit)" inputs/current/workflow05_species_layer.csv
          cp "$(find inputs/current/w05 -type f -name species_matches.csv -print -quit)" inputs/current/species_matches.csv
          cp "$(find inputs/current/w06 -type f -name workflow06_geography_layer.csv -print -quit)" inputs/current/workflow06_geography_layer.csv
          cp "$(find inputs/current/w07 -type f -name workflow07_records.csv -print -quit)" inputs/current/workflow07_records.csv
          cp "$(find inputs/current/w07 -type f -name workflow07_workflow08_human_review_queue.csv -print -quit)" inputs/current/workflow07_review.csv
          cp "$(find inputs/current/w07 -type f -name workflow07_topic_pathway_scores_retained.csv -print -quit)" inputs/current/workflow07_scores.csv
          cp "$(find inputs/current/w07 -type f -name workflow07_topic_record_qc.csv -print -quit)" inputs/current/workflow07_qc.csv
          cp "$(find inputs/current/w07 -type f -name workflow07_late_automatic_exclusions.csv -print -quit)" inputs/current/workflow07_late.csv

          GROUND=$(find inputs/current/w06 -type f -name geography_ungrounded_evidence.csv -print -quit)
          if [ -n "$GROUND" ]; then
            cp "$GROUND" inputs/current/workflow06_grounding_residual.csv
          else
            Rscript -e 'readr::write_csv(data.frame(record_id=character()),"inputs/current/workflow06_grounding_residual.csv")'
          fi

          for p in inputs/current/canonical_lean.jsonl inputs/current/publication_status.jsonl inputs/current/workflow04_final_screening_layer.jsonl inputs/current/workflow05_species_layer.csv inputs/current/species_matches.csv inputs/current/workflow06_geography_layer.csv inputs/current/workflow07_records.csv inputs/current/workflow07_review.csv inputs/current/workflow07_scores.csv inputs/current/workflow07_qc.csv inputs/current/workflow07_late.csv; do
            test -f "$p"
          done

      - name: Build current W08 issues
        shell: bash
        run: |
          Rscript scripts/updater/workflow_08_build_review_queue_dynamic.R             --w05 inputs/current/workflow05_species_layer.csv             --w06 inputs/current/workflow06_geography_layer.csv             --w06-grounding-residual inputs/current/workflow06_grounding_residual.csv             --w07-records inputs/current/workflow07_records.csv             --w07-review inputs/current/workflow07_review.csv             --w07-scores inputs/current/workflow07_scores.csv             --w07-late-exclusions inputs/current/workflow07_late.csv             --output-dir outputs/workflow08_intake

      - name: Restore prior W08 adjudications
        if: ${{ inputs.prior_workflow08_pointer_path != 'none' }}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          PRIOR: ${{ inputs.prior_workflow08_pointer_path }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/prior_w08
          Rscript scripts/updater/workflow_08_restore_adjudication_ledger.R             --pointer "$PRIOR"             --output inputs/prior_w08/prior_ledger.jsonl

          MISSING=$(P=inputs/prior_w08/prior_ledger.jsonl Rscript -e '
            library(jsonlite)
            x<-readLines(Sys.getenv("P"),warn=FALSE);x<-x[nzchar(trimws(x))]
            n<-sum(vapply(x,function(z){
              r<-fromJSON(z,simplifyVector=FALSE);h<-r$issue_state_sha256
              is.null(h)||!length(h)||!nzchar(trimws(as.character(h[[1]])))
            },logical(1)))
            cat(n)
          ')

          if [ "$MISSING" -gt 0 ]; then
            gh run download 36320650383 -n workflow08-review-intake-36320650383 -D inputs/prior_w08/legacy_queue
            cp "$(find inputs/prior_w08/legacy_queue -type f -name workflow08_review_queue.jsonl -print -quit)" inputs/prior_w08/prior_queue.jsonl
          fi

      - name: Migrate currently relevant pre-ledger geography decisions
        shell: bash
        run: |
          Rscript scripts/updater/workflow_08_migrate_legacy_geography_decisions.R             --queue outputs/workflow08_intake/workflow08_review_queue_current.jsonl             --legacy data/workflow08/geography_adjudication_decisions.jsonl             --output outputs/workflow08_legacy_geo.jsonl

      - name: Build reusable prior ledger
        shell: Rscript {0}
        run: |
          library(jsonlite)
          readj <- function(p){
            if(!file.exists(p)) return(list())
            x <- readLines(p,warn=FALSE);x <- x[nzchar(trimws(x))]
            lapply(x,function(z)fromJSON(z,simplifyVector=FALSE))
          }
          rows <- c(readj('inputs/prior_w08/prior_ledger.jsonl'),readj('outputs/workflow08_legacy_geo.jsonl'))
          keys <- if(length(rows)) vapply(rows,function(z)as.character(z$review_key),character(1)) else character()
          if(any(!nzchar(keys))||anyDuplicated(keys)) stop('Duplicate/missing prior W08 review key')
          con <- file('outputs/workflow08_prior_combined.jsonl','wt')
          for(z in rows) writeLines(toJSON(z,auto_unbox=TRUE,null='null',na='null',digits=NA),con)
          close(con)

      - name: Reuse unchanged human decisions
        env:
          PRIOR: ${{ inputs.prior_workflow08_pointer_path }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --queue outputs/workflow08_intake/workflow08_review_queue_current.jsonl
            --prior-ledger outputs/workflow08_prior_combined.jsonl
            --output-dir outputs/workflow08_reuse
          )
          if [ -f inputs/prior_w08/prior_queue.jsonl ]; then
            ARGS+=(--prior-queue inputs/prior_w08/prior_queue.jsonl)
          fi
          Rscript scripts/updater/workflow_08_reuse_decisions.R "${ARGS[@]}"

      - name: Publish pending W08 annotation records to Shiny
        if: ${{ inputs.new_decisions_path == '' }}
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs'
        shell: bash
        run: |
          set -euo pipefail
          PENDING=$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow08_reuse/workflow08_reuse_manifest.json");cat(as.integer(x$pending_issues))')
          echo "Pending W08 issues: $PENDING"
          if [ "$PENDING" -gt 0 ]; then
            printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
            chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
            Rscript scripts/updater/workflow_08_publish_shiny_queue.R \
              --queue outputs/workflow08_reuse/workflow08_pending_review_queue.jsonl \
              --species-config user_input/workflow05_coding_config.json \
              --ontology user_input/workflow07_topic_ontology.csv \
              --sheet-id "$LEM_GOOGLE_SHEET_ID" \
              --credential "$RUNNER_TEMP/lem-google-service-account.json" \
              --source-run-id "$GITHUB_RUN_ID"
            BATCH_META="$(LEM_CRED="$RUNNER_TEMP/lem-google-service-account.json" LEM_SHEET="$LEM_GOOGLE_SHEET_ID" Rscript -e 'suppressPackageStartupMessages(library(googlesheets4));gs4_auth(path=Sys.getenv("LEM_CRED"),cache=FALSE);x<-read_sheet(Sys.getenv("LEM_SHEET"),sheet="queue_w08_active",col_types="c");stopifnot(nrow(x)>0);cat(paste(x$batch_id[[1]],x$queue_sha256[[1]],sep="|"))')"
            BATCH_ID="${BATCH_META%%|*}"
            QUEUE_SHA="${BATCH_META#*|}"
            Rscript scripts/updater/workflow_shiny_batch_status.R \
              --stage "08" \
              --batch-id "$BATCH_ID" \
              --queue-sha256 "$QUEUE_SHA" \
              --status published \
              --sheet-id "$LEM_GOOGLE_SHEET_ID" \
              --credential "$RUNNER_TEMP/lem-google-service-account.json" \
              --source-run-id "$GITHUB_RUN_ID"
          fi

      - name: Write W08 Shiny resume context
        if: ${{ inputs.new_decisions_path == '' }}
        shell: Rscript {0}
        run: |
          x <- list(
            schema="living-evidence-map-workflow08-shiny-resume-context-v1",
            source_run_id=Sys.getenv("GITHUB_RUN_ID"),
            lean_pointer_path="${{ inputs.lean_pointer_path }}",
            workflow03_pointer_path="${{ inputs.workflow03_pointer_path }}",
            workflow04_pointer_path="${{ inputs.workflow04_pointer_path }}",
            workflow05_pointer_path="${{ inputs.workflow05_pointer_path }}",
            workflow06_pointer_path="${{ inputs.workflow06_pointer_path }}",
            workflow07_pointer_path="${{ inputs.workflow07_pointer_path }}",
            prior_workflow08_pointer_path="${{ inputs.prior_workflow08_pointer_path }}"
          )
          jsonlite::write_json(x,"outputs/workflow08_reuse/shiny_resume_context.json",auto_unbox=TRUE,pretty=TRUE)

      - name: Stop if new human review is required
        env:
          NEW_DECISIONS_PATH: ${{ inputs.new_decisions_path }}
        shell: bash
        run: |
          set -euo pipefail
          PENDING=$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow08_reuse/workflow08_reuse_manifest.json");cat(as.integer(x$pending_issues))')
          echo "Pending W08 issues: $PENDING"
          if [ "$PENDING" -gt 0 ] && [ -z "$NEW_DECISIONS_PATH" ]; then
            echo "Human review required. Pending records have been published to Shiny." >&2
            exit 2
          fi

      - name: Build complete current decision ledger
        env:
          NEW_DECISIONS_PATH: ${{ inputs.new_decisions_path }}
        shell: Rscript {0}
        run: |
          library(jsonlite)
          readj <- function(p){
            if(!nzchar(p)||!file.exists(p)) return(list())
            x<-readLines(p,warn=FALSE);x<-x[nzchar(trimws(x))]
            lapply(x,function(z)fromJSON(z,simplifyVector=FALSE))
          }
          reused <- readj('outputs/workflow08_reuse/workflow08_reused_decisions.jsonl')
          fresh <- readj(Sys.getenv('NEW_DECISIONS_PATH'))
          rows <- c(reused,fresh)
          keys <- if(length(rows)) vapply(rows,function(z)as.character(z$review_key),character(1)) else character()
          if(any(!nzchar(keys))||anyDuplicated(keys)) stop('Complete W08 ledger has duplicate/missing review_key')

          pending <- readj('outputs/workflow08_reuse/workflow08_pending_review_queue.jsonl')
          pkeys <- unlist(lapply(pending,function(r){
            rid<-as.character(r$record_id)
            vapply(r$issues,function(i)paste(rid,as.character(i$issue_type),sep='::'),character(1))
          }),use.names=FALSE)
          if(length(pkeys)&&!all(pkeys%in%keys)) stop('Fresh W08 decisions do not resolve every pending issue')

          current <- readr::read_csv('outputs/workflow08_intake/workflow08_issue_index_current.csv',show_col_types=FALSE,progress=FALSE)
          current_keys <- as.character(current$review_key)
          if(any(!nzchar(current_keys))||anyDuplicated(current_keys)) stop('Current W08 issue index has duplicate/missing review_key')
          if(!setequal(keys,current_keys)) stop('Complete W08 ledger does not exactly equal the current W08 issue set')
          current_hash <- setNames(as.character(current$issue_state_sha256),current_keys)
          row_hash <- if(length(rows)) setNames(vapply(rows,function(z){
            h<-z$issue_state_sha256
            if(is.null(h)||!length(h)) '' else as.character(h[[1]])
          },character(1)),keys) else character()
          if(length(current_keys) && any(tolower(row_hash[current_keys]) != tolower(current_hash[current_keys]))) {
            stop('Complete W08 ledger contains stale issue_state_sha256 values')
          }

          dir.create('outputs/workflow08',recursive=TRUE)
          con<-file('outputs/workflow08/human_decisions_complete.jsonl','wt')
          for(z in rows)writeLines(toJSON(z,auto_unbox=TRUE,null='null',na='null',digits=NA),con)
          close(con)

      - name: Assemble and partition definitive W08 canonical
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_08_finalize_canonical_dynamic.R             --canonical inputs/current/canonical_lean.jsonl             --w03 inputs/current/publication_status.jsonl             --w04 inputs/current/workflow04_final_screening_layer.jsonl             --w05 inputs/current/workflow05_species_layer.csv             --w05-matches inputs/current/species_matches.csv             --w06 inputs/current/workflow06_geography_layer.csv             --w07-scores inputs/current/workflow07_scores.csv             --w07-qc inputs/current/workflow07_qc.csv             --w07-late-exclusions inputs/current/workflow07_late.csv             --decisions outputs/workflow08/human_decisions_complete.jsonl             --ontology user_input/workflow07_topic_ontology.csv             --species-config user_input/workflow05_coding_config.json             --output outputs/workflow08/post_adjudication_all.jsonl             --ledger outputs/workflow08/workflow08_adjudication_ledger.jsonl             --manifest outputs/workflow08/post_adjudication_manifest.json

          Rscript scripts/updater/workflow_08_partition_final_outputs_dynamic.R             --assembled outputs/workflow08/post_adjudication_all.jsonl             --old-manifest outputs/workflow08/post_adjudication_manifest.json             --canonical-output outputs/workflow08/living_evidence_map_canonical_final.jsonl             --exclusions-output outputs/workflow08/workflow08_excluded_records.csv             --manifest-output outputs/workflow08/workflow08_final_manifest.json

          rm outputs/workflow08/post_adjudication_all.jsonl outputs/workflow08/post_adjudication_manifest.json

      - name: Publish W08 state
        if: ${{ inputs.publish == true }}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          PRIOR_W08_POINTER: ${{ inputs.prior_workflow08_pointer_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow08_zenodo
          ARGS=(
            --canonical outputs/workflow08/living_evidence_map_canonical_final.jsonl
            --exclusions outputs/workflow08/workflow08_excluded_records.csv
            --ledger outputs/workflow08/workflow08_adjudication_ledger.jsonl
            --manifest outputs/workflow08/workflow08_final_manifest.json
            --source-run-id "$GITHUB_RUN_ID"
            --repository "$GITHUB_REPOSITORY"
            --output-dir outputs/workflow08_zenodo
          )
          if [ "$PRIOR_W08_POINTER" != "none" ] && [ -n "$PRIOR_W08_POINTER" ]; then
            test -s "$PRIOR_W08_POINTER"
            SUPER_ID="$(P="$PRIOR_W08_POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("P"),simplifyVector=FALSE);cat(as.character(x$zenodo_record_id))')"
            SUPER_DOI="$(P="$PRIOR_W08_POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("P"),simplifyVector=FALSE);cat(as.character(x$doi))')"
            ARGS+=(--supersedes-record-id "$SUPER_ID" --supersedes-doi "$SUPER_DOI")
          fi
          Rscript scripts/updater/workflow_08_archive_to_zenodo.R "${ARGS[@]}"

      - name: Register W08 state
        if: ${{ inputs.publish == true }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin workflow01-final-architecture

          mkdir -p docs/workflow08/zenodo
          cp outputs/workflow08_zenodo/zenodo_receipt.json "docs/workflow08/zenodo/run-$GITHUB_RUN_ID.json"

          if [ ! -f docs/workflow08/zenodo_registry.csv ]; then
            echo 'source_run_id,zenodo_record_id,doi,canonical_sha256,exclusions_sha256,status,supersedes_zenodo_record_id,published_at_utc' > docs/workflow08/zenodo_registry.csv
          fi

          RECEIPT=outputs/workflow08_zenodo/zenodo_receipt.json REG=docs/workflow08/zenodo_registry.csv Rscript -e '
            x <- jsonlite::fromJSON(Sys.getenv("RECEIPT"),simplifyVector=FALSE)
            reg <- read.csv(Sys.getenv("REG"),stringsAsFactors=FALSE)
            required <- c("source_run_id","zenodo_record_id","doi","canonical_sha256","exclusions_sha256","status","supersedes_zenodo_record_id","published_at_utc")
            if(!all(required %in% names(reg))) stop("Workflow 08 registry schema is incomplete")
            sid <- as.character(x$source_github_run_id)
            zid <- as.character(x$zenodo_record_id)
            reg <- reg[as.character(reg$source_run_id)!=sid,,drop=FALSE]
            reg$status[reg$status=="authoritative"] <- "superseded"
            row <- data.frame(
              source_run_id=sid,
              zenodo_record_id=zid,
              doi=as.character(x$doi),
              canonical_sha256=as.character(x$final_canonical_jsonl_sha256),
              exclusions_sha256=as.character(x$excluded_records_csv_sha256),
              status="authoritative",
              supersedes_zenodo_record_id=if(is.null(x$supersedes_zenodo_record_id))"" else as.character(x$supersedes_zenodo_record_id),
              published_at_utc=as.character(x$published_at_utc),
              stringsAsFactors=FALSE
            )
            write.csv(rbind(reg[,required,drop=FALSE],row),Sys.getenv("REG"),row.names=FALSE,quote=FALSE)
          '

          git add docs/workflow08/zenodo_registry.csv "docs/workflow08/zenodo/run-$GITHUB_RUN_ID.json"
          if ! git diff --cached --quiet; then
            git commit -m "Register Workflow 08 final state $GITHUB_RUN_ID"
            git push origin HEAD:workflow01-final-architecture
          fi

      - name: Acknowledge consumed W08 Shiny batch
        if: ${{ inputs.publish == true }}
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          META="$(LEM_CRED="$RUNNER_TEMP/lem-google-service-account.json" LEM_SHEET="$LEM_GOOGLE_SHEET_ID" Rscript -e 'suppressPackageStartupMessages(library(googlesheets4));gs4_auth(path=Sys.getenv("LEM_CRED"),cache=FALSE);tabs<-sheet_names(Sys.getenv("LEM_SHEET"));if(!"queue_w08_active"%in%tabs)quit(status=2);x<-read_sheet(Sys.getenv("LEM_SHEET"),sheet="queue_w08_active",col_types="c");stopifnot(nrow(x)>0);cat(paste(x$batch_id[[1]],x$queue_sha256[[1]],sep="|"))')"
          BATCH_ID="${META%%|*}"
          QUEUE_SHA="${META#*|}"
          OUTPUT_SHA="$(Rscript -e 'cat(digest::digest(file="outputs/workflow08/living_evidence_map_canonical_final.jsonl",algo="sha256",serialize=FALSE))')"
          Rscript scripts/updater/workflow_shiny_batch_status.R \
            --stage "08" \
            --batch-id "$BATCH_ID" \
            --queue-sha256 "$QUEUE_SHA" \
            --status consumed \
            --sheet-id "$LEM_GOOGLE_SHEET_ID" \
            --credential "$RUNNER_TEMP/lem-google-service-account.json" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output-sha256 "$OUTPUT_SHA" \
            --message "Workflow 08 decisions applied; final canonical state archived and registered."

      - name: Upload review and final state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow08-review-state-${{ github.run_id }}
          path: |
            outputs/workflow08_intake/
            outputs/workflow08_reuse/
            outputs/workflow08/
            outputs/workflow08_zenodo/
          retention-days: 90
          if-no-files-found: warn
