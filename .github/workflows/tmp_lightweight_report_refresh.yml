name: Temporary - lightweight Workflow 09 report refresh

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_lightweight_report_refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reporting branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install minimal R dependencies
        shell: Rscript {0}
        run: install.packages(c("ggplot2","jsonlite"))

      - name: Redraw flow diagram from validated Workflow 09 counts only
        shell: Rscript {0}
        run: |
          library(ggplot2)
          library(jsonlite)

          counts <- fromJSON("docs/reporting/workflow_09/flow_counts.json", simplifyVector = TRUE)$counts
          fmt <- function(x) format(as.integer(x), big.mark=",", scientific=FALSE, trim=TRUE)

          src <- counts$sources
          box <- function(id,x,y,w,h,label,stage) data.frame(id,x,y,w,h,label,stage,stringsAsFactors=FALSE)
          source_box_w <- 1.45
          process_box_w <- 2.75

          boxes <- do.call(rbind,list(
            box("agricola",2.60,12.00,source_box_w,0.76,paste0("AGRICOLA\nn = ",fmt(src[["AGRICOLA"]])),"source"),
            box("lens",4.12,12.00,source_box_w,0.76,paste0("The Lens\nn = ",fmt(src[["The Lens"]])),"source"),
            box("openalex",5.64,12.00,source_box_w,0.76,paste0("OpenAlex\nn = ",fmt(src[["OpenAlex"]])),"source"),
            box("scopus",7.16,12.00,source_box_w,0.76,paste0("Scopus\nn = ",fmt(src[["Scopus"]])),"source"),
            box("wos",8.68,12.00,source_box_w,0.76,paste0("WoSCC\nn = ",fmt(src[["WoSCC"]])),"source"),
            box("combined",5.64,10.88,process_box_w,0.76,paste0("Combined search results\nn = ",fmt(counts$combined_search_results)),"search"),
            box("dedup",5.64,9.78,process_box_w,0.76,paste0("Deduplicated records\nn = ",fmt(counts$deduplicated_records)),"screen"),
            box("dupes",9.15,9.78,process_box_w,0.76,paste0("Duplicate records removed\nn = ",fmt(counts$duplicates_removed)),"exclude"),
            box("enrichment",5.64,8.68,process_box_w,0.76,paste0("Record repair and enrichment\nn enriched = ",fmt(counts$records_enriched_workflow02)),"repair"),
            box("status_sweep",5.64,7.58,process_box_w,0.76,paste0("Records swept for retractions /\nwithdrawal notices\nn = ",fmt(counts$deduplicated_records)),"screen"),
            box("retractions",9.15,7.58,process_box_w,0.76,paste0("Retractions excluded\nn = ",fmt(counts$retractions_excluded)),"exclude"),
            box("screened",5.64,6.48,process_box_w,0.76,paste0("Records screened at title and abstract\nn = ",fmt(counts$title_abstract_screened)),"screen"),
            box("excluded_ta",9.15,6.48,process_box_w,0.76,paste0("Records excluded at title and abstract\nn = ",fmt(counts$title_abstract_excluded_total)),"exclude"),
            box("retained",5.64,5.38,process_box_w,0.76,paste0("Records retained after title and abstract\nn = ",fmt(counts$title_abstract_retained_final)),"retain"),
            box("species",5.64,4.18,process_box_w,0.76,paste0("Species annotation\nn = ",fmt(counts$final_included)),"annotate"),
            box("geography",5.64,3.13,process_box_w,0.76,paste0("Records with geography annotation\nn = ",fmt(counts$final_geography_coded)),"annotate"),
            box("geo_uncoded",9.15,3.13,process_box_w,0.76,paste0("Included but uncoded for geography\nn = ",fmt(counts$final_geography_uncoded)),"result"),
            box("topic",5.64,2.08,process_box_w,0.76,paste0("Records with topic annotation\nn = ",fmt(counts$final_topic_coded)),"annotate"),
            box("uncoded",9.15,2.08,process_box_w,0.76,paste0("Included but uncoded for topics\nn = ",fmt(counts$final_topic_uncoded)),"result"),
            box("map",5.64,0.88,process_box_w,0.86,paste0("Living Evidence Map\nn = ",fmt(counts$final_included)),"map")
          ))

          source_vertical <- data.frame(x=c(2.60,4.12,5.64,7.16,8.68),y=rep(11.62,5),xend=c(2.60,4.12,5.64,7.16,8.68),yend=rep(11.43,5))
          source_collector <- data.frame(x=2.60,y=11.43,xend=8.68,yend=11.43)
          main_arrows <- data.frame(
            x=rep(5.64,10),
            y=c(11.43,10.50,9.40,8.30,7.20,6.10,5.00,3.80,2.75,1.70),
            xend=rep(5.64,10),
            yend=c(11.26,10.16,9.06,7.96,6.86,5.76,4.56,3.51,2.46,1.31)
          )
          side_connectors <- data.frame(
            x=rep(5.64+process_box_w/2,5),
            y=c(9.78,7.58,6.48,3.13,2.08),
            xend=rep(9.15-process_box_w/2,5),
            yend=c(9.78,7.58,6.48,3.13,2.08)
          )
          phase <- data.frame(
            x=rep(0.92,4), y=c(11.35,7.20,3.20,0.88), w=rep(0.54,4),
            h=c(1.80,4.35,3.10,0.96),
            label=c("Searching","Curation and screening","Annotation and classification","Map"),
            stringsAsFactors=FALSE
          )
          stage_fill <- c(source="#f5f4f0",search="#dce7e7",screen="#dce7e7",repair="#a8bdbe",retain="#e2b8a2",annotate="#f6d6c6",exclude="#f1efeb",result="#dce7e7",map="#e55634")
          stage_text <- c(source="#2c454a",search="#2c454a",screen="#2c454a",repair="#2c454a",retain="#2c454a",annotate="#2c454a",exclude="#2c454a",result="#2c454a",map="white")

          p <- ggplot() +
            geom_segment(data=source_vertical,aes(x=x,y=y,xend=xend,yend=yend),colour="#577c84",linewidth=0.55) +
            geom_segment(data=source_collector,aes(x=x,y=y,xend=xend,yend=yend),colour="#577c84",linewidth=0.55) +
            geom_segment(data=main_arrows,aes(x=x,y=y,xend=xend,yend=yend),colour="#577c84",linewidth=0.55,arrow=grid::arrow(length=grid::unit(2.3,"mm"),type="closed")) +
            geom_segment(data=side_connectors,aes(x=x,y=y,xend=xend,yend=yend),colour="#577c84",linewidth=0.55) +
            geom_rect(data=boxes,aes(xmin=x-w/2,xmax=x+w/2,ymin=y-h/2,ymax=y+h/2,fill=stage),colour="#2c454a",linewidth=0.45) +
            geom_text(data=boxes,aes(x=x,y=y,label=label,colour=stage),size=2.95,lineheight=0.92) +
            geom_rect(data=phase,aes(xmin=x-w/2,xmax=x+w/2,ymin=y-h/2,ymax=y+h/2),fill="#577c84",colour="#2c454a",linewidth=0.45) +
            geom_text(data=phase,aes(x=x,y=y,label=label),angle=90,colour="white",fontface="bold",size=3.05) +
            scale_fill_manual(values=stage_fill,guide="none") +
            scale_colour_manual(values=stage_text,guide="none") +
            coord_cartesian(xlim=c(0.45,10.65),ylim=c(0.25,12.50),expand=FALSE) +
            theme_void(base_size=11) +
            theme(plot.background=element_rect(fill="white",colour=NA),plot.margin=margin(8,8,8,8))

          out <- "docs/reporting/workflow_09/figures/figure_01_flow_diagram.png"
          ggsave(out,p,width=210,height=245,units="mm",dpi=600)
          stopifnot(file.exists(out), file.info(out)$size > 100000)
          cat("PASS: lightweight flow diagram rendered from validated flow_counts.json\n")

      - name: Refresh Results HTML presentation only
        shell: python
        run: |
          import html, re
          from pathlib import Path

          rmd_path = Path("docs/reporting/workflow_09/manuscript/long_form_results.Rmd")
          html_path = Path("docs/reporting/workflow_09/manuscript/results.html")
          rmd = rmd_path.read_text(encoding="utf-8")
          doc = html_path.read_text(encoding="utf-8")

          old_sub = '<h3 class="subtitle">Results</h3>'
          if doc.count(old_sub) != 1:
              raise SystemExit(f"Expected exactly one Results subtitle, found {doc.count(old_sub)}")
          doc = doc.replace(old_sub, "", 1)

          caps = re.findall(r'fig\.cap="([^"]+)"', rmd)
          if len(caps) != 15:
              raise SystemExit(f"Expected 15 Rmd captions, found {len(caps)}")

          rendered = []
          for idx, cap in enumerate(caps, start=1):
              m = re.fullmatch(r'\*\*\*Figure\s+(\d+)\.\*\*\*\s+\*(.*)\*', cap)
              if not m or int(m.group(1)) != idx:
                  raise SystemExit(f"Caption {idx} is not in expected bold-italic format: {cap}")
              body = html.escape(m.group(2), quote=False)
              rendered.append(f'<div class="figcaption"><em><strong>Figure {idx}.</strong> {body}</em></div>')

          pattern = re.compile(r'<div class="figcaption">.*?</div>', re.S)
          existing = pattern.findall(doc)
          if len(existing) != 15:
              raise SystemExit(f"Expected 15 existing HTML figure captions, found {len(existing)}")

          it = iter(rendered)
          doc = pattern.sub(lambda _: next(it), doc)
          html_path.write_text(doc, encoding="utf-8")

          check = html_path.read_text(encoding="utf-8")
          if '<h3 class="subtitle">Results</h3>' in check:
              raise SystemExit("Duplicate Results subtitle remains")
          if check.count('<div class="figcaption"><em><strong>Figure ') != 15:
              raise SystemExit("Not all 15 formatted figure captions were written")
          print("PASS: Results HTML refreshed without canonical-data reload")

      - name: Commit refreshed outputs to reporting branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reporting/workflow_09/manuscript/results.html docs/reporting/workflow_09/figures/figure_01_flow_diagram.png
          if git diff --cached --quiet; then
            echo "No refreshed outputs changed."
          else
            git commit -m "Refresh Results HTML and flow diagram [skip ci]"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi

      - name: Copy only refreshed report outputs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add ../main-report origin/main
          mkdir -p ../main-report/docs/reporting/workflow_09/manuscript
          mkdir -p ../main-report/docs/reporting/workflow_09/figures
          cp docs/reporting/workflow_09/manuscript/results.html ../main-report/docs/reporting/workflow_09/manuscript/results.html
          cp docs/reporting/workflow_09/figures/figure_01_flow_diagram.png ../main-report/docs/reporting/workflow_09/figures/figure_01_flow_diagram.png

          cd ../main-report
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reporting/workflow_09/manuscript/results.html docs/reporting/workflow_09/figures/figure_01_flow_diagram.png

          CHANGED="$(git diff --cached --name-only)"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(docs/reporting/workflow_09/manuscript/results\.html|docs/reporting/workflow_09/figures/figure_01_flow_diagram\.png)$' || true)"
          test -z "$BAD"

          if git diff --cached --quiet; then
            echo "Main already contains refreshed report outputs."
          else
            git commit -m "Refresh living results report outputs [skip ci]"
            git push origin HEAD:main
          fi
          echo "PASS: only Results HTML and Figure 1 were staged for main"
