name: W05 temporary handoff and dictionary tests
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w05-temporary-handoff-dictionary-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("digest","dplyr","jsonlite","readr","tibble"))
      - name: Validate matcher and project dictionary
        shell: Rscript {0}
        run: |
          source("R/species_detect.R")
          stopifnot(is.function(detect_species_mentions))
          library(jsonlite)
          t <- file.path(Sys.getenv("RUNNER_TEMP"),"w05")
          dir.create(t)
          rec <- list(
            list(identity=list(record_id="a"),canonical=list(title="Salmo salar aquaculture",abstract="Atlantic salmon farming")),
            list(identity=list(record_id="b"),canonical=list(title="Rainbow trout farming",abstract="Oncorhynchus mykiss")),
            list(identity=list(record_id="c"),canonical=list(title="No species here",abstract="Study of coastal ecology"))
          )
          writeLines(vapply(rec,function(x)toJSON(x,auto_unbox=TRUE,null="null"),character(1)),file.path(t,"input.jsonl"))
          writeLines(c("a","b"),file.path(t,"included.txt"))
          cat("PASS: matcher unit suite and fixtures ready\n")
      - name: Check W04 retained handoff and current salmon coding
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/w05"
          Rscript scripts/updater/workflow_05_materialise_retained.R --canonical "$T/input.jsonl" --included-ids "$T/included.txt" --output "$T/retained.jsonl" --expected-records 2
          Rscript scripts/updater/workflow_05_species_coding.R --input "$T/retained.jsonl" --output-dir "$T/coded" --expected-records 2
          Rscript -e 'library(readr);t<-commandArgs(TRUE)[1];x<-read_csv(file.path(t,"coded/workflow05_species_coded.csv"),show_col_types=FALSE);stopifnot(nrow(x)==2,identical(x$record_id,c("a","b")),grepl("SAL_SALAR",x$farmed_species_codes[1],fixed=TRUE),grepl("ONC_MYKISS",x$farmed_species_codes[2],fixed=TRUE));cat("PASS: W04 handoff and salmon coding\n")' "$T"
      - name: Check neutral defaults with unrelated dictionary
        shell: Rscript {0}
        run: |
          source("R/species_detect.R")
          d <- data.frame(species_id=c("FOREST","WETLAND"),preferred_name=c("Forest","Wetland"),scientific_name=c("",""),synonym=c("temperate forest","peat bog"),synonym_type=c("common","common"),is_farmed_candidate=c(FALSE,FALSE),default_group=c("biome","biome"))
          m <- detect_species_mentions("Temperate forest and peat bog habitats","",d)
          stopifnot(setequal(m$species_id,c("FOREST","WETLAND")))
          stopifnot(length(formals(detect_species_mentions)$pluralisable_common_head_terms)==1L)
          cat("PASS: unrelated biome concepts matched with neutral defaults\n")
