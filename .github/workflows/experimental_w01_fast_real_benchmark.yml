name: Experimental W01-Fast October R-only benchmark
on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - .github/workflows/experimental_w01_fast_real_benchmark.yml
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: experimental-w01-fast-real-benchmark
      cancel-in-progress: false
    env:
      WORKFLOW01_BRANCH: workflow01-final-architecture
      WORKFLOW00_REPORTING_BRANCH: workflow01-final-architecture
      W00_POINTER: docs/search_record/zenodo/run-39298022062.json
      PREV_W01_POINTER: docs/deduplication/zenodo/run-39140209398.json
      W00_SOURCES: lens,scopus,openalex,agricola,ethos,wos,ebsco_africa_wide,ebsco_amed,ebsco_psycinfo,ebsco_atla_religion,ebsco_biological_agricultural_index,ebsco_cinahl,ebsco_econlit,ebsco_family_society,ebsco_greenfile,ebsco_medline,ebsco_mla,ebsco_political_science,ebsco_waters_oceans
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout experiment and unchanged W01 implementation
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - name: Checkout W00 pointer registry read-only
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          path: workflow00_registry
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install required R packages
        shell: Rscript {0}
        run: install.packages(c("data.table","jsonlite","digest","httr2","readr","stringdist","stringi","xml2","googlesheets4","yaml"))
      - name: Confirm pinned authoritative inputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          w00 <- file.path("workflow00_registry",Sys.getenv("W00_POINTER"))
          w01 <- Sys.getenv("PREV_W01_POINTER")
          stopifnot(file.exists(w00),file.info(w00)$size>0L,
                    file.exists(w01),file.info(w01)$size>0L)
          x <- fromJSON(w00,simplifyVector=FALSE)
          stopifnot(identical(as.character(x$github_run_id),"39298022062"),
                    identical(x$run_type,"monthly"),
                    identical(as.character(unlist(x$sources,use.names=FALSE)),
                              strsplit(Sys.getenv("W00_SOURCES"),",",fixed=TRUE)[[1L]]))
          cat("PASS: pinned October W00 inputs and source order\\n")
      - name: Run isolated real-data candidate benchmark
        shell: bash
        run: Rscript scripts/updater/experimental_w01_fast/run_real_benchmark.R
      - name: Upload read-only benchmark report and parity differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-w01-fast-october-${{ github.run_id }}
          path: |
            outputs/experimental_w01_fast/benchmark-stages.json
            outputs/experimental_w01_fast/exact/manifest.json
            outputs/experimental_w01_fast/fuzzy/manifest.json
            outputs/experimental_w01_fast/combined.csv.manifest.json
            outputs/experimental_w01_fast/parity.json
            outputs/experimental_w01_fast/parity.json.missing.csv
            outputs/experimental_w01_fast/parity.json.extra.csv
            outputs/experimental_w01_fast/parity.json.block_differences.csv
          if-no-files-found: warn
          retention-days: 7
