name: TEMP W00 disposable source smoke
on:
  push:
    branches: [production-minimal]
    paths: [.github/workflows/w00-disposable-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install temporary test dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","httr2","digest","xml2"))
      - name: Run bounded W00 smoke without stored outputs
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ZENODO_ACCESS_TOKEN || true
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '{"selected_sources":["openalex","pubmed","ebsco_medline"]}\n' > "$tmp/selection.json"
          Rscript scripts/updater/workflow_00_translate_generic.R --run-type full --config user_input/workflow00_search_strategy.salmon_equivalence_candidate.json --source-selection "$tmp/selection.json" --output-dir "$tmp/plan"
          extract_query() {
            Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[[1]],simplifyVector=FALSE);cat(x[[commandArgs(TRUE)[[2]]]])' "$tmp/plan/source_queries.json" "$1"
          }
          q="$(extract_query openalex)"
          Rscript scripts/updater/workflow_00c_openalex_ingestion.R --query "$q" --max-records 2 --page-size 2 --output-dir "$tmp/openalex"
          q="$(extract_query pubmed)"
          Rscript scripts/updater/workflow_00f_europe_pmc_source_ingestion.R --query "$q" --source-code MED --source-slug pubmed --source-collection PubMed --max-records 2 --page-size 2 --output-dir "$tmp/pubmed"
          q="$(extract_query ebsco_medline)"
          Rscript scripts/updater/workflow_00g_ebsco_ingestion.R --source ebsco_medline --query "$q" --max-records 2 --page-size 2 --output-dir "$tmp/ebsco"
          Rscript -e 'for(n in c("openalex","pubmed","ebsco")){x<-jsonlite::fromJSON(file.path(commandArgs(TRUE)[[1]],n,"manifest.json"),simplifyVector=FALSE);cat(sprintf("PASS %s: manifest generated; records retrieved: %s\n",n,if(is.null(x$records_retrieved))"not reported" else x$records_retrieved))}' "$tmp"
