name: Reference file validation

on:
  workflow_dispatch:

jobs:
  validate-reference-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::digest
            any::dplyr
            any::fs
            any::here
            any::purrr
            any::readr
            any::tibble
      - name: Validate static reference files
        run: Rscript -e 'source("scripts/setup_pipeline.R"); source("scripts/validate_reference_files.R")'
