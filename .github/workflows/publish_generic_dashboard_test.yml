name: Publish generic dashboard test
on:
  push:
    branches: [main]
    paths:
      - 'docs/reporting/.publish_generic_dashboard_test'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify current generic dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/dashboard-data.js
          grep -q './dashboard-data.js' docs/index.html
      - name: Checkout public Pages repository
        uses: actions/checkout@v4
        with:
          repository: thesalmonandthetomato/salmonevidencemap
          ref: main
          token: ${{ secrets.SALMON_EVIDENCE_MAP_PUBLISH_TOKEN }}
          path: public-site
          fetch-depth: 0
      - name: Stage isolated dashboard under docs/test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-site/docs/test
          cp docs/index.html public-site/docs/test/index.html
          cp docs/dashboard-data.js public-site/docs/test/dashboard-data.js
          cd public-site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/test/index.html docs/test/dashboard-data.js
          if git diff --cached --quiet; then
            echo 'Generic dashboard test is already current.'
            exit 0
          fi
          git commit -m 'Publish isolated generic evidence map test [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
