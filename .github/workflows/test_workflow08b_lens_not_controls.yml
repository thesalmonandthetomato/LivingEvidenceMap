name: W08b Lens NOT positive and negative controls
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - docs/workflow08b/.run_lens_not_controls
permissions:
  contents: read
jobs:
  lens-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))
      - name: Verify query controls
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w08b"
          Rscript scripts/workflow08b/lens_not_controls.R \
            user_input/workflow00_search_strategy.json \
            "$RUNNER_TEMP/w08b/lens_controls.json"
          cat "$RUNNER_TEMP/w08b/lens_controls.json"
