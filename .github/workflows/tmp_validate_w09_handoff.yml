name: TEMP validate Workflow 09 release handoff

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w09_handoff.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install validation dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","yaml"))

      - name: Validate W09 workflow syntax and release provenance
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(yaml)

          invisible(read_yaml(".github/workflows/report_workflow09_figures.yml"))

          status <- fromJSON("docs/current_run/current_run_status.json", simplifyVector = FALSE)
          val <- function(x, label) {
            if (is.null(x) || !length(x) || !nzchar(as.character(x[[1L]]))) stop(label, " missing", call. = FALSE)
            as.character(x[[1L]])
          }

          w01_run <- val(status$workflow_runs$W01, "W01 run")
          w02_run <- val(status$workflow_runs$W02, "W02 run")
          w01_path <- sprintf("docs/deduplication/zenodo/run-%s.json", w01_run)
          w02_path <- sprintf("docs/enrichment/zenodo/run-%s.json", w02_run)
          stopifnot(file.exists(w01_path), file.exists(w02_path))

          reg <- read.csv("docs/workflow08/zenodo_registry.csv", stringsAsFactors = FALSE, check.names = FALSE)
          hit <- reg[as.character(reg$status) == "authoritative", , drop = FALSE]
          stopifnot(nrow(hit) == 1L)
          w08_run <- as.character(hit$source_run_id[[1L]])
          w08_path <- sprintf("docs/workflow08/zenodo/run-%s.json", w08_run)
          stopifnot(file.exists(w08_path))

          w01 <- fromJSON(w01_path, simplifyVector = FALSE)
          w02 <- fromJSON(w02_path, simplifyVector = FALSE)
          w08 <- fromJSON(w08_path, simplifyVector = FALSE)

          stopifnot(
            identical(tolower(as.character(w02$upstream_workflow01_canonical_sha256)),
                      tolower(as.character(w01$canonical_jsonl_sha256))),
            as.integer(w08$source_canonical_population) == as.integer(w01$canonical_records),
            as.integer(w08$canonical_records) + as.integer(w08$excluded_records) == as.integer(w01$canonical_records)
          )

          search_date <- val(status$search$search_date, "search date")
          stopifnot(grepl("^\\d{4}-\\d{2}-\\d{2}$", search_date))

          methods <- paste(readLines("docs/reporting/workflow_09/manuscript/long_form_methods.Rmd", warn = FALSE), collapse = "\n")
          stopifnot(
            !grepl("may be retained as unspecified species", methods, fixed = TRUE),
            grepl("no eligible focal species can be assigned are excluded", methods, fixed = TRUE)
          )

          cat(sprintf(
            "PASS: W09 handoff validated: W01=%s W02=%s W08=%s; %d included + %d excluded = %d; search date=%s\n",
            w01_run, w02_run, w08_run,
            as.integer(w08$canonical_records), as.integer(w08$excluded_records),
            as.integer(w01$canonical_records), search_date
          ))
