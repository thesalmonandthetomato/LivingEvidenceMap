name: Temporary - complete ProQuest W00 Zenodo draft

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'user_input/manual_ris_proquest_complete.trigger'

permissions:
  contents: read

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Complete existing ProQuest draft in place
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_complete_ris_zenodo_draft.R \
            --registry user_input/workflow00_ris_proquest_2026-09-30.json \
            --validate-only false \
            --output-dir outputs/updater/workflow00_manual_ris_zenodo

      - name: Upload completion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proquest-w00-completion-${{ github.run_id }}
          path: outputs/updater/workflow00_manual_ris_zenodo/
          retention-days: 7
          if-no-files-found: warn
