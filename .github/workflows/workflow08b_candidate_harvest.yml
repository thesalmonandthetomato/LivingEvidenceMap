name: W08b Lens candidate bibliography harvest
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths: [docs/workflow08b/.run_candidate_harvest]
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest'))
      - name: Restore verified completed OpenAlex and Lens checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/restore_discovery.R 23627417 "$RUNNER_TEMP/w08b"
          test -s "$RUNNER_TEMP/w08b/merged/provider_candidate_ids.csv"
          Rscript -e 'd<-read.csv(file.path(Sys.getenv("RUNNER_TEMP"),"w08b/merged/provider_candidate_ids.csv"));stopifnot(all(c("provider","related_provider_id")%in%names(d)));cat("Candidate register: ",nrow(d)," provider IDs\\n",sep="")'
      - name: Parse-check all W08b candidate R before any provider calls
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/workflow08b/retrieve_lens_candidates_bulk.R"); cat("PASS: candidate retrieval R parse\\n")'
      - name: Harvest Lens candidate bibliographies, max 500 IDs per Lens request
        id: harvest
        continue-on-error: true
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/retrieve_lens_candidates_bulk.R \
            "$RUNNER_TEMP/w08b/merged/provider_candidate_ids.csv" "$RUNNER_TEMP/w08b" - 1000
      - name: Archive complete discovery and candidate state to restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/archive_discovery.R "$RUNNER_TEMP/w08b" "$GITHUB_RUN_ID" "$RUNNER_TEMP/w08b-receipt.json"
          if test -s "$RUNNER_TEMP/w08b/candidate_retrieval_summary.json"; then cat "$RUNNER_TEMP/w08b/candidate_retrieval_summary.json"; else echo "Candidate summary unavailable; archived failed run checkpoint"; fi
          cat "$RUNNER_TEMP/w08b-receipt.json"
      - name: Fail after archival on candidate retrieval errors
        if: steps.harvest.outcome == 'failure'
        run: exit 1
