name: Temporary - validate CAB Abstracts W00 Zenodo draft

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'user_input/manual_ris_cab_validate.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Validate existing CAB draft without writing
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_complete_ris_zenodo_draft.R \
            --registry user_input/workflow00_ris_cab_abstracts_2026-09-30.json \
            --validate-only true \
            --output-dir outputs/updater/workflow00_cab_validation

      - name: Upload CAB validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cab-w00-validation-${{ github.run_id }}
          path: outputs/updater/workflow00_cab_validation/
          retention-days: 7
          if-no-files-found: warn
