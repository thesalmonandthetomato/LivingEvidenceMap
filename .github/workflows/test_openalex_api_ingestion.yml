name: Test updater Workflow 00C - OpenAlex API ingestion

on:
  push:
    branches:
      - updater-workflow-00c-openalex-ingestion
    paths:
      - '.github/workflows/test_openalex_api_ingestion.yml'
      - 'scripts/updater/workflow_00c_openalex_ingestion.R'
  workflow_dispatch:
    inputs:
      query:
        description: 'OpenAlex OQL title/abstract query'
        required: true
        default: 'works where title/abstract has (("salmon" or "salmonid*" or "Salmo" or "Oncorhynchus" or "rainbow trout") and ("farm*" or "cage*" or "pens" or "penned" or "pen" or "aquacultur*" or "commercial*"))'
        type: string
      max_records:
        description: 'Maximum OpenAlex records to retrieve for this test'
        required: true
        default: '100'
        type: string
      page_size:
        description: 'Works requested per API call'
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  openalex-ingestion-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout OpenAlex ingestion branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00c-openalex-ingestion

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))

      - name: Resolve inputs
        id: cfg
        shell: bash
        env:
          INPUT_QUERY: ${{ inputs.query }}
          INPUT_MAX_RECORDS: ${{ inputs.max_records }}
          INPUT_PAGE_SIZE: ${{ inputs.page_size }}
        run: |
          set -euo pipefail
          query="${INPUT_QUERY:-works where title/abstract has ((\"salmon\" or \"salmonid*\" or \"Salmo\" or \"Oncorhynchus\" or \"rainbow trout\") and (\"farm*\" or \"cage*\" or \"pens\" or \"penned\" or \"pen\" or \"aquacultur*\" or \"commercial*\"))}"
          max_records="${INPUT_MAX_RECORDS:-100}"
          page_size="${INPUT_PAGE_SIZE:-100}"
          {
            echo "query<<EOF"
            echo "$query"
            echo "EOF"
            echo "max_records=$max_records"
            echo "page_size=$page_size"
          } >> "$GITHUB_OUTPUT"

      - name: Run lossless OpenAlex Works API ingestion
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
          OPENALEX_QUERY: ${{ steps.cfg.outputs.query }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00c_openalex_ingestion.R \
            --query "$OPENALEX_QUERY" \
            --max-records '${{ steps.cfg.outputs.max_records }}' \
            --page-size '${{ steps.cfg.outputs.page_size }}' \
            --output-dir outputs/updater/openalex_ingestion_test

      - name: Show manifest
        if: always()
        shell: bash
        run: |
          if [ -f outputs/updater/openalex_ingestion_test/manifest.json ]; then
            cat outputs/updater/openalex_ingestion_test/manifest.json
          fi

      - name: Upload OpenAlex ingestion artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-workflow-00c-openalex-ingestion-${{ github.run_id }}
          path: outputs/updater/openalex_ingestion_test/
          if-no-files-found: error
          retention-days: 30
