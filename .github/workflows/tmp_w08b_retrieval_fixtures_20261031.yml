name: TEMP W08b end-to-end fixture retrieval validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_retrieval_fixtures_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite","httr2","digest"))'
      - name: Create isolated two-seed, multi-manifestation provider fixtures
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("fixture")
          d<-data.frame(seed_record_id=c("a","a","a","a","a","a","b","b","b","b"),
            provider=c("lens","lens","openalex","openalex","lens","lens",
                       "lens","openalex","lens","lens"),
            identifier_type=c("lens","lens","openalex","openalex","doi","doi",
                              "lens","openalex","doi","doi"),
            query_identifier=c("L1","L2","W1","W2","10.1/a","10.1/b",
                               "L1","W2","10.1/a","10.1/b"),stringsAsFactors=FALSE)
          write.csv(d,"fixture/expanded.csv",row.names=FALSE)
          doiw<-list(
            list(lens_id="L3",external_ids=list(list(type="doi",value="10.1/a"))),
            list(lens_id="L4",external_ids=list(list(type="doi",value="10.1/a"))),
            list(lens_id="L5",external_ids=list(list(type="doi",value="10.1/b"))))
          writeLines(toJSON(list(total=3L,data=doiw),auto_unbox=TRUE),
                     "fixture/doi.json")
          lens<-lapply(1:5,function(i){
            list(lens_id=paste0("L",i),
                 references=list(list(lens_id="C1"),list(lens_id=paste0("C",i+1))),
                 references_count=2L,
                 scholarly_citations=list(list(lens_id="C9")),
                 scholarly_citations_count=1L)
          })
          writeLines(toJSON(list(total=5L,data=lens),auto_unbox=TRUE),"fixture/lens.json")
          for(w in c("W1","W2")){
            writeLines(toJSON(list(id=paste0("https://openalex.org/",w),
              referenced_works=list("https://openalex.org/W8"),cited_by_count=1L),auto_unbox=TRUE),
              file.path("fixture",paste0(w,"_work.json")))
            writeLines(toJSON(list(results=list(list(id="https://openalex.org/W9")),
              meta=list(next_cursor=NULL)),auto_unbox=TRUE,null="null"),
              file.path("fixture",paste0(w,"_citations.json")))
          }
      - name: Run DOI, Lens and OpenAlex actual R runners against guarded fixtures twice
        env:
          W08B_TEST_MODE: '1'
          W08B_DOI_TEST_FIXTURE: fixture/doi.json
          W08B_LENS_TEST_FIXTURE: fixture/lens.json
          W08B_OPENALEX_TEST_FIXTURES: fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/state
          Rscript scripts/workflow08b/resolve_lens_doi_manifest.R fixture/expanded.csv fixture/state 1 2026-11
          Rscript scripts/workflow08b/run_lens_bulk_manifest.R fixture/state/expanded_lens_identifier_queries.csv fixture/state 1 2026-11
          Rscript scripts/workflow08b/run_openalex_manifest.R fixture/expanded.csv fixture/state 10 2026-11
          Rscript scripts/workflow08b/resolve_lens_doi_manifest.R fixture/expanded.csv fixture/state 1 2026-11
          Rscript scripts/workflow08b/run_lens_bulk_manifest.R fixture/state/expanded_lens_identifier_queries.csv fixture/state 1 2026-11
          Rscript scripts/workflow08b/run_openalex_manifest.R fixture/expanded.csv fixture/state 10 2026-11
      - name: Validate every identifier, seed attribution, deduplicated citations and idempotence
        shell: Rscript {0}
        run: |
          library(jsonlite)
          f<-"fixture/state"
          ld<-fromJSON(file.path(f,"doi_resolution_summary.json"))
          lens<-fromJSON(file.path(f,"discovery_summary.json"))
          oa<-fromJSON(file.path(f,"openalex_summary.json"))
          ls<-readLines(file.path(f,"lens_seed_status.jsonl"),warn=FALSE)
          os<-readLines(file.path(f,"openalex_seed_status.jsonl"),warn=FALSE)
          ds<-readLines(file.path(f,"lens_doi_resolution.jsonl"),warn=FALSE)
          stopifnot(length(ls)==5L,length(os)==2L,length(ds)==2L,
            lens$requests_this_execution==0L,oa$requests_this_run==0L,
            ld$requests_this_execution==0L,
            lens$test_fixture_mode,oa$test_fixture_mode,ld$test_fixture_mode,
            ld$multi_lens_dois==1L)
          ids<-read.csv(file.path(f,"expanded_lens_identifier_queries.csv"))
          stopifnot(length(unique(ids$query_identifier))==5L,
            all(c("L1","L2","L3","L4","L5")%in%ids$query_identifier),
            nrow(ids)==9L)
          le<-read.csv(file.path(f,"merged/citation_edges.csv"))
          op<-read.csv(file.path(f,"openalex_merged/citation_edge_query_provenance.csv"))
          lp<-read.csv(file.path(f,"merged/citation_edge_query_provenance.csv"))
          stopifnot(
            nrow(le[le$seed_record_id=="a" & le$related_provider_id=="C9" & le$direction=="forward",])==1L,
            nrow(lp[lp$seed_record_id=="a" & lp$related_provider_id=="C9" & lp$direction=="forward",])==5L,
            nrow(op[op$seed_record_id=="a" & op$related_provider_id=="W9" & op$direction=="forward",])==2L)
          cat("PASS: all DOI matches, Lens IDs, OpenAlex IDs, shared seed mappings and same-month restart idempotence\n")
      - name: Ensure mock output is rejected by production Zenodo archive
        env:
          ZENODO_ACCESS_TOKEN: INVALID_TEST_TOKEN
        shell: bash
        run: |
          if Rscript scripts/workflow08b/archive_discovery.R fixture/state 0 fixture/should_not_exist.json; then
            echo "ERROR: fixture checkpoint was accepted for production archive"
            exit 1
          fi
          test ! -e fixture/should_not_exist.json
          echo 'PASS: simulated provider outputs cannot enter production Zenodo archive'
