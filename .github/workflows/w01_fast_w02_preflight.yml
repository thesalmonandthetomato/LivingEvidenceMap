name: W01-Fast W02 contract preflight
on:
  push:
    branches: [w01-fast-direct-delta]
    paths: ['.github/workflows/w01_fast_w02_preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-direct-delta
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse validator and run real contract on synthetic canonical records
        shell: Rscript {0}
        run: |
          install.packages(c('jsonlite','digest'))
          parse(file='scripts/updater/workflow_02_validate_canonical_handoff.R')
          library(jsonlite)
          p <- tempfile(); dir.create(p)
          record <- function(id,src) list(schema_version='living-evidence-map-canonical-v1',
            identity=list(record_id=id), canonical=list(title=paste('Title',id),doi=paste0('10.1234/',id)),
            manifestations=list(list(source=src,source_record_id=id)))
          infile <- file.path(p,'records.jsonl')
          writeLines(vapply(list(record('a','lens'),record('b','scopus')),function(x)toJSON(x,auto_unbox=TRUE,null='null'),character(1)),infile)
          args <- c('scripts/updater/workflow_02_validate_canonical_handoff.R',
            '--input',infile,'--sample',file.path(p,'sample.jsonl'),'--report',file.path(p,'report.json'),
            '--sample-n','2','--expected-records','2','--expected-manifestations','2')
          stopifnot(identical(system2('Rscript',args),0L))
          z<-fromJSON(file.path(p,'report.json'))
          stopifnot(z$status=='PASS',z$canonical_records==2L,z$source_manifestations==2L,z$sample_records==2L)
          cat('PASS: W02 validator parse and synthetic two-record handoff\\n')
