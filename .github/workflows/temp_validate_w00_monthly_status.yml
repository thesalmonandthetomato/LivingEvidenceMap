name: Temporary W00 monthly status regression validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - .github/workflows/temp_validate_w00_monthly_status.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse actual observer and verify monthly archive and provenance gates
        shell: Rscript {0}
        run: |
          path <- "scripts/updater/workflow_current_run_status_observer.R"
          parse(file=path)
          code <- readLines(path,warn=FALSE)
          p <- grep("path_re <-",code,value=TRUE,fixed=TRUE)
          stopifnot(length(p)==1L)
          # Evaluate the unchanged production regular expression assignment.
          eval(parse(text=trimws(p)),envir=environment())
          cases <- c(
            "docs/search_record/monthly_update/2026-10-19_lens.json",
            "docs/search_record/fortnightly_update/old.json",
            "docs/search_record/full_search/old.json",
            "docs/search_record/ad_hoc/old.json"
          )
          stopifnot(all(grepl(path_re,cases,perl=TRUE)))
          stopifnot(!grepl(path_re,"docs/search_record/other/old.json",perl=TRUE))
          trigger <- grep("if\\(any\\(grepl",code,value=TRUE)
          stopifnot(any(grepl("monthly_update",trigger,fixed=TRUE)))
          rule <- grep("if\\(all\\(vapply\\(recs",code,value=TRUE)
          stopifnot(length(rule)==1L)
          # Test the exact production expansion-only condition, including
          # positive expansion and negative monthly cases, without executing
          # any historical archive downloads or changing pipeline state.
          rule_text <- trimws(rule[[1L]])
          rule_expr <- parse(text=sub("\\)\\{\\s*$",")",rule_text))[[1L]]
          clean <- function(x) if (is.null(x) || !length(x)) "" else as.character(x[[1L]])
          catalogue <- list(pending_manual_expansions=list(cab=list(),proquest=list()))
          recs <- list(list(run_type="expansion"),list(run_type="expansion"))
          stopifnot(isTRUE(eval(rule_expr)))
          recs <- list(list(run_type="monthly"),list(run_type="monthly"))
          stopifnot(!isTRUE(eval(rule_expr)))
          recs <- list(list(run_type="monthly"),list(run_type="expansion"))
          stopifnot(!isTRUE(eval(rule_expr)))
          cat("PASS: production R parsed, archive modes match, historical expansion counts excluded from monthly runs\\n")
