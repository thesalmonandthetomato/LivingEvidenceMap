name: TEMP W08b previous-month checkpoint selector test
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_checkpoint_selector_test_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Verify November selection and non-adjacent month rejection
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/resolve_previous_checkpoint.R docs/workflow08b/monthly_checkpoint_registry.json 2026-11 "$RUNNER_TEMP/selected.json"
          Rscript -e 'x<-jsonlite::fromJSON(file.path(Sys.getenv("RUNNER_TEMP"),"selected.json"));stopifnot(x$previous_month=="2026-10",x$zenodo_record_id=="23627417",x$previous_provider_candidates==336264,!x$provider_calls_authorised)'
          if Rscript scripts/workflow08b/resolve_previous_checkpoint.R docs/workflow08b/monthly_checkpoint_registry.json 2026-12 "$RUNNER_TEMP/rejected.json"; then exit 1; fi
          test ! -e "$RUNNER_TEMP/rejected.json"
          echo "PASS: November resolves October and December fails closed without November checkpoint"
