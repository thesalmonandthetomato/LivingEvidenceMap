name: Temporary - validate Workflow 02 incremental repair modes

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_validate_workflow02_modes.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))

      - name: Parse revised Workflow 02 scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_02_plan_batches.R')
          parse(file='scripts/updater/workflow_02_resume_checkpoints.R')
          cat('PASS: revised Workflow 02 planner and resume scripts parse\n')

      - name: Build synthetic planner fixture
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create('outputs/mode_test',recursive=TRUE,showWarnings=FALSE)
          rec <- function(id, technical=NULL, completed=NULL) {
            x <- list(
              identity=list(record_id=id),
              canonical=list(title=paste('Title',id),abstract=NULL,doi=paste0('10.1234/',id)),
              manifestations=list()
            )
            if(!is.null(technical)) {
              x$metadata_enrichment <- list(
                workflow='workflow_02_metadata_enrichment',
                completed_at=completed,
                technical_error=technical,
                title_missing_after=FALSE,
                abstract_missing_after=TRUE
              )
            }
            x
          }
          rows <- list(
            rec('new-record'),
            rec('technical-failure',TRUE,'2026-09-29T00:00:00Z'),
            rec('prior-no-result',FALSE,'2020-01-01T00:00:00Z')
          )
          con <- file('outputs/mode_test/input.jsonl','wt',encoding='UTF-8')
          for(x in rows) writeLines(toJSON(x,auto_unbox=TRUE,null='null'),con)
          close(con)

      - name: Validate mode selection
        shell: bash
        run: |
          set -euo pipefail
          for MODE in incremental repair backfill; do
            Rscript scripts/updater/workflow_02_plan_batches.R \
              --input outputs/mode_test/input.jsonl \
              --output-dir "outputs/mode_test/$MODE" \
              --batch-size 10 \
              --max-records 0 \
              --recheck-after-days 0 \
              --mode "$MODE"
          done
          Rscript -e "library(jsonlite);i<-fromJSON('outputs/mode_test/incremental/plan.json');r<-fromJSON('outputs/mode_test/repair/plan.json');b<-fromJSON('outputs/mode_test/backfill/plan.json');stopifnot(i\$due_records==1L,r\$due_records==1L,b\$due_records==3L);cat('PASS: incremental=1 new; repair=1 technical failure; backfill=3 all due\n')"
