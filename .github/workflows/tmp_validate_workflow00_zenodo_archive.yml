name: Workflow 00 - Validate Zenodo archive from existing search

on:
  push:
    branches:
      - workflow00-zenodo-search-archive
    paths:
      - '.github/workflows/tmp_validate_workflow00_zenodo_archive.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: '35735412308'
  WORKFLOW00_ORCHESTRATOR_BRANCH: workflow00-zenodo-search-archive

jobs:
  archive-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Workflow 00 Zenodo branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW00_ORCHESTRATOR_BRANCH }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install archive dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Download existing successful Workflow 00 AGRICOLA search
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zenodo_staging/plan zenodo_staging/harvests/agricola zenodo_staging/search_records/agricola

          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "workflow00-search-plan-$SOURCE_RUN_ID" \
            --dir zenodo_staging/plan

          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "workflow00-agricola-harvest-$SOURCE_RUN_ID" \
            --dir zenodo_staging/harvests/agricola

          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "workflow00-search-record-agricola-$SOURCE_RUN_ID" \
            --dir zenodo_staging/search_records/agricola

          test -n "$(find zenodo_staging/plan -type f -print -quit)"
          test -n "$(find zenodo_staging/harvests/agricola -type f -print -quit)"
          test -n "$(find zenodo_staging/search_records/agricola -type f -print -quit)"
          echo "PASS: existing Workflow 00 search staged"

      - name: Read historical search version and run type
        id: meta
        shell: Rscript {0}
        run: |
          library(jsonlite)
          p <- list.files('zenodo_staging/plan',pattern='search_plan\\.json$',recursive=TRUE,full.names=TRUE)
          stopifnot(length(p)==1L)
          x <- fromJSON(p[[1]],simplifyVector=FALSE)
          run_type <- if (is.null(x$run_type)) 'full' else as.character(x$run_type)
          search_version <- if (is.null(x$search_version)) 'unknown' else as.character(x$search_version)
          cat(sprintf('run_type=%s\n',run_type),file=Sys.getenv('GITHUB_OUTPUT'),append=TRUE)
          cat(sprintf('search_version=%s\n',search_version),file=Sys.getenv('GITHUB_OUTPUT'),append=TRUE)

      - name: Publish restricted Zenodo validation archive
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_archive_to_zenodo.R \
            --staging-root zenodo_staging \
            --run-id "$SOURCE_RUN_ID" \
            --run-type '${{ steps.meta.outputs.run_type }}' \
            --search-version '${{ steps.meta.outputs.search_version }}' \
            --sources 'agricola' \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir outputs/updater/workflow00_zenodo

      - name: Register Zenodo archive in repository
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_update_zenodo_registry.R \
            --receipt outputs/updater/workflow00_zenodo/zenodo_receipt.json \
            --registry docs/search_record/zenodo_registry.csv \
            --pointer-dir docs/search_record/zenodo

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/search_record/zenodo_registry.csv docs/search_record/zenodo/
          if git diff --cached --quiet; then
            echo "Registry already current"
          else
            git commit -m "Register Zenodo archive for Workflow 00 run $SOURCE_RUN_ID"
            git push origin "HEAD:$WORKFLOW00_ORCHESTRATOR_BRANCH"
          fi

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-zenodo-validation-${{ github.run_id }}
          path: outputs/updater/workflow00_zenodo/
          retention-days: 7
          if-no-files-found: warn
