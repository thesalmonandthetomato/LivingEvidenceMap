name: TEMP validate W07 end-to-end without model calls

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w07_no_model_end_to_end.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_TOPIC_RUN: '37153534771'
  SOURCE_ZERO_RUN: '37180021271'
  CURRENT_W06_POINTER: docs/workflow06/zenodo/run-37114864202.json
  PRIOR_W07_POINTER: docs/workflow07/zenodo/run-36772700615.json
  PUBLISHED_W07_POINTER: docs/workflow07/zenodo/run-37153534771.json
  TOPIC_PROD_OUTPUT_DIR: outputs/workflow07_fresh
  TOPIC_ONTOLOGY_PATH: user_input/workflow07_topic_ontology.csv
  TOPIC_SYSTEM_PROMPT_PATH: user_input/workflow07_topic_system_prompt.txt
  TOPIC_CHUNK_SIZE: '500'
  BATCH_POLL_SECONDS: '20'
  BATCH_MAX_WAIT_SECONDS: '7200'
  BATCH_TOKEN_LIMIT_RETRY_SECONDS: '120'
  BATCH_TOKEN_LIMIT_MAX_RETRIES: '12'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('curl','digest','httr2','jsonlite','readr','dplyr'))

      - name: Parse current W07 implementation
        shell: Rscript {0}
        run: |
          files<-c(
            'scripts/updater/workflow_06_restore_state_from_zenodo.R',
            'scripts/updater/workflow_07_restore_state_from_zenodo.R',
            'scripts/updater/workflow_07_prepare_incremental.R',
            'scripts/updater/workflow_07_merge_incremental_topics.R',
            'scripts/updater/workflow_07_prepare_zero_rescreen_incremental.R',
            'scripts/updater/workflow_07_merge_zero_rescreen_incremental.R',
            'scripts/reporting/workflow07_zero_topic_targeted_rescreen_merge.R',
            'scripts/reporting/workflow07_apply_retention_and_review_rules.R'
          )
          invisible(lapply(files,parse))
          cat('PASS: current W07 deterministic implementation parses\n')

      - name: Check authoritative workflow artifact paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'topic/outputs/workflow07_zero_prepare/' .github/workflows/workflow_07_production.yml
          ! grep -q 'topic/outputs/workflow07_topic_complete/' .github/workflows/workflow_07_production.yml
          grep -q 'topic/workflow07_zero_prepare/zero_topic_rescreen_queue.csv' .github/workflows/workflow_07_production.yml
          grep -q 'topic/workflow07_topic_complete/workflow07_records.csv' .github/workflows/workflow_07_production.yml
          echo 'PASS: authoritative W07 uses corrected downloaded-artifact paths'

      - name: Restore current W06 and prior W07
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/current_w06 inputs/prior_w07 inputs/current inputs/prior
          Rscript scripts/updater/workflow_06_restore_state_from_zenodo.R \
            --pointer "$CURRENT_W06_POINTER" \
            --output-dir inputs/current_w06
          Rscript scripts/updater/workflow_07_restore_state_from_zenodo.R \
            --pointer "$PRIOR_W07_POINTER" \
            --output-dir inputs/prior_w07

          GEO=$(find inputs/current_w06 -type f -name geography_semantic_final.csv -print -quit)
          REC=$(find inputs/prior_w07 -type f -name workflow07_records.csv -print -quit)
          SCO=$(find inputs/prior_w07 -type f -name workflow07_topic_pathway_scores.csv -print -quit)
          ZER=$(find inputs/prior_w07 -type f -name workflow07_zero_topic_targeted_rescreen.jsonl -print -quit)
          MAN=$(find inputs/prior_w07 -type f -name workflow07_topic_complete_manifest.json -print -quit)
          for x in "$GEO" "$REC" "$SCO" "$ZER" "$MAN"; do test -n "$x"; done

          mkdir -p inputs/current inputs/prior
          GEO="$GEO" Rscript -e '
            library(readr)
            x<-read_csv(Sys.getenv("GEO"),show_col_types=FALSE)
            stopifnot(all(c("record_id","title","abstract")%in%names(x)),!anyDuplicated(x$record_id))
            write_csv(x[,c("record_id","title","abstract")],"inputs/current/workflow07_current.csv",na="")
          '
          cp "$REC" inputs/prior/workflow07_records.csv
          cp "$SCO" inputs/prior/workflow07_topic_pathway_scores.csv
          cp "$ZER" inputs/prior/workflow07_zero_topic_targeted_rescreen.jsonl
          cp "$MAN" inputs/prior/workflow07_topic_complete_manifest.json

      - name: Run current incremental preparation
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_07_prepare_incremental.R \
            --current inputs/current/workflow07_current.csv \
            --prior-records inputs/prior/workflow07_records.csv \
            --prior-scores inputs/prior/workflow07_topic_pathway_scores.csv \
            --prior-manifest inputs/prior/workflow07_topic_complete_manifest.json \
            --ontology "$TOPIC_ONTOLOGY_PATH" \
            --prompt "$TOPIC_SYSTEM_PROMPT_PATH" \
            --output-dir outputs/workflow07_prepare

          mkdir -p "$TOPIC_PROD_OUTPUT_DIR"
          cp outputs/workflow07_prepare/topic_screen_queue.csv "$TOPIC_PROD_OUTPUT_DIR/input_queue.csv"

          Rscript R/run_topic_three_luna_production.R manifest

          Rscript -e '
            library(jsonlite);library(readr)
            m<-fromJSON("outputs/workflow07_prepare/prepare_manifest.json")
            q<-read_csv("outputs/workflow07_prepare/topic_screen_queue.csv",show_col_types=FALSE)
            p<-read_csv("inputs/prior/workflow07_records.csv",show_col_types=FALSE)
            stopifnot(
              m$current_records==21819L,
              m$reusable_records==19353L,
              m$screen_queue_records==2466L,
              m$new_record_ids==2466L,
              m$changed_title_abstract==7644L,
              length(intersect(q$record_id,p$record_id))==0L
            )
            cat("PASS: W07 preparation reproduces 19,353 reuse + 2,466 new-only queue\n")
          '

      - name: Restore validated three-pass topic outputs without OpenAI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for p in a b c; do
            for ch in $(seq 1 5); do
              tmp="/tmp/w07_${p}_${ch}"; rm -rf "$tmp"; mkdir -p "$tmp"
              gh run download "$SOURCE_TOPIC_RUN" \
                -n "workflow07-topic-complete-$p-chunk-$ch-$SOURCE_TOPIC_RUN" \
                -D "$tmp"
              marker=$(find "$tmp" -type f -name complete.ok -print -quit)
              test -n "$marker"
              target="$TOPIC_PROD_OUTPUT_DIR/pass_$p/chunk_$(printf '%03d' "$ch")"
              mkdir -p "$target"
              cp -a "$(dirname "$marker")"/. "$target"/
            done
          done
          Rscript R/run_topic_three_luna_production.R combine
          Rscript R/run_topic_three_luna_production.R audit

      - name: Run current topic merge and zero-topic preparation
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_07_merge_incremental_topics.R \
            --current-records outputs/workflow07_prepare/current_topic_records.csv \
            --reused-scores outputs/workflow07_prepare/reused_topic_pathway_scores.csv \
            --fresh-scores outputs/workflow07_fresh/three_luna_pathway_scores.csv \
            --fresh-record-results outputs/workflow07_fresh/all_pass_record_results.csv \
            --prepare-manifest outputs/workflow07_prepare/prepare_manifest.json \
            --ontology "$TOPIC_ONTOLOGY_PATH" \
            --output-dir outputs/workflow07_topic_complete

          Rscript scripts/updater/workflow_07_prepare_zero_rescreen_incremental.R \
            --zero-records outputs/workflow07_topic_complete/workflow07_zero_code_records.csv \
            --current-records outputs/workflow07_topic_complete/workflow07_records.csv \
            --prior-records inputs/prior/workflow07_records.csv \
            --prior-zero-rescreen inputs/prior/workflow07_zero_topic_targeted_rescreen.jsonl \
            --output-dir outputs/workflow07_zero_prepare

      - name: Restore validated zero-topic outputs without OpenAI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf zero_shards
          mkdir -p zero_shards
          for shard in 1 2 3 4; do
            gh run download "$SOURCE_ZERO_RUN" \
              -n "workflow07-zero-shard-$shard-$SOURCE_ZERO_RUN" \
              -D "zero_shards/shard-$shard"
          done
          Rscript scripts/reporting/workflow07_zero_topic_targeted_rescreen_merge.R \
            --input-root zero_shards \
            --output-dir outputs/workflow07_zero_fresh \
            --expected-shards 4

      - name: Run current zero merge and final QC
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_07_merge_zero_rescreen_incremental.R \
            --zero-records outputs/workflow07_topic_complete/workflow07_zero_code_records.csv \
            --reused outputs/workflow07_zero_prepare/reused_zero_topic_rescreen.jsonl \
            --fresh outputs/workflow07_zero_fresh/workflow07_zero_topic_targeted_rescreen.jsonl \
            --output-dir outputs/workflow07_zero_complete

          Rscript scripts/reporting/workflow07_apply_retention_and_review_rules.R \
            --scores outputs/workflow07_topic_complete/workflow07_topic_pathway_scores.csv \
            --records outputs/workflow07_topic_complete/workflow07_topic_record_summary.csv \
            --ontology "$TOPIC_ONTOLOGY_PATH" \
            --zero-rescreen outputs/workflow07_zero_complete/workflow07_zero_topic_targeted_rescreen.jsonl \
            --output-dir outputs/workflow07_final_qc

      - name: Verify counts and hashes against published W07
        shell: Rscript {0}
        run: |
          library(jsonlite);library(readr);library(digest)
          p<-fromJSON(Sys.getenv("PUBLISHED_W07_POINTER"),simplifyVector=FALSE)

          hash<-function(x)digest(file=x,algo="sha256",serialize=FALSE)
          stopifnot(
            identical(hash("outputs/workflow07_topic_complete/workflow07_records.csv"),as.character(p$workflow07_records_sha256)),
            identical(hash("outputs/workflow07_topic_complete/workflow07_topic_pathway_scores.csv"),as.character(p$workflow07_topic_pathway_scores_sha256)),
            identical(hash("outputs/workflow07_topic_complete/workflow07_topic_record_summary.csv"),as.character(p$workflow07_topic_record_summary_sha256)),
            identical(hash("outputs/workflow07_zero_complete/workflow07_zero_topic_targeted_rescreen.jsonl"),as.character(p$workflow07_zero_topic_rescreen_sha256)),
            identical(hash("outputs/workflow07_final_qc/workflow07_topic_record_qc.csv"),as.character(p$workflow07_topic_record_qc_sha256)),
            identical(hash("outputs/workflow07_final_qc/workflow07_qc_summary.json"),as.character(p$workflow07_qc_summary_sha256))
          )

          q<-fromJSON("outputs/workflow07_final_qc/workflow07_qc_summary.json")
          rec<-read_csv("outputs/workflow07_topic_complete/workflow07_records.csv",show_col_types=FALSE)
          scores<-read_csv("outputs/workflow07_topic_complete/workflow07_topic_pathway_scores.csv",show_col_types=FALSE)

          stopifnot(
            nrow(rec)==as.integer(p$records),
            nrow(scores)==as.integer(p$raw_topic_assignments),
            as.integer(q$zero_topic_records)==as.integer(p$zero_topic_records),
            as.integer(q$included_uncoded_records)==as.integer(p$included_uncoded_records),
            as.integer(q$late_automatic_exclusions)==as.integer(p$late_automatic_exclusions),
            as.integer(q$immediate_human_adjudication_records)==as.integer(p$human_adjudication_records)
          )

          cat(sprintf(
            "PASS: no-model W07 end-to-end validation exactly reproduces published state: records=%d assignments=%d zero=%d uncoded=%d exclusions=%d human_review=%d\n",
            nrow(rec),nrow(scores),q$zero_topic_records,q$included_uncoded_records,
            q$late_automatic_exclusions,q$immediate_human_adjudication_records
          ))

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow07-no-model-validation-${{ github.run_id }}
          path: |
            outputs/workflow07_prepare/prepare_manifest.json
            outputs/workflow07_topic_complete/workflow07_topic_complete_manifest.json
            outputs/workflow07_final_qc/workflow07_qc_summary.json
            outputs/workflow07_final_qc/WORKFLOW07_QC_PASS.ok
          retention-days: 90
          if-no-files-found: warn
