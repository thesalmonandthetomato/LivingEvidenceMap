name: Workflow 04A - Import historical manual includes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Historical manual screening import mode'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply

permissions:
  contents: write

jobs:
  import-historical-manual-includes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout canonical store with LFS
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          path: canonical_store
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit and prepare historical manual include import
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p outputs/workflow04a
          python - <<'PY'
          import collections, csv, hashlib, json, os, re, unicodedata
          from pathlib import Path

          MODE=os.environ['MODE']
          assert MODE in {'audit','apply'}

          MASTER=Path('canonical_store/data/master/current/living_evidence_map_master.csv')
          CANON=Path('canonical_store/data/canonical/current/repair/records.jsonl')
          OUT=Path('outputs/workflow04a')
          EXPECTED_MASTER_ROWS=13389
          EXPECTED_MASTER_FINGERPRINT='17c3843195efa6238768fa578d2d75bbb337ab48ae78932d04d8d01da38bcb04'
          EXPECTED_CANONICAL_ROWS=20488
          EXPECTED_EXACT_LENS_MATCHES=12883
          EXPECTED_EXACT_TITLE_MATCHES=11
          EXPECTED_IMPORTED_ROWS=12894
          EXPECTED_TARGET_REPRESENTATIVES=12697
          EXPECTED_UNMATCHED_ROWS=495

          def load_json_stream(path):
              text=path.read_text(encoding='utf-8')
              decoder=json.JSONDecoder(); records=[]; pos=0; n=len(text)
              while pos < n:
                  while pos < n and text[pos].isspace(): pos += 1
                  if pos >= n: break
                  obj,end=decoder.raw_decode(text,pos); records.append(obj); pos=end
              return records

          def master_fingerprint(rows):
              cols=('record_id','title','doi','year','url_raw')
              h=hashlib.sha256()
              for r in rows:
                  h.update(json.dumps([r.get(c,'') or '' for c in cols],ensure_ascii=False,separators=(',',':')).encode('utf-8'))
                  h.update(b'\n')
              return h.hexdigest()

          def extract_lens_id(text):
              if not text: return ''
              m=re.search(r'lens\.org/(\d{3}-\d{3}-\d{3}-\d{3}-[0-9X]{3})',text,re.I)
              return m.group(1) if m else ''

          def norm_title(text):
              s=unicodedata.normalize('NFKC',str(text or '')).casefold()
              s=re.sub(r'<[^>]+>',' ',s)
              s=s.replace('‐','-').replace('‑','-').replace('–','-').replace('—','-')
              s=re.sub(r'[^\w]+',' ',s,flags=re.UNICODE)
              return re.sub(r'\s+',' ',s).strip()

          with MASTER.open(encoding='utf-8-sig',newline='') as f:
              master=list(csv.DictReader(f))
          assert len(master)==EXPECTED_MASTER_ROWS, len(master)
          fp=master_fingerprint(master)
          assert fp==EXPECTED_MASTER_FINGERPRINT, f'Master dataset fingerprint mismatch: {fp}'

          records=load_json_stream(CANON)
          assert len(records)==EXPECTED_CANONICAL_ROWS, len(records)
          by_lens={str((r.get('identity') or {}).get('lens_id') or ''):r for r in records}
          assert len(by_lens)==EXPECTED_CANONICAL_ROWS
          status=collections.Counter((r.get('deduplication') or {}).get('status') for r in records)
          assert status==collections.Counter({'unique':18379,'duplicate':1170,'canonical':939}), status
          assert all('screening' not in r for r in records), 'Fresh Workflow 04 screening state must remain empty before history import'

          title_to_reps=collections.defaultdict(set)
          for r in records:
              lid=str((r.get('identity') or {}).get('lens_id') or '')
              d=r.get('deduplication') or {}
              rep=str(d.get('duplicate_of') or '') if d.get('status')=='duplicate' else lid
              title=norm_title((r.get('canonical') or {}).get('title'))
              if title:
                  title_to_reps[title].add(rep)

          imports=[]; unmatched=[]; exact_lens=0; exact_title=0
          for row_number,m in enumerate(master,start=1):
              source_lens=extract_lens_id(m.get('url_raw',''))
              target=''; method=''

              if source_lens and source_lens in by_lens:
                  exact_lens += 1
                  sr=by_lens[source_lens]
                  d=sr.get('deduplication') or {}
                  if d.get('status')=='duplicate':
                      target=str(d.get('duplicate_of') or '')
                      assert target in by_lens, (source_lens,target)
                      assert (by_lens[target].get('deduplication') or {}).get('status') in {'unique','canonical'}
                      method='lens_id_exact_duplicate_to_representative'
                  else:
                      target=source_lens
                      method='lens_id_exact'
              else:
                  reps=title_to_reps.get(norm_title(m.get('title')),set()) if m.get('title') else set()
                  if len(reps)==1:
                      exact_title += 1
                      target=next(iter(reps))
                      method='title_exact_unique_representative'
                  else:
                      unmatched.append({
                          'master_row':row_number,
                          'source_record_id':m.get('record_id',''),
                          'source_lens_id':source_lens,
                          'title':m.get('title',''),
                          'doi':m.get('doi',''),
                          'year':m.get('year',''),
                          'authors':m.get('authors','')
                      })
                      continue

              imports.append({
                  'master_row':row_number,
                  'source_record_id':str(m.get('record_id') or ''),
                  'source_lens_id':source_lens,
                  'representative_lens_id':target,
                  'match_method':method,
              })

          assert exact_lens==EXPECTED_EXACT_LENS_MATCHES, exact_lens
          assert exact_title==EXPECTED_EXACT_TITLE_MATCHES, exact_title
          assert len(imports)==EXPECTED_IMPORTED_ROWS, len(imports)
          assert len({x['representative_lens_id'] for x in imports})==EXPECTED_TARGET_REPRESENTATIVES
          assert len(unmatched)==EXPECTED_UNMATCHED_ROWS, len(unmatched)
          assert all((by_lens[x['representative_lens_id']].get('deduplication') or {}).get('status') in {'unique','canonical'} for x in imports)

          grouped=collections.defaultdict(list)
          for x in imports:
              grouped[x['representative_lens_id']].append(x)

          imported_entries=0
          for target,items in grouped.items():
              r=by_lens[target]
              existing=r.get('screening_history')
              if existing is None:
                  existing=[]
              assert isinstance(existing,list), f'Unexpected screening_history type on {target}'
              existing=[e for e in existing if not (isinstance(e,dict) and e.get('history_label')=='manual_historical_includes' and e.get('source_dataset')=='living_evidence_map_master_CORRECTED(6)')]
              for x in sorted(items,key=lambda z:z['master_row']):
                  existing.append({
                      'history_label':'manual_historical_includes',
                      'decision':'retain',
                      'decision_type':'historical_manual_include',
                      'stage':'historical_manual_screening',
                      'source_dataset':'living_evidence_map_master_CORRECTED(6)',
                      'source_record_id':x['source_record_id'],
                      'source_lens_id':x['source_lens_id'] or None,
                      'match_method':x['match_method'],
                      'imported_at':'2026-09-07',
                      'current_screening_state_affected':False
                  })
                  imported_entries += 1
              r['screening_history']=existing

          assert imported_entries==EXPECTED_IMPORTED_ROWS
          assert sum(1 for r in records if 'screening' in r)==0
          hist_entries=[]
          for r in records:
              for e in (r.get('screening_history') or []):
                  if isinstance(e,dict) and e.get('history_label')=='manual_historical_includes' and e.get('source_dataset')=='living_evidence_map_master_CORRECTED(6)':
                      hist_entries.append(e)
          assert len(hist_entries)==EXPECTED_IMPORTED_ROWS, len(hist_entries)

          with (OUT/'matched_import_manifest.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['master_row','source_record_id','source_lens_id','representative_lens_id','match_method'])
              w.writeheader(); w.writerows(imports)
          with (OUT/'unmatched_495.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['master_row','source_record_id','source_lens_id','title','doi','year','authors'])
              w.writeheader(); w.writerows(unmatched)

          summary={
              'workflow':'04A_import_historical_manual_includes',
              'mode':MODE,
              'master_rows':len(master),
              'master_fingerprint':fp,
              'canonical_records':len(records),
              'exact_lens_matches':exact_lens,
              'exact_title_matches':exact_title,
              'historical_manual_include_entries':len(imports),
              'target_representatives':len(grouped),
              'unmatched_records':len(unmatched),
              'fresh_screening_records':0,
              'canonical_modified':MODE=='apply'
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))

          if MODE=='apply':
              tmp=CANON.with_suffix('.jsonl.tmp')
              with tmp.open('w',encoding='utf-8') as f:
                  for r in records:
                      f.write(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n')
              tmp.replace(CANON)
          PY

      - name: Commit historical screening history to canonical JSON
        if: ${{ inputs.mode == 'apply' }}
        working-directory: canonical_store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add data/canonical/current/repair/records.jsonl
          git diff --cached --quiet && { echo 'No canonical changes to commit'; exit 1; }
          git commit -m 'Import historical manual include screening history'
          git lfs push origin canonical-repair-store
          git push origin HEAD:canonical-repair-store
          git log -1 --format='canonical_commit=%H'

      - name: Upload Workflow 04A audit artefacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow04a-historical-manual-includes-${{ inputs.mode }}-${{ github.run_id }}
          path: outputs/workflow04a/
          retention-days: 90
          if-no-files-found: error
