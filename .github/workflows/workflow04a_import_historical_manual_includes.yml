name: Workflow 04A - Import historical manual includes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Historical manual screening import mode'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply

permissions:
  contents: write

jobs:
  import-historical-manual-includes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout canonical store with LFS
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          path: canonical_store
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit and prepare historical manual include import
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p outputs/workflow04a
          python - <<'PY'
          import collections, csv, hashlib, json, os, random, re, unicodedata
          from pathlib import Path

          MODE=os.environ['MODE']
          assert MODE in {'audit','apply'}

          MASTER=Path('canonical_store/data/master/current/living_evidence_map_master.csv')
          CANON=Path('canonical_store/data/canonical/current/repair/records.jsonl')
          OUT=Path('outputs/workflow04a')
          APPROVED_MASTER_ROWS=13389
          APPROVED_MASTER_FINGERPRINT='17c3843195efa6238768fa578d2d75bbb337ab48ae78932d04d8d01da38bcb04'
          EXPECTED_CANONICAL_ROWS=20488
          APPROVED_EXACT_LENS_MATCHES=12883
          APPROVED_EXACT_TITLE_MATCHES=11
          APPROVED_IMPORTED_ROWS=12894
          APPROVED_TARGET_REPRESENTATIVES=12697
          APPROVED_UNMATCHED_ROWS=495

          def load_json_stream(path):
              text=path.read_text(encoding='utf-8')
              decoder=json.JSONDecoder(); records=[]; pos=0; n=len(text)
              while pos < n:
                  while pos < n and text[pos].isspace(): pos += 1
                  if pos >= n: break
                  obj,end=decoder.raw_decode(text,pos); records.append(obj); pos=end
              return records

          def master_fingerprint(rows):
              cols=('record_id','title','doi','year','url_raw')
              h=hashlib.sha256()
              for r in rows:
                  h.update(json.dumps([r.get(c,'') or '' for c in cols],ensure_ascii=False,separators=(',',':')).encode('utf-8'))
                  h.update(b'\n')
              return h.hexdigest()

          def extract_lens_id(text):
              if not text: return ''
              m=re.search(r'lens\.org/(\d{3}-\d{3}-\d{3}-\d{3}-[0-9X]{3})',text,re.I)
              return m.group(1) if m else ''

          def norm_title(text):
              s=unicodedata.normalize('NFKC',str(text or '')).casefold()
              s=re.sub(r'<[^>]+>',' ',s)
              s=s.replace('‐','-').replace('‑','-').replace('–','-').replace('—','-')
              s=re.sub(r'[^\w]+',' ',s,flags=re.UNICODE)
              return re.sub(r'\s+',' ',s).strip()

          with MASTER.open(encoding='utf-8-sig',newline='') as f:
              master=list(csv.DictReader(f))
          fp=master_fingerprint(master)
          source_approved=(len(master)==APPROVED_MASTER_ROWS and fp==APPROVED_MASTER_FINGERPRINT)
          print(f'master_rows={len(master)}')
          print(f'master_fingerprint={fp}')
          print(f'approved_source_dataset={source_approved}')
          if MODE=='apply':
              assert source_approved, (
                  'APPLY BLOCKED: repository master is not the explicitly approved uploaded '
                  f'13,389-row dataset. rows={len(master)} fingerprint={fp}'
              )

          records=load_json_stream(CANON)
          assert len(records)==EXPECTED_CANONICAL_ROWS, len(records)
          by_lens={str((r.get('identity') or {}).get('lens_id') or ''):r for r in records}
          assert len(by_lens)==EXPECTED_CANONICAL_ROWS
          status=collections.Counter((r.get('deduplication') or {}).get('status') for r in records)
          assert status==collections.Counter({'unique':18379,'duplicate':1170,'canonical':939}), status
          assert all('screening' not in r for r in records), 'Fresh Workflow 04 screening state must remain empty before history import'

          title_to_reps=collections.defaultdict(set)
          for r in records:
              lid=str((r.get('identity') or {}).get('lens_id') or '')
              d=r.get('deduplication') or {}
              rep=str(d.get('duplicate_of') or '') if d.get('status')=='duplicate' else lid
              title=norm_title((r.get('canonical') or {}).get('title'))
              if title: title_to_reps[title].add(rep)

          imports=[]; unmatched=[]; exact_lens=0; exact_title=0
          for row_number,m in enumerate(master,start=1):
              source_lens=extract_lens_id(m.get('url_raw',''))
              source_record=None; target=''; method=''
              if source_lens and source_lens in by_lens:
                  exact_lens += 1
                  source_record=by_lens[source_lens]
                  d=source_record.get('deduplication') or {}
                  if d.get('status')=='duplicate':
                      target=str(d.get('duplicate_of') or '')
                      assert target in by_lens, (source_lens,target)
                      assert (by_lens[target].get('deduplication') or {}).get('status') in {'unique','canonical'}
                      method='lens_id_exact_duplicate_to_representative'
                  else:
                      target=source_lens
                      method='lens_id_exact'
              else:
                  reps=title_to_reps.get(norm_title(m.get('title')),set()) if m.get('title') else set()
                  if len(reps)==1:
                      exact_title += 1
                      target=next(iter(reps))
                      method='title_exact_unique_representative'
                  else:
                      unmatched.append({
                          'master_row':row_number,'source_record_id':m.get('record_id',''),
                          'source_lens_id':source_lens,'title':m.get('title',''),
                          'abstract':m.get('abstract',''),'abstract_raw':m.get('abstract_raw',''),
                          'doi':m.get('doi',''),'year':m.get('year',''),'authors':m.get('authors','')
                      })
                      continue
              imports.append({
                  'master_row':row_number,'source_record_id':str(m.get('record_id') or ''),
                  'source_lens_id':source_lens,'representative_lens_id':target,
                  'match_method':method,'master':m,'source_record':source_record
              })

          grouped=collections.defaultdict(list)
          for x in imports: grouped[x['representative_lens_id']].append(x)

          if source_approved:
              assert exact_lens==APPROVED_EXACT_LENS_MATCHES, exact_lens
              assert exact_title==APPROVED_EXACT_TITLE_MATCHES, exact_title
              assert len(imports)==APPROVED_IMPORTED_ROWS, len(imports)
              assert len(grouped)==APPROVED_TARGET_REPRESENTATIVES, len(grouped)
              assert len(unmatched)==APPROVED_UNMATCHED_ROWS, len(unmatched)

          # Write a full compact mapping manifest.
          with (OUT/'matched_import_manifest.csv').open('w',encoding='utf-8',newline='') as f:
              fields=['master_row','source_record_id','source_lens_id','representative_lens_id','match_method']
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for x in imports: w.writerow({k:x[k] for k in fields})

          with (OUT/'unmatched_records.csv').open('w',encoding='utf-8-sig',newline='') as f:
              fields=['master_row','source_record_id','source_lens_id','title','abstract','abstract_raw','doi','year','authors']
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(unmatched)

          # Human-checkable 100-row sample. Oversample non-trivial matches.
          rng=random.Random(20260908)
          title_matches=[x for x in imports if x['match_method']=='title_exact_unique_representative']
          duplicate_matches=[x for x in imports if x['match_method']=='lens_id_exact_duplicate_to_representative']
          direct_matches=[x for x in imports if x['match_method']=='lens_id_exact']
          sample=list(title_matches[:100])
          room=max(0,100-len(sample))
          take_dup=min(20,room,len(duplicate_matches))
          if take_dup: sample += rng.sample(duplicate_matches,take_dup)
          room=max(0,100-len(sample))
          if room: sample += rng.sample(direct_matches,room)
          rng.shuffle(sample)
          with (OUT/'matched_100_master_vs_canonical.csv').open('w',encoding='utf-8-sig',newline='') as f:
              fields=[
                  'master_row','match_method','master_record_id','master_lens_id','master_title','master_abstract',
                  'master_doi','master_year','master_authors','matched_source_canonical_lens_id',
                  'matched_source_dedup_status','matched_source_duplicate_of','canonical_representative_lens_id',
                  'canonical_representative_dedup_status','canonical_title','canonical_abstract','canonical_doi',
                  'canonical_year','canonical_authors','title_identical_normalised','doi_identical_casefolded',
                  'year_identical','human_match_check','human_notes'
              ]
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for x in sample:
                  m=x['master']; sr=x['source_record']; rr=by_lens[x['representative_lens_id']]
                  rc=rr.get('canonical') or {}; sd=(sr.get('deduplication') or {}) if sr else {}
                  w.writerow({
                      'master_row':x['master_row'],'match_method':x['match_method'],
                      'master_record_id':m.get('record_id',''),'master_lens_id':x['source_lens_id'],
                      'master_title':m.get('title',''),'master_abstract':m.get('abstract',''),
                      'master_doi':m.get('doi',''),'master_year':m.get('year',''),'master_authors':m.get('authors',''),
                      'matched_source_canonical_lens_id':x['source_lens_id'] if sr else '',
                      'matched_source_dedup_status':sd.get('status','') if sr else '',
                      'matched_source_duplicate_of':sd.get('duplicate_of','') if sr else '',
                      'canonical_representative_lens_id':x['representative_lens_id'],
                      'canonical_representative_dedup_status':(rr.get('deduplication') or {}).get('status',''),
                      'canonical_title':rc.get('title',''),'canonical_abstract':rc.get('abstract',''),
                      'canonical_doi':rc.get('doi',''),'canonical_year':rc.get('year',''),'canonical_authors':rc.get('authors',''),
                      'title_identical_normalised':norm_title(m.get('title'))==norm_title(rc.get('title')),
                      'doi_identical_casefolded':str(m.get('doi') or '').strip().casefold()==str(rc.get('doi') or '').strip().casefold(),
                      'year_identical':str(m.get('year') or '').strip()==str(rc.get('year') or '').strip(),
                      'human_match_check':'','human_notes':''
                  })

          summary={
              'workflow':'04A_import_historical_manual_includes','mode':MODE,
              'master_rows':len(master),'master_fingerprint':fp,'approved_source_dataset':source_approved,
              'canonical_records':len(records),'exact_lens_matches':exact_lens,'exact_title_matches':exact_title,
              'historical_manual_include_entries':len(imports),'target_representatives':len(grouped),
              'unmatched_records':len(unmatched),'fresh_screening_records':0,
              'canonical_modified':MODE=='apply'
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))

          if MODE=='apply':
              imported_entries=0
              for target,items in grouped.items():
                  r=by_lens[target]
                  existing=r.get('screening_history')
                  if existing is None: existing=[]
                  assert isinstance(existing,list), f'Unexpected screening_history type on {target}'
                  existing=[e for e in existing if not (isinstance(e,dict) and e.get('history_label')=='manual_historical_includes' and e.get('source_dataset')=='living_evidence_map_master_CORRECTED(6)')]
                  for x in sorted(items,key=lambda z:z['master_row']):
                      existing.append({
                          'history_label':'manual_historical_includes','decision':'retain',
                          'decision_type':'historical_manual_include','stage':'historical_manual_screening',
                          'source_dataset':'living_evidence_map_master_CORRECTED(6)',
                          'source_record_id':x['source_record_id'],'source_lens_id':x['source_lens_id'] or None,
                          'match_method':x['match_method'],'imported_at':'2026-09-08',
                          'current_screening_state_affected':False
                      })
                      imported_entries += 1
                  r['screening_history']=existing
              assert imported_entries==APPROVED_IMPORTED_ROWS
              assert sum(1 for r in records if 'screening' in r)==0
              tmp=CANON.with_suffix('.jsonl.tmp')
              with tmp.open('w',encoding='utf-8') as f:
                  for r in records: f.write(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n')
              tmp.replace(CANON)
          PY

      - name: Commit historical screening history to canonical JSON
        if: ${{ inputs.mode == 'apply' }}
        working-directory: canonical_store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add data/canonical/current/repair/records.jsonl
          git diff --cached --quiet && { echo 'No canonical changes to commit'; exit 1; }
          git commit -m 'Import historical manual include screening history'
          git lfs push origin canonical-repair-store
          git push origin HEAD:canonical-repair-store
          git log -1 --format='canonical_commit=%H'

      - name: Upload Workflow 04A audit artefacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow04a-historical-manual-includes-${{ inputs.mode }}-${{ github.run_id }}
          path: outputs/workflow04a/
          retention-days: 90
          if-no-files-found: error
