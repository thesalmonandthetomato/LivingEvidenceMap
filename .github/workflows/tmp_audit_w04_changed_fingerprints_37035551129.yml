name: TEMP audit W04 changed screening fingerprints

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_audit_w04_changed_fingerprints_37035551129.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2'))

      - name: Restore prior and current lean canonical states
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R \
            --pointer docs/compaction/zenodo/run-36166883249.json \
            --output-dir prior
          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R \
            --pointer docs/compaction/zenodo/run-37016080508.json \
            --output-dir current

      - name: Compare W04 screening fields for stable record IDs
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          `%||%`<-function(x,y)if(is.null(x))y else x
          scalar<-function(x){if(is.null(x)||!length(x))return('');z<-as.character(x[[1L]]);if(is.na(z))'' else trimws(z)}
          textify<-function(x){
            if(is.null(x))return('')
            if(is.character(x))return(paste(x[nzchar(x)],collapse='; '))
            if(is.atomic(x))return(paste(as.character(x),collapse='; '))
            if(is.list(x))return(paste(Filter(nzchar,vapply(x,textify,character(1))),collapse='; '))
            as.character(x)
          }
          first_nonempty<-function(...){for(x in list(...)){z<-textify(x);if(nzchar(trimws(z)))return(trimws(z))};''}
          read_jsonl<-function(path){x<-readLines(path,warn=FALSE);x<-x[nzchar(trimws(x))];lapply(x,function(z)fromJSON(z,simplifyVector=FALSE))}
          view<-function(r){
            c<-r$canonical%||%list()
            c(
              title=first_nonempty(c$title,r$title),
              abstract=first_nonempty(c$abstract,r$abstract),
              keywords=first_nonempty(c$keywords,r$keywords),
              journal_source_title=first_nonempty(c$source_title,c$journal,r$source_title,r$journal),
              affiliations=first_nonempty(c$affiliations,r$affiliations),
              funding=first_nonempty(c$funding,c$funders,r$funding,r$funders)
            )
          }
          rid<-function(r)scalar((r$identity%||%list())$record_id)
          p<-read_jsonl('prior/canonical_lean.jsonl');q<-read_jsonl('current/canonical_lean.jsonl')
          pm<-setNames(p,vapply(p,rid,character(1)));qm<-setNames(q,vapply(q,rid,character(1)))
          common<-intersect(names(pm),names(qm))
          fields<-c('title','abstract','keywords','journal_source_title','affiliations','funding')
          changed<-matrix(FALSE,nrow=length(common),ncol=length(fields),dimnames=list(common,fields))
          for(i in seq_along(common)){
            a<-view(pm[[common[[i]]]]);b<-view(qm[[common[[i]]]])
            changed[i,]<-a[fields]!=b[fields]
          }
          anychg<-rowSums(changed)>0
          dir.create('outputs',showWarnings=FALSE)
          summary<-list(
            prior_records=length(p),current_records=length(q),stable_record_ids=length(common),
            stable_ids_with_any_screening_field_change=sum(anychg),
            stable_ids_unchanged=length(common)-sum(anychg),
            changed_by_field=as.list(colSums(changed)),
            combination_counts=as.list(sort(table(apply(changed[anychg,,drop=FALSE],1,function(z)paste(fields[z],collapse='+'))),decreasing=TRUE))
          )
          writeLines(toJSON(summary,auto_unbox=TRUE,pretty=TRUE,null='null'),'outputs/summary.json')
          write.csv(data.frame(record_id=common[anychg],changed[,fields,drop=FALSE][anychg,,drop=FALSE]),'outputs/changed_ids.csv',row.names=FALSE)
          cat(toJSON(summary,auto_unbox=TRUE,pretty=TRUE,null='null'),"\n")

      - uses: actions/upload-artifact@v4
        with:
          name: w04-changed-fingerprint-audit-37035551129
          path: outputs/
          retention-days: 30
