name: TEMP cancel unintended W01 run

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_cancel_unintended_w01.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel unintended lifecycle-triggered W01 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 36925400854 --repo "$GITHUB_REPOSITORY"
