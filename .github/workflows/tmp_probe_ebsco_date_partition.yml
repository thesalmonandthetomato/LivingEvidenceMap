name: TEMP probe EBSCO EIT date partition syntax

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_probe_ebsco_date_partition.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','xml2'))
      - name: Probe live EIT date query forms
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(httr2);library(xml2)})
          uid <- Sys.getenv('EBSCO_EHOST_UID'); pwd <- Sys.getenv('EBSCO_EHOST_PWD')
          base <- '((TI (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") OR AB (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout")) AND (TI (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*) OR AB (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*)))'
          years <- 1800:2027
          all_years <- paste(sprintf('ZR (%d)',years),collapse=' OR ')
          waters_base <- '((TI (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") OR AB (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") OR KW (salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout")) AND (TI (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*) OR AB (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*) OR KW (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*)))'
          qs <- c(
            full=base,
            dt_exact=paste0('(',base,') AND DT (2020)'),
            dt_wild=paste0('(',base,') AND DT (2020*)'),
            zr_exact=paste0('(',base,') AND ZR (2020)'),
            zr_range=paste0('(',base,') AND ZR (2015-2020)'),
            waters_full=waters_base,
            waters_undated=paste0('(',waters_base,') AND NOT (',all_years,')')
          )
          count <- function(q) {
            db <- if (grepl('waters_',nm)) 'wrw' else 'cmedm'
            req <- request('https://eit.ebscohost.com/Services/SearchService.asmx/Search') |>
              req_url_query(prof=uid,pwd=pwd,authType='profile',db=db,query=q,format='detailed',startrec='1',numrec='1') |>
              req_timeout(120) |> req_error(is_error=function(resp) FALSE)
            resp <- req_perform(req)
            cat('HTTP',resp_status(resp),'\n')
            doc <- read_xml(resp_body_raw(resp))
            err <- xml_find_first(doc,"//*[local-name()='Error' or local-name()='error']")
            if (!inherits(err,'xml_missing')) return(paste('ERROR',trimws(xml_text(err))))
            vals <- suppressWarnings(as.integer(trimws(xml_text(xml_find_all(doc,"//*[local-name()='Hits']")))))
            vals <- vals[!is.na(vals)]
            if (!length(vals)) return('NO_HITS_NODE')
            as.character(vals[[1L]])
          }
          for (nm in names(qs)) {
            assign('nm',nm,envir=.GlobalEnv)
            cat(nm,'=',count(qs[[nm]]),'\n')
          }
