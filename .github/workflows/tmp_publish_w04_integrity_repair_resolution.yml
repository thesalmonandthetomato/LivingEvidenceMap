name: TEMP publish W04 integrity-repair resolution queue

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_publish_w04_integrity_repair_resolution.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '37679581307'
  LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','googlesheets4'))

      - name: Download immutable corrected W04 result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download "$SOURCE_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "workflow04-exact-repair-final-$SOURCE_RUN_ID"             --dir source
          test -s source/workflow04_resolution/workflow04_resolution_queue.jsonl
          test -s source/workflow04_resolution/workflow04_resolution_queue_manifest.json
          N="$(grep -cve '^[[:space:]]*$' source/workflow04_resolution/workflow04_resolution_queue.jsonl)"
          test "$N" -eq 52
          echo "PASS: restored exact 52-record W04 resolution queue"

      - name: Prepare Google credential
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          echo "GOOGLE_CREDENTIAL=$RUNNER_TEMP/lem-google-service-account.json" >> "$GITHUB_ENV"

      - name: Publish only the active W04 resolution queue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          Rscript scripts/updater/workflow_04_publish_resolution_queue_to_shiny.R             --queue source/workflow04_resolution/workflow04_resolution_queue.jsonl             --manifest source/workflow04_resolution/workflow04_resolution_queue_manifest.json             --highlight-terms user_input/workflow04_screening_highlight_terms.csv             --sheet-id "$LEM_GOOGLE_SHEET_ID"             --credential "$GOOGLE_CREDENTIAL"             --queue-tab queue_w04_resolution_active             --receipt outputs/shiny_publish_receipt.json

          N="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/shiny_publish_receipt.json");cat(as.integer(x$records))')"
          test "$N" -eq 52
          BATCH_ID="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/shiny_publish_receipt.json");cat(x$batch_id)')"
          QUEUE_SHA="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/shiny_publish_receipt.json");cat(x$queue_sha256)')"

          Rscript scripts/updater/workflow_shiny_batch_status.R             --stage "04"             --batch-id "$BATCH_ID"             --queue-sha256 "$QUEUE_SHA"             --status published             --sheet-id "$LEM_GOOGLE_SHEET_ID"             --credential "$GOOGLE_CREDENTIAL"             --workflow-run-id "$GITHUB_RUN_ID"             --source-run-id "$SOURCE_RUN_ID"             --message "Corrected W04 integrity-repair model conflicts published for human resolution. Other Shiny queues were not reset or replaced."

          echo "PASS: published only the 52 corrected W04 cases; no backend reset performed"

      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: w04-integrity-repair-shiny-publish-${{ github.run_id }}
          path: outputs/shiny_publish_receipt.json
          retention-days: 30
          if-no-files-found: error
