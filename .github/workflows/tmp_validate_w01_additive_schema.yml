name: Temporary - validate W01 additive schema guard

on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_validate_w01_additive_schema.yml'
      - 'scripts/updater/workflow_01_build_canonical_jsonl.R'
      - 'scripts/updater/workflow_01_validate_additive_schema.R'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','digest','data.table'))

      - name: Restore authoritative Workflow 01 state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R             --pointer docs/deduplication/zenodo/run-36128255337.json             --pointer-dir docs/deduplication/zenodo             --output-root baseline
          test -s baseline/canonical/records.jsonl

      - name: Locate archived Workflow 01 rebuild inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          cm="$(find baseline -type f -path '*/workflow01_full_five_source/manifestation_cluster_map.csv' -print -quit)"
          lens="$(find baseline -type f -path '*/workflow01_seed/lens_records_for_deduplication.jsonl' -print -quit)"
          scopus="$(find baseline -type f -path '*/workflow01_seed/scopus_records_for_deduplication.jsonl' -print -quit)"
          openalex="$(find baseline -type f -path '*/workflow01_seed/openalex_records_for_deduplication.jsonl' -print -quit)"
          agricola="$(find baseline -type f -path '*/workflow01_seed/agricola_records_for_deduplication.jsonl' -print -quit)"
          wos="$(find baseline -type f -path '*/workflow01_seed/wos_records_for_deduplication.jsonl' -print -quit)"
          strip="$(find baseline -type f -path '*/workflow01_full_five_source/abstract_strip_actions.jsonl' -print -quit || true)"
          repairs="$(find baseline -type f -path '*/provenance/cumulative_data_quality_repairs.jsonl' -print -quit || true)"
          for v in cm lens scopus openalex agricola wos; do
            eval "p=\${$v}"
            [ -s "$p" ] || { echo "Missing required archived input: $v" >&2; find baseline -maxdepth 4 -type f | sort >&2; exit 1; }
            echo "$v=$p" >> "$GITHUB_OUTPUT"
          done
          if [ -n "$strip" ] && [ -f "$strip" ]; then echo "strip=$strip" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$repairs" ] && [ -f "$repairs" ]; then echo "repairs=$repairs" >> "$GITHUB_OUTPUT"; fi

      - name: Build enriched candidate from archived W01 state
        shell: bash
        env:
          RUN_ID: additive-schema-validation
        run: |
          set -euo pipefail
          mkdir -p candidate
          args=(
            --cluster-map '${{ steps.inputs.outputs.cm }}'
            --lens '${{ steps.inputs.outputs.lens }}'
            --scopus '${{ steps.inputs.outputs.scopus }}'
            --openalex '${{ steps.inputs.outputs.openalex }}'
            --agricola '${{ steps.inputs.outputs.agricola }}'
            --wos '${{ steps.inputs.outputs.wos }}'
            --run-id "$RUN_ID"
            --output candidate/records.jsonl
            --manifest candidate/manifest.json
          )
          if [ -n '${{ steps.inputs.outputs.strip }}' ]; then
            args+=(--strip-actions '${{ steps.inputs.outputs.strip }}')
          fi
          if [ -n '${{ steps.inputs.outputs.repairs }}' ]; then
            args+=(--data-quality-repairs '${{ steps.inputs.outputs.repairs }}')
            args+=(--repair-audit candidate/data_quality_repair_application.jsonl)
          fi
          Rscript scripts/updater/workflow_01_build_canonical_jsonl.R "${args[@]}"

      - name: Validate enriched canonical schema is strictly additive
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_validate_additive_schema.R \
            --baseline baseline/canonical/records.jsonl \
            --candidate candidate/records.jsonl \
            --report outputs/manifestation_enrichment_regression.json
