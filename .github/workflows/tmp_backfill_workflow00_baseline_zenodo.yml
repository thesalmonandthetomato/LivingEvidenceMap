name: Workflow 00 - Backfill historical baseline searches to Zenodo

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - '.github/workflows/tmp_backfill_workflow00_baseline_zenodo.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Workflow 00 branch
        uses: actions/checkout@v4
        with:
          ref: workflow00-search-orchestrator
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install archive dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Backfill baseline search archives
        env:
          GH_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          archive_run() {
            local run_id="$1"
            local sources_csv="$2"
            local pointer="docs/search_record/zenodo/run-${run_id}.json"

            if [ -s "$pointer" ]; then
              echo "SKIP: Workflow 00 run $run_id already has a Zenodo pointer"
              return 0
            fi

            local root="backfill/${run_id}"
            rm -rf "$root"
            mkdir -p "$root/zenodo_staging/plan" "$root/zenodo_staging/harvests" "$root/zenodo_staging/search_records"

            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "workflow00-search-plan-$run_id" \
              --dir "$root/zenodo_staging/plan"

            IFS=',' read -r -a sources <<< "$sources_csv"
            for source in "${sources[@]}"; do
              mkdir -p "$root/zenodo_staging/harvests/$source" "$root/zenodo_staging/search_records/$source"
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                --name "workflow00-${source}-harvest-$run_id" \
                --dir "$root/zenodo_staging/harvests/$source"
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                --name "workflow00-search-record-${source}-$run_id" \
                --dir "$root/zenodo_staging/search_records/$source"
            done

            local plan
            plan="$(find "$root/zenodo_staging/plan" -name search_plan.json -type f -print -quit)"
            test -n "$plan"
            local run_type search_version
            run_type="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1],simplifyVector=FALSE); cat(if(is.null(x$run_type)) "full" else x$run_type)' "$plan")"
            search_version="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1],simplifyVector=FALSE); cat(if(is.null(x$search_version)) "unknown" else x$search_version)' "$plan")"

            Rscript scripts/updater/workflow_00_archive_to_zenodo.R \
              --staging-root "$root/zenodo_staging" \
              --run-id "$run_id" \
              --run-type "$run_type" \
              --search-version "$search_version" \
              --sources "$sources_csv" \
              --repository "$GITHUB_REPOSITORY" \
              --output-dir "$root/zenodo_output"

            Rscript scripts/updater/workflow_00_update_zenodo_registry.R \
              --receipt "$root/zenodo_output/zenodo_receipt.json" \
              --registry docs/search_record/zenodo_registry.csv \
              --pointer-dir docs/search_record/zenodo

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/search_record/zenodo_registry.csv "docs/search_record/zenodo/run-${run_id}.json"
            git commit -m "Register Zenodo archive for Workflow 00 run $run_id"
            git pull --rebase origin workflow00-search-orchestrator
            git push origin HEAD:workflow00-search-orchestrator
            echo "PASS: archived Workflow 00 run $run_id"
          }

          archive_run 35730574878 "lens,openalex,wos"
          archive_run 35731899007 "scopus"

      - name: Preserve backfill receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-baseline-zenodo-backfill-${{ github.run_id }}
          path: backfill/*/zenodo_output/
          retention-days: 7
          if-no-files-found: warn
