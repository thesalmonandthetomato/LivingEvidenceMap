name: Workflow 06 - Topic v3.5 same-sample Batch validation

on:
  workflow_dispatch:
  push:
    branches: [workflow06-gpt5mini-replication]
    paths:
      - '.github/workflows/workflow06_topic_v3_5_same_sample_validation.yml'
      - 'data/reference/topic_ontology_v3_5.csv'
      - 'data/reference/topic_system_prompt_v3_5.txt'

permissions:
  contents: read

env:
  COST_TEST_OUTPUT_DIR: outputs/workflow06_topic_v3_5_same_sample_validation
  COST_TEST_SAMPLE_SIZE: '100'
  TOPIC_ONTOLOGY_PATH: data/reference/topic_ontology_v3_5.csv
  TOPIC_SYSTEM_PROMPT_PATH: data/reference/topic_system_prompt_v3_5.txt
  SOURCE_LUNA_BATCH_INPUT_FILE_ID: file-ErBixapGzLBg9jpoqQux7N
  SOURCE_COMPLETED_LUNA_ARTIFACT_ID: '10582102714'

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Repair v3.5 evaluator and resume adjudication' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow06-gpt5mini-replication

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::curl
            any::digest
            any::httr2
            any::jsonlite
            any::readr

      - name: Recover completed Luna outputs from failed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$COST_TEST_OUTPUT_DIR" /tmp/v35_luna
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_COMPLETED_LUNA_ARTIFACT_ID}/zip" > /tmp/v35_luna.zip
          unzip -q /tmp/v35_luna.zip -d /tmp/v35_luna
          cp -a /tmp/v35_luna/. "$COST_TEST_OUTPUT_DIR/"
          test -s "$COST_TEST_OUTPUT_DIR/luna_a/topic_assignments.csv"
          test -s "$COST_TEST_OUTPUT_DIR/luna_b/topic_assignments.csv"
          test -s "$COST_TEST_OUTPUT_DIR/validation_queue_100.csv"
          test -s "$COST_TEST_OUTPUT_DIR/luna_usage.csv"

      - name: Evaluate Luna reproducibility
        run: Rscript R/run_topic_batch_cost_test.R evaluate

      - name: Run disagreement-only Terra Batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: Rscript R/run_topic_batch_cost_test.R terra

      - name: Calculate measured cost
        run: Rscript R/run_topic_batch_cost_test.R summary

      - name: Upload validation artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow06-topic-v3-5-same-sample-${{ github.run_id }}
          path: outputs/workflow06_topic_v3_5_same_sample_validation/
          if-no-files-found: error
          retention-days: 90
