name: Workflow 06 - Topic v3.5 same-sample Batch validation

on:
  workflow_dispatch:
  push:
    branches: [workflow06-gpt5mini-replication]
    paths:
      - '.github/workflows/workflow06_topic_v3_5_same_sample_validation.yml'
      - 'data/reference/topic_ontology_v3_5.csv'
      - 'data/reference/topic_system_prompt_v3_5.txt'

permissions:
  contents: read

env:
  COST_TEST_OUTPUT_DIR: outputs/workflow06_topic_v3_5_same_sample_validation
  COST_TEST_SAMPLE_SIZE: '100'
  TOPIC_ONTOLOGY_PATH: data/reference/topic_ontology_v3_5.csv
  TOPIC_SYSTEM_PROMPT_PATH: data/reference/topic_system_prompt_v3_5.txt
  SOURCE_LUNA_BATCH_INPUT_FILE_ID: file-ErBixapGzLBg9jpoqQux7N

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run v3.5 same-sample topic validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow06-gpt5mini-replication

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::curl
            any::digest
            any::httr2
            any::jsonlite
            any::readr

      - name: Recover exact prior 100-record sample
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$COST_TEST_OUTPUT_DIR"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            "https://api.openai.com/v1/files/${SOURCE_LUNA_BATCH_INPUT_FILE_ID}/content" \
            > /tmp/prior_luna_input.jsonl
          python3 - <<'PY'
          import csv, json, os, re
          src="/tmp/prior_luna_input.jsonl"
          out=os.environ["COST_TEST_OUTPUT_DIR"]
          seen=set()
          rows=[]
          with open(src, encoding="utf-8") as fh:
              for line in fh:
                  if not line.strip():
                      continue
                  obj=json.loads(line)
                  cid=obj["custom_id"]
                  if not cid.startswith("luna-a-"):
                      continue
                  rid=cid[len("luna-a-"):]
                  if rid in seen:
                      continue
                  seen.add(rid)
                  text=obj["body"]["input"][1]["content"][0]["text"]
                  m=re.match(r"RECORD\n\nTitle: (.*?)\n\nAbstract: (.*?)\n\nReturn the substantive ontology assignments\.\Z", text, re.S)
                  if not m:
                      raise RuntimeError(f"Could not parse source record {rid}")
                  rows.append((rid,m.group(1),m.group(2)))
          if len(rows)!=100:
              raise RuntimeError(f"Expected 100 source records, recovered {len(rows)}")
          with open(os.path.join(out,"validation_queue_100.csv"),"w",newline="",encoding="utf-8") as f:
              w=csv.writer(f); w.writerow(["record_id","title","abstract"]); w.writerows(rows)
          with open(os.path.join(out,"historical_context_not_gold.csv"),"w",newline="",encoding="utf-8") as f:
              w=csv.writer(f); w.writerow(["record_id","historical_pathways_not_gold"])
              for rid,_,_ in rows: w.writerow([rid,""])
          with open(os.path.join(out,"same_sample_manifest.json"),"w",encoding="utf-8") as f:
              json.dump({
                  "source_workflow_run":35398553060,
                  "source_luna_batch_input_file_id":os.environ["SOURCE_LUNA_BATCH_INPUT_FILE_ID"],
                  "records":100,
                  "recovery":"Exact Luna pass-A records recovered from immutable prior Batch input; no inference used."
              },f,indent=2)
          PY

      - name: Run two Luna passes through Batch API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: Rscript R/run_topic_batch_cost_test.R luna

      - name: Evaluate Luna reproducibility
        run: Rscript R/run_topic_batch_cost_test.R evaluate

      - name: Run disagreement-only Terra Batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: Rscript R/run_topic_batch_cost_test.R terra

      - name: Calculate measured cost
        run: Rscript R/run_topic_batch_cost_test.R summary

      - name: Upload validation artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow06-topic-v3-5-same-sample-${{ github.run_id }}
          path: outputs/workflow06_topic_v3_5_same_sample_validation/
          if-no-files-found: error
          retention-days: 90
