name: TEMP WoS API field-tag diagnostic 2026-11-23
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_wos_api_diagnostic_20261123.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run seven isolated API probes and store sanitized results
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: workflow01-final-architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.parse,urllib.error,base64
          species='salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout"'
          farm_sep='farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*'
          farm_nov=farm_sep+' OR maricultur*'
          def block(f):
              return ' OR '.join('('+t+'=(('+species+') AND ('+f+')))' for t in ('TI','AB','AK'))
          historical=block(farm_sep)
          november=block(farm_nov)
          window='2026-10-15+2026-11-20'
          cases=[
              ('1_TI_independent','TI=(salmon)',None),
              ('2_AB_independent','AB=(salmon)',None),
              ('3_AK_independent','AK=(salmon)',None),
              ('4_September_full_no_date',historical,None),
              ('5_September_full_with_date',historical,window),
              ('6_November_full_no_date',november,None),
              ('7_November_full_with_date',november,window)
          ]
          results=[]
          for case,q,span in cases:
              args={'q':q,'db':'WOS','limit':1,'page':1}
              if span:args['modifiedTimeSpan']=span
              url='https://api.clarivate.com/apis/wos-starter/v1/documents?'+urllib.parse.urlencode(args)
              req=urllib.request.Request(url,headers={'X-ApiKey':os.environ['WOS_STARTER_API'],'Accept':'application/json','User-Agent':'LivingEvidenceMap isolated API diagnostic'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      status=resp.status
                      body=resp.read(6000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code
                  body=e.read(6000).decode('utf-8','replace')
              except Exception as e:
                  status='connection_error'
                  body=json.dumps({'error_type':type(e).__name__,'message':str(e)})
              try:
                  obj=json.loads(body)
                  slim={'total':obj.get('metadata',{}).get('total'),'error':obj.get('error')}
              except Exception:
                  slim={'response_excerpt':body[:1200]}
              row={'test':case,'http_status':status,'q':q,'modifiedTimeSpan':span,'response':slim}
              results.append(row)
              print('PROBE_RESULT '+json.dumps({'test':case,'status':status,'response':slim},ensure_ascii=False),flush=True)
              time.sleep(0.5)
          out={'run_date':'2026-11-23','endpoint':'https://api.clarivate.com/apis/wos-starter/v1/documents','db':'WOS','limit':1,'page':1,'cases':results}
          data=json.dumps(out,indent=2,ensure_ascii=False).encode()
          content=base64.b64encode(data).decode()
          doc=json.dumps({'message':'Store temporary sanitized WoS API probe results','content':content,'branch':os.environ['GH_BRANCH']}).encode()
          gh='https://api.github.com/repos/'+os.environ['GH_REPO']+'/contents/docs/.wos_api_diagnostic_20261123.json'
          request=urllib.request.Request(gh,data=doc,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as resp:
              print('RESULT_COMMITTED '+str(resp.status),flush=True)
          PY
