name: Build Connect Cloud Shiny manifest

on:
  push:
    branches:
      - shiny-adjudication-interface
    paths:
      - 'shiny/adjudication/**'
      - '.github/workflows/shiny-adjudication-manifest.yml'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shiny/adjudication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiny-adjudication-interface

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install manifest dependencies
        shell: Rscript {0}
        run: install.packages(c("rsconnect","shiny","bslib","jsonlite","digest","googlesheets4"))

      - name: Parse app and generate manifest
        shell: Rscript {0}
        run: |
          parse(file="app.R")
          parse(file="R/auth.R")
          parse(file="R/w01_contract.R")
          parse(file="R/storage_local.R")
          parse(file="R/storage_sheets.R")
          parse(file="R/storage_backend.R")
          rsconnect::writeManifest(appDir=".")
          stopifnot(file.exists("manifest.json"))
          cat("PASS: Connect Cloud manifest generated\n")

      - name: Commit manifest if changed
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shiny/adjudication/manifest.json
          if git diff --cached --quiet; then
            echo "PASS: manifest.json already current"
            exit 0
          fi
          git commit -m "build: update Connect Cloud manifest"
          git push origin HEAD:shiny-adjudication-interface

      - uses: actions/upload-artifact@v4
        with:
          name: connect-cloud-manifest
          path: shiny/adjudication/manifest.json
          if-no-files-found: error
