name: Restore historical annotations
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore populated historical fields only
        run: |
          python - <<'PY'
          import csv, os, shutil
          from datetime import datetime, timezone
          hist='data/reference/historical_master_12043.csv'
          master='data/reference/salmon_evidence_map.csv'
          archive='data/archive/historical_annotation_restore'
          os.makedirs(archive,exist_ok=True)
          with open(hist,encoding='utf-8-sig',newline='') as f:
              hr=csv.DictReader(f); hf=hr.fieldnames or []; h=list(hr)
          with open(master,encoding='utf-8-sig',newline='') as f:
              mr=csv.DictReader(f); mf=mr.fieldnames or []; rows=list(mr)
          if 'record_id' not in hf or 'record_id' not in mf: raise SystemExit('record_id missing')
          hb={(r.get('record_id') or '').strip():r for r in h if (r.get('record_id') or '').strip()}
          mids={(r.get('record_id') or '').strip() for r in rows if (r.get('record_id') or '').strip()}
          mapping={x:x for x in ['final_species','final_primary_country_iso3c','broad_topic','subtopic','feature','component']}
          changed=[]
          for r in rows:
              s=hb.get((r.get('record_id') or '').strip())
              if not s: continue
              for dst,src in mapping.items():
                  if dst in mf and src in hf and not (r.get(dst) or '').strip() and (s.get(src) or '').strip():
                      r[dst]=s[src]; changed.append((r['record_id'],dst))
          missing=sorted(set(hb)-mids)
          ts=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          shutil.copy2(master,f'{archive}/master_before_{ts}.csv')
          with open(f'{archive}/historical_records_missing_from_master.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['record_id']); w.writerows([[x] for x in missing])
          with open(f'{archive}/transfer_summary.txt','w',encoding='utf-8') as f:
              f.write(f'Historical rows: {len(h)}\nCurrent master rows: {len(rows)}\nMissing historical records: {len(missing)}\nFields transferred: {len(changed)}\nOnly non-empty historical source values were copied. Blank historical annotation was NOT inferred or recreated.\n')
          with open(master,'w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=mf); w.writeheader(); w.writerows(rows)
          print(f'Historical rows: {len(h)}'); print(f'Master rows: {len(rows)}'); print(f'Missing historical records: {len(missing)}'); print(f'Fields transferred: {len(changed)}')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          import csv
          p='data/reference/salmon_evidence_map.csv'
          with open(p,encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          ids=[r.get('record_id','').strip() for r in rows]
          if len(rows)!=13389 or not all(ids) or len(ids)!=len(set(ids)): raise SystemExit(f'Validation failed: {len(rows)} rows')
          print(f'Validated {len(rows)} unique records')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/salmon_evidence_map.csv data/archive/historical_annotation_restore
          git commit -m 'Restore populated historical annotations'
          git push origin main
