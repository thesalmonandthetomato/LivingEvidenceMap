name: TEMP Restore Shiny approved pipeline status
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_restore_shiny_baseline_20261123.yml']
permissions:
  contents: read
jobs:
  restore-shiny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - shell: Rscript {0}
        run: install.packages(c('googlesheets4','jsonlite','digest'))
      - name: Restore exact approved status and verify
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          test "$(Rscript -e 'cat(jsonlite::fromJSON("docs/current_run/current_run_status.json")$update_id)')" = 'w08b-citation-run-40191412234'
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-svc.json"
          chmod 600 "$RUNNER_TEMP/lem-svc.json"
          Rscript scripts/updater/workflow_current_run_status_to_shiny.R --status docs/current_run/current_run_status.json --sheet-id '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs' --credential "$RUNNER_TEMP/lem-svc.json"
          rm -f "$RUNNER_TEMP/lem-svc.json"
          echo 'SHINY_BASELINE_RESTORED'
