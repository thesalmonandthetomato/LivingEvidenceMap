name: W08b diagnose archived incomplete Lens seeds
on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - docs/workflow08b/.run_checkpoint_diagnosis
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite'))
      - name: Read archived errors without Lens API requests
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/workflow08b/diagnose_checkpoint.R 23624392
