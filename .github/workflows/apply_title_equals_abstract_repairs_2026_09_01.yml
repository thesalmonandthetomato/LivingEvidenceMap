name: Apply title=abstract repairs 2026-09-01

on:
  push:
    branches:
      - updater-workflow-04-relevance-screening
    paths:
      - .github/workflows/apply_title_equals_abstract_repairs_2026_09_01.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical repair store with Git LFS
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          fetch-depth: 1

      - name: Apply verified title=abstract repairs
        shell: python
        run: |
          import json, re, unicodedata
          from pathlib import Path

          src = Path('data/canonical/current/repair/records.jsonl')

          affected = {
            '039-159-014-860-459','120-721-821-422-19X','054-102-097-127-40X','175-405-800-730-637','011-321-751-873-475',
            '066-858-290-819-411','071-180-346-044-577','018-133-835-588-133','139-152-067-548-606','186-337-381-139-46X',
            '185-977-222-006-132','107-670-998-729-420','155-385-215-296-509','116-698-329-742-362','143-655-242-433-232',
            '194-406-824-699-383','056-939-028-347-342','117-011-361-103-731','194-169-842-687-005','113-056-815-955-087',
            '114-525-233-494-239','122-687-061-780-889','056-860-204-153-36X','125-075-423-115-619','154-016-567-908-986',
            '158-791-767-288-390','160-948-026-481-673','088-753-027-682-494'
          }

          repairs = {
            '039-159-014-860-459': '''Retentions of total n-3 and n-6 essential fatty acids (EFAs) were assessed in Atlantic salmon (Salmo salar L.) parr held at 8 ¡C and 2 ¡C until they increased in weight from ca. 19 g to 38 g. Feeds contained sandeel oil or a rapeseed:linseed oil blend at 21 and 34% dietary fat. EFA retention efficiencies [(g EFA gained g EFA ingested-1) _ 100] were estimated by the 'mass balance method' from measurements of feed intake, changes in biomass for each tank of fish, and fatty acid compositions of the feeds and fish. The n-3 EFA retentions were higher (overall mean 71%) across feed treatments and temperatures than the n-6 EFA retentions (overall mean 63%). Retentions of the n-3 fatty acids were higher in the fish given the feeds with the lower fat content (77% vs. 65%), implying improved retention with reduced n-3 EFA availability. n-3 EFA retention tended to be higher at 2 ¡C than at 8 ¡C, although this was not consistent across feeds. At low temperature there was very high retention of the n-3 EFAs in feeds containing sandeel oil (80%). Such high retention may represent an adaptation response to low temperature. Lower n-6 EFA retentions imply that more n-6 fatty acids were metabolized than n-3 EFAs. Feed oil influenced retention of the n-6 fatty acids, retention being lower for the salmon parr given the feeds containing sandeel oil (56% vs. 71%). This could indicate a higher tissue deposition of n-6 fatty acids when they are freely available via the diet. Abbreviations: AA Ð arachidonic acid (C20:4 n-6); DHA Ð docosahexaenoic acid (C22:6 n-3); EFA Ð essential fatty acid; EPA Ð eicosapentaenoic acid (C20:5 n-3); HUFA Ð highly-unsaturated fatty acid (\ge4 double bonds); MUFA Ð monounsaturated fatty acid (1 double bond); PL Ð phospholipid; PUFA Ð poly-unsaturated fatty acids (\ge2 double bonds); SFA Ð saturated fatty acid (no double bond); TAG Ð triacylglycerol.''',
            '120-721-821-422-19X': '''This study aimed to increase the number of allozyme loci which may be screened in the Atlantic salmon, Salmo salar L., particularly for use in investigating interactions between wild populations and reared strains. Three samples of wild salmon from Ireland, Scotland and Spain and one from a farmed strain of Norwegian origin were used as index samples. Other Irish samples were used in technique development. Ninety-one enzyme loci were resolved, including 21 not previously screened in S. salar. Thirteen loci were found to be variable, including three novel polymorphic loci (EST-5*, FBALD-3* and TPI-3*). Two novel alleles (sAAT-1,2*130 and sAAT-3*83) were also detected. Levels of variability were lowest in the Spanish sample. The farmed strain had levels of H_ and __ lower than those in the two other wild samples. Mean levels of __ and __ were higher than those reported previously in studies that used a smaller number of loci but confirm S. salar as one of the less variable salmonids. Nine of the 13 variable loci showed significant population differentiation, the most discriminatory being mMEP-2*. The discriminatory power of the novel variable loci was in the middle of the range of those of the other loci. D_ values reflected the relative geographical locations from which the samples originated. There were significant clines in allele frequencies at mMEP-2* and TPI-3*. Fourteen enzyme loci including six variable loci were resolved in adipose fin.''',
            '054-102-097-127-40X': '''The native species of Caspian brown trout (Salmo trutta caspius, Kessler1877) is an important candidate for introducing to the aquaculture industry because of carcass quality and marketing in Iran. In introducing any species, it is necessary to complete the domestication stages. The most important advantages of domestication are controlling the costs and the biological and non-biological factors include environmental and social aspects in order to economize this activity and interaction between genetics and environment in breeding program, must be considered. A survey of the activity duration of the 43 Caspian brown trout farms showed the biggest challenge is the lack of sustainability. For this research, two questionnaires were designed. In first questionnaire, 16 professionals and experienced people were asked to determine the most important environmental and management factors affecting on the sustainability of this activity who completed the list and rated each of the factors. Water temperature factor with 13.15% and water debi with 7.03% obtained highest and lowest scores. Then second questionnaire was prepared including farm characteristics based on the first questionnaire results and was sent to 43 farms. Finally, 26 completed forms were received from the farmers. For scientific evaluation of the results, the variance multivariate analysis, Pillai,s Trace, LambadaWilk,s, Hotelling,s Trace, Roy,s largest root and Helmert Contrast tests were performed using spss16 software. The result showed, there was significant reciprocal correlation (p<0.01) between all groups of dependent variables, except for water debi and the weight of fry at the beginning of aquaculture (p>0.01), Also minimum temperature and aeriation system factors had significant main effect on activity duration (p<0.01). In the Helmert Contrast comparison statistic, there was significant correlation between 4 years of experiences group and rest groups for minimum temperature factor (p<0.01). The results of this study can be used by aquaculture planners to select appropriate environmental and management conditions for sustainable production of this activity.''',
            '175-405-800-730-637': '''The aim of the present study is to investigate the growth performance and sexual maturation process of female rainbow trout reared in a cage in the Caspian Sea (Mazandaran- Nowshahr). Rainbow trout with an average weight of 122± 5 g were stocked into a cage located in Caspian Sea. Fish were fed daily and random sampling was done monthly (January 2015) to May 2016. Weight and length of thirty fish were measured; their gonad and liver were weighted; total length, total weight, liver and gonad weight, condition factor, GSI and HSI and oocyte diameter were calculated; their blood samples were collected and the levels of 17 beta estradiol, testosterone, progesterone and the vitellogenin were measured; also gonad tissue samples were prepared and examined using a light microscope. The results showed optimal somatic and gonadal growth of fish caged in the Caspian Sea. Sex hormones and vitellogenin levels increased significantly (P<0.01) during the study period. The levels of 17 beta estradiol, testosterone and progesterone in January were 0.56± 0.05 ngml-1, 0.50± 0.05 ngml-1and 0.14± 0.01 ngml-1 respectively and reach to 1.63± 0.13 ngml-1, 0.80± 0.01 ngml-1 and 0.28± 0.03 ngml-1 in May, respectively. Vitellogenin levels increased from 382.40± 55.26 ngml-1 in January to 651.40± 86.34 ngml-1 in May. The gonads developed to stage 4 and the oocyte diameter increased significantly (P<0.01) during the study period. The findings of present study show that female rainbow trout are able to have appropriate somatic growth in the brackish water of the Caspian Sea like fresh water, and the natural process of sexual maturation wonÕt be disturbed.''',
            '011-321-751-873-475': '''The aim of the present study was to investigate the sexual maturation process and changes in some immune parameters of female rainbow trout reared in a cage in the Caspian Sea. All-female fish with an average weight of 122±5 g were prepared from a local farm and released into a cage. Fish were fed daily. Blood samples were collected from 5 fish randomly once a month from January 2015 to May 2016. The levels of 17 _-estradiol, testosterone, progesterone, melatonin, vitellogenin, calcium, lysozyme, and immunoglobulin M (IgM) were measured. Water quality parameters were also measured daily. The results showed that the levels of sex hormones gradually increased over time. Also, an increase in the amount of vitellogenin (from 382.40±55.26 ng.ml-1 in January to 686.40±86.34 ng.ml-1 in May) and calcium ion (from 12.84±1.42 mg. dl-1 in January to 19.04±1.55 mg. dl-1 in May) was observed (p<0.01). However, melatonin levels decreased from January (294.20±16.89 ngl-1) to May (175.00±17.54 ng. l-1) (p<0.01). Immune parameters (Lysozyme and IgM) changes were similar and the highest levels were observed in March, which was significantly higher than other months (p<0.01). The findings suggest that female Rainbow trout are under normal sexual maturity process in the Caspian Sea like freshwater resources.''',
            '018-133-835-588-133': '''Reports on a study on the prevalence of epitheliocystis in Atlantic salmon farmed in Tasmania. Background of epitheliocystis; Description of the four sea farms surveyed in Tasmania; Method of the study; Results and discussion.''',
            '185-977-222-006-132': '''In a shallow unstressed marine environment organic matter deposited on the sea bed is broken down by benthic protozoan, macrofaunal, meiofaunal and microbial communities. Fish farming, however, has the potential to upset the natural rates of decomposition because excessive loadings of fish food and faeces on the bottom can result in oxygen depletion and associated detrimental effects on the sediment ecosystem. The effects of organic matter build up around salmon farms have been well documented (eg Gowen, 1991; Wu, 1995; Black et al., 1996). When the oxygen supply is limited, sulphate-reducing and methanogenic bacteria dominate, leading to the production of toxic substances. These products, hydrogen sulphide and methane or their derivatives, can decimate the marine fauna and flora and severely affect the health of cultured fish. Such deleterious effects on the sediment ecosystem can be avoided by good farming practises, whereby organic wastes, in particular waste foods, are reduced to a minimum and the cages of fish are removed before the sediment becomes too degraded.
In Tasmania, farming of Atlantic salmon (Salmo salar L) has developed quickly since the first trials in 1985. Production in 1996 was estimated at 6,000 metric tons and rose to approximately 10,000 tons by 2000. The Tasmanian state government, the aquaculture industry and communities living in salmon farming areas have all recognised the need to monitor the environment around salmon farms to ensure that the industry develops in an ecologically sustainable manner. Meetings between these stakeholders were held to develop an industry-wide environmental monitoring program for salmon farms. At these meetings there was considerable debate over which and how often environmental parameters should be monitored. Industry was concerned about the cost-effectiveness and usefulness of monitoring several environmental variables, in particular benthic biota and redox. As a consequence of these discussions, it was agreed that research would be conducted to develop an environmental monitoring program for salmon farming in Tasmania.''',
            '155-385-215-296-509': '''Critical control points for reducing contamination by Listeria monocytogenes of products and fish meat derived from Atlantic salmon are discussed.''',
            '117-011-361-103-731': '''Using measurements of plasma melatonin to assess how photoperiod is perceived by fish, a study was made of the mechanisms by which additional night-time illumination in sea cages reduces early maturation and increases growth in farmed Atlantic salmon. Grilse maturation in salmon maintained on constant light (LL) from November to July was reduced from 63% to 6% and growth was increased by 30%. A reduction in dark phase plasma melatonin levels from 600.0 plus or minus 53.0 pg/ml to 303.1 plus or minus 6.3 pg/ml was also observed and it is suggested that a reduction in the amplitude of dark phase plasma melatonin below a putative threshold level mediates the effect of the additional lights on the reproductive axis.''',
            '056-860-204-153-36X': '''¥ Optimise PCR conditions to incorporate a PCR protection system to prevent false positive reactions arising from DNA contamination.¥ Develop a test procedure based on enzyme hybridization assay (EHA) that will verify any positive PCR reactions using a secondary confirmatory gene probe and in a format suitable for testing multiple samples.¥ Optimise the culture conditions and PCR detection process to ensure the minimum test time between sample collection and test result.¥ Test populations of salmonids with the optimised SEC-PCR-EHA system to verify test performance and obtain baseline data on carrier prevalence.'''
          }

          def norm(s):
              s = '' if s is None else str(s)
              return re.sub(r'\s+', ' ', unicodedata.normalize('NFKC', s)).strip().casefold()

          lines=[]
          matched=set()
          nonblank=0
          blank=0
          with src.open('r', encoding='utf-8') as fh:
              for line in fh:
                  if not line.strip():
                      continue
                  rec=json.loads(line)
                  lid=rec.get('lens_id') or rec.get('id') or ''
                  if lid in affected:
                      can=rec.get('canonical') or {}
                      title=can.get('title') or ''
                      old=can.get('abstract') or ''
                      if not title or not old or norm(title) != norm(old):
                          raise RuntimeError(f'Guard failed for {lid}: current abstract is not title')
                      new=repairs.get(lid, '')
                      can['abstract']=new
                      rec['canonical']=can
                      prov=rec.setdefault('provenance', {})
                      hist=prov.setdefault('title_equals_abstract_repair', [])
                      if not isinstance(hist, list):
                          hist=[hist]
                          prov['title_equals_abstract_repair']=hist
                      hist.append({
                          'date':'2026-09-01',
                          'reason':'Erroneous canonical abstract duplicated title',
                          'action':'replace_with_user_recovered_abstract' if new.strip() else 'clear_abstract_no_available_abstract',
                          'source':'user-supplied title_equals_abstract_with_doi(1).csv',
                          'review_context':'title=abstract canonical integrity audit'
                      })
                      matched.add(lid)
                      if new.strip(): nonblank += 1
                      else: blank += 1
                  lines.append(json.dumps(rec, ensure_ascii=False, separators=(',', ':')))

          missing=affected-matched
          if missing:
              raise RuntimeError(f'Missing affected Lens IDs: {sorted(missing)}')
          if len(matched)!=28 or nonblank!=10 or blank!=18:
              raise RuntimeError(f'Unexpected counts matched={len(matched)} nonblank={nonblank} blank={blank}')

          src.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(json.dumps({'matched':len(matched),'repaired_with_abstract':nonblank,'cleared_to_blank':blank}, indent=2))

      - name: Verify no title=abstract remains among repaired records
        shell: python
        run: |
          import json, re, unicodedata
          from pathlib import Path
          p=Path('data/canonical/current/repair/records.jsonl')
          def norm(s):
              s='' if s is None else str(s)
              return re.sub(r'\s+',' ',unicodedata.normalize('NFKC',s)).strip().casefold()
          bad=[]
          for line in p.open(encoding='utf-8'):
              if not line.strip(): continue
              r=json.loads(line); c=r.get('canonical') or {}
              t=c.get('title') or ''; a=c.get('abstract') or ''
              if t and a and norm(t)==norm(a): bad.append(r.get('lens_id') or r.get('id'))
          print('remaining_title_equals_abstract=',len(bad))
          if bad: raise RuntimeError(f'Remaining title=abstract records: {bad}')

      - name: Commit and push canonical repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canonical/current/repair/records.jsonl
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Repair 28 title-equals-abstract canonical records"
          git push origin HEAD:canonical-repair-store
