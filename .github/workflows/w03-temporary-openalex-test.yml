name: W03 temporary OpenAlex integration test
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w03-temporary-openalex-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","httr2","digest"))
      - name: Prepare DOI and title fixtures
        shell: Rscript {0}
        run: |
          library(jsonlite)
          t <- file.path(Sys.getenv("RUNNER_TEMP"),"w03-openalex")
          dir.create(t,recursive=TRUE,showWarnings=FALSE)
          records <- list(
            list(identity=list(record_id="doi-normal"),canonical=list(doi="10.1038/nature12373",title="Ordinary article"),manifestation_refs=list()),
            list(identity=list(record_id="doi-retracted-title"),canonical=list(doi="10.1038/nature12373",title="Retraction: Ordinary article"),manifestation_refs=list()),
            list(identity=list(record_id="doi-correction-title"),canonical=list(doi="10.1038/nature12373",title="Correction: Ordinary article"),manifestation_refs=list()),
            list(identity=list(record_id="no-doi"),canonical=list(doi=NULL,title="Ordinary non-indexed report"),manifestation_refs=list())
          )
          writeLines(vapply(records,function(r)toJSON(r,auto_unbox=TRUE,null="null"),character(1)),file.path(t,"input.jsonl"))
      - name: Run live OpenAlex DOI lookup and publication status
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/w03-openalex"
          Rscript scripts/updater/workflow_03_publication_status.R --input "$T/input.jsonl" --output "$T/output.jsonl" --audit "$T/audit.jsonl" --report "$T/report.json" --batch-size 2
          Rscript -e 'library(jsonlite);t<-commandArgs(TRUE)[1];r<-lapply(readLines(file.path(t,"output.jsonl")),fromJSON,simplifyVector=FALSE);names(r)<-vapply(r,function(z)z$record_id,character(1));report<-fromJSON(file.path(t,"report.json"));stopifnot(report$status=="PASS",report$records_scanned==4L,report$openalex_lookup$found==3L,r[["doi-retracted-title"]]$publication_status$code=="retracted",isTRUE(r[["doi-retracted-title"]]$publication_status$exclude_from_workflow04),r[["doi-correction-title"]]$publication_status$code %in% c("corrected","retracted"),r[["no-doi"]]$publication_status$code=="normal",identical(r[["no-doi"]]$publication_status$lookup$status,"unavailable"),!isTRUE(r[["no-doi"]]$publication_status$exclude_from_workflow04));cat("PASS: live OpenAlex match, retraction precedence and unindexed-record handling\n")' "$T"
      - name: Check OpenAlex failure is never silently treated as successful
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'report$status <- "FAIL_PROVIDER_ERRORS"' scripts/updater/workflow_03_publication_status.R
          grep -q 'if(technical_lookup_errors>0L)' scripts/updater/workflow_03_publication_status.R
          echo "PASS: technical failures are configured to block completion (static check)"
