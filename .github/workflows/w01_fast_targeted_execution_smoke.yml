name: W01-Fast frozen Shiny return checksum acceptance
on:
  push:
    branches: [w01-fast-direct-delta]
    paths: ['.github/workflows/w01_fast_targeted_execution_smoke.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-direct-delta
          persist-credentials: false
      - name: Install R and dependencies from Ubuntu packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends r-base-core r-cran-data.table r-cran-jsonlite r-cran-digest
          Rscript -e 'stopifnot(requireNamespace("data.table",quietly=TRUE),requireNamespace("jsonlite",quietly=TRUE),requireNamespace("digest",quietly=TRUE));cat(R.version.string,"\\n")'
      - name: Verify actual Fast execution wiring
        run: |
          python3 scripts/updater/experimental_w01_fast/test_routing_contract.py
          python3 scripts/updater/experimental_w01_fast/test_verified_return_workflow.py
      - name: Exercise Fast persistence staging using small fixtures
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'invisible(lapply(c("scripts/updater/experimental_w01_fast/identify_affected_works.R","scripts/updater/experimental_w01_fast/recombine_canonical_jsonl.R","scripts/updater/experimental_w01_fast/filter_canonical_directives.R","scripts/updater/experimental_w01_fast/run_full_incremental_update.R","scripts/updater/experimental_w01_fast/resume_review_decisions.R"),parse)); cat("PASS: all integration R files parse\\n")' > /dev/null
          Rscript scripts/updater/experimental_w01_fast/test_shiny_return_ingestion.R
          Rscript scripts/updater/experimental_w01_fast/test_shiny_queue_handoff.R
          Rscript scripts/updater/experimental_w01_fast/test_human_repair_merge.R
          Rscript -e 'parse(file="scripts/updater/experimental_w01_fast/test_direct_repair_delta_replay.R")' > /dev/null
          Rscript -e 'parse(file="scripts/updater/experimental_w01_fast/test_complete_reviewed_continuation.R")' > /dev/null
          Rscript scripts/updater/experimental_w01_fast/test_complete_reviewed_continuation.R
          Rscript scripts/updater/experimental_w01_fast/test_canonical_repair_application.R
          Rscript scripts/updater/experimental_w01_fast/test_direct_repair_delta_replay.R
          Rscript scripts/updater/experimental_w01_fast/test_filter_canonical_directives.R
          Rscript scripts/updater/experimental_w01_fast/test_repair_affected_works.R
          Rscript scripts/updater/experimental_w01_fast/test_human_summary.R
          Rscript scripts/updater/experimental_w01_fast/test_production_pair_ledger.R
          Rscript scripts/updater/experimental_w01_fast/test_production_canonical_contract.R
      - name: Reject invalid Fast command input before any mutation
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          if Rscript scripts/updater/experimental_w01_fast/run_full_incremental_update.R \
             --delta-writer direct --metadata "$root/missing_metadata.csv" \
             --prior-map "$root/missing_prior.csv" --previous-decisions "$root/missing_decisions.csv" \
             --source-manifest "$root/missing_sources.json" --current-seed-root "$root/no_seed" \
             --prior-canonical "$root/no_canonical.jsonl" --previous-root "$root/no_previous" \
             --previous-pointer "$root/no_pointer.json" --strip-actions "$root/no_strips.jsonl" \
             --repairs "$root/no_repairs.jsonl" --output-dir "$root/output"; then
            echo 'FAIL: Fast accepted missing source provenance' >&2
            exit 1
          fi
          test ! -e "$root/output"
          echo 'PASS: Fast rejects missing authoritative inputs without creating output'
