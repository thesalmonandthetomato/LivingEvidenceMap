name: W00 MVP count-only preflight

on:
  workflow_dispatch:
    inputs:
      source:
        description: Single source; no record harvesting
        required: true
        type: choice
        options:
          - openalex
          - pubmed

permissions:
  contents: read

jobs:
  count-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','httr2','xml2'))
      - name: Validate and translate actual W00 search configuration
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_validate_search_strategy.R --config user_input/workflow00_search_strategy.json
          Rscript scripts/updater/workflow_00_search_orchestrator.R \
            --run-type full \
            --config user_input/workflow00_search_strategy.json \
            --output-dir outputs/w00_count_preflight/plan
          test -s outputs/w00_count_preflight/plan/search_plan.json
      - name: Query one API for count only
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
          SELECTED_SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/w00_count_preflight/counts
          Rscript scripts/updater/workflow_00_search_scope_counts.R \
            --plan outputs/w00_count_preflight/plan/search_plan.json \
            --ebsco-config config/workflow00_ebsco_sources.json \
            --source "$SELECTED_SOURCE" \
            --output-csv "outputs/w00_count_preflight/counts/${SELECTED_SOURCE}.csv" \
            --output-json "outputs/w00_count_preflight/counts/${SELECTED_SOURCE}.json"
          cat "outputs/w00_count_preflight/counts/${SELECTED_SOURCE}.csv" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: w00-mvp-count-${{ inputs.source }}-${{ github.run_id }}
          path: outputs/w00_count_preflight/
          retention-days: 7
          if-no-files-found: error
