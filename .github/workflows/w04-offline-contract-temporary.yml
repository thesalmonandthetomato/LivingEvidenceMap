name: Temporary W04 offline finalisation contract
on:
  push:
    paths:
      - '.github/workflows/w04-offline-contract-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install minimal R dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))
      - name: Test real W04 merge and W05 materialisation without network or API calls
        run: Rscript tests/test_w04_reconciled_offline_handoff.R
