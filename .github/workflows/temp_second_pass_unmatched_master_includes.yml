name: Temporary second-pass unmatched master include audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp_second_pass_unmatched_master_includes.yml'
      - 'scripts/temporary/second_pass_unmatched_master_includes.R'
      - 'scripts/temporary/third_pass_unmatched_master_includes.R'
      - 'scripts/temporary/fourth_pass_identity_recovery.R'
      - 'scripts/temporary/fifth_pass_trace_historical_lens_ids.R'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRESH_CANONICAL_BRANCH: canonical-fresh-2026-09-08-v1
      SCREENING_SOURCE_REPO: thesalmonandthetomato/scoping_review
      SCREENING_SOURCE_COMMIT: 1116ced4acece0575fca763e856cc968b6e5785b
    steps:
      - name: Checkout workflow and historical master
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Checkout immutable historical screening source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCREENING_SOURCE_REPO }}
          ref: ${{ env.SCREENING_SOURCE_COMMIT }}
          path: screening_source
          lfs: true

      - name: Checkout canonical publication-status-screened store
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FRESH_CANONICAL_BRANCH }}
          path: canonical_store
          lfs: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: install.packages(c('jsonlite','data.table','stringdist','digest'))
        shell: Rscript {0}

      - name: Validate canonical stage
        shell: Rscript {0}
        run: |
          library(jsonlite)
          m <- fromJSON('canonical_store/data/canonical/current/repair/manifest.json')
          stopifnot(identical(m$pipeline_stage, 'publication_status_screened'))
          rp <- 'canonical_store/data/canonical/current/repair/records.jsonl'
          stopifnot(file.exists(rp), file.info(rp)$size > 100000000)
          cat(sprintf('PASS: canonical stage validated; records size %.1f MB\n', file.info(rp)$size/1e6))

      - name: Recreate first-pass reconciliation audit
        run: |
          set -euo pipefail
          mkdir -p outputs/historical_reconciliation
          Rscript scripts/temporary/historical_screening_reconciliation.R \
            --master data/master/current/living_evidence_map_master.csv \
            --canonical canonical_store/data/canonical/current/repair/records.jsonl \
            --includes-ris screening_source/screening/INCLUDES.ris \
            --excludes-ris screening_source/screening/EXCLUDES.ris \
            --outdir outputs/historical_reconciliation \
            --checkpoint-every 1000
        shell: bash

      - name: Run second-pass unmatched INCLUDE matching
        run: |
          Rscript scripts/temporary/second_pass_unmatched_master_includes.R \
            --canonical=canonical_store/data/canonical/current/repair/records.jsonl \
            --unmatched=outputs/historical_reconciliation/unmatched_historical_records.jsonl \
            --matched=outputs/historical_reconciliation/matched_records.jsonl \
            --outdir=outputs/second_pass_unmatched_includes
        shell: bash

      - name: Validate second-pass audit-only outputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON('outputs/second_pass_unmatched_includes/summary.json')
          stopifnot(s$audit_only, !s$canonical_modified, s$targets == 690)
          stopifnot(s$high_confidence_matches + s$ambiguous_for_review + s$still_unmatched == 690)
          stopifnot(s$still_unmatched == 609)
          cat(toJSON(s, auto_unbox=TRUE, pretty=TRUE), '\n')
          cat('PASS: second-pass output cardinality and audit-only invariants validated\n')

      - name: Run third-pass abstract-first unmatched INCLUDE matching
        run: |
          Rscript scripts/temporary/third_pass_unmatched_master_includes.R \
            --canonical=canonical_store/data/canonical/current/repair/records.jsonl \
            --still=outputs/second_pass_unmatched_includes/still_unmatched.jsonl \
            --outdir=outputs/third_pass_unmatched_includes
        shell: bash

      - name: Validate third-pass audit-only outputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON('outputs/third_pass_unmatched_includes/summary.json')
          stopifnot(s$audit_only, !s$canonical_modified, s$targets == 609)
          stopifnot(s$high_confidence_matches + s$review_candidates + s$still_unmatched == 609)
          cat(toJSON(s, auto_unbox=TRUE, pretty=TRUE), '\n')
          cat('PASS: third-pass output cardinality and audit-only invariants validated\n')

      - name: Run fourth-pass Lens ID and DOI recovery
        run: |
          Rscript scripts/temporary/fourth_pass_identity_recovery.R \
            --canonical=canonical_store/data/canonical/current/repair/records.jsonl \
            --still=outputs/third_pass_unmatched_includes/still_unmatched.jsonl \
            --outdir=outputs/fourth_pass_identity_recovery
        shell: bash

      - name: Validate fourth-pass audit-only outputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON('outputs/fourth_pass_identity_recovery/summary.json')
          stopifnot(s$audit_only, !s$canonical_modified, s$targets == 607)
          stopifnot(s$unique_identity_matches + s$ambiguous_identity_matches + s$still_unmatched == 607)
          cat(toJSON(s, auto_unbox=TRUE, pretty=TRUE), '\n')
          cat('PASS: fourth-pass identity audit cardinality and audit-only invariants validated\n')

      - name: Materialize canonical stage snapshots for Lens-ID trace
        run: |
          set -euo pipefail
          mkdir -p outputs/canonical_stage_snapshots
          STAGES=(
            "workflow00:323b631925479212bb4863461bf62847451d0546"
            "abstract_enriched:5e6e850d7ca2be51d4818c494b5e2889b40780cc"
            "deduplicated:9230802aab1ef1a445087c42c5813d6d23b955db"
            "publication_status:3943ce56277eb5ef1484b33737087dba000fdc09"
          )
          for item in "${STAGES[@]}"; do
            name="${item%%:*}"
            sha="${item##*:}"
            git -C canonical_store fetch --no-tags origin "$sha"
            git -C canonical_store lfs fetch origin "$sha" --include="data/canonical/current/repair/records.jsonl"
            git -C canonical_store show "$sha:data/canonical/current/repair/records.jsonl" | git -C canonical_store lfs smudge > "outputs/canonical_stage_snapshots/${name}.jsonl"
            test -s "outputs/canonical_stage_snapshots/${name}.jsonl"
            echo "PASS: materialized $name at $sha ($(wc -l < "outputs/canonical_stage_snapshots/${name}.jsonl") lines)"
          done
        shell: bash

      - name: Run fifth-pass historical Lens-ID stage trace
        run: |
          Rscript scripts/temporary/fifth_pass_trace_historical_lens_ids.R \
            --residual=outputs/fourth_pass_identity_recovery/still_unmatched.jsonl \
            --historical-root=screening_source \
            --stage00=outputs/canonical_stage_snapshots/workflow00.jsonl \
            --enriched=outputs/canonical_stage_snapshots/abstract_enriched.jsonl \
            --dedup=outputs/canonical_stage_snapshots/deduplicated.jsonl \
            --publication=outputs/canonical_stage_snapshots/publication_status.jsonl \
            --outdir=outputs/fifth_pass_trace
        shell: bash

      - name: Validate fifth-pass trace
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON('outputs/fifth_pass_trace/summary.json')
          stopifnot(s$audit_only, !s$canonical_modified)
          stopifnot(s$residual_input == 607, s$manual_excluded_ignored == 321)
          stopifnot(s$relevance_review_set == 286, s$lens_id_trace_targets == 262, s$no_lens_id_in_review_set == 24)
          stopifnot(sum(unlist(s$earliest_loss_counts)) == 262)
          cat(toJSON(s, auto_unbox=TRUE, pretty=TRUE), '\n')
          cat('PASS: fifth-pass trace invariants validated\n')

      - name: Confirm canonical working tree unchanged
        run: |
          set -euo pipefail
          if ! git -C canonical_store diff --quiet || ! git -C canonical_store diff --cached --quiet; then
            echo "ERROR: canonical working tree modified"
            git -C canonical_store status --short
            exit 1
          fi
          echo "PASS: canonical working tree unchanged"
        shell: bash

      - name: Upload second-pass audit artefacts
        uses: actions/upload-artifact@v4
        with:
          name: second-pass-unmatched-master-includes-${{ github.run_id }}
          path: outputs/second_pass_unmatched_includes/
          retention-days: 90
          if-no-files-found: error

      - name: Upload third-pass audit artefacts
        uses: actions/upload-artifact@v4
        with:
          name: third-pass-unmatched-master-includes-${{ github.run_id }}
          path: outputs/third_pass_unmatched_includes/
          retention-days: 90
          if-no-files-found: error

      - name: Upload fourth-pass audit artefacts
        uses: actions/upload-artifact@v4
        with:
          name: fourth-pass-identity-recovery-${{ github.run_id }}
          path: outputs/fourth_pass_identity_recovery/
          retention-days: 90
          if-no-files-found: error

      - name: Upload fifth-pass trace artefacts
        uses: actions/upload-artifact@v4
        with:
          name: fifth-pass-historical-lens-id-trace-${{ github.run_id }}
          path: outputs/fifth_pass_trace/
          retention-days: 90
          if-no-files-found: error
