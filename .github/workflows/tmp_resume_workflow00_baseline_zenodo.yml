name: Workflow 00 - Resume failed baseline Zenodo backfill

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - '.github/workflows/tmp_resume_workflow00_baseline_zenodo.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Workflow 00 branch
        uses: actions/checkout@v4
        with:
          ref: workflow00-search-orchestrator
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install archive dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Download preserved failed-backfill bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          gh run download 35883526007 --repo "$GITHUB_REPOSITORY" \
            --name workflow00-baseline-zenodo-backfill-35883526007 \
            --dir recovered
          test -d recovered/35730574878/zenodo_output/archive_files
          test -n "$(find recovered/35730574878/zenodo_output/archive_files -type f -print -quit)"

      - name: Resume Lens OpenAlex WoS Zenodo draft
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_resume_zenodo_draft.R \
            --archive-dir recovered/35730574878/zenodo_output/archive_files \
            --deposition-id 22921060 \
            --output-dir recovered/35730574878/resumed

          Rscript scripts/updater/workflow_00_update_zenodo_registry.R \
            --receipt recovered/35730574878/resumed/zenodo_receipt.json \
            --registry docs/search_record/zenodo_registry.csv \
            --pointer-dir docs/search_record/zenodo

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/search_record/zenodo_registry.csv docs/search_record/zenodo/run-35730574878.json
          git commit -m "Register Zenodo archive for Workflow 00 run 35730574878"
          git pull --rebase origin workflow00-search-orchestrator
          git push origin HEAD:workflow00-search-orchestrator

      - name: Archive Scopus baseline search
        env:
          GH_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=35731899007
          root="scopus_backfill"
          mkdir -p "$root/zenodo_staging/plan" "$root/zenodo_staging/harvests/scopus" "$root/zenodo_staging/search_records/scopus"

          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "workflow00-search-plan-$run_id" \
            --dir "$root/zenodo_staging/plan"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "workflow00-scopus-harvest-$run_id" \
            --dir "$root/zenodo_staging/harvests/scopus"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "workflow00-search-record-scopus-$run_id" \
            --dir "$root/zenodo_staging/search_records/scopus"

          plan="$(find "$root/zenodo_staging/plan" -name search_plan.json -type f -print -quit)"
          test -n "$plan"
          run_type="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1],simplifyVector=FALSE); cat(if(is.null(x$run_type)) "full" else x$run_type)' "$plan")"
          search_version="$(Rscript -e 'x<-jsonlite::fromJSON(commandArgs(TRUE)[1],simplifyVector=FALSE); cat(if(is.null(x$search_version)) "unknown" else x$search_version)' "$plan")"

          Rscript scripts/updater/workflow_00_archive_to_zenodo.R \
            --staging-root "$root/zenodo_staging" \
            --run-id "$run_id" \
            --run-type "$run_type" \
            --search-version "$search_version" \
            --sources scopus \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$root/zenodo_output"

          Rscript scripts/updater/workflow_00_update_zenodo_registry.R \
            --receipt "$root/zenodo_output/zenodo_receipt.json" \
            --registry docs/search_record/zenodo_registry.csv \
            --pointer-dir docs/search_record/zenodo

          git add docs/search_record/zenodo_registry.csv docs/search_record/zenodo/run-35731899007.json
          git commit -m "Register Zenodo archive for Workflow 00 run 35731899007"
          git pull --rebase origin workflow00-search-orchestrator
          git push origin HEAD:workflow00-search-orchestrator

      - name: Preserve resume receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-baseline-zenodo-resume-${{ github.run_id }}
          path: |
            recovered/35730574878/resumed/
            scopus_backfill/zenodo_output/
          retention-days: 7
          if-no-files-found: warn
