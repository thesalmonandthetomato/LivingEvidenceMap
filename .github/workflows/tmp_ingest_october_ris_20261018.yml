name: Temporary ingest October RIS expansion drafts
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_ingest_october_ris_20261018.yml]
permissions: {contents: read}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: workflow01-final-architecture}
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: release, use-public-rspm: true}
      - run: Rscript -e 'install.packages(c("httr2","jsonlite","digest"))'
      - name: Validate both new draft archives before any modification
        shell: bash
        run: |
          set -euo pipefail
          for src in cab proquest; do
            case "$src" in
              cab) registry=user_input/workflow00_ris_cab_mariculture_2026-10-18.json ;;
              proquest) registry=user_input/workflow00_ris_proquest_mariculture_2026-10-18.json ;;
            esac
            Rscript scripts/updater/workflow_00_complete_ris_zenodo_draft.R --registry "$registry" --validate-only true --output-dir "outputs/manual/$src"
          done
      - name: Complete both validated restricted Zenodo drafts
        shell: bash
        run: |
          set -euo pipefail
          for src in cab proquest; do
            case "$src" in
              cab) registry=user_input/workflow00_ris_cab_mariculture_2026-10-18.json ;;
              proquest) registry=user_input/workflow00_ris_proquest_mariculture_2026-10-18.json ;;
            esac
            Rscript scripts/updater/workflow_00_complete_ris_zenodo_draft.R --registry "$registry" --validate-only false --output-dir "outputs/completed/$src"
          done
      - name: Publish completed restricted archives
        shell: bash
        run: |
          set -euo pipefail
          for src in cab proquest; do
            case "$src" in
              cab) registry=user_input/workflow00_ris_cab_mariculture_2026-10-18.json ;;
              proquest) registry=user_input/workflow00_ris_proquest_mariculture_2026-10-18.json ;;
            esac
            Rscript scripts/updater/workflow_00_publish_ris_zenodo_record.R --registry "$registry" --output-dir "outputs/published/$src"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: october-ris-ingestion-${{ github.run_id }}
          path: |
            outputs/manual/
            outputs/completed/
            outputs/published/
          retention-days: 7
