name: Workflow 04 - Validate human validation queue builder

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'scripts/updater/workflow_04_build_human_validation_queue.R'
      - '.github/workflows/workflow_04_validate_human_validation_queue.yml'
      - '.github/workflows/shiny-adjudication-publish-w04-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))

      - name: Parse W04 validation builder
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_04_build_human_validation_queue.R')
          parse(file='scripts/updater/workflow_04_merge_incremental.R')
          cat('PASS: W04 validation queue builder and merge script parse\n')

      - name: Build synthetic canonical and W03 fixtures
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create('tmp/w04val',recursive=TRUE,showWarnings=FALSE)

          rows <- lapply(1:6,function(i) list(
            identity=list(record_id=paste0('rec-',i)),
            canonical=list(
              title=paste('Title',i),
              abstract=paste('Abstract text',i),
              authors=paste('Author',i),
              year=as.character(2000+i),
              journal=paste('Journal',i),
              volume=as.character(i),
              pages=paste0(i,'-',i+5),
              doi=paste0('10.1/',i),
              keywords=c('salmon','aquaculture')
            )
          ))
          con<-file('tmp/w04val/canonical.jsonl','wt')
          for(z in rows)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con)
          close(con)

          w03 <- lapply(1:6,function(i) list(
            record_id=paste0('rec-',i),
            publication_status=list(exclude_from_workflow04=identical(i,6L))
          ))
          con<-file('tmp/w04val/w03.jsonl','wt')
          for(z in w03)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con)
          close(con)

          w04 <- lapply(1:5,function(i) {
            model_decision <- if(i%%2L)'retain' else 'exclude'
            if(i==1L) {
              list(
                record_id=paste0('rec-',i),
                screening=list(
                  decision='exclude',
                  decision_origin='historical_exclude_authoritative',
                  luna_consensus=list(
                    decision=model_decision,
                    screening_input_sha256=paste0('sha-',i)
                  ),
                  historical_override_applied=TRUE
                )
              )
            } else if(i==2L) {
              list(
                record_id=paste0('rec-',i),
                screening=list(
                  decision='retain',
                  decision_origin='human_adjudication_after_luna_uncertain',
                  screening_input_sha256=paste0('sha-',i)
                )
              )
            } else {
              list(
                record_id=paste0('rec-',i),
                screening=list(
                  decision=model_decision,
                  decision_origin='luna_consensus',
                  screening_input_sha256=paste0('sha-',i)
                )
              )
            }
          })
          con<-file('tmp/w04val/w04.jsonl','wt')
          for(z in w04)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con)
          close(con)

      - name: Validate deterministic random sample and bibliographic fields
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)

          run_builder <- function(out,seed) {
            status <- system2('Rscript',c(
              'scripts/updater/workflow_04_build_human_validation_queue.R',
              '--canonical','tmp/w04val/canonical.jsonl',
              '--workflow03-status','tmp/w04val/w03.jsonl',
              '--workflow04-layer','tmp/w04val/w04.jsonl',
              '--output-dir',out,
              '--sample-size','4',
              '--seed',seed
            ))
            stopifnot(status==0L)
          }

          run_builder('tmp/w04val/out1','fixed-seed')
          run_builder('tmp/w04val/out2','fixed-seed')
          run_builder('tmp/w04val/out3','different-seed')

          q1 <- readLines('tmp/w04val/out1/workflow04_validation_queue.jsonl')
          q2 <- readLines('tmp/w04val/out2/workflow04_validation_queue.jsonl')
          q3 <- readLines('tmp/w04val/out3/workflow04_validation_queue.jsonl')

          stopifnot(identical(q1,q2))
          stopifnot(length(q1)==4L)
          stopifnot(!identical(q1,q3))

          rows <- lapply(q1,fromJSON,simplifyVector=FALSE)
          ids <- vapply(rows,function(z)z$record_id,character(1))
          stopifnot(!'rec-6' %in% ids)
          stopifnot(!anyDuplicated(vapply(rows,function(z)z$review_case_id,character(1))))
          stopifnot(all(vapply(rows,function(z)is.null(z$model_decision),logical(1))))

          model_ref <- read.csv('tmp/w04val/out1/workflow04_validation_model_reference.csv',stringsAsFactors=FALSE)
          stopifnot(nrow(model_ref)==4L,setequal(model_ref$record_id,ids))
          stopifnot(all(model_ref$model_decision %in% c('retain','exclude','uncertain')))
          if('rec-1' %in% model_ref$record_id) {
            z <- model_ref[model_ref$record_id=='rec-1',,drop=FALSE]
            stopifnot(z$model_decision=='retain')
            stopifnot(z$final_decision=='exclude')
            stopifnot(z$model_decision_source=='screening.luna_consensus.decision')
          }
          if('rec-2' %in% model_ref$record_id) {
            z <- model_ref[model_ref$record_id=='rec-2',,drop=FALSE]
            stopifnot(z$model_decision=='uncertain')
            stopifnot(z$final_decision=='retain')
            stopifnot(z$model_decision_source=='decision_origin_implies_luna_uncertain')
          }

          for(z in rows) {
            b <- z$bibliographic
            stopifnot(
              nzchar(b$title),
              nzchar(b$abstract),
              nzchar(b$authors),
              nzchar(b$year),
              nzchar(b$journal),
              nzchar(b$volume),
              nzchar(b$pages),
              nzchar(b$doi)
            )
          }

          m <- fromJSON('tmp/w04val/out1/workflow04_validation_queue_manifest.json',simplifyVector=FALSE)
          stopifnot(
            m$sampled_records==4L,
            m$eligible_records==5L,
            identical(m$randomisation_seed,'fixed-seed'),
            identical(m$randomisation_method,'sha256(seed|record_id) ascending'),
            isFALSE(m$llm_outputs_exposed),
            grepl("^[0-9a-f]{64}$",m$model_reference_sha256)
          )

          cat('PASS: deterministic W04 randomisation, eligibility filtering, hidden model reference, and bibliographic fields validated\n')
