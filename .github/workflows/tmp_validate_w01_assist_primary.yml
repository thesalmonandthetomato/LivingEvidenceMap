name: TEMP validate W01 assist on primary

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w01_assist_primary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install parse dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite','stringdist','stringi'))

      - name: Parse assist scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_01_identifier_assist_build.R')
          parse(file='scripts/updater/workflow_01_identifier_prescore_collapse.R')
          parse(file='scripts/updater/workflow_01_identifier_inject_decisions.R')
          parse(file='scripts/updater/workflow_01_title_assist_resolve.R')
          cat('PASS: all four W01 assist scripts parse\n')

      - name: Validate guard registry
        shell: Rscript {0}
        run: |
          library(data.table)
          x <- fread('config/workflow01_identifier_never_auto_resolve.csv')
          stopifnot(all(c('identifier_type','identifier_value') %in% names(x)))
          stopifnot(nrow(x)==46L)
          stopifnot(sum(tolower(x$identifier_type)=='doi')==43L)
          stopifnot(sum(tolower(x$identifier_type)=='pmid')==3L)
          stopifnot(!anyDuplicated(paste(tolower(x$identifier_type),x$identifier_value,sep='::')))
          cat('PASS: guard registry contains exactly 46 unique identifiers (43 DOI, 3 PMID)\n')

      - name: Validate production wiring
        shell: bash
        run: |
          set -euo pipefail
          P=.github/workflows/workflow_01_production.yml

          grep -Fq -- "workflow_01_identifier_assist_build.R" "$P"
          grep -Fq -- "--guard-file config/workflow01_identifier_never_auto_resolve.csv" "$P"
          grep -Fq -- "workflow_01_identifier_prescore_collapse.R" "$P"
          grep -Fq -- "--input-dir outputs/workflow01_prescore" "$P"
          grep -Fq -- "workflow_01_identifier_inject_decisions.R" "$P"
          grep -Fq -- "workflow_01_title_assist_resolve.R" "$P"
          grep -Fq -- "--new-decisions outputs/workflow01_incremental_assisted/final_incremental_decisions.csv" "$P"
          grep -Fq -- "--incremental-rescore outputs/workflow01_incremental_assisted/final_incremental_decisions.csv" "$P"

          if grep -Fq -- "--new-decisions outputs/workflow01_incremental_rescore/rescored_sample.csv" "$P"; then
            echo "ERROR: production cluster merge still bypasses assist layers" >&2
            exit 1
          fi
          if grep -Fq -- "--incremental-rescore outputs/workflow01_incremental_rescore/rescored_sample.csv" "$P"; then
            echo "ERROR: checkpoint still stores pre-assist rescore decisions" >&2
            exit 1
          fi

          echo "PASS: production workflow uses validated assist path with no rescore bypass"

      - name: Require core W01 scripts unchanged from pre-transfer state
        shell: bash
        run: |
          set -euo pipefail
          PRE=d68b57de5ef1171d9f997e2cb14984ab428142ba
          for p in \
            scripts/updater/workflow_01_deduplication_build_union.R \
            scripts/updater/workflow_01_deduplication_incremental_candidates.R \
            scripts/updater/workflow_01_deduplication_incremental_score.R \
            scripts/updater/workflow_01_deduplication_identifier_rescore.R \
            scripts/updater/workflow_01_deduplication_merge_clusters.R
          do
            git show "$PRE:$p" > /tmp/pre
            cmp -s "$p" /tmp/pre || { echo "ERROR: core W01 changed since pre-transfer state: $p" >&2; exit 1; }
          done
          echo "PASS: all five core W01 scripts are unchanged from pre-transfer SHA"

      - name: Validate permanent documentation exists
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/deduplication/workflow01-identifier-title-assist.md
          grep -Fq -- "0/364 known unsafe/risky pairs merged after transitive closure" docs/deduplication/workflow01-identifier-title-assist.md
          grep -Fq -- "Historical old-old clusters therefore remain unchanged during ordinary updates." docs/deduplication/workflow01-identifier-title-assist.md
          echo "PASS: permanent architecture documentation is present"
