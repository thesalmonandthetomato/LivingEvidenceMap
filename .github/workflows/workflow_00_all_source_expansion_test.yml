name: Workflow 00 all-source expansion test

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/workflow_00_all_source_expansion_test.yml

permissions:
  contents: write
  actions: read

jobs:
  expansion-test:
    uses: ./.github/workflows/workflow_00_search_orchestrator.yml
    with:
      run_type: expansion
      lens: true
      scopus: true
      openalex: true
      agricola: true
      wos: true
      additional_farm_term: 'maricultur*'
      resume_run_id: ''
    secrets: inherit
