name: Zenodo full-text AI coding

on:
  workflow_dispatch:
    inputs:
      zenodo_record_id:
        description: "Optional starting Zenodo record ID; leave blank to process all uncompleted deposited records in order"
        required: false
        default: ""
      model:
        description: "OpenAI model"
        required: false
        default: "gpt-5.6-luna"

permissions:
  contents: write
  actions: read

concurrency:
  group: zenodo-fulltext-ai-coding
  cancel-in-progress: false

env:
  ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  FULLTEXT_CODING_MODEL: ${{ github.event.inputs.model || 'gpt-5.6-luna' }}
  PYTHONUNBUFFERED: "1"

jobs:
  sequential-zenodo-coding:
    runs-on: ubuntu-latest
    timeout-minutes: 2160
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preflight current coding contract
        run: |
          set -euo pipefail
          python scripts/fulltext_coding/preflight_coding_schema_v4.py \
            --schema scripts/fulltext_coding/coding_schema_v3.json \
            --validator scripts/fulltext_coding/validate_coding_output_v4.py \
            --prompt scripts/fulltext_coding/fulltext_coding_prompt_v3.txt
      - name: Process Zenodo records sequentially until stopped or exhausted
        env:
          ZENODO_RECORD_ID: ${{ github.event.inputs.zenodo_record_id || '' }}
        run: |
          set -euo pipefail
          mkdir -p work/annotations work/raw work/prepared
          python scripts/fulltext_coding/run_zenodo_fulltext_ai_coding.py
      - name: Upload current checkpoint state (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-fulltext-coding-checkpoint-${{ github.run_id }}
          path: |
            work/annotations/
            work/zenodo_archive
            data/fulltext_coding/coding_architecture.json
            data/fulltext_coding/cumulative_coding.json
          retention-days: 90
          if-no-files-found: warn
      - name: Upload cumulative coding JSON (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-fulltext-coding-cumulative-${{ github.run_id }}
          path: data/fulltext_coding/cumulative_coding.json
          retention-days: 90
          if-no-files-found: error
