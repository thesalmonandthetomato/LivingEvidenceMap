name: Zenodo full-text AI coding

on:
  workflow_dispatch:
    inputs:
      zenodo_record_id:
        description: "Zenodo record ID to process; leave blank to select the first unprocessed deposited record from the provenance registry"
        required: false
        default: ""
      model:
        description: "OpenAI model"
        required: false
        default: "gpt-5.6-luna"
      checkpoint_size:
        description: "Papers per durable coding checkpoint"
        required: false
        default: "10"
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: zenodo-fulltext-ai-coding
  cancel-in-progress: false

env:
  ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  FULLTEXT_CODING_MODEL: ${{ github.event.inputs.model || 'gpt-5.6-luna' }}
  PYTHONUNBUFFERED: "1"

jobs:
  code-one-zenodo-record:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight current coding contract
        run: |
          set -euo pipefail
          python scripts/fulltext_coding/preflight_coding_schema_v4.py \
            --schema scripts/fulltext_coding/coding_schema_v3.json \
            --validator scripts/fulltext_coding/validate_coding_output_v4.py \
            --prompt scripts/fulltext_coding/fulltext_coding_prompt_v3.txt

      - name: Select one Zenodo record and download its archive
        env:
          INPUT_RECORD_ID: ${{ github.event.inputs.zenodo_record_id || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/raw work/prepared work/annotations work/chunks
          python - <<'PY'
          import csv, json, os, urllib.request
          from pathlib import Path

          token=os.environ['ZENODO_ACCESS_TOKEN']
          requested=os.environ.get('INPUT_RECORD_ID','').strip()
          registry=Path('data/reference/fulltext_batch_registry.csv')
          architecture=Path('data/fulltext_coding/coding_architecture.json')

          rows=list(csv.DictReader(registry.open(encoding='utf-8-sig', newline='')))
          arch=json.loads(architecture.read_text(encoding='utf-8')) if architecture.exists() else {'records':{}}
          processed={k for k,v in arch.get('records',{}).items() if v.get('coding_status')=='completed'}

          record_to_rows={}
          for r in rows:
              rid=str(r.get('zenodo_record_id','')).strip()
              if rid:
                  record_to_rows.setdefault(rid,[]).append(r)

          if requested:
              record_id=requested
          else:
              candidates=[]
              for rid, rr in record_to_rows.items():
                  expected=[r for r in rr if str(r.get('status','')).strip().lower()=='deposited']
                  remaining=[r for r in expected if str(r.get('openalex_id','')).strip() not in processed]
                  if remaining:
                      candidates.append((int(rid) if rid.isdigit() else rid, rid, remaining))
              if not candidates:
                  raise SystemExit('No unprocessed deposited Zenodo record remains in fulltext_batch_registry.csv')
              candidates.sort(key=lambda x: x[0])
              record_id=candidates[0][1]

          req=urllib.request.Request(
              f'https://zenodo.org/api/records/{record_id}',
              headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r: data=json.load(r)

          expected_rows=record_to_rows.get(record_id,[])
          expected_names={str(r.get('zenodo_archive_filename','')).strip() for r in expected_rows if r.get('zenodo_archive_filename')}
          files=data.get('files',[])
          archive=None
          for f in files:
              if f.get('key') in expected_names:
                  archive=f; break
          if archive is None:
              zips=[f for f in files if str(f.get('key','')).lower().endswith(('.zip','.tar.gz','.tgz'))]
              if len(zips)==1: archive=zips[0]
          if archive is None:
              raise SystemExit(f'Could not uniquely identify the expected archive for Zenodo record {record_id}; files={[f.get("key") for f in files]}')

          url=archive.get('links',{}).get('self') or archive.get('links',{}).get('download')
          if not url: raise SystemExit('Zenodo archive has no download URL')
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
          with urllib.request.urlopen(req,timeout=600) as r: blob=r.read()
          Path('work/zenodo_archive').write_bytes(blob)
          Path('work/record_context.json').write_text(json.dumps({
              'zenodo_record_id':record_id,
              'zenodo_record_url':f'https://zenodo.org/records/{record_id}',
              'zenodo_archive_filename':archive.get('key'),
              'zenodo_version_doi':data.get('doi'),
              'zenodo_concept_doi':data.get('conceptdoi'),
              'expected_registry_rows':expected_rows
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'Processing Zenodo record {record_id}: {archive.get("key")}')
          print(f'Registry rows for record: {len(expected_rows)}')
          PY

      - name: Extract and prepare eligible TEI files
        run: |
          set -euo pipefail
          case "$(file -b work/zenodo_archive)" in
            *Zip*) unzip -q work/zenodo_archive -d work/raw ;;
            *gzip*) mkdir -p work/raw; tar -xzf work/zenodo_archive -C work/raw ;;
            *) echo "Unsupported Zenodo archive format"; exit 1 ;;
          esac
          python - <<'PY'
          import csv, json, re
          from pathlib import Path
          ctx=json.loads(Path('work/record_context.json').read_text())
          registry={str(r.get('openalex_id','')).strip():r for r in ctx.get('expected_registry_rows',[])}
          files=sorted(Path('work/raw').rglob('*.tei.xml'))
          if not files: raise SystemExit('No GROBID TEI/XML files found in Zenodo archive')
          selected=[]
          for p in files:
              wid=p.name.removesuffix('.tei.xml')
              r=registry.get(wid)
              if r is None:
                  # Filename is the primary expected OpenAlex key; do not silently code an unregistered file.
                  print(f'UNREGISTERED TEI FILE: {p.name}')
                  continue
              selected.append((p,r))
          if not selected: raise SystemExit('No TEI files in this Zenodo archive matched the provenance registry')
          for p,r in selected:
              out=Path('work/prepared')/(p.name.removesuffix('.tei.xml')+'.json')
              import subprocess
              subprocess.run(['python','scripts/fulltext_coding/prepare_fulltext_for_coding.py','--input',str(p),'--output',str(out)],check=True)
          Path('work/selected_registry.json').write_text(json.dumps([
              {'source_filename':p.name,'openalex_id':r.get('openalex_id'),'doi':r.get('doi'),'zenodo_record_id':ctx['zenodo_record_id'],'zenodo_archive_filename':ctx['zenodo_archive_filename']} for p,r in selected
          ],ensure_ascii=False,indent=2)+'\n')
          print(f'Matched and prepared {len(selected)} TEI files')
          PY

      - name: Restore cumulative coding and provenance architecture
        run: |
          set -euo pipefail
          test -f data/fulltext_coding/cumulative_coding.json
          test -f data/fulltext_coding/coding_architecture.json

      - name: Code in durable checkpoints
        env:
          CHECKPOINT_SIZE: ${{ github.event.inputs.checkpoint_size || '10' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          prepared=sorted(Path('work/prepared').glob('*.json'))
          size=int(os.environ.get('CHECKPOINT_SIZE','10'))
          for start in range(0,len(prepared),size):
              chunk=prepared[start:start+size]
              chunk_dir=Path('work/chunks')/f'chunk_{start+1:04d}_{start+len(chunk):04d}'
              out_dir=Path('work/annotations')
              chunk_dir.mkdir(parents=True,exist_ok=True)
              for p in chunk:
                  shutil.copy2(p,chunk_dir/p.name)
              print(f'CODING CHECKPOINT {start+1}-{start+len(chunk)} of {len(prepared)}')
              subprocess.run([
                  'python','scripts/fulltext_coding/code_fulltext_test_v3.py',
                  '--input-dir',str(chunk_dir),
                  '--output-dir',str(out_dir),
                  '--ontology','data/reference/topic_ontology_v3.csv',
                  '--schema','scripts/fulltext_coding/coding_schema_v3.json',
                  '--validator','scripts/fulltext_coding/validate_coding_output_v4.py',
                  '--prompt','scripts/fulltext_coding/fulltext_coding_prompt_v3.txt',
                  '--model',os.environ['FULLTEXT_CODING_MODEL'],
                  '--max-papers',str(len(chunk))
              ],check=True)
          PY

      - name: Build cumulative coding JSON and provenance architecture
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          from datetime import datetime, timezone

          ctx=json.loads(Path('work/record_context.json').read_text())
          selected={r['openalex_id']:r for r in json.loads(Path('work/selected_registry.json').read_text())}
          master=Path('data/master/current/living_evidence_map_master.csv')
          master_rows=[]
          if master.exists():
              master_rows=list(csv.DictReader(master.open(encoding='utf-8-sig',newline='')))
          master_by_openalex={str(r.get('openalex_id') or r.get('OpenAlex ID') or r.get('openalex') or '').strip():r for r in master_rows}
          master_by_doi={str(r.get('doi') or r.get('DOI') or '').strip().lower():r for r in master_rows if str(r.get('doi') or r.get('DOI') or '').strip()}

          arch_path=Path('data/fulltext_coding/coding_architecture.json')
          cum_path=Path('data/fulltext_coding/cumulative_coding.json')
          arch=json.loads(arch_path.read_text())
          cum=json.loads(cum_path.read_text())
          arch.setdefault('records',{})
          cum.setdefault('records',[])
          existing={r.get('openalex_id'):i for i,r in enumerate(cum['records']) if r.get('openalex_id')}
          now=datetime.now(timezone.utc).isoformat()

          for p in sorted(Path('work/annotations').glob('*.json')):
              if p.name.endswith('.raw_response.json') or p.name.endswith('.checkpoint.json') or p.name=='test_manifest.json': continue
              wid=p.stem
              prov=selected.get(wid,{})
              doi=str(prov.get('doi') or '').strip()
              master_row=master_by_openalex.get(wid) or master_by_doi.get(doi.lower())
              annotation=json.loads(p.read_text())
              record={
                  'openalex_id':wid,
                  'doi':doi or (str(master_row.get('doi') or master_row.get('DOI') or '').strip() if master_row else ''),
                  'zenodo_record_id':ctx['zenodo_record_id'],
                  'zenodo_record_url':ctx['zenodo_record_url'],
                  'zenodo_archive_filename':ctx['zenodo_archive_filename'],
                  'zenodo_source_filename':f'{wid}.tei.xml',
                  'master_csv_match':bool(master_row),
                  'master_csv_doi':(str(master_row.get('doi') or master_row.get('DOI') or '').strip() if master_row else ''),
                  'coding_status':'completed',
                  'coding_run_id':os.environ['GITHUB_RUN_ID'],
                  'coding_timestamp_utc':now,
                  'prompt_version':'fulltext_coding_v3',
                  'schema_version':'coding_schema_v3',
                  'ontology':'data/reference/topic_ontology_v3.csv',
                  'validation_warnings':annotation.get('validation_warnings',[]),
                  'annotation':annotation
              }
              if wid in existing: cum['records'][existing[wid]]=record
              else: cum['records'].append(record)
              arch['records'][wid]={k:record[k] for k in ['openalex_id','doi','zenodo_record_id','zenodo_record_url','zenodo_archive_filename','zenodo_source_filename','master_csv_match','master_csv_doi','coding_status','coding_run_id','coding_timestamp_utc','prompt_version','schema_version','ontology','validation_warnings']}

          arch['updated_at_utc']=now
          arch['workflow']='zenodo_fulltext_ai_coding'
          arch['architecture_version']='1.0'
          arch['provenance_key_order']=['zenodo_record_id','zenodo_archive_filename','zenodo_source_filename','openalex_id','doi','master_csv_match','coding_run_id']
          cum['updated_at_utc']=now
          cum['workflow']='zenodo_fulltext_ai_coding'
          cum['architecture_version']='1.0'
          cum['record_count']=len(cum['records'])

          arch_path.write_text(json.dumps(arch,ensure_ascii=False,indent=2)+'\n')
          cum_path.write_text(json.dumps(cum,ensure_ascii=False,indent=2)+'\n')
          print(f'Cumulative coded records: {len(cum["records"])}')
          PY

      - name: Validate cumulative JSON
        run: |
          set -euo pipefail
          python -m json.tool data/fulltext_coding/cumulative_coding.json >/dev/null
          python -m json.tool data/fulltext_coding/coding_architecture.json >/dev/null

      - name: Commit cumulative coding archive and provenance architecture
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/fulltext_coding/cumulative_coding.json data/fulltext_coding/coding_architecture.json
          if git diff --cached --quiet; then
            echo 'No new cumulative records to commit.'
          else
            git commit -m "Archive Zenodo full-text coding and provenance"
            git push
          fi

      - name: Upload checkpoint artifacts (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-fulltext-coding-checkpoint-${{ github.run_id }}
          path: |
            work/annotations/
            work/selected_registry.json
            work/record_context.json
            data/fulltext_coding/coding_architecture.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload cumulative coding JSON (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-fulltext-coding-cumulative-${{ github.run_id }}
          path: data/fulltext_coding/cumulative_coding.json
          retention-days: 90
          if-no-files-found: error
