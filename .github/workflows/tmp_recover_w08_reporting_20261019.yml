name: Recovery - W08 reporting from published immutable state
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_recover_w08_reporting_20261019.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install only required packages
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2','data.table','stringdist'))
      - name: Restore current W01 from immutable pointer
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_restore_current_state.R \
            --pointer docs/deduplication/zenodo/run-39140209398.json \
            --pointer-dir docs/deduplication/zenodo \
            --output-root recovered_w01
          test -s recovered_w01/canonical/records.jsonl
      - name: Regenerate W01 source membership from current cohort
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/reporting/write_workflow09_source_snapshot.R \
            --stage W01 --run-id 39140209398 \
            --canonical recovered_w01/canonical/records.jsonl
          Rscript -e 'library(jsonlite);m<-fromJSON("docs/reporting/workflow_09_inputs/current/w01_source_manifest.json");stopifnot(m$canonical_records==50551L);x<-read.csv("docs/reporting/workflow_09_inputs/current/w01_source_membership.csv");stopifnot(nrow(x)==50551L,!anyDuplicated(x$record_id));cat("PASS: regenerated 50551 W01 source memberships\n")'
      - name: Restore published W08 canonical without rerunning annotation
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: Rscript {0}
        run: |
          library(httr2);library(jsonlite);library(digest)
          pointer<-fromJSON("docs/workflow08/zenodo/run-39166740853.json",simplifyVector=FALSE)
          stopifnot(pointer$status=="published",pointer$canonical_records==22911L)
          url<-sprintf("https://zenodo.org/api/records/%s",pointer$zenodo_record_id)
          auth<-function(r) req_headers(r,Authorization=paste("Bearer",Sys.getenv("ZENODO_ACCESS_TOKEN")))
          r<-auth(request(url)) |> req_timeout(60) |> req_perform()
          stopifnot(resp_status(r)==200L)
          z<-resp_body_json(r,simplifyVector=FALSE)
          f<-Filter(function(x)identical(x$key,"living_evidence_map_canonical_final.jsonl"),z$files)
          stopifnot(length(f)==1L)
          link<-f[[1]]$links$content
          stopifnot(nzchar(link))
          dir.create("outputs/workflow08",recursive=TRUE)
          target<-"outputs/workflow08/living_evidence_map_canonical_final.jsonl"
          rr<-auth(request(link)) |> req_timeout(1800) |> req_perform(path=target)
          stopifnot(resp_status(rr)==200L,
                    identical(tolower(digest(file=target,algo="sha256",serialize=FALSE)),
                              tolower(pointer$final_canonical_jsonl_sha256)))
          cat("PASS: recovered archived W08 canonical, verified SHA256\n")
      - name: Validate W08 membership and rebuild W08 reporting
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/reporting/write_workflow09_stage_summary.R --stage W08 --run-id 39166740853
          Rscript scripts/reporting/write_workflow09_source_snapshot.R \
            --stage W08 --run-id 39166740853 \
            --canonical outputs/workflow08/living_evidence_map_canonical_final.jsonl
          Rscript scripts/reporting/refresh_workflow09_input_manifest.R
          Rscript -e 'library(jsonlite);m<-fromJSON("docs/reporting/workflow_09_inputs/current/w08_source_manifest.json");stopifnot(m$canonical_records==22911L);cat("PASS: 22911 W08 records reconcile with current W01 source membership\n")'
      - name: Commit reporting snapshot without touching canonical or screening state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reporting/workflow_09_inputs/current
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild current W01 membership and W08 reporting from immutable archives [skip ci]"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi
      - name: Dispatch W09 only after successful verified reporting
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run report_workflow09_figures.yml --repo "$GITHUB_REPOSITORY" --ref workflow01-final-architecture
          echo "PASS: W09 requested following verified W01/W08 reconciliation"
