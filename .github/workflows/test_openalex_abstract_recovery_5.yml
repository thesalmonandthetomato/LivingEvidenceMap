name: Test OpenAlex abstract recovery - 5

on:
  push:
    branches:
      - updater-workflow-04-relevance-screening
    paths:
      - .github/workflows/test_openalex_abstract_recovery_5.yml
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-04-relevance-screening

      - name: Check out canonical store
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          path: canonical_store
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: pip install pypdf

      - name: Recover 5 missing abstracts from OpenAlex content
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python scripts/updater/recover_missing_abstracts_openalex_content.py \
            --records canonical_store/data/canonical/current/repair/records.jsonl \
            --output testdata/openalex_abstract_recovery_5/audit.jsonl \
            --patches testdata/openalex_abstract_recovery_5/abstract_patches.jsonl \
            --report testdata/openalex_abstract_recovery_5/report.json \
            --max-content-downloads 5
          cat testdata/openalex_abstract_recovery_5/report.json

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-abstract-recovery-5-${{ github.run_id }}
          path: testdata/openalex_abstract_recovery_5/
          if-no-files-found: error
          retention-days: 30
