name: TEMP W01 identifier pre-resolution replay

on:
  push:
    branches:
      - w01-identifier-assist-test
    paths:
      - '.github/workflows/tmp_w01_identifier_preresolve_replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-identifier-assist-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite'))

      - name: Download saved benchmark and validation artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w01_replay/{benchmark,guards,high_triage,high_ext,single_triage,single_ext,prod,out}

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11220721964/zip" > /tmp/w01_replay/benchmark.zip
          unzip -q /tmp/w01_replay/benchmark.zip -d /tmp/w01_replay/benchmark

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11221329288/zip" > /tmp/w01_replay/guards.zip
          unzip -q /tmp/w01_replay/guards.zip -d /tmp/w01_replay/guards

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11220516034/zip" > /tmp/w01_replay/high_triage.zip
          unzip -q /tmp/w01_replay/high_triage.zip -d /tmp/w01_replay/high_triage

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11221271076/zip" > /tmp/w01_replay/high_ext.zip
          unzip -q /tmp/w01_replay/high_ext.zip -d /tmp/w01_replay/high_ext

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11221720613/zip" > /tmp/w01_replay/single_triage.zip
          unzip -q /tmp/w01_replay/single_triage.zip -d /tmp/w01_replay/single_triage

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11221144798/zip" > /tmp/w01_replay/single_ext.zip
          unzip -q /tmp/w01_replay/single_ext.zip -d /tmp/w01_replay/single_ext

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11171230024/zip" > /tmp/w01_replay/prod.zip
          unzip -q /tmp/w01_replay/prod.zip             workflow01_candidates/normalised_metadata.csv             workflow01_incremental_rescore/rescored_sample.csv             -d /tmp/w01_replay/prod

      - name: Replay identifier pre-resolution against saved W01 workload
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_identifier_preresolve_replay_test.R             --identifier-pairs /tmp/w01_replay/benchmark/identifier_candidate_pairs.csv             --registry /tmp/w01_replay/benchmark/identifier_registry.csv             --guards /tmp/w01_replay/guards/future_never_auto_resolve_guard_candidates.csv             --w01-metadata /tmp/w01_replay/prod/workflow01_candidates/normalised_metadata.csv             --w01-scored /tmp/w01_replay/prod/workflow01_incremental_rescore/rescored_sample.csv             --high-triage /tmp/w01_replay/high_triage/high_evidence_disagreement_triage.csv             --high-external /tmp/w01_replay/high_ext/nonclear_external_validation.csv             --single-triage /tmp/w01_replay/single_triage/single_family_disagreement_triage.csv             --single-external /tmp/w01_replay/single_ext/single_family_external_validation.csv             --output-dir /tmp/w01_replay/out
          cat /tmp/w01_replay/out/identifier_preresolve_replay_audit.json

      - name: Assert replay invariants
        shell: Rscript {0}
        run: |
          library(jsonlite)
          a <- fromJSON('/tmp/w01_replay/out/identifier_preresolve_replay_audit.json')
          stopifnot(a$validation$validated_w01_misses_recovered == 892L)
          stopifnot(a$validation$unsafe_or_risky_fast_tracked == 0L)
          stopifnot(a$replay$safe_pairs_present_in_w01_candidates == 41268L)
          stopifnot(a$replay$w01_unique_candidate_pairs_before == 503245L)
          stopifnot(a$replay$w01_unique_candidate_pairs_after_preresolve == 461977L)
          stopifnot(a$safety$automatic_merges_performed == 0L)
          stopifnot(a$safety$production_w01_modified == FALSE)
          cat('PASS: replay invariants confirmed; production unchanged\n')

      - name: Upload replay outputs
        uses: actions/upload-artifact@v4
        with:
          name: w01-identifier-preresolve-replay-${{ github.run_id }}
          path: /tmp/w01_replay/out/
          retention-days: 30
          if-no-files-found: error
