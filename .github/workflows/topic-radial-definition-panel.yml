name: Patch radial topic definition panel

on:
  push:
    branches:
      - topic-radial-definition-panel

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topic-radial-definition-panel
          fetch-depth: 0
      - name: Patch dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/dashboard-redesign-temp.html')
          text = path.read_text()

          css_old = ".database-species-cell{white-space:normal;min-width:150px}.database-species-cell .pill{margin:2px 2px 2px 0}\n"
          css_new = css_old + """.topic-radial-layout{display:flex;gap:30px;align-items:center;justify-content:center}.topic-radial-layout #topicRadial{margin:0!important}.topic-radial-info{flex:1 1 360px;max-width:520px;min-height:220px;border:1px solid var(--line);border-radius:10px;background:#f8faf9;padding:20px 22px;align-self:center}.topic-radial-info h3{margin:0 0 8px;font-size:18px}.topic-radial-info-path{font-size:12px;color:var(--mid);margin:0 0 12px}.topic-radial-definition{margin:0;color:var(--ink)}.topic-radial-filter-status{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}.topic-radial-filter-status a{color:var(--ink);font-weight:650}.topic-radial-placeholder{color:var(--mid)}@media(max-width:900px){.topic-radial-layout{flex-direction:column;align-items:stretch}.topic-radial-layout #topicRadial{align-self:center}.topic-radial-info{max-width:none;min-height:0;width:100%}}\n"""
          assert text.count(css_old) == 1, f'CSS anchor count: {text.count(css_old)}'
          text = text.replace(css_old, css_new, 1)

          html_old = '<section class="section"><h2>Topic hierarchy</h2><p class="sub">Radial hierarchy of topics. High-level branches use the full dashboard palette from dark grey-teal through pale grey and peach to salmon pink. Hover for counts; click any segment to jump to the database filtered only at that hierarchy level.</p><div class="topic-radial-controls"><button id="topicRadialReset" type="button">Reset highlight</button></div><div id="topicRadial" class="topic-radial"></div></section>'
          html_new = '<section class="section"><h2>Topic hierarchy</h2><p class="sub">Radial hierarchy of topics. High-level branches use the full dashboard palette from dark grey-teal through pale grey and peach to salmon pink. Hover over a segment to see its definition; click to filter the database and keep that definition visible.</p><div class="topic-radial-controls"><button id="topicRadialReset" type="button">Reset highlight</button></div><div class="topic-radial-layout"><div id="topicRadial" class="topic-radial"></div><aside id="topicRadialInfo" class="topic-radial-info" aria-live="polite"><div class="topic-radial-placeholder">Hover over a topic to see its definition. Click a topic to keep the definition visible and filter the database.</div></aside></div></section>'
          assert text.count(html_old) == 1, f'HTML anchor count: {text.count(html_old)}'
          text = text.replace(html_old, html_new, 1)

          filter_old = "window.figureFilter=function(next){state.species='__all__';state.country='__all__';state.topic=null;state.year=null;state.q='';Object.assign(state,next||{});state.page=1;syncControls();table();jump();};"
          filter_new = "window.figureFilter=function(next,doJump){state.species='__all__';state.country='__all__';state.topic=null;state.year=null;state.q='';Object.assign(state,next||{});state.page=1;syncControls();table();if(doJump!==false)jump();};"
          assert text.count(filter_old) == 1, f'figureFilter anchor count: {text.count(filter_old)}'
          text = text.replace(filter_old, filter_new, 1)

          radial_old = """ var paths=g.selectAll('path').data(h.descendants().filter(function(d){return d.depth>0;})).join('path').attr('class','topic-radial-arc').attr('d',arc).attr('fill',fill)
   .on('mousemove',function(e,d){showTip(e,'<b>'+esc(d.data.name)+'</b><br>'+fmt(d.data.count)+' unique records<br>'+esc(d.data.key));}).on('mouseleave',hideTip)
   .on('click',function(e,d){e.stopPropagation();window.figureFilter({topic:d.data.key});});
 var center=g.append('g');center.append('circle').attr('r',92).attr('fill','#fff').attr('stroke','#d9e2e1');center.append('text').attr('text-anchor','middle').attr('y',-7).attr('font-weight',700).attr('fill','#2c454a').text('All topics');center.append('text').attr('text-anchor','middle').attr('y',24).attr('font-size',25).attr('font-weight',750).attr('fill','#2c454a').text(fmt(data.count));
 document.getElementById('topicRadialReset').onclick=function(){paths.attr('opacity',1);};
"""
          radial_new = """ var info=document.getElementById('topicRadialInfo'),lockedKey=null;
 function resetInfo(){if(info)info.innerHTML='<div class=\"topic-radial-placeholder\">Hover over a topic to see its definition. Click a topic to keep the definition visible and filter the database.</div>';}
 function showInfo(d,filtered){if(!info)return;var def=(D.topic_definitions||{})[d.data.key]||'No definition is available for this topic.';info.innerHTML='<h3>'+esc(d.data.name)+'</h3><div class=\"topic-radial-info-path\">'+esc(d.data.key)+'</div><p class=\"topic-radial-definition\">'+esc(def)+'</p>'+(filtered?'<div class=\"topic-radial-filter-status\"><strong>Database filtered.</strong><br><a href=\"#database\">Jump to the filtered database</a></div>':'');}
 var paths=g.selectAll('path').data(h.descendants().filter(function(d){return d.depth>0;})).join('path').attr('class','topic-radial-arc').attr('d',arc).attr('fill',fill)
   .on('mouseenter',function(e,d){if(lockedKey===null)showInfo(d,false);})
   .on('mousemove',function(e,d){showTip(e,'<b>'+esc(d.data.name)+'</b><br>'+fmt(d.data.count)+' unique records<br>'+esc(d.data.key));})
   .on('mouseleave',function(){hideTip();if(lockedKey===null)resetInfo();})
   .on('click',function(e,d){e.stopPropagation();lockedKey=d.data.key;showInfo(d,true);paths.classed('dim',function(n){return n!==d;}).classed('focus',function(n){return n===d;});window.figureFilter({topic:d.data.key},false);});
 var center=g.append('g');center.append('circle').attr('r',92).attr('fill','#fff').attr('stroke','#d9e2e1');center.append('text').attr('text-anchor','middle').attr('y',-7).attr('font-weight',700).attr('fill','#2c454a').text('All topics');center.append('text').attr('text-anchor','middle').attr('y',24).attr('font-size',25).attr('font-weight',750).attr('fill','#2c454a').text(fmt(data.count));
 document.getElementById('topicRadialReset').onclick=function(){lockedKey=null;paths.attr('opacity',1).classed('dim',false).classed('focus',false);resetInfo();};
"""
          assert text.count(radial_old) == 1, f'radial handler anchor count: {text.count(radial_old)}'
          text = text.replace(radial_old, radial_new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/topic-radial-definition-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add radial topic definition panel"
          git push origin HEAD:topic-radial-definition-panel
