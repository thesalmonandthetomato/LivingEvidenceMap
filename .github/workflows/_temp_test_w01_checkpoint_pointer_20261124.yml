name: TEMP W01 checkpoint pointer fallback regression
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_test_w01_checkpoint_pointer_20261124.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')
      - name: Validate unchanged pointer, fallbacks, and fail-closed behaviour
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          Rscript - <<'RS' >/tmp/w01_checkpoint_pointer_test.log 2>&1
          source_path<-"scripts/updater/workflow_01_build_pending_checkpoint.R"
          script<-parse(source_path)
          target<-Filter(function(x)is.call(x) && identical(x[[1L]],as.name("<-")) && identical(x[[2L]],as.name("resolve_workflow00_pointer")),as.list(script))
          stopifnot(length(target)==1L)
          eval(target[[1L]])
          ptr<-"docs/search_record/zenodo/run-45130154568.json"
          baseline<-"docs/deduplication/zenodo/run-40218882441.json"
          stopifnot(file.exists(ptr),file.exists(baseline))
          a<-resolve_workflow00_pointer(ptr)
          b<-resolve_workflow00_pointer(paste0("workflow00_registry/",ptr))
          stopifnot(identical(a,ptr),identical(b,ptr))
          j<-jsonlite::fromJSON(b,simplifyVector=FALSE)
          p<-jsonlite::fromJSON(baseline,simplifyVector=FALSE)
          stopifnot(is.list(j),is.list(p),is.null(j$error))
          cat("PASS_CHECKPOINT_POINTER original and retry fallback same valid JSON\n")
          err<-tryCatch(resolve_workflow00_pointer("workflow00_registry/docs/search_record/zenodo/run-9999999999999.json"),
                        error=function(e)conditionMessage(e))
          stopifnot(is.character(err),grepl("Missing authoritative W00 pointer",err,fixed=TRUE))
          cat("PASS_CHECKPOINT_MISSING_POINTER fails closed\n")
          err2<-tryCatch(resolve_workflow00_pointer("workflow00_registry/etc/passwd"),
                        error=function(e)conditionMessage(e))
          stopifnot(is.character(err2),grepl("Missing authoritative W00 pointer",err2,fixed=TRUE))
          cat("PASS_CHECKPOINT_UNEXPECTED_PATH fails closed\n")
          cat("ALL_CHECKPOINT_POINTER_TESTS_PASS\n")
          RS
          code=$?
          cat /tmp/w01_checkpoint_pointer_test.log
          EXIT_CODE="$code" python3 - <<'PY'
          import os,json,base64,urllib.request
          payload={"exit_code":int(os.environ["EXIT_CODE"]),"log":open("/tmp/w01_checkpoint_pointer_test.log").read()}
          content=base64.b64encode(json.dumps(payload,indent=2).encode()).decode()
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/docs/.temp_w01_checkpoint_pointer_test_20261124.json"
          body=json.dumps({"message":"TEMP W01 checkpoint pointer regression results","content":content,"branch":"workflow01-final-architecture"}).encode()
          req=urllib.request.Request(url,data=body,method="PUT",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as z:print("RECEIPT",z.status)
          PY
          exit "$code"
