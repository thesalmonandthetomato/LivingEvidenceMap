name: Workflow 01B - Abstract enrichment and cleaning

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'fixture_test'
        type: choice
        options:
          - fixture_test
          - canonical_audit
          - canonical_apply

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workflow 01B development branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-01b-abstract-enrichment

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Workflow 01B cleaning fixture
        if: ${{ inputs.mode == 'fixture_test' }}
        run: |
          mkdir -p testdata/workflow01b
          cat > testdata/workflow01b/input.jsonl <<'EOF'
          {"identity":{"lens_id":"wf1b-existing","record_id":"wf1b-existing","record_id_type":"lens_id"},"source":{"provider":"lens","source_format":"lens_api_json"},"lens":{"raw_payload":{"lens_id":"wf1b-existing","title":"Existing abstract fixture","authors":[{"first_name":"A","last_name":"Author"}],"year_published":2025,"source":{"title":"Journal"},"external_ids":[{"type":"doi","value":"10.1000/existing"}],"abstract":"<abstract><sec><title>Background</title><p>Atlantic salmon &amp; rainbow trout were studied.</p></sec><sec><title>Methods</title><p>Fish were sampled at day 30.</p></sec></abstract>"}}}
          {"identity":{"lens_id":"wf1b-no-doi","record_id":"wf1b-no-doi","record_id_type":"lens_id"},"source":{"provider":"lens","source_format":"lens_api_json"},"lens":{"raw_payload":{"lens_id":"wf1b-no-doi","title":"No DOI fixture","authors":[{"first_name":"B","last_name":"Author"}],"year_published":2024,"source":{"title":"Journal"},"abstract":null}}}
          {"identity":{"lens_id":"wf1b-recover","record_id":"wf1b-recover","record_id_type":"lens_id"},"source":{"provider":"lens","source_format":"lens_api_json"},"lens":{"raw_payload":{"lens_id":"wf1b-recover","title":"Effects of dietary lipid sources on growth performance, feed utilisation and tissue fatty acid composition of Atlantic salmon Salmo salar","authors":[{"first_name":"M","last_name":"Author"}],"year_published":2010,"source":{"title":"Aquaculture Research"},"external_ids":[{"type":"doi","value":"10.1111/j.1365-2109.2009.02327.x"}],"abstract":null}}}
          EOF

      - name: Run fixture test
        if: ${{ inputs.mode == 'fixture_test' }}
        run: |
          python scripts/updater/abstract_enrichment.py \
            --input testdata/workflow01b/input.jsonl \
            --output testdata/workflow01b/records_for_deduplication.jsonl \
            --audit testdata/workflow01b/abstract_enrichment_audit.jsonl \
            --report testdata/workflow01b/report.json \
            --delay 0.1
          cat testdata/workflow01b/report.json

      - name: Validate fixture cleaning contract
        if: ${{ inputs.mode == 'fixture_test' }}
        run: |
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('testdata/workflow01b/records_for_deduplication.jsonl') if x.strip()]
          assert len(rows)==3
          by={r['identity']['lens_id']:r for r in rows}
          a=by['wf1b-existing']; b=by['wf1b-no-doi']; c=by['wf1b-recover']
          raw=a['lens']['raw_payload']['abstract']
          assert '<abstract>' in raw and '<title>Background</title>' in raw
          assert a['canonical']['abstract']=='Atlantic salmon & rainbow trout were studied. Fish were sampled at day 30.'
          assert '<' not in a['canonical']['abstract'] and '>' not in a['canonical']['abstract']
          assert a['abstract_enrichment']['status']=='existing_abstract'
          assert a['abstract_enrichment']['attempts']==[]
          assert a['abstract_enrichment']['cleaning']['method']=='html_jats_plaintext_v1'
          assert a['abstract_enrichment']['cleaning']['changed'] is True
          assert b['abstract_enrichment']['status']=='missing_no_doi'
          assert b['abstract_enrichment']['attempts']==[]
          required={'record_id','lens_id','title','authors','year','source','doi','abstract'}
          for r in rows:
              assert required <= set(r['canonical'])
              assert r['canonical']['title']==r['lens']['raw_payload']['title']
              assert r['abstract_enrichment']['provider']=='europe_pmc'
              assert 'cleaning' in r['abstract_enrichment']
          assert c['lens']['raw_payload']['abstract'] is None
          assert c['canonical']['doi']=='10.1111/j.1365-2109.2009.02327.x'
          report=json.load(open('testdata/workflow01b/report.json'))
          assert report['abstract_cleaning_method']=='html_jats_plaintext_v1'
          assert report['abstracts_cleaned'] >= 1
          PY

      - name: Check out canonical store
        if: ${{ inputs.mode != 'fixture_test' }}
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          path: canonical_store

      - name: Run canonical abstract cleaning
        if: ${{ inputs.mode != 'fixture_test' }}
        run: |
          mkdir -p outputs/workflow01b
          SRC=canonical_store/data/canonical/current/repair/records.jsonl
          test -f "$SRC"
          python scripts/updater/abstract_enrichment.py \
            --input "$SRC" \
            --output outputs/workflow01b/cleaned_records.jsonl \
            --audit outputs/workflow01b/abstract_cleaning_audit.jsonl \
            --report outputs/workflow01b/report.json \
            --clean-only \
            --expected-records 20488
          cat outputs/workflow01b/report.json

      - name: Validate canonical cleaning is lossless
        if: ${{ inputs.mode != 'fixture_test' }}
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0,'scripts/updater')
          from abstract_enrichment import read_json_object_stream
          src='canonical_store/data/canonical/current/repair/records.jsonl'
          out='outputs/workflow01b/cleaned_records.jsonl'
          source=read_json_object_stream(src)
          cleaned=read_json_object_stream(out)
          assert len(source)==20488, len(source)
          assert len(cleaned)==20488, len(cleaned)
          changed=0
          for n,(a,b) in enumerate(zip(source,cleaned),1):
              assert a.get('identity')==b.get('identity'), n
              assert a.get('lens')==b.get('lens'), n
              ca=a.get('canonical') or {}; cb=b.get('canonical') or {}
              for k,v in ca.items():
                  if k!='abstract': assert cb.get(k)==v, (n,k)
              for k in cb:
                  if k!='abstract' and k not in ca:
                      raise AssertionError((n,'unexpected canonical field',k))
              if ca.get('abstract')!=cb.get('abstract'): changed+=1
          report=json.load(open('outputs/workflow01b/report.json'))
          assert report['total_records']==20488
          assert report['expected_records']==20488
          assert report['abstracts_cleaned']==changed
          print(json.dumps({'records_verified':20488,'canonical_abstracts_changed':changed},indent=2))
          PY

      - name: Apply cleaned abstracts to canonical store
        if: ${{ inputs.mode == 'canonical_apply' }}
        run: |
          cp outputs/workflow01b/cleaned_records.jsonl canonical_store/data/canonical/current/repair/records.jsonl
          cd canonical_store
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/canonical/current/repair/records.jsonl
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit.'
          else
            git commit -m 'Clean canonical abstracts in Workflow 01B'
            git push origin HEAD:canonical-repair-store
          fi
          git fetch origin canonical-repair-store --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/canonical-repair-store)"

      - name: Upload Workflow 01B artefact
        uses: actions/upload-artifact@v4
        with:
          name: workflow01b-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            testdata/workflow01b/
            outputs/workflow01b/
          retention-days: 90
          if-no-files-found: error
