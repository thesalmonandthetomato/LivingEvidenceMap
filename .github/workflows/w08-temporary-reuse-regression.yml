name: W08 temporary decision reuse regression
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w08-temporary-reuse-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest","readr"))
      - name: Reuse decisions only when issue fingerprints match
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(digest)
          library(readr)
          t<-file.path(Sys.getenv("RUNNER_TEMP"),"w08-reuse")
          dir.create(t)
          hash<-function(x)digest(toJSON(x,auto_unbox=TRUE,null="null",na="null",digits=NA,pretty=FALSE),algo="sha256",serialize=FALSE)
          make<-function(id,title,value) {
            key<-paste0(id,"::geography_unresolved")
            state<-list(review_key=key,record_id=id,issue_type="geography_unresolved",source_workflow="06",title=title,abstract="Abstract",automated_value=list(geography_status="UNRESOLVED",luna_iso3c=value),allowed_human_outcomes=c("accept_model","override_country_set","assign_none","exclude_record"))
            list(record_id=id,title=title,abstract="Abstract",issues=list(list(issue_type="geography_unresolved",source_workflow="06",automated_value=state$automated_value,allowed_human_outcomes=state$allowed_human_outcomes,issue_state_sha256=hash(state))))
          }
          old<-list(make("same","Unchanged","NOR"),make("changed","Old title","SWE"))
          now<-list(make("same","Unchanged","NOR"),make("changed","Updated title","SWE"),make("new","New record","FIN"))
          writejl<-function(x,path)writeLines(vapply(x,function(z)toJSON(z,auto_unbox=TRUE,null="null",na="null",digits=NA),character(1)),path)
          writejl(now,file.path(t,"current.jsonl"))
          decisions<-lapply(old,function(z)list(review_key=paste0(z$record_id,"::geography_unresolved"),record_id=z$record_id,issue_type="geography_unresolved",decision="assign_none",final_value=list(geography_status="NONE"),issue_state_sha256=z$issues[[1]]$issue_state_sha256))
          writejl(decisions,file.path(t,"prior.jsonl"))
          args<-c("scripts/updater/workflow_08_reuse_decisions.R","--queue",file.path(t,"current.jsonl"),"--prior-ledger",file.path(t,"prior.jsonl"),"--output-dir",file.path(t,"out"))
          stopifnot(system2("Rscript",args)==0L)
          manifest<-fromJSON(file.path(t,"out/workflow08_reuse_manifest.json"))
          stopifnot(manifest$reused_issues==1,manifest$pending_issues==2,manifest$changed_issues==1,manifest$new_issues==1)
          idx<-read_csv(file.path(t,"out/workflow08_reuse_index.csv"),show_col_types=FALSE)
          stopifnot(identical(idx$status[match(c("same","changed","new"),sub("::.*","",idx$review_key))],c("reused","changed_requires_review","new_requires_review")))
          reused<-readLines(file.path(t,"out/workflow08_reused_decisions.jsonl"))
          stopifnot(length(reused)==1L,grepl('"record_id":"same"',reused,fixed=TRUE))
          cat("PASS: reused unchanged; changed and new queued\n")
