name: Workflow 01 - Abstract repair

on:
  push:
    branches:
      - updater-workflow-01-abstract-enrichment
    paths:
      - '.github/workflows/workflow_01_abstract_repair.yml'
      - 'scripts/updater/workflow_01_abstract_repair.py'
  workflow_dispatch:
    inputs:
      external_europe_pmc:
        description: 'After preserved-source repair, query Europe PMC once per unresolved DOI'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  abstract-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Workflow 01
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-01-abstract-enrichment
          path: workflow01
          persist-credentials: false

      - name: Checkout Scopus adapter
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00b-scopus-ingestion
          path: scopus-code
          persist-credentials: false

      - name: Checkout OpenAlex adapter
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00c-openalex-ingestion
          path: openalex-code
          persist-credentials: false

      - name: Checkout AGRICOLA adapter
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-00d-agricola-ingestion
          path: agricola-code
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install sidecar dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Download frozen source baselines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baselines
          gh release download source-baselines-2026-09-20             --repo "$GITHUB_REPOSITORY"             --dir baselines             --pattern 'lens-baseline-2026-09-20.jsonl'             --pattern 'scopus-foundational-2026-09-20.tar.gz'             --pattern 'openalex-foundational-2026-09-20.tar.gz'             --pattern 'agricola-foundational-2026-09-20.tar.gz'             --pattern 'SHA256SUMS'

      - name: Verify frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          cd baselines
          sha256sum -c SHA256SUMS --ignore-missing
          cd ..
          mkdir -p inputs/scopus inputs/openalex inputs/agricola
          tar -xzf baselines/scopus-foundational-2026-09-20.tar.gz -C inputs/scopus
          tar -xzf baselines/openalex-foundational-2026-09-20.tar.gz -C inputs/openalex
          tar -xzf baselines/agricola-foundational-2026-09-20.tar.gz -C inputs/agricola
          test -s baselines/lens-baseline-2026-09-20.jsonl
          find_source_root() {
            local base="$1"
            local raw_file
            raw_file="$(find "$base" -type f -path '*/raw/response_*.json' -print -quit)"
            test -n "$raw_file"
            dirname "$(dirname "$raw_file")"
          }
          SCOPUS_ROOT="$(find_source_root inputs/scopus)"
          OPENALEX_ROOT="$(find_source_root inputs/openalex)"
          AGRICOLA_ROOT="$(find_source_root inputs/agricola)"
          test -d "$SCOPUS_ROOT/raw"
          test -d "$OPENALEX_ROOT/raw"
          test -d "$AGRICOLA_ROOT/raw"
          echo "SCOPUS_ROOT=$SCOPUS_ROOT" >> "$GITHUB_ENV"
          echo "OPENALEX_ROOT=$OPENALEX_ROOT" >> "$GITHUB_ENV"
          echo "AGRICOLA_ROOT=$AGRICOLA_ROOT" >> "$GITHUB_ENV"
          echo "Scopus root: $SCOPUS_ROOT"
          echo "OpenAlex root: $OPENALEX_ROOT"
          echo "AGRICOLA root: $AGRICOLA_ROOT"

      - name: Rebuild source sidecars from frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          Rscript scopus-code/scripts/updater/workflow_01s_scopus_sidecar_adapter.R             --input-dir inputs/scopus --output-dir sidecars/scopus
          Rscript openalex-code/scripts/updater/workflow_01u_openalex_sidecar_adapter.R             --input-dir inputs/openalex --output-dir sidecars/openalex
          Rscript agricola-code/scripts/updater/workflow_01v_agricola_sidecar_adapter.R             --input-dir inputs/agricola --output-dir sidecars/agricola

      - name: Run Workflow 01 abstract repair
        env:
          EXTERNAL: ${{ github.event_name == 'workflow_dispatch' && inputs.external_europe_pmc || false }}
        shell: bash
        run: |
          set -euo pipefail
          extra='--no-external'
          if [ "$EXTERNAL" = "true" ]; then extra=''; fi
          python workflow01/scripts/updater/workflow_01_abstract_repair.py             --lens baselines/lens-baseline-2026-09-20.jsonl             --scopus sidecars/scopus/scopus_sidecar_records.jsonl             --openalex sidecars/openalex/openalex_sidecar_records.jsonl             --agricola sidecars/agricola/agricola_sidecar_records.jsonl             --output-dir outputs/workflow01             $extra
          cat outputs/workflow01/report.json

      - name: Validate Workflow 01 outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/workflow01/lens_records_for_deduplication.jsonl
          test -s outputs/workflow01/scopus_records_for_deduplication.jsonl
          test -s outputs/workflow01/openalex_records_for_deduplication.jsonl
          test -s outputs/workflow01/agricola_records_for_deduplication.jsonl
          test -s outputs/workflow01/report.json
          grep -q '"canonical_store_modified": false' outputs/workflow01/report.json
          grep -q '"source_payloads_modified": false' outputs/workflow01/report.json

      - name: Upload Workflow 01 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow01-abstract-repair-${{ github.run_id }}
          path: |
            outputs/workflow01/
            sidecars/*/compatibility_audit.json
          if-no-files-found: warn
          retention-days: 30
