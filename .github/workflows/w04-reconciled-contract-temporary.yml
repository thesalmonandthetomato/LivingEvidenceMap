name: Temporary W04 isolated reconciliation contract test
on:
  push:
    paths:
      - '.github/workflows/w04-reconciled-contract-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install offline dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2'))
      - name: Parse adapters and validate isolated GitHub workflow
        run: |
          Rscript -e 'parse(file="scripts/updater/workflow_04_restore_reconciled_archive.R");parse(file="scripts/updater/workflow_04_prepare_reconciled_offline.R")'
          python -c "import yaml; z=yaml.safe_load(open('.github/workflows/w04_shiny_reconciled_validation.yml')); assert 'validate-reconciled' in z['jobs']; assert z['permissions']['contents']=='read'"
      - name: Validate unchanged W04 merge and W05 inputs
        run: Rscript tests/test_w04_reconciled_offline_handoff.R
