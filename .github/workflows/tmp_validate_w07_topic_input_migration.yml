name: TEMP validate W07 topic input migration

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w07_topic_input_migration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate frozen W07 inputs after relocation
        shell: bash
        run: |
          set -euo pipefail
          OLD_O=data/reference/topic_ontology_v3_6.csv
          NEW_O=user_input/workflow07_topic_ontology.csv
          OLD_P=data/reference/topic_system_prompt_v3_6.txt
          NEW_P=user_input/workflow07_topic_system_prompt.txt

          echo "CHECK ontology byte identity"
          cmp "$OLD_O" "$NEW_O"
          echo "PASS ontology byte identity"

          echo "CHECK prompt byte identity"
          cmp "$OLD_P" "$NEW_P"
          echo "PASS prompt byte identity"

          OLD_O_SHA="$(sha256sum "$OLD_O" | cut -d' ' -f1)"
          NEW_O_SHA="$(sha256sum "$NEW_O" | cut -d' ' -f1)"
          OLD_P_SHA="$(sha256sum "$OLD_P" | cut -d' ' -f1)"
          NEW_P_SHA="$(sha256sum "$NEW_P" | cut -d' ' -f1)"
          echo "old ontology sha=$OLD_O_SHA"
          echo "new ontology sha=$NEW_O_SHA"
          echo "old prompt sha=$OLD_P_SHA"
          echo "new prompt sha=$NEW_P_SHA"

          test "$OLD_O_SHA" = "$NEW_O_SHA"
          echo "PASS ontology SHA preserved by relocation"
          test "$OLD_P_SHA" = "$NEW_P_SHA"
          echo "PASS prompt SHA preserved by relocation"
          test "$NEW_P_SHA" = "f038a0c04a4a897ee806b36912bb3bf22a7d80040100489cf5a8a3659e56bec0"
          echo "PASS prompt locked SHA remains valid"

          # Preserve the pre-existing ontology lock unchanged during this
          # non-instrumental migration. It is stale relative to the current
          # ontology bytes and must be handled separately from relocation.
          grep -q "EXPECTED_ONTOLOGY_SHA256: '5d78959f86d40f200f7dc7c3184a2d5ab61fd89d1450be7fbff39c2578246a43'" .github/workflows/workflow_07_production.yml
          grep -q "EXPECTED_ONTOLOGY_SHA256: '5d78959f86d40f200f7dc7c3184a2d5ab61fd89d1450be7fbff39c2578246a43'" .github/workflows/workflow_07_topic_coding.yml
          echo "PASS pre-existing ontology lock preserved unchanged"

          echo "CHECK production paths"
          grep -q 'TOPIC_ONTOLOGY_PATH: user_input/workflow07_topic_ontology.csv' .github/workflows/workflow_07_production.yml
          grep -q 'TOPIC_SYSTEM_PROMPT_PATH: user_input/workflow07_topic_system_prompt.txt' .github/workflows/workflow_07_production.yml
          grep -q 'TOPIC_ONTOLOGY_PATH: user_input/workflow07_topic_ontology.csv' .github/workflows/workflow_07_topic_coding.yml
          grep -q 'TOPIC_SYSTEM_PROMPT_PATH: user_input/workflow07_topic_system_prompt.txt' .github/workflows/workflow_07_topic_coding.yml
          grep -q 'user_input/workflow07_topic_ontology.csv' R/run_topic_three_luna_production.R
          grep -q 'user_input/workflow07_topic_system_prompt.txt' R/run_topic_three_luna_production.R
          echo "PASS production paths"

          echo "CHECK old paths absent from current execution files"
          ! grep -q 'data/reference/topic_ontology_v3_6.csv' .github/workflows/workflow_07_production.yml
          ! grep -q 'data/reference/topic_system_prompt_v3_6.txt' .github/workflows/workflow_07_production.yml
          ! grep -q 'data/reference/topic_ontology_v3_6.csv' .github/workflows/workflow_07_topic_coding.yml
          ! grep -q 'data/reference/topic_system_prompt_v3_6.txt' .github/workflows/workflow_07_topic_coding.yml
          ! grep -q 'data/reference/topic_ontology_v3_6.csv' R/run_topic_three_luna_production.R
          ! grep -q 'data/reference/topic_system_prompt_v3_6.txt' R/run_topic_three_luna_production.R
          echo "PASS old paths absent"

          echo 'PASS: W07 ontology and prompt migration are byte-identical with locked SHA values preserved'

      - name: Parse W07 implementation
        shell: Rscript {0}
        run: |
          parse(file='R/run_topic_three_luna_production.R')
          parse(file='scripts/updater/workflow_07_prepare_incremental.R')
          parse(file='scripts/updater/workflow_07_merge_incremental_topics.R')
          parse(file='scripts/reporting/workflow07_apply_retention_and_review_rules.R')
          cat('PASS: W07 current implementation parses\n')
