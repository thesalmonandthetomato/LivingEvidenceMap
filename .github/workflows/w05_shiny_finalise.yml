name: W05 Shiny full-corpus finalisation (isolated)
run-name: W05 Shiny full corpus ${{ inputs.review_id }}
on:
  workflow_dispatch:
    inputs:
      review_id:
        description: Review identifier
        required: true
        type: string
      zenodo_draft_id:
        description: Restricted Zenodo draft containing input JSONL and dictionary
        required: true
        type: string
      input_filename:
        required: true
        type: string
      input_sha256:
        required: true
        type: string
      dictionary_filename:
        required: true
        type: string
      dictionary_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  shiny-full-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install deterministic dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest","httr2"))
      - name: Restore checksum-verified Shiny subset inputs
        working-directory: shiny_w05
        shell: Rscript {0}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          W05_REVIEW_ID: ${{ inputs.review_id }}
          W05_DRAFT_ID: ${{ inputs.zenodo_draft_id }}
          W05_INPUT_FILE: ${{ inputs.input_filename }}
          W05_INPUT_SHA: ${{ inputs.input_sha256 }}
          W05_DICT_FILE: ${{ inputs.dictionary_filename }}
          W05_DICT_SHA: ${{ inputs.dictionary_sha256 }}
        run: |
          source("scripts/w05_shiny_restore_inputs.R")
      - name: Code all W04 included records from scratch
        working-directory: shiny_w05
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/w05_crop_worker.R --input "$RUNNER_TEMP/w05-shiny/input.jsonl" --dictionary "$RUNNER_TEMP/w05-shiny/dictionary.csv" --output-dir "$RUNNER_TEMP/w05-shiny-results" --full-corpus
      - name: Validate and publish full-corpus W05 to restricted Zenodo
        working-directory: shiny_w05
        shell: Rscript {0}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          W05_REVIEW_ID: ${{ inputs.review_id }}
          W05_DRAFT_ID: ${{ inputs.zenodo_draft_id }}
          W05_INPUT_SHA: ${{ inputs.input_sha256 }}
          W05_DICT_SHA: ${{ inputs.dictionary_sha256 }}
        run: source("scripts/w05_shiny_publish_final.R")
      - uses: actions/upload-artifact@v4
        with:
          name: w05-shiny-full-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/w05-shiny-results/
          retention-days: 30
