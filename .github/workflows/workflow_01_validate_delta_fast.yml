name: Workflow 01 - Fast delta/replay validation

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'scripts/updater/workflow_01_build_delta.R'
      - 'scripts/updater/workflow_01_replay_delta.R'
      - 'scripts/updater/workflow_01_validate_delta_fixture.R'
      - '.github/workflows/workflow_01_validate_delta_fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Workflow 01 branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install minimal R dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite','digest'))

      - name: Parse changed delta scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_01_build_delta.R')
          parse(file='scripts/updater/workflow_01_replay_delta.R')
          parse(file='scripts/updater/workflow_01_validate_delta_fixture.R')
          cat('PASS: R parse validation\n')

      - name: Run fast delta/replay fixture
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_validate_delta_fixture.R
