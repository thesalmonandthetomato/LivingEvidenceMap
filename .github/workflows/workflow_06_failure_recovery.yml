name: Workflow 06 - recover four model failures

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/workflow06/.run_failure_recovery'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("readr","dplyr","jsonlite","httr2","digest"))

      - name: Download validated Workflow 06 artifact
        uses: actions/download-artifact@v4
        with:
          name: workflow06-geography-production-36265092530
          path: source_w06
          github-token: ${{ github.token }}
          run-id: 36265092530

      - name: Recover exactly four failed records
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          FAIL=$(find source_w06 -type f -name geography_llm_failures.csv -print -quit)
          test -n "$FAIL"
          Rscript scripts/reporting/workflow06_recover_failures.R \
            --input "$FAIL" \
            --prompt config/workflow05_geography_semantic_prompt.txt \
            --output-dir outputs/workflow06_failure_recovery \
            --record-id work-e8046bb0876a1942

      - name: Validate scope
        shell: Rscript {0}
        run: |
          x <- readr::read_csv("outputs/workflow06_failure_recovery/workflow06_failure_recovery.csv",show_col_types=FALSE)
          stopifnot(nrow(x)==1L,!anyDuplicated(x$record_id))
          cat(sprintf("PASS: targeted recovery output contains exactly one record; remaining failures=%d\n",sum(x$llm_failed)))

      - name: Upload recovery output
        uses: actions/upload-artifact@v4
        with:
          name: workflow06-failure-recovery-${{ github.run_id }}
          path: outputs/workflow06_failure_recovery/
          retention-days: 90
          if-no-files-found: error
