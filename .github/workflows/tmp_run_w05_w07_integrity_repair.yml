name: TEMP run W05 repair and dispatch W06

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_run_w05_w07_integrity_repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CURRENT_W04_POINTER: 'docs/workflow04/zenodo/run-37679581307.json'
  EXPECTED_CURRENT_RECORDS: '23255'

jobs:
  w05:
    runs-on: ubuntu-latest
    outputs:
      pointer_path: ${{ steps.pointer.outputs.pointer_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install W05 dependencies
        shell: Rscript {0}
        run: install.packages(c('digest','dplyr','jsonlite','readr','tibble','testthat','httr2'))

      - name: Restore corrected W04 retained corpus
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/w04 outputs/workflow05_species_coding outputs/workflow05_state
          Rscript scripts/updater/workflow_04_restore_state_from_zenodo.R \
            --pointer "$CURRENT_W04_POINTER" \
            --output-dir inputs/w04
          CAN="$(find inputs/w04 -type f -name workflow04_included_canonical.jsonl -print -quit)"
          test -n "$CAN"
          cp "$CAN" inputs/retained_canonical.jsonl
          N="$(grep -cve '^[[:space:]]*$' inputs/retained_canonical.jsonl)"
          test "$N" -eq "$EXPECTED_CURRENT_RECORDS"
          echo "PASS: restored $N corrected W04-retained records"

      - name: Recompute deterministic W05 species state
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_05_species_coding.R \
            --input inputs/retained_canonical.jsonl \
            --config user_input/workflow05_coding_config.json \
            --dictionary user_input/workflow05_deterministic_concepts.csv \
            --output-dir outputs/workflow05_species_coding \
            --expected-records "$EXPECTED_CURRENT_RECORDS"

          mkdir -p outputs/workflow05_state
          Rscript -e '
            library(readr)
            x<-read_csv("outputs/workflow05_species_coding/workflow05_species_coded.csv",show_col_types=FALSE)
            write_csv(x[,c("record_sequence","record_id","farmed_species_codes","farmed_species")],
                      "outputs/workflow05_state/workflow05_species_layer.csv",na="")
          '
          cp outputs/workflow05_species_coding/species_codes_long.csv outputs/workflow05_state/
          cp outputs/workflow05_species_coding/species_matches.csv outputs/workflow05_state/
          cp outputs/workflow05_species_coding/species_record_counts.csv outputs/workflow05_state/
          cp outputs/workflow05_species_coding/workflow05_manifest.json outputs/workflow05_state/
          cp user_input/workflow05_deterministic_concepts.csv outputs/workflow05_state/deterministic_concepts.csv
          cp user_input/workflow05_coding_config.json outputs/workflow05_state/workflow05_coding_config.json
          echo "PASS: deterministic W05 rebuilt without OpenAI"

      - name: Publish corrected W05 state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          W04_RECORD="$(P="$CURRENT_W04_POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("P"),simplifyVector=FALSE);cat(x$zenodo_record_id)')"
          W04_SHA="$(P="$CURRENT_W04_POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("P"),simplifyVector=FALSE);cat(x$workflow04_final_screening_layer_sha256)')"
          mkdir -p outputs/workflow05_zenodo
          Rscript scripts/updater/workflow_05_archive_state_to_zenodo.R \
            --state-dir outputs/workflow05_state \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-commit "$(git rev-parse HEAD)" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir outputs/workflow05_zenodo \
            --upstream-w04-record-id "$W04_RECORD" \
            --upstream-w04-layer-sha256 "$W04_SHA"

      - name: Register corrected W05 state
        id: pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin workflow01-final-architecture
          Rscript scripts/updater/workflow_05_update_zenodo_registry.R \
            --receipt outputs/workflow05_zenodo/zenodo_receipt.json \
            --registry docs/workflow05/zenodo_registry.csv \
            --pointer-dir docs/workflow05/zenodo
          git add docs/workflow05/zenodo_registry.csv docs/workflow05/zenodo/
          if ! git diff --cached --quiet; then
            git commit -m "Register corrected W05 integrity repair $GITHUB_RUN_ID [skip ci]"
            git pull --rebase origin workflow01-final-architecture
            git push origin HEAD:workflow01-final-architecture
          fi
          P="docs/workflow05/zenodo/run-$GITHUB_RUN_ID.json"
          test -s "$P"
          echo "pointer_path=$P" >> "$GITHUB_OUTPUT"
          echo "PASS: corrected W05 registered; no Shiny/current-status update"

      - name: Upload W05 repair state
        uses: actions/upload-artifact@v4
        with:
          name: w05-integrity-repair-${{ github.run_id }}
          path: |
            outputs/workflow05_state/
            outputs/workflow05_zenodo/
          retention-days: 90
          if-no-files-found: error

  dispatch-w06:
    needs: w05
    if: ${{ needs.w05.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - name: Dispatch W06 as an independent top-level run
        env:
          GH_TOKEN: ${{ github.token }}
          W05_POINTER: ${{ needs.w05.outputs.pointer_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$W05_POINTER"
          gh workflow run workflow_06_production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref workflow01-final-architecture \
            -f workflow04_pointer_path=docs/workflow04/zenodo/run-37679581307.json \
            -f workflow05_pointer_path="$W05_POINTER" \
            -f lean_pointer_path=docs/compaction/zenodo/run-37648955012.json \
            -f prior_workflow06_pointer_path=docs/workflow06/zenodo/run-37515511948.json \
            -f prior_workflow04_pointer_path=docs/workflow04/zenodo/run-37456188910.json \
            -f prior_lean_pointer_path=docs/compaction/zenodo/run-37381023181.json \
            -f prior_workflow07_pointer_path=docs/workflow07/zenodo/run-37515511948.json \
            -f publish=false
          echo "PASS: dispatched isolated W06 with publish=false; no W07/W08/Shiny handoff can fire"
