name: Temporary W02 resume credentials check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w02-resume-credentials-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Verify W02 resume dependency and configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev
          Rscript -e 'install.packages(c("jsonlite","curl","googlesheets4","httr2"));stopifnot(requireNamespace("curl",quietly=TRUE),requireNamespace("googlesheets4",quietly=TRUE),requireNamespace("httr2",quietly=TRUE));cat("PASS dependencies\n")'
          python3 - <<'PY'
          import re
          p='.github/workflows/workflow_02_resume_after_human_review.yml'
          s=open(p).read()
          assert s.count('LEM_GOOGLE_CREDENTIAL_FILE') >= 5
          assert s.count('LEM_GOOGLE_SERVICE_ACCOUNT_JSON:') == 1
          assert 'libcurl4-openssl-dev' in s
          print('PASS single credential source and file reuse')
          PY
