name: Test final abstract fallback on 12 records

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workflow 04 development branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-04-relevance-screening
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Download 200-record validation artefact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33170913926 -n workflow04-manual-validation-33170913926 -D validation
          test -f validation/output.jsonl
      - name: Download Europe PMC results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33191451941 -n europepmc-abstract-enrichment-200-33191451941 -D europepmc
          test -f europepmc/europepmc_results.jsonl
      - name: Run final abstract fallback
        run: |
          python scripts/updater/test_abstract_fallback_final.py \
            --records validation/output.jsonl \
            --europepmc-results europepmc/europepmc_results.jsonl \
            --output abstract_fallback_results.jsonl \
            --report abstract_fallback_report.json
          cat abstract_fallback_report.json
      - name: Verify boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('abstract_fallback_report.json'))
          assert r['target_count']==12, r
          assert len(r['records'])==12, r
          print('PASS: final fallback tested exactly the 12 DOI-bearing Europe PMC misses')
          PY
      - name: Upload 90-day artefact
        uses: actions/upload-artifact@v4
        with:
          name: abstract-fallback-final-12-${{ github.run_id }}
          retention-days: 90
          path: |
            abstract_fallback_results.jsonl
            abstract_fallback_report.json
