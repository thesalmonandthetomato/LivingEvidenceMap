      fortnightly_from_date: ${{ needs.validate-and-plan.outputs.fortnightly_from_date }}
      fortnightly_to_date: ${{ needs.validate-and-plan.outputs.fortnightly_to_date }}
      additional_search_term: ${{ inputs.additional_search_term }}
    secrets: inherit

  pubmed:
    needs: validate-and-plan
    if: ${{ needs.validate-and-plan.outputs.selected_pubmed == 'true' }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
    with:
      source: pubmed
      run_type: ${{ inputs.run_type }}
      query: ${{ needs.validate-and-plan.outputs.pubmed_query }}
      parent_run_id: ${{ github.run_id }}
      search_version: ${{ needs.validate-and-plan.outputs.search_version }}
      fortnightly_from_date: ${{ needs.validate-and-plan.outputs.fortnightly_from_date }}
      fortnightly_to_date: ${{ needs.validate-and-plan.outputs.fortnightly_to_date }}
      additional_search_term: ${{ inputs.additional_search_term }}
    secrets: inherit

  ethos:
    needs: validate-and-plan
    if: ${{ needs.validate-and-plan.outputs.selected_ethos == 'true' }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
    with:
      source: ethos
      run_type: ${{ inputs.run_type }}
      query: ${{ needs.validate-and-plan.outputs.ethos_query }}
      parent_run_id: ${{ github.run_id }}
      search_version: ${{ needs.validate-and-plan.outputs.search_version }}
      fortnightly_from_date: ${{ needs.validate-and-plan.outputs.fortnightly_from_date }}
      fortnightly_to_date: ${{ needs.validate-and-plan.outputs.fortnightly_to_date }}
      additional_search_term: ${{ inputs.additional_search_term }}
    secrets: inherit

  cba:
    needs: validate-and-plan
    if: ${{ needs.validate-and-plan.outputs.selected_cba == 'true' }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
    with:
      source: cba
      run_type: ${{ inputs.run_type }}
      query: ${{ needs.validate-and-plan.outputs.cba_query }}
      parent_run_id: ${{ github.run_id }}
      search_version: ${{ needs.validate-and-plan.outputs.search_version }}
      fortnightly_from_date: ${{ needs.validate-and-plan.outputs.fortnightly_from_date }}
      fortnightly_to_date: ${{ needs.validate-and-plan.outputs.fortnightly_to_date }}
      additional_search_term: ${{ inputs.additional_search_term }}
    secrets: inherit

  epmc_preprints:
    needs: validate-and-plan
    if: ${{ needs.validate-and-plan.outputs.selected_epmc_preprints == 'true' }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
    with:
      source: epmc_preprints
      run_type: ${{ inputs.run_type }}
      query: ${{ needs.validate-and-plan.outputs.epmc_preprints_query }}
      parent_run_id: ${{ github.run_id }}
