  reconcile-expansion:
    needs: [validate-and-plan, lens, scopus, openalex, agricola, pubmed, ethos, cba, epmc_preprints, wos, ebsco_africa_wide, ebsco_amed, ebsco_psycinfo, ebsco_atla_religion, ebsco_biological_agricultural_index, ebsco_cinahl, ebsco_communication_mass_media, ebsco_econlit, ebsco_eric, ebsco_family_society, ebsco_greenfile, ebsco_hospitality_tourism, ebsco_medline, ebsco_mla, ebsco_political_science, ebsco_sportdiscus, ebsco_waters_oceans]
    if: ${{ always() && inputs.run_type == 'expansion' && needs.validate-and-plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SELECTED_SOURCES: ${{ needs.validate-and-plan.outputs.selected_sources_csv }}
    steps:
      - name: Ensure selected expansion searches succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            result="$(jq -r --arg s "$source" '.[$s].result // "missing"' <<< "$NEEDS_JSON")"
            if [ "$result" != "success" ]; then
              echo "$source expansion child did not succeed: $result" >&2
              exit 1
            fi
          done

      - name: Checkout Workflow 00 orchestration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW00_ORCHESTRATOR_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Download current expansion harvests
        env:
          GH_TOKEN: ${{ github.token }}
          LENS_SELECTED: ${{ inputs.lens }}
          SCOPUS_SELECTED: ${{ inputs.scopus }}
          OPENALEX_SELECTED: ${{ inputs.openalex }}
          AGRICOLA_SELECTED: ${{ inputs.agricola }}
          PUBMED_SELECTED: ${{ inputs.pubmed }}
          ETHOS_SELECTED: ${{ inputs.ethos }}
          CBA_SELECTED: ${{ inputs.cba }}
          EPMC_PREPRINTS_SELECTED: ${{ inputs.epmc_preprints }}
          WOS_SELECTED: ${{ inputs.wos }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p expansion_current
          for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            mkdir -p "expansion_current/$source"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "workflow00-${source}-harvest-${GITHUB_RUN_ID}" \
              --dir "expansion_current/$source"
          done

      - name: Build historical native-ID inputs
        env:
          GH_TOKEN: ${{ github.token }}
          LENS_SELECTED: ${{ inputs.lens }}
          SCOPUS_SELECTED: ${{ inputs.scopus }}
          OPENALEX_SELECTED: ${{ inputs.openalex }}
          AGRICOLA_SELECTED: ${{ inputs.agricola }}
          PUBMED_SELECTED: ${{ inputs.pubmed }}
          ETHOS_SELECTED: ${{ inputs.ethos }}
          CBA_SELECTED: ${{ inputs.cba }}
          EPMC_PREPRINTS_SELECTED: ${{ inputs.epmc_preprints }}
          WOS_SELECTED: ${{ inputs.wos }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p expansion_history
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id,.name,.workflow_run.id] | @tsv' > /tmp/all_artifacts.tsv

          matches_source() {
            local source="$1" name="$2"
            case "$source" in
              lens) [[ "$name" == workflow00-lens-harvest-* ]] ;;
              scopus) [[ "$name" == workflow00-scopus-harvest-* || "$name" == scopus-full-search-* ]] ;;
              openalex) [[ "$name" == workflow00-openalex-harvest-* || "$name" == openalex-full-search-* ]] ;;
              agricola) [[ "$name" == workflow00-agricola-harvest-* || "$name" == agricola-full-search-* ]] ;;
              pubmed) [[ "$name" == workflow00-pubmed-harvest-* ]] ;;
              ethos) [[ "$name" == workflow00-ethos-harvest-* ]] ;;
              cba) [[ "$name" == workflow00-cba-harvest-* ]] ;;
              epmc_preprints) [[ "$name" == workflow00-epmc_preprints-harvest-* ]] ;;
              wos) [[ "$name" == workflow00-wos-harvest-* || "$name" == wos-starter-full-search-* ]] ;;
              ebsco_*) [[ "$name" == workflow00-${source}-harvest-* ]] ;;
              *) return 1 ;;
            esac
          }

          for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            mkdir -p "expansion_history/$source"

            registry="data/workflow00/source_id_registry/${source}_native_ids.txt"
            if [ -s "$registry" ]; then
              cp "$registry" "expansion_history/$source/known_native_ids.txt"
              echo "Using persistent registry for $source"
              continue
            fi

            echo "Seeding first $source registry from preserved harvest artefacts"
            while IFS="$(printf '\t')" read -r id name run_id; do
              [ -n "$id" ] || continue
              [ "$name" != "workflow00-${source}-harvest-${GITHUB_RUN_ID}" ] || continue
              if matches_source "$source" "$name"; then
                dest="expansion_history/$source/artifact-$id"
                mkdir -p "$dest"
                echo "Downloading historical $source artefact: $name"
                gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$dest"
              fi
            done < /tmp/all_artifacts.tsv

            if [ "$source" = "lens" ] && ! find "expansion_history/lens" -type f -name 'records.jsonl' -print -quit | grep -q .; then
              git fetch origin canonical-fresh-2026-09-08-v1
              git show origin/canonical-fresh-2026-09-08-v1:data/canonical/current/repair/records.jsonl > expansion_history/lens/records.jsonl
              echo "Seeded Lens IDs from canonical fresh full harvest"
            fi
          done

      - name: Reconcile expansion by native source ID
        env:
          LENS_SELECTED: ${{ inputs.lens }}
          SCOPUS_SELECTED: ${{ inputs.scopus }}
          OPENALEX_SELECTED: ${{ inputs.openalex }}
          AGRICOLA_SELECTED: ${{ inputs.agricola }}
          PUBMED_SELECTED: ${{ inputs.pubmed }}
          ETHOS_SELECTED: ${{ inputs.ethos }}
          CBA_SELECTED: ${{ inputs.cba }}
          EPMC_PREPRINTS_SELECTED: ${{ inputs.epmc_preprints }}
          WOS_SELECTED: ${{ inputs.wos }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/updater/expansion_reconciliation
          for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            out="outputs/updater/expansion_reconciliation/$source"
            Rscript scripts/updater/workflow_00_expansion_native_id_reconcile.R \
              --source "$source" \
              --current-root "expansion_current/$source" \
              --history-root "expansion_history/$source" \
              --output-dir "$out"

            mkdir -p outputs/updater/expansion_archive/data/workflow00/source_id_registry
            cp "$out/updated_native_ids.txt" \
              "outputs/updater/expansion_archive/data/workflow00/source_id_registry/${source}_native_ids.txt"

            mkdir -p "outputs/updater/expansion_archive/docs/search_record/ad_hoc/reconciliation/${GITHUB_RUN_ID}"
            cp "$out/reconciliation_manifest.json" \
              "outputs/updater/expansion_archive/docs/search_record/ad_hoc/reconciliation/${GITHUB_RUN_ID}/${source}_reconciliation.json"
          done

      - name: Write consolidated expansion reconciliation summary
        shell: Rscript {0}
        run: |
          library(jsonlite)
          files <- list.files(
            'outputs/updater/expansion_reconciliation',
            pattern='reconciliation_manifest\\.json$',
            recursive=TRUE,
            full.names=TRUE
          )
          stopifnot(length(files) >= 1L)
          x <- lapply(files,fromJSON,simplifyVector=FALSE)
          summary <- list(
            workflow='00_expansion_reconciliation',
            status='success',
            parent_run_id=Sys.getenv('GITHUB_RUN_ID'),
            additional_search_term='${{ inputs.additional_search_term }}',
            sources=x,
            matching_policy='exact native source identifier only',
            downstream_bibliographic_deduplication='Workflow 01'
          )
          dir.create(
            'outputs/updater/expansion_archive/docs/search_record/ad_hoc/reconciliation',
            recursive=TRUE,
            showWarnings=FALSE
          )
          writeLines(
            toJSON(summary,auto_unbox=TRUE,pretty=TRUE,null='null'),
            sprintf(
              'outputs/updater/expansion_archive/docs/search_record/ad_hoc/reconciliation/%s_summary.json',
              Sys.getenv('GITHUB_RUN_ID')
            )
          )

      - name: Upload expansion reconciliation artefact
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-expansion-reconciliation-${{ github.run_id }}
          path: |
            outputs/updater/expansion_reconciliation/
            outputs/updater/expansion_archive/
          retention-days: 7
          if-no-files-found: error

  archive-search-records:
    needs: [validate-and-plan, lens, scopus, openalex, agricola, pubmed, ethos, cba, epmc_preprints, wos, reconcile-expansion]
    if: ${{ always() && needs.validate-and-plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure selected child searches and reconciliation succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_TYPE: ${{ inputs.run_type }}
        shell: bash
        run: |
          set -euo pipefail
          for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            result="$(jq -r --arg s "$source" '.[$s].result // "missing"' <<< "$NEEDS_JSON")"
            if [ "$result" != "success" ]; then
              echo "$source child search did not succeed: $result" >&2
              exit 1
            fi
          done
          if [ "$RUN_TYPE" = "expansion" ]; then
            result="$(jq -r '."reconcile-expansion".result // "missing"' <<< "$NEEDS_JSON")"
            if [ "$result" != "success" ]; then
              echo "Expansion reconciliation did not succeed: $result" >&2
              exit 1
            fi
          fi

      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW00_ORCHESTRATOR_BRANCH }}
          fetch-depth: 0

      - name: Download child search records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded_search_records
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "workflow00-search-record-*-${GITHUB_RUN_ID}" \
            --dir downloaded_search_records
          if ! find downloaded_search_records -type f -print -quit | grep -q .; then
            echo "No child search-record files were downloaded." >&2
            exit 1
          fi

      - name: Download expansion reconciliation archive
        if: ${{ inputs.run_type == 'expansion' }}
        uses: actions/download-artifact@v4
        with:
          name: workflow00-expansion-reconciliation-${{ github.run_id }}
          path: downloaded_expansion_reconciliation

      - name: Download fortnightly native-ID reconciliation outputs
        if: ${{ inputs.run_type == 'fortnightly' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LENS_SELECTED: ${{ inputs.lens }}
          SCOPUS_SELECTED: ${{ inputs.scopus }}
          OPENALEX_SELECTED: ${{ inputs.openalex }}
          AGRICOLA_SELECTED: ${{ inputs.agricola }}
          PUBMED_SELECTED: ${{ inputs.pubmed }}
          ETHOS_SELECTED: ${{ inputs.ethos }}
          CBA_SELECTED: ${{ inputs.cba }}
          EPMC_PREPRINTS_SELECTED: ${{ inputs.epmc_preprints }}
          WOS_SELECTED: ${{ inputs.wos }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded_fortnightly
          for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            dest="downloaded_fortnightly/$source"
            mkdir -p "$dest"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "workflow00-${source}-harvest-$GITHUB_RUN_ID" \
              --dir "$dest"
            test -s "$dest/source_delta/reconciliation_manifest.json"
            test -f "$dest/source_delta/updated_native_ids.txt"
          done

      - name: Download full-run native-ID seeds for new Europe PMC sources
        if: ${{ inputs.run_type == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBMED_SELECTED: ${{ inputs.pubmed }}
          ETHOS_SELECTED: ${{ inputs.ethos }}
          CBA_SELECTED: ${{ inputs.cba }}
          EPMC_PREPRINTS_SELECTED: ${{ inputs.epmc_preprints }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded_full_native
          for source in pubmed ethos cba epmc_preprints; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            dest="downloaded_full_native/$source"
            mkdir -p "$dest"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "workflow00-${source}-harvest-$GITHUB_RUN_ID" \
              --dir "$dest"
            test -s "$dest/source_delta/reconciliation_manifest.json"
            test -s "$dest/source_delta/updated_native_ids.txt"
          done

      - name: Archive search records and source-ID registries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/search_record
          cp -R downloaded_search_records/* docs/search_record/

          if [ '${{ inputs.run_type }}' = 'expansion' ]; then
            cp -R downloaded_expansion_reconciliation/expansion_archive/docs/* docs/
            mkdir -p data/workflow00/source_id_registry
            cp -R downloaded_expansion_reconciliation/expansion_archive/data/workflow00/source_id_registry/* \
              data/workflow00/source_id_registry/
          fi

          if [ '${{ inputs.run_type }}' = 'full' ]; then
            mkdir -p data/workflow00/source_id_registry
            for source in pubmed ethos cba epmc_preprints; do
              src="downloaded_full_native/$source/source_delta"
              [ -d "$src" ] || continue
              cp "$src/updated_native_ids.txt" "data/workflow00/source_id_registry/${source}_native_ids.txt"
              mkdir -p "docs/search_record/full/reconciliation/$GITHUB_RUN_ID"
              cp "$src/reconciliation_manifest.json" \
                "docs/search_record/full/reconciliation/$GITHUB_RUN_ID/${source}_reconciliation.json"
            done
          fi

          if [ '${{ inputs.run_type }}' = 'fortnightly' ]; then
            mkdir -p data/workflow00/source_id_registry
            mkdir -p "docs/search_record/fortnightly_update/reconciliation/$GITHUB_RUN_ID"
            for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
              src="downloaded_fortnightly/$source/source_delta"
              [ -d "$src" ] || continue
              cp "$src/updated_native_ids.txt" "data/workflow00/source_id_registry/${source}_native_ids.txt"
              cp "$src/reconciliation_manifest.json" \
                "docs/search_record/fortnightly_update/reconciliation/$GITHUB_RUN_ID/${source}_reconciliation.json"
            done
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/search_record
          if [ '${{ inputs.run_type }}' = 'full' ] || [ '${{ inputs.run_type }}' = 'expansion' ] || [ '${{ inputs.run_type }}' = 'fortnightly' ]; then
            git add data/workflow00/source_id_registry
          fi

          if git diff --cached --quiet; then
            echo 'No new search records or source-ID registry changes to commit.'
            exit 0
          fi

          git commit -m "Archive Workflow 00 search records for run ${GITHUB_RUN_ID}"
          git push origin "HEAD:$WORKFLOW00_ORCHESTRATOR_BRANCH"

      - name: Upload consolidated search archive
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-search-record-archive-${{ github.run_id }}
          path: docs/search_record/
          retention-days: 7
          if-no-files-found: error

  archive-search-to-zenodo:
    needs: [validate-and-plan, archive-search-records]
    if: ${{ always() && needs.validate-and-plan.result == 'success' && needs.archive-search-records.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SELECTED_SOURCES: ${{ needs.validate-and-plan.outputs.selected_sources_csv }}
    steps:
      - name: Checkout Workflow 00 archive branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW00_ORCHESTRATOR_BRANCH }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install Zenodo archive dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Stage complete Workflow 00 search
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          LENS_SELECTED: ${{ inputs.lens }}
          SCOPUS_SELECTED: ${{ inputs.scopus }}
          OPENALEX_SELECTED: ${{ inputs.openalex }}
          AGRICOLA_SELECTED: ${{ inputs.agricola }}
          PUBMED_SELECTED: ${{ inputs.pubmed }}
          ETHOS_SELECTED: ${{ inputs.ethos }}
          CBA_SELECTED: ${{ inputs.cba }}
          EPMC_PREPRINTS_SELECTED: ${{ inputs.epmc_preprints }}
          WOS_SELECTED: ${{ inputs.wos }}
          RUN_TYPE: ${{ inputs.run_type }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zenodo_staging/plan zenodo_staging/harvests zenodo_staging/search_records

          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "workflow00-search-plan-$GITHUB_RUN_ID" \
            --dir zenodo_staging/plan

          sources=()
          for source in lens scopus openalex agricola pubmed ethos cba epmc_preprints wos ebsco_africa_wide ebsco_amed ebsco_psycinfo ebsco_atla_religion ebsco_biological_agricultural_index ebsco_cinahl ebsco_communication_mass_media ebsco_econlit ebsco_eric ebsco_family_society ebsco_greenfile ebsco_hospitality_tourism ebsco_medline ebsco_mla ebsco_political_science ebsco_sportdiscus ebsco_waters_oceans; do
            case ",$SELECTED_SOURCES," in
              *",$source,"*) ;;
              *) continue ;;
            esac
            sources+=("$source")
            mkdir -p "zenodo_staging/harvests/$source" "zenodo_staging/search_records/$source"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "workflow00-${source}-harvest-$GITHUB_RUN_ID" \
              --dir "zenodo_staging/harvests/$source"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "workflow00-search-record-${source}-$GITHUB_RUN_ID" \
              --dir "zenodo_staging/search_records/$source"
          done

          if [ "$RUN_TYPE" = "expansion" ]; then
            mkdir -p zenodo_staging/expansion_reconciliation
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "workflow00-expansion-reconciliation-$GITHUB_RUN_ID" \
              --dir zenodo_staging/expansion_reconciliation
          fi

          joined="$(IFS=,; echo "${sources[*]}")"
          [ -n "$joined" ] || { echo "No selected sources staged" >&2; exit 2; }
          echo "sources=$joined" >> "$GITHUB_OUTPUT"
          echo "PASS: staged Workflow 00 run $GITHUB_RUN_ID for sources $joined"

      - name: Publish restricted Zenodo search archive
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_archive_to_zenodo.R \
            --staging-root zenodo_staging \
            --run-id "$GITHUB_RUN_ID" \
            --run-type '${{ inputs.run_type }}' \
            --search-version '${{ needs.validate-and-plan.outputs.search_version }}' \
            --sources '${{ steps.stage.outputs.sources }}' \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir outputs/updater/workflow00_zenodo

      - name: Update repository Zenodo search registry
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_update_zenodo_registry.R \
            --receipt outputs/updater/workflow00_zenodo/zenodo_receipt.json \
            --registry docs/search_record/zenodo_registry.csv \
            --pointer-dir docs/search_record/zenodo

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/search_record/zenodo_registry.csv docs/search_record/zenodo/
          if git diff --cached --quiet; then
            echo 'Zenodo registry already contains this Workflow 00 run.'
          else
            git commit -m "Register Zenodo archive for Workflow 00 run $GITHUB_RUN_ID"
            git push origin "HEAD:$WORKFLOW00_ORCHESTRATOR_BRANCH"
          fi

      - name: Upload Zenodo receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-zenodo-receipt-${{ github.run_id }}
          path: outputs/updater/workflow00_zenodo/
          retention-days: 7
          if-no-files-found: warn

