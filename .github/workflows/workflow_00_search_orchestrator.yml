      fortnightly_from_date: ${{ needs.validate-and-plan.outputs.fortnightly_from_date }}
      fortnightly_to_date: ${{ needs.validate-and-plan.outputs.fortnightly_to_date }}
      additional_search_term: ${{ inputs.additional_search_term }}
    secrets: inherit

  wos:
    needs: validate-and-plan
    if: ${{ needs.validate-and-plan.outputs.selected_wos == 'true' }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
    with:
      source: wos
      run_type: ${{ inputs.run_type }}
      query: ${{ needs.validate-and-plan.outputs.wos_query }}
