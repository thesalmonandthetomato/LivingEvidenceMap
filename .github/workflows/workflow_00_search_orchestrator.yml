      ebsco_econlit:
        required: false
        default: false
        type: boolean
      ebsco_eric:
        required: false
        default: false
        type: boolean
      ebsco_family_society:
        required: false
        default: false
        type: boolean
      ebsco_greenfile:
        required: false
        default: false
        type: boolean
      ebsco_hospitality_tourism:
        required: false
        default: false
        type: boolean
      ebsco_medline:
        required: false
        default: false
        type: boolean
      ebsco_mla:
        required: false
        default: false
        type: boolean
      ebsco_political_science:
        required: false
        default: false
        type: boolean
      ebsco_sportdiscus:
        required: false
