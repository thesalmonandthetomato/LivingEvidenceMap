        required: true
        default: false
        type: boolean
      ebsco_mla:
        description: 'Run EBSCO: MLA International Bibliography'
        required: true
        default: false
        type: boolean
      ebsco_political_science:
        description: 'Run EBSCO: Political Science Complete'
        required: true
        default: false
        type: boolean
      ebsco_sportdiscus:
        description: 'Run EBSCO: SPORTDiscus'
        required: true
        default: false
        type: boolean
      ebsco_waters_oceans:
        description: 'Run EBSCO: Waters & Oceans Worldwide'
        required: true
        default: false
        type: boolean
      additional_search_term:
        description: 'Expansion only: add one search term to the farm/aquaculture concept; species terms are immutable'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

env:
  WORKFLOW00_ORCHESTRATOR_BRANCH: workflow01-final-architecture

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    outputs:
      search_version: ${{ steps.out.outputs.search_version }}
      fortnightly_from_date: ${{ steps.out.outputs.fortnightly_from_date }}
      fortnightly_to_date: ${{ steps.out.outputs.fortnightly_to_date }}
      lens_query: ${{ steps.out.outputs.lens_query }}
      scopus_query: ${{ steps.out.outputs.scopus_query }}
      openalex_query: ${{ steps.out.outputs.openalex_query }}
      agricola_query: ${{ steps.out.outputs.agricola_query }}
      pubmed_query: ${{ steps.out.outputs.pubmed_query }}
      ethos_query: ${{ steps.out.outputs.ethos_query }}
      cba_query: ${{ steps.out.outputs.cba_query }}
      epmc_preprints_query: ${{ steps.out.outputs.epmc_preprints_query }}
      wos_query: ${{ steps.out.outputs.wos_query }}
      ebsco_africa_wide_query: ${{ steps.out.outputs.ebsco_africa_wide_query }}
      ebsco_amed_query: ${{ steps.out.outputs.ebsco_amed_query }}
      ebsco_psycinfo_query: ${{ steps.out.outputs.ebsco_psycinfo_query }}
      ebsco_atla_religion_query: ${{ steps.out.outputs.ebsco_atla_religion_query }}
      ebsco_biological_agricultural_index_query: ${{ steps.out.outputs.ebsco_biological_agricultural_index_query }}
      ebsco_cinahl_query: ${{ steps.out.outputs.ebsco_cinahl_query }}
      ebsco_communication_mass_media_query: ${{ steps.out.outputs.ebsco_communication_mass_media_query }}
      ebsco_econlit_query: ${{ steps.out.outputs.ebsco_econlit_query }}
      ebsco_eric_query: ${{ steps.out.outputs.ebsco_eric_query }}
      ebsco_family_society_query: ${{ steps.out.outputs.ebsco_family_society_query }}
      ebsco_greenfile_query: ${{ steps.out.outputs.ebsco_greenfile_query }}
      ebsco_hospitality_tourism_query: ${{ steps.out.outputs.ebsco_hospitality_tourism_query }}
      ebsco_medline_query: ${{ steps.out.outputs.ebsco_medline_query }}
      ebsco_mla_query: ${{ steps.out.outputs.ebsco_mla_query }}
      ebsco_political_science_query: ${{ steps.out.outputs.ebsco_political_science_query }}
      ebsco_sportdiscus_query: ${{ steps.out.outputs.ebsco_sportdiscus_query }}
      ebsco_waters_oceans_query: ${{ steps.out.outputs.ebsco_waters_oceans_query }}
      selected_lens: ${{ steps.selection.outputs.selected_lens }}
      selected_scopus: ${{ steps.selection.outputs.selected_scopus }}
      selected_openalex: ${{ steps.selection.outputs.selected_openalex }}
      selected_agricola: ${{ steps.selection.outputs.selected_agricola }}
      selected_pubmed: ${{ steps.selection.outputs.selected_pubmed }}
      selected_ethos: ${{ steps.selection.outputs.selected_ethos }}
      selected_cba: ${{ steps.selection.outputs.selected_cba }}
      selected_epmc_preprints: ${{ steps.selection.outputs.selected_epmc_preprints }}
      selected_wos: ${{ steps.selection.outputs.selected_wos }}
      selected_ebsco_africa_wide: ${{ steps.selection.outputs.selected_ebsco_africa_wide }}
      selected_ebsco_amed: ${{ steps.selection.outputs.selected_ebsco_amed }}
      selected_ebsco_psycinfo: ${{ steps.selection.outputs.selected_ebsco_psycinfo }}
      selected_ebsco_atla_religion: ${{ steps.selection.outputs.selected_ebsco_atla_religion }}
      selected_ebsco_biological_agricultural_index: ${{ steps.selection.outputs.selected_ebsco_biological_agricultural_index }}
      selected_ebsco_cinahl: ${{ steps.selection.outputs.selected_ebsco_cinahl }}
      selected_ebsco_communication_mass_media: ${{ steps.selection.outputs.selected_ebsco_communication_mass_media }}
      selected_ebsco_econlit: ${{ steps.selection.outputs.selected_ebsco_econlit }}
      selected_ebsco_eric: ${{ steps.selection.outputs.selected_ebsco_eric }}
      selected_ebsco_family_society: ${{ steps.selection.outputs.selected_ebsco_family_society }}
      selected_ebsco_greenfile: ${{ steps.selection.outputs.selected_ebsco_greenfile }}
      selected_ebsco_hospitality_tourism: ${{ steps.selection.outputs.selected_ebsco_hospitality_tourism }}
      selected_ebsco_medline: ${{ steps.selection.outputs.selected_ebsco_medline }}
      selected_ebsco_mla: ${{ steps.selection.outputs.selected_ebsco_mla }}
      selected_ebsco_political_science: ${{ steps.selection.outputs.selected_ebsco_political_science }}
      selected_ebsco_sportdiscus: ${{ steps.selection.outputs.selected_ebsco_sportdiscus }}
      selected_ebsco_waters_oceans: ${{ steps.selection.outputs.selected_ebsco_waters_oceans }}
      selected_sources_csv: ${{ steps.selection.outputs.selected_sources_csv }}
      selected_sources_json: ${{ steps.selection.outputs.selected_sources_json }}
    steps:
      - name: Validate run mode
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.run_type }}' in
            full|fortnightly|expansion) ;;
            *) echo 'Unsupported Workflow 00 run type' >&2; exit 2 ;;
          esac

      - name: Checkout Workflow 00 orchestration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW00_ORCHESTRATOR_BRANCH }}
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Resolve and freeze source selection
        id: selection
        env:
          W00_SELECT_LENS: ${{ inputs.lens }}
          W00_SELECT_SCOPUS: ${{ inputs.scopus }}
          W00_SELECT_OPENALEX: ${{ inputs.openalex }}
          W00_SELECT_AGRICOLA: ${{ inputs.agricola }}
          W00_SELECT_PUBMED: ${{ inputs.pubmed }}
          W00_SELECT_ETHOS: ${{ inputs.ethos }}
          W00_SELECT_CBA: ${{ inputs.cba }}
          W00_SELECT_EPMC_PREPRINTS: ${{ inputs.epmc_preprints }}
          W00_SELECT_WOS: ${{ inputs.wos }}
          W00_SELECT_EBSCO_AFRICA_WIDE: ${{ inputs.ebsco_africa_wide }}
          W00_SELECT_EBSCO_AMED: ${{ inputs.ebsco_amed }}
          W00_SELECT_EBSCO_PSYCINFO: ${{ inputs.ebsco_psycinfo }}
          W00_SELECT_EBSCO_ATLA_RELIGION: ${{ inputs.ebsco_atla_religion }}
          W00_SELECT_EBSCO_BIOLOGICAL_AGRICULTURAL_INDEX: ${{ inputs.ebsco_biological_agricultural_index }}
          W00_SELECT_EBSCO_CINAHL: ${{ inputs.ebsco_cinahl }}
          W00_SELECT_EBSCO_COMMUNICATION_MASS_MEDIA: ${{ inputs.ebsco_communication_mass_media }}
          W00_SELECT_EBSCO_ECONLIT: ${{ inputs.ebsco_econlit }}
          W00_SELECT_EBSCO_ERIC: ${{ inputs.ebsco_eric }}
          W00_SELECT_EBSCO_FAMILY_SOCIETY: ${{ inputs.ebsco_family_society }}
          W00_SELECT_EBSCO_GREENFILE: ${{ inputs.ebsco_greenfile }}
          W00_SELECT_EBSCO_HOSPITALITY_TOURISM: ${{ inputs.ebsco_hospitality_tourism }}
          W00_SELECT_EBSCO_MEDLINE: ${{ inputs.ebsco_medline }}
          W00_SELECT_EBSCO_MLA: ${{ inputs.ebsco_mla }}
          W00_SELECT_EBSCO_POLITICAL_SCIENCE: ${{ inputs.ebsco_political_science }}
          W00_SELECT_EBSCO_SPORTDISCUS: ${{ inputs.ebsco_sportdiscus }}
          W00_SELECT_EBSCO_WATERS_OCEANS: ${{ inputs.ebsco_waters_oceans }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_resolve_source_selection.R \
            --run-type '${{ inputs.run_type }}' \
            --saved data/workflow00/source_selection.json \
            --output outputs/updater/workflow00_plan/source_selection.json \
            --ebsco-config config/workflow00_ebsco_sources.json

      - name: Validate search controls and write source queries
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_search_orchestrator.R \
            --run-type '${{ inputs.run_type }}' \
            --additional-search-term '${{ inputs.additional_search_term }}' \
            --config user_input/workflow00_search_strategy.json \
            --output-dir outputs/updater/workflow00_plan

      - name: Record selected databases
        shell: Rscript {0}
        run: |
          library(jsonlite)
          p <- 'outputs/updater/workflow00_plan/search_plan.json'
          s <- 'outputs/updater/workflow00_plan/source_selection.json'
          x <- fromJSON(p, simplifyVector=FALSE)
          sel <- unlist(fromJSON(s, simplifyVector=FALSE)$selected_sources,use.names=FALSE)
          all_sources <- names(x$source_queries)
          x$selected_databases <- setNames(as.list(all_sources %in% sel),all_sources)
          x$source_selection <- fromJSON(s,simplifyVector=FALSE)
          writeLines(toJSON(x,auto_unbox=TRUE,pretty=TRUE,null='null'),p)

      - name: Export source queries
        id: out
        shell: Rscript {0}
        run: |
          library(jsonlite)
          p <- fromJSON('outputs/updater/workflow00_plan/search_plan.json')
          q <- p$source_queries
          emit <- function(name,value) {
            cat(sprintf('%s<<EOF\n%s\nEOF\n',name,value),file=Sys.getenv('GITHUB_OUTPUT'),append=TRUE)
          }
          emit('search_version',p$search_version)
          emit('fortnightly_from_date', if (is.null(p$fortnightly_window)) '' else p$fortnightly_window$from)
          emit('fortnightly_to_date', if (is.null(p$fortnightly_window)) '' else p$fortnightly_window$to)
          for (nm in names(q)) emit(paste0(nm,'_query'),q[[nm]])

      - name: Upload Workflow 00 plan
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-search-plan-${{ github.run_id }}
          path: outputs/updater/workflow00_plan/
          retention-days: 7
          if-no-files-found: error

  lens:
    needs: validate-and-plan
    if: ${{ needs.validate-and-plan.outputs.selected_lens == 'true' }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
    with:
      source: lens
      run_type: ${{ inputs.run_type }}
      query: ${{ needs.validate-and-plan.outputs.lens_query }}
      parent_run_id: ${{ github.run_id }}
      search_version: ${{ needs.validate-and-plan.outputs.search_version }}
      fortnightly_from_date: ${{ needs.validate-and-plan.outputs.fortnightly_from_date }}
      fortnightly_to_date: ${{ needs.validate-and-plan.outputs.fortnightly_to_date }}
      additional_search_term: ${{ inputs.additional_search_term }}
    secrets: inherit

  scopus:
    needs: validate-and-plan
    if: ${{ needs.validate-and-plan.outputs.selected_scopus == 'true' }}
    uses: ./.github/workflows/_workflow_00_orchestrated_source_child.yml
