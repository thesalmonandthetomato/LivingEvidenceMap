name: TEMP W08b bounded live candidate NOT filter and bibliography validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_live_candidates_20261031.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite","httr2"))'
      - name: Restore the two October published eligible-ID artifacts (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lens_previous" "$RUNNER_TEMP/openalex_previous"
          gh run download 40180695418 --repo "$GITHUB_REPOSITORY" \
            --name w08b-lens-eligible-40180695418 --dir "$RUNNER_TEMP/lens_previous"
          gh run download 40180337422 --repo "$GITHUB_REPOSITORY" \
            --name w08b-openalex-eligible-40180337422 --dir "$RUNNER_TEMP/openalex_previous"
      - name: Select at most five Lens and three OpenAlex previously eligible IDs with real provenance
        shell: Rscript {0}
        run: |
          r<-Sys.getenv("RUNNER_TEMP")
          dir.create(file.path(r,"candidate_sample"))
          sample_provider<-function(provider,root,nmax){
            ids<-read.csv(file.path(r,root,paste0("eligible_",provider,"_ids.csv")),stringsAsFactors=FALSE)
            edges<-read.csv(file.path(r,root,paste0("eligible_",provider,"_citation_edges.csv")),stringsAsFactors=FALSE)
            stopifnot(all(c("provider","related_provider_id")%in%names(ids)),
              all(c("seed_record_id","provider","related_provider_id","direction")%in%names(edges)))
            ids<-head(ids,nmax)
            stopifnot(nrow(ids)>=1L,!anyDuplicated(ids$related_provider_id))
            e<-edges[edges$related_provider_id%in%ids$related_provider_id,,drop=FALSE]
            stopifnot(nrow(e)>=nrow(ids))
            write.csv(ids,file.path(r,"candidate_sample",paste0(provider,"_ids.csv")),row.names=FALSE)
            write.csv(e,file.path(r,"candidate_sample",paste0(provider,"_edges.csv")),row.names=FALSE)
            cat("PASS: sampled ",nrow(ids)," prior-eligible ",provider," provider identities\n",sep="")
          }
          sample_provider("lens","lens_previous",5L)
          sample_provider("openalex","openalex_previous",3L)
      - name: Live Lens AND NOT farm-term and OpenAlex AND NOT farm-term searches
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/candidate_sample"
          Rscript scripts/workflow08b/lens_species_not_farming_ids.R \
            "$ROOT/lens_ids.csv" "$ROOT/lens_edges.csv" \
            user_input/workflow00_search_strategy.json "$RUNNER_TEMP/new_lens_eligible"
          Rscript scripts/workflow08b/harvest_openalex_eligible.R \
            "$ROOT/openalex_ids.csv" "$ROOT/openalex_edges.csv" \
            user_input/workflow00_search_strategy.json "$RUNNER_TEMP/new_openalex_eligible"
      - name: Retrieve full metadata for filtered candidate IDs without W01 submission
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          Rscript scripts/workflow08b/w08b_bibliography_to_w01.R \
            "$RUNNER_TEMP/new_lens_eligible/eligible_lens_ids.csv" \
            "$RUNNER_TEMP/new_openalex_eligible/eligible_openalex_ids.csv" \
            "$RUNNER_TEMP/new_lens_eligible/eligible_lens_citation_edges.csv" \
            "$RUNNER_TEMP/new_openalex_eligible/eligible_openalex_citation_edges.csv" \
            "$RUNNER_TEMP/live_bibliographies"
          test -f "$RUNNER_TEMP/live_bibliographies/lens/records.jsonl"
          test -f "$RUNNER_TEMP/live_bibliographies/openalex/openalex_sidecar_records.jsonl"
      - name: Publish aggregate test metrics only
        if: always()
        shell: Rscript {0}
        run: |
          library(jsonlite)
          r<-Sys.getenv("RUNNER_TEMP")
          get<-function(x)if(file.exists(x))fromJSON(x,simplifyVector=FALSE)else NULL
          l<-get(file.path(r,"new_lens_eligible/summary.json"))
          o<-get(file.path(r,"new_openalex_eligible/summary.json"))
          b<-get(file.path(r,"live_bibliographies/manifest.json"))
          out<-list(schema="w08b-live-candidate-validation-v1",
            lens_filter=l,openalex_filter=o,bibliography=b,
            publication_attempted=FALSE,zenodo_archive_attempted=FALSE,
            w01_w10_unchanged=TRUE)
          writeLines(toJSON(out,pretty=TRUE,auto_unbox=TRUE,null="null"),
                     "w08b_live_candidate_summary.json")
          cat("PASS: wrote aggregate candidate test summary without provider IDs\n")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w08b-live-candidate-summary
          path: w08b_live_candidate_summary.json
          retention-days: 14
          if-no-files-found: warn
