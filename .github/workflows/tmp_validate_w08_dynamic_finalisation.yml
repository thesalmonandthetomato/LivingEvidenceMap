name: Temporary - validate W08 dynamic finalisation

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'user_input/w08_dynamic_finalisation_validation.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','readr','digest'))

      - name: Parse dynamic W08 finalisation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_08_finalize_canonical_dynamic.R')
          parse(file='scripts/updater/workflow_08_partition_final_outputs_dynamic.R')
          parse(file='scripts/updater/workflow_08_migrate_legacy_geography_decisions.R')
          cat('PASS: dynamic W08 finalisation scripts parse\n')

      - name: Assert historical count locks absent
        shell: Rscript {0}
        run: |
          files<-c('scripts/updater/workflow_08_finalize_canonical_dynamic.R',
                   'scripts/updater/workflow_08_partition_final_outputs_dynamic.R')
          txt<-paste(vapply(files,function(p)paste(readLines(p,warn=FALSE),collapse='\n'),character(1)),collapse='\n')
          stopifnot(!grepl('32292|32,292|19407|19,407|19117|19,117|13175|13,175|811L|169L|521L|103L|18L',txt))
          cat('PASS: no historical population/adjudication count locks\n')

      - name: Build synthetic W03-W08 inputs
        shell: Rscript {0}
        run: |
          library(jsonlite);library(readr)
          dir.create('tmp',showWarnings=FALSE)
          rec<-function(id,title,extra)list(
            schema_version='living-evidence-map-canonical-v1',
            identity=list(record_id=id),
            canonical=list(title=title,abstract=paste('Abstract for',title),journal='Synthetic Journal',
                           future_nested_metadata=list(provider='future_source',rank=7L)),
            manifestation_refs=list(list(source='synthetic',source_record_id=paste0('src-',id))),
            new_additive_field=list(value=extra,nested=list(keep=TRUE)),
            provenance=list(workflow01=list(source='synthetic'))
          )
          canonical<-list(rec('A','Included A','alpha'),rec('B','Human species B','beta'),
                          rec('C','W04 excluded C','gamma'),rec('D','W03 excluded D','delta'))
          wr<-function(x,p){con<-file(p,'wt');for(z in x)writeLines(toJSON(z,auto_unbox=TRUE,null='null',na='null',digits=NA),con);close(con)}
          wr(canonical,'tmp/canonical.jsonl')

          w03<-list(
            list(record_id='A',publication_status=list(code='normal',exclude_from_workflow04=FALSE)),
            list(record_id='B',publication_status=list(code='normal',exclude_from_workflow04=FALSE)),
            list(record_id='C',publication_status=list(code='normal',exclude_from_workflow04=FALSE)),
            list(record_id='D',publication_status=list(code='retracted',exclude_from_workflow04=TRUE))
          )
          wr(w03,'tmp/w03.jsonl')
          w04<-list(
            list(record_id='A',screening=list(decision='retain')),
            list(record_id='B',screening=list(decision='retain')),
            list(record_id='C',screening=list(decision='exclude'))
          )
          wr(w04,'tmp/w04.jsonl')

          write_csv(data.frame(
            record_sequence=1:2,record_id=c('A','B'),
            title=c('Included A','Human species B'),
            abstract=c('Abstract for Included A','Abstract for Human species B'),
            farmed_species_codes=c('SAL_SALAR','NONE'),
            farmed_species=c('Atlantic salmon','NONE'),
            stringsAsFactors=FALSE
          ),'tmp/w05.csv',na='')
          write_csv(data.frame(record_id=character(),coding=character(),matched_term=character(),stringsAsFactors=FALSE),
                    'tmp/w05_matches.csv',na='')

          write_csv(data.frame(
            record_id=c('A','B'),
            geography_status=c('RESOLVED','NONE'),
            luna_iso3c=c('NOR',''),
            luna_country_names=c('Norway',''),
            luna_evidence=c('Norway',''),
            geography_reason=c('Synthetic Norway','No country'),
            stringsAsFactors=FALSE
          ),'tmp/w06.csv',na='')

          onto<-read_csv('data/reference/topic_ontology_v3_6.csv',show_col_types=FALSE)
          pid<-as.character(onto$path_id[[1]])
          hp<-as.character(onto$hierarchy_path[[1]])
          write_csv(data.frame(
            record_id='A',path_id=pid,hierarchy_path=hp,
            confidence_n=3L,confidence_label='3/3',stars='★★★',
            role_a='PRIMARY',role_b='PRIMARY',role_c='PRIMARY',
            reason_a='synthetic',reason_b='synthetic',reason_c='synthetic',
            retained_for_analysis=TRUE,retention_basis='synthetic',
            stringsAsFactors=FALSE
          ),'tmp/w07_scores.csv',na='')
          write_csv(data.frame(record_id=c('A','B'),stringsAsFactors=FALSE),'tmp/w07_qc.csv',na='')
          write_csv(data.frame(record_id=character(),stringsAsFactors=FALSE),'tmp/w07_late.csv',na='')

          decisions<-list(list(
            review_key='B::species_none',record_id='B',issue_type='species_none',
            decision='assign_unspecified_species',
            final_value=list(farmed_species=list('Unspecified species')),
            rationale='Synthetic adjudication',reviewer='Neal Haddaway',
            resolved_at_utc='2026-09-30T00:00:00Z',
            issue_state_sha256='synthetic'
          ))
          wr(decisions,'tmp/decisions.jsonl')

      - name: Run dynamic W08 finalisation and partition
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_08_finalize_canonical_dynamic.R             --canonical tmp/canonical.jsonl             --w03 tmp/w03.jsonl             --w04 tmp/w04.jsonl             --w05 tmp/w05.csv             --w05-matches tmp/w05_matches.csv             --w06 tmp/w06.csv             --w07-scores tmp/w07_scores.csv             --w07-qc tmp/w07_qc.csv             --w07-late-exclusions tmp/w07_late.csv             --decisions tmp/decisions.jsonl             --ontology data/reference/topic_ontology_v3_6.csv             --output tmp/all.jsonl             --ledger tmp/ledger.jsonl             --manifest tmp/post_manifest.json

          Rscript scripts/updater/workflow_08_partition_final_outputs_dynamic.R             --assembled tmp/all.jsonl             --old-manifest tmp/post_manifest.json             --canonical-output tmp/final.jsonl             --exclusions-output tmp/exclusions.csv             --manifest-output tmp/final_manifest.json

      - name: Validate accounting and schema preservation
        shell: Rscript {0}
        run: |
          library(jsonlite);library(readr)
          m<-fromJSON('tmp/final_manifest.json')
          stopifnot(m$source_canonical_population==4L,m$canonical_records==2L,m$excluded_records==2L)
          stopifnot(m$exclusions_by_stage$workflow03==1L,m$exclusions_by_stage$workflow04==1L,
                    m$exclusions_by_stage$workflow07_late==0L,m$exclusions_by_stage$workflow08==0L)

          x<-readLines('tmp/final.jsonl',warn=FALSE);x<-x[nzchar(trimws(x))]
          stopifnot(length(x)==2L)
          rr<-lapply(x,fromJSON,simplifyVector=FALSE)
          ids<-vapply(rr,function(z)z$identity$record_id,character(1))
          stopifnot(setequal(ids,c('A','B')))
          for(z in rr){
            stopifnot(isTRUE(z$new_additive_field$nested$keep))
            stopifnot(z$canonical$future_nested_metadata$provider=='future_source')
            stopifnot(z$manifestation_refs[[1]]$source=='synthetic')
            stopifnot(z$provenance$workflow01$source=='synthetic')
          }
          b<-rr[[match('B',ids)]]
          stopifnot(identical(b$species$codes,'UNSPEC_SALMON'))
          stopifnot(identical(b$species$source,'workflow08_human'))

          ex<-read_csv('tmp/exclusions.csv',show_col_types=FALSE)
          stopifnot(setequal(ex$record_id,c('C','D')))
          cat('PASS: W08 dynamic finalisation, accounting and schema preservation\n')
