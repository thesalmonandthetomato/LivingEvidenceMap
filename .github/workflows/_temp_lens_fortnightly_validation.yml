name: TEMP Lens fortnightly validation

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/_temp_lens_fortnightly_validation.yml

permissions:
  contents: write
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/workflow_00_search_orchestrator.yml
    with:
      run_type: fortnightly
      lens: true
      scopus: false
      openalex: false
      agricola: false
      wos: false
      additional_farm_term: ''
      resume_run_id: ''
    secrets: inherit

# rerun after limiting Lens sentinel to full searches
