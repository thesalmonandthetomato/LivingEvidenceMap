name: Review sheet preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-sheet-preflight.yml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install Sheets dependency
        shell: Rscript {0}
        run: install.packages('googlesheets4')
      - name: Read-only inspection
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          chmod 600 "$RUNNER_TEMP/service-account.json"
          Rscript scripts/updater/workflow_00_initialise_review_tabs.R --sheet-id 1wii1QjB4jM9OzOqboIgZn4z8CAN7W4EAyIKIyGcGjeU --credential "$RUNNER_TEMP/service-account.json" --review-id almeria-map
