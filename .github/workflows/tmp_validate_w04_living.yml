name: Temporary - validate W04 living architecture

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'user_input/w04_living_validation.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('yaml','jsonlite','digest'))

      - name: Parse permanent implementation
        shell: Rscript {0}
        run: |
          yaml::read_yaml('.github/workflows/workflow_04_production.yml')
          parse(file='scripts/updater/workflow_04_prepare_incremental.R')
          parse(file='scripts/updater/workflow_04_luna_consensus.R')
          parse(file='scripts/updater/workflow_04_merge_consensus.R')
          parse(file='scripts/updater/workflow_04_merge_incremental.R')
          parse(file='scripts/updater/workflow_04_archive_state_to_zenodo.R')
          cat('PASS: W04 permanent implementation parses\n')

      - name: Build synthetic first-run inputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create('tmp/first',recursive=TRUE)
          rec <- function(id,title,abstract,extra) list(
            schema_version='living-evidence-map-canonical-v1',
            identity=list(record_id=id),
            canonical=list(title=title,abstract=abstract,journal='Aquaculture'),
            new_additive_field=list(value=extra,nested=list(keep=TRUE))
          )
          can <- list(
            rec('A','Atlantic salmon farming','Farmed Atlantic salmon production','alpha'),
            rec('B','Rainbow trout diets','Commercial farm diet trial','beta'),
            rec('C','Retracted salmon paper','Salmon farming','gamma')
          )
          w03 <- list(
            list(record_id='A',publication_status=list(code='normal',exclude_from_workflow04=FALSE)),
            list(record_id='B',publication_status=list(code='normal',exclude_from_workflow04=FALSE)),
            list(record_id='C',publication_status=list(code='retracted',exclude_from_workflow04=TRUE))
          )
          write_jsonl <- function(x,p){con<-file(p,'wt');on.exit(close(con));for(z in x)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con)}
          write_jsonl(can,'tmp/first/canonical.jsonl')
          write_jsonl(w03,'tmp/first/w03.jsonl')

      - name: Prepare first run
        shell: bash
        run: |
          Rscript scripts/updater/workflow_04_prepare_incremental.R             --canonical tmp/first/canonical.jsonl             --workflow03-status tmp/first/w03.jsonl             --output-dir tmp/first/prepare
          Rscript -e 'x<-jsonlite::fromJSON("tmp/first/prepare/prepare_manifest.json");stopifnot(x$mode=="first_run",x$workflow03_eligible==2L,x$reusable_records==0L,x$screen_queue_records==2L)'

      - name: Create synthetic first-run screening and merge
        shell: Rscript {0}
        run: |
          library(jsonlite)
          q<-read.csv('tmp/first/prepare/screen_queue_manifest.csv',stringsAsFactors=FALSE)
          rows<-lapply(seq_len(nrow(q)),function(i)list(
            record_id=q$record_id[[i]],
            screening=list(
              decision=if(q$record_id[[i]]=='A')'retain' else 'exclude',
              decision_origin='synthetic_luna_consensus',
              requires_human_review=FALSE,
              screening_input_sha256=q$screening_input_sha256[[i]]
            )
          ))
          con<-file('tmp/first/new.jsonl','wt');for(z in rows)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con);close(con)
          system2(file.path(R.home('bin'),'Rscript'),c(
            'scripts/updater/workflow_04_merge_incremental.R',
            '--canonical','tmp/first/canonical.jsonl',
            '--workflow03-status','tmp/first/w03.jsonl',
            '--reused-layer','tmp/first/prepare/reused_workflow04_layer.jsonl',
            '--new-consensus','tmp/first/new.jsonl',
            '--prepare-manifest','tmp/first/prepare/prepare_manifest.json',
            '--output-dir','tmp/first/final'
          ))
          s<-fromJSON('tmp/first/final/summary.json')
          stopifnot(s$status=='PASS',s$final_retain==1L,s$final_exclude==1L)
          out<-readLines('tmp/first/final/workflow04_included_canonical.jsonl')
          a<-fromJSON(out[[1]],simplifyVector=FALSE)
          stopifnot(a$new_additive_field$value=='alpha',isTRUE(a$new_additive_field$nested$keep))
          cat('PASS: synthetic first-run mode and additive-field preservation\n')

      - name: Build and test synthetic update
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create('tmp/update',recursive=TRUE)
          rec <- function(id,title,abstract,extra) list(
            schema_version='living-evidence-map-canonical-v1',
            identity=list(record_id=id),
            canonical=list(title=title,abstract=abstract,journal='Aquaculture'),
            new_additive_field=list(value=extra,nested=list(keep=TRUE))
          )
          can <- list(
            rec('A','Atlantic salmon farming','Farmed Atlantic salmon production','alpha-v2'),
            rec('B','Rainbow trout diets','UPDATED commercial farm diet trial','beta-v2'),
            rec('C','Retracted salmon paper','Salmon farming','gamma-v2'),
            rec('D','Chinook salmon cages','Commercial Chinook cage production','delta')
          )
          w03 <- list(
            list(record_id='A',publication_status=list(code='normal',exclude_from_workflow04=FALSE)),
            list(record_id='B',publication_status=list(code='normal',exclude_from_workflow04=FALSE)),
            list(record_id='C',publication_status=list(code='retracted',exclude_from_workflow04=TRUE)),
            list(record_id='D',publication_status=list(code='normal',exclude_from_workflow04=FALSE))
          )
          write_jsonl <- function(x,p){con<-file(p,'wt');on.exit(close(con));for(z in x)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con)}
          write_jsonl(can,'tmp/update/canonical.jsonl')
          write_jsonl(w03,'tmp/update/w03.jsonl')
          status<-system2(file.path(R.home('bin'),'Rscript'),c(
            'scripts/updater/workflow_04_prepare_incremental.R',
            '--canonical','tmp/update/canonical.jsonl',
            '--workflow03-status','tmp/update/w03.jsonl',
            '--prior-workflow04','tmp/first/final/workflow04_final_screening_layer.jsonl',
            '--output-dir','tmp/update/prepare'
          ))
          stopifnot(status==0L)
          p<-fromJSON('tmp/update/prepare/prepare_manifest.json')
          stopifnot(p$mode=='update',p$workflow03_eligible==3L,p$reusable_records==1L,p$screen_queue_records==2L,p$new_record_ids==1L,p$changed_screening_input==1L)
          reuse<-readLines('tmp/update/prepare/reused_record_ids.txt');stopifnot(identical(reuse,'A'))
          q<-read.csv('tmp/update/prepare/screen_queue_manifest.csv',stringsAsFactors=FALSE)
          stopifnot(setequal(q$record_id,c('B','D')))
          rows<-lapply(seq_len(nrow(q)),function(i)list(
            record_id=q$record_id[[i]],
            screening=list(decision='retain',decision_origin='synthetic_luna_consensus',requires_human_review=FALSE,screening_input_sha256=q$screening_input_sha256[[i]])
          ))
          con<-file('tmp/update/new.jsonl','wt');for(z in rows)writeLines(toJSON(z,auto_unbox=TRUE,null='null'),con);close(con)
          status<-system2(file.path(R.home('bin'),'Rscript'),c(
            'scripts/updater/workflow_04_merge_incremental.R',
            '--canonical','tmp/update/canonical.jsonl',
            '--workflow03-status','tmp/update/w03.jsonl',
            '--reused-layer','tmp/update/prepare/reused_workflow04_layer.jsonl',
            '--new-consensus','tmp/update/new.jsonl',
            '--prepare-manifest','tmp/update/prepare/prepare_manifest.json',
            '--output-dir','tmp/update/final'
          ))
          stopifnot(status==0L)
          s<-fromJSON('tmp/update/final/summary.json')
          stopifnot(s$status=='PASS',s$reused_records==1L,s$newly_screened_records==2L,s$final_retain==3L)
          out<-readLines('tmp/update/final/workflow04_included_canonical.jsonl')
          rr<-lapply(out,fromJSON,simplifyVector=FALSE)
          ids<-vapply(rr,function(z)z$identity$record_id,character(1))
          d<-rr[[match('D',ids)]]
          stopifnot(d$new_additive_field$value=='delta',isTRUE(d$new_additive_field$nested$keep))
          cat('PASS: synthetic update mode, changed-record detection and schema preservation\n')
