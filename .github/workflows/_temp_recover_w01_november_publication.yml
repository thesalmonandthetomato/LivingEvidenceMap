name: TEMP validate W04 protected overlay and dispatch historic production
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_recover_w01_november_publication.yml']
permissions:
  contents: read
  actions: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest","httr2","stringi"))
      - name: Restore verified current lean canonical
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inputs/current
          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R --pointer docs/compaction/zenodo/run-45886317416.json --output-dir inputs/current/canonical
          cp "$(find inputs/current/canonical -name canonical_lean.jsonl -type f -print -quit)" inputs/current/canonical_lean.raw.jsonl
      - name: Validate corrected production overlay against all 157 records
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          HUMAN_CORRECTIONS_POINTER: ${{ github.workspace }}/docs/workflow04/human_abstract_corrections/run-37511638503.json
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_04_restore_protected_abstracts_current.R
          test "$(wc -l < outputs/human_overlay/audit.jsonl)" -eq 157
          Rscript -e 'library(jsonlite);a<-lapply(readLines("outputs/human_overlay/audit.jsonl"),fromJSON);stopifnot(length(unique(vapply(a,function(x)x$current_record_id,character(1))))==157L,identical(a[[111]]$current_record_id,"work-b7bef45da9c316ca"),identical(a[[111]]$identity_basis,"stable_record_id_unique_terminal_punctuation_title"));cat("PASS: all 157 protected corrections uniquely overlaid\\n")'
      - name: Dispatch original W04 production after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_W04="$(Rscript -e 'x<-jsonlite::fromJSON("docs/current_run/current_run_status.json");cat(x$baseline$workflow04_pointer)')"
          PREV_LEAN="$(Rscript -e 'x<-jsonlite::fromJSON("docs/current_run/current_run_status.json");cat(x$baseline$lean_pointer)')"
          test -s "$PREV_W04"
          test -s "$PREV_LEAN"
          gh workflow run workflow_04_production.yml --repo "$GITHUB_REPOSITORY" --ref workflow01-final-architecture -f lean_pointer_path=docs/compaction/zenodo/run-45886317416.json -f workflow03_pointer_path=docs/publication_status/zenodo/run-45891636461.json -f prior_workflow04_pointer_path="$PREV_W04" -f prior_lean_pointer_path="$PREV_LEAN" -f publish=true
