name: TEMP submit user-authorised W02 matches and resume historic updater
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_recover_w01_november_publication.yml']
permissions:
  contents: read
  actions: write
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("googlesheets4","jsonlite","digest"))
      - name: Append authorised decisions without replacing existing definitive decisions
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: Rscript {0}
        run: |
          library(googlesheets4)
          library(jsonlite)
          library(digest)
          ss <- "1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA"
          sha <- "7253ee6a39e709fb70bba4e0af12fffaec019a142f12b593264f645ca56e4a02"
          batch <- "w02-run-45861367261"
          cred <- tempfile()
          writeLines(Sys.getenv("LEM_GOOGLE_SERVICE_ACCOUNT_JSON"),cred)
          Sys.chmod(cred,"0600")
          gs4_auth(path=cred,cache=FALSE)
          q <- read_sheet(ss,sheet="queue_w02_active",col_types="c")
          q <- q[order(as.integer(q$case_index)),]
          stopifnot(nrow(q)==160L,all(q$batch_id==batch),all(q$queue_sha256==sha),!anyDuplicated(q$review_case_id),identical(digest(paste0(paste(q$case_json,collapse="\n"),"\n"),algo="sha256",serialize=FALSE),sha))
          cases <- lapply(q$case_json,fromJSON,simplifyVector=FALSE)
          norm <- function(x) sub("^https?://(dx\\.)?doi\\.org/","",tolower(trimws(as.character(x))),perl=TRUE)
          for(i in seq_along(cases)){
            z <- cases[[i]]
            stopifnot(identical(z$review_case_id,q$review_case_id[i]),identical(z$field,"abstract"),identical(z$provider,"europe_pmc"),z$reason %in% c("title_guard_failed","title_mismatch"),length(z$provider_response$abstract)==1L,nzchar(z$provider_response$abstract),length(z$provider_response$returned_doi)==1L,identical(norm(z$doi),norm(z$provider_response$returned_doi)))
          }
          cols <- c("decision_id","review_case_id","record_id","provider","field","reason","decision","note","reviewer","resolved_at_utc","queue_sha256","supersedes_decision_id")
          active <- function(){
            d <- read_sheet(ss,sheet="decisions_w02",col_types="c")
            stopifnot(all(cols %in% names(d)))
            d <- d[which(d$queue_sha256==sha),cols,drop=FALSE]
            if(nrow(d)){
              t <- as.POSIXct(d$resolved_at_utc,format="%Y-%m-%dT%H:%M:%SZ",tz="UTC")
              stopifnot(!anyNA(t),all(d$review_case_id %in% q$review_case_id))
              d <- d[order(t,seq_len(nrow(d)),decreasing=TRUE),]
              d <- d[!duplicated(d$review_case_id),]
            }
            d
          }
          d <- active()
          keep <- d$review_case_id[d$decision %in% c("accept_provider_field","reject_provider_field","reject_provider_match")]
          missing <- which(!q$review_case_id %in% keep)
          if(length(missing)){
            rows <- lapply(missing,function(i){
              z <- cases[[i]]
              old <- d$decision_id[match(z$review_case_id,d$review_case_id)]
              data.frame(decision_id=paste0("w02-bulk-",digest(paste(sha,z$review_case_id,sep="|"),algo="sha256",serialize=FALSE)),review_case_id=z$review_case_id,record_id=z$record_id,provider=z$provider,field=z$field,reason=z$reason,decision="accept_provider_field",note="AI-assisted title review; bulk acceptance explicitly authorised by project administrator; exact DOI checked.",reviewer="AI-assisted administrator-authorised bulk review",resolved_at_utc=format(Sys.time(),tz="UTC",format="%Y-%m-%dT%H:%M:%SZ"),queue_sha256=sha,supersedes_decision_id=if(length(old)&&!is.na(old))old else "",stringsAsFactors=FALSE)
            })
            sheet_append(ss,sheet="decisions_w02",data=do.call(rbind,rows)[,cols])
          }
          v <- active()
          stopifnot(nrow(v)==160L,setequal(v$review_case_id,q$review_case_id),all(v$decision %in% c("accept_provider_field","reject_provider_field")))
          for(i in seq_along(cases)){
            z <- cases[[i]]; a <- v[match(z$review_case_id,v$review_case_id),]
            stopifnot(identical(a$record_id,z$record_id),identical(a$provider,z$provider),identical(a$field,z$field),identical(a$reason,z$reason))
          }
          cat(sprintf("PASS: %d existing definitive decisions preserved; %d appended; all 160 resolved\n",length(keep),length(missing)))
          stopifnot(system2("Rscript",c("scripts/updater/workflow_shiny_batch_status.R","--stage","02","--batch-id",batch,"--queue-sha256",sha,"--status","review_complete","--sheet-id",ss,"--credential",cred,"--source-run-id","45861367261"))==0L)
          unlink(cred)
      - name: Start historic W02 resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run workflow_02_resume_after_human_review.yml --repo "$GITHUB_REPOSITORY" --ref workflow01-final-architecture -f source_run_id=45861367261 -f publish=true -f validation_only=false
