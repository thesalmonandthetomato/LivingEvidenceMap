name: TEMP dispatch historic W02 after dependency fix
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/_temp_recover_w01_november_publication.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch unchanged historic production entry point
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s docs/deduplication/zenodo/run-45459473670.json
          test -s docs/enrichment/zenodo/run-40289685551.json
          grep -F "'data.table','readr'" .github/workflows/workflow_02_batched.yml
          gh workflow run workflow_02_batched_production.yml --repo "$GITHUB_REPOSITORY" --ref workflow01-final-architecture -f workflow01_pointer_path=docs/deduplication/zenodo/run-45459473670.json -f previous_workflow02_pointer_path=docs/enrichment/zenodo/run-40289685551.json
