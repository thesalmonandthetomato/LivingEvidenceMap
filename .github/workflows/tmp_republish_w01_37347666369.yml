name: Temporary republish frozen W01 queue 37347666369

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_republish_w01_37347666369.yml'

permissions:
  contents: read
  actions: read

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install minimal dependencies
        shell: Rscript {0}
        run: install.packages(c("googlesheets4","jsonlite","digest"))

      - name: Download immutable source W01 review artifact
        uses: actions/download-artifact@v4
        with:
          name: workflow01-human-review-37347666369
          path: replay/human_review_package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: thesalmonandthetomato/LivingEvidenceMap
          run-id: 37347666369

      - name: Republish frozen W01 queue and lifecycle to definitive Shiny sheet
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'
        shell: bash
        run: |
          set -euo pipefail
          test -s replay/human_review_package/human_review_cases.jsonl
          test -s replay/human_review_package/review_manifest.json
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"

          Rscript scripts/updater/workflow_01_publish_human_review_queue_to_shiny.R             --queue replay/human_review_package/human_review_cases.jsonl             --manifest replay/human_review_package/review_manifest.json             --sheet-id "$LEM_GOOGLE_SHEET_ID"             --tab queue_w01_active             --source-run-id 37347666369             --credential "$RUNNER_TEMP/lem-google-service-account.json"

          QUEUE_SHA="$(Rscript -e 'x<-jsonlite::fromJSON("replay/human_review_package/review_manifest.json");cat(as.character(x$queue_sha256))')"
          Rscript scripts/updater/workflow_shiny_batch_status.R             --stage 01             --batch-id w01-run-37347666369             --queue-sha256 "$QUEUE_SHA"             --status published             --sheet-id "$LEM_GOOGLE_SHEET_ID"             --credential "$RUNNER_TEMP/lem-google-service-account.json"             --workflow-run-id "$GITHUB_RUN_ID"             --source-run-id 37347666369             --message "Republished immutable W01 human-review package from source run 37347666369 to authoritative production Sheet."

      - name: Sync current-run status to definitive Shiny sheet
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: '1e9-V67-8lwPO6YBqeGJWn-SFanWSze5Gi2ToKR4bXvA'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          Rscript scripts/updater/workflow_current_run_status_to_shiny.R             --status docs/current_run/current_run_status.json             --sheet-id "$LEM_GOOGLE_SHEET_ID"             --credential "$RUNNER_TEMP/lem-google-service-account.json"
