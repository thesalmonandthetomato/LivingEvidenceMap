name: W01-Fast isolated routing, handoff and preparation smoke
on:
  push:
    branches: [w01-fast-direct-delta]
    paths: ['.github/workflows/w01_fast_routing_contract_smoke.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-direct-delta
          persist-credentials: false
      - name: Verify routing source contract without expression interpolation
        run: python3 scripts/updater/experimental_w01_fast/test_routing_contract.py
