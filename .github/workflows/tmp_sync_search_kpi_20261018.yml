name: Temporary sync corrected cumulative search KPI
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_sync_search_kpi_20261018.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workflow01-final-architecture}
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: release, use-public-rspm: true}
      - run: Rscript -e 'install.packages(c("jsonlite","digest","readr","httr2","googlesheets4"))'
      - name: Validate reconciled cumulative search results
        shell: Rscript {0}
        run: |
          library(jsonlite)
          f <- fromJSON("docs/reporting/workflow_09/flow_counts.json",simplifyVector=FALSE)
          s <- fromJSON("docs/current_run/current_run_status.json",simplifyVector=FALSE)
          stopifnot(as.integer(f$counts$combined_search_results)==135566L)
          stopifnot(as.integer(s$baseline$previous_counts$search_results)==135566L)
          stopifnot(as.integer(s$counts$search_results)==as.integer(f$counts$combined_search_results)+as.integer(s$search$search_results))
          stopifnot(as.integer(s$counts$search_results)>100000L)
          cat("PASS:",s$counts$search_results,"cumulative records\n")
      - name: Update current-run KPI in Shiny backing sheet
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEM_GOOGLE_SHEET_ID: 1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          chmod 600 "$RUNNER_TEMP/service-account.json"
          Rscript scripts/updater/workflow_current_run_status_to_shiny.R --status docs/current_run/current_run_status.json --sheet-id "$LEM_GOOGLE_SHEET_ID" --credential "$RUNNER_TEMP/service-account.json"
