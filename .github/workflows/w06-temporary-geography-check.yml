name: W06 temporary geography validation
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w06-temporary-geography-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest","dplyr","readr","tibble","stringr","countrycode"))
      - name: Test deterministic country matcher and assignment
        shell: Rscript {0}
        run: |
          library(dplyr)
          source("R/geography_detect.R")
          source("R/geography_primary_country.R")
          records <- tibble(record_sequence=1:2,record_id=c("n","u"),title=c("Field sampling in Norway","No location stated"),abstract=c("Observations from farms in Norway","Laboratory methods"))
          gazetteer <- tibble(matched_place="Norway",normalised_match="norway",country_name="Norway",iso3c="NOR",region_name="Europe")
          mentions <- detect_geography_mentions(records,gazetteer,progress=FALSE)
          stopifnot(any(mentions$record_id=="n" & mentions$iso3c=="NOR"),!any(mentions$record_id=="u"))
          assigned <- assign_primary_country(mentions)
          stopifnot(any(assigned$summary$record_id=="n"))
          cat("PASS: real W06 functions detect Norway and ignore records without place names\n")
      - name: Check geography evidence validation
        shell: Rscript {0}
        run: |
          source("R/geography_grounding.R")
          stopifnot(isTRUE(geography_evidence_is_grounded("sampling in Norway","Observations from sampling in Norway","")))
          stopifnot(!isTRUE(geography_evidence_is_grounded("sampling in Chile","Observations from Norway","")))
          cat("PASS: supported and unsupported geographic evidence distinguished\n")
