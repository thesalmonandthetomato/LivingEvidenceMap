name: W06 temporary geography validation
on:
  push:
    branches: [production-minimal]
    paths: ['.github/workflows/w06-temporary-geography-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest","dplyr","readr","tibble","stringr","countrycode"))
      - name: Test W06 deterministic identification
        shell: Rscript {0}
        run: |
          library(jsonlite)
          root<-file.path(Sys.getenv("RUNNER_TEMP"),"w06-geo")
          dir.create(root)
          rows<-list(list(identity=list(record_id="n"),canonical=list(title="Farm sampling in Norway",abstract="Observations were made in Norway.")),list(identity=list(record_id="u"),canonical=list(title="No locations mentioned",abstract="This is a laboratory methods article.")))
          writeLines(vapply(rows,function(r)toJSON(r,auto_unbox=TRUE,null="null"),character(1)),file.path(root,"retained.jsonl"))
          cmd<-c("scripts/updater/workflow_06_prepare_current_inputs.R","--input",file.path(root,"retained.jsonl"),"--output-dir",file.path(root,"det"))
          stopifnot(system2("Rscript",cmd)==0L)
          d<-readr::read_csv(file.path(root,"det/records_for_geography.csv"),show_col_types=FALSE)
          stopifnot(nrow(d)==2L,identical(d$record_id,c("n","u")),grepl("NOR",d$deterministic_primary_iso3c[1],fixed=TRUE))
          cat("PASS: retained record coverage and deterministic Norway identification\n")
      - name: Check geography evidence validation
        shell: Rscript {0}
        run: |
          source("R/geography_grounding.R")
          stopifnot(isTRUE(geography_evidence_is_grounded("sampling in Norway","Observations from sampling in Norway","")))
          stopifnot(!isTRUE(geography_evidence_is_grounded("sampling in Chile","Observations from Norway","")))
          cat("PASS: supported and unsupported geographic evidence distinguished\n")
