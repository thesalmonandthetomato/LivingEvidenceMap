name: TEMP W00 offline update validation
on:
  push:
    branches: [production-minimal]
    paths: [.github/workflows/w00-temp-update-validation.yml]
permissions:
  contents: read
jobs:
  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install jsonlite
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Test update query generation without API calls
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          Rscript scripts/updater/workflow_00_search_orchestrator.R --run-type full --output-dir "$tmp/full"
          Rscript scripts/updater/workflow_00_search_orchestrator.R --run-type fortnightly --output-dir "$tmp/fortnightly"
          printf '{"selected_sources":["lens","scopus","agricola","ebsco_medline"]}\n' > "$tmp/selection.json"
          Rscript scripts/updater/workflow_00_translate_generic.R --run-type expansion --expansion-target farming --additional-search-term "offshore*" --config user_input/workflow00_search_strategy.salmon_equivalence_candidate.json --source-selection "$tmp/selection.json" --output-dir "$tmp/expansion"
          Rscript - "$tmp" <<'RS'
          root<-commandArgs(TRUE)[[1L]]
          full<-jsonlite::fromJSON(file.path(root,"full","source_queries.json"),simplifyVector=FALSE)
          fortnight<-jsonlite::fromJSON(file.path(root,"fortnightly","source_queries.json"),simplifyVector=FALSE)
          expansion<-jsonlite::fromJSON(file.path(root,"expansion","source_queries.json"),simplifyVector=FALSE)
          stopifnot(length(full)==26L,setequal(names(full),names(fortnight)))
          for(n in names(full)){
            stopifnot(is.character(fortnight[[n]]),nzchar(fortnight[[n]]))
            cat("PASS fortnightly query ",n,"\n",sep="")
          }
          stopifnot(all(vapply(expansion,function(q)grepl("offshore*",q,fixed=TRUE)&&grepl("NOT",q,fixed=TRUE),logical(1))))
          cat("PASS expansion adds one concept term and excludes original across four sources\n")
          RS
