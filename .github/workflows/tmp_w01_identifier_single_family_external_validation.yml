name: TEMP W01 identifier single-family external validation

on:
  push:
    branches:
      - w01-identifier-assist-test
    paths:
      - '.github/workflows/tmp_w01_identifier_single_family_external_validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-identifier-assist-test
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('data.table','jsonlite','httr2','stringi'))

      - name: Download full-corpus benchmark artefact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w01_single_ext/input /tmp/w01_single_ext/out
          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11220721964/zip"             > /tmp/w01_single_ext/benchmark.zip
          unzip -q /tmp/w01_single_ext/benchmark.zip -d /tmp/w01_single_ext/input

      - name: Validate non-strong single-family disagreements
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_01_identifier_single_family_external_validation.R             --pairs /tmp/w01_single_ext/input/different_cluster_identifier_pairs.csv             --registry /tmp/w01_single_ext/input/identifier_registry.csv             --output-dir /tmp/w01_single_ext/out
          cat /tmp/w01_single_ext/out/single_family_external_validation_summary.csv

      - name: Assert read-only scope
        shell: Rscript {0}
        run: |
          library(data.table)
          x <- fread('/tmp/w01_single_ext/out/single_family_external_validation.csv')
          stopifnot(nrow(x)==502L)
          stopifnot(all(x$family %in% c('doi','pmid','openalex_mag')))
          cat('PASS: 502 non-strong single-family disagreements externally validated; no production changes\n')

      - name: Upload external validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: w01-identifier-single-family-external-validation-${{ github.run_id }}
          path: /tmp/w01_single_ext/out/
          retention-days: 30
          if-no-files-found: error
