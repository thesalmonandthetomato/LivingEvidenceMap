name: Workflow 03 - Publication status

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Records to scan; 0 = all 32,292'
        required: true
        default: '20'
        type: string
      batch_size:
        description: 'DOIs per OpenAlex OR-filter request (max 100)'
        required: true
        default: '100'
        type: string
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/publication_status/.run_workflow03_trial'

permissions:
  contents: read
  actions: read

jobs:
  publication-status:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2'))

      - name: Parse Workflow 03 scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_03_restore_lean_checkpoint.R')
          parse(file='scripts/updater/workflow_03_publication_status.R')
          cat('PASS: Workflow 03 scripts parse\n')

      - name: Restore Workflow 03 lean canonical checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R \
            --pointer docs/compaction/zenodo/run-36166883249.json \
            --output-dir workflow03_input
          SHA="$(Rscript -e 'cat(digest::digest(file="workflow03_input/canonical_lean.jsonl",algo="sha256",serialize=FALSE))')"
          test "$SHA" = "1d3977537c1498a728c9fe04ff958874f4a7727ad344a02ba3ef00adb2f755c7"

      - name: Run publication-status scan
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LIMIT: ${{ inputs.limit || '20' }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow03
          Rscript scripts/updater/workflow_03_publication_status.R \
            --input workflow03_input/canonical_lean.jsonl \
            --output outputs/workflow03/publication_status.jsonl \
            --audit outputs/workflow03/api_audit.jsonl \
            --report outputs/workflow03/report.json \
            --limit "$LIMIT" \
            --batch-size "$BATCH_SIZE"

      - name: Validate Workflow 03 output
        env:
          LIMIT: ${{ inputs.limit || '20' }}
        shell: Rscript {0}
        run: |
          library(jsonlite)
          x<-fromJSON('outputs/workflow03/report.json',simplifyVector=FALSE)
          stopifnot(x$status=='PASS')
          expected<-as.integer(Sys.getenv('LIMIT'))
          if(expected>0L) stopifnot(as.integer(x$records_scanned)==expected)
          if(expected==0L) stopifnot(as.integer(x$records_scanned)==32292L)
          allowed<-c('normal','retracted','withdrawn','corrected','expression_of_concern','warning')
          counts<-unlist(x$code_counts)
          stopifnot(all(names(counts)%in%allowed),sum(as.integer(counts))==as.integer(x$records_scanned))
          cat('PASS: Workflow 03 output schema/count validation complete\n')

      - name: Upload Workflow 03 trial state
        uses: actions/upload-artifact@v4
        with:
          name: workflow03-publication-status-${{ github.run_id }}
          path: |
            outputs/workflow03/
            workflow03_input/workflow03_restore_audit.json
          retention-days: 30
          if-no-files-found: error
