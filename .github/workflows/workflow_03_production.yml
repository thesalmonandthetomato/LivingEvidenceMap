name: Workflow 03 - Publication status

on:
  workflow_call:
    inputs:
      limit:
        required: false
        default: '0'
        type: string
      batch_size:
        required: false
        default: '100'
        type: string
      publish:
        required: false
        default: true
        type: boolean
      lean_pointer_path:
        required: false
        default: 'docs/compaction/zenodo/run-36166883249.json'
        type: string
    secrets:
      ZENODO_ACCESS_TOKEN:
        required: true
      OPENALEX_API_KEY:
        required: false
    outputs:
      pointer_path:
        description: 'Authoritative Workflow 03 Zenodo pointer path when a full state is published'
        value: ${{ jobs.publication-status.outputs.pointer_path }}

  workflow_dispatch:
    inputs:
      limit:
        description: 'Records to scan; 0 = all 32,292'
        required: true
        default: '20'
        type: string
      batch_size:
        description: 'DOIs per OpenAlex OR-filter request (max 100)'
        required: true
        default: '100'
        type: string
      publish:
        description: 'Publish a validated full run to restricted Zenodo'
        required: true
        default: false
        type: boolean
      lean_pointer_path:
        description: 'Authoritative post-W02 lean canonical pointer'
        required: false
        default: 'docs/compaction/zenodo/run-36166883249.json'
        type: string

  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/publication_status/.run_workflow03_full'

permissions:
  contents: write
  actions: read

jobs:
  publication-status:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      pointer_path: ${{ steps.handoff.outputs.pointer_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','httr2'))

      - name: Parse Workflow 03 scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_03_restore_lean_checkpoint.R')
          parse(file='scripts/updater/workflow_03_publication_status.R')
          parse(file='scripts/updater/workflow_03_archive_state_to_zenodo.R')
          parse(file='scripts/updater/workflow_03_update_zenodo_registry.R')
          parse(file='scripts/updater/workflow_03_restore_state_from_zenodo.R')
          cat('PASS: Workflow 03 scripts parse\n')

      - name: Restore Workflow 03 lean canonical checkpoint
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LEAN_POINTER: ${{ inputs.lean_pointer_path || 'docs/compaction/zenodo/run-36166883249.json' }}
        shell: bash
        run: |
          set -euo pipefail
          POINTER="$LEAN_POINTER"
          RUN_ID="$(POINTER="$POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("POINTER"),simplifyVector=FALSE);cat(x$source_github_run_id)')"
          EXPECTED_SHA="$(POINTER="$POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("POINTER"),simplifyVector=FALSE);cat(x$lean_canonical_sha256)')"
          CACHE_OK=false
          rm -rf workflow03_input workflow03_handoff
          mkdir -p workflow03_handoff
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "post-w02-lean-canonical-$RUN_ID" --dir workflow03_handoff; then
            P="$(find workflow03_handoff -type f -name canonical_lean.jsonl -print -quit)"
            if [ -n "$P" ]; then
              SHA="$(P="$P" Rscript -e 'library(digest);cat(digest(file=Sys.getenv("P"),algo="sha256",serialize=FALSE))')"
              if [ "$SHA" = "$EXPECTED_SHA" ]; then
                mkdir -p workflow03_input
                cp "$P" workflow03_input/canonical_lean.jsonl
                CACHE_OK=true
                echo "PASS: using verified 7-day post-W02 lean handoff artefact"
              fi
            fi
          fi
          if [ "$CACHE_OK" != true ]; then
            rm -rf workflow03_input
            Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R \
              --pointer "$POINTER" \
              --output-dir workflow03_input
            echo "PASS: restored authoritative lean checkpoint from Zenodo"
          fi
          SHA="$(Rscript -e 'cat(digest::digest(file="workflow03_input/canonical_lean.jsonl",algo="sha256",serialize=FALSE))')"
          test "$SHA" = "$EXPECTED_SHA"
          echo "LEAN_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Run publication-status scan
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LIMIT: ${{ github.event_name == 'push' && '0' || inputs.limit || '0' }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow03
          Rscript scripts/updater/workflow_03_publication_status.R \
            --input workflow03_input/canonical_lean.jsonl \
            --output outputs/workflow03/publication_status.jsonl \
            --audit outputs/workflow03/api_audit.jsonl \
            --report outputs/workflow03/report.json \
            --limit "$LIMIT" \
            --batch-size "$BATCH_SIZE"

      - name: Validate Workflow 03 output
        env:
          LIMIT: ${{ github.event_name == 'push' && '0' || inputs.limit || '0' }}
        shell: Rscript {0}
        run: |
          library(jsonlite)
          x<-fromJSON('outputs/workflow03/report.json',simplifyVector=FALSE)
          stopifnot(x$status=='PASS')
          expected<-as.integer(Sys.getenv('LIMIT'))
          if(expected>0L) stopifnot(as.integer(x$records_scanned)==expected)
          if(expected==0L) stopifnot(as.integer(x$records_scanned)==32292L)
          allowed<-c('normal','retracted','withdrawn','corrected','expression_of_concern','warning')
          counts<-unlist(x$code_counts)
          stopifnot(all(names(counts)%in%allowed),sum(as.integer(counts))==as.integer(x$records_scanned))
          lines<-readLines('outputs/workflow03/publication_status.jsonl',warn=FALSE,encoding='UTF-8')
          lines<-lines[nzchar(trimws(lines))]
          stopifnot(length(lines)==as.integer(x$records_scanned))
          ids<-vapply(lines,function(z)as.character(fromJSON(z,simplifyVector=FALSE)$record_id),character(1))
          stopifnot(all(nzchar(ids)),!anyDuplicated(ids))
          if(expected==0L) stopifnot(as.integer(x$evidence_conflicts)==0L)
          cat('PASS: Workflow 03 output schema/count/record_id validation complete\n')

      - name: Publish authoritative full Workflow 03 layer
        if: ${{ (github.event_name == 'push' || inputs.publish == true) && (github.event_name == 'push' || inputs.limit == '0') }}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow03_zenodo
          Rscript scripts/updater/workflow_03_archive_state_to_zenodo.R \
            --state-dir outputs/workflow03 \
            --source-run-id "$GITHUB_RUN_ID" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir outputs/workflow03_zenodo \
            --upstream-lean-sha256 "$LEAN_SHA"

      - name: Register authoritative Workflow 03 layer
        id: handoff
        if: ${{ (github.event_name == 'push' || inputs.publish == true) && (github.event_name == 'push' || inputs.limit == '0') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin workflow01-final-architecture
          Rscript scripts/updater/workflow_03_update_zenodo_registry.R \
            --receipt outputs/workflow03_zenodo/zenodo_receipt.json \
            --registry docs/publication_status/zenodo_registry.csv \
            --pointer-dir docs/publication_status/zenodo
          POINTER="docs/publication_status/zenodo/run-$GITHUB_RUN_ID.json"
          git add docs/publication_status/zenodo_registry.csv "$POINTER"
          if ! git diff --cached --quiet; then
            git commit -m "Register Workflow 03 publication-status state $GITHUB_RUN_ID"
            git push origin HEAD:workflow01-final-architecture
          fi
          echo "pointer_path=$POINTER" >> "$GITHUB_OUTPUT"

      - name: Upload validated Workflow 03 handoff cache
        if: ${{ (github.event_name == 'push' || inputs.publish == true) && (github.event_name == 'push' || inputs.limit == '0') }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow03-handoff-${{ github.run_id }}
          path: |
            workflow03_input/canonical_lean.jsonl
            outputs/workflow03/publication_status.jsonl
            outputs/workflow03/report.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload Workflow 03 execution state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow03-publication-status-${{ github.run_id }}
          path: |
            outputs/workflow03/
            outputs/workflow03_zenodo/
            workflow03_input/workflow03_restore_audit.json
          retention-days: 90
          if-no-files-found: warn
