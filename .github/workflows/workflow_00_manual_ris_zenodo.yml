name: Workflow 00 - Complete manual RIS Zenodo draft

on:
  workflow_dispatch:
    inputs:
      registry_path:
        description: 'Path to the manual RIS registry JSON in user_input/'
        required: true
        type: string
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'user_input/manual_ris_proquest_run.trigger'

permissions:
  contents: read

jobs:
  complete-existing-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Preflight existing Zenodo draft
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          REGISTRY_PATH: ${{ inputs.registry_path }}
        shell: bash
        run: |
          set -euo pipefail
          dep_id="$(jq -r '.staging.deposition_id // empty' "$REGISTRY_PATH")"
          if [ -z "$dep_id" ]; then
            doi="$(jq -r '.staging.reserved_doi // empty' "$REGISTRY_PATH")"
            dep_id="${doi##*.}"
          fi
          test -n "$dep_id"
          url="https://zenodo.org/api/records/$dep_id/draft"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/zenodo_draft.json -w '%{http_code}' \
              -H "Authorization: Bearer $ZENODO_ACCESS_TOKEN" "$url" || true)"
            echo "Zenodo draft preflight attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Zenodo draft remained unavailable after preflight retries." >&2
          cat /tmp/zenodo_draft.json >&2 || true
          exit 1

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))

      - name: Verify registered RIS files directly
        if: ${{ github.event_name == 'push' }}
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          REGISTRY_PATH: user_input/workflow00_ris_proquest_2026-09-30.json
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_verify_zenodo_ris_integrity.R \
            --registry "$REGISTRY_PATH" \
            --output-dir outputs/updater/workflow00_ris_integrity


      - name: Complete existing Zenodo draft
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          REGISTRY_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_path || 'user_input/workflow00_ris_proquest_2026-09-30.json' }}
          VALIDATE_ONLY: ${{ github.event_name == 'push' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REGISTRY_PATH"
          Rscript scripts/updater/workflow_00_complete_ris_zenodo_draft.R \
            --registry "$REGISTRY_PATH" \
            --validate-only "$VALIDATE_ONLY" \
            --output-dir outputs/updater/workflow00_manual_ris_zenodo

      - name: Upload validation receipt and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-manual-ris-zenodo-${{ github.run_id }}
          path: outputs/updater/workflow00_manual_ris_zenodo/
          retention-days: 7
          if-no-files-found: warn
