name: Workflow 04 - Luna consensus screening

on:
  workflow_call:
    inputs:
      lean_pointer_path:
        required: false
        default: 'docs/compaction/zenodo/run-36166883249.json'
        type: string
      workflow03_pointer_path:
        required: false
        default: 'docs/publication_status/zenodo/run-36172718538.json'
        type: string
    secrets:
      ZENODO_ACCESS_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      lean_pointer_path:
        description: 'Authoritative lean canonical checkpoint pointer'
        required: false
        default: 'docs/compaction/zenodo/run-36166883249.json'
        type: string
      workflow03_pointer_path:
        description: 'Authoritative Workflow 03 publication-status pointer'
        required: false
        default: 'docs/publication_status/zenodo/run-36172718538.json'
        type: string
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/workflow04/.run_consensus_screening'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pipeline branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest','stringi'))

      - name: Parse Workflow 04 implementation
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_04_luna_consensus.R')
          parse(file='scripts/updater/workflow_04_merge_consensus.R')
          cat('PASS: Workflow 04 consensus implementation parses\n')

      - name: Restore authoritative Workflow 03 handoff state
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          W03_POINTER_INPUT: ${{ inputs.workflow03_pointer_path || 'docs/publication_status/zenodo/run-36172718538.json' }}
          LEAN_POINTER_INPUT: ${{ inputs.lean_pointer_path || 'docs/compaction/zenodo/run-36166883249.json' }}
        shell: bash
        run: |
          set -euo pipefail
          W03_POINTER="$W03_POINTER_INPUT"
          LEAN_POINTER="$LEAN_POINTER_INPUT"
          RUN_ID="$(POINTER="$W03_POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("POINTER"),simplifyVector=FALSE);cat(x$source_github_run_id)')"
          EXPECTED_STATUS_SHA="$(POINTER="$W03_POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("POINTER"),simplifyVector=FALSE);cat(x$publication_status_sha256)')"
          EXPECTED_LEAN_SHA="$(POINTER="$LEAN_POINTER" Rscript -e 'x<-jsonlite::fromJSON(Sys.getenv("POINTER"),simplifyVector=FALSE);cat(x$lean_canonical_sha256)')"
          CACHE_OK=false
          rm -rf workflow04_input workflow04_handoff
          mkdir -p workflow04_handoff
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "workflow03-handoff-$RUN_ID" --dir workflow04_handoff; then
            CAN="$(find workflow04_handoff -type f -name canonical_lean.jsonl -print -quit)"
            STA="$(find workflow04_handoff -type f -name publication_status.jsonl -print -quit)"
            if [ -n "$CAN" ] && [ -n "$STA" ]; then
              CAN_SHA="$(P="$CAN" Rscript -e 'library(digest);cat(digest(file=Sys.getenv("P"),algo="sha256",serialize=FALSE))')"
              STA_SHA="$(P="$STA" Rscript -e 'library(digest);cat(digest(file=Sys.getenv("P"),algo="sha256",serialize=FALSE))')"
              if [ "$CAN_SHA" = "$EXPECTED_LEAN_SHA" ] && [ "$STA_SHA" = "$EXPECTED_STATUS_SHA" ]; then
                mkdir -p workflow04_input/canonical workflow04_input/status
                cp "$CAN" workflow04_input/canonical/canonical_lean.jsonl
                cp "$STA" workflow04_input/status/publication_status.jsonl
                CACHE_OK=true
                echo "PASS: using verified 7-day Workflow 03 handoff artefact"
              fi
            fi
          fi
          if [ "$CACHE_OK" != true ]; then
            rm -rf workflow04_input
            Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R \
              --pointer "$LEAN_POINTER" \
              --output-dir workflow04_input/canonical
            Rscript scripts/updater/workflow_03_restore_state_from_zenodo.R \
              --pointer "$W03_POINTER" \
              --output-dir workflow04_input/status
            echo "PASS: restored authoritative Workflow 03 inputs from Zenodo"
          fi

      - name: Validate Workflow 04 input
        shell: Rscript {0}
        run: |
          library(jsonlite)
          read_jsonl <- function(p) {
            x <- readLines(p,warn=FALSE,encoding='UTF-8')
            x <- x[nzchar(trimws(x))]
            lapply(x,fromJSON,simplifyVector=FALSE)
          }
          `%||%` <- function(x,y) if(is.null(x)) y else x
          can <- read_jsonl('workflow04_input/canonical/canonical_lean.jsonl')
          w03 <- read_jsonl('workflow04_input/status/publication_status.jsonl')
          stopifnot(length(can)==32292L,length(w03)==32292L)
          ids <- vapply(can,function(x)as.character((x$identity %||% list())$record_id %||% ''),character(1))
          sids <- vapply(w03,function(x)as.character(x$record_id %||% ''),character(1))
          stopifnot(all(nzchar(ids)),!anyDuplicated(ids),setequal(ids,sids))
          excluded <- vapply(w03,function(x)isTRUE((x$publication_status %||% list())$exclude_from_workflow04 %||% x$exclude_from_workflow04 %||% FALSE),logical(1))
          stopifnot(sum(excluded)==9L,sum(!excluded)==32283L)
          cat('PASS: 32,283 W03-eligible records ready for Workflow 04\n')

      - name: Upload immutable Workflow 04 input
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-authoritative-input-${{ github.run_id }}
          path: |
            workflow04_input/canonical/canonical_lean.jsonl
            workflow04_input/status/publication_status.jsonl
          retention-days: 7
          if-no-files-found: error

  screen:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout pipeline branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest','stringi'))

      - name: Download authoritative Workflow 04 input
        uses: actions/download-artifact@v4
        with:
          name: workflow04-authoritative-input-${{ github.run_id }}
          path: workflow04_input

      - name: Run two-pass consensus shard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEVANCE_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_04_luna_consensus.R \
            --canonical workflow04_input/canonical/canonical_lean.jsonl \
            --workflow03-status workflow04_input/status/publication_status.jsonl \
            --output-dir outputs/workflow04_consensus/shard-${{ matrix.shard }} \
            --model gpt-5.6-luna \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --checkpoint-every 25

      - name: Upload shard state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-consensus-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: outputs/workflow04_consensus/shard-${{ matrix.shard }}/
          retention-days: 90
          if-no-files-found: warn

  merge:
    needs: screen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pipeline branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependency
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Download all Workflow 04 shards
        uses: actions/download-artifact@v4
        with:
          pattern: workflow04-consensus-shard-*-${{ github.run_id }}
          path: workflow04_shards
          merge-multiple: false

      - name: Merge and validate consensus layer
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_04_merge_consensus.R \
            --input-root workflow04_shards \
            --output-dir outputs/workflow04_consensus_merged \
            --expected-shards 8

      - name: Upload validated merged Workflow 04 layer
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-consensus-merged-${{ github.run_id }}
          path: outputs/workflow04_consensus_merged/
          retention-days: 90
          if-no-files-found: error
