name: Validate current-run status reporting v2

on:
  push:
    branches:
      - shiny-live-kpi-status-v2
    paths:
      - 'docs/current_run/.validate_current_run_status'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiny-live-kpi-status-v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','readr','httr2'))
      - name: Parse reporting scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_current_run_status_observer.R')
          parse(file='scripts/updater/workflow_shiny_pipeline_status.R')
          cat('PASS: current-run reporting R scripts parse\n')
      - name: Validate W00 fixture path
        shell: Rscript {0}
        run: |
          dir.create('docs/search_record/fortnightly_update',recursive=TRUE,showWarnings=FALSE)
          dir.create('docs/current_run',recursive=TRUE,showWarnings=FALSE)
          rec <- function(source,n) list(
            schema_version='1.2',
            recorded_at_utc='2026-10-01T20:00:00Z',
            source=source,
            reported_search_results=n,
            successfully_downloaded_results=n,
            github=list(parent_workflow_run_id='fixture-1')
          )
          jsonlite::write_json(rec('a',10),'docs/search_record/fortnightly_update/a.json',auto_unbox=TRUE,pretty=TRUE)
          jsonlite::write_json(rec('b',20),'docs/search_record/fortnightly_update/b.json',auto_unbox=TRUE,pretty=TRUE)
          writeLines(c('docs/search_record/fortnightly_update/a.json','docs/search_record/fortnightly_update/b.json'),'changed_fixture.txt')
          status <- system2('Rscript',c('scripts/updater/workflow_current_run_status_observer.R','--changed-files','changed_fixture.txt'))
          if(status!=0L) stop('Synthetic W00 status update failed')
          x <- jsonlite::fromJSON('docs/current_run/current_run_status.json',simplifyVector=FALSE)
          stopifnot(x$counts$search_results==30L,x$search$workflow00_run_id=='fixture-1',x$progress$completed_through==1L)
          cat('PASS: W00 current-run status fixture\n')
