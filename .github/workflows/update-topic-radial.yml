name: Update topic hierarchy radial dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_topic_hierarchy_radial.py'
      - '.github/workflows/update-topic-radial.yml'

permissions:
  contents: write

jobs:
  update-topic-radial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Snapshot protected data files
        run: |
          sha256sum data/master/current/living_evidence_map_master.csv > /tmp/master.before
          sha256sum docs/dashboard.json > /tmp/dashboard-data.before

      - name: Patch only the approved dashboard display
        run: python scripts/patch_topic_hierarchy_radial.py

      - name: Verify protected files are unchanged
        run: |
          sha256sum -c /tmp/master.before
          sha256sum -c /tmp/dashboard-data.before

      - name: Verify only docs/index.html changed
        run: |
          git diff --name-only > /tmp/changed-files
          cat /tmp/changed-files
          test "$(cat /tmp/changed-files)" = "docs/index.html"

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          assert 'id="topicRadial"' in html
          assert 'function tree(){' in html
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Commit dashboard display only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Replace topic hierarchy with radial heatplot'
          git push origin main
