name: TEMP validate W01 W02 review email wiring

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_review_email_wiring.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages('jsonlite')

      - name: Validate payload builder and workflow wiring
        shell: bash
        env:
          REVIEW_EMAIL: review@example.org
          SMTP_USERNAME: smtp@example.org
        run: |
          set -euo pipefail
          Rscript -e 'parse(file="scripts/updater/workflow_build_review_email_payload.R");parse(file="scripts/updater/workflow_01_send_review_email.R");cat("PASS: notification scripts parse\n")'
          mkdir -p /tmp/review-email
          printf '%s\n' '{"pending_count":3,"queue_sha256":"abc123"}' > /tmp/review-email/w01.json
          printf '%s\n' '{"blocking_cases":2,"blocking_conflicts":4,"manifest_sha256":"def456"}' > /tmp/review-email/w02.json
          Rscript scripts/updater/workflow_build_review_email_payload.R --workflow 01 --manifest /tmp/review-email/w01.json --artifact-url https://example.org/a1 --workflow-url https://example.org/r1 --output /tmp/review-email/p1.json
          Rscript scripts/updater/workflow_build_review_email_payload.R --workflow 02 --manifest /tmp/review-email/w02.json --artifact-url https://example.org/a2 --workflow-url https://example.org/r2 --output /tmp/review-email/p2.json
          Rscript -e 'a<-jsonlite::fromJSON("/tmp/review-email/p1.json");b<-jsonlite::fromJSON("/tmp/review-email/p2.json");stopifnot(a$pending_count==3,b$pending_count==2,grepl("Workflow 01",a$subject),grepl("Workflow 02",b$subject))'
          grep -q 'Email Workflow 01 review notification' .github/workflows/workflow_01_production.yml
          grep -q 'Email Workflow 02 review notification' .github/workflows/workflow_02_production.yml
          grep -q 'workflow01-human-review-' .github/workflows/workflow_01_production.yml
          grep -q 'workflow02-human-review-' .github/workflows/workflow_02_production.yml
          echo 'PASS: W01/W02 review email wiring validated'
