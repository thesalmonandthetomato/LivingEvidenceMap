name: Temporary validate W01 RIS expansion restoration
on:
  push:
    branches: [workflow01-final-architecture]
    paths: [.github/workflows/tmp_validate_w01_expansion_ris_20261018.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install required R packages
        shell: Rscript {0}
        run: install.packages(c('httr2','jsonlite','digest'))
      - name: Validate W01 retrieval of new published RIS (no legacy replay)
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for src in cab proquest; do
            if [ "$src" = cab ]; then registry=user_input/workflow00_ris_cab_mariculture_2026-10-18.json; expected=41; else registry=user_input/workflow00_ris_proquest_mariculture_2026-10-18.json; expected=5; fi
            mkdir -p outputs/w01_ris_check/$src
            Rscript scripts/updater/workflow_01_restore_manual_ris_from_zenodo.R --registry "$registry" --source "$src" --output "outputs/w01_ris_check/$src/records.jsonl"
            test "$(wc -l < "outputs/w01_ris_check/$src/records.jsonl")" -eq "$expected"
          done
          echo PASS
