name: Finalise radial dashboard HTML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalise-radial-dashboard-html.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore standalone dashboard and inline radial patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('docs/dashboard-redesign-temp-base.html').read_text()
          css = Path('docs/radial-definition-patch.css').read_text()
          js = Path('docs/radial-definition-patch.js').read_text()
          out = base.replace('</head>', '<style id="radial-definition-patch">\n' + css + '\n</style></head>', 1)
          out = out.replace('</body>', '<script id="radial-definition-patch-script">\n' + js + '\n</script></body>', 1)
          Path('docs/dashboard-redesign-temp.html').write_text(out)
          PY
          rm .github/workflows/finalise-radial-dashboard-html.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard-redesign-temp.html .github/workflows/finalise-radial-dashboard-html.yml
          git commit -m "Restore standalone dashboard HTML with radial definition panel"
          git push
