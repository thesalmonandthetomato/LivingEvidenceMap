name: TEMP inspect EBSCO large-database pagination options

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/tmp_inspect_ebsco_large_pagination.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query EBSCO Info metadata
        env:
          EBSCO_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EBSCO_UID"
          test -n "$EBSCO_PWD"
          curl -fsS --get "https://eit.ebscohost.com/Services/SearchService.asmx/Info" \
            --data-urlencode "prof=$EBSCO_UID" \
            --data-urlencode "pwd=$EBSCO_PWD" \
            --data-urlencode "authType=profile" \
            -o /tmp/info.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET, json
          root=ET.parse('/tmp/info.xml').getroot()
          def local(t): return t.split('}')[-1]
          wanted={'cmedm','wrw'}
          for db in root.iter():
              if local(db.tag)!='db': continue
              code=db.attrib.get('shortName','')
              if code not in wanted: continue
              print('DATABASE',code,db.attrib.get('longName',''))
              for el in db.iter():
                  tag=local(el.tag)
                  attrs={local(k):v for k,v in el.attrib.items()}
                  txt=(el.text or '').strip()
                  if tag.lower() in {'dbsort','sort','dbtag','limiter','dbfilter'} or any(k.lower() in {'name','label','type','id'} for k in attrs):
                      print(tag, json.dumps(attrs,sort_keys=True), txt[:200])
          PY
