name: W01-Fast October real source size inventory
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_october_archive_inventory.yml
      - scripts/updater/experimental_w01_fast/inventory_october_source_sizes.R
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install JSON support
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Inventory archived source members without corpus retrieval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -f 256
          Rscript scripts/updater/experimental_w01_fast/inventory_october_source_sizes.R
      - uses: actions/upload-artifact@v4
        with:
          name: w01-fast-october-real-source-inventory
          path: w01_fast_archive_inventory/archive_inventory.json
          retention-days: 7
          if-no-files-found: error
