name: Temporary W00 matrix validation
on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/_tmp_validate_w00_matrix.yml'
      - '.github/workflows/workflow_00_search_orchestrator.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - name: Parse orchestrator YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/workflow_00_search_orchestrator.yml"); puts "PASS: YAML parses"'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependency
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Validate planner and source matrix
        env:
          W00_SELECT_LENS: 'true'
          W00_SELECT_SCOPUS: 'false'
          W00_SELECT_OPENALEX: 'false'
          W00_SELECT_AGRICOLA: 'false'
          W00_SELECT_PUBMED: 'false'
          W00_SELECT_ETHOS: 'false'
          W00_SELECT_CBA: 'false'
          W00_SELECT_EPMC_PREPRINTS: 'false'
          W00_SELECT_WOS: 'false'
          W00_SELECT_EBSCO_PSYCINFO: 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/tmp_w00_validate
          mkdir -p outputs/tmp_w00_validate
          Rscript scripts/updater/workflow_00_resolve_source_selection.R \
            --run-type full \
            --saved data/workflow00/source_selection.json \
            --output outputs/tmp_w00_validate/source_selection.json \
            --ebsco-config config/workflow00_ebsco_sources.json
          Rscript scripts/updater/workflow_00_search_orchestrator.R \
            --run-type full \
            --config user_input/workflow00_search_strategy.json \
            --output-dir outputs/tmp_w00_validate/plan
          Rscript - <<'RS'
          library(jsonlite)
          s <- fromJSON("outputs/tmp_w00_validate/source_selection.json", simplifyVector=FALSE)
          sel <- unlist(s$selected_sources,use.names=FALSE)
          stopifnot(setequal(sel,c("lens","ebsco_psycinfo")))
          p <- fromJSON("outputs/tmp_w00_validate/plan/search_plan.json", simplifyVector=FALSE)
          q <- p$source_queries
          stopifnot(all(sel %in% names(q)))
          matrix <- lapply(sel,function(src) list(source=src,query=q[[src]]))
          stopifnot(length(matrix)==2L)
          stopifnot(all(vapply(matrix,function(x)nzchar(x$query),logical(1))))
          cat("PASS: selected-source matrix contains Lens and EBSCO PsycInfo with non-empty queries\n")
          RS
