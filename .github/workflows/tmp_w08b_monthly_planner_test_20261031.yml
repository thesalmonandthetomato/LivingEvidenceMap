name: TEMP W08b November monthly planner tests
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_monthly_planner_test_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Offline restart and provider-history tests
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("monthly_test")
          cross<-data.frame(
            record_id=c("new","lens_prior","oa_prior","same_update","changed","unresolved"),
            lens_id=c("L_NEW","L_PRIOR","","L_SAME","L_CHANGED",""),
            openalex_id=c("","","W123","","",""),
            doi=c("","","","","",""),
            preferred_route=c("lens","lens","openalex","lens","lens","unresolved"),
            identifier_conflict=rep(FALSE,6))
          write.csv(cross,"monthly_test/cross.csv",row.names=FALSE)
          writeLines(c(
            toJSON(list(record_id="lens_prior",provider="lens",status="complete",update_id="2026-10",lens_id="L_PRIOR"),auto_unbox=TRUE),
            toJSON(list(record_id="same_update",provider="lens",status="complete",update_id="2026-11",lens_id="L_SAME"),auto_unbox=TRUE),
            toJSON(list(record_id="changed",provider="lens",status="complete",update_id="2026-11",lens_id="L_OLD"),auto_unbox=TRUE)
          ),"monthly_test/lens_seed_status.jsonl")
          writeLines(toJSON(list(record_id="oa_prior",provider="openalex",status="complete",update_id="2026-10",openalex_id="W123"),auto_unbox=TRUE),"monthly_test/openalex_seed_status.jsonl")
          status<-system2("Rscript",c("scripts/workflow08b/plan_monthly.R","monthly_test/cross.csv","monthly_test","2026-11","monthly_test/output"))
          stopifnot(status==0L)
          d<-read.csv("monthly_test/output/monthly_seed_plan.csv")
          a<-setNames(split(d,d$record_id),d$record_id)
          get<-function(id) d[d$record_id==id,,drop=FALSE]
          stopifnot(
            get("new")$new_seed, get("new")$provider_check_required,
            !get("lens_prior")$new_seed, get("lens_prior")$provider_check_required,
            !get("oa_prior")$new_seed, get("oa_prior")$provider_check_required,
            !get("same_update")$provider_check_required,
            get("changed")$identifier_changed, get("changed")$provider_check_required,
            !get("unresolved")$provider_check_required
          )
          s<-fromJSON("monthly_test/output/summary.json")
          stopifnot(s$seeds==6,s$new_seeds==2,s$identifier_changes==1,
            s$previously_checked_this_update==1,!s$automatic_downloads_authorised)
          cat("PASS: two-provider historical state, new seeds, same-update retry skip, identifier change, unresolved seed\n")
