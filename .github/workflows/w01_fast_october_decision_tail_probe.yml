name: W01-Fast October decision tail probe
on:
  workflow_dispatch:
  push:
    branches: [w01-fast-development]
    paths:
      - .github/workflows/w01_fast_october_decision_tail_probe.yml
      - scripts/updater/experimental_w01_fast/probe_october_incremental_decision_tail.R
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w01-fast-development
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install JSON support
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Read only last 4 MiB of October decision CSV
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -f 6000
          Rscript scripts/updater/experimental_w01_fast/probe_october_incremental_decision_tail.R
      - name: Preserve bounded tail for inspection
        uses: actions/upload-artifact@v4
        with:
          name: w01-fast-october-decision-csv-tail
          path: selected_w01_decision_tail/
          retention-days: 2
          if-no-files-found: error
