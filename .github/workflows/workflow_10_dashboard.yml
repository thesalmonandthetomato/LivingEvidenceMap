name: Workflow 10 - dashboard from authoritative Workflow 08 canonical

on:
  workflow_dispatch:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - '.github/workflows/workflow_10_dashboard.yml'
      - 'R/workflow_10_dashboard_from_canonical_jsonl.R'
      - 'R/workflow_10_make_standalone_preview.R'
      - 'scripts/updater/workflow_10_restore_canonical_from_zenodo.R'
      - 'docs/dashboard-redesign-temp.html'
      - 'docs/workflow08/zenodo/*.json'
      - 'docs/workflow08/zenodo_registry.csv'
      - 'docs/reporting/workflow_09/flow_counts.json'
      - 'user_input/workflow07_topic_ontology.csv'
      - 'config/iso3_numeric_map.json'
      - 'config/global_country_gazetteer_v3.csv'

permissions:
  contents: write

env:
  TOPIC_ONTOLOGY_PATH: 'user_input/workflow07_topic_ontology.csv'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','readr','digest','httr2'))

      - name: Parse Workflow 10 R scripts
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_10_restore_canonical_from_zenodo.R')
          parse(file='R/workflow_10_dashboard_from_canonical_jsonl.R')
          parse(file='R/workflow_10_make_standalone_preview.R')
          cat('PASS: Workflow 10 scripts parse\n')

      - name: Resolve authoritative Workflow 08 pointer
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages(library(jsonlite))
          reg <- read.csv('docs/workflow08/zenodo_registry.csv',stringsAsFactors=FALSE)
          required <- c('source_run_id','zenodo_record_id','doi','canonical_sha256','status')
          if(!all(required %in% names(reg))) stop('Workflow 08 registry schema is incomplete',call.=FALSE)
          auth <- reg[reg$status=='authoritative',,drop=FALSE]
          if(nrow(auth)!=1L) stop(sprintf('Expected exactly one authoritative Workflow 08 registry row; found %d',nrow(auth)),call.=FALSE)
          run_id <- as.character(auth$source_run_id[[1L]])
          p <- sprintf('docs/workflow08/zenodo/run-%s.json',run_id)
          if(!file.exists(p)) stop(sprintf('Authoritative Workflow 08 pointer not found: %s',p),call.=FALSE)
          x <- fromJSON(p,simplifyVector=FALSE)
          if(!identical(as.character(x$status),'published') ||
             !identical(as.character(x$workflow),'08') ||
             !identical(as.character(x$state),'corrected_final_adjudicated_canonical') ||
             as.character(x$zenodo_record_id)!=as.character(auth$zenodo_record_id[[1L]]) ||
             as.character(x$doi)!=as.character(auth$doi[[1L]]) ||
             tolower(as.character(x$final_canonical_jsonl_sha256))!=tolower(as.character(auth$canonical_sha256[[1L]])) ||
             is.na(as.integer(x$canonical_records)) || as.integer(x$canonical_records)<1L) {
            stop('Authoritative Workflow 08 pointer does not match the registry',call.=FALSE)
          }
          cat(sprintf('W08_POINTER=%s\n',p),file=Sys.getenv('GITHUB_ENV'),append=TRUE)
          cat(sprintf('PASS: authoritative W08 pointer = %s / Zenodo %s / %d records\n',p,x$zenodo_record_id,as.integer(x$canonical_records)))

      - name: Restore authoritative Workflow 08 canonical from Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/workflow10 outputs/workflow10
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R \
            --pointer "$W08_POINTER" \
            --output inputs/workflow10/living_evidence_map_canonical_final.jsonl

      - name: Build Workflow 10 dashboard data
        shell: bash
        run: |
          set -euo pipefail
          Rscript R/workflow_10_dashboard_from_canonical_jsonl.R \
            inputs/workflow10/living_evidence_map_canonical_final.jsonl \
            outputs/workflow10/living_evidence_map.csv \
            outputs/workflow10/dashboard-data.js \
            "$W08_POINTER"

      - name: Build standalone dashboard preview
        shell: bash
        run: |
          set -euo pipefail
          Rscript R/workflow_10_make_standalone_preview.R \
            docs/dashboard-redesign-temp.html \
            outputs/workflow10/dashboard-data.js \
            outputs/workflow10/dashboard-redesign-temp-standalone.html

      - name: Validate Workflow 10 output
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({library(jsonlite);library(readr);library(digest)})
          pointer <- fromJSON(Sys.getenv('W08_POINTER'),simplifyVector=FALSE)
          expected_n <- as.integer(pointer$canonical_records)
          expected_sha <- tolower(as.character(pointer$final_canonical_jsonl_sha256))
          stopifnot(!is.na(expected_n),expected_n>0L,grepl('^[0-9a-f]{64}$',expected_sha))

          csv <- read_csv('outputs/workflow10/living_evidence_map.csv',show_col_types=FALSE,progress=FALSE)
          stopifnot(nrow(csv)==expected_n,!anyDuplicated(csv$record_id))

          js <- paste(readLines('outputs/workflow10/dashboard-data.js',warn=FALSE,encoding='UTF-8'),collapse='\n')
          prefix <- 'window.LIVING_EVIDENCE_MAP_DASHBOARD_DATA='
          stopifnot(startsWith(js,prefix),endsWith(js,';'))
          payload <- fromJSON(substr(js,nchar(prefix)+1L,nchar(js)-1L),simplifyVector=FALSE)
          flow <- fromJSON('docs/reporting/workflow_09/flow_counts.json',simplifyVector=FALSE)
          stopifnot(length(payload$records)==expected_n)
          stopifnot(as.integer(payload$metrics$total_records)==expected_n)
          stopifnot(as.integer(payload$metrics$search_results)==as.integer(flow$counts$combined_search_results))
          stopifnot(as.integer(payload$metrics$unique_records_screened)==as.integer(flow$counts$deduplicated_records))
          stopifnot(as.integer(payload$metrics$candidate_search_results_screened)==as.integer(flow$counts$title_abstract_screened))
          stopifnot(as.integer(payload$metrics$databases_searched)==length(flow$counts$sources))
          stopifnot(as.character(payload$source$zenodo_record_id)==as.character(pointer$zenodo_record_id))
          stopifnot(tolower(as.character(payload$source$canonical_sha256))==expected_sha)

          stars <- unlist(lapply(payload$records,function(r)unlist(r$topic_stars,use.names=FALSE)),use.names=FALSE)
          stopifnot(length(stars)>0L,all(nzchar(stars)),all(stars %in% c('★','★★','★★★')))

          html <- paste(readLines('docs/dashboard-redesign-temp.html',warn=FALSE,encoding='UTF-8'),collapse='\n')
          stopifnot(grepl('Stars beside topic codes indicate model agreement across 3-passes of a large language model (OpenAI GPT-5.6 Luna).',html,fixed=TRUE))
          stopifnot(file.exists('outputs/workflow10/dashboard-redesign-temp-standalone.html'))

          cat(sprintf(
            'PASS: Workflow 10 built from Zenodo %s: %d records; %d starred topic assignments\n',
            pointer$zenodo_record_id,nrow(csv),length(stars)
          ))

      - name: Upload Workflow 10 dashboard artefact
        uses: actions/upload-artifact@v4
        with:
          name: workflow10-dashboard-${{ github.run_id }}
          path: |
            outputs/workflow10/
          retention-days: 30
          if-no-files-found: error

      - name: Mark current-run dashboard stage complete
        shell: Rscript {0}
        run: |
          status <- system2("Rscript",c(
            "scripts/updater/workflow_current_run_status_observer.R",
            "--force-stage","W10"
          ))
          if(status != 0L) stop("Failed to update current-run W10 status",call.=FALSE)

      - name: Commit current-run reporting metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d docs/current_run ]; then
            echo "No active current-run status exists; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/current_run
          if git diff --cached --quiet; then
            echo "No W10 reporting changes to commit."
            exit 0
          fi
          git commit -m "Complete current-run live status [skip ci]"
          git pull --rebase origin workflow01-final-architecture
          git push origin HEAD:workflow01-final-architecture
