name: Validate Almeria Sheet event integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-almeria-sheet-event.yml'
permissions:
  contents: read
jobs:
  synthetic-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install Sheets package
        shell: Rscript {0}
        run: install.packages("googlesheets4")
      - name: Append and verify one labelled synthetic event
        shell: bash
        env:
          LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-test-sheet.json"
          chmod 600 "$RUNNER_TEMP/lem-test-sheet.json"
          Rscript scripts/updater/workflow_00_test_sheet_integration.R \
            --sheet-id 1wii1QjB4jM9OzOqboIgZn4z8CAN7W4EAyIKIyGcGjeU \
            --credential "$RUNNER_TEMP/lem-test-sheet.json" \
            --review-id almeria-map \
            --run-id "$GITHUB_RUN_ID"
          rm -f "$RUNNER_TEMP/lem-test-sheet.json"
