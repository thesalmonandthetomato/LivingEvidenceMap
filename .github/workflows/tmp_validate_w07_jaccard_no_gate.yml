name: TEMP validate W08 ontology pathology routing

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w07_jaccard_no_gate.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','readr'))

      - name: Validate ontology pathology routing
        shell: bash
        run: |
          Rscript scripts/updater/tmp_validate_w08_geography_vocab_migration.R

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: w08-ontology-pathology-validation-${{ github.run_id }}
          path: outputs/validation/
          retention-days: 30
          if-no-files-found: error
