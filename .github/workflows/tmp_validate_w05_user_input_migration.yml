name: TEMP validate W05 legacy input cleanup

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w05_user_input_migration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
      - name: Confirm current W05 uses only user-input vocabulary
        shell: bash
        run: |
          set -euo pipefail
          test -f user_input/workflow05_deterministic_concepts.csv
          test -f user_input/workflow05_species_dictionary_reference.csv
          test -f user_input/workflow05_coding_config.json

          # This historical temporary workflow intentionally checks out the
          # August species-rerun branch, where its old config path exists.
          # It is provenance, not part of the current W05 implementation.
          refs="$(grep -RIn \
            --exclude='tmp_validate_w05_user_input_migration.yml' \
            --exclude='run_species_full_reannotation.yml' \
            --exclude-dir='.git' \
            -E 'config/(deterministic_concepts|species_dictionary)\\.csv' . || true)"
          if [ -n "$refs" ]; then
            echo "$refs"
            echo "FAIL: a current file still depends on a legacy W05 config path" >&2
            exit 1
          fi

          grep -q 'user_input/workflow05_deterministic_concepts.csv' .github/workflows/workflow_05_production.yml
          grep -q 'user_input/workflow05_coding_config.json' .github/workflows/workflow_05_production.yml
          grep -q 'user_input/workflow05_species_dictionary_reference.csv' scripts/reporting/workflow05_species_only_rerun.R
          echo "PASS: current W05 implementation is independent of legacy config copies"
