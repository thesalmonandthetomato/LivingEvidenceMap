name: TEMP validate W05 user-input migration

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w05_user_input_migration.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('digest','dplyr','jsonlite','readr','tibble','testthat','yaml'))

      - name: Validate W05 input relocation and syntax
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          library(digest); library(jsonlite)
          old <- 'config/deterministic_concepts.csv'
          new <- 'user_input/workflow05_deterministic_concepts.csv'
          old_ref <- 'config/species_dictionary.csv'
          new_ref <- 'user_input/workflow05_species_dictionary_reference.csv'
          stopifnot(
            identical(digest(file=old,algo='sha256',serialize=FALSE), digest(file=new,algo='sha256',serialize=FALSE)),
            identical(digest(file=old_ref,algo='sha256',serialize=FALSE), digest(file=new_ref,algo='sha256',serialize=FALSE))
          )
          cfg <- fromJSON('user_input/workflow05_coding_config.json',simplifyVector=FALSE)
          stopifnot(
            identical(cfg$dictionary_path,new),
            identical(cfg$reference_dictionary_path,new_ref),
            identical(cfg$entity_value,'farmed species'),
            identical(cfg$generic_code,'UNSPEC_SALMON'),
            identical(cfg$none_code,'NONE'),
            identical(cfg$default_group,'salmon'),
            isTRUE(cfg$is_candidate)
          )
          cat('PASS: relocated W05 inputs are byte-identical and config preserves current semantics\n')
          RS
          Rscript -e "parse(file='R/species_detect.R');parse(file='R/species_assign.R');parse(file='scripts/updater/workflow_05_species_coding.R');parse(file='scripts/updater/workflow_05_archive_state_to_zenodo.R');cat('PASS: W05 R scripts parse\n')"
          Rscript -e "yaml::read_yaml('.github/workflows/workflow_05_production.yml');yaml::read_yaml('.github/workflows/workflow_05_species_coding.yml');yaml::read_yaml('.github/workflows/workflow_05_publish_baseline.yml');cat('PASS: W05 YAML parses\n')"
          Rscript -e "source('R/species_detect.R');testthat::test_file('tests/testthat/test-species.R',reporter='summary')"

      - name: Download validated historical W05 baseline output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf historical
          mkdir -p historical
          gh run download 36268840588 --repo "$GITHUB_REPOSITORY" --name workflow05-species-coding-36268840588 --dir historical
          for f in records_for_annotation.csv workflow05_species_coded.csv species_codes_long.csv species_matches.csv species_record_counts.csv workflow05_manifest.json; do
            test -n "$(find historical -type f -name "$f" -print -quit)"
          done

      - name: Reconstruct exact W05 lexical input from historical baseline
        shell: Rscript {0}
        run: |
          library(readr); library(jsonlite)
          p <- list.files('historical',pattern='^records_for_annotation\\.csv$',recursive=TRUE,full.names=TRUE)
          stopifnot(length(p)==1L)
          x <- read_csv(p[[1]],show_col_types=FALSE,na='')
          stopifnot(nrow(x)==19407L,!anyDuplicated(x$record_id))
          con <- file('historical_input.jsonl','wt',encoding='UTF-8')
          for(i in seq_len(nrow(x))){
            r <- list(identity=list(record_id=as.character(x$record_id[[i]])), canonical=list(title=ifelse(is.na(x$title[[i]]),'',as.character(x$title[[i]])), abstract=ifelse(is.na(x$abstract[[i]]),'',as.character(x$abstract[[i]]))))
            writeLines(toJSON(r,auto_unbox=TRUE,null='null',na='null'),con,useBytes=TRUE)
          }
          close(con)
          cat('PASS: reconstructed 19,407-record W05 lexical input\n')

      - name: Run migrated W05 on baseline input
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migrated
          Rscript scripts/updater/workflow_05_species_coding.R \
            --input historical_input.jsonl \
            --config user_input/workflow05_coding_config.json \
            --dictionary user_input/workflow05_deterministic_concepts.csv \
            --output-dir migrated \
            --expected-records 19407

      - name: Require exact historical W05 coding equivalence
        shell: bash
        run: |
          set -euo pipefail
          for f in workflow05_species_coded.csv species_codes_long.csv species_matches.csv species_record_counts.csv; do
            OLD=$(find historical -type f -name "$f" -print -quit)
            NEW="migrated/$f"
            cmp "$OLD" "$NEW" || { echo "W05 equivalence failure: $f differs" >&2; exit 1; }
            echo "PASS: $f byte-identical"
          done
          Rscript - <<'RS'
          library(jsonlite)
          oldp <- list.files('historical',pattern='^workflow05_manifest\\.json$',recursive=TRUE,full.names=TRUE)
          stopifnot(length(oldp)==1L)
          old <- fromJSON(oldp[[1]],simplifyVector=FALSE)
          new <- fromJSON('migrated/workflow05_manifest.json',simplifyVector=FALSE)
          fields <- c('workflow','purpose','records','dictionary_sha256','dictionary_rows','expanded_terms','species_matches','coded_records','none_records')
          for(nm in fields) stopifnot(identical(old[[nm]],new[[nm]]))
          oldrules <- old$rules
          for(nm in names(oldrules)) stopifnot(identical(oldrules[[nm]],new$rules[[nm]]))
          stopifnot(
            identical(new$entity_value,'farmed species'),
            identical(new$generic_code,'UNSPEC_SALMON'),
            identical(new$none_code,'NONE')
          )
          cat('PASS: historical W05 manifest contract retained with additive config provenance; reconstructed fixture input SHA intentionally excluded\n')
          RS
          echo 'PASS: W05 user-input migration is functionally identical to validated 19,407-record baseline'
