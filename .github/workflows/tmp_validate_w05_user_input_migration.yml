name: TEMP validate W05 legacy input cleanup

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - '.github/workflows/tmp_validate_w05_user_input_migration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 0
      - name: Confirm legacy W05 config copies are no longer referenced
        shell: bash
        run: |
          set -euo pipefail
          test -f config/deterministic_concepts.csv
          test -f config/species_dictionary.csv
          refs="$(grep -RIn --exclude='tmp_validate_w05_user_input_migration.yml' --exclude-dir='.git' -E 'config/(deterministic_concepts|species_dictionary)\.csv' . || true)"
          if [ -n "$refs" ]; then
            echo "$refs"
            echo "FAIL: legacy W05 config paths are still referenced" >&2
            exit 1
          fi
          echo "PASS: legacy W05 config copies are unreferenced and safe to remove"
