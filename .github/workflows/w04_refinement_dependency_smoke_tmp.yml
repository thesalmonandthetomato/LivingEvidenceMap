name: W04 refinement dependency smoke test (temporary)
on:
  push:
    branches:
      - fix/w04-refinement-dependencies-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install native dependencies for HTTP and TLS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev pkg-config ca-certificates
          pkg-config --modversion libcurl
          pkg-config --modversion openssl
      - name: Install and verify one-call R dependencies
        shell: Rscript {0}
        run: |
          required <- c("jsonlite", "httr2", "digest")
          install.packages(required, dependencies = c("Depends", "Imports", "LinkingTo"),
                           quiet = FALSE)
          failures <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
          if (length(failures)) stop("Required R packages failed to load: ",
                                     paste(failures, collapse = ", "), call. = FALSE)
          for (package in required) {
            suppressPackageStartupMessages(library(package, character.only = TRUE))
            message("Verified R package: ", package,
                    " ", as.character(packageVersion(package)))
          }
      - name: No-API syntax and request contract smoke test
        shell: Rscript {0}
        run: |
          source_file <- "scripts/updater/workflow_04_refine_prompt.R"
          invisible(parse(file = source_file))
          stopifnot(all(c("jsonlite", "httr2", "digest") %in%
                        rownames(installed.packages())))
          prompt <- "Include relevant aquaculture studies."
          cases <- list(list(record_id = "fixture1", model_decision = "uncertain",
                             human_decision = "include"))
          sha <- digest::digest(charToRaw(enc2utf8(prompt)), algo = "sha256",
                                serialize = FALSE)
          request <- list(schema = "lem-w04-prompt-refinement-request-v1",
                          review_id = "smoke-test", source_run_id = "1234",
                          prompt_sha256 = sha, original_prompt = prompt,
                          cases = cases, user_note = "")
          encoded <- jsonlite::toJSON(request, auto_unbox = TRUE, null = "null")
          decoded <- jsonlite::fromJSON(encoded, simplifyVector = FALSE)
          stopifnot(identical(decoded$schema, request$schema),
                    identical(decoded$original_prompt, prompt),
                    identical(decoded$cases[[1]]$human_decision, "include"),
                    identical(digest::digest(enc2utf8(decoded$original_prompt),
                                             algo = "sha256", serialize = FALSE), sha))
          mock_response <- '{"proposed_prompt":"Include aquaculture studies with explicit farming context.","explanation":"Clarifies farming context."}'
          parsed <- jsonlite::fromJSON(mock_response, simplifyVector = FALSE)
          stopifnot(nzchar(parsed$proposed_prompt), nzchar(parsed$explanation))
          cat("PASS: package loads, script parses, mock request/response contract; no network API calls made.\n")
