name: Test targeted abstract recovery

on:
  push:
    branches: [updater-workflow-04-relevance-screening]
    paths:
      - 'scripts/updater/test_targeted_abstract_recovery.py'
      - '.github/workflows/test_targeted_abstract_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-provider:
    strategy:
      fail-fast: false
      matrix:
        provider:
          - europepmc
          - sciencedirect
          - cabdirect
          - ncbi
          - wiley
          - doaj
          - bibsys
          - ecite
          - pubag
          - core
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-04-relevance-screening
          path: workflow

      - name: Check out canonical store
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          lfs: true
          fetch-depth: 1
          path: canonical

      - name: Test 5 records
        run: |
          mkdir -p "out/${{ matrix.provider }}"
          python workflow/scripts/updater/test_targeted_abstract_recovery.py \
            --records canonical/data/canonical/current/repair/records.jsonl \
            --provider "${{ matrix.provider }}" \
            --limit 5 \
            --outdir "out/${{ matrix.provider }}"

      - name: Upload provider results
        uses: actions/upload-artifact@v4
        with:
          name: abstract-test-${{ matrix.provider }}-${{ github.run_id }}
          path: out/${{ matrix.provider }}/
          if-no-files-found: error
          retention-days: 30
