name: Temporary W03 handoff validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w03-handoff-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify W03 inherited first-run flag
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'install.packages("jsonlite")'
          Rscript scripts/updater/workflow_validate_first_run.R --stage W03 --first-run true
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('.github/workflows/workflow_02_resume_after_human_review.yml').read_text()
          assert '-f first_run="$FIRST_RUN"' in s
          assert 'FIRST_RUN="$(Rscript' in s
          print('PASS: W03 handoff uses W00 provenance')
          PY
