name: Workflow 05 - deterministic species-only rerun

on:
  push:
    branches: [workflow01-final-architecture]
    paths:
      - 'docs/workflow05/.run_species_only_rerun'

permissions:
  contents: read
  actions: read

jobs:
  species:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("dplyr","readr","jsonlite"))

      - name: Restore previous corrected W05 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: workflow05-species-rule-delta-36234132889
          path: prior_checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36234132889

      - name: Locate exact records and previous deterministic summary
        shell: bash
        run: |
          set -euo pipefail
          REC="$(find prior_checkpoint -type f -path '*/workflow05_corrected/records_for_annotation.csv' -print -quit)"
          OLD="$(find prior_checkpoint -type f -path '*/workflow05_corrected/deterministic_annotation_summary.csv' -print -quit)"
          if [ -z "$REC" ]; then REC="$(find prior_checkpoint -type f -name records_for_annotation.csv -print -quit)"; fi
          if [ -z "$OLD" ]; then OLD="$(find prior_checkpoint -type f -name deterministic_annotation_summary.csv -print -quit)"; fi
          test -n "$REC"; test -n "$OLD"
          cp "$REC" records_for_annotation.csv
          cp "$OLD" old_deterministic_annotation_summary.csv
          Rscript -e 'r<-readr::read_csv("records_for_annotation.csv",show_col_types=FALSE);o<-readr::read_csv("old_deterministic_annotation_summary.csv",show_col_types=FALSE);stopifnot(nrow(r)==19407L,nrow(o)==19407L,!anyDuplicated(r$record_id),!anyDuplicated(o$record_id));cat("PASS: exact 19,407-record species input restored\n")'

      - name: Run deterministic species extractor only
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/reporting/workflow05_species_only_rerun.R \
            --records records_for_annotation.csv \
            --old old_deterministic_annotation_summary.csv \
            --dictionary config/species_dictionary.csv \
            --output-dir outputs/workflow05_species_only_rerun

      - name: Validate species-only outputs
        shell: Rscript {0}
        run: |
          library(jsonlite)
          s <- fromJSON("outputs/workflow05_species_only_rerun/summary.json")
          c <- read.csv("outputs/workflow05_species_only_rerun/species_record_counts.csv")
          d <- read.csv("outputs/workflow05_species_only_rerun/species_delta_all.csv")
          stopifnot(
            s$records == 19407L,
            nrow(d) == 19407L,
            all(c$farmed_species_id %in% c("SAL_SALAR","ONC_MYKISS","ONC_TSHAWYTSCHA","ONC_KISUTCH","ONC_NERKA","ONC_KETA","ONC_GORBUSCHA","ONC_MASOU","UNSPEC_SALMON"))
          )
          cat("PASS: deterministic species-only rerun validated\n")

      - name: Upload species-only rerun
        uses: actions/upload-artifact@v4
        with:
          name: workflow05-species-only-rerun-${{ github.run_id }}
          path: outputs/workflow05_species_only_rerun/
          retention-days: 90
          if-no-files-found: error
