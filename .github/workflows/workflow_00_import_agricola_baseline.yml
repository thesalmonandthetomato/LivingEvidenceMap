name: Workflow 00 import AGRICOLA baseline

on:
  push:
    branches:
      - workflow00-search-orchestrator
    paths:
      - .github/workflows/workflow_00_import_agricola_baseline.yml

permissions:
  contents: write
  actions: read

jobs:
  import-agricola-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4
        with:
          ref: workflow00-search-orchestrator
          fetch-depth: 0

      - name: Download validated 20 September AGRICOLA full harvest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf imported_agricola
          mkdir -p imported_agricola
          gh run download 35499560948 --repo "$GITHUB_REPOSITORY" \
            --name agricola-full-search-35499560948 \
            --dir imported_agricola

      - name: Validate imported harvest provenance and completeness
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find imported_agricola -type f -name manifest.json | head -n 1)"
          validation="$(find imported_agricola -type f -name validation.json | head -n 1)"
          test -n "$manifest"
          test -n "$validation"
          grep -q '"status": "success"' "$manifest"
          grep -q '"total_results_reported_first_page": 2744' "$manifest"
          grep -q '"records_retrieved": 2744' "$manifest"
          grep -q '"unique_source_ids": 2744' "$validation"
          grep -q '"duplicate_source_ids_n": 0' "$validation"
          grep -q '"count_matches_first_page_total": true' "$validation"
          grep -q '"non_agricola_source_codes": \[\]' "$validation"
          printf '%s\n' "Validated original run 35499560948: 2744 AGRICOLA records, complete, no duplicate source IDs."

      - name: Write imported full-search provenance record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/search_record/full_search
          cat > docs/search_record/full_search/2026-09-20_agricola_imported_baseline_run-35499560948.json <<'JSON'
          {
            "schema_version": "1.0-import",
            "source": "agricola",
            "run_type": "full",
            "provenance_status": "imported_validated_legacy_full_search",
            "search_executed_at_utc": "2026-09-20T08:27:56Z",
            "original_workflow_run_id": "35499560948",
            "original_artifact_name": "agricola-full-search-35499560948",
            "original_artifact_id": "10600908896",
            "original_artifact_sha256": "097aee50b73d984054f51235713ee81bc0f2f634d4f71f83c6a40d449a4d625e",
            "search_string": "SRC:AGR AND TITLE_ABS:((salmon OR salmonid* OR Salmo OR Oncorhynchus OR \"rainbow trout\") AND (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*))",
            "reported_search_results": 2744,
            "successfully_downloaded_results": 2744,
            "complete_download": true,
            "canonical_json_modified": false,
            "note": "Imported into Workflow 00 baseline structure on 2026-09-22 because Europe PMC AGRICOLA pagination was returning malformed/empty responses during the fresh baseline refresh. This record preserves the original 2026-09-20 search date and provenance."
          }
          JSON
          cat > docs/search_record/full_search/2026-09-20_agricola_imported_baseline_run-35499560948.md <<'MD'
          # Search record: AGRICOLA

          - **Original search date (UTC):** 2026-09-20 08:27:56
          - **Run type:** full
          - **Source:** AGRICOLA via Europe PMC
          - **Original workflow run:** 35499560948
          - **Original artifact:** agricola-full-search-35499560948
          - **Original artifact ID:** 10600908896
          - **Results reported by source:** 2,744
          - **Results successfully downloaded:** 2,744
          - **Complete download:** yes
          - **Duplicate source IDs:** 0
          - **Canonical JSON modified:** no
          - **Provenance:** validated 20 September full harvest imported into the Workflow 00 baseline structure on 22 September because the live Europe PMC AGRICOLA endpoint was returning malformed/empty pagination responses.

          ## Search string

          ```text
          SRC:AGR AND TITLE_ABS:((salmon OR salmonid* OR Salmo OR Oncorhynchus OR "rainbow trout") AND (farm* OR cage* OR pens OR penned OR pen OR aquacultur* OR commercial*))
          ```
          MD

      - name: Commit provenance record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search_record/full_search/2026-09-20_agricola_imported_baseline_run-35499560948.*
          if git diff --cached --quiet; then
            echo "AGRICOLA provenance record already present."
          else
            git commit -m "Archive validated AGRICOLA 2026-09-20 baseline"
            git push origin HEAD:workflow00-search-orchestrator
          fi

      - name: Upload imported harvest using Workflow 00 artifact naming
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-agricola-harvest-${{ github.run_id }}
          path: imported_agricola/
          if-no-files-found: error
          retention-days: 90
