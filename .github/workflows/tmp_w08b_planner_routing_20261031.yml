name: TEMP W08b DOI and provider-switch planner validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_planner_routing_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - name: Test DOI change, provider switch, restart idempotence
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("test_routing")
          d<-data.frame(record_id=c("doi_changed","doi_same","provider_switched","unchanged"),
            lens_id=c("","","","L3"),openalex_id=c("","","W123",""),
            doi=c("10.1000/new","10.1000/same","",""),
            preferred_route=c("lens_doi_lookup","lens_doi_lookup","openalex","lens"),
            identifier_conflict=FALSE)
          write.csv(d,"test_routing/crosswalk.csv",row.names=FALSE)
          to_line<-function(...)toJSON(list(...),auto_unbox=TRUE)
          writeLines(c(
            to_line(record_id="doi_changed",provider="lens",status="complete",update_id="2026-11",doi="10.1000/old"),
            to_line(record_id="doi_same",provider="lens",status="complete",update_id="2026-11",doi="10.1000/same"),
            to_line(record_id="provider_switched",provider="lens",status="complete",update_id="2026-11",lens_id="L2"),
            to_line(record_id="unchanged",provider="lens",status="complete",update_id="2026-10",lens_id="L3")
          ),"test_routing/lens_seed_status.jsonl")
          writeLines("", "test_routing/openalex_seed_status.jsonl")
          args<-c("scripts/workflow08b/plan_monthly.R","test_routing/crosswalk.csv","test_routing","2026-11","test_routing/out")
          stopifnot(system2("Rscript",args)==0L)
          x<-read.csv("test_routing/out/monthly_seed_plan.csv",stringsAsFactors=FALSE)
          q<-function(id)x[x$record_id==id,,drop=FALSE]
          stopifnot(q("doi_changed")$identifier_changed,q("doi_changed")$provider_check_required,
            !q("doi_same")$provider_check_required,
            q("provider_switched")$provider_changed,q("provider_switched")$provider_check_required,
            q("unchanged")$provider_check_required)
          cat("PASS DOI change/provider switch/same-update idempotence\n")
