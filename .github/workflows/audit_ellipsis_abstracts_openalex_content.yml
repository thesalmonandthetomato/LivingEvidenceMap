name: Audit ellipsis abstracts for OpenAlex full text

on:
  workflow_dispatch:
  push:
    branches:
      - updater-workflow-04-relevance-screening
    paths:
      - '.github/workflows/audit_ellipsis_abstracts_openalex_content.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4
        with:
          ref: updater-workflow-04-relevance-screening

      - name: Check out canonical store
        uses: actions/checkout@v4
        with:
          ref: canonical-repair-store
          path: canonical_store
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit ellipsis abstracts
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          mkdir -p testdata/ellipsis_abstract_audit
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          records_path = Path('canonical_store/data/canonical/current/repair/records.jsonl')
          out_path = Path('testdata/ellipsis_abstract_audit/audit.jsonl')
          report_path = Path('testdata/ellipsis_abstract_audit/report.json')
          key = os.environ['OPENALEX_API_KEY']

          # Detect actual ellipsis characters and three-or-more literal periods.
          ellipsis_re = re.compile(r'(?:\u2026|\.{3,})')

          def get_nested(d, *path):
              cur = d
              for p in path:
                  if not isinstance(cur, dict): return None
                  cur = cur.get(p)
              return cur

          def abstract_of(r):
              for v in (get_nested(r,'canonical','abstract'), r.get('abstract'), get_nested(r,'raw','abstract')):
                  if isinstance(v,str) and v.strip(): return v.strip()
              return None

          def doi_of(r):
              vals = [get_nested(r,'canonical','doi'), r.get('doi'), get_nested(r,'raw','doi')]
              ids = r.get('identifiers')
              if isinstance(ids,dict): vals += [ids.get('doi'), ids.get('DOI')]
              for v in vals:
                  if not isinstance(v,str): continue
                  s=v.strip()
                  s=re.sub(r'^https?://(?:dx\.)?doi\.org/','',s,flags=re.I)
                  s=re.sub(r'^doi:\s*','',s,flags=re.I).strip()
                  if s.lower().startswith('10.') and '/' in s: return s
              return None

          candidates=[]
          total=0
          with records_path.open(encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  total += 1
                  r=json.loads(line)
                  a=abstract_of(r)
                  if a and ellipsis_re.search(a):
                      candidates.append((r,a,doi_of(r)))

          stats={
            'input_record_count': total,
            'abstracts_with_ellipsis_count': len(candidates),
            'ellipsis_with_doi_count': sum(1 for _,_,d in candidates if d),
            'ellipsis_without_doi_count': sum(1 for _,_,d in candidates if not d),
            'openalex_matched_count': 0,
            'grobid_xml_available_count': 0,
            'pdf_available_count': 0,
            'any_openalex_content_count': 0,
            'no_openalex_content_count': 0,
            'openalex_unmatched_or_error_count': 0,
            'canonical_mutated': False
          }

          with out_path.open('w',encoding='utf-8') as out:
              for i,(r,a,doi) in enumerate(candidates,1):
                  row={
                    'lens_id': r.get('lens_id') or get_nested(r,'canonical','lens_id'),
                    'doi': doi,
                    'abstract_length': len(a),
                    'ellipsis_occurrences': len(ellipsis_re.findall(a)),
                    'openalex_id': None,
                    'has_grobid_xml': False,
                    'has_pdf': False,
                    'has_any_content': False,
                    'status': 'no_doi' if not doi else None
                  }
                  if doi:
                      url='https://api.openalex.org/works/https://doi.org/'+urllib.parse.quote(doi,safe='')+'?api_key='+urllib.parse.quote(key)
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'LivingEvidenceMap/ellipsis-audit'})
                          with urllib.request.urlopen(req,timeout=30) as resp:
                              w=json.load(resp)
                          stats['openalex_matched_count'] += 1
                          hc=w.get('has_content') or {}
                          has_g=bool(hc.get('grobid_xml'))
                          has_p=bool(hc.get('pdf'))
                          row.update(openalex_id=w.get('id'),has_grobid_xml=has_g,has_pdf=has_p,has_any_content=(has_g or has_p),status='matched')
                          if has_g: stats['grobid_xml_available_count'] += 1
                          if has_p: stats['pdf_available_count'] += 1
                          if has_g or has_p: stats['any_openalex_content_count'] += 1
                          else: stats['no_openalex_content_count'] += 1
                      except Exception as e:
                          row['status']='openalex_unmatched_or_error'
                          row['error']=str(e)[:500]
                          stats['openalex_unmatched_or_error_count'] += 1
                      time.sleep(0.02)
                  out.write(json.dumps(row,ensure_ascii=False)+'\n')

          report_path.write_text(json.dumps(stats,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(stats,indent=2))
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: ellipsis-abstract-openalex-audit-${{ github.run_id }}
          path: testdata/ellipsis_abstract_audit/
          if-no-files-found: error
          retention-days: 30
