name: TEMP W08b final staged-orchestration and zero-review validation
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_w08b_final_orchestration_validation_20261031.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R parser
        shell: Rscript {0}
        run: install.packages(c("jsonlite","yaml","httr2"))
      - name: R/YAML parse, activation staging and W08 dispatch contracts
        shell: Rscript {0}
        run: |
          library(jsonlite)
          library(yaml)
          scripts<-c("check_activation.R","route_after_w08.R",
            "record_routing_event.R","mark_supplemental_w01.R","archive_empty_review.R",
            "resolve_monthly_release.R","plan_identifier_checks.R")
          for(s in scripts)stopifnot(is.expression(parse(file=file.path("scripts/workflow08b",s))))
          wf<-c("workflow_08_production.yml","workflow_08_resume_after_shiny.yml",
            "workflow08b_monthly_dispatch.yml","workflow08b_monthly_discovery.yml",
            "workflow08b_monthly_candidates.yml","workflow08b_publish_shiny.yml",
            "workflow08b_export_decisions.yml","workflow08b_canonical_to_w02.yml")
          for(s in wf){
            y<-yaml.load_file(file.path(".github/workflows",s))
            stopifnot(is.list(y$jobs),length(y$jobs)>0L)
          }
          cfg<-fromJSON("docs/workflow08b/monthly_activation.json")
          stopifnot(cfg$mode=="staged",!cfg$automatically_route_w08,
            !cfg$automatically_run_provider_queries)
          stopifnot(system2("Rscript",c("scripts/workflow08b/check_activation.R",
            "docs/current_run/current_run_status.json",
            "docs/workflow08b/monthly_activation.json","test_staged_route.json"))==0L)
          decision<-fromJSON("test_staged_route.json")
          stopifnot(decision$route=="existing_w09",!decision$provider_execution_requested)
          for(s in wf[1:2]){
            txt<-readLines(file.path(".github/workflows",s))
            stopifnot(any(grepl("check_activation.R",txt,fixed=TRUE)),
              any(grepl("gh workflow run report_workflow09_figures.yml",txt,fixed=TRUE)),
              any(grepl("gh workflow run workflow08b_monthly_dispatch.yml",txt,fixed=TRUE)))
          }
          cat("PASS: eight workflows parse; October routing unchanged; November activation staged explicitly\n")
      - name: State machine first generation, no-new and supplemental, test marker
        shell: Rscript {0}
        run: |
          library(jsonlite)
          dir.create("test_auto")
          release<-list(update_month="2026-11",update_id="w00-run-555",
            w08_run_id="555",w01_run_id="444",
            w08_canonical_sha256=paste(rep("a",64),collapse=""))
          writeLines(toJSON(release,auto_unbox=TRUE),"test_auto/release.json")
          command<-function(script,args,success=TRUE){
            st<-suppressWarnings(system2("Rscript",c(
              file.path("scripts/workflow08b",script),args),
              stdout=FALSE,stderr=FALSE))
            if(success)stopifnot(st==0L)else stopifnot(st!=0L)
          }
          original<-"test_auto/release.json"
          state<-"test_auto/state.json"
          command("record_routing_event.R",c("init",original,state))
          command("record_routing_event.R",c("init",original,state),FALSE)
          command("record_routing_event.R",c("candidates_started",original,state))
          command("record_routing_event.R",c("no_supplemental",original,state))
          command("route_after_w08.R",c(original,
            "docs/workflow08b/monthly_checkpoint_registry.json",state,
            "original","test_auto/route.json"))
          x<-fromJSON("test_auto/route.json")
          stopifnot(x$transition=="publish_final_w09_w10",!x$dispatch_w08b,x$dispatch_w09)
          command("record_routing_event.R",c("completed",original,state))
          command("record_routing_event.R",c("completed",original,state),FALSE)
          # Fresh independent generation for a supplemental W01 with a published pointer.
          state2<-"test_auto/state2.json"
          command("record_routing_event.R",c("init",original,state2))
          command("record_routing_event.R",c("candidates_started",original,state2))
          w01file<-"docs/deduplication/zenodo/run-999999999999.json"
          writeLines(toJSON(list(status="published"),auto_unbox=TRUE),w01file)
          on.exit(unlink(w01file),add=TRUE)
          status<-list(update_id="w00-run-555",
            search=list(search_date="2026-11-19"),
            workflow_runs=list(W08="555",W01="999999999999"))
          writeLines(toJSON(status,auto_unbox=TRUE),"test_auto/status.json")
          command("mark_supplemental_w01.R",c(
            "test_auto/status.json",state2,"999999999999"))
          s<-fromJSON(state2)
          stopifnot(s$stage=="supplemental_w01_started",
            s$supplemental_w01_run_id=="999999999999")
          release$w08_run_id<-"556"
          release$w01_run_id<-"999999999999"
          release$w08_canonical_sha256<-paste(rep("b",64),collapse="")
          writeLines(toJSON(release,auto_unbox=TRUE),"test_auto/final.json")
          command("route_after_w08.R",c("test_auto/final.json",
            "docs/workflow08b/monthly_checkpoint_registry.json",state2,
            "supplemental","test_auto/final_route.json"))
          last<-fromJSON("test_auto/final_route.json")
          stopifnot(last$transition=="publish_final_w09_w10",
            last$dispatch_w09,!last$dispatch_w08b)
          command("record_routing_event.R",c("completed","test_auto/final.json",state2))
          command("route_after_w08.R",c("test_auto/final.json",
            "docs/workflow08b/monthly_checkpoint_registry.json",state2,
            "supplemental","test_auto/repeat.json"))
          stopifnot(fromJSON("test_auto/repeat.json")$transition=="already_published")
          cat("PASS: no duplicate citation generation, zero-candidate W09 bypass, source-verified supplemental W01 and one final W09\n")
      - name: Zero-review manifest is validated without Zenodo or invented human decisions
        env:
          W08B_TEST_EMPTY_REVIEW: '1'
        shell: Rscript {0}
        run: |
          library(jsonlite)
          hash<-paste(rep("c",64),collapse="")
          q<-list(schema="w08b-human-review-queue-v1",
            batch_id=paste0("w08b-no-human-review-",substr(hash,1,12)),
            queue_sha256=hash,case_count=0L,status="no_review_required")
          writeLines(toJSON(q,auto_unbox=TRUE),"test_auto/zero_review.json")
          stopifnot(system2("Rscript",c("scripts/workflow08b/archive_empty_review.R",
            "test_auto/zero_review.json","test_auto/empty_result.json"))==0L)
          z<-fromJSON("test_auto/empty_result.json")
          stopifnot(z$status=="fixture_only_no_zenodo_upload",
            z$manifest$cases==0L,z$manifest$decision_count==0L,
            z$manifest$no_human_review_required)
          cat("PASS: zero-review export schema contains zero human decisions and cannot publish a fixture\n")
