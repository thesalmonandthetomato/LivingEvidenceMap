name: TEMP W00 salmon query regression
# rerun after fixing legacy Boolean grouping
on:
  push:
    branches:
      - production-minimal
    paths:
      - .github/workflows/w00-salmon-regression-temporary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      OPENAI_API_KEY: ""
      ZENODO_ACCESS_TOKEN: ""
      OPENALEX_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install offline JSON parser
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Run offline query-regression check
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_compare_salmon_queries.R
