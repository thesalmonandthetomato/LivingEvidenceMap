name: TEMP authoritative canonical missing abstracts count
on:
  push:
    branches: [workflow01-final-architecture]
    paths: ['.github/workflows/tmp_count_canonical_missing_abstracts_20261031.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite","httr2","digest"))'
      - name: Restore latest authoritative W08 canonical JSONL
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'x<-read.csv("docs/workflow08/zenodo_registry.csv",stringsAsFactors=FALSE);z<-x[x$status=="authoritative",,drop=FALSE];stopifnot(nrow(z)==1);writeLines(sprintf("docs/workflow08/zenodo/run-%s.json",z$source_run_id[[1]]),"pointer.txt")'
          Rscript scripts/updater/workflow_10_restore_canonical_from_zenodo.R --pointer "$(cat pointer.txt)" --output "$RUNNER_TEMP/canonical.jsonl"
      - name: Count truly absent canonical abstracts
        shell: Rscript {0}
        run: |
          library(jsonlite)
          f<-file(file.path(Sys.getenv("RUNNER_TEMP"),"canonical.jsonl"),"rt")
          on.exit(close(f),add=TRUE)
          n<-0L;missing<-0L;whitespace<-0L;no_field<-0L
          repeat {
            lines<-readLines(f,n=1000L,warn=FALSE)
            if(!length(lines)) break
            for(line in lines){
              if(!nzchar(trimws(line)))next
              x<-fromJSON(line,simplifyVector=FALSE)
              n<-n+1L
              a<-x$canonical$abstract
              if(is.null(a)||!length(a)) {
                missing<-missing+1L;no_field<-no_field+1L
              } else {
                vals<-trimws(as.character(unlist(a,use.names=FALSE)))
                vals<-vals[!is.na(vals)]
                if(!length(vals)||!any(nzchar(vals))){
                  missing<-missing+1L;whitespace<-whitespace+1L
                }
              }
            }
          }
          pointer<-fromJSON(readLines("pointer.txt",warn=FALSE)[[1]],simplifyVector=FALSE)
          stopifnot(n==as.integer(pointer$canonical_records))
          result<-list(canonical_records=n,abstract_missing=missing,
            abstract_present=n-missing,
            percent_missing=round(100*missing/n,3),
            absent_or_null=no_field,blank_or_whitespace=whitespace,
            source_run=pointer$source_github_run_id,
            canonical_sha256=pointer$final_canonical_jsonl_sha256)
          writeLines(toJSON(result,auto_unbox=TRUE,pretty=TRUE),"missing_abstracts_count.json")
          cat("CANONICAL_ABSTRACT_COUNT_RESULT\n")
          cat(readLines("missing_abstracts_count.json"),sep="\n")
      - uses: actions/upload-artifact@v4
        with:
          name: missing-abstracts-count
          path: missing_abstracts_count.json
          retention-days: 7
