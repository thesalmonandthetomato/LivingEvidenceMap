name: Publish W04 validation screening queue to Shiny

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/workflow04/run_shiny_validation_publish.txt'
  workflow_dispatch:
    inputs:
      lean_pointer_path:
        description: 'Authoritative current post-W02 lean canonical pointer'
        required: true
        default: 'docs/compaction/zenodo/run-36166883249.json'
        type: string
      workflow03_pointer_path:
        description: 'Authoritative current Workflow 03 pointer'
        required: true
        default: 'docs/publication_status/zenodo/run-36172718538.json'
        type: string
      sample_size:
        description: 'Number of W04-eligible records to sample'
        required: true
        default: '500'
        type: string
      randomisation_seed:
        description: 'Deterministic randomisation seed'
        required: true
        default: 'w04-validation-v1'
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEM_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LEM_GOOGLE_SERVICE_ACCOUNT_JSON }}
      LEM_GOOGLE_SHEET_ID: '1x00D0idQz558dKp3gB0z-mcUBVrw8jjllqGAZdqYlcs'
      QUEUE_TAB: 'queue_w04_validation_active'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest','googlesheets4','httr2'))

      - name: Parse W04 validation queue builder
        shell: Rscript {0}
        run: |
          parse(file='scripts/updater/workflow_04_build_human_validation_queue.R')
          parse(file='scripts/updater/workflow_03_restore_lean_checkpoint.R')
          parse(file='scripts/updater/workflow_03_restore_state_from_zenodo.R')
          cat('PASS: W04 validation publisher scripts parse\n')

      - name: Restore authoritative W04 screening inputs
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          LEAN_POINTER: ${{ inputs.lean_pointer_path || 'docs/compaction/zenodo/run-36166883249.json' }}
          W03_POINTER: ${{ inputs.workflow03_pointer_path || 'docs/publication_status/zenodo/run-36172718538.json' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/w04_validation
          mkdir -p inputs/w04_validation/canonical inputs/w04_validation/w03

          Rscript scripts/updater/workflow_03_restore_lean_checkpoint.R \
            --pointer "$LEAN_POINTER" \
            --output-dir inputs/w04_validation/canonical

          Rscript scripts/updater/workflow_03_restore_state_from_zenodo.R \
            --pointer "$W03_POINTER" \
            --output-dir inputs/w04_validation/w03

          CAN="$(find inputs/w04_validation/canonical -type f -name canonical_lean.jsonl -print -quit)"
          STA="$(find inputs/w04_validation/w03 -type f -name publication_status.jsonl -print -quit)"
          test -n "$CAN"
          test -n "$STA"
          cp "$CAN" inputs/w04_validation/canonical_lean.jsonl
          cp "$STA" inputs/w04_validation/publication_status.jsonl

      - name: Build deterministic randomised W04 validation queue
        env:
          SAMPLE_SIZE: ${{ inputs.sample_size || '500' }}
          RANDOM_SEED: ${{ inputs.randomisation_seed || 'w04-validation-2026-10-01-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_04_build_human_validation_queue.R \
            --canonical inputs/w04_validation/canonical_lean.jsonl \
            --workflow03-status inputs/w04_validation/publication_status.jsonl \
            --output-dir outputs/w04_validation \
            --sample-size "$SAMPLE_SIZE" \
            --seed "$RANDOM_SEED"

      - name: Prepare Google credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$LEM_GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/lem-google-service-account.json"
          chmod 600 "$RUNNER_TEMP/lem-google-service-account.json"
          echo "LEM_GOOGLE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/lem-google-service-account.json" >> "$GITHUB_ENV"

      - name: Publish validated W04 queue to private Sheet
        shell: Rscript {0}
        run: |
          suppressPackageStartupMessages({
            library(googlesheets4)
            library(jsonlite)
            library(digest)
          })

          queue_path <- 'outputs/w04_validation/workflow04_validation_queue.jsonl'
          manifest_path <- 'outputs/w04_validation/workflow04_validation_queue_manifest.json'
          ss <- Sys.getenv('LEM_GOOGLE_SHEET_ID')
          tab <- Sys.getenv('QUEUE_TAB')

          lines <- readLines(queue_path,warn=FALSE,encoding='UTF-8')
          lines <- lines[nzchar(trimws(lines))]
          if(!length(lines)) stop('W04 validation queue is empty')

          manifest <- fromJSON(manifest_path,simplifyVector=FALSE)
          actual_sha <- digest(file=queue_path,algo='sha256',serialize=FALSE)
          if(!identical(actual_sha,as.character(manifest$queue_sha256))) stop('W04 queue SHA mismatch')

          cases <- lapply(lines,fromJSON,simplifyVector=FALSE)
          ids <- vapply(cases,function(z)as.character(z$review_case_id),character(1))
          if(any(!nzchar(ids))||anyDuplicated(ids)) stop('W04 queue has missing/duplicate case IDs')

          batch_id <- paste0(
            'w04-validation-',
            substr(actual_sha,1,12)
          )

          highlight <- read.csv(
            'user_input/workflow04_screening_highlight_terms.csv',
            stringsAsFactors=FALSE,
            na.strings=''
          )
          if(!all(c('words_for_include','words_for_exclude') %in% names(highlight))) {
            stop('W04 highlight CSV missing required columns')
          }
          include_terms <- unique(trimws(highlight$words_for_include[!is.na(highlight$words_for_include) & nzchar(trimws(highlight$words_for_include))]))
          exclude_terms <- unique(trimws(highlight$words_for_exclude[!is.na(highlight$words_for_exclude) & nzchar(trimws(highlight$words_for_exclude))]))
          if(!length(include_terms)) stop('W04 include highlight vocabulary is empty')
          include_json <- toJSON(include_terms,auto_unbox=FALSE)
          exclude_json <- toJSON(exclude_terms,auto_unbox=FALSE)

          payload <- data.frame(
            batch_id=rep(batch_id,length(lines)),
            queue_sha256=rep(actual_sha,length(lines)),
            case_index=as.character(seq_along(lines)),
            review_case_id=ids,
            case_json=lines,
            highlight_include_json=c(include_json,rep('',max(0,length(lines)-1L))),
            highlight_exclude_json=c(exclude_json,rep('',max(0,length(lines)-1L))),
            stringsAsFactors=FALSE
          )

          gs4_auth(path=Sys.getenv('LEM_GOOGLE_SERVICE_ACCOUNT_JSON'),cache=FALSE)
          tabs <- sheet_names(ss)
          if(!tab %in% tabs) sheet_add(ss,sheet=tab)
          sheet_write(payload,ss=ss,sheet=tab)

          verify <- read_sheet(ss,sheet=tab,col_types='c')
          req <- c('batch_id','queue_sha256','case_index','review_case_id','case_json','highlight_include_json','highlight_exclude_json')
          if(!all(req %in% names(verify))) stop('Published W04 queue missing required columns')
          verify <- verify[,req,drop=FALSE]
          if(nrow(verify)!=length(lines)) stop('Published W04 queue row count mismatch')
          if(!identical(as.character(verify$review_case_id),ids)) stop('Published W04 case order mismatch')
          inc <- fromJSON(verify$highlight_include_json[[1L]])
          exc <- fromJSON(verify$highlight_exclude_json[[1L]])
          if(!length(inc) || length(exc)!=15L) stop('Published W04 highlight vocabulary validation failed')
          reconstructed <- paste0(paste(verify$case_json,collapse='\n'),'\n')
          if(!identical(digest(reconstructed,algo='sha256',serialize=FALSE),actual_sha)) stop('Published W04 reconstruction SHA mismatch')

          cat(sprintf('PASS: published W04 validation queue: %d records; batch=%s; sha=%s\n',length(lines),batch_id,actual_sha))

      - name: Upload W04 validation queue artefact
        uses: actions/upload-artifact@v4
        with:
          name: workflow04-human-validation-${{ github.run_id }}
          path: outputs/w04_validation/
          retention-days: 90
          if-no-files-found: error
