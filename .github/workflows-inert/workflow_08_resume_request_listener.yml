name: Workflow 08 - Resume request listener

on:
  push:
    branches:
      - workflow01-final-architecture
    paths:
      - 'docs/shiny_adjudication/w08_resume_requests/*.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.request.outputs.source_run_id }}
      batch_id: ${{ steps.request.outputs.batch_id }}
      queue_sha256: ${{ steps.request.outputs.queue_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow01-final-architecture
          fetch-depth: 2

      - id: request
        name: Resolve exactly one W08 resume request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^docs/shiny_adjudication/w08_resume_requests/.*\.json$' || true)
            test "${#FILES[@]}" -eq 1
            FILE="${FILES[0]}"
          else
            mapfile -t FILES < <(find docs/shiny_adjudication/w08_resume_requests -maxdepth 1 -type f -name '*.json' | sort)
            test "${#FILES[@]}" -ge 1
            FILE="${FILES[-1]}"
          fi
          python3 - "$FILE" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          path,out=sys.argv[1],sys.argv[2]
          with open(path,encoding="utf-8") as fh:
              x=json.load(fh)
          rid=str(x.get("source_run_id",""))
          bid=str(x.get("batch_id",""))
          sha=str(x.get("queue_sha256","")).lower()
          assert re.fullmatch(r"[0-9]+",rid), "invalid source_run_id"
          assert bid, "invalid batch_id"
          assert re.fullmatch(r"[0-9a-f]{64}",sha), "invalid queue_sha256"
          with open(out,"a",encoding="utf-8") as fh:
              fh.write(f"source_run_id={rid}\n")
              fh.write(f"batch_id={bid}\n")
              fh.write(f"queue_sha256={sha}\n")
          PY
          echo "PASS: resolved W08 resume request $FILE"

  resume:
    needs: prepare
    uses: ./.github/workflows/workflow_08_resume_after_shiny.yml
    with:
      source_run_id: ${{ needs.prepare.outputs.source_run_id }}
      batch_id: ${{ needs.prepare.outputs.batch_id }}
      queue_sha256: ${{ needs.prepare.outputs.queue_sha256 }}
    secrets: inherit
