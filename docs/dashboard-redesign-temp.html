<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Living Evidence Map</title>
</head>
<body>
<script>
fetch('dashboard-redesign-temp-base.html?' + Date.now())
  .then(function(r){ if(!r.ok) throw new Error('Could not load dashboard base'); return r.text(); })
  .then(function(html){
    html = html.replace('</head>', '<link rel="stylesheet" href="radial-definition-patch.css"></head>');
    html = html.replace('</body>', '<script src="radial-definition-patch.js"><' + '/script></body>');
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(err){
    document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Dashboard could not be loaded.</p>';
    console.error(err);
  });
</script>
</body>
</html>
